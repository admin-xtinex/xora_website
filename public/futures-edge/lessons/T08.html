above."},{"t":39.5,"d":6.25,"text":"For a short, it flips: the stop-loss goes above, the take-profit below."},{"t":46.4,"d":7.25,"text":"A stop-loss is an order that closes your position if price moves against you, to limit the loss."},{"t":53.9,"d":5.35,"text":"Like a seat belt: it reduces the harm, but it can't prevent the crash."},{"t":59.5,"d":7.25,"text":"Long 0.01 BTC at 60,000, stop at 59,400: loss about 600 × 0.01 = 6 USDT, before fees."},{"t":67.4,"d":6.45,"text":"A take-profit closes your position when price reaches your target, to lock in a gain."},{"t":74.1,"d":5.75,"text":"Like getting off the bus at the stop you planned, not riding on and hoping."},{"t":80.1,"d":6.65,"text":"Take-profit at 61,200: gain about 1,200 × 0.01 = 12 USDT, before fees."},{"t":87.4,"d":7.55,"text":"Two prices matter. The trigger price starts the exit. The execution price is where it actually fills."},{"t":95.2,"d":4.55,"text":"Stop trigger 59,400. In a quick move, it fills at 59,380."},{"t":100,"d":6.75,"text":"Loss: (59,380 − 60,000) × 0.01 = −6.20 USDT. A little worse than planned."},{"t":107.4,"d":5.75,"text":"The risk/reward ratio compares what you could lose with what you could gain."},{"t":113.4,"d":5.05,"text":"Risk: 600 per BTC, or 6 USDT. Reward: 1,200 per BTC, or 12 USDT."},{"t":118.7,"d":5.55,"text":"12 divided by 6 is 2. So this plan is 1 to 2: you risk 1 to aim for 2."},{"t":124.5,"d":5.25,"text":"All before fees. And it says nothing about how likely a win is."},{"t":130.4,"d":5.75,"text":"Scenario one: price rises to 61,200. The take-profit triggers and fills."},{"t":136.4,"d":5.55,"text":"Result: about plus 12 USDT before fees. The trade is closed."},{"t":142.2,"d":6.55,"text":"On many platforms, when one exit fills, the other is cancelled. Check yours."},{"t":149.4,"d":6.35,"text":"Scenario two: price falls. The stop-loss triggers at 59,400 and fills at 59,390."},{"t":156,"d":5.35,"text":"Result: about minus 6.10 USDT before fees. A small, planned loss."},{"t":161.6,"d":5.15,"text":"Losing trades are normal. The stop kept this one small."},{"t":167.4,"d":5.75,"text":"Scenario three: bad news, and price gaps from 59,700 straight to 59,100."},{"t":173.4,"d":4.95,"text":"The stop triggers, but the first available price is 59,100."},{"t":178.6,"d":8.15,"text":"Loss: about 9 USDT, not the 6 you planned. Triggered is not the same as filled at your price."},{"t":187.4,"d":6.75,"text":"A take-profit can also stay unfilled. Price reaches 61,150, just short of your 61,200."},{"t":194.4,"d":5.75,"text":"Then it turns down. No profit was taken, and the gain on screen shrinks."},{"t":200.4,"d":6.35,"text":"Unrealized profit is not money in hand until the position is closed."},{"t":207.4,"d":5.55,"text":"A common mistake: thinking a 1 to 2 plan means you will probably win."},{"t":213.2,"d":7.15,"text":"Risk/reward is about size, not chance. A plan can be 1 to 3 and still lose most of the time."},{"t":220.6,"d":5.15,"text":"Judge the setup separately, and keep WAIT as an option."},{"t":226.4,"d":5.95,"text":"Your turn. Long 0.01 BTC at 60,000. Stop-loss 59,500. Take-profit 61,000."},{"t":232.6,"d":6.25,"text":"Work out the risk, the reward, and the ratio, before fees. Pause if you need to."},{"t":239.1,"d":4.85,"text":"Risk: 500 × 0.01 = 5 USDT. Reward: 1,000 × 0.01 = 10 USDT."},{"t":244.2,"d":4.55,"text":"So it is 1 to 2, before fees. Did you get it?"},{"t":249.4,"d":4.45,"text":"Stop-loss and take-profit help, but they have limits."},{"t":254.1,"d":4.95,"text":"Stops can slip in fast moves, and take-profits may not fill."},{"t":259.3,"d":7.75,"text":"In futures with leverage (T12), the exchange can force-close a losing position. That is liquidation."},{"t":267.3,"d":5.45,"text":"If you can't decide where your stop goes, that's a sign to wait."},{"t":273.4,"d":1.55,"text":"Let's recap."},{"t":275.2,"d":4.55,"text":"Plan entry, stop-loss and take-profit before you enter."},{"t":280,"d":5.45,"text":"Trigger is not execution: stops can slip, and targets can be missed."},{"t":285.7,"d":3.55,"text":"Risk/reward compares sizes, not chances."},{"t":289.5,"d":4.95,"text":"Check yourself: risk 8 USDT, reward 12 USDT. What's the ratio?"},{"t":294.7,"d":3.05,"text":"1 to 1.5: 12 divided by 8."},{"t":298.6,"d":9.15,"text":"Well done! Next up, T09: fees, spread and slippage, the costs that eat small wins."}]},"assetBase":"T08/assets/","assets":{"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-candles.webp":{"mime":"image/webp","w":257,"h":160},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":331,"h":446},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205}},"fontChecks":["400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px s, the other is cancelled. Check yours.\"\n    },\n    {\n      \"t\": 149.4,\n      \"text\": \"Scenario two: price falls. The stop-loss triggers at 59,400 and fills at 59,390.\"\n    },\n    {\n      \"t\": 156,\n      \"text\": \"Result: about minus 6.10 USDT before fees. A small, planned loss.\"\n    },\n    {\n      \"t\": 161.6,\n      \"text\": \"Losing trades are normal. The stop kept this one small.\"\n    },\n    {\n      \"t\": 167.4,\n      \"text\": \"Scenario three: bad news, and price gaps from 59,700 straight to 59,100.\"\n    },\n    {\n      \"t\": 173.4,\n      \"text\": \"The stop triggers, but the first available price is 59,100.\"\n    },\n    {\n      \"t\": 178.6,\n      \"text\": \"Loss: about 9 USDT, not the 6 you planned. Triggered is not the same as filled at your price.\"\n    },\n    {\n      \"t\": 187.4,\n      \"text\": \"A take-profit can also stay unfilled. Price reaches 61,150, just short of your 61,200.\"\n    },\n    {\n      \"t\": 194.4,\n      \"text\": \"Then it turns down. No profit was taken, and the gain on screen shrinks.\"\n    },\n    {\n      \"t\": 200.4,\n      \"text\": \"Unrealized profit is not money in hand until the position is closed.\"\n    },\n    {\n      \"t\": 207.4,\n      \"text\": \"A common mistake: thinking a 1 to 2 plan means you will probably win.\"\n    },\n    {\n      \"t\": 213.2,\n      \"text\": \"Risk/reward is about size, not chance. A plan can be 1 to 3 and still lose most of the time.\"\n    },\n    {\n      \"t\": 220.6,\n      \"text\": \"Judge the setup separately, and keep WAIT as an option.\"\n    },\n    {\n      \"t\": 226.4,\n      \"text\": \"Your turn. Long 0.01 BTC at 60,000. Stop-loss 59,500. Take-profit 61,000.\"\n    },\n    {\n      \"t\": 232.6,\n      \"text\": \"Work out the risk, the reward, and the ratio, before fees. Pause if you need to.\"\n    },\n    {\n      \"t\": 239.1,\n      \"text\": \"Risk: 500 × 0.01 = 5 USDT. Reward: 1,000 × 0.01 = 10 USDT.\"\n    },\n    {\n      \"t\": 244.2,\n      \"text\": \"So it is 1 to 2, before fees. Did you get it?\"\n    },\n    {\n      \"t\": 249.4,\n      \"text\": \"Stop-loss and take-profit help, but they have limits.\"\n    },\n    {\n      \"t\": 254.1,\n      \"text\": \"Stops can slip in fast moves, and take-profits may not fill.\"\n    },\n    {\n      \"t\": 259.3,\n      \"text\": \"In futures with leverage (T12), the exchange can force-close a losing position. That is liquidation.\"\n    },\n    {\n      \"t\": 267.3,\n      \"text\": \"If you can't decide where your stop goes, that's a sign to wait.\"\n    },\n    {\n      \"t\": 273.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 275.2,\n      \"text\": \"Plan entry, stop-loss and take-profit before you enter.\"\n    },\n    {\n      \"t\": 280,\n      \"text\": \"Trigger is not execution: stops can slip, and targets can be missed.\"\n    },\n    {\n      \"t\": 285.7,\n      \"text\": \"Risk/reward compares sizes, not chances.\"\n    },\n    {\n      \"t\": 289.5,\n      \"text\": \"Check yourself: risk 8 USDT, reward 12 USDT. What's the ratio?\"\n    },\n    {\n      \"t\": 294.7,\n      \"text\": \"1 to 1.5: 12 divided by 8.\"\n    },\n    {\n      \"t\": 298.6,\n      \"text\": \"Well done! Next up, T09: fees, spread and slippage, the costs that eat small wins.\"\n    }\n  ]\n}\n","scene-bear.js":"const C = UI.CORNER;\nconst BE_TXT = (x, y, s, col, anchor) => '<text x=\"' + x.toFixed(1) + '\" y=\"' + y.toFixed(1) + '\"' + (anchor ? ' text-anchor=\"' + anchor + '\"' : '') + ' style=\"fill:' + col + ';font-size:24px;font-weight:700\">' + s + '</text>';\nconst BE_CFG = {\n  cls: 'be', kick: 'Scenario 2', kickColor: 'var(--accent)', title: 'Price falls',\n  keys: [[0.2, 60000], [1.0, 60080], [4.6, 59400], [5.0, 59390], [7, 59300], [12, 59420], [18, 59520]], s0: 0.2, s1: 17, closeAt: 5.0, wob: 20,\n  pnlAt: (t, price) => t < 5.0 ? price(Math.floor(t * 6) / 6) : 59390,\n  flash: { key: 's', t: 4.6 }, cancel: { key: 't', t: 7.1 },\n  marks: [\n    { t: 5.0, svg: (X, Y) => '<circle cx=\"' + X(5.0).toFixed(1) + '\" cy=\"' + Y(59390).toFixed(1) + '\" r=\"14\" style=\"fill:var(--accent)\"/>' + BE_TXT(X(5.0) + 20, Y(59400) - 44, 'Filled 59,390', 'var(--accent)') },\n    { t: 7.2, svg: (X, Y) => BE_TXT(1012, Y(61200) - 14, 'Cancelled', 'var(--main)') },\n  ],\n  cards: [\n    { t: 7.1, top: 520, html: '<p class=\"mono\" style=\"margin:0;font-size:30px\">(59,390 − 60,000) × 0.01 = <span style=\"color:var(--accent)\">−6.10 USDT</span></p><p style=\"margin:8px 0 0;font-size:28px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">Closed at stop-loss, before fees.</p>' },\n    { t: 12.7, top: 670, html: '<p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">Losing trades are normal. <span style=\"color:var(--main)\">The stop kept this one small.</span></p>' },\n  ],\n  tutor: { keys: [{ t: 0, x: C.x, y: C.y, s: C.s }], poses: [{ t: 0, pose: 'explain' }, { t: 0.5, pose: 'candles' }, { t: 7.0, pose: 'think' }, { t: 12.6, pose: 'calm' }], says: [] },\n};\nkit.scene('bear', { init(kit) { this.r = UI.scenario(kit, BE_CFG); }, render(t) { this.r(t); } });\n","scene-bull.js":"const C = UI.CORNER;\nconst BU_TXT = (x, y, s, col, anchor) => '<text x=\"' + x.toFixed(1) + '\" y=\"' + y.toFixed(1) + '\"' + (anchor ? ' text-anchor=\"' + anchor + '\"' : '') + ' style=\"fill:' + col + ';font-size:24px;font-weight:700\">' + s + '</text>';\nconst BU_CFG = {\n  cls: 'bu', kick: 'Scenario 1', title: 'Price rises',\n  keys: [[0.2, 60000], [1.4, 59920], [5.0, 61200], [7, 61300], [12, 61420], [19, 61330]], s0: 0.2, s1: 17, closeAt: 5.0, wob: 24, tBelow: true,\n  flash: { key: 't', t: 5.0 }, cancel: { key: 's', t: 12.3 },\n  marks: [\n    { t: 5.0, svg: (X, Y) => '<circle cx=\"' + X(5.0).toFixed(1) + '\" cy=\"' + Y(61200).toFixed(1) + '\" r=\"14\" style=\"fill:var(--main)\"/>' + BU_TXT(X(5.0) - 22, Y(61200) - 18, 'Filled 61,200', 'var(--main)', 'end') },\n    { t: 12.4, svg: (X, Y) => BU_TXT(1012, Y(59400) + 34, 'Cancelled', 'var(--accent)') },\n  ],\n  cards: [\n    { t: 6.5, top: 520, html: '<p class=\"mono\" style=\"margin:0;font-size:30px\">(61,200 − 60,000) × 0.01 = <span style=\"color:var(--main)\">+12.00 USDT</span></p><p style=\"margin:8px 0 0;font-size:28px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">Closed at take-profit, before fees.</p>' },\n    { t: 12.3, top: 670, html: '<p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">When one exit fills, the other is often cancelled. <span style=\"color:var(--main)\">Check your platform.</span></p>' },\n  ],\n  tutor: { keys: [{ t: 0, x: C.x, y: C.y, s: C.s }], poses: [{ t: 0, pose: 'think' }, { t: 0.5, pose: 'candles' }, { t: 5.2, pose: 'cheer' }, { t: 12.3, pose: 'explain' }], says: [] },\n};\nkit.scene('bull', { init(kit) { this.r = UI.scenario(kit, BU_CFG); }, render(t) { this.r(t); } });\n","scene-gap.js":"const C = UI.CORNER;\nconst GA_TXT = (x, y, s, col, anchor) => '<text x=\"' + x.toFixed(1) + '\" y=\"' + y.toFixed(1) + '\"' + (anchor ? ' text-anchor=\"' + anchor + '\"' : '') + ' style=\"fill:' + col + ';font-size:24px;font-weight:700\">' + s + '</text>';\nconst GA_CFG = {\n  cls: 'ga', kick: 'Scenario 3', kickColor: 'var(--accent)', title: 'Price gaps',\n  keys: [[0.2, 60000], [1.0, 60060], [5.4, 59700], [5.6, 59700]], gapAt: 5.6, keys2: [[5.6, 59100], [9, 59060], [14, 59180], [20, 59140]],\n  s0: 0.2, s1: 17, closeAt: 6.0, wob: 18, sPos: 'left',\n  pnlAt: (t, price) => t < 5.6 ? price(Math.floor(t * 6) / 6) : 59100,\n  flash: { key: 's', t: 5.6 }, cancel: { key: 't', t: 7.0 },\n  marks: [\n    { t: 6.0, svg: (X, Y) => '<circle cx=\"' + X(5.6).toFixed(1) + '\" cy=\"' + Y(59100).toFixed(1) + '\" r=\"14\" style=\"fill:var(--accent)\"/>' + GA_TXT(X(5.6) + 24, Y(59100) + 44, 'Filled 59,100', 'var(--accent)') },\n    { t: 6.6, svg: (X, Y) => GA_TXT(X(5.6) - 18, Y(59420) - 8, 'no trades here', 'color-mix(in srgb, var(--second) 75%, var(--ground))', 'end') },\n    { t: 11.7, svg: (X, Y) => '<path d=\"M' + (X(5.6) + 100).toFixed(1) + ' ' + Y(59400).toFixed(1) + ' h18 V' + Y(59100).toFixed(1) + ' h-18\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--accent)\"/>' + GA_TXT(X(5.6) + 132, Y(59250) + 8, '300 worse', 'var(--accent)') },\n  ],\n  cards: [\n    { t: 6.5, top: 520, html: '<p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">The stop triggered at 59,400, but the first price available was <span style=\"color:var(--accent)\">59,100</span>.</p>' },\n    { t: 11.7, top: 670, border: 'var(--accent)', html: '<p class=\"mono\" style=\"margin:0;font-size:30px\">(59,100 − 60,000) × 0.01 = <span style=\"color:var(--accent)\">−9.00 USDT</span></p>' },\n  ],\n  tutor: { keys: [{ t: 0, x: C.x, y: C.y, s: C.s }], poses: [{ t: 0, pose: 'present' }, { t: 0.5, pose: 'candles' }, { t: 5.7, pose: 'confused' }, { t: 11.6, pose: 'magnify' }], says: [] },\n};\nkit.scene('gap', { init(kit) { this.r = UI.scenario(kit, GA_CFG); }, render(t) { this.r(t); } });\n","scene-hook.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst HK_K = [[0, 60000], [1.0, 60050], [4.0, 59700], [7.0, 59550], [10.0, 59250], [13.0, 59050], [17, 58950]];\nconst hkP = (s) => UI.path(HK_K, s) + Math.sin(s * 5.3) * 30 + Math.sin(s * 11.1) * 12;\nconst hkX = (s) => 1000 + Math.min(s, 16) / 16 * 580;\nkit.scene('hook', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.P = UI.plan('hk-c', { x0: 1000, x1: 1580, y0: 260, y1: 720, lo: 58800, hi: 60200, step: 200, levels: [['e', 60000, 'Entry 60,000', 'var(--second)', 'right', 'below']] });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\">' + this.P.svg + '<path class=\"hk-line\" fill=\"none\" stroke-width=\"5\" stroke-linejoin=\"round\" style=\"stroke:var(--second)\"/><circle class=\"hk-dot\" r=\"10\" style=\"fill:var(--accent)\"/>' +\n      '<text x=\"1000\" y=\"232\" class=\"fict\" style=\"fill:color-mix(in srgb, var(--second) 45%, var(--ground))\">BTC price in USDT · fictional</text></svg>' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:820px\"><p class=\"kick hk-k\">Picture this</p>' +\n      '<h2 class=\"line hk-t\">When do you get out?</h2></div>' +\n      '<div class=\"glass hk-q\" style=\"left:140px;top:620px;width:340px;padding:18px 26px;border-color:var(--accent)\"><p style=\"margin:0;font-size:30px;font-weight:700;color:var(--accent)\">Sell now? Wait?</p></div>' +\n      '<div class=\"glass hk-plan\" style=\"left:140px;top:620px;width:800px;padding:24px 34px;border-color:var(--main)\"><p style=\"margin:0;font-size:34px;font-weight:700\">Plan both exits <span style=\"color:var(--main)\">before</span> you enter.</p></div>' +\n      '</div>'));\n    this.m = UI.meter(kit, 'hk-m', 140, 420, 600, 'Long 0.01 BTC · PnL before fees');\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.hk-k').style; this.t = q('.hk-t'); this.line = q('.hk-line'); this.dot = q('.hk-dot'); this.qq = q('.hk-q').style; this.plan = q('.hk-plan').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'present' }, { t: 0.6, pose: 'candles' }, { t: 6.6, pose: 'confused' }, { t: 13.4, pose: 'idea' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.P.show(kit, { _: 1, e: seg(t, 0.4, 1.2) });\n    const end = Math.min(t, 16);\n    this.line.setAttribute('d', UI.line(hkP, 0, end, hkX, this.P.Y));\n    this.dot.setAttribute('cx', hkX(end).toFixed(1)); this.dot.setAttribute('cy', this.P.Y(hkP(end)).toFixed(1));\n    UI.rise(this.m.st, t, 0.8);\n    this.m.set(Math.round(hkP(Math.floor(t * 4) / 4)) * 0.01 - 600, 12);\n    const qp = seg(t, 6.8, 7.2);\n    this.qq.opacity = eo(qp) * (1 - ei(seg(t, 13.2, 13.6)));\n    this.qq.transform = 'rotate(' + (Math.sin(t * 7) * y: 14 });\n    this.tutor.render(t);\n  },\n});\n","scene-try.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst TY_TILES = [['Risk', '5 USDT', '500 × 0.01', 'var(--accent)', 13.2], ['Reward', '10 USDT', '1,000 × 0.01', 'var(--main)', 14.8], ['Ratio', '1 : 2', '10 ÷ 5, before fees', 'var(--second)', 18.3]];\nconst TY_CD = 7.0, TY_ANS = 13.1;\nkit.scene('try', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.ring = UI.ring(kit, 'ty-ring', 1500, 470);\n    let tiles = '';\n    TY_TILES.forEach((d, i) => {\n      tiles += '<div class=\"glass ty-tl\" style=\"left:' + (140 + i * 380) + 'px;top:550px;width:350px;padding:22px 28px\">' +\n        '<p class=\"kick\" style=\"margin:0 0 6px;color:' + d[3] + '\">' + d[0] + '</p>' +\n        '<div style=\"position:relative;height:64px\"><p class=\"mono ty-q\" style=\"position:absolute;margin:0;font-size:52px;color:color-mix(in srgb, var(--second) 40%, var(--ground))\">?</p>' +\n        '<p class=\"mono ty-a\" style=\"position:absolute;margin:0;font-size:52px;color:' + d[3] + '\">' + d[1] + '</p></div>' +\n        '<p class=\"mono ty-s\" style=\"margin:6px 0 0;font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">' + d[2] + '</p></div>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:1000px\"><p class=\"kick ty-k\">Your turn</p>' +\n      '<h2 class=\"line ty-t\">Pause and work it out</h2></div>' +\n      '<div class=\"glass ty-qc\" style=\"left:140px;top:330px;width:1110px;padding:26px 38px\"><p class=\"fict\" style=\"margin:0 0 10px\">Question · fictional prices</p>' +\n      '<p class=\"def\" style=\"margin:0\">Long <b>0.01 BTC</b> at <b>60,000</b>. Stop-loss <b>59,500</b>. Take-profit <b>61,000</b>. Find the risk, the reward and the ratio.</p></div>' +\n      tiles +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\">' + this.ring.html +\n      '<text class=\"ty-hint\" x=\"1500\" y=\"640\" text-a anels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson eight\",\n      \"dur\": 9,\n      \"desc\": \"Title card: Phase 2, lesson T08, Stop-Loss and Take-Profit; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"When do you get out?\",\n      \"dur\": 17,\n      \"desc\": \"A long position falls with no plan; the loss meter keeps growing while the trader freezes.\"\n    },\n    {\n      \"id\": \"plan\",\n      \"name\": \"A trade plan\",\n      \"dur\": 20,\n      \"desc\": \"Entry, stop-loss and take-profit lines draw onto a fictional chart; for a short the lines flip.\"\n    },\n    {\n      \"id\": \"sl\",\n      \"name\": \"Stop-loss\",\n      \"dur\": 21,\n      \"desc\": \"Stop-loss defined; price falls to 59,400 and the PnL meter stops at about −6 USDT before fees.\"\n    },\n    {\n      \"id\": \"tp\",\n      \"name\": \"Take-profit\",\n      \"dur\": 20,\n      \"desc\": \"Take-profit defined; price rises to 61,200 and the PnL meter stops at about +12 USDT before fees.\"\n    },\n    {\n      \"id\": \"trigger\",\n      \"name\": \"Trigger and execution\",\n      \"dur\": 20,\n      \"desc\": \"Trigger price 59,400 versus execution price 59,380; the loss becomes −6.20 USDT.\"\n    },\n    {\n      \"id\": \"rr\",\n      \"name\": \"Risk/reward ratio\",\n      \"dur\": 23,\n      \"desc\": \"Risk 6 USDT and reward 12 USDT shown as bars; ratio 1 to 2, before fees, not a win chance.\"\n    },\n    {\n      \"id\": \"bull\",\n      \"name\": \"Scenario: price rises\",\n      \"dur\": 19,\n      \"desc\": \"Price climbs to the take-profit; it triggers and fills; the stop-loss is cancelled.\"\n    },\n    {\n      \"id\": \"bear\",\n      \"name\": \"Scenario: price falls\",\n      \"dur\": 18,\n      \"desc\": \"Price falls to the stop-loss; it fills at 59,390 for about −6.10 USDT.\"\n    },\n    {\n      \"id\": \"gap\",\n      \"name\": \"Scenario: a gap\",\n      \"dur\": 20,\n      \"desc\": \"Price gaps from 59,700 to 59,100; the stop fills there for about −9 USDT.\"\n    },\n    {\n      \"id\": \"miss\",\n      \"name\": \"Target missed\",\n      \"dur\": 20,\n      \"desc\": \"Price reaches 61,150, turns down, and the unfilled take-profit leaves the unrealized gain to shrink.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"Common mistake\",\n      \"dur\": 19,\n      \"desc\": \"The belief that risk/reward is a win chance is corrected with ten fictional trades.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 23,\n      \"desc\": \"Pause and work out risk, reward and ratio for a plan; the answer 5, 10, 1 to 2 is revealed.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the limits\",\n      \"dur\": 24,\n      \"desc\": \"Stops slip, targets can be missed, liquidation can come first with leverage, and waiting is allowed.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 25,\n      \"desc\": \"Three key points and one question to check yourself.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T09, fees, spread and slippage.\"\n    }\n  ]\n}\n","score.js":"kit.score(function (S, T) {\n  // No voice: a soft pad and keys bed, a light pulse in the hands-on parts, quieter for the risk scenes.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.sl, T.rr) || inR(s, T.bull, T.miss) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.mistake, T.try) || inR(s, T.risks, T.recap) || inR(s, T.hook, T.plan);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  [[T.title, 2.9], [T.hook, 0.8], [T.sl, 0.6], [T.tp, 0.6], [T.trigger, 0.8], [T.trigger, 4.2], [T.rr, 0.6], [T.miss, 13.5], [T.mistake, 1.0], [T.next, 1.3]]\n    .forEach((b) => S.fx('pop', b[0] + b[1], { vel: 26, pitch: 7 }));\n  S.fx('thud', T.hook + 6.8, { vel: 26 }); S.fx('chime', T.hook + 13.5, { vel: 32 });\n  for (let i = 0; i < 3; i++) S.fx('pop', T.plan + [1.4, 3.2, 5.2][i], { vel: 30 });\n  for (let i = 0; i < 3; i++) S.fx('tick', T.plan + [8.4, 9.6, 10.8][i], { vel: 30 });\n  S.fx('whoosh', T.plan + 14.0, { dur: 0.8, vel: 24 });\n  S.fx('thud', T.sl + 17.4, { vel: 30 }); S.fx('ding', T.tp + 17.0, { vel: 36 });\n  S.fx('thud', T.trigger + 10.4, { vel: 28 }); S.fx('ding', T.trigger + 11.0, { vel: 28 });\n  S.fx('pop', T.rr + 6.6, { vel: 32 }); S.fx('pop', T.rr + 8.8, { vel: 32 }); S.fx('chime', T.rr + 11.8, { vel: 36 });\n  S.fx('ding', T.bull + 5.0, { vel: 38 }); S.fx('pop', T.bull + 12.3, { vel: 28 });\n  S.fx('thud', T.bear + 4.6, { vel: 30 }); S.fx('ding', T.bear + 5.0, { vel: 26 });\n  S.fx('thud', T.gap + 5.6, { vel: 38 }); S.fx('ding', T.gap + 6.0, { vel: 26 });\n  S.fx('pop', T.miss + 5.0, { vel: 28 });\n  S.fx('whoosh', T.mistake + 6.2, { dur: 0.6, vel: 24 });\n  for (let i = 0; i < 10; i++) S.fx('tick', T.mistake + 6.8 + i * 0.55, { vel: 24 });\n  S.fx('chime', T.mistake + 13.7, { vel: 30 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 7.0 + i, { vel: 30 });\n  S.fx('ding', T.try + 13.2, { vel: 34 }); S.fx('ding', T.try + 14.8, { vel: 34 }); S.fx('chime', T.try + 18.3, { vel: 42 });\n  for (let i = 0; i < 4; i++) S.fx('pop', T.risks + [5.1, 7.6, 10.3, 18.3][i], { vel: 28 });\n  for (let i = 0; i < 3; i++) S.fx('pop', T.recap + [2.9, 7.7, 13.4][i], { vel: 34 });\n  S.fx('ding', T.recap + 21.7, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 21, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T08 · Stop-loss and take-profit',\n  TOTAL: 308,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n  // ── Lesson helpers (T07–T09) ──\n  // Set text only when it changes.\n  txt(el, s) { if (el.textContent !== s) el.textContent = s; },\n  // Fade and rise in at a (and fade out at o.out); returns the eased progress.\n  rise(st, t, a, o) {\n    o = o || {}; const K = UI.K, d = o.d == null ? 0.6 : o.d, dy = o.dy == null ? 30 : o.dy;\n    const p = K.seg(t, a, a + d), out = o.out == null ? 0 : K.ei(K.seg(t, o.out, o.out + 0.5));\n    st.opacity = (K.eo(K.seg(t, a, a + d * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + K.lerp(dy, 0, K.eo(p)).toFixed(2) + 'px) scale(' + K.lerp(o.s == null ? 0.96 : o.s, 1, K.eob(p, 1.5)).toFixed(4) + ')';\n    return p;\n  },\n  // Piecewise eased value through keys [[t, v], ...].\n  path(keys, t) {\n    const K = UI.K; let v = keys[0][1];\n    for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = K.lerp(a[1], b[1], K.eio(K.clamp01((t - a[0]) / (b[0] - a[0])))); }\n    return v;\n  },\n  // Countdown ring for \"try it\": returns {el (svg group html), render(t, t0, n)}.\n  ring(kit, cls, cx, cy) {\n    const R = 110, C = 2 * Math.PI * R;\n    const html = '<g class=\"' + cls + '\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + R + '\" fill=\"none\" stroke-width=\"14\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"' + cls + '-arc\" r=\"' + R + '\" fill=\"none\" stroke-width=\"14\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<text class=\"' + cls + '-n mono\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:84px\"></text></g>';\n    let arc, n, g;\n    return {\n      html,\n      render(t, t0, len, show) {\n        if (!g) { g = kit.stage.querySelector('.' + cls); arc = kit.stage.querySelector('.' + cls + '-arc'); n = kit.stage.querySelector('.' + cls + '-n'); }\n        g.style.opacity = show;\n        arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + len)).toFixed(1));\n        UI.txt(n, t < t0 ? String(len) : String(Math.max(0, Math.min(len, Math.ceil(len - (t - t0))))));\n      },\n    };\n  },\n  // A fictional order book: n ask rows over n bid rows. book.set(state) with\n  // state = {asks: [[price, qty, op?, hl?, tag?], ...] top to bottom, bids: same, spread: text, max: qty for a full bar}.\n  book(kit, cls, x, y, w, n, title) {\n    let rows = '';\n    const row = (side, i) => '<div class=\"' + cls + '-r\" data-s=\"' + side + '\" style=\"position:relative;display:flex;align-items:center;height:54px;padding:0 22px;border-radius:12px\">' +\n      '<span class=\"' + cls + '-bar\" style=\"position:absolute;right:0;top:6px;bottom:6px;border-radius:10px;background:color-mix(in srgb, ' + (side === 'a' ? 'var(--accent)' : 'var(--main)') + ' 20%, transparent)\"></span>' +\n      '<span class=\"mono ' + cls + '-p\" style=\"position:relative;flex:1;font-size:30px;color:' + (side === 'a' ? 'var(--accent)' : 'var(--main)') + '\"></span>' +\n      '<span class=\"' + cls + '-tag\" style=\"position:relative;margin-right:18px;padding:4px 14px;border-radius:999px;font-size:22px;font-weight:700;background:var(--second);color:var(--ground);opacity:0\"></span>' +\n      '<span class=\"mono ' + cls + '-q\" style=\"position:relative;width:120px;text-align:right;font-size:28px\"></span></div>';\n    for (let i = 0; i < n; i++) rows += row('a', i);\n    rows += '<div style=\"display:flex;align-items:center;justify-content:center;height:46px\"><span class=\"mono ' + cls + '-sp\" style=\"font-size:22px;color:color-mix(in srgb, var(--second) 60%, var(--ground))\"></span></div>';\n    for (let i = 0; i < n; i++) rows += row('b', i);\n    const el = kit.h('<div class=\"glass ' + cls + '\" style=\"left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;padding:22px 22px 18px\">' +\n      '<p class=\"fict\" style=\"margin:0 0 10px 22px\">' + (title || 'Order book · BTC/USDT · fictional') + '</p>' +\n      '<div style=\"display:flex;padding:0 22px 8px;font-size:22px;color:color-mix(in srgb, var(--second) 55%, var(--ground))\"><span style=\"flex:1\">Price (USDT)</span><span>Amount (BTC)</span></div>' + rows + '</div>');\n    kit.stage.append(el);\n    const all = (s) => [...el.querySelectorAll(s)];\n    const R = all('.' + cls + '-r'), P = all('.' + cls + '-p'), Q = all('.' + cls + '-q'), B = all('.' + cls + '-bar'), G = all('.' + cls + '-tag');\n    const sp = el.querySelector('.' + cls + '-sp');\n    return {\n      el, st: el.style, rows: R,\n      set(s) {\n        const list = s.asks.concat(s.bids), max = s.max || 0.02;\n        list.forEach((r, i) => {\n          if (!R[i]) return;\n          UI.txt(P[i], r[0] == null ? '' : UI.fmt(r[0]));\n          UI.txt(Q[i], r[1] == null ? '' : r[1].toFixed(3));\n          B[i].style.width = (Math.min(1, (r[1] || 0) / max) * 70).toFixed(1) + '%';\n          R[i].style.opacity = r[2] == null ? 1 : r[2];\n          const hl = r[3] || 0;\n          R[i].style.background = 'color-mix(in srgb, var(--second) ' + (hl * 14).toFixed(1) + '%, transparent)';\n          R[i].style.outline = hl > 0.02 ? '2px solid color-mix(in srgb, var(--second) ' + (hl * 70).toFixed(0) + '%, transparent)' : 'none';\n          UI.txt(G[i], r[4] || ''); G[i].style.opacity = r[4] ? 1 : 0;\n        });\n        UI.txt(sp, s.spread || '');\n      },\n    };\n  },\n  // Price grid for a chart: horizontal lines with price labels to the right of x1.\n  grid(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (+y + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Polyline of a price function f(s) for s in [s0, s1], mapped with xOf and yOf.\n  line(f, s0, s1, xOf, yOf, dt) {\n    let d = '';\n    for (let s = s0; s <= s1 + 1e-6; s += dt || 0.05) d += (d ? 'L' : 'M') + xOf(s).toFixed(1) + ' ' + yOf(f(s)).toFixed(1 <script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against

 *

 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.

      const list = words(root);
      list.forEach((s, i) => {
        const p = eo(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = p;
        s.style.transform = "translateX(" + ((1 - p) * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
    fadeOutLeft(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.04, d = o.dur ?? 0.35, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = ei(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = 1 - p;
        s.style.transform = "translateX(" + (-p * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
  };

  // ── The kit the scene modules use ──────────────────────────────────────────
  const modules = F.modules;
  const jsonCache = {};
  const assets = {
    url: (name) => F.assetBase + name,
    has: (name) => Object.prototype.hasOwnProperty.call(F.assets, name),
    list: () => Object.keys(F.assets),
  };
  const defs = {};
  let scoreFn = null;

  // start/dur: the scene in the played timeline; oldStart/oldDur: as authored (k = dur / oldDur).
  let acc = 0;
  const scenes = F.scenes.map((s) => {
    const o = Object.assign({ k: 1, oldStart: acc, oldDur: s.dur }, s, { start: acc });
    acc += s.dur;
    return o;
  });
  const END = acc;
  const OLD_END = scenes.reduce((a, s) => a + s.oldDur, 0);
  // Authored time to played time.
  function warp(x) {
    for (let i = scenes.length - 1; i >= 0; i--) {
      const s = scenes[i];
      if (x >= s.oldStart) return s.start + (x - s.oldStart) * s.k;
    }
    return x;
  }
  // Narration lines: spoken when the lesson has a voice track (F.voice.src), always shown as captions.
  const lines = (F.voice && F.voice.lines) || [];
  // Stretches where the music dips under the voice: each line plus a little either side, close ones joined.
  const duckSpans = [];
  if (F.voice && F.voice.src) for (const l of lines) {
    const a = l.t - 0.15, b = l.t + l.d + 0.25, last = duckSpans[duckSpans.length - 1];
    if (last && a - last[1] < 1.2) last[1] = b; else duckSpans.push([a, b]);
  }

  function makeKit(box, start, dur) {
    return {
      stage: box, start, dur, W, H,
      seg, lerp, eo, ei, eio, eob, clamp, clamp01, rng, breathe, TextFx, h, el, esc,
      assets,
      module: (n) => (n in modules ? modules[n] : null),
      json: (n) => (jsonCache[n] ??= JSON.parse(modules[n])),
      modules: () => Object.keys(modules),
      scene: (id, def) => { defs[id] = def; },
      score: (fn) => { scoreFn = fn; },
    };
  }
  const run = (name, kit) => new Function("kit", modules[name] + "\n//# sourceURL=" + F.id + "/" + name)(kit);

  // ── Stage ──────────────────────────────────────────────────────────────────
  const stage = document.getElementById("stage");
  const css = document.createElement("style");
  css.textContent = modules["base.css"] || "";
  document.head.append(css);

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 200));
  fit();

  // ── Audio: score.js recorded as events, then synthesised with WebAudio ─────
  function midiOf(p) {
    if (typeof p === "number") return p;
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(p).trim());
    if (!m) return 72;
    const base = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[m[1].toLowerCase()];
    return 12 * (Number(m[3]) + 1) + base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  }

  // score.js runs twice: the music against the played timeline, the sound effects against the
  // authored one and then moved onto the played one, so each cue stays with its animation.
  function recordScore() {
    const T = { END };
    for (const s of scenes) T[s.id] = s.start;
    const music = recordPass(T);
    const Told = { END: OLD_END };
    for (const s of scenes) Told[s.id] = s.oldStart;
    const cues = recordPass(Told);
    const ev = music.ev.filter((e) => e.k !== "f");
    for (const e of cues.ev) {
      if (e.k !== "f") continue;
      e.t = warp(e.t);
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      ev.push(e);
    }
    ev.sort((a, b) => a.s - b.s);
    return { ev, tracks: music.tracks, master: music.master };
  }

  function recordPass(T) {
    const ev = [];
    const tracks = {};
    const master = { gain: -6, music: 0, fadeOut: 1 };
    let B = 0.5, t0 = 0;
    const at = (o) => (o.t != null ? o.t : t0 + (o.beat || 0) * B);
    const len = (o, d) => (o.dur != null ? o.dur : o.beats != null ? o.beats * B : d);
    const push = (e) => {
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      if (e.s < -0.1) return;
      if (e.s < 0) { e.t += -e.s; e.s = 0; }
      ev.push(e);
    };
    const hits = (str, rep, step, from, vel, fn) => {
      for (let r = 0; r < rep; r++) {
        for (let i = 0; i < str.length; i++) {
          const c = str[i];
          if (c !== "x" && c !== "X" && c !== "o") continue;
          fn(t0 + (from + (r * str.length + i) * step) * B, vel * (c === "X" ? 1.25 : c === "o" ? 0.5 : 1));
        }
      }
    };
    const S = {
      tempo(bpm, o = {}) { B = 60 / bpm; t0 = o.t0 || 0; },
      beat: (n) => t0 + n * B,
      toBeat: (t) => (t - t0) / B,
      seed() {},
      program(track, patch, o = {}) {
        tracks[track] = { patch, gain: o.gain || 0, pan: o.pan || 0, rev: o.rev || 0, bright: o.bright ?? 1 };
      },
      note(track, p, o = {}) { push({ k: "n", track, m: midiOf(p), t: at(o), d: len(o, B), v: o.vel ?? 90 }); },
      chord(track, ps, o = {}) { ps.forEach((p) => S.note(track, p, o)); },
      pattern(track, str, o = {}) {
        const pitches = o.pitch || ["C5"];
        let k = 0;
        const step = o.step ?? 0.5;
        hits(str, o.repeat ?? 1, step, o.from || 0, o.vel ?? 80, (t, v) =>
          push({ k: "n", track, m: midiOf(pitches[k++ % pitches.length]), t, d: o.dur ?? step * B * 0.9, v }));
      },
      drum(name, o = {}) { push({ k: "d", name, t: at(o), d: 0.3, v: o.vel ?? 90 }); },
      drums(map, o = {}) {
        for (const name of Object.keys(map)) {
          hits(map[name], o.repeat ?? 1, o.step ?? 0.5, o.from || 0, o.vel ?? 80, (t, v) => push({ k: "d", name, t, d: 0.3, v }));
        }
      },
      ticks(times, o = {}) { times.forEach((t) => push({ k: "f", name: "tick", t, d: 0.03, v: o.vel ?? 40, pitch: 0 })); },
      fx(name, t, o = {}) { push({ k: "f", name, t, d: o.dur ?? 0.5, v: o.vel ?? 70, pitch: o.pitch || 0 }); },
      run(track, ps, o = {}) {
        const step = o.step ?? 0.1;
        ps.forEach((p, i) => push({ k: "n", track, m: midiOf(p), t: o.t + i * step, d: step * 2.5, v: (o.vel ?? 70) + i * (o.cresc || 0) }));
      },
      master(o = {}) {
        if (o.gain != null) master.gain = o.gain;
        if (o.music != null) master.music = o.music;
        if (o.fadeOut != null) master.fadeOut = o.fadeOut;
      },
    };
    if (scoreFn) scoreFn(S, T);
    return { ev, tracks, master };
  }

  const db = (x) => Math.pow(10, x / 20);
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const audio = {
    ctx: null, enabled: false, muted: false, score: null,
    out: null, verb: null, noise: null, session: null, timer: 0,
    voiceData: null, voiceBuf: null, voiceOut: null,
  };
  const DUCK = 0.4;

  function setupAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ctx = (audio.ctx = new AC());
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;
    comp.connect(ctx.destination);
    audio.out = ctx.createGain();
    audio.out.gain.value = db(audio.score.master.gain);
    audio.out.connect(comp);
    // A small generated room for the reverb send.
    const len = Math.floor(ctx.sampleRate * 2.4);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    const r = rng(9);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    audio.verb = ctx.createConvolver();
    audio.verb.buffer = ir;
    const verbGain = ctx.createGain();
    verbGain.gain.value = 0.5;
    audio.verb.connect(verbGain);
    verbGain.connect(audio.out);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    const r2 = rng(3);
    for (let i = 0; i < nd.length; i++) nd[i] = r2() * 2 - 1;
    audio.noise = nb;
    // The voice skips the music's compressor and goes straight out.
    audio.voiceOut = ctx.createGain();
    audio.voiceOut.gain.value = 1;
    audio.voiceOut.connect(ctx.destination);
    decodeVoice();
    return true;
  }

  async function decodeVoice() {
    if (!audio.ctx || audio.voiceBuf || !audio.voiceData) return;
    try {
      const data = await audio.voiceData;
      if (!data || audio.voiceBuf) return;
      audio.voiceBuf = await new Promise((ok, fail) => audio.ctx.decodeAudioData(data.slice(0), ok, fail));
    } catch (e) {
      return; // the lesson plays on without the voice
    }
    if (audio.session) startVoice(audio.session);
  }

  // The voice of one session, from the session's start point; the music dips under each line.
  function startVoice(s) {
    if (!audio.voiceBuf || s.voice) return;
    const ctx = audio.ctx;
    const at = Math.max(s.ctx0, ctx.currentTime + 0.02);
    const off = s.film0 + (at - s.ctx0);
    if (off >= audio.voiceBuf.duration) return;
    const src = ctx.createBufferSource();
    src.buffer = audio.voiceBuf;
    src.connect(audio.voiceOut);
    src.start(at, off);
    s.voice = src;
    for (const g of [s.duck.gain, s.send.gain]) {
      for (const [a, b] of duckSpans) {
        if (b <= off) continue;
        const ca = at + (a - off), cb = at + (b - off);
        if (ca > at) { g.setValueAtTime(1, ca); g.linearRampToValueAtTime(DUCK, ca + 0.25); } else g.setValueAtTime(DUCK, at);
        g.setValueAtTime(DUCK, cb);
        g.linearRampToValueAtTime(1, cb + 0.5);
      }
    }
  }

  // One playback session: a bus that can be dropped as a whole on pause or seek.
  function startSession(filmT) {
    stopSession();
    if (!audio.enabled || audio.muted) return;
    const ctx = audio.ctx;
    const bus = ctx.createGain();
    const duck = ctx.createGain();
    bus.connect(duck);
    duck.connect(audio.out);
    const send = ctx.createGain();
    send.connect(audio.verb);
    // The instruments (not the drums or sound effects) go through their own level, master({ music }).
    const music = ctx.createGain();
    music.gain.value = db(audio.score.master.music);
    music.connect(bus);
    const musicSend = ctx.createGain();
    musicSend.gain.value = music.gain.value;
    musicSend.connect(send);
    const tracks = {};
    for (const [name, tr] of Object.entries(audio.score.tracks)) {
      const g = ctx.createGain();
      g.gain.value = db(tr.gain);
      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (pan) { pan.pan.value = tr.pan; g.connect(pan); pan.connect(music); } else g.connect(music);
      const rs = ctx.createGain();
      rs.gain.value = tr.rev;
      g.connect(rs);
      rs.connect(musicSend);
      tracks[name] = { node: g, def: tr };
    }
    const s = { bus, duck, send, music, musicSend, tracks, ctx0: ctx.currentTime + 0.06, film0: filmT, upTo: filmT, idx: 0, voice: null };
    audio.session = s;
    startVoice(s);
    // Notes already sounding at the seek point start now with what is left of them.
    for (const e of audio.score.ev) {
      if (e.s >= filmT) break;
      if (e.k === "n" && e.s + e.d > filmT + 0.15) sound(e, s, filmT, e.s + e.d - filmT);
    }
    s.idx = audio.score.ev.findIndex((e) => e.s >= filmT);
    if (s.idx < 0) s.idx = audio.score.ev.length;
    // Fade the master out over the last seconds of the lesson.
    const fo = audio.score.master.fadeOut;
    if (fo > 0) {
      const a = Math.max(filmT, END - fo);
      bus.gain.setValueAtTime(1, s.ctx0 + (a - filmT));
      bus.gain.linearRampToValueAtTime(0.0001, s.ctx0 + (END - filmT));
    }
    audio.timer = setInterval(() => pump(), 50);
    pump();
  }

  function stopSession() {
    clearInterval(audio.timer);
    const s = audio.session;
    audio.session = null;
    if (!s) return;
    const now = audio.ctx.currentTime;
    s.bus.gain.cancelScheduledValues(now);
    s.bus.gain.setTargetAtTime(0, now, 0.03);
    s.send.gain.cancelScheduledValues(now);
    s.send.gain.setTargetAtTime(0, now, 0.03);
    if (s.voice) {
      const v = s.voice;
      try { v.stop(now + 0.05); } catch (e) { /* not started yet */ }
      setTimeout(() => v.disconnect(), 400);
    }
    setTimeout(() => { s.bus.disconnect(); s.duck.disconnect(); s.send.disconnect(); s.music.disconnect(); s.musicSend.disconnect(); }, 400);
  }

  function pump() {
    const s = audio.session;
    if (!s) return;
    const filmNow = s.film0 + (audio.ctx.currentTime - s.ctx0);
    const horizon = filmNow + 0.6;
    const ev = audio.score.ev;
    while (s.idx < ev.length && ev[s.idx].s <= horizon) {
      const e = ev[s.idx++];
      if (e.s >= s.film0) sound(e, s, e.s, e.d);
    }
  }

  function sound(e, s, filmStart, dur) {
    const ctx = audio.ctx;
    const when = Math.max(ctx.currentTime, s.ctx0 + (filmStart - s.film0));
    const v = Math.pow(clamp01(e.v / 127), 1.5);
    if (e.k === "n") {
      const tr = s.tracks[e.track];
      if (!tr) return;
      voice(tr.def.patch, tr.node, hz(e.m), when, Math.max(0.05, dur), v, tr.def.bright);
    } else if (e.k === "d") {
      drum(e.name, s.bus, when, v);
    } else {
      fx(e.name, s.bus, s.send, when, e.d, v, e.pitch || 0);
    }
  }

  function env(g, when, peak, attack, hold, release) {
    peak = Math.max(peak, 0.0002);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.setValueAtTime(peak, when + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, when + attack + hold + release);
    return when + attack + hold + release + 0.05;
  }
  function osc(type, f, dest, when, stop, detune) {
    const o = audio.ctx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    if (detune) o.detune.value = detune;
    o.connect(dest);
    o.start(when);
    o.stop(stop);
    return o;
  }
  function noiseSrc(dest, when, stop) {
    const n = audio.ctx.createBufferSource();
    n.buffer = audio.noise;
    n.loop = true;
    n.connect(dest);
    n.start(when);
    n.stop(stop);
    return n;
  }

  function voice(patch, dest, f, when, dur, v, bright) {
    const ctx = audio.ctx;
    const g = ctx.createGain();
    g.connect(dest);
    let stop;
    switch (patch) {
      case "pad": {
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 700 + 900 * bright;
        lp.connect(g);
        stop = env(g, when, 0.22 * v, 0.5, Math.max(0, dur - 0.5), 1.1);
        osc("sawtooth", f, lp, when, stop, -8);
        osc("sawtooth", f, lp, when, stop, 8);
        break;
      }
      case "ep":
      case "keys": {
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.22 * v + 0.0002, when + 0.008);
        g.gain.exponentialRampToValueAtTime(0.08 * v + 0.0001, when + Math.min(dur, 0.9));
        g.gain.exponentialRampToValueAtTime(0.0001, when + dur + 0.4);
        stop = when + dur + 0.45;
        osc("sine", f, g, when, stop);
        const h2 = ctx.createGain();
        h2.gain.value = 0.25;
        h2.connect(g);
        osc("sine", f * 2, h2, when, stop);
        break;
      }
      case "bass": {
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 500;
        lp.connect(g);
        stop = env(g, when, 0.34 * v, 0.01, Math.max(0, dur - 0.1), 0.18);
        osc("sine", f, lp, when, stop);
        osc("triangle", f * 2, lp, when, stop);
        break;
      }
      case "pluck": {
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.24 * v + 0.0002, when + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, when + Math.min(1.1, dur + 0.45));
        stop = when + Math.min(1.1, dur + 0.45) + 0.05;
        osc("triangle", f, g, when, stop);
        break;
      }
      default: {
        // marimba, vibes, glock and anything unknown: a struck bar.
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.26 * v + 0.0002, when + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, when + 0.7);
        stop = when + 0.75;
        osc("sine", f, g, when, stop);
        const h4 = ctx.createGain();
        h4.gain.value = 0.12;
        h4.connect(g);
        osc("sine", f * 4, h4, when, stop);
      }
    }
  }

  function drum(name, dest, when, v) {
    const ctx = audio.ctx;
    const g = ctx.createGain();
    g.connect(dest);
    if (name === "kick" || name === "tom") {
      const o = osc("sine", 140, g, when, when + 0.4);
      o.frequency.setValueAtTime(140, when);
      o.frequency.exponentialRampToValueAtTime(45, when + 0.12);
      env(g, when, 0.8 * v, 0.002, 0.02, 0.3);
    } else {
      const f = ctx.createBiquadFilter();
      f.type = name === "sidestick" || name === "woodblock" ? "bandpass" : "highpass";
      f.frequency.value = name === "sidestick" || name === "woodblock" ? 1900 : 7000;
      f.connect(g);
      noiseSrc(f, when, when + 0.2);
      env(g, when, 0.22 * v, 0.001, 0.005, name === "openhat" ? 0.25 : 0.045);
    }
  }

  function fx(name, dest, send, when, dur, v, pitch) {
    const ctx = audio.ctx;
    const tr = Math.pow(2, pitch / 12);
    const g = ctx.createGain();
    g.connect(dest);
    const wet = ctx.createGain();
    wet.gain.value = 0.35;
    g.connect(wet);
    wet.connect(send);
    const r = rng(Math.floor(when * 1000));
    switch (name) {
      case "tick": {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = 3000 + r() * 1500;
        f.Q.value = 3;
        f.connect(g);
        noiseSrc(f, when, when + 0.06);
        env(g, when, 0.5 * v, 0.001, 0.004, 0.025);
        break;
      }
      case "click": {
        osc("square", 1400, g, when, when + 0.06);
        env(g, when, 0.12 * v, 0.001, 0.005, 0.03);
        break;
      }
      case "ding": {
        osc("sine", 1046.5 * tr, g, when, when + 1.6);
        osc("sine", 1568 * tr, g, when, when + 1.6);
        env(g, when, 0.16 * v, 0.004, 0.02, 1.4);
        break;
      }
      case "chime": {
        [0, 4, 7].forEach((st, i) => {
          const gi = ctx.createGain();
          gi.connect(g);
          const t = when + i * 0.07;
          osc("sine", 1046.5 * tr * Math.pow(2, st / 12), gi, t, t + 1);
          env(gi, t, 0.14 * v, 0.003, 0.01, 0.9);
        });
        g.gain.value = 1;
        break;
      }
      case "sparkle": {
        for (let i = 0; i < 6; i++) {
          const gi = ctx.createGain();
          gi.connect(g);
          const t = when + r() * 0.5;
          osc("sine", 2000 + r() * 2200, gi, t, t + 0.2);
          env(gi, t, 0.07 * v, 0.002, 0.01, 0.12);
        }
        break;
      }
      case "whoosh":
      case "revswell": {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass";
        f.Q.value = 0.8;
        f.frequency.setValueAtTime(300, when);
        f.frequency.exponentialRampToValueAtTime(name === "whoosh" ? 2400 : 3200, when + dur);
        f.connect(g);
        noiseSrc(f, when, when + dur + 0.1);
        g.gain.setValueAtTime(0.0001, when);
        if (name === "whoosh") {
          g.gain.linearRampToValueAtTime(0.3 * v, when + dur * 0.5);
          g.gain.linearRampToValueAtTime(0.0001, when + dur);
        } else {
          g.gain.exponentialRampToValueAtTime(0.28 * v + 0.0002, when + dur);
          g.gain.linearRampToValueAtTime(0.0001, when + dur + 0.06);
        }
        break;
      }
      case "thud": {
        const o = osc("sine", 110, g, when, when + 0.4);
        o.frequency.setValueAtTime(110, when);
        o.frequency.exponentialRampToValueAtTime(45, when + 0.18);
        env(g, when, 0.5 * v, 0.002, 0.02, 0.3);
        break;
      }
      case "boing": {
        const o = osc("sine", 220 * tr, g, when, when + 0.5);
        o.frequency.setValueAtTime(220 * tr, when);
        o.frequency.linearRampToValueAtTime(520 * tr, when + 0.12);
        o.frequency.linearRampToValueAtTime(300 * tr, when + 0.4);
        env(g, when, 0.2 * v, 0.005, 0.05, 0.35);
        break;
      }
      default: {
        // pop, and any name this synth does not know.
        const o = osc("sine", 600 * tr, g, when, when + 0.2);
        o.frequency.setValueAtTime(600 * tr, when);
        o.frequency.exponentialRampToValueAtTime(1200 * tr, when + 0.06);
        env(g, when, 0.3 * v, 0.002, 0.01, 0.12);
      }
    }
  }

  // ── Playback ───────────────────────────────────────────────────────────────
  const state = { t: 0, playing: false, wall0: 0, t0: 0, current: -1 };
  let instances = [];

  function sceneAt(t) {
    for (let i = scenes.length - 1; i >= 0; i--) if (t >= scenes[i].start) return i;
    return 0;
  }

  function renderAt(t) {
    const i = sceneAt(t);
    if (i !== state.current) {
      instances.forEach((inst, k) => { inst.box.style.display = k === i ? "block" : "none"; });
      state.current = i;
    }
    const inst = instances[i];
    inst.def.render.call(inst.def, (Math.min(t, END - 1e-4) - inst.sc.start) / inst.sc.k, inst.kit);
    ui.update(t);
  }

  function now() { return performance.now() / 1000; }

  function play() {
    if (state.t >= END - 0.01) state.t = 0;
    state.playing = true;
    state.wall0 = now();
    state.t0 = state.t;
    startSession(state.t);
    ui.update(state.t);
  }
  function pause() {
    state.playing = false;
    stopSession();
    ui.update(state.t);
  }
  function seek(t) {
    state.t = clamp(t, 0, END);
    state.wall0 = now();
    state.t0 = state.t;
    if (state.playing) startSession(state.t);
    renderAt(state.t);
  }
  function tick() {
    if (state.playing) {
      state.t = state.t0 + (now() - state.wall0);
      if (state.t >= END) {
        state.t = END;
        pause();
      }
      renderAt(state.t);
    }
    requestAnimationFrame(tick);
  }

  async function enableAudio() {
    if (audio.enabled) return;
    if (!audio.ctx && !setupAudio()) return;
    try { await audio.ctx.resume(); } catch (e) { /* stays suspended */ }
    if (audio.ctx.state !== "running") return;
    audio.enabled = true;
    ui.sound();
    if (state.playing) startSession(state.t);
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  const fmt = (t) => {
    const s = Math.max(0, Math.floor(t));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  const ICON = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>',
    replay: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L7 6.5l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z" fill="currentColor"/></svg>',
    on: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    off: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    full: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    exit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  // ── Full screen ────────────────────────────────────────────────────────────
  // The Fullscreen API where the browser has it (desktop, Android, iPad), turning a phone to
  // landscape where it allows. iPhone Safari has no Fullscreen API for pages, so inside the
  // course page the player asks the parent to grow the lesson to fill the whole screen instead.
  const embedded = window.parent !== window;
  const root = document.documentElement;
  const fs = {
    native: !!(document.fullscreenEnabled || document.webkitFullscreenEnabled),
    pseudo: false,
    available() { return this.native || embedded; },
    active() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || this.pseudo; },
    async toggle() {
      if (this.native) {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) { /* not locked */ }
          await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          return;
        }
        try {
          await (root.requestFullscreen || root.webkitRequestFullscreen).call(root, { navigationUI: "hide" });
          if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape").catch(() => {});
          return;
        } catch (e) {
          if (!embedded) return; // refused: fall through to the parent page below
        }
      }
      this.pseudo = !this.pseudo;
      window.parent.postMessage({ type: "futures-edge:fullscreen", on: this.pseudo }, location.origin);
      ui.full();
    },
  };
  document.addEventListener("fullscreenchange", () => ui.full());
  document.addEventListener("webkitfullscreenchange", () => ui.full());
  const ui = (() => {
    const bar = h(
      '<div class="fe-ui" role="group" aria-label="Lesson controls">' +
        '<button type="button" class="fe-btn fe-pp" aria-label="Pause"></button>' +
        '<div class="fe-track" role="slider" tabindex="0" aria-label="Lesson position" aria-valuemin="0"><i></i></div>' +
        '<span class="fe-time"></span>' +
        (lines.length ? '<button type="button" class="fe-btn fe-cc" aria-pressed="true" aria-label="Captions">CC</button>' : "") +
        '<button type="button" class="fe-btn fe-snd" aria-label="Turn sound on"></button>' +
        (fs.available() ? '<button type="button" class="fe-btn fe-fs" aria-label="Full screen"></button>' : "") +
      "</div>"
    );
    const hint = h('<button type="button" class="fe-hint">Click anywhere for sound</button>');
    const cap = h('<p class="fe-cap" aria-live="off"></p>');
    document.body.append(cap, bar, hint);
    const cc = bar.querySelector(".fe-cc");
    const fsb = bar.querySelector(".fe-fs");
    if (fsb) fsb.addEventListener("click", (e) => { e.stopPropagation(); fs.toggle(); wake(); });
    let ccOn = true, capText = null;
    if (cc) cc.addEventListener("click", (e) => {
      e.stopPropagation();
      ccOn = !ccOn;
      cc.setAttribute("aria-pressed", String(ccOn));
      capText = null;
      api.update(state.t);
    });
    const pp = bar.querySelector(".fe-pp");
    const trk = bar.querySelector(".fe-track");
    const fill = trk.querySelector("i");
    const time = bar.querySelector(".fe-time");
    const snd = bar.querySelector(".fe-snd");
    trk.setAttribute("aria-valuemax", String(Math.round(END)));
    let idle = 0;
    const wake = () => {
      document.body.classList.remove("fe-idle");
      clearTimeout(idle);
      idle = setTimeout(() => { if (state.playing) document.body.classList.add("fe-idle"); }, 2600);
    };
    document.addEventListener("pointermove", wake);
    pp.addEventListener("click", (e) => { e.stopPropagation(); enableAudio(); state.playing ? pause() : play(); wake(); });
    snd.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!audio.enabled) { await enableAudio(); return; }
      audio.muted = !audio.muted;
      if (audio.muted) stopSession(); else if (state.playing) startSession(state.t);
      api.sound();
    });
    const seekTo = (clientX) => {
      const r = trk.getBoundingClientRect();
      seek(clamp01((clientX - r.left) / r.width) * END);
    };
    let drag = false;
    trk.addEventListener("pointerdown", (e) => { e.stopPropagation(); enableAudio(); drag = true; trk.setPointerCapture(e.pointerId); seekTo(e.clientX); });
    trk.addEventListener("pointermove", (e) => { if (drag) seekTo(e.clientX); });
    trk.addEventListener("pointerup", () => { drag = false; });
    trk.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { seek(state.t + 5); e.preventDefault(); }
      if (e.key === "ArrowLeft") { seek(state.t - 5); e.preventDefault(); }
    });
    // The first click anywhere turns the sound on; later clicks on the lesson pause and resume.
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".fe-ui")) return;
      if (!audio.enabled) { enableAudio(); return; }
      state.playing ? pause() : play();
      wake();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "k") { e.preventDefault(); enableAudio(); state.playing ? pause() : play(); wake(); }
      if ((e.key === "f" || e.key === "F") && fs.available()) { fs.toggle(); wake(); }
      if (e.key === "Escape" && fs.pseudo) fs.toggle();
    });
    const api = {
      update(t) {
        const done = !state.playing && t >= END - 0.01;
        pp.innerHTML = state.playing ? ICON.pause : done ? ICON.replay : ICON.play;
        pp.setAttribute("aria-label", state.playing ? "Pause" : done ? "Replay" : "Play");
        fill.style.width = ((t / END) * 100).toFixed(3) + "%";
        trk.setAttribute("aria-valuenow", String(Math.round(t)));
        time.textContent = fmt(t) + " / " + fmt(END);
        let text = "";
        if (ccOn) for (const l of lines) if (t >= l.t - 0.1 && t < l.t + l.d + 0.4) text = l.text;
        if (text !== capText) {
          capText = text;
          cap.textContent = text;
          cap.hidden = !text;
        }
        if (!state.playing) wake();
      },
      sound() {
        const on = audio.enabled && !audio.muted;
        snd.innerHTML = on ? ICON.on : ICON.off;
        snd.setAttribute("aria-label", on ? "Mute" : "Turn sound on");
        hint.hidden = audio.enabled;
      },
      full() {
        if (!fsb) return;
        const on = fs.active();
        fsb.innerHTML = on ? ICON.exit : ICON.full;
        fsb.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
      },
    };
    api.sound();
    api.full();
    wake();
    return api;
  })();

  // For tests and frame-by-frame capture: window.lessonPlayer.ready.then(() => { pause(); seek(12.5); }).
  let markReady;
  window.lessonPlayer = {
    duration: END,
    ready: new Promise((r) => { markReady = r; }),
    play, pause, seek,
    time: () => state.t,
    score: () => audio.score,
    // The audio graph, for level checks: music and effects reach `out`, the voice `voiceOut`.
    audioGraph: () => ({ ctx: audio.ctx, out: audio.out, voiceOut: audio.voiceOut }),
    voice: () => ({ lines, loaded: !!audio.voiceBuf, playing: !!(audio.session && audio.session.voice) }),
  };

  // ── Boot ───────────────────────────────────────────────────────────────────
  async function boot() {
    if (F.voice && F.voice.src) {
      audio.voiceData = fetch(F.voice.src).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
    }
    try {
      await Promise.all(F.fontChecks.map((f) => document.fonts.load(f)));
    } catch (e) { /* system fonts stand in */ }
    run("shared.js", makeKit(stage, 0, OLD_END));
    for (const sc of scenes) {
      const box = el("div", { class: "fe-scene" });
      stage.append(box);
      const kit = makeKit(box, sc.oldStart, sc.oldDur);
      run("scene-" + sc.id + ".js", kit);
      const def = defs[sc.id];
      if (def && def.init) await def.init.call(def, kit);
      instances.push({ sc, def, box, kit });
    }
    if (modules["score.js"]) run("score.js", makeKit(stage, 0, OLD_END));
    audio.score = recordScore();
    // Wait (briefly) for the images so the first frames do not pop in.
    const imgs = Array.from(stage.querySelectorAll("img"));
    await Promise.race([
      Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; })))),
      new Promise((r) => setTimeout(r, 4000)),
    ]);
    instances.forEach((inst) => { inst.box.style.display = "none"; });
    renderAt(0);
    document.body.classList.add("fe-ready");
    // A parent page that allows autoplay (iframe allow="autoplay" after a click) gets sound
    // straight away; otherwise the first click turns it on.
    if (setupAudio() && audio.ctx.state === "running") { audio.enabled = true; ui.sound(); }
    play();
    requestAnimationFrame(tick);
    markReady();
  }
  boot().catch((e) => {
    document.querySelector(".fe-loading").textContent = "This lesson could not start. Please reload the page.";
    throw e;
  });
})();

</script>
</body>
</html>
