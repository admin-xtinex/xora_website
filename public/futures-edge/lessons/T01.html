<script>window.FILM = {"id":"T01","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson one","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"ticker","name":"A price on a phone","dur":14,"k":1,"oldStart":8,"oldDur":14},{"id":"money","name":"What money is","dur":20.52,"k":1.14,"oldStart":22,"oldDur":18},{"id":"digital","name":"Digital assets","dur":17.44,"k":1.09,"oldStart":40,"oldDur":16},{"id":"ledger","name":"A shared record","dur":22,"k":1,"oldStart":56,"oldDur":22},{"id":"bitcoin","name":"Meet Bitcoin","dur":18.48,"k":1.32,"oldStart":78,"oldDur":14},{"id":"wallet","name":"No coin in your phone","dur":19.04,"k":1.19,"oldStart":92,"oldDur":16},{"id":"token","name":"Coins and tokens","dur":13.08,"k":1.09,"oldStart":108,"oldDur":12},{"id":"balance","name":"Your balance","dur":23.68,"k":1.48,"oldStart":120,"oldDur":16},{"id":"moves","name":"When price moves","dur":25,"k":1.25,"oldStart":136,"oldDur":20},{"id":"try","name":"Try it","dur":16,"k":1,"oldStart":156,"oldDur":16},{"id":"sort","name":"Crypto or not","dur":16,"k":1,"oldStart":172,"oldDur":16},{"id":"risks","name":"Know the risks","dur":34.32,"k":1.56,"oldStart":188,"oldDur":22},{"id":"recap","name":"Recap","dur":30.6,"k":1.7,"oldStart":210,"oldDur":18},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":228,"oldDur":10}],"voice":{"src":"T01/voice.mp3","lines":[{"t":0.6,"d":4.027,"text":"Lesson one: what is cryptocurrency? Let's start at the very beginning.","ml":"പാഠം ഒന്ന്: എന്താണ് cryptocurrency? നമുക്ക് ഏറ്റവും തുടക്കത്തിൽ നിന്ന് തുടങ്ങാം."},{"t":8.4,"d":3.707,"text":"You've probably seen a screen like this. Prices that never sit still.","ml":"ഇതുപോലൊരു സ്ക്രീൻ നിങ്ങൾ കണ്ടിട്ടുണ്ടാകും. ഒരിക്കലും ഒരിടത്ത് നിൽക്കാത്ത വിലകൾ."},{"t":12.657,"d":6.43,"text":"BTC keeps moving. But what is BTC, really? By the end of this lesson, you'll know.","ml":"BTC മാറിക്കൊണ്ടേയിരിക്കുന്നു. പക്ഷേ ശരിക്കും BTC എന്താണ്? ഈ പാഠം കഴിയുമ്പോൾ നിങ്ങൾക്ക് മനസ്സിലാകും."},{"t":22.456,"d":4.318,"text":"Let's start with money. Money is value that people agree to accept.","ml":"പണത്തിൽ നിന്ന് തുടങ്ങാം. ആളുകൾ സ്വീകരിക്കാൻ സമ്മതിക്കുന്ന മൂല്യമാണ് പണം."},{"t":27.472,"d":3.925,"text":"You hand it over, and you get food, a bus ticket, or rent paid.","ml":"നിങ്ങൾ അത് കൊടുക്കുന്നു, പകരം ഭക്ഷണമോ ബസ് ടിക്കറ്റോ കിട്ടുന്നു, അല്ലെങ്കിൽ വാടക അടയുന്നു."},{"t":31.947,"d":3.941,"text":"And most money today is already just numbers, stored in a bank's computers.","ml":"ഇന്ന് മിക്ക പണവും ബാങ്കിന്റെ കമ്പ്യൂട്ടറുകളിൽ സൂക്ഷിച്ച വെറും അക്കങ്ങളാണ്."},{"t":36.438,"d":4.983,"text":"Value is what something is worth to people. Money is a shared way to store and exchange it.","ml":"ഒരു വസ്തുവിന് ആളുകൾ കാണുന്ന വിലയാണ് മൂല്യം. അത് സൂക്ഷിക്കാനും കൈമാറാനുമുള്ള പൊതുവായ ഒരു വഴിയാണ് പണം."},{"t":42.956,"d":4.343,"text":"A digital asset is anything of value that exists only as digital records.","ml":"ഡിജിറ്റൽ രേഖകളായി മാത്രം നിലനിൽക്കുന്ന, മൂല്യമുള്ള എന്തും ഒരു ഡിജിറ്റൽ അസറ്റാണ്."},{"t":47.849,"d":3.608,"text":"A bank balance. Points in a game. Airline miles.","ml":"ബാങ്ക് ബാലൻസ്. ഗെയിമിലെ പോയിന്റുകൾ. എയർലൈൻ മൈലുകൾ."},{"t":52.007,"d":7.401,"text":"Cryptocurrency is one kind of digital asset, like BTC and ETH. But not every digital asset is crypto.","ml":"Cryptocurrency ഒരുതരം ഡിജിറ്റൽ അസറ്റാണ്, BTC, ETH പോലെ. പക്ഷേ എല്ലാ ഡിജിറ്റൽ അസറ്റും crypto അല്ല."},{"t":60.36,"d":3.637,"text":"Here's the key idea. Say a friend sends you a small amount of crypto.","ml":"പ്രധാന ആശയം ഇതാണ്. ഒരു സുഹൃത്ത് നിങ്ങൾക്ക് കുറച്ച് crypto അയയ്ക്കുന്നു എന്ന് കരുതുക."},{"t":64.56,"d":3.033,"text":"The payment is written into a shared record, called a ledger.","ml":"ആ പേയ്മെന്റ് ഒരു പൊതു രേഖയിൽ എഴുതുന്നു. അതിനെ ലെഡ്ജർ എന്ന് പറയും."},{"t":68.56,"d":3.799,"text":"Many computers around the world keep a copy, and they check each other.","ml":"ലോകമെമ്പാടുമുള്ള ഒരുപാട് കമ്പ്യൂട്ടറുകൾ അതിന്റെ കോപ്പി സൂക്ഷിക്കുന്നു, അവ പരസ്പരം പരിശോധിക്കുന്നു."},{"t":72.909,"d":4.012,"text":"The records are grouped into blocks, linked in order. That's the blockchain.","ml":"രേഖകൾ ബ്ലോക്കുകളായി കൂട്ടി, ക്രമത്തിൽ ബന്ധിപ്പിക്കുന്നു. അതാണ് blockchain."},{"t":77.471,"d":3.003,"text":"So there's no bank in the middle. The network keeps the record.","ml":"അപ്പോൾ നടുവിൽ ബാങ്കില്ല. നെറ്റ്‌വർക്ക് തന്നെയാണ് രേഖ സൂക്ഷിക്കുന്നത്."},{"t":82.488,"d":5.369,"text":"Meet Bitcoin, symbol B T C: the first and best-known cryptocurrency.","ml":"ഇതാ Bitcoin, ചിഹ്നം B T C: ആദ്യത്തേതും ഏറ്റവും പ്രശസ്തവുമായ cryptocurrency."},{"t":88.407,"d":5.008,"text":"It launched in 2009, and no more than twenty-one million bitcoin can ever exist.","ml":"2009-ൽ ആണ് ഇത് തുടങ്ങിയത്. ഇരുപത്തിയൊന്ന് മില്യണിൽ കൂടുതൽ bitcoin ഒരിക്കലും ഉണ്ടാകില്ല."},{"t":93.965,"d":6.061,"text":"One bitcoin can be split into tiny parts, so you can own a small piece, like 0.002 BTC.","ml":"ഒരു bitcoin ചെറിയ ഭാഗങ്ങളായി മുറിക്കാം, അതുകൊണ്ട് 0.002 BTC പോലെ ഒരു ചെറിയ കഷണം സ്വന്തമാക്കാം."},{"t":100.916,"d":3.463,"text":"Here's a common mistake. There is no coin inside your phone.","ml":"സാധാരണ പറ്റുന്ന ഒരു തെറ്റ് ഇതാ. നിങ്ങളുടെ ഫോണിനുള്ളിൽ ഒരു കോയിനും ഇല്ല."},{"t":107.104,"d":6.25,"text":"A wallet holds keys, which prove you control your crypto. The coins themselves are entries on the blockchain.","ml":"വാലറ്റ് സൂക്ഷിക്കുന്നത് കീകളാണ്; crypto നിങ്ങളുടേതാണെന്ന് അവ തെളിയിക്കുന്നു. കോയിനുകൾ blockchain-ലെ എൻട്രികളാണ്."},{"t":113.904,"d":5.128,"text":"On an exchange, the exchange holds the keys for you. Lose your keys, and you can lose access.","ml":"എക്സ്ചേഞ്ചിൽ ആണെങ്കിൽ, കീകൾ നിങ്ങൾക്കായി എക്സ്ചേഞ്ച് സൂക്ഷിക്കുന്നു. കീകൾ നഷ്ടപ്പെട്ടാൽ, ആക്സസും നഷ്ടപ്പെടാം."},{"t":119.916,"d":5.289,"text":"Two words you'll hear: coins and tokens. A coin runs on its own blockchain.","ml":"നിങ്ങൾ കേൾക്കുന്ന രണ്ട് വാക്കുകൾ: കോയിനും ടോക്കണും. ഒരു കോയിൻ സ്വന്തം blockchain-ൽ പ്രവർത്തിക്കുന്നു."},{"t":125.755,"d":5.863,"text":"A token is built on top of an existing one. USDT is a token designed to track the US dollar.","ml":"ടോക്കൺ നിലവിലുള്ള ഒരു blockchain-ന് മുകളിൽ നിർമ്മിച്ചതാണ്. US ഡോളറിനൊപ്പം നിൽക്കാൻ ഉണ്ടാക്കിയ ടോക്കണാണ് USDT."},{"t":133.152,"d":3.614,"text":"Now a worked example. What is my BTC worth?","ml":"ഇനി ഒരു ഉദാഹരണം ചെയ്തുനോക്കാം. എന്റെ BTC-ക്ക് എത്ര മൂല്യമുണ്ട്?"},{"t":137.316,"d":7.096,"text":"Say you hold 0.002 BTC, and one BTC costs 60,000 USDT.","ml":"നിങ്ങളുടെ കൈയിൽ 0.002 BTC ഉണ്ടെന്ന് കരുതുക, ഒരു BTC-യുടെ വില 60,000 USDT."},{"t":144.963,"d":4.758,"text":"Amount times price: 120 USDT. That's all it is.","ml":"അളവ് ഗുണം വില: 120 USDT. അത്രയേ ഉള്ളൂ."},{"t":156.74,"d":2.238,"text":"Now watch what happens when the price moves.","ml":"ഇനി വില മാറുമ്പോൾ എന്ത് സംഭവിക്കുന്നു എന്ന് നോക്കൂ."},{"t":160.74,"d":5.179,"text":"The price rises to 63,000. Your value rises to 126.","ml":"വില 63,000 ആയി ഉയരുന്നു. നിങ്ങളുടെ മൂല്യം 126 ആയി ഉയരുന്നു."},{"t":168.49,"d":4.75,"text":"Then it falls to 57,000. Your value falls to 114.","ml":"പിന്നെ വില 57,000 ആയി താഴുന്നു. നിങ്ങളുടെ മൂല്യം 114 ആയി താഴുന്നു."},{"t":174.74,"d":6.052,"text":"Notice: you still hold the same 0.002 BTC. Only its value changed.","ml":"ശ്രദ്ധിക്കൂ: കൈയിൽ ഇപ്പോഴും അതേ 0.002 BTC ഉണ്ട്. അതിന്റെ മൂല്യം മാത്രമാണ് മാറിയത്."},{"t":181.84,"d":9.536,"text":"Your turn. You hold 0.002 BTC, and the price is 65,000 USDT. What is it worth? Pause if you need more time.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. കൈയിൽ 0.002 BTC, വില 65,000 USDT. എത്ര മൂല്യം? സമയം വേണമെങ്കിൽ പോസ് ചെയ്യൂ."},{"t":191.926,"d":4.451,"text":"The answer: 130 USDT. Well done if you got it.","ml":"ഉത്തരം: 130 USDT. ശരിയാക്കിയെങ്കിൽ, നന്നായി!"},{"t":197.64,"d":2.447,"text":"Quick check: crypto, or not crypto?","ml":"ഒരു ചെറിയ ചെക്ക്: crypto ആണോ, അല്ലയോ?"},{"t":201.24,"d":7.258,"text":"Bitcoin: crypto. Game points: not crypto. Ether: crypto. A bank balance: not crypto.","ml":"Bitcoin: crypto. ഗെയിം പോയിന്റുകൾ: crypto അല്ല. Ether: crypto. ബാങ്ക് ബാലൻസ്: crypto അല്ല."},{"t":209.048,"d":3.779,"text":"And USDT? It counts too. It's a crypto token.","ml":"USDT-യോ? അതും crypto തന്നെ. അതൊരു crypto ടോക്കണാണ്."},{"t":213.864,"d":2.156,"text":"Before you go further, know the risks.","ml":"മുന്നോട്ട് പോകുന്നതിന് മുമ്പ്, റിസ്കുകൾ അറിയുക."},{"t":217.296,"d":5.039,"text":"No government stands behind crypto. If something goes wrong, nobody has to pay you back.","ml":"Crypto-ക്ക് പിന്നിൽ ഒരു സർക്കാരുമില്ല. എന്തെങ്കിലും പ്രശ്നം വന്നാൽ, പണം തിരിച്ചുതരാൻ ആരും ബാധ്യസ്ഥരല്ല."},{"t":224.16,"d":2.833,"text":"Prices can rise or fall a lot in a single day.","ml":"ഒറ്റ ദിവസം കൊണ്ട് വില ഒരുപാട് കൂടുകയോ കുറയുകയോ ചെയ്യാം."},{"t":229.464,"d":4.321,"text":"Lose your keys, or get tricked by a scammer, and your crypto can be gone for good.","ml":"കീകൾ നഷ്ടപ്പെട്ടാലോ, ഒരു തട്ടിപ്പുകാരൻ പറ്റിച്ചാലോ, നിങ്ങളുടെ crypto എന്നെന്നേക്കുമായി പോയേക്കാം."},{"t":235.08,"d":6.539,"text":"And owning BTC is not the same as trading futures, which are contracts about its price. We'll cover those later.","ml":"BTC സ്വന്തമാക്കുന്നതും futures ട്രേഡ് ചെയ്യുന്നതും ഒന്നല്ല. Futures അതിന്റെ വിലയെക്കുറിച്ചുള്ള കരാറുകളാണ്. അത് പിന്നീട് പഠിക്കാം."},{"t":242.169,"d":3.244,"text":"Learn first, and never risk money you can't afford to lose.","ml":"ആദ്യം പഠിക്കുക. നഷ്ടപ്പെട്ടാൽ താങ്ങാനാകാത്ത പണം ഒരിക്കലും റിസ്കിൽ ഇടരുത്."},{"t":248.24,"d":0.758,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":250.28,"d":3.869,"text":"Cryptocurrency is a digital asset recorded on a shared blockchain.","ml":"ഒരു പൊതു blockchain-ൽ രേഖപ്പെടുത്തിയ ഡിജിറ്റൽ അസറ്റാണ് cryptocurrency."},{"t":255.04,"d":3.302,"text":"A wallet holds keys. The coins live on the blockchain.","ml":"വാലറ്റ് സൂക്ഷിക്കുന്നത് കീകൾ. കോയിനുകൾ ഉള്ളത് blockchain-ൽ."},{"t":259.12,"d":5.125,"text":"And value equals amount times price. The amount stays; the value moves.","ml":"മൂല്യം = അളവ് ഗുണം വില. അളവ് അതേപടി നിൽക്കും; മൂല്യം മാറും."},{"t":264.795,"d":6.833,"text":"Check yourself: if BTC falls ten percent, what happens to your 0.002 BTC?","ml":"സ്വയം പരിശോധിക്കൂ: BTC പത്ത് ശതമാനം താഴ്ന്നാൽ, നിങ്ങളുടെ 0.002 BTC-ക്ക് എന്ത് സംഭവിക്കും?"},{"t":272.178,"d":5.506,"text":"You still hold 0.002 BTC. Its value falls by ten percent.","ml":"കൈയിൽ ഇപ്പോഴും 0.002 BTC തന്നെ ഉണ്ട്. അതിന്റെ മൂല്യം പത്ത് ശതമാനം കുറയുന്നു."},{"t":278.76,"d":5.176,"text":"Great start! Next up: why do crypto prices move? See you in lesson two.","ml":"നല്ല തുടക്കം! അടുത്തത്: crypto വിലകൾ എന്തുകൊണ്ട് മാറുന്നു? രണ്ടാം പാഠത്തിൽ കാണാം."}]},"assetBase":"T01/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":331,"h":446},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n","narration.json":"{\n  \"about\": \"T01 voiceover script for ElevenLabs (female tutor voice, warm, clear, unhurried). Each line is generated as its own clip and placed at film time t (seconds). say = spoken form when it differs from text.\",\n  \"model\": \"eleven_multilingual_v2\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson one: what is cryptocurrency? Let's start at the very beginning.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"You've probably seen a screen like this. Prices that never sit still.\"\n    },\n    {\n      \"t\": 12.6,\n      \"text\": \"BTC keeps moving. But what is BTC, really? By the end of this lesson, you'll know.\"\n    },\n    {\n      \"t\": 22.4,\n      \"text\": \"Let's start with money. Money is value that people agree to accept.\"\n    },\n    {\n      \"t\": 26.8,\n      \"text\": \"You hand it over, and you get food, a bus ticket, or rent paid.\"\n    },\n    {\n      \"t\": 29.6,\n      \"text\": \"And most money today is already just numbers, stored in a bank's computers.\"\n    },\n    {\n      \"t\": 33.4,\n      \"text\": \"Value is what something is worth to people. Money is a shared way to store and exchange it.\"\n    },\n    {\n      \"t\": 40.4,\n      \"text\": \"A digital asset is anything of value that exists only as digital records.\"\n    },\n    {\n      \"t\": 44.2,\n      \"text\": \"A bank balance. Points in a game. Airline miles.\"\n    },\n    {\n      \"t\": 48.2,\n      \"text\": \"Cryptocurrency is one kind of digital asset, like BTC and ETH. But not every digital asset is crypto.\"\n    },\n    {\n      \"t\": 56.4,\n      \"text\": \"Here's the key idea. Say a friend sends you a small amount of crypto.\"\n    },\n    {\n      \"t\": 60.6,\n      \"text\": \"The payment is written into a shared record, called a ledger.\"\n    },\n    {\n      \"t\": 64.6,\n      \"text\": \"Many computers around the world keep a copy, and they check each other.\"\n    },\n    {\n      \"t\": 68.8,\n      \"text\": \"The records are grouped into blocks, linked in order. That's the blockchain.\"\n    },\n    {\n      \"t\": 73.0,\n      \"text\": \"So there's no bank in the middle. The network keeps the record.\"\n    },\n    {\n      \"t\": 78.4,\n      \"text\": \"Meet Bitcoin, symbol B T C: the first and best-known cryptocurrency.\"\n    },\n    {\n      \"t\": 82.4,\n      \"text\": \"It launched in 2009, and no more than twenty-one million bitcoin can ever exist.\"\n    },\n    {\n      \"t\": 86.6,\n      \"text\": \"One bitcoin can be split into tiny parts, so you can own a small piece, like 0.002 BTC.\",\n      \"say\": \"One bitcoin can be split into tiny parts, so you can own a small piece, like zero point zero zero two B T C.\"\n    },\n    {\n      \"t\": 92.4,\n      \"text\": \"Here's a common mistake. There is no coin inside your phone.\"\n    },\n    {\n      \"t\": 97.6,\n      \"text\": \"A wallet holds keys, which prove you control your crypto. The coins themselves are entries on the blockchain.\"\n    },\n    {\n      \"t\": 103.0,\n      \"text\": \"On an exchange, the exchange holds the keys for you. Lose your keys, and you can lose access.\"\n    },\n    {\n      \"t\": 108.4,\n      \"text\": \"Two words you'll hear: coins and tokens. A coin runs on its own blockchain.\"\n    },\n    {\n      \"t\": 112.4,\n      \"text\": \"A token is built on top of an existing one. USDT is a token designed to track the US dollar.\",\n      \"say\": \"A token is built on top of an existing one. U S D T is a token designed to track the US dollar.\"\n    },\n    {\n      \"t\": 120.4,\n      \"text\": \"Now a worked example. What is my BTC worth?\"\n    },\n    {\n      \"t\": 122.8,\n      \"text\": \"Say you hold 0.002 BTC, and one BTC costs 60,000 USDT.\",\n      \"say\": \"Say you hold zero point zero zero two B T C, and one B T C costs sixty thousand U S D T.\"\n    },\n    {\n      \"t\": 127.4,\n      \"text\": \"Amount times price: 120 USDT. That's all it is.\",\n      \"say\": \"Amount times price: one hundred and twenty U S D T. That's all it is.\"\n    },\n    {\n      \"t\": 136.4,\n      \"text\": \"Now watch what happens when the price moves.\"\n    },\n    {\n      \"t\": 139.6,\n      \"text\": \"The price rises to 63,000. Your value rises to 126.\",\n      \"say\": \"The price rises to sixty-three thousand. Your value rises to one hundred and twenty-six.\"\n    },\n    {\n      \"t\": 145.8,\n      \"text\": \"Then it falls to 57,000. Your value falls to 114.\",\n      \"say\": \"Then it falls to fifty-seven thousand. Your value falls to one hundred and fourteen.\"\n    },\n    {\n      \"t\": 150.8,\n      \"text\": \"Notice: you still hold the same 0.002 BTC. Only its value changed.\",\n      \"say\": \"Notice: you still hold the same zero point zero zero two B T C. Only its value changed.\"\n    },\n    {\n      \"t\": 156.6,\n      \"text\": \"Your turn. You hold 0.002 BTC, and the price is 65,000 USDT. What is it worth? Pause if you need more time.\",\n      \"say\": \"Your turn. You hold zero point zero zero two B T C, and the price is sixty-five thousand U S D T. What is it worth? Pause if you need more time.\"\n    },\n    {\n      \"t\": 165.2,\n      \"text\": \"The answer: 130 USDT. Well done if you got it.\",\n      \"say\": \"The answer: one hundred and thirty U S D T. Well done if you got it.\"\n    },\n    {\n      \"t\": 172.4,\n      \"text\": \"Quick check: crypto, or not crypto?\"\n    },\n    {\n      \"t\": 176.0,\n      \"text\": \"Bitcoin: crypto. Game points: not crypto. Ether: crypto. A bank balance: not crypto.\"\n    },\n    {\n      \"t\": 183.6,\n      \"text\": \"And USDT? It counts too. It's a crypto token.\",\n      \"say\": \"And U S D T? It counts too. It's a crypto token.\"\n    },\n    {\n      \"t\": 188.4,\n      \"text\": \"Before you go further, know the risks.\"\n    },\n    {\n      \"t\": 190.6,\n      \"text\": \"No government stands behind crypto. If something goes wrong, nobody has to pay you back.\"\n    },\n    {\n      \"t\": 195.0,\n      \"text\": \"Prices can rise or fall a lot in a single day.\"\n    },\n    {\n      \"t\": 198.4,\n      \"text\": \"Lose your keys, or get tricked by a scammer, and your crypto can be gone for good.\"\n    },\n    {\n      \"t\": 202.0,\n      \"text\": \"And owning BTC is not the same as trading futures, which are contracts about its price. We'll cover those later.\"\n    },\n    {\n      \"t\": 205.6,\n      \"text\": \"Learn first, and never risk money you can't afford to lose.\"\n    },\n    {\n      \"t\": 210.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 211.6,\n      \"text\": \"Cryptocurrency is a digital asset recorded on a shared blockchain.\"\n    },\n    {\n      \"t\": 214.4,\n      \"text\": \"A wallet holds keys. The coins live on the blockchain.\"\n    },\n    {\n      \"t\": 216.8,\n      \"text\": \"And value equals amount times price. The amount stays; the value moves.\"\n    },\n    {\n      \"t\": 219.6,\n      \"text\": \"Check yourself: if BTC falls ten percent, what happens to your 0.002 BTC?\",\n      \"say\": \"Check yourself: if B T C falls ten percent, what happens to your zero point zero zero two B T C?\"\n    },\n    {\n      \"t\": 224.2,\n      \"text\": \"You still hold 0.002 BTC. Its value falls by ten percent.\",\n      \"say\": \"You still hold zero point zero zero two B T C. Its value falls by ten percent.\"\n    },\n    {\n      \"t\": 228.6,\n      \"text\": \"Great start! Next up: why do crypto prices move? See you in lesson two.\"\n    }\n  ]\n}\n","scene-balance.js":"const { seg, eo, eob, eio, lerp, TextFx } = kit;\nkit.scene('balance', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const tile = (cls, top, big, small, w, hl) => '<div class=\"glass ' + cls + '\" style=\"position:relative;width:' + w + 'px;padding:24px 30px;' + (hl ? 'border-color:var(--main);background:color-mix(in srgb, var(--ground) 75%, var(--main))' : '') + '\"><p class=\"fict\" style=\"margin:0 0 8px\">' + top + '</p><p class=\"mono ' + cls + '-n\" style=\"margin:0;font-size:56px\">' + big + '</p><p style=\"margin:6px 0 0;font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">' + small + '</p></div>';\n    const op = (cls, s) => '<span class=\"mono ' + cls + '\" style=\"font-size:64px;color:var(--main)\">' + s + '</span>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:1500px\"><p class=\"kick bl-k\">Worked example</p>' +\n      '<h2 class=\"line bl-t\">What is my BTC worth?</h2>' +\n      '<p class=\"sub bl-s\">Value = amount of BTC × price of one BTC</p></div>' +\n      '<div style=\"position:absolute;left:140px;top:500px;display:flex;align-items:center;gap:30px\">' +\n      tile('bl-a', 'Your balance', '0.002 BTC', 'the amount you hold', 330) + op('bl-x', '×') +\n      tile('bl-p', 'Price of 1 BTC', '60,000', 'USDT per BTC', 360) + op('bl-e', '=') +\n      tile('bl-v', 'Value', '120', 'USDT', 330, true) + '</div>' +\n      '<p class=\"fict bl-f\" style=\"position:absolute;left:140px;top:720px;margin:0\">All amounts are fictional examples</p>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.bl-k').style; this.t = q('.bl-t'); this.s = q('.bl-s'); this.f = q('.bl-f').style;\n    this.parts = ['.bl-a', '.bl-x', '.bl-p', '.bl-e', '.bl-v'].map((s) => q(s).style);\n    this.vn = q('.bl-v-n');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 1.0, pose: 'present' }, { t: 7.9, pose: 'thumbs' }, { t: 11.2, pose: 'explain' }],\n      says: [{ t0: 11.4, t1: 15.6, text: 'Amount times price. That is all it is.' }],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.s, t, 1.2, { stagger: 0.06 });\n    const at = [2.6, 4.0, 4.4, 6.4, 6.8];\n    this.parts.forEach((s, i) => {\n      const p = seg(t, at[i], at[i] + 0.6);\n      s.opacity = eo(seg(t, at[i], at[i] + 0.3));\n      s.transform = 'translateY(' + lerp(36, 0, eo(p)) + 'px) scale(' + lerp(0.9, 1, eob(p, 1.6)) + ')';\n    });\n    const v = Math.round(lerp(60, 120, eo(seg(t, 6.9, 7.9))));\n    if (this.vn.textContent !== String(v)) this.vn.textContent = String(v);\n    this.f.opacity = 0.9 * eo(seg(t, 8.4, 9.0));\n    this.tutor.render(t);\n  },\n});\n","scene-bitcoin.js":"const { seg, eo, eob, eio, lerp, TextFx } = kit;\nkit.scene('bitcoin', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const tile = (cls, label) => '<div class=\"glass bt-tile\" style=\"position:relative;width:640px;padding:26px 36px;display:flex;align-items:baseline;gap:24px\"><span class=\"mono ' + cls + '\" style=\"flex:none;font-size:50px;color:var(--main)\"></span><span style=\"flex:1;min-width:0;font-size:26px;font-weight:600;line-height:1.3\">' + label + '</span></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:200px;width:780px\"><p class=\"kick bt-k\">The first cryptocurrency</p>' +\n      '<h2 class=\"line bt-t\">Meet Bitcoin</h2>' +\n      '<p class=\"def bt-d\"><b>Bitcoin</b> is the first and best-known cryptocurrency. Its short symbol is <b>BTC</b erp, TextFx } = kit;\nconst DG_OUT = [['Bank balance', 1150, 290], ['Game coins', 1090, 470], ['Airline miles', 1150, 650]];\nconst DG_IN = [['BTC', 1345, 470], ['ETH', 1430, 560]];\nkit.scene('digital', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const chip = (txt, x, y, cls, extra) => '<span class=\"chip ' + cls + '\" style=\"position:absolute;left:' + x + 'px;top:' + y + 'px;transform:translate(-50%,-50%);font-size:26px;padding:12px 22px;' + (extra || '') + '\">' + txt + '</span>';\n    let chips = '';\n    DG_OUT.forEach((c) => { chips += chip(c[0], c[1], c[2], 'dg-o'); });\n    DG_IN.forEach((c) => { chips += chip(c[0], c[1], c[2], 'dg-i mono', 'background:var(--main);color:var(--ground);border-color:var(--main)'); });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\">' +\n      '<circle class=\"dg-big\" cx=\"1290\" cy=\"450\" r=\"300\" pathLength=\"1\" stroke-width=\"3\" style=\"fill:color-mix(in srgb, var(--main) 5%, transparent);stroke:color-mix(in srgb, var(--second) 40%, transparent)\"/>' +\n      '<circle class=\"dg-small\" cx=\"1385\" cy=\"510\" r=\"135\" pathLength=\"1\" stroke-width=\"4\" style=\"fill:color-mix(in srgb, var(--main) 12%, transparent);stroke:var(--main)\"/>' +\n      '<text class=\"dg-bl\" x=\"1290\" y=\"200\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:30px;font-weight:700\">Digital assets</text>' +\n      '<text class=\"dg-sl\" x=\"1385\" y=\"418\" text-anchor=\"middle\" style=\"fill:var(--main);font-size:24px;font-weight:700\">Cryptocurrency</text></svg>' +\n      chips +\n      '<div class=\"words\" style=\"left:140px;top:200px;width:740px\"><p class=\"kick dg-k\">A bigger family</p>' +\n      '<h2 class=\"line dg-t\">Digital assets</h2>' +\n      '<p class=\"def dg-d\" style=\"margin-top:6px\">A <b>digital asset</b> is anything of value that exists only as digital records.</p>' +\n      '<p class=\"sub dg-s\">Cryptocurrency is one kind of digital     this.ring.opacity = eo(r) * (1 - ei(seg(t, 8.8, 9.3)));\n    const cd = seg(t, 3.6, 8.6);\n    this.arc.setAttribute('stroke-dashoffset', (TRY_C * cd).toFixed(1));\n    const left = Math.max(0, Math.ceil(5 - (t - 3.6)));\n    const txt = t < 3.6 ? '' : String(Math.min(5, left));\n    if (this.n.textContent !== txt) this.n.textContent = txt;\n    this.pause.opacity = t < 3.6 ? 1 : 0;\n    this.hint.opacity = eo(seg(t, 5.2, 5.8)) * (1 - ei(seg(t, 8.8, 9.3)));\n    const a = seg(t, 9.0, 9.7);\n    this.a.opacity = eo(a);\n    this.a.transform = 'scale(' + lerp(0.92, 1, eob(a, 1.6)) + ')';\n    this.a.transformOrigin = '0 50%';\n    this.tutor.render(t);\n  },\n});\n","scene-wallet.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nkit.scene('wallet', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"glass wl-phone\" style=\"left:1000px;top:190px;width:270px;height:470px;border-radius:44px\"><div style=\"width:80px;height:7px;border-radius:7px;margin:26px auto 0;background:color-mix(in srgb, var(--second) 18%, transparent)\"></div>' +\n      '<p style=\"margin:20px 0 0;text-align:center;font-size:24px;font-weight:700\">My wallet</p></div>' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\">' +\n      '<line class=\"wl-link\" x1=\"1180\" y1=\"420\" x2=\"1400\" y2=\"420\" pathLength=\"1\" stroke-width=\"4\" stroke-linecap=\"round\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"wl-coin\"><circle cx=\"1135\" cy=\"420\" r=\"70\" stroke-width=\"6\" style=\"fill:color-mix(in srgb, var(--ground) 70%, var(--main));stroke:var(--main)\"/><text x=\"1135\" y=\"432\" text-anchor=\"middle\" class=\"mono\" style=\"fill:var(--second);font-size:34px\">BTC</text></g>' +\n      '<g class=\"wl-x\" stroke-width=\"10\" stroke-linecap=\"round\" style=\"stroke:var(--accent)\"><line x1=\"1075\" y1=\"360\" x2=\"1195\" y2=\"480\"/><line x1=\"1195\" y1=\"360\" x2=\"1075\" y2=\"480\"/></g>' +\n      '<g class=\"wl-key\" fill=\"none\" stroke-width=\"10\" stroke-linecap=\"round\" style=\"stroke:var(--main)\"><circle cx=\"1105\" cy=\"420\" r=\"30\"/><line x1=\"1135\" y1=\"420\" x2=\"1185\" y2=\"420\"/><line x1=\"1165\" y1=\"420\" x2=\"1165\" y2=\"442\"/><line x1=\"1182\" y1=\"420\" x2=\"1182\" y2=\"436\"/></g></svg>' +\n      '<div class=\"glass wl-book\" style=\"left:1400px;top:330px;width:330px;padding:22px 26px;display:flex;flex-direction:column;gap:10px\"><p class=\"kick\" style=\"margin:0;font-size:18px\">Blockchain record</p>' +\n      '<div class=\"mono\" style=\"font-size:22px;color:color-mix(in srgb, var(--second) 55%, var(--ground))\">Ben · 0.150 BTC</div><div class=\"mono wl-me\" style=\"font-size:22px\">You · 0.002 BTC</div><div class=\"mono\" style=\"font-size:22px;color:color-mix(in srgb, var(--second) 55%, var(--ground))\">Cai · 1.300 BTC</div></div>' +\n      '<div class=\"words\" style=\"left:140px;top:200px;width:780px\"><p class=\"kick wl-k\" style=\"color:var(--accent)\">Common mistake</p>' +\n      '<h2 class=\"line wl-t\">There is no coin inside your phone</h2>' +\n      '<p class=\"def wl-d\">A <b>wallet</b> holds the keys that prove you control your crypto. The coins are entries on the blockchain.</p>' +\n      '<p class=\"sub wl-s\">On an exchange, the exchange holds the keys for you.</p></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.wl-k').style; this.t = q('.wl-t'); this.d = q('.wl-d'); this.s = q('.wl-s');\n    this.phone = q('.wl-phone').style; this.coin = q('.wl-coin').style; this.x = q('.wl-x'); this.key = q('.wl-key').style;\n    this.link = q('.wl-link'); this.book = q('.wl-book').style; this.me = q('.wl-me').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 1.2, pose: 'confused' }, { t: 5.6, pose: 'explain' }, { t: 11.2, pose: 'think' }],\n      says: [{ t0: 11.4, t1: 15.6, text: 'Lose the keys, and you can lose access.' }],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    const ph = seg(t, 0.6, 1.4);\n    this.phone.opacity = eo(ph);\n    this.phone.transform = 'translateY(' + lerp(40, 0, eo(ph)) + 'px)';\n    const c = seg(t, 1.2, 1.8), cx = seg(t, 3.6, 4.2);\n    this.coin.opacity = eo(c) * (1 - ei(seg(t, 4.4, 5.0)));\n    this.coin.transformBox = 'fill-box'; this.coin.transformOrigin = 'center';\n    this.coin.transform = 'scale(' + lerp(0.4, 1, eob(c, 1.7)) * lerp(1, 0.6, ei(seg(t, 4.4, 5.0))) + ')';\n    this.x.setAttribute('stroke-dasharray', '170'); this.x.setAttribute('stroke-dashoffset', (170 * (1 - eo(cx))).toFixed(1));\n    this.x.style.opacity = 1 - ei(seg(t, 4.4, 5.0));\n    const k = seg(t, 5.0, 5.6);\n    this.key.opacity = eo(k);\n    this.key.transformBox = 'fill-box'; this.key.transformOrigin = 'center';\n    this.key.transform = 'rotate(' + lerp(-30, 0, eob(k, 1.6)) + 'deg) scale(' + lerp(0.5, 1, eob(k, 1.7)) + ')';\n    const b = seg(t, 5.8, 6.5);\n    this.book.opacity = eo(b);\n    this.book.transform = 'translateX(' + lerp(40, 0, eo(b)) + 'px)';\n    this.link.setAttribute('stroke-dasharray', eio(seg(t, 6.6, 7.4)) + ' 1');\n    const m = seg(t, 7.3, 7.8);\n    this.me.color = m > 0 ? 'var(--main)' : 'var(--second)';\n    this.me.transform = 'scale(' + (1 + 0.06 * Math.sin(Math.PI * m)) + ')';\n    this.me.transformOrigin = '0 50%';\n    TextFx.fadeFromRight(this.d, t, 7.6, { stagger: 0.05 });\n    TextFx.fadeFromRight(this.s, t, 10.6, { stagger: 0.07 });\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson one\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 1, lesson T01, What is cryptocurrency; the tutor walks in.\"\n    },\n    {\n      \"id\": \"ticker\",\n      \"name\": \"A price on a phone\",\n      \"dur\": 14,\n      \"desc\": \"A phone shows a fictional BTC price ticking; the question: what is this?\"\n    },\n    {\n      \"id\": \"money\",\n      \"name\": \"What money is\",\n      \"dur\": 18,\n      \"desc\": \"Cash turns into a bank balance: money is value people agree to accept, and most of it is already digital.\"\n    },\n    {\n      \"id\": \"digital\",\n      \"name\": \"Digital assets\",\n      \"dur\": 16,\n      \"desc\": \"Definition of a digital asset, with examples that are and are not crypto.\"\n    },\n    {\n      \"id\": \"ledger\",\n      \"name\": \"A shared record\",\n      \"dur\": 22,\n      \"desc\": \"Cryptocurrency defined: a payment is written to a public ledger copied across many computers, with no bank in the middle.\"\n    },\n    {\n      \"id\": \"bitcoin\",\n      \"name\": \"Meet Bitcoin\",\n      \"dur\": 14,\n      \"desc\": \"Bitcoin, symbol BTC: the first cryptocurrency, launched in 2009, with a maximum of 21 million coins.\"\n    },\n    {\n      \"id\": \"wallet\",\n      \"name\": \"No coin in your phone\",\n      \"dur\": 16,\n      \"desc\": \"The misconception: a wallet holds keys, not coins; the coins are entries on the ledger.\"\n    },\n    {\n      \"id\": \"token\",\n      \"name\": \"Coins and tokens\",\n      \"dur\": 12,\n      \"desc\": \"Coins run their own blockchain; tokens like USDT are built on top of existing ones.\"\n    },\n    {\n      \"id\": \"balance\",\n      \"name\": \"Your balance\",\n      \"dur\": 16,\n      \"desc\": \"A fictional 0.002 BTC balance; its value is amount times price: 120 USDT.\"\n    },\n    {\n      \"id\": \"moves\",\n      \"name\": \"When price moves\",\n      \"dur\": 20,\n      \"desc\": \"The price moves up and down; the BTC amount stays the same while its value changes.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 16,\n      \"desc\": \"Pause and calculate: 0.002 BTC at 65,000 USDT; the answer 130 USDT is revealed.\"\n    },\n    {\n      \"id\": \"sort\",\n      \"name\": \"Crypto or not\",\n      \"dur\": 16,\n      \"desc\": \"Five items are sorted into crypto and not crypto.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the risks\",\n      \"dur\": 22,\n      \"desc\": \"No government guarantee, volatile prices, lost keys and scams; owning coins is not the same as a futures contract.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 18,\n      \"desc\": \"Three key points and one question to check yourself.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T02, why do crypto prices move.\"\n    }\n  ]\n}\n","score.js":"kit.score(function (S, T) {\n  // A quiet bed for a lesson that will carry a voiceover: pad and soft keys, a light pulse in the hands-on parts.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.balance, T.risks) || inR(s, T.ticker, T.money);\n  const quiet = (s) => inR(s, T.risks, T.recap) || inR(s, T.wallet, T.token);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 36 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 50 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  [[T.title, 2.9], [T.ticker, 8.8], [T.money, 13.2], [T.digital, 11.4], [T.ledger, 17.4], [T.bitcoin, 9.4], [T.wallet, 11.4], [T.token, 8.4], [T.balance, 11.4], [T.moves, 14.6], [T.try, 0.8], [T.try, 12.2], [T.sort, 12.5], [T.risks, 16.8], [T.next, 1.3]]\n    .forEach((b) => S.fx('pop', b[0] + b[1], { vel: 26, pitch: 7 }));\n  S.fx('whoosh', T.ledger + 3.2, { dur: 1.2, vel: 24 }); S.fx('ding', T.ledger + 4.4, { vel: 34 });\n  for (let i = 0; i < 6; i++) S.fx('tick', T.ledger + 9.4 + i * 0.25, { vel: 26 });\n  for (let i = 0; i < 3; i++) S.fx('pop', T.ledger + 12.8 + i * 0.45, { vel: 32 });\n  for (let i = 0; i < 3; i++) S.fx('pop', T.bitcoin + 2.0 + i * 1.6, { vel: 34 });\n  S.fx('thud', T.wallet + 3.6, { vel: 30 }); S.fx('chime', T.wallet + 5.0, { vel: 34 });\n  S.fx('ding', T.balance + 7.9, { vel: 40 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 3.6 + i, { vel: 30 });\n  S.fx('chime', T.try + 9.0, { vel: 42 });\n  for (let i = 0; i < 5; i++) S.fx('pop', T.sort + 1.6 + i * 2.2 + 2.0, { vel: 36 });\n  for (let i = 0; i < 4; i++) S.fx('pop', T.risks + 1.2 + i * 3.4, { vel: 30 });\n  for (let i = 0; i < 3; i++) S.fx('pop', T.recap + 1.9 + i * 2.4, { vel: 34 });\n  S.fx('ding', T.recap + 14.2, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 20, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T01 · What is cryptocurrency?',\n  TOTAL: 238,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px
