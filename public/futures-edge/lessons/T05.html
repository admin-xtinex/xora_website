<script>window.FILM = {"id":"T05","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson five","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"Two directions","dur":14,"k":1,"oldStart":8,"oldDur":14},{"id":"buysell","name":"Spot buy and sell","dur":25,"k":1,"oldStart":22,"oldDur":25},{"id":"own","name":"Owning vs a position","dur":21,"k":1,"oldStart":47,"oldDur":21},{"id":"long","name":"Going long","dur":27,"k":1,"oldStart":68,"oldDur":27},{"id":"short","name":"Going short","dur":29,"k":1,"oldStart":95,"oldDur":29},{"id":"meters","name":"One price, two results","dur":24,"k":1,"oldStart":124,"oldDur":24},{"id":"mistake","name":"Spot is not margin","dur":34,"k":1,"oldStart":148,"oldDur":34},{"id":"choose","name":"Long, short or wait","dur":24,"k":1,"oldStart":182,"oldDur":24},{"id":"try","name":"Try it","dur":20,"k":1,"oldStart":206,"oldDur":20},{"id":"risks","name":"Know the risks","dur":28,"k":1,"oldStart":226,"oldDur":28},{"id":"recap","name":"Recap","dur":29,"k":1,"oldStart":254,"oldDur":29},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":283,"oldDur":10}],"voice":{"src":null,"lines":[{"t":0.6,"d":7.15,"text":"Lesson five: buy, sell, long and short. Welcome to Phase 2."},{"t":8.4,"d":6.15,"text":"BTC's price goes up, and it goes down. Most people only think about one direction."},{"t":14.8,"d":6.95,"text":"Can someone gain when the price falls? With a short position, yes. Let's see how."},{"t":22.4,"d":5.75,"text":"First, spot trading. Buying spot means you pay USDT now and receive real BTC."},{"t":28.4,"d":5.15,"text":"Like buying gold at a shop: you pay, and the gold is yours to keep."},{"t":33.8,"d":5.95,"text":"You pay 600 USDT for 0.01 BTC at 60,000. Your USDT goes down, your BTC goes up."},{"t":40,"d":6.75,"text":"Selling spot is the reverse. Sell the 0.01 BTC at 62,000, and you get 620 USDT back."},{"t":47.4,"d":6.15,"text":"Spot is ownership. The BTC is yours, and its value rises and falls with the price."},{"t":53.8,"d":6.05,"text":"Futures are different. A futures contract is an agreement about an asset's price."},{"t":60.1,"d":7.65,"text":"Opening one gives you a position: you gain or lose as the price moves, but you own no BTC."},{"t":68.4,"d":5.05,"text":"Going long means opening a position that gains if the price rises."},{"t":73.7,"d":7.45,"text":"Like agreeing today to buy a crate of mangoes at today's price. If prices rise, your deal is worth more."},{"t":81.4,"d":6.35,"text":"Long 0.01 BTC at 60,000. If the price rises to 61,000, you gain 1,000 × 0.01 = 10 USDT."},{"t":88,"d":6.75,"text":"But if it falls to 59,000, you lose 10 USDT. A long loses when the price falls."},{"t":95.4,"d":5.05,"text":"Going short means opening a position that gains if the price falls."},{"t":100.7,"d":6.85,"text":"Like a shopkeeper who agrees today to sell rice next week at today's price, before she buys it."},{"t":107.8,"d":7.05,"text":"If rice gets cheaper, she buys it for less and keeps the difference. If it gets dearer, she loses."},{"t":115.1,"d":8.65,"text":"Short 0.01 BTC at 60,000. A fall to 59,000 gains 10 USDT. A rise to 61,000 loses 10 USDT."},{"t":124.4,"d":5.35,"text":"Now watch one price, with a long and a short opened at the same 60,000."},{"t":130,"d":5.45,"text":"The price climbs to 61,500. The long shows +15 USDT, the short −15 USDT."},{"t":135.7,"d":4.85,"text":"Then the market reverses and falls to 58,500. The results flip."},{"t":140.8,"d":6.95,"text":"Now the long is down 15 USDT and the short is up 15. Same move, opposite results."},{"t":148.4,"d":5.75,"text":"A common mistake: thinking buying spot is the same as going long with margin."},{"t":154.4,"d":6.95,"text":"Spot: you pay the full 600 USDT and own 0.01 BTC. If the price drops, you still hold the coins."},{"t":161.6,"d":6.45,"text":"Margin is a deposit that lets you hold a bigger futures position. Losses come out of it."},{"t":168.3,"d":6.25,"text":"If losses eat that deposit, the exchange can close your position. That's liquidation."},{"t":174.8,"d":6.95,"text":"And selling coins you own is not shorting. A short is a new position that gains if price falls."},{"t":182.4,"d":5.95,"text":"Your call. Long, short, or wait? Pick one in your head before the price moves."},{"t":188.6,"d":4.75,"text":"Here's the move: up first, then down, ending at 59,800."},{"t":193.6,"d":5.65,"text":"Long: minus 2 USDT. Short: plus 2 USDT. Wait: nothing gained, nothing lost."},{"t":199.5,"d":6.25,"text":"Nobody knows the next move for sure. Choosing to wait is always allowed."},{"t":206.4,"d":7.75,"text":"Your turn. A short of 0.02 BTC at 60,000. The price rises to 60,500. Profit or loss? Pause if needed."},{"t":214.4,"d":5.35,"text":"A loss of 10 USDT. A short loses when the price rises: 500 × 0.02 = 10."},{"t":220,"d":5.75,"text":"That's before fees. Well done if you said loss: that's the key idea."},{"t":226.3,"d":2.45,"text":"Before we go on, the risks."},{"t":229,"d":5.25,"text":"A price can keep rising, so a short's possible loss has no fixed limit."},{"t":234.5,"d":5.35,"text":"Margin and leverage make losses bigger too, and can lead to liquidation."},{"t":240.1,"d":7.25,"text":"Fees come out of every result. Futures also have funding: regular payments between longs and shorts."},{"t":247.6,"d":6.15,"text":"And no one can promise the next move. Waiting is always a valid choice."},{"t":254.2,"d":1.45,"text":"Let's recap."},{"t":255.9,"d":4.85,"text":"Spot buying means owning the coin. Selling spot means exiting it."},{"t":261,"d":4.75,"text":"A long gains when the price rises. A short gains when it falls."},{"t":266,"d":5.35,"text":"Futures use margin and can be liquidated. And waiting is always allowed."},{"t":271.6,"d":5.55,"text":"Check yourself: BTC falls 1,000 USDT. Which position gains, long or short?"},{"t":277.4,"d":5.35,"text":"The short gains. The long loses. Same move, opposite sides."},{"t":283.6,"d":9.15,"text":"Next up, T06: entry, exit, and how to work out profit and loss. See you there!"}]},"assetBase":"T05/assets/","assets":{"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-candles.webp":{"mime":"image/webp","w":257,"h":160},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"xtinex-x.png":{"mime":"image/png","w":320,"h":205}},"fontChecks":["400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, tra "Spot buying means owning the coin. Selling spot means exiting it.\"\n    },\n    {\n      \"t\": 261,\n      \"text\": \"A long gains when the price rises. A short gains when it falls.\"\n    },\n    {\n      \"t\": 266,\n      \"text\": \"Futures use margin and can be liquidated. And waiting is always allowed.\"\n    },\n    {\n      \"t\": 271.6,\n      \"text\": \"Check yourself: BTC falls 1,000 USDT. Which position gains, long or short?\"\n    },\n    {\n      \"t\": 277.4,\n      \"text\": \"The short gains. The long loses. Same move, opposite sides.\"\n    },\n    {\n      \"t\": 283.6,\n      \"text\": \"Next up, T06: entry, exit, and how to work out profit and loss. See you there!\"\n    }\n  ]\n}\n","scene-buysell.js":"const { seg, eo, ei, eob, eio, lerp, clamp01, TextFx } = kit;\nkit.scene('buysell', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const row = (label, cls) => '<div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:14px 0;border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent)\"><span style=\"font-size:28px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">' + label + '</span><span class=\"mono ' + cls + '\" style=\"font-size:46px\"></span></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:800px\"><p class=\"kick bs-k\">Spot trading</p>' +\n      '<h2 class=\"line bs-t\">Buy and sell spot</h2>' +\n      '<p class=\"def bs-d\"><b>Buying spot:</b> you pay USDT now and receive the actual BTC. <b>Selling spot:</b> you hand the BTC back and get USDT.</p></div>' +\n      '<div class=\"glass bs-an\" style=\"left:140px;top:610px;width:800px;padding:24px 32px;display:flex;align-items:center;gap:28px\">' +\n      '<svg width=\"110\" height=\"70\" viewBox=\"0 0 110 70\" style=\"flex:none\"><path d=\"M18 62 L32 14 H78 L92 62 Z\" style=\"fill:color-mix(in srgb, #f5c542 70%, var(--ground));stroke:#f5c542;stroke-width:3\"/><path d=\"M40 24 H70\" style=\"stroke:color-mix(in srgb, #fff 60%, transparent);stroke-width:4;stroke-linecap:round\"/></svg>' +\n      '<p style=\"margin:0;font-size:30px;line-height:1.4;font-weight:600\">Like buying gold at a shop: you pay, and the gold is <span class=\"hl\">yours to keep</span>.</p></div>' +\n      '<div class=\"glass bs-acc\" style=\"left:1040px;top:190px;width:560px;padding:26px 34px\">' +\n      '<div style=\"display:flex;justify-content:space-between;align-items:baseline\"><p class=\"kick\" style=\"margin:0\">Your spot account</p><p class=\"fict\" style=\"margin:0\">Fictional</p></div>' +\n      row('USDT', 'bs-u') + row('BTC', 'bs-b') +\n      '<div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 0\"><span style=\"font-size:28px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">BTC price</span><span class=\"mono bs-p\" style=\"font-size:36px;color:var(--main)\"></span></div></div>' +\n      '<div style=\"position:absolute;left:1040px;top:610px;display:flex;gap:18px\"><span class=\"chip bs-buy\" style=\"font-size:28px;padding:14px 26px\">Buy 0.01 BTC</span><span class=\"chip bs-sell\" style=\"font-size:28px;padding:14px 26px\">Sell 0.01 BTC</span></div>' +\n      '<p class=\"mono bs-r1\" style=\"position:absolute;left:1040px;top:700px;margin:0;font-size:28px\">Paid 0.01 × 60,000 = 600 USDT</p>' +\n      '<p class=\"mono bs-r2\" style=\"position:absolute;left:1040px;top:700px;margin:0;font-size:28px\">Got 0.01 × 62,000 = <span class=\"hl\">620 USDT</span></p>' +\n      '<p class=\"bs-r3\" style=\"position:absolute;left:1040px;top:752px;margin:0;font-size:28px;font-weight:600;color:var(--main)\">+20 USDT vs the start, before fees</p>' +\n      '<div class=\"bs-fly\" style=\"position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;background:color-mix(in srgb, var(--main) 35%, var(--ground));border:2px solid var(--main)\">USDT</div>' +\n      '<div class=\"bs-fly2\" style=\"position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;background:color-mix(in srgb, var(--accent) 35%, var(--ground));border:2px solid var(--accent)\">BTC</div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.bs-k').style; this.t = q('.bs-t'); this.d = q('.bs-d'); this.an = q('.bs-an').style; this.acc = q('.bs-acc').style;\n    this.u = q('.bs-u'); this.b = q('.bs-b'); this.p = q('.bs-p');\n    this.buy = q('.bs-buy').style; this.sell = q('.bs-sell').style; this.r1 = q('.bs-r1').style; this.r2 = q('.bs-r2').style; this.r3 = q('.bs-r3').style;\n    this.f1 = q('.bs-fly').style; this.f2 = q('.bs-fly2').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'idea' }, { t: 0.6, pose: 'explain' }, { t: 6.4, pose: 'present' }, { t: 11.8, pose: 'point', flip: true }, { t: 21.4, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.d, t, 1.2, { stagger: 0.05 });\n    const ap = seg(t, 6.4, 7.0);\n    this.an.opacity = eo(ap); this.an.transform = 'translateY(' + lerp(30, 0, eo(ap)).toFixed(1) + 'px)';\n    const cp = seg(t, 0.8, 1.6);\n    this.acc.opacity = eo(cp); this.acc.transform = 'translateY(' + lerp(30, 0, eo(cp)).toFixed(1) + 'px)';\n    // Buy at 60,000, then the price moves to 62,000 and the BTC is sold.\n    const bu = eio(seg(t, 12.4, 13.6)), bb = eio(seg(t, 13.0, 14.0));\n    const su = eio(seg(t, 19.9, 21.1)), sb = eio(seg(t, 19.6, 20.6));\n    const usdt = lerp(lerp(1000, 400, bu), 1020, su), btc = lerp(lerp(0, 0.01, bb), 0, sb);\n    const ut = UI.fmt(usdt, 2), bt = btc.toFixed(4), price = Math.round(lerp(60000, 62000, eio(seg(t, 17.9, 19.1))) / 10) * 10, pt = UI.fmt(price);\n    if (this.u.textContent !== ut) this.u.textContent = ut;\n    if (this.b.textContent !== bt) this.b.textContent = bt;\n    if (this.p.textContent !== pt) this.p.textContent = pt;\n    this.u.style.color = (t > 12.4 && t < 13.8) || (t > 19.9 && t < 21.3) ? 'var(--main)' : 'var(--second)';\n    this.b.style.color = (t > 13.0 && t < 14.2) || (t > 19.6 && t < 20.8) ? 'var(--accent)' : 'var(--second)';\n    const chipIn = seg(t, 1.8, 2.3);\n    const hot = (s, a, b) => { const on = t >= a && t < b; s.opacity = eo(chipIn) * (on ? 1 : 0.55); s.background = on ? 'var(--main)' : ''; s.color = on ? 'var(--ground)' : ''; s.borderColor = on ? 'var(--main)' : ''; s.transform = 'scale(' + (1 + 0.06 * Math.sin(Math.PI * seg(t, a, a + 0.4))).toFixed(4) + ')'; };\n    hot(this.buy, 11.8, 17.9); hot(this.sell, 19.4, 25);\n    this.r1.opacity = eo(seg(t, 13.8, 14.3)) * (1 - eo(seg(t, 19.2, 19.5)));\n    this.r2.opacity = eo(seg(t, 21.0, 21.5)); this.r3.opacity = eo(seg(t, 21.6, 22.1));\n    // A USDT coin leaves the account and a BTC coin arrives (buy); then the reverse (sell).\n    const fly = (s, a, from, to) => { const p = seg(t, a, a + 1.0); s.opacity = p > 0 && p < 1 ? Math.sin(Math.PI * p) * 1.4 : 0; s.transform = 'translate(' + lerp(from[0], to[0], eio(p)).toFixed(1) + 'px,' + (lerp(from[1], to[1], eio(p)) - Math.sin(Math.PI * p) * 60).toFixed(1) + 'px)'; };\n    const U = [1540, 300], Bt = [1540, 390], M = [1700, 230];\n    if (t < 16) { fly(this.f1, 12.2, U, M); fly(this.f2, 12.9, M, Bt); } else { fly(this.f2, 19.5, Bt, M); fly(this.f1, 19.9, M, U); }\n    this.tutor.render(t);\n  },\n});\n","scene-choose.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst CH = [['Long', 'gains if the price rises', 1], ['Short', 'gains if the price falls', -1], ['Wait', 'no position, no result', 0]];\nkit.scene('choose', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let cards = '';\n    CH.forEach((c, i) => {\n      cards += '<div class=\"glass ch-c\" style=\"left:' + (140 + i * 330) + 'px;top:330px;width:300px;height:250px;padding:24px 28px\">' +\n        '<p class=\"mono\" style=\"margin:0;font-size:44px;color:' + (c[2] > 0 ? 'var(--main)' : c[2] < 0 ? 'var(--accent)' : 'var(--second)') + '\">' + c[0].toUpperCase() + '</p>' +\n        '<p style=\"margin:6px 0 0;font-size:26px;line-height:1.3;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">' + c[1] + '</p>' +\n        '<p class=\"mono ch-v\" style=\"margin:22px 0 0;font-size:38px\"></p></div>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1000px\"><p class=\"kick ch-k\">Your call · 0.01 BTC at 60,000</p>' +\n      '<h2 class=\"line ch-t\">Long, short or wait?</h2></div>' + cards +\n      '<div class=\"glass ch-n\" style=\"left:140px;top:620px;width:960px;padding:22px 32px\"><p style=\"margin:0;font-size:30px;font-weight:600;line-height:1.4\">Nobody knows the next move for sure. <span class=\"hl\">WAIT is always a valid choice.</span></p></div>' +\n      '</div>'));\n    this.ring = UI.ring(kit, 1390, 470, 84, 1.4, 1.8, 4, 6.4, 'Pick one');\n    this.chart = UI.chart(kit, { x0: 1180, x1: 1530, y0: 340, y1: 600, lo: 59500, hi: 60500, step: 500, t0: 6.4, t1: 11.4,\n      keys: [[6.4, 60000], [7.9, 60400], [10.0, 59600], [11.2, 59800], [24, 59800]], entry: 60000, entryLabel: 'Start', tag: true, label: 'Fictional path' });\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.ch-k').style; this.t = q('.ch-t'); this.n = q('.ch-n').style;\n    this.cards = all('.ch-c').map((e) => e.style); this.vs = all('.ch-v');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'think' }, { t: 6.6, pose: 'candles' }, { t: 11.6, pose: 'explain' }, { t: 17.5, pose: 'calm' }],\n      says: [{ t0: 18.0, t1: 23.4, text: 'Waiting is fine.' }],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    const P = Math.round(this.chart.price(t) / 10) * 10;\n    this.cards.forEach((c, i) => {\n      const a = 0.8 + i * 0.3, p = seg(t, a, a + 0.6);\n      c.opacity = eo(seg(t, a, a + 0.3));\n      const done = eo(seg(t, 11.6, 12.1)), wait = i === 2 ? eo(seg(t, 17.5, 18.0)) : 0;\n      c.transform = 'translateY(' + lerp(30, 0, eo(p)).toFixed(1) + 'px) scale(' + (1 + 0.04 * Math.sin(Math.PI * seg(t, 11.6 + i * 0.25, 12.2 + i * 0.25)) + 0.03 * wait).toFixed(4) + ')';\n      const v = CH[i][2] * (P - 60000) * 0.01;\n      const txt = t < 6.4 ? '' : UI.sgn(v, 2) + ' USDT';\n      if (this.vs[i].textContent !== txt) this.vs[i].textContent = txt;\n      this.vs[i].style.color = v > 0.004 ? 'var(--main)' : v < -0.004 ? 'var(--accent)' : 'var(--second)';\n      c.borderColor = wait ? 'color-mix(in srgb, var(--main) ' + (22 + 60 * wait).toFixed(0) + '%, transparent)' : (done && i < 2 ? (v > 0 ? 'var(--main)' : 'var(--accent)') : '');\n    });\n    this.ring(t);\n    this.chart.render(t, eo(seg(t, 6.2, 6.7)));\n    const np = seg(t, 17.5, 18.1);\n    this.n.opacity = eo(np); this.n.transform = 'translateY(' + lerp(24, 0, eo(np)).toFixed(1) + 'px)';\n    this.tutor.render(t);\n  },\n});\n","scene-hook.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nkit.scene('hook', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:200px;width:760px\"><p class=\"kick hk-k\">Two directions</p>' +\n      '<h2 class=\"line hk-t\">Prices move both ways</h2>' +\n      '<p class=\"sub hk-s\">Most people only think about the price going up.</p>' +\n      '<p class=\"def hk-q\" style=\"margin-top:10px\">Can anyone <b>gain when the price falls?</b></p></div>' +\n      '<span class=\"chip hk-up\" ').style; this.m = q('.lg-m'); this.g = q('.lg-g'); this.l = q('.lg-l');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, { keys: [{ t: 0, x: C.x, y: C.y, s: C.s }], poses: LG.poses, says: LG.says });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.d, t, 1.2, { stagger: 0.05 });\n    // Analogy card, then the chart and meter in its place.\n    const ai = seg(t, 5.5, 6.2), ao = seg(t, LG.swap, LG.swap + 0.5);\n    this.an.opacity = eo(ai) * (1 - ei(ao));\n    this.an.transform = 'translateY(' + lerp(30, 0, eo(ai)).toFixed(1) + 'px) scale(' + lerp(1, 0.94, ei(ao)).toFixed(4) + ')';\n    const mk = (keys) => { let v = keys[0][1]; for (let i = 1; i < keys.length; i++) v = lerp(v, keys[i][1], eio(seg(t, keys[i - 1][0], keys[i][0]))); return v; };\n    let mv = mk(LG.mk);\n    if (LG.mk2) mv = lerp(mv, LG.mk2[1][1], eio(seg(t, LG.mk2[0][0], LG.mk2[1][0])));\n    const mt = String(Math.round(mv));\n    if (this.m.textContent !== mt) this.m.textContent = mt;\n    this.m.style.color = Math.round(mv) === 100 || Math.round(mv) === 50 ? 'var(--second)' : 'var(--main)';\n    TextFx.fadeFromRight(this.g, t, LG.a1, { stagger: 0.06 });\n    TextFx.fadeFromRight(this.l, t, LG.a2, { stagger: 0.06 });\n    const ci = eo(seg(t, LG.swap + 0.3, LG.swap + 0.9));\n    this.chart.render(t, ci);\n    this.meter.style.opacity = ci; this.meter.style.transform = 'translateY(' + lerp(24, 0, ci).toFixed(1) + 'px)';\n    const P = this.chart.price(t), pnl = LG.dir * (P - 60000) * 0.01;\n    this.meter.set(Math.round(pnl * 100) / 100);\n    const fi = seg(t, LG.swap + 0.6, LG.swap + 1.2);\n    this.f.opacity = eo(fi); this.f.transform = 'translateY(' + lerp(24, 0, eo(fi)).toFixed(1) + 'px)';\n    const Pr = Math.round(P / 10) * 10, v = LG.dir * (Pr - 60000) * 0.01;\n    const wt = (LG.dir > 0 ? '(' + UI.fmt(Pr) + ' − 60,000)' : '(60,000 − ' + UI.fmt(Pr) + ')') + ' × 0.01 = ' + UI.s ))\">Market price</span><span><span class=\"mono lg-m\" style=\"font-size:52px\"></span> <span style=\"font-size:24px;color:color-mix(in srgb, var(--second) 60%, var(--ground))\">' + LG.unit + '</span></span></div>' +\n      '<p class=\"lg-g\" style=\"margin:24px 0 0;font-size:30px;font-weight:600;line-height:1.35\">' + LG.gain + '</p>' +\n      '<p class=\"lg-l\" style=\"margin:10px 0 0;font-size:30px;font-weight:600;line-height:1.35\">' + LG.lose + '</p></div>' +\n      '</div>'));\n    this.chart = UI.chart(kit, { x0: 1000, x1: 1500, y0: 250, y1: 560, lo: 58500, hi: 61500, step: 1000, t0: LG.keys[0][0], t1: LG.t1, keys: LG.keys, entry: 60000, entryBelow: LG.dir > 0, entryLabel: 'Entry 60,000', label: 'BTC price in USDT · fictional' });\n    this.meter = UI.meter(kit, 1000, 610, 600, (LG.dir > 0 ? 'Long' : 'Short') + ' 0.01 BTC', 12, 'lg-mt');\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.lg-k').style; this.t = q('.lg-t'); this.d = q('.lg-d'); this.f = q('.lg-f').style; this.w = q('.lg-w');\n    this.an = q('.lg-an').style; this.m = q('.lg-m'); this.g = q('.lg-g'); this.l = q('.lg-l');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, { keys: [{ t: 0, x: C.x, y: C.y, s: C.s }], poses: LG.poses, says: LG.says });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.d, t, 1.2, { stagger: 0.05 });\n    // Analogy card, then the chart and meter in its place.\n    const ai = seg(t, 5.5, 6.2), ao = seg(t, LG.swap, LG.swap + 0.5);\n    this.an.opacity = eo(ai) * (1 - ei(ao));\n    this.an.transform = 'translateY(' + lerp(30, 0, eo(ai)).toFixed(1) + 'px) scale(' + lerp(1, 0.94, ei(ao)).toFixed(4) + ')';\n    const mk = (keys) => { let v = keys[0][1]; for (let i = 1; i < keys.length; i++) v = lerp(v, keys[i][1], eio(seg(t, keys[i - 1][0], keys[i][0]))); return v; };\n    let mv = mk(LG.mk);\n    if (LG.mk2) mv = lerp(mv, LG.mk2[1][1], eio(s ss=\"glass tr-a\" style=\"left:140px;top:610px;width:940px;padding:24px 40px;border-color:var(--accent);background:color-mix(in srgb, var(--ground) 76%, var(--accent))\">' +\n      '<p class=\"mono\" style=\"margin:0;font-size:36px\">(60,000 − 60,500) × 0.02 = <span style=\"color:var(--accent)\">−10 USDT</span></p>' +\n      '<p style=\"margin:8px 0 0;font-size:28px;font-weight:600\">A loss. A short loses when the price rises.</p></div>' +\n      '<p class=\"tr-h\" style=\"position:absolute;left:1210px;top:640px;width:360px;margin:0;text-align:center;font-size:28px;color:color-mix(in srgb, var(--second) 62%, var(--ground))\">Hint: short = entry − now</p>' +\n      '</div>'));\n    this.ring = UI.ring(kit, 1390, 470, 100, 2.4, 3.0, 5, 8.6);\n    this.meter = UI.meter(kit, 1160, 380, 460, 'Short', 15);\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.tr-k').style; this.t = q('.tr-t'); this.qc = q('.tr-q').style; this.a = q('.tr-a').style; this.h = q('.tr-h').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'calm' }, { t: 0.5, pose: 'present' }, { t: 3.0, pose: 'think' }, { t: 8.4, pose: 'cheer' }, { t: 14.0, pose: 'thumbs' }],\n      says: [{ t0: 14.2, t1: 19.6, text: 'Well done!' }],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    const qp = seg(t, 0.8, 1.5);\n    this.qc.opacity = eo(qp); this.qc.transform = 'translateY(' + lerp(30, 0, eo(qp)).toFixed(1) + 'px)';\n    this.ring(t);\n    this.h.opacity = eo(seg(t, 5.2, 5.8)) * (1 - ei(seg(t, 8.2, 8.6)));\n    const a = seg(t, 8.4, 9.1);\n    this.a.opacity = eo(a); this.a.transformOrigin = '0 50%'; this.a.transform = 'scale(' + lerp(0.92, 1, eob(a, 1.6)).toFixed(4) + ')';\n    const m = seg(t, 8.6, 9.2);\n    this.meter.style.opacity = eo(m); this.meter.style.transform = 'translateY(' + lerp(24, 0, eo(m)).toFixed(1) + 'px)';\n    this.meter.set(-10 * eio(seg(t, 9.2, 10.6)));\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson five\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 2, lesson T05, Buy, Sell, Long and Short; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"Two directions\",\n      \"dur\": 14,\n      \"desc\": \"A fictional BTC price rises and falls; can anyone gain when it falls?\"\n    },\n    {\n      \"id\": \"buysell\",\n      \"name\": \"Spot buy and sell\",\n      \"dur\": 25,\n      \"desc\": \"Spot buying swaps 600 USDT for 0.01 BTC at 60,000; selling at 62,000 returns 620 USDT.\"\n    },\n    {\n      \"id\": \"own\",\n      \"name\": \"Owning vs a position\",\n      \"dur\": 21,\n      \"desc\": \"Spot is ownership; a futures contract gives a position with profit and loss but no coins.\"\n    },\n    {\n      \"id\": \"long\",\n      \"name\": \"Going long\",\n      \"dur\": 27,\n      \"desc\": \"A long gains when price rises: 0.01 BTC from 60,000 to 61,000 is +10 USDT; to 59,000 is -10 USDT.\"\n    },\n    {\n      \"id\": \"short\",\n      \"name\": \"Going short\",\n      \"dur\": 29,\n      \"desc\": \"A short gains when price falls: 0.01 BTC from 60,000 to 59,000 is +10 USDT; to 61,000 is -10 USDT.\"\n    },\n    {\n      \"id\": \"meters\",\n      \"name\": \"One price, two results\",\n      \"dur\": 24,\n      \"desc\": \"One price path with long and short meters side by side; the results flip when the market reverses.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"Spot is not margin\",\n      \"dur\": 34,\n      \"desc\": \"Spot buy vs futures long with margin: the margin shrinks with losses and can be liquidated; selling is not shorting.\"\n    },\n    {\n      \"id\": \"choose\",\n      \"name\": \"Long, short or wait\",\n      \"dur\": 24,\n      \"desc\": \"Pick long, short or wait; a set fictional path ends at 59,800: long -2, short +2, wait 0.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 20,\n      \"desc\": \"Pause and work it out: a short of 0.02 BTC from 60,000 to 60,500 loses 10 USDT.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the risks\",\n      \"dur\": 28,\n      \"desc\": \"Unlimited short losses, leverage and liquidation, fees and funding, no sure direction.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 29,\n      \"desc\": \"Three key points and one question to check yourself.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T06, Entry, Exit and Profit/Loss.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // A soft bed under the captions: pad and keys, a light pulse while prices move, quieter for the mistake and the risks.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.buysell, T.own) || inR(s, T.meters, T.mistake) || inR(s, T.choose, T.risks);\n  const quiet = (s) => inR(s, T.mistake, T.choose) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 30 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 46 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  [[T.title, 2.9], [T.hook, 3.4], [T.hook, 8.6], [T.buysell, 6.4], [T.own, 0.6], [T.own, 6.6], [T.long, 5.5], [T.short, 5.5], [T.meters, 13.6], [T.mistake, 6.2], [T.mistake, 13.4], [T.mistake, 26.8], [T.choose, 17.5], [T.next, 1.3]]\n    .forEach((b) => S.fx('pop', b[0] + b[1], { vel: 26, pitch: 7 }));\n  S.fx('chime', T.title + 1.2, { vel: 30 });\n  S.fx('whoosh', T.buysell + 12.2, { dur: 1.0, vel: 24 }); S.fx('ding', T.buysell + 13.8, { vel: 34 });\n  S.fx('whoosh', T.buysell + 19.5, { dur: 1.0, vel: 24 }); S.fx('ding', T.buysell + 21.1, { vel: 38 });\n  S.fx('ding', T.long + 10.4, { vel: 30 }); S.fx('whoosh', T.long + 12.8, { dur: 0.8, vel: 20 });\n  S.fx('chime', T.long + 16.6, { vel: 34 }); S.fx('thud', T.long + 23.4, { vel: 30 });\n  S.fx('ding', T.short + 14.6, { vel: 30 }); S.fx('thud', T.short + 18.8, { vel: 26 }); S.fx('whoosh', T.short + 20.0, { dur: 0.8, vel: 20 });\n  S.fx('chime', T.short + 22.6, { vel: 34 }); S.fx('thud', T.short + 26.4, { vel: 30 });\n  S.fx('chime', T.meters + 6.2, { vel: 30 }); S.fx('thud', T.meters + 16.4, { vel: 30 });\n  S.fx('thud', T.mistake + 20.6, { vel: 38 });\n  for (let i = 0; i < 3; i++) S.fx('pop', T.choose + 0.8 + i * 0.3, { vel: 30, pitch: 5 });\n  for (let i = 0; i < 4; i++) S.fx('tick', T.choose + 1.8 + i, { vel: 28 });\n  S.fx('ding', T.choose + 11.6, { vel: 36 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 3.0 + i, { vel: 30 });\n  S.fx('chime', T.try + 8.4, { vel: 42 });\n  [3.0, 8.5, 14.1, 21.6].forEach((a) => S.fx('pop', T.risks + a, { vel: 30 }));\n  [1.9, 7.0, 12.0].forEach((a) => S.fx('pop', T.recap + a, { vel: 34 }));\n  S.fx('ding', T.recap + 23.4, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 21.5, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T05 · Buy, Sell, Long and Short',\n  TOTAL: 293,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Signed amount for PnL: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (r + 50) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  // Fictional price chart drawn as t runs. cfg: x0, x1, y0 (top), y1 (bottom), lo, hi (price range), step (grid),\n  // keys [[t, price], ...] (eased between keys, a small wobble while moving), t0..t1 (time drawn across x0..x1),\n  // entry (dashed line + label), tag (price tag at the dot). Returns { price(t), x(t), y(p), render(t) }.\n  chart(kit, cfg) {\n    const { x0, x1, y0, y1, lo, hi } = cfg, keys = cfg.keys, t0 = cfg.t0 || 0, t1 = cfg.t1;\n    const y = (p) => y1 - (p - lo) / (hi - lo) * (y1 - y0);\n    const x = (t) => x0 + kit.clamp01((t - t0) / (t1 - t0)) * (x1 - x0);\n    const wob = cfg.wobble == null ? 0.08 : cfg.wobble;\n    const price = (t) => {\n      if (t <= keys[0][0]) return keys[0][1];\n      for (let i = 1; i < keys.length; i++) {\n        const a = keys[i - 1], b = keys[i];\n        if (t < b[0]) {\n          const p = (t - a[0]) / (b[0] - a[0]), d = b[1] - a[1];\n          return kit.lerp(a[1], b[1], kit.eio(p)) + Math.sin(Math.PI * p) * (Math.sin(t * 7.3) * 0.6 + Math.sin(t * 13.1) * 0.4) * Math.abs(d) * wob;\n        }\n      }\n      return keys[keys.length - 1][1];\n    };\n    let grid = '';\n    for (let p = Math.ceil(lo / cfg.step) * cfg.step; p <= hi + 1e-6; p += cfg.step) {\n      grid += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y(p).toFixed(1) + '\" y2=\"' + y(p).toFixed(1) + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (y(p) + 8).toFixed(1) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 48%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    const ent = cfg.entry ? '<g class=\"ch-ent\"><line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y(cfg.entry).toFixed(1) + '\" y2=\"' + y(cfg.entry).toFixed(1) + '\" stroke-dasharray=\"10 9\" style=\"stroke:color-mix(in srgb, var(--second) 55%, transparent);stroke-width:2.5\"/>' +\n      '<text x=\"' + (x0 + 8) + '\" y=\"' + (y(cfg.entry) + (cfg.entryBelow === false ? -12 : 32)).toFixed(1) + '\" style=\"fill:color-mix(in srgb, var(--second) 75%, var(--ground));font-size:22px;font-weight:600\">' + kit.esc(cfg.entryLabel || 'Entry') + '</text></g>' : '';\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ch-g\">' + grid + ent +\n      '<path class=\"ch-line\" fill=\"none\" stroke-width=\"5\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"stroke:var(--main)\"/>' +\n      '<circle class=\"ch-dot\" r=\"10\" style=\"fill:var(--second)\"/>' +\n      (cfg.tag === false ? '' : '<g class=\"ch-tag\"><rect x=\"16\" y=\"-22\" width=\"128\" height=\"44\" rx=\"10\" style=\"fill:var(--main)\"/><text class=\"ch-tt mono\" x=\"80\" y=\"9\" text-anchor=\"middle\" style=\"fill:var(--ground);font-size:24px;font-weight:500\"></text></g>') +\n      (cfg.label ? '<text x=\"' + x0 + '\" y=\"' + (y0 - 26) + '\" class=\"fict\" style=\"fill:color-mix(in srgb, var(--second) 45%, var(--ground))\">' + kit.esc(cfg.label) + '</text>' : '') +\n      '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ch-g'), line = svg.querySelector('.ch-line'), dot = svg.querySelector('.ch-dot'), tag = svg.querySelector('.ch-tag'), tt = svg.querySelector('.ch-tt'), en = svg.querySelector('.ch-ent');\n    return {\n      price, x, y, svg, g, entry: en,\n      render(t, op) {\n        g.style.opacity = op == null ? 1 : op;\n        const end = Math.min(Math.max(t, t0), t1);\n        let d = '';\n        for (let s = t0; s <= end + 1e-6; s += 0.08) d += (d ? 'L' : 'M') + x(s).toFixed(1) + ' ' + y(price(s)).toFixed(1);\n        d += 'L' + x(end).toFixed(1) + ' ' + y(price(end)).toFixed(1);\n        line.setAttribute('d', d);\n        const px = x(end), py = y(price(end));\n        dot.setAttribute('cx', px.toFixed(1)); dot.setAttribute('cy', py.toFixed(1));\n        if (tag) {\n          tag.setAttribute('transform', 'translate(' + px.toFixed(1) + ' ' + py.toFixed(1) + ')');\n          const v = UI.fmt(Math.round(price(end) / 10) * 10);\n          if (tt.textContent !== v) tt.textContent = v;\n        }\n      },\n    };\n  },\n  // PnL meter: a glass card with a label, a signed USDT value and a bar that grows right (profit) or left (loss) from zero.\n  meter(kit, x, y, w, label, max, cls) {\n    const el = kit.h('<div class=\"glass ' + (cls || '') + '\" style=\"left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;padding:20px 26px\">' +\n      '<div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px\"><span style=\"font-size:28px;font-weight:700\">' + label + '</span><span class=\"mono mt-v\" style=\"font-size:40px\"></span></div>' +\n      '<div style=\"position:relative;height:18px;margin-top:14px;border-radius:9px;background:color-mix(in srgb, var(--second) 9%, transparent)\"><i class=\"mt-f\" style=\"position:absolute;top:0;bottom:0;border-radius:9px\"></i>' +\n      '<span style=\"position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;background:color-mix(in srgb, var(--second) 45%, transparent)\"></span></div>' +\n      '<div style=\"display:flex;justify-content:space-between;margin-top:8px;font-size:22px;color:color-mix(in srgb, var(--second) 55%, var(--ground))\"><span>Loss</span><span>Profit</span></div></div>');\n    kit.stage.append(el);\n    const v = el.querySelector('.mt-v'), f = el.querySelector('.mt-f').style;\n    return {\n      el, style: el.style,\n      set(n) {\n        const txt = UI.sgn(n, 2) + ' USDT';\n        if (v.textContent !== txt) v.textContent = txt;\n        const c = Math.abs(n) < 0.005 ? 'var(--second)' : n > 0 ? 'var(--main)' : 'var(--accent)';\n        v.style.color = c;\n        const k = Math.min(1, Math.abs(n) / max) * 50;\n        f.left = (n >= 0 ? 50 : 50 - k).toFixed(2) + '%'; f.width = k.toFixed(2) + '%';\n        f.background = n >= 0 ? 'var(--main)' : 'var(--accent)';\n      },\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n};\n","tutor.json":"{\n  \"idea\": {\n    \"w\": 169,\n    \"h\": 178,\n    \"ax\": 69.5,\n    \"feet\": 171,\n    \"bw\": 138\n  },\n  \"explain\": {\n    \"w\": 502,\n    \"h\": 602,\n    \"ax\": 275,\n    \"feet\": 594,\n    \"bw\": 394\n  },\n  \"present\": {\n    \"w\": 546,\n    \"h\": 612,\n    \"ax\": 218,\n    \"feet\": 605,\n    \"bw\": 421\n  },\n  \"point\": {\n    \"w\": 547,\n    \"h\": 568,\n    \"ax\": 210,\n    \"feet\": 561,\n    \"bw\": 415\n  },\n  \"thumbs\": {\n    \"w\": 181,\n    \"h\": 179,\n    \"ax\": 102,\n    \"feet\": 172,\n    \"bw\": 138\n  },\n  \"think\": {\n    \"w\": 465,\n    \"h\": 656,\n    \"ax
