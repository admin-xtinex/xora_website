<script>window.FILM = {"id":"T10","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson ten","dur":9,"k":1,"oldStart":0,"oldDur":9},{"id":"hook","name":"So many boxes","dur":17,"k":1,"oldStart":9,"oldDur":17},{"id":"layout","name":"The overall layout","dur":19.5,"k":1,"oldStart":26,"oldDur":19.5},{"id":"watchlist","name":"Find the pair","dur":18,"k":1,"oldStart":45.5,"oldDur":18},{"id":"symbol","name":"The symbol bar","dur":33.3,"k":1.8,"oldStart":63.5,"oldDur":18.5},{"id":"chart","name":"The chart","dur":25.16,"k":1.36,"oldStart":82,"oldDur":18.5},{"id":"book","name":"The order book","dur":20.5,"k":1,"oldStart":100.5,"oldDur":20.5},{"id":"entry","name":"Order entry","dur":28.56,"k":1.19,"oldStart":121,"oldDur":24},{"id":"positions","name":"Positions and PnL","dur":42,"k":1.75,"oldStart":145,"oldDur":24},{"id":"wallet","name":"Your wallet","dur":23.13,"k":1.25,"oldStart":169,"oldDur":18.5},{"id":"security","name":"Security settings","dur":25.5,"k":1,"oldStart":187.5,"oldDur":25.5},{"id":"mistake","name":"Read the label","dur":19.5,"k":1,"oldStart":213,"oldDur":19.5},{"id":"try","name":"Find it","dur":22,"k":1,"oldStart":232.5,"oldDur":22},{"id":"risks","name":"Stay safe","dur":24,"k":1,"oldStart":254.5,"oldDur":24},{"id":"recap","name":"Recap","dur":26.5,"k":1,"oldStart":278.5,"oldDur":26.5},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":305,"oldDur":10}],"voice":{"src":"T10/voice.mp3","lines":[{"t":0.6,"d":5.818,"text":"Lesson ten: a tour of an exchange platform. Let's learn the screen, one piece at a time.","ml":"പാഠം പത്ത്: ഒരു exchange പ്ലാറ്റ്ഫോമിലൂടെ ഒരു യാത്ര. സ്ക്രീനിലെ ഓരോ ഭാഗവും ഒന്നൊന്നായി പഠിക്കാം."},{"t":9.6,"d":4.163,"text":"Open any trading app and you'll see a screen like this. So many boxes!","ml":"ഏത് ട്രേഡിങ് ആപ്പ് തുറന്നാലും ഇതുപോലൊരു സ്ക്രീൻ കാണാം. എത്രയെത്ര ബോക്സുകൾ!"},{"t":15.1,"d":5.855,"text":"This is an educational mock, not a real exchange screen. Real apps look different and change often.","ml":"ഇത് പഠനത്തിനുള്ള ഒരു മാതൃക മാത്രമാണ്, യഥാർത്ഥ exchange സ്ക്രീനല്ല. യഥാർത്ഥ ആപ്പുകൾ വ്യത്യസ്തമാണ്, ഇടയ്ക്കിടെ മാറുകയും ചെയ്യും."},{"t":22.5,"d":1.857,"text":"But they share the same few parts.","ml":"പക്ഷേ എല്ലാത്തിലും ഒരേ കുറച്ച് ഭാഗങ്ങളുണ്ട്."},{"t":26.6,"d":3.499,"text":"Think of it like a car dashboard. Each part has one job.","ml":"ഒരു കാറിന്റെ ഡാഷ്ബോർഡ് പോലെ ചിന്തിക്കൂ. ഓരോ ഭാഗത്തിനും ഓരോ ജോലി."},{"t":31.1,"d":3.986,"text":"Watchlist, symbol bar and chart. Order book and order entry.","ml":"Watchlist, symbol bar, ചാർട്ട്. Order book, order entry."},{"t":35.9,"d":3.177,"text":"Positions at the bottom, and your wallet and security up top.","ml":"താഴെ positions, മുകളിൽ നിങ്ങളുടെ wallet-ഉം security-യും."},{"t":40.8,"d":3.391,"text":"We'll visit each one. No real orders, no real money.","ml":"നമ്മൾ ഓരോന്നും സന്ദർശിക്കും. യഥാർത്ഥ ഓർഡറുകളില്ല, യഥാർത്ഥ പണവുമില്ല."},{"t":46.1,"d":4.214,"text":"First, the watchlist. It's a list of trading pairs you want to keep an eye on.","ml":"ആദ്യം watchlist. നിങ്ങൾ ശ്രദ്ധിക്കാൻ ആഗ്രഹിക്കുന്ന ട്രേഡിങ് പെയറുകളുടെ ലിസ്റ്റാണിത്."},{"t":52.1,"d":4.087,"text":"Type BTC in the search box, and the list narrows to Bitcoin.","ml":"സെർച്ച് ബോക്സിൽ BTC എന്ന് ടൈപ്പ് ചെയ്താൽ ലിസ്റ്റ് Bitcoin മാത്രമായി ചുരുങ്ങും."},{"t":57.3,"d":4.274,"text":"Tap BTC/USDT, and the whole screen switches to that pair.","ml":"BTC/USDT-ൽ ടാപ്പ് ചെയ്താൽ സ്ക്രീൻ മുഴുവൻ ആ പെയറിലേക്ക് മാറും."},{"t":64.58,"d":6.133,"text":"Up top is the symbol bar. A symbol is the short name of a market, like BTCUSDT.","ml":"മുകളിൽ symbol bar ആണ്. ഒരു മാർക്കറ്റിന്റെ ചുരുക്കപ്പേരാണ് symbol, ഉദാഹരണത്തിന് BTCUSDT."},{"t":75.74,"d":4.76,"text":"Next to it: the last traded price, and the change over the past 24 hours.","ml":"അതിനടുത്ത്: അവസാനം ട്രേഡ് നടന്ന വിലയും കഴിഞ്ഞ 24 മണിക്കൂറിലെ മാറ്റവും."},{"t":86.18,"d":10.175,"text":"Example: 24 hours ago, 60,000. Now 61,200. That's up 1,200 USDT, or +2%.","ml":"ഉദാഹരണം: 24 മണിക്കൂർ മുമ്പ് 60,000. ഇപ്പോൾ 61,200. അതായത് 1,200 USDT കൂടി, അഥവാ +2%."},{"t":97.616,"d":5.035,"text":"The chart shows price over time. Each candle covers one slice of time, like one minute.","ml":"ചാർട്ട് കാലത്തിനൊപ്പമുള്ള വില കാണിക്കുന്നു. ഓരോ candle-ഉം ഒരു സമയഭാഗം കാണിക്കും, ഉദാഹരണത്തിന് ഒരു മിനിറ്റ്."},{"t":106.592,"d":4.045,"text":"Watch the newest candle form. It grows as trades happen at new prices.","ml":"ഏറ്റവും പുതിയ candle രൂപപ്പെടുന്നത് നോക്കൂ. പുതിയ വിലകളിൽ ട്രേഡുകൾ നടക്കുമ്പോൾ അത് വളരും."},{"t":114.208,"d":7.295,"text":"Tabs like 1m, 5m and 15m change the time slice. T14 and T15 cover this.","ml":"1m, 5m, 15m പോലുള്ള ടാബുകൾ സമയഭാഗം മാറ്റും. T14-ലും T15-ലും ഇത് പഠിക്കാം."},{"t":122.56,"d":4.741,"text":"The order book lists waiting orders: sellers' asks on top, buyers' bids below.","ml":"Order book കാത്തിരിക്കുന്ന ഓർഡറുകൾ കാണിക്കുന്നു: വിൽക്കുന്നവരുടെ asks മുകളിൽ, വാങ്ങുന്നവരുടെ bids താഴെ."},{"t":128.76,"d":8.061,"text":"The gap between the best ask and the best bid is the spread. Here: 60,010 − 60,000 = 10 USDT.","ml":"ഏറ്റവും നല്ല ask-ഉം ഏറ്റവും നല്ല bid-ഉം തമ്മിലുള്ള വിടവാണ് spread. ഇവിടെ: 60,010 − 60,000 = 10 USDT."},{"t":137.371,"d":4.525,"text":"When a market buy arrives, it takes the best ask, and the last price ticks up.","ml":"ഒരു market buy വരുമ്പോൾ അത് ഏറ്റവും നല്ല ask എടുക്കും, last price മുകളിലേക്ക് നീങ്ങും."},{"t":143.174,"d":5.399,"text":"The order entry panel is where an order is set up. Choose a type: limit, market or stop.","ml":"ഓർഡർ തയ്യാറാക്കുന്ന സ്ഥലമാണ് order entry പാനൽ. ഒരു തരം തിരഞ്ഞെടുക്കുക: limit, market, അല്ലെങ്കിൽ stop."},{"t":151.266,"d":6.084,"text":"Enter a price and a size. Say a limit buy at 60,000 for 0.010 BTC.","ml":"ഒരു വിലയും size-ഉം നൽകുക. ഉദാഹരണത്തിന് 60,000-ൽ 0.010 BTC-ക്ക് ഒരു limit buy."},{"t":157.9,"d":8.529,"text":"Order value is price × size: 60,000 × 0.010 = 600 USDT. The fee estimate shows too.","ml":"Order value എന്നാൽ വില × size: 60,000 × 0.010 = 600 USDT. ഫീസിന്റെ ഏകദേശ കണക്കും കാണിക്കും."},{"t":166.979,"d":3.259,"text":"Here the buttons are mock only. No real order is sent.","ml":"ഇവിടെ ബട്ടണുകൾ വെറും മാതൃകയാണ്. ഒരു യഥാർത്ഥ ഓർഡറും അയയ്ക്കില്ല."},{"t":172.07,"d":4.161,"text":"Once an order fills, it becomes a position, listed at the bottom of the screen.","ml":"ഓർഡർ fill ആയാൽ അത് ഒരു position ആകും, സ്ക്രീനിന്റെ താഴെ ലിസ്റ്റിൽ കാണാം."},{"t":182.92,"d":7.07,"text":"PnL means profit and loss. Unrealized PnL is your result so far, on an open position.","ml":"PnL എന്നാൽ ലാഭവും നഷ്ടവും. തുറന്നിരിക്കുന്ന position-ന്റെ ഇതുവരെയുള്ള ഫലമാണ് unrealized PnL."},{"t":194.82,"d":11.431,"text":"Long 0.010 BTC from 60,000. Price 60,600: +6 USDT. Price 59,400: −6 USDT.","ml":"60,000-ൽ നിന്ന് 0.010 BTC long. വില 60,600: +6 USDT. വില 59,400: −6 USDT."},{"t":206.801,"d":2.19,"text":"It's only realized when you close the position.","ml":"Position ക്ലോസ് ചെയ്യുമ്പോൾ മാത്രമേ അത് realized ആകൂ."},{"t":213.77,"d":5.171,"text":"Your wallet shows the money in your account. Here, a fictional 1,000 USDT.","ml":"നിങ്ങളുടെ അക്കൗണ്ടിലെ പണം wallet കാണിക്കുന്നു. ഇവിടെ, സാങ്കൽപ്പികമായ 1,000 USDT."},{"t":221.02,"d":4.248,"text":"Part of it is in use, held for open orders and positions. The rest is available.","ml":"അതിൽ ഒരു ഭാഗം ഉപയോഗത്തിലാണ്, തുറന്ന ഓർഡറുകൾക്കും positions-നും വേണ്ടി മാറ്റിവെച്ചത്. ബാക്കി available ആണ്."},{"t":229.02,"d":6.714,"text":"Example: 1,000 − 600 in use = 400 USDT available for new orders.","ml":"ഉദാഹരണം: 1,000 − 600 ഉപയോഗത്തിൽ = പുതിയ ഓർഡറുകൾക്ക് 400 USDT available."},{"t":236.75,"d":3.308,"text":"Last stop: security settings. They protect your account.","ml":"അവസാന സ്റ്റോപ്പ്: security settings. അവ നിങ്ങളുടെ അക്കൗണ്ട് സംരക്ഷിക്കുന്നു."},{"t":241.55,"d":4.386,"text":"Two-factor login asks for a second code from your phone, as well as your password.","ml":"Two-factor login പാസ്‌വേഡിന് പുറമെ നിങ്ങളുടെ ഫോണിൽ നിന്നുള്ള രണ്ടാമതൊരു കോഡ് ചോദിക്കും."},{"t":248.05,"d":4.997,"text":"An anti-phishing code appears in real emails from the exchange, so fakes stand out.","ml":"Exchange-ൽ നിന്നുള്ള യഥാർത്ഥ ഇമെയിലുകളിൽ ഒരു anti-phishing code കാണും, അതുകൊണ്ട് വ്യാജമായവ എളുപ്പം തിരിച്ചറിയാം."},{"t":254.65,"d":6.573,"text":"API keys let software use your account. Never share them, or any code. XORA never asks.","ml":"API keys സോഫ്റ്റ്‌വെയറിന് നിങ്ങളുടെ അക്കൗണ്ട് ഉപയോഗിക്കാൻ അനുവാദം നൽകും. അവയോ ഏതെങ്കിലും കോഡോ ആരുമായും പങ്കിടരുത്. XORA ഒരിക്കലും ചോദിക്കില്ല."},{"t":262.25,"d":3.949,"text":"A common mistake: learning where the buttons sit, instead of what they say.","ml":"ഒരു സാധാരണ തെറ്റ്: ബട്ടണുകളിൽ എന്താണ് എഴുതിയതെന്ന് നോക്കാതെ, അവ എവിടെയാണെന്ന് മാത്രം പഠിക്കുന്നത്."},{"t":268.25,"d":5.92,"text":"Apps update. Here, an update swaps the buttons. A tap from memory hits Sell, not Buy.","ml":"ആപ്പുകൾ അപ്ഡേറ്റ് ആകും. ഇവിടെ ഒരു അപ്ഡേറ്റ് ബട്ടണുകൾ സ്ഥാനം മാറ്റുന്നു. ഓർമ്മ വെച്ചുള്ള ടാപ്പ് Buy-ക്ക് പകരം Sell-ൽ വീഴുന്നു."},{"t":275.05,"d":3.943,"text":"Correction: always read the label, and check the order before you confirm.","ml":"തിരുത്ത്: ലേബൽ എപ്പോഴും വായിക്കുക, confirm ചെയ്യും മുമ്പ് ഓർഡർ പരിശോധിക്കുക."},{"t":281.75,"d":5.528,"text":"Your turn. Where would you look to see your unrealized PnL? Pause if you need more time.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. നിങ്ങളുടെ unrealized PnL കാണാൻ എവിടെ നോക്കും? കൂടുതൽ സമയം വേണമെങ്കിൽ വീഡിയോ നിർത്താം."},{"t":290.55,"d":5.129,"text":"The answer is C, the positions panel. It shows your open positions and their PnL.","ml":"ഉത്തരം C, positions പാനൽ. നിങ്ങളുടെ തുറന്ന positions-ഉം അവയുടെ PnL-ഉം അത് കാണിക്കും."},{"t":297.15,"d":4.337,"text":"Not A, the chart. The chart shows the market price, not your own result.","ml":"A, ചാർട്ട് അല്ല. ചാർട്ട് മാർക്കറ്റ് വിലയാണ് കാണിക്കുന്നത്, നിങ്ങളുടെ സ്വന്തം ഫലമല്ല."},{"t":303.75,"d":2.445,"text":"First, some safety rules for real apps.","ml":"ആദ്യം, യഥാർത്ഥ ആപ്പുകൾക്കുള്ള ചില സുരക്ഷാ നിയമങ്ങൾ."},{"t":307.15,"d":3.552,"text":"Check the address. A look-alike website can steal your login.","ml":"വെബ്സൈറ്റ് വിലാസം പരിശോധിക്കുക. ഒരുപോലെ തോന്നുന്ന വ്യാജ സൈറ്റിന് നിങ്ങളുടെ ലോഗിൻ മോഷ്ടിക്കാം."},{"t":312.35,"d":3.322,"text":"Check which market you're in, spot or futures, before any order.","ml":"ഏത് ഓർഡറിനും മുമ്പ് നിങ്ങൾ ഏത് മാർക്കറ്റിലാണെന്ന് നോക്കുക, spot ആണോ futures ആണോ."},{"t":317.45,"d":4.49,"text":"Never tap around a real account to explore. A tap can place a real order.","ml":"പരിചയപ്പെടാൻ വേണ്ടി യഥാർത്ഥ അക്കൗണ്ടിൽ ഒരിക്കലും ചുമ്മാ ടാപ്പ് ചെയ്യരുത്. ഒരു ടാപ്പ് യഥാർത്ഥ ഓർഡർ ഇട്ടേക്കാം."},{"t":323.15,"d":3.141,"text":"And WAIT, or no trade, is always a valid choice.","ml":"WAIT, അല്ലെങ്കിൽ ട്രേഡ് ചെയ്യാതിരിക്കുന്നത്, എപ്പോഴും ശരിയായ ഒരു തീരുമാനമാണ്."},{"t":327.75,"d":4.025,"text":"Every trading screen is built from the same parts, each with one job.","ml":"ഓരോ ട്രേഡിങ് സ്ക്രീനും ഒരേ ഭാഗങ്ങൾ കൊണ്ടാണ് നിർമ്മിച്ചത്, ഓരോന്നിനും ഓരോ ജോലി."},{"t":333.15,"d":5.327,"text":"Positions show your unrealized PnL. The wallet shows what's still available.","ml":"Positions നിങ്ങളുടെ unrealized PnL കാണിക്കും. ഇനിയും available ആയത് wallet കാണിക്കും."},{"t":339.05,"d":4.389,"text":"Read every label, protect your account, and never share keys or codes.","ml":"ഓരോ ലേബലും വായിക്കുക, അക്കൗണ്ട് സംരക്ഷിക്കുക, keys-ഓ കോഡുകളോ ഒരിക്കലും പങ്കിടരുത്."},{"t":344.55,"d":2.301,"text":"Check yourself: where do you find the spread?","ml":"സ്വയം പരിശോധിക്കൂ: spread എവിടെ കാണാം?"},{"t":348.35,"d":3.617,"text":"In the order book: the gap between the best ask and the best bid.","ml":"Order book-ൽ: ഏറ്റവും നല്ല ask-ഉം ഏറ്റവും നല്ല bid-ഉം തമ്മിലുള്ള വിടവ്."},{"t":354.25,"d":5.353,"text":"Great work! Next up, T11: spot versus futures. What do you really own?","ml":"മികച്ച പ്രകടനം! അടുത്തത് T11: spot-ഉം futures-ഉം. ശരിക്കും നിങ്ങൾക്ക് എന്താണ് സ്വന്തമാകുന്നത്?"}]},"assetBase":"T10/assets/","assets":{"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"t e }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n","narration.json":"{\n  \"about\": \"T10 captions, written as a warm tutor speaking; each line starts at film time t (seconds). Can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson ten: a tour of an exchange platform. Let's learn the screen, one piece at a time.\"\n    },\n    {\n      \"t\": 9.6,\n      \"text\": \"Open any trading app and you'll see a screen like this. So many boxes!\"\n    },\n    {\n      \"t\": 15.1,\n      \"text\": \"This is an educational mock, not a real exchange screen. Real apps look different and change often.\"\n    },\n    {\n      \"t\": 22.5,\n      \"text\": \"But they share the same few parts.\"\n    },\n    {\n      \"t\": 26.6,\n      \"text\": \"Think of it like a car dashboard. Each part has one job.\"\n    },\n    {\n      \"t\": 31.1,\n      \"text\": \"Watchlist, symbol bar and chart. Order book and order entry.\"\n    },\n    {\n      \"t\": 35.9,\n      \"text\": \"Positions at the bottom, and your wallet and security up top.\"\n    },\n    {\n      \"t\": 40.8,\n      \"text\": \"We'll visit each one. No real orders, no real money.\"\n    },\n    {\n      \"t\": 46.1,\n      \"text\": \"First, the watchlist. It's a list of trading pairs you want to keep an eye on.\"\n    },\n    {\n      \"t\": 52.1,\n      \"text\": \"Type BTC in the search box, and the list narrows to Bitcoin.\"\n    },\n    {\n      \"t\": 57.3,\n      \"text\": \"Tap BTC/USDT, and the whole screen switches to that pair.\"\n    },\n    {\n      \"t\": 64.1,\n      \"text\": \"Up top is the symbol bar. A symbol is the short name of a market, like BTCUSDT.\"\n    },\n    {\n      \"t\": 70.3,\n      \"text\": \"Next to it: the last traded price, and the change over the past 24 hours.\"\n    },\n    {\n      \"t\": 76.1,\n      \"text\": \"Example: 24 hours ago, 60,000. Now 61,200. That's up 1,200 USDT, or +2%.\"\n    },\n    {\n      \"t\": 82.6,\n      \"text\": \"The chart shows price over time. Each candle covers one slice of time, like one minute.\"\n    },\n    {\n      \"t\": 89.2,\n      \"text\": \"Watch the newest candle form. It grows as trades happen at new prices.\"\n    },\n    {\n      \"t\": 94.8,\n      \"text\": \"Tabs like 1m, 5m and 15m change the time slice. T14 and T15 cover this.\"\n    },\n    {\n      \"t\": 101.1,\n      \"text\": \"The order book lists waiting orders: sellers' asks on top, buyers' bids below.\"\n    },\n    {\n      \"t\": 107.3,\n      \"text\": \"The gap between the best ask and the best bid is the spread. Here: 60,010 − 60,000 = 10 USDT.\"\n    },\n    {\n      \"t\": 114.5,\n      \"text\": \"When a market buy arrives, it takes the best ask, and the last price ticks up.\"\n    },\n    {\n      \"t\": 121.6,\n      \"text\": \"The order entry panel is where an order is set up. Choose a type: limit, market or stop.\"\n    },\n    {\n      \"t\": 128.4,\n      \"text\": \"Enter a price and a size. Say a limit buy at 60,000 for 0.010 BTC.\"\n    },\n    {\n      \"t\": 133.8,\n      \"text\": \"Order value is price × size: 60,000 × 0.010 = 600 USDT. The fee estimate shows too.\"\n    },\n    {\n      \"t\": 140.4,\n      \"text\": \"Here the buttons are mock only. No real order is sent.\"\n    },\n    {\n      \"t\": 145.6,\n      \"text\": \"Once an order fills, it becomes a position, listed at the bottom of the screen.\"\n    },\n    {\n      \"t\": 151.8,\n      \"text\": \"PnL means profit and loss. Unrealized PnL is your result so far, on an open position.\"\n    },\n    {\n      \"t\": 158.6,\n      \"text\": \"Long 0.010 BTC from 60,000. Price 60,600: +6 USDT. Price 59,400: −6 USDT.\"\n    },\n    {\n      \"t\": 164.6,\n      \"text\": \"It's only realized when you close the position.\"\n    },\n    {\n      \"t\": 169.6,\n      \"text\": \"Your wallet shows the money in your account. Here, a fictional 1,000 USDT.\"\n    },\n    {\n      \"t\": 175.4,\n      \"text\": \"Part of it is in use, held for open orders and positions. The rest is available.\"\n    },\n    {\n      \"t\": 181.8,\n      \"text\": \"Example: 1,000 − 600 in use = 400 USDT available for new orders.\"\n    },\n    {\n      \"t\": 188.1,\n      \"text\": \"Last stop: security settings. They protect your account.\"\n    },\n    {\n      \"t\": 192.9,\n      \"text\": \"Two-factor login asks for a second code from your phone, as well as your password.\"\n    },\n    {\n      \"t\": 199.4,\n      \"text\": \"An anti-phishing code appears in real emails from the exchange, so fakes stand out.\"\n    },\n    {\n      \"t\": 206,\n      \"text\": \"API keys let software use your account. Never share them, or any code. XORA never asks.\"\n    },\n    {\n      \"t\": 213.6,\n      \"text\": \"A common mistake: learning where the buttons sit, instead of what they say.\"\n    },\n    {\n      \"t\": 219.6,\n      \"text\": \"Apps update. Here, an update swaps the buttons. A tap from memory hits Sell, not Buy.\"\n    },\n    {\n      \"t\": 226.4,\n      \"text\": \"Correction: always read the label, and check the order before you confirm.\"\n    },\n    {\n      \"t\": 233.1,\n      \"text\": \"Your turn. Where would you look to see your unrealized PnL? Pause if you need more time.\"\n    },\n    {\n      \"t\": 241.9,\n      \"text\": \"The answer is C, the positions panel. It shows your open positions and their PnL.\"\n    },\n    {\n      \"t\": 248.5,\n      \"text\": \"Not A, the chart. The chart shows the market price, not your own result.\"\n    },\n    {\n      \"t\": 255.1,\n      \"text\": \"First, some safety rules for real apps.\"\n    },\n    {\n      \"t\": 258.5,\n      \"text\": \"Check the address. A look-alike website can steal your login.\"\n    },\n    {\n      \"t\": 263.7,\n      \"text\": \"Check which market you're in, spot or futures, before any order.\"\n    },\n    {\n      \"t\": 268.8,\n      \"text\": \"Never tap around a real account to explore. A tap can place a real order.\"\n    },\n    {\n      \"t\": 274.5,\n      \"text\": \"And WAIT, or no trade, is always a valid choice.\"\n    },\n    {\n      \"t\": 279.1,\n      \"text\": \"Every trading screen is built from the same parts, each with one job.\"\n    },\n    {\n      \"t\": 284.5,\n      \"text\": \"Positions show your unrealized PnL. The wallet shows what's still available.\"\n    },\n    {\n      \"t\": 290.4,\n      \"text\": \"Read every label, protect your account, and never share keys or codes.\"\n    },\n    {\n      \"t\": 295.9,\n      \"text\": \"Check yourself: where do you find the spread?\"\n    },\n    {\n      \"t\": 299.7,\n      \"text\": \"In the order book: the gap between the best ask and the best bid.\"\n    },\n    {\n      \"t\": 305.6,\n      \"text\": \"Great work! Next up, T11: spot versus futures. What do you really own?\"\n    }\n  ]\n}\n","scene-book.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst BK_ASK = [[60010, 0.30], [60020, 0.55], [60030, 0.42], [60040, 0.61]];\nconst BK_BID = [[60000, 0.48], [59990, 0.35], [59980, 0.66], [59970, 0.52]];\nkit.scene('book', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\"></div>'));\n    this.term = UI.term(kit, { seed: 41 });\n    this.spot = UI.spot(kit);\n    const ex = '<div class=\"bk-ex\" style=\"display:flex;flex-direction:column;gap:8px;padding:18px 24px;border-radius:16px;background:color-mix(in srgb, var(--ground) 70%, transparent);border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent)\">' +\n      '<p class=\"fict\" style=\"margin:0\">Worked example · fictional prices</p>' +\n      '<p class=\"mono\" style=\"margin:0;font-size:30px\">Spread = best ask − best bid</p>' +\n      '<p class=\"mono\" style=\"margin:0;font-size:30px\">60,010 − 60,000 = <span style=\"color:var(--main)\">10 USDT</span></p></div>';\n    this.card = UI.tip(kit, 140, 222, 820, '4 · Order book', 'Orders waiting to trade', '<b>Asks</b> are sellers’ prices, on top. <b>Bids</b> are buyers’ prices, below. The best of each sit next to the middle.', ex);\n    kit.stage.append(kit.h('<div class=\"chip bk-sp\" style=\"position:absolute;left:1112px;top:417px;font-size:24px;padding:8px 18px;background:color-mix(in srgb, var(--ground) 70%, var(--main));border-color:var(--main)\">Spread 10 →</div>'));\n    kit.stage.append(kit.h('<div class=\"chip bk-mb\" style=\"position:absolute;left:0;top:0;font-size:26px;padding:10px 22px;background:var(--main);color:var(--ground);border-color:var(--main)\">Market buy 0.30 BTC</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.cs = this.card.style; this.ex = q('.bk-ex').style; this.sp = q('.bk-sp').style; this.mb = q('.bk-mb').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'thumbs' }, { t: 0.6, pose: 'explain' }, { t: 6.8, pose: 'think' }, { t: 14.0, pose: 'magnify' }, { t: 17.2, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    const w = (i, k) => 0.03 * Math.sin(t * 1.3 + i * 2.1 + k);\n    const hlA = eo(seg(t, 7.2, 7.6)) * (1 - eo(seg(t, 13.6, 14.0)));\n    let asks, mid = 60000;\n    const drain = seg(t, 15.0, 15.7), shift = eio(seg(t, 15.9, 16.5));\n    if (t < 15.9) {\n      asks = BK_ASK.map((a, i) => [a[0], i ? a[1] + w(i, 1) : a[1] * (1 - drain), i ? 0 : Math.max(hlA, Math.sin(Math.PI * seg(t, 14.9, 15.9))), i ? 1 : 1 - 0.7 * drain]);\n    } else if (t < 16.5) {\n      asks = BK_ASK.map((a, i) => i ? [a[0], a[1] + w(i, 1), 0, 1, i - shift] : [a[0], 0, 0, 0, 0]);\n    } else {\n      asks = [[60020, 0.55 + w(1, 1)], [60030, 0.42 + w(2, 1)], [60040, 0.61 + w(3, 1)], [60050, 0.47 + w(4, 1), 0, eo(seg(t, 16.5, 17.0))]];\n    }\n    if (t >= 15.6) mid = 60010;\n    const bids = BK_BID.map((b, i) => [b[0], b[1] + (i ? w(i, 2) : 0), i ? 0 : hlA]);\n    this.term.render(t, { sym: 'BTC', price: mid, book: { asks, bids }, mid });\n    const pulse = Math.sin(Math.PI * seg(t, 15.6, 16.4));\n    this.term.E.mid.style.transform = 'scale(' + (1 + 0.15 * pulse).toFixed(3) + ')';\n    this.term.E.mid.style.display = 'inline-block';\n    this.spot.set(UI.R.book, eo(seg(t, 0, 0.8)), eo(seg(t, 0.2, 1.0)));\n    UI.show(this.cs, t, 0.8);\n    this.ex.opacity = (0.25 + 0.75 * eo(seg(t, 6.8, 7.3))).toFixed(3);\n    const s = seg(t, 7.6, 8.1);\n    this.sp.opacity = (eo(s) * (1 - eo(seg(t, 13.6, 14.0)))).toFixed(3);\n    this.sp.transform = 'translate(-100%,-50%) translateX(' + lerp(-20, 0, eo(s)).toFixed(1) + 'px)';\n    // The market buy flies into the best ask, then is used up.\n    const f = seg(t, 14.3, 15.1), mbIn = seg(t, 14.0, 14.4);\n    const x0 = 900, y0 = 738, x1 = 1270, y1 = 199 + 185 + 16;\n    this.mb.opacity = (eo(mbIn) * (1 - eo(seg(t, 14.85, 15.15)))).toFixed(3);\n    this.mb.transform = 'translate(' + lerp(x0, x1, eio(f)).toFixed(1) + 'px,' + (lerp(y0, y1, eio(f)) - Math.sin(Math.PI * f) * 90).toFixed(1) + 'px) translate(-50%,-50%) scale(' + (lerp(0.7, 1, eob(mbIn, 1.6)) * lerp(1, 0.6, eio(f))).toFixed(4) + ')';\n    this.tutor.render(t);\n  },\n});\n","scene-chart.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nkit.scene('chart', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\"></div>'));\n    this.term = UI.term(kit, { seed: 41 });\n    this.spot = UI.spot(kit);\n    this.card = UI.tip(kit, 1128, 222, 690, '3 · Chart', 'Price over time', 'Each <b>candle</b> shows how the price moved during one slice of time. Cyan: it ended higher. Violet: lower.',\n      '<p class=\"fict\" style=\"margin:0\">Illustrative, not real market data</p>');\n    kit.stage.append(kit.h('<div class=\"chip ch-tf\" style=\"position:absolute;left:420px;top:534px;font-size:26px;padding:8px 20px;background:color-mix(in srgb, var(--ground) 70%, var(--main));border-color:var(--main)\"><span class=\"ch-tft\">1 candle = 1 minute</span></div>'));\n    kit.stage.append(kit.h('<div class=\"ch-ring\" style=\"position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--second);box-sizing:border-box\"></div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.cs = this.card.style; this.tf = q('.ch-tf').style; this.tft = q('.ch-tft'); this.ring = q('.ch-ring').style;\n    this.price = UI.path([[0, 60000], [7.4, 60000], [9.0, 60150], [10.4, 60070], [12.0, 60180], [14.5, 60120], [17, 60160]]);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'thumbs' }, { t: 0.6, pose: 'present' }, { t: 7.2, pose: 'magnify' }, { t: 12.8, pose: 'explain' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    const fn = (s) => this.price(s) + UI.wig(s, 14);\n    const [lo, hi] = UI.hilo(fn, 7.2, Math.max(7.2, t));\n    const p = fn(t);\n    const tf = eio(seg(t, 13.4, 14.4));\n    this.term.render(t, { sym: 'BTC', price: p, hi: t > 7.2 ? hi : null, lo: t > 7.2 ? lo : null, tf });\n    this.spot.set(UI.R.chart, eo(seg(t, 0, 0.8)), eo(seg(t, 0.2, 1.0)));\n    UI.show(this.cs, t, 0.8);\n    this.tf.opacity = eo(seg(t, 2.6, 3.1)).toFixed(3);\n    UI.set(this.tft, t < 13.9 ? '1 candle = 1 minute' : '1 candle = 5 minutes');\n    this.tf.transform = 'scale(' + (1 + 0.08 * Math.sin(Math.PI * seg(t, 13.6, 14.2))).toFixed(4) + ')';\n    // A ring around the newest candle while it forms.\n    const x = 400 + 20 + (710 - 120) / 20 * 19.5, mid = 198 + 64 + (400 - 84) / 2;\n    const y = mid - ((p - 60000) / 60000) / 0.005 * ((400 - 84) / 2);\n    this.ring.left = x.toFixed(1) + 'px'; this.ring.top = y.toFixed(1) + 'px';\n    this.ring.opacity = (eo(seg(t, 7.2, 7.7)) * (1 - eo(seg(t, 12.8, 13.3))) * (0.6 + 0.4 * Math.sin(t * 5))).toFixed(3);\n    this.tutor.render(t);\n  },\n});\n","scene-entry.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst type = (s, t, a, step) => s.slice(0, Math.max(0, M     \"dur\": 18.5,\n      \"desc\": \"Symbol bar: symbol, last price and 24-hour change; worked example 60,000 to 61,200 is +2%.\"\n    },\n    {\n      \"id\": \"chart\",\n      \"name\": \"The chart\",\n      \"dur\": 18.5,\n      \"desc\": \"Chart: the newest candle forms live; switching 1m to 5m regroups five candles into one.\"\n    },\n    {\n      \"id\": \"book\",\n      \"name\": \"The order book\",\n      \"dur\": 20.5,\n      \"desc\": \"Order book: asks above, bids below, spread 10 USDT; a market buy takes the best ask and the last price ticks up.\"\n    },\n    {\n      \"id\": \"entry\",\n      \"name\": \"Order entry\",\n      \"dur\": 24,\n      \"desc\": \"Order entry: type, price and size; a limit buy of 0.010 BTC at 60,000 has an order value of 600 USDT; buttons are mock only.\"\n    },\n    {\n      \"id\": \"positions\",\n      \"name\": \"Positions and PnL\",\n      \"dur\": 24,\n      \"desc\": \"Positions panel: a filled order becomes a long position; unrealized PnL moves +6 / −6 USDT as price moves.\"\n    },\n    {\n      \"id\": \"wallet\",\n      \"name\": \"Your wallet\",\n      \"dur\": 18.5,\n      \"desc\": \"Wallet: 1,000 USDT balance, 600 in use, 400 available (1x example).\"\n    },\n    {\n      \"id\": \"security\",\n      \"name\": \"Security settings\",\n      \"dur\": 25.5,\n      \"desc\": \"Security drawer: two-factor login, anti-phishing code, withdrawal address list, API keys never shared.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"Read the label\",\n      \"dur\": 19.5,\n      \"desc\": \"Common mistake: tapping from memory after an app update hits Sell instead of Buy; correction: read the label and check the order.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Find it\",\n      \"dur\": 22,\n      \"desc\": \"Hotspot hunt: where is unrealized PnL? Countdown, then C, the positions panel; why not the chart.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Stay safe\",\n      \"dur\": 24,\n      \"desc\": \"Safety rules: check the address, check spot or futures, never explore on a real account, WAIT is always a choice.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 26.5,\n      \"desc\": \"Three key points and one question to check yourself.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T11, spot vs futures.\"\n    }\n  ]\n}\n","score.js":"kit.score(function (S, T) {\n  // A soft bed under the captions: pad and keys, a light pulse while we tour the screen, quieter for the safety parts.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.watchlist, T.security) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.security, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  const pop = (t, v) => S.fx('pop', t, { vel: v || 28, pitch: 7 });\n  const tick = (t, v) => S.fx('tick', t, { vel: v || 26 });\n  pop(T.title + 2.9);\n  // Hook: panels land, the mock label, then each region lights.\n  for (let i = 0; i < 6; i++) pop(T.hook + 0.4 + i * 0.45, 24);\n  S.fx('whoosh', T.hook + 5.9, { dur: 1.0, vel: 22 }); S.fx('chime', T.hook + 6.3, { vel: 32 });\n  for (let i = 0; i < 8; i++) tick(T.hook + 13.9 + i * 0.32, 22);\n  // Layout: one pop per numbered part.\n  [5.4, 6.3, 7.2, 8.1, 9.0, 10.3, 11.5, 12.7].forEach((a) => pop(T.layout + a, 30));\n  // Watchlist: typing, filter, tap, switch.\n  [6.9, 7.3, 7.7].forEach((a) => tick(T.watchlist + a, 30));\n  S.fx('whoosh', T.watchlist + 8.2, { dur: 0.8, vel: 20 }); pop(T.watchlist + 12.1, 34); S.fx('ding', T.watchlist + 13.2, { vel: 36 });\n  // Symbol bar: marks, then the example counts up.\n  [1.6, 7.0, 9.2].forEach((a) => pop(T.symbol + a, 28));\n  for (let i = 0; i < 8; i++) tick(T.symbol + 13.0 + i * 0.25, 20);\n  S.fx('ding', T.symbol + 16.0, { vel: 36 });\n  // Chart: candle grows, timeframe regroups.\n  pop(T.chart + 2.6); S.fx('whoosh', T.chart + 13.4, { dur: 1.0, vel: 22 }); pop(T.chart + 14.0, 30);\n  // Order book: spread, then a market buy takes the best ask.\n  pop(T.book + 7.6, 30); S.fx('whoosh', T.book + 14.3, { dur: 0.8, vel: 22 }); S.fx('thud', T.book + 15.1, { vel: 28 }); S.fx('ding', T.book + 15.6, { vel: 36 });\n  // Order entry: tabs, typing, value, the mock-only stamp.\n  [1.8, 3.2, 4.6].forEach((a) => tick(T.entry + a, 28));\n  for (let i = 0; i < 6; i++) tick(T.entry + 7.9 + i * 0.18, 22);\n  for (let i = 0; i < 5; i++) tick(T.entry + 9.9 + i * 0.2, 22);\n  S.fx('ding', T.entry + 14.2, { vel: 34 }); pop(T.entry + 19.9, 32); S.fx('thud', T.entry + 20.3, { vel: 32 });\n  // Positions: the fill, PnL up, PnL down.\n  S.fx('chime', T.positions + 1.8, { vel: 32 }); S.fx('ding', T.positions + 15.4, { vel: 34 }); S.fx('thud', T.positions + 18.0, { vel: 26 }); pop(T.positions + 19.8, 26);\n  // Wallet: in-use bar fills, available is found.\n  S.fx('whoosh', T.wallet + 6.8, { dur: 1.0, vel: 20 }); S.fx('ding', T.wallet + 13.4, { vel: 34 });\n  // Security: drawer, switches, the warning.\n  S.fx('whoosh', T.security + 1.6, { dur: 0.9, vel: 22 });\n  [6.0, 12.4, 14.6].forEach((a) => pop(T.security + a, 30));\n  S.fx('chime', T.security + 12.7, { vel: 28 }); S.fx('thud', T.security + 18.8, { vel: 28 });\n  // Mistake: the update swaps buttons, a tap from memory.\n  pop(T.mistake + 3.3, 26); S.fx('whoosh', T.mistake + 7.4, { dur: 1.0, vel: 24 }); S.fx('thud', T.mistake + 9.9, { vel: 34 }); S.fx('chime', T.mistake + 14.2, { vel: 32 });\n  // Try it: countdown and answer.\n  pop(T.try + 0.8, 30);\n  for (let i = 0; i < 5; i++) tick(T.try + 3.6 + i, 30);\n  S.fx('chime', T.try + 9.3, { vel: 42 }); pop(T.try + 16.0, 28);\n  [4.2, 9.4, 14.5, 20.2].forEach((a) => pop(T.risks + a, 28));\n  [0.8, 6.2, 12.1].forEach((a) => pop(T.recap + a, 32));\n  S.fx('ding', T.recap + 21.2, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 21.5, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T10 · Exchange platform tour',\n  TOTAL: 315,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount with a real minus sign: +6.00 / −6.00.\n  sgn(n, dp) { return (n >= 0 ? '+' : '−') + UI.fmt(Math.abs(n), dp); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // Eased path through keys [[t, value], ...].\n  path(keys) {\n    return (t) => {\n      let v = keys[0][1];\n      for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = a[1] + (b[1] - a[1]) * window.UI._eio(Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])))); }\n      return v;\n    };\n  },\n  _eio(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; },\n  // A small live wiggle so a price never sits perfectly still (fictional).\n  wig(t, amt) { return (Math.sin(t * 1.7) * 0.6 + Math.sin(t * 4.3 + 1) * 0.4) * amt; },\n  // Lowest and highest of fn over [a, b] (sampled), for a candle that is still forming.\n  hilo(fn, a, b) { let lo = fn(a), hi = lo; for (let s = a; s <= b; s += 0.05) { const v = fn(s); if (v < lo) lo = v; if (v > hi) hi = v; } const v = fn(b); return [Math.min(lo, v), Math.max(hi, v)]; },\n\n  // ── The educational mock terminal ─────────────────────────────────────────\n  // Regions in stage pixels. Everything sits above y 776 so the caption band stays clear.\n  R: {\n    top: { x: 100, y: 120, w: 1720, h: 70 },\n    sym: { x: 350, y: 120, w: 710, h: 70 },\n    wallet: { x: 1336, y: 120, w: 316, h: 70 },\n    sec: { x: 1662, y: 120, w: 158, h: 70 },\n    wl: { x: 100, y: 198, w: 290, h: 400 },\n    chart: { x: 400, y: 198, w: 710, h: 400 },\n    book: { x: 1120, y: 198, w: 320, h: 400 },\n    entry: { x: 1450, y: 198, w: 370, h: 578 },\n    pos: { x: 100, y: 606, w: 1340, h: 170 },\n  },\n  SYMS: [['BTC', 60000], ['ETH', 3000], ['SOL', 150], ['XRP', 0.5], ['ADA', 0.4]],\n  term(kit, o) {\n    o = o || {};\n    const R = UI.R, dim = 'color-mix(in srgb, var(--second) 58%, var(--ground))';\n    const box = (r, inner, cls) => '<div class=\"glass tm-p ' + (cls || '') + '\" style=\"left:' + r.x + 'px;top:' + r.y + 'px;width:' + r.w + 'px;height:' + r.h + 'px;border-radius:18px;overflow:hidden\">' + inner + '</div>';\n    const ab = (x, y, s, inner, cls) => '<div class=\"' + (cls || '') + '\" style=\"position:absolute;left:' + x + 'px;top:' + y + 'px;' + (s || '') + '\">' + inner + '</div>';\n    // Top bar\n    const top = box(R.top,\n      ab(24, 9, 'line-height:1.15', '<div style=\"font-size:23px;font-weight:700;letter-spacing:0\">exchange<span style=\"color:var(--main)\">.example</span></div><div class=\"fict\" style=\"font-size:16px;letter-spacing:.16em\">Educational mock</div>') +\n      ab(262, 14, 'width:2px;height:42px;background:color-mix(in srgb, var(--second) 14%, transparent)', '') +\n      ab(290, 14, 'display:flex;align-items:center;gap:12px;height:42px', '<span class=\"tm-sym\" style=\"font-size:28px;font-weight:700\"></span><span class=\"tm-perp\" style=\"font-size:22px;font-weight:600;padding:2px 10px;border-radius:8px;color:var(--main);border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent)\">Perp</span><span style=\"font-size:22px;color:' + \"feet\": 561,\n    \"bw\": 415\n  },\n  \"think\": {\n    \"w\": 465,\n    \"h\": 656,\n    \"ax\": 229,\n    \"feet\": 648,\n    \"bw\": 452\n  },\n  \"magnify\": {\n    \"w\": 187,\n    \"h\": 170,\n    \"ax\": 85.5,\n    \"feet\": 163,\n    \"bw\": 138\n  },\n  \"thumbs\": {\n    \"w\": 181,\n    \"h\": 179,\n    \"ax\": 102.0,\n    \"feet\": 172,\n    \"bw\": 138\n  },\n  \"confused\": {\n    \"w\": 185,\n    \"h\": 169,\n    \"ax\": 85.0,\n    \"feet\": 162,\n    \"bw\": 138\n  },\n  \"checklist\": {\n    \"w\": 185,\n    \"h\": 161,\n    \"ax\": 97.5,\n    \"feet\": 153,\n    \"bw\": 138\n  },\n  \"idea\": {\n    \"w\": 169,\n    \"h\": 178,\n    \"ax\": 69.5,\n    \"feet\": 171,\n    \"bw\": 138\n  },\n  \"cheer\": {\n    \"w\": 207,\n    \"h\": 182,\n    \"ax\": 105.0,\n    \"feet\": 175,\n    \"bw\": 138\n  },\n  \"laptop\": {\n    \"w\": 185,\n    \"h\": 170,\n    \"ax\": 82.0,\n    \"feet\": 164,\n    \"bw\": 138\n  },\n  \"pointer\": {\n    \"w\": 248,\n    \"h\": 171,\n    \"ax\": 74.5,\n    \"feet\": 164,\n    \"bw\": 138\n  },\n  \"typing\": {\n    \"w\": 207,\n    \"h\": 175,\n    \"ax\": 74.0,\n    \"feet\": 167,\n    \"bw\": 138\n  },\n  \"calm\": {\n    \"w\": 234,\n    \"h\": 174,\n    \"ax\": 111.0,\n    \"feet\": 167,\n    \"bw\": 138\n  },\n  \"wv1\": {\n    \"w\": 381,\n    \"h\": 448,\n    \"ax\": 163.5,\n    \"feet\": 434,\n    \"bw\": 305\n  },\n  \"wv2\": {\n    \"w\": 374,\n    \"h\": 448,\n    \"ax\": 165.0,\n    \"feet\": 436,\n    \"bw\": 305\n  },\n  \"wv3\": {\n    \"w\": 363,\n    \"h\": 448,\n    \"ax\": 166.0,\n    \"feet\": 431,\n    \"bw\": 305\n  },\n  \"wv4\": {\n    \"w\": 375,\n    \"h\": 446,\n    \"ax\": 166.0,\n    \"feet\": 431,\n    \"bw\": 305\n  },\n  \"wk0\": {\n    \"w\": 353,\n    \"h\": 460,\n    \"ax\": 162.5,\n    \"feet\": 446,\n    \"bw\": 310\n  },\n  \"wk1\": {\n    \"w\": 361,\n    \"h\": 460,\n    \"ax\": 164.5,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk2\": {\n    \"w\": 345,\n    \"h\": 460,\n
