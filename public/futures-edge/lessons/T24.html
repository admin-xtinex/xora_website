<script>window.FILM = {"id":"T24","width":1920,"height":1080,"scenes":[{"id":"title","name":"Meet XORA","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"what","name":"One engine, three modes","dur":28,"k":1,"oldStart":8,"oldDur":28},{"id":"tabs","name":"Five tabs","dur":18,"k":1,"oldStart":36,"oldDur":18},{"id":"home","name":"The Home tab","dur":22,"k":1,"oldStart":54,"oldDur":22},{"id":"signals","name":"The Signals tab","dur":24,"k":1,"oldStart":76,"oldDur":24},{"id":"xoratab","name":"The XORA tab","dur":22,"k":1,"oldStart":100,"oldDur":22},{"id":"trades","name":"Trades and Settings","dur":15,"k":1,"oldStart":122,"oldDur":15},{"id":"flow","name":"The workflow","dur":24,"k":1,"oldStart":137,"oldDur":24},{"id":"approve","name":"You approve","dur":21,"k":1,"oldStart":161,"oldDur":21},{"id":"settings","name":"Trade Settings","dur":28.08,"k":1.17,"oldStart":182,"oldDur":24},{"id":"safety","name":"Safety settings","dur":26,"k":1,"oldStart":206,"oldDur":26},{"id":"mistake","name":"A common mistake","dur":18,"k":1,"oldStart":232,"oldDur":18},{"id":"try","name":"Try it","dur":18,"k":1,"oldStart":250,"oldDur":18},{"id":"risks","name":"Know the limits","dur":21,"k":1,"oldStart":268,"oldDur":21},{"id":"recap","name":"Recap","dur":20,"k":1,"oldStart":289,"oldDur":20},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":309,"oldDur":10}],"voice":{"src":"T24/voice.mp3","lines":[{"t":0.6,"d":6.101,"text":"Phase six, lesson T24: meet XORA. Time to see the app that does the checking with you.","ml":"ആറാം ഘട്ടം, പാഠം T24: XORA-യെ പരിചയപ്പെടാം. നിന്നോടൊപ്പം പരിശോധന നടത്തുന്ന ആപ്പ് ഇനി കാണാം."},{"t":8.4,"d":5.061,"text":"XORA is an app that watches crypto coins, finds trade setups and helps you manage trades.","ml":"XORA ഒരു ആപ്പാണ്: crypto കോയിനുകൾ നിരീക്ഷിക്കും, trade setup-കൾ കണ്ടെത്തും, ട്രേഡുകൾ നോക്കിനടത്താൻ സഹായിക്കും."},{"t":15.2,"d":5.851,"text":"Behind it is one engine. It runs in three account modes: Demo, Live and Live Support.","ml":"അതിന് പിന്നിൽ ഒരൊറ്റ engine ആണ്. അത് മൂന്ന് അക്കൗണ്ട് മോഡുകളിൽ ഓടും: Demo, Live, Live Support."},{"t":22,"d":7.533,"text":"Demo uses simulated fills: no real money. Live sends real Binance futures orders. Live Support only alerts you.","ml":"Demo-യിൽ fill-കൾ സാങ്കൽപ്പികം: യഥാർത്ഥ പണമില്ല. Live യഥാർത്ഥ Binance futures ഓർഡറുകൾ അയയ്ക്കും. Live Support അലർട്ട് മാത്രം."},{"t":30.4,"d":4.193,"text":"Demo is the default. Start there, like a pilot in a flight simulator.","ml":"Demo ആണ് ഡിഫോൾട്ട്. ഫ്ലൈറ്റ് സിമുലേറ്ററിലെ പൈലറ്റിനെപ്പോലെ, അവിടെ നിന്ന് തുടങ്ങൂ."},{"t":36.3,"d":5.938,"text":"Five tabs sit along the bottom: Home, Signals, XORA in the centre, Trades and Settings.","ml":"താഴെ അഞ്ച് ടാബുകൾ: Home, Signals, നടുവിൽ XORA, Trades, Settings."},{"t":43,"d":5.533,"text":"Home is your overview. Signals is for studying a coin. XORA manages an open trade.","ml":"Home നിന്റെ മൊത്തം കാഴ്ച. Signals ഒരു കോയിൻ പഠിക്കാൻ. XORA തുറന്ന ട്രേഡ് നോക്കിനടത്തും."},{"t":49.4,"d":3.002,"text":"Trades is your history. Settings holds your rules.","ml":"Trades നിന്റെ ചരിത്രം. Settings-ൽ നിന്റെ നിയമങ്ങൾ."},{"t":54.4,"d":5.01,"text":"Home first. At the top: a countdown to the next engine check, and setups waiting.","ml":"ആദ്യം Home. മുകളിൽ: അടുത്ത engine check-ലേക്കുള്ള കൗണ്ട്ഡൗൺ, കാത്തിരിക്കുന്ന setup-കൾ."},{"t":61.2,"d":6.955,"text":"A pill shows DEMO or LIVE. Then the Bitcoin card, today's result, open P&L and trades in use.","ml":"ഒരു pill DEMO-യോ LIVE-ഓ കാണിക്കും. പിന്നെ Bitcoin കാർഡ്, ഇന്നത്തെ ഫലം, open PnL, ഉപയോഗത്തിലുള്ള ട്രേഡുകൾ."},{"t":68.705,"d":6.223,"text":"Your coins show a status: in trade, buy, sell, cooldown or watching. All numbers are fictional.","ml":"നിന്റെ കോയിനുകൾക്ക് ഒരു സ്റ്റാറ്റസ്: in trade, buy, sell, cooldown, watching. എല്ലാ സംഖ്യകളും സാങ്കൽപ്പികം."},{"t":76.4,"d":6.718,"text":"Signals is where you read one coin. Pick up to 20 coins yourself, or use Xora AI coin selection.","ml":"Signals-ൽ ഒരു കോയിൻ വായിക്കാം. 20 കോയിൻ വരെ നീ തന്നെ എടുക്കാം, അല്ലെങ്കിൽ Xora AI coin selection ഉപയോഗിക്കാം."},{"t":84,"d":6.705,"text":"Each coin has a price chart, a trade opportunity card, and an entry checklist: a tick or cross per check.","ml":"ഓരോ കോയിനും ഒരു വില ചാർട്ട്, trade opportunity കാർഡ്, entry checklist: ഓരോ check-നും ടിക്ക് അല്ലെങ്കിൽ ക്രോസ്."},{"t":92,"d":5.879,"text":"Two buttons stay at the bottom: BUY / LONG and SHORT / SELL, for your own manual orders.","ml":"താഴെ രണ്ട് ബട്ടണുകൾ എപ്പോഴും: BUY / LONG, SHORT / SELL. നിന്റെ സ്വന്തം മാനുവൽ ഓർഡറുകൾക്ക്."},{"t":100.4,"d":7.032,"text":"The XORA tab is the control room for an open trade: entry, leverage, margin, and the risk zone, the stop.","ml":"XORA ടാബ് തുറന്ന ട്രേഡിന്റെ കൺട്രോൾ റൂം: entry, leverage, margin, പിന്നെ risk zone, അതായത് stop."},{"t":108.6,"d":5.737,"text":"Unrealised P&L moves with price. The trailing stop can follow price and lock in some profit.","ml":"Unrealised PnL വിലയ്ക്കൊപ്പം മാറും. Trailing stop വിലയെ പിന്തുടർന്ന് കുറച്ച് ലാഭം ലോക്ക് ചെയ്യാം."},{"t":115.8,"d":3.918,"text":"If you want out, CLOSE POSITION ends the trade yourself, at any time.","ml":"പുറത്തിറങ്ങണമെങ്കിൽ, CLOSE POSITION കൊണ്ട് എപ്പോൾ വേണമെങ്കിലും നീ തന്നെ ട്രേഡ് അവസാനിപ്പിക്കാം."},{"t":122.4,"d":5.902,"text":"Trades shows My Trades: an overview, the full list, and insights. Losing trades are listed too.","ml":"Trades-ൽ My Trades: ഒരു overview, മുഴുവൻ ലിസ്റ്റ്, insights. നഷ്ടമായ ട്രേഡുകളും അതിലുണ്ട്."},{"t":129.6,"d":4.523,"text":"Settings holds Binance Connect, Trade Settings, Notifications and About.","ml":"Settings-ൽ Binance Connect, Trade Settings, Notifications, About."},{"t":137.4,"d":2.11,"text":"Here is the workflow XORA supports.","ml":"XORA പിന്തുണയ്ക്കുന്ന workflow ഇതാ."},{"t":141.2,"d":6.399,"text":"One: choose coins, or use Xora AI coin selection. Two: read a coin on Signals.","ml":"ഒന്ന്: കോയിനുകൾ എടുക്കുക, അല്ലെങ്കിൽ Xora AI coin selection. രണ്ട്: Signals-ൽ ഒരു കോയിൻ വായിക്കുക."},{"t":148.149,"d":5.785,"text":"Three: a setup triggers. Four: approve it, place your own BUY or SHORT, or simply skip it.","ml":"മൂന്ന്: ഒരു setup ട്രിഗർ ആകും. നാല്: അത് approve ചെയ്യാം, സ്വന്തം BUY അല്ലെങ്കിൽ SHORT ഇടാം, അല്ലെങ്കിൽ ഒഴിവാക്കാം."},{"t":154.484,"d":5.562,"text":"Five: manage the open trade on the XORA tab. Six: review it later in Trades.","ml":"അഞ്ച്: തുറന്ന ട്രേഡ് XORA ടാബിൽ നോക്കിനടത്തുക. ആറ്: പിന്നീട് Trades-ൽ റിവ്യൂ ചെയ്യുക."},{"t":161.4,"d":4.965,"text":"Auto trade approval is off by default. A triggered setup then waits for you to tap Approve.","ml":"Auto trade approval ഡിഫോൾട്ടായി off ആണ്. അപ്പോൾ ട്രിഗർ ആയ setup നീ Approve അമർത്താൻ കാത്തിരിക്കും."},{"t":168.4,"d":5.206,"text":"The approval has a short timer. If you do nothing, it expires and no trade is opened.","ml":"Approval-ന് ചെറിയൊരു ടൈമർ ഉണ്ട്. നീ ഒന്നും ചെയ്തില്ലെങ്കിൽ അത് expire ആകും, ട്രേഡ് തുറക്കില്ല."},{"t":175,"d":4.61,"text":"On a manual order, the sheet tells you if the engine agrees, or if this one is your call.","ml":"മാനുവൽ ഓർഡറിൽ, engine യോജിക്കുന്നുണ്ടോ, അതോ ഇത് നിന്റെ തീരുമാനമാണോ എന്ന് ഷീറ്റ് പറയും."},{"t":182.468,"d":6.679,"text":"Trade Settings are your rules: capital per trade, leverage, concurrent trades, coin selection and more.","ml":"Trade Settings നിന്റെ നിയമങ്ങളാണ്: capital per trade, leverage, concurrent trades, coin selection, പിന്നെ മറ്റു ചിലതും."},{"t":191.594,"d":9.821,"text":"Example: 3 USDT margin at 10x leverage controls a 30 USDT position. Leverage magnifies losses too.","ml":"ഉദാഹരണം: 10x leverage-ൽ 3 USDT margin ഒരു 30 USDT position നിയന്ത്രിക്കും. Leverage നഷ്ടവും വലുതാക്കും."},{"t":201.965,"d":6.311,"text":"With 2 concurrent trades, up to 60 USDT of positions can be open at once. Fictional example.","ml":"2 concurrent trades ആണെങ്കിൽ, ഒരേ സമയം 60 USDT വരെ position തുറന്നിരിക്കാം. സാങ്കൽപ്പിക ഉദാഹരണം."},{"t":210.48,"d":5.657,"text":"Now the safety settings. Every trade gets a stop. If a stop cannot be placed, the trade is closed.","ml":"ഇനി safety settings. ഓരോ ട്രേഡിനും ഒരു stop. Stop വെക്കാൻ പറ്റിയില്ലെങ്കിൽ ട്രേഡ് ക്ലോസ് ചെയ്യും."},{"t":217.88,"d":7.574,"text":"Concurrent trades caps open trades, one per coin. A daily stop loss pauses new entries until 00:00 IST.","ml":"Concurrent trades തുറന്ന ട്രേഡുകൾക്ക് പരിധി വെക്കും, ഒരു കോയിന് ഒന്ന്. Daily stop loss 00:00 IST വരെ പുതിയ entry നിർത്തും."},{"t":226.08,"d":6.81,"text":"For Live, use an API key with futures trading on and withdrawals disabled. The secret is stored encrypted.","ml":"Live-ന്, futures trading ഓൺ, withdrawals disabled ആയ API key ഉപയോഗിക്കുക. Secret എൻക്രിപ്റ്റ് ചെയ്ത് സൂക്ഷിക്കും."},{"t":236.48,"d":5.276,"text":"A common mistake: switching to Live on day one with high leverage, because the app looks smart.","ml":"ഒരു സാധാരണ തെറ്റ്: ആപ്പ് സ്മാർട്ട് ആണെന്ന് തോന്നി, ആദ്യ ദിവസം തന്നെ ഉയർന്ന leverage-ൽ Live-ലേക്ക് മാറുന്നത്."},{"t":243.88,"d":6.214,"text":"Better: practise in Demo first, keep leverage low, and treat every setup as a maybe, not a promise.","ml":"നല്ലത്: ആദ്യം Demo-യിൽ പരിശീലിക്കുക, leverage കുറച്ച് വെക്കുക, ഓരോ setup-ഉം ഉറപ്പല്ല, ഒരു സാധ്യത മാത്രം."},{"t":254.48,"d":5.156,"text":"Your turn. Auto trade approval is off, and a setup triggers. What happens next?","ml":"നിന്റെ ഊഴം. Auto trade approval off ആണ്, ഒരു setup ട്രിഗർ ആകുന്നു. അടുത്തത് എന്ത് സംഭവിക്കും?"},{"t":264.08,"d":4.491,"text":"It waits for your Approve. If you don't approve before it expires, no trade is opened.","ml":"അത് നിന്റെ Approve-നായി കാത്തിരിക്കും. Expire ആകുന്നതിന് മുൻപ് approve ചെയ്തില്ലെങ്കിൽ ട്രേഡ് തുറക്കില്ല."},{"t":272.38,"d":7.076,"text":"Know the limits. XORA is a tool, not a guarantee. Setups can fail, and stops can slip in fast markets.","ml":"പരിധികൾ അറിയുക. XORA ഒരു ടൂളാണ്, ഗ്യാരന്റിയല്ല. Setup-കൾ പരാജയപ്പെടാം, വേഗമുള്ള മാർക്കറ്റിൽ stop-കൾ slip ആകാം."},{"t":280.08,"d":6.036,"text":"In Live, losses are real money, and leverage makes them bigger. Fees come out of every trade.","ml":"Live-ൽ നഷ്ടം യഥാർത്ഥ പണമാണ്, leverage അത് വലുതാക്കും. ഓരോ ട്രേഡിൽ നിന്നും ഫീസ് പോകും."},{"t":287.18,"d":4.656,"text":"XORA does not guarantee profits. Demo first. This is not financial advice.","ml":"XORA ലാഭം ഗ്യാരന്റി ചെയ്യുന്നില്ല. ആദ്യം Demo. ഇത് സാമ്പത്തിക ഉപദേശമല്ല."},{"t":293.48,"d":4.043,"text":"Recap. One engine, three modes, and Demo is where you start.","ml":"ചുരുക്കം. ഒരു engine, മൂന്ന് മോഡുകൾ, തുടങ്ങേണ്ടത് Demo-യിൽ."},{"t":298.38,"d":6.936,"text":"Five tabs, one workflow: coins, Signals, a setup, your approval, the XORA tab, then Trades.","ml":"അഞ്ച് ടാബുകൾ, ഒരു workflow: കോയിനുകൾ, Signals, ഒരു setup, നിന്റെ approval, XORA ടാബ്, പിന്നെ Trades."},{"t":305.866,"d":6.179,"text":"And safety first: a stop on every trade, a daily stop loss, and withdrawals off on your API key.","ml":"സുരക്ഷ ആദ്യം: ഓരോ ട്രേഡിനും stop, ഒരു daily stop loss, API key-യിൽ withdrawals off."},{"t":313.68,"d":8.706,"text":"Next, T25: how XORA analyses a coin. XORA does not guarantee profits. Demo first. Not financial advice.","ml":"അടുത്തത് T25: XORA ഒരു കോയിൻ എങ്ങനെ വിശകലനം ചെയ്യുന്നു. XORA ലാഭം ഗ്യാരന്റി ചെയ്യുന്നില്ല. ആദ്യം Demo. സാമ്പത്തിക ഉപദേശമല്ല."}]},"assetBase":"T24/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":331,"h":446},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor ter; font-family:var(--display, sans-serif); font-weight:700; font-size:28px; color:var(--ground); background:linear-gradient(135deg, var(--main), var(--accent)); box-shadow:0 0 0 5px #070915 }\n.ph-lab { position:absolute; margin:0; text-align:center; font-size:19px; line-height:1.5; letter-spacing:.12em }\n.pc { box-sizing:border-box; border-radius:20px; padding:12px 16px; background:color-mix(in srgb, var(--ground) 84%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent) }\n.pk { margin:0; font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 58%, var(--ground)) }\n.pv { margin:0; font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums; font-size:30px; color:var(--second) }\n.pt { margin:0; font-size:24px; line-height:1.35; font-weight:600 }\n.pill { display:inline-flex; align-items:center; gap:8px; padding:4px 14px; border-radius:999px; font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.06em; border:1.5px solid currentColor; white-space:nowrap }\n.btn { display:flex; align-items:center; justify-content:center; border-radius:16px; font-weight:700; font-size:24px; letter-spacing:.04em; white-space:nowrap }\n.flow { position:absolute; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; padding:18px 22px; border-radius:22px; background:color-mix(in srgb, var(--ground) 86%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent) }\n","narration.json":"{\n  \"about\": \"T24 captions (no voiceover yet): Meet XORA. Each line starts at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Phase six, lesson T24: meet XORA. Time to see the app that does the checking with you.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"XORA is an app that watches crypto coins, finds trade setups and helps you manage trades.\"\n    },\n    {\n      \"t\": 15.2,\n      \"text\": \"Behind it is one engine. It runs in three account modes: Demo, Live and Live Support.\"\n    },\n    {\n      \"t\": 22.0,\n      \"text\": \"Demo uses simulated fills: no real money. Live sends real Binance futures orders. Live Support only alerts you.\"\n    },\n    {\n      \"t\": 30.4,\n      \"text\": \"Demo is the default. Start there, like a pilot in a flight simulator.\"\n    },\n    {\n      \"t\": 36.3,\n      \"text\": \"Five tabs sit along the bottom: Home, Signals, XORA in the centre, Trades and Settings.\"\n    },\n    {\n      \"t\": 43.0,\n      \"text\": \"Home is your overview. Signals is for studying a coin. XORA manages an open trade.\"\n    },\n    {\n      \"t\": 49.4,\n      \"text\": \"Trades is your history. Settings holds your rules.\"\n    },\n    {\n      \"t\": 54.4,\n      \"text\": \"Home first. At the top: a countdown to the next engine check, and setups waiting.\"\n    },\n    {\n      \"t\": 61.2,\n      \"text\": \"A pill shows DEMO or LIVE. Then the Bitcoin card, today's result, open P&L and trades in use.\"\n    },\n    {\n      \"t\": 68.4,\n      \"text\": \"Your coins show a status: in trade, buy, sell, cooldown or watching. All numbers are fictional.\"\n    },\n    {\n      \"t\": 76.4,\n      \"text\": \"Signals is where you read one coin. Pick up to 20 coins yourself, or use Xora AI coin selection.\"\n    },\n    {\n      \"t\": 84.0,\n      \"text\": \"Each coin has a price chart, a trade opportunity card, and an entry checklist: a tick or cross per check.\"\n    },\n    {\n      \"t\": 92.0,\n      \"text\": \"Two buttons stay at the bottom: BUY / LONG and SHORT / SELL, for your own manual orders.\"\n    },\n    {\n      \"t\": 100.4,\n      \"text\": \"The XORA tab is the control room for an open trade: entry, leverage, margin, and the risk zone, the stop.\"\n    },\n    {\n      \"t\": 108.6,\n      \"text\": \"Unrealised P&L moves with price. The trailing stop can follow price and lock in some profit.\"\n    },\n    {\n      \"t\": 115.8,\n      \"text\": \"If you want out, CLOSE POSITION ends the trade yourself, at any time.\"\n    },\n    {\n      \"t\": 122.4,\n      \"text\": \"Trades shows My Trades: an overview, the full list, and insights. Losing trades are listed too.\"\n    },\n    {\n      \"t\": 129.6,\n      \"text\": \"Settings holds Binance Connect, Trade Settings, Notifications and About.\"\n    },\n    {\n      \"t\": 137.4,\n      \"text\": \"Here is the workflow XORA supports.\"\n    },\n    {\n      \"t\": 141.2,\n      \"text\": \"One: choose coins, or use Xora AI coin selection. Two: read a coin on Signals.\"\n    },\n    {\n      \"t\": 147.4,\n      \"text\": \"Three: a setup triggers. Four: approve it, place your own BUY or SHORT, or simply skip it.\"\n    },\n    {\n      \"t\": 154.4,\n      \"text\": \"Five: manage the open trade on the XORA tab. Six: review it later in Trades.\"\n    },\n    {\n      \"t\": 161.4,\n      \"text\": \"Auto trade approval is off by default. A triggered setup then waits for you to tap Approve.\"\n    },\n    {\n      \"t\": 168.4,\n      \"text\": \"The approval has a short timer. If you do nothing, it expires and no trade is opened.\"\n    },\n    {\n      \"t\": 175.0,\n      \"text\": \"On a manual order, the sheet tells you if the engine agrees, or if this one is your call.\"\n    },\n    {\n      \"t\": 182.4,\n      \"text\": \"Trade Settings are your rules: capital per trade, leverage, concurrent trades, coin selection and more.\"\n    },\n    {\n      \"t\": 190.2,\n      \"text\": \"Example: 3 USDT margin at 10x leverage controls a 30 USDT position. Leverage magnifies losses too.\"\n    },\n    {\n      \"t\": 197.8,\n      \"text\": \"With 2 concurrent trades, up to 60 USDT of positions can be open at once. Fictional example.\"\n    },\n    {\n      \"t\": 206.4,\n      \"text\": \"Now the safety settings. Every trade gets a stop. If a stop cannot be placed, the trade is closed.\"\n    },\n    {\n      \"t\": 213.8,\n      \"text\": \"Concurrent trades caps open trades, one per coin. A daily stop loss pauses new entries until 00:00 IST.\"\n    },\n    {\n      \"t\": 222.0,\n      \"text\": \"For Live, use an API key with futures trading on and withdrawals disabled. The secret is stored encrypted.\"\n    },\n    {\n      \"t\": 232.4,\n      \"text\": \"A common mistake: switching to Live on day one with high leverage, because the app looks smart.\"\n    },\n    {\n      \"t\": 239.8,\n      \"text\": \"Better: practise in Demo first, keep leverage low, and treat every setup as a maybe, not a promise.\"\n    },\n    {\n      \"t\": 250.4,\n      \"text\": \"Your turn. Auto trade approval is off, and a setup triggers. What happens next?\"\n    },\n    {\n      \"t\": 260.0,\n      \"text\": \"It waits for your Approve. If you don't approve before it expires, no trade is opened.\"\n    },\n    {\n      \"t\": 268.3,\n      \"text\": \"Know the limits. XORA is a tool, not a guarantee. Setups can fail, and stops can slip in fast markets.\"\n    },\n    {\n      \"t\": 276.0,\n      \"text\": \"In Live, losses are real money, and leverage makes them bigger. Fees come out of every trade.\"\n    },\n    {\n      \"t\": 283.1,\n      \"text\": \"XORA does not guarantee profits. Demo first. This is not financial advice.\"\n    },\n    {\n      \"t\": 289.4,\n      \"text\": \"Recap. One engine, three modes, and Demo is where you start.\"\n    },\n    {\n      \"t\": 294.3,\n      \"text\": \"Five tabs, one workflow: coins, Signals, a setup, your approval, the XORA tab, then Trades.\"\n    },\n    {\n      \"t\": 301.3,\n      \"text\": \"And safety first: a stop on every trade, a daily stop loss, and withdrawals off on your API key.\"\n    },\n    {\n      \"t\": 309.6,\n      \"text\": \"Next, T25: how XORA analyses a coin. XORA does not guarantee profits. Demo first. Not financial advice.\"\n    }\n  ]\n}","scene-approve.js":"const { seg, eo, ei, eob, eio, lerp } = kit;\nconst AP_CALL = [\n  [0.6, 'Auto trade approval · OFF', 'The default: a triggered setup waits for your Approve'],\n  [7.4, 'Do nothing?', 'The timer runs out. It expires, and no trade is opened.'],\n  [14.0, 'Manual orders', 'The sheet says if the engine agrees, or if it is your call'],\n];\nkit.scene('approve', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.head = UI.head(kit, 'You stay in control', 'Approve, or let it pass');\n    AP_CALL.forEach((c, i) => { c.st = UI.card(kit, 140, 290 + i * 150, 860, c[1], c[2], { fs: 28, pad: '18px 28px' }); });\n    const body = '<div class=\"ap-main\" style=\"display:flex;flex-direction:column;gap:12px\"><p style=\"margin:0;font-family:var(--display);font-weight:700;font-size:34px\">SOL / USDT</p>' +\n      '<div class=\"pc ap-c\" style=\"display:flex;flex-direction:column;gap:8px\"><p class=\"pk\">Setups awaiting approval</p>' +\n      '<p class=\"pt\"><span class=\"up\">BUY</span> · Support reclaim</p>' +\n      '<div class=\"mono\" style=\"display:flex;justify-content:space-between;font-size:22px\"><span>ENTRY 150.30</span><span class=\"dn\">STOP 149.40</span></div>' +\n      '<span class=\"btn ap-ok\" style=\"height:54px;background:var(--main);color:var(--ground)\"></span>' +\n      '<span class=\"btn\" style=\"height:46px;font-size:22px;border:1.5px solid color-mix(in srgb, var(--second) 30%, transparent)\">Skip</span></div>' +\n      '<p class=\"ap-x\" style=\"margin:0;font-size:24px;font-weight:700;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">Expired · no trade opened</p></div>' +\n      '<div class=\"ap-sh\" style=\"position:absolute;left:-18px;right:-18px;bottom:0;padding:16px 22px 14px;border-radius:30px 30px 0 0;background:#0d1122;border-top:2px solid color-mix(in srgb, var(--main) 40%, transparent);display:flex;flex-direction:column;gap:10px\">' +\n      '<div style=\"display:flex;align-items:center;gap:10px\"><span style=\"flex:1;font-size:28px;font-weight:700\">BUY SOL</span><span class=\"pill up\">LONG</span></div>' +\n      '<p class=\"pk\" style=\"text-transform:none;letter-spacing:0\">Market order · fills now</p>' +\n      '<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px\"><div class=\"pc\"><p class=\"pk\">Position</p><p class=\"pv\" style=\"font-size:26px\">30.00</p><p class=\"pk\" style=\"text-transform:none\">3.00 × 10x</p></div><div class=\"pc\"><p class=\"pk\">Stop loss</p><p class=\"pv dn\" style=\"font-size:26px\">149.40</p></div></div>' +\n      '<div class=\"pc ap-m\" style=\"min-height:118px\"><p class=\"ap-m1\" style=\"margin:0;font-size:22px;line-height:1.35;color:var(--up)\">✓ The engine agrees — a setup in this direction is live now.</p>' +\n      '<p class=\"ap-m2\" style=\"margin:0;font-size:22px;line-height:1.35;color:color-mix(in srgb, var(--second) 75%, var(--ground))\">ⓘ The engine has no setup on this coin right now — this one is your call.</p></div>' +\n      '<div style=\"display:flex;gap:10px\"><span class=\"btn\" style=\"flex:1;height:52px;border:1.5px solid color-mix(in srgb, var(--second) 30%, transparent)\">Cancel</span><span class=\"btn\" style=\"flex:1;height:52px;background:var(--up);color:var(--ground)\">Confirm</span></div></div>';\n    this.ph = UI.phone(kit, { x: 1110, y: 150, w: 460, h: 640, tab: 1, body });\n    this.ph.q('.ph-scr').style.isolation = 'isolate';\n    const q = (s) => this.ph.q(s);\n    this.ok = q('.ap-ok'); this.main = q('.ap-main').style; this.c = q('.ap-c').style; this.x = q('.ap-x').style; this.sh = q('.ap-sh').style;\n    this.m1 = q('.ap-m1').style; this.m2 = q('.ap-m2').style; this.m = q('.ap-m').style;\n    this.m2.position = 'absolute'; this.m2.left = '16px'; this.m2.right = '16px'; this.m2.top = '12px';\n    this.m.position = 'relative';\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'typing' }, { t: 7.4, pose: 'think' }, { t: 14.0, pose: 'laptop' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t); this.head(t);\n    this.ph.render(t, 0.2);\n    const left = 12.4 - t;\n    UI.set(this.ok, left > 0 ? 'Approve buy · expires ' + UI.mmss(left) : 'Expired');\n    const ex = eo(seg(t, 12.4, 12.9));\n    this.c.opacity = (eo(seg(t, 1.0, 1.5)) * lerp(1, 0.4, ex)).toFixed(3);\n    this.c.transform = 'translateY(' + lerp(20, 0, eo(seg(t, 1.0, 1.6))).toFixed(1) + 'px)';\n    UI.glow(this.c, eo(seg(t, 1.6, 2.0)) * (1 - ex) * (0.6 + 0.4 * Math.sin(t * 4)));\n    this.ok.style.background = left > 0 ? 'var(--main)' : 'color-mix(in srgb, var(--second) 25%, var(--ground))';\n    this.x.opacity = ex.toFixed(3);\n    const sp = eio(seg(t, 14.0, 14.8));\n    this.sh.transform = 'translateY(' + lerp(560, 0, sp).toFixed(1) + 'px)';\n    this.sh.opacity = sp > 0 ? 1 : 0;\n    this.main.opacity = (1 - 0.85 * sp).toFixed(3);\n    const sw = eo(seg(t, 17.6, 18.0));\n    this.m1.opacity = (1 - sw).toFixed(3); this.m2.opacity = sw.toFixed(3);\n    UI.glow(this.m, eo(seg(t, 15.0, 15.4)) * (0.7 + 0.3 * Math.sin(t * 4)));\n    AP_CALL.forEach((c, i) => {\n      const p2 = seg(t, c[0], c[0] + 0.6), nxt = AP_CALL[i + 1];\n      c.st.opacity = (eo(p2) * (nxt && t > nxt[0] ? 0.55 : 1)).toFixed(3);\n      c.st.transform = 'translateX(' + lerp(30, 0, eo(p2)).toFixed(1) + 'px)';\n    });\n    this.tutor.render(t);\n  },\n});\n","scene-flow.js":"const { seg, eo, ei, eob, eio, lerp, clamp01 } = kit;\nconst FL_S = [\n  ['Pick coins', 'Your own list, or Xora AI coin selection', 4.4],\n  ['Read a coin', 'On the Signals tab', 7.8],\n  ['A setup triggers', 'Price reaches the plan', 10.6],\n  ['Approve or place your own', 'Or skip it: no trade', 13.4],\n  ['Manage', 'On the XORA tab', 17.6],\n  ['Review', 'In Trades', 20.8],\n];\nconst FL_POS = FL_S.map((s, i) => [140 + (i % 3) * 520, i < 3 ? 300 : 560]);\nconst FL_C = FL_POS.map((p) => [p[0] nder(t);\n  },\n});\n","scene-what.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst WH_MODES = [\n  ['DEMO', 'Simulated fills · no real money', 'Default · start here', 'var(--main)'],\n  ['LIVE', 'Real Binance USD-M Futures orders', 'Opt-in · needs an API key · asks you to confirm', 'var(--up)'],\n  ['LIVE SUPPORT', 'Watches your live account and alerts you', 'Places no order on its own', 'var(--accent)'],\n];\nconst WH_E = [330, 610];\nkit.scene('what', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let ticks = '', paths = '', dots = '';\n    for (let i = 0; i < 36; i++) { const a = i / 36 * Math.PI * 2; ticks += '<line x1=\"' + (Math.cos(a) * 118).toFixed(1) + '\" y1=\"' + (Math.sin(a) * 118).toFixed(1) + '\" x2=\"' + (Math.cos(a) * (i % 3 ? 128 : 138)).toFixed(1) + '\" y2=\"' + (Math.sin(a) * (i % 3 ? 128 : 138)).toFixed(1) + '\"/>'; }\n    WH_MODES.forEach((m, i) => {\n      const y = 445 + i * 140;\n      const d = 'M' + (WH_E[0] + 140) + ' ' + WH_E[1] + ' C ' + (WH_E[0] + 230) + ' ' + WH_E[1] + ' ' + 520 + ' ' + y + ' ' + 620 + ' ' + y;\n      paths += '<path class=\"wh-p\" d=\"' + d + '\" pathLength=\"1\" fill=\"none\" stroke-width=\"3\" style=\"stroke:color-mix(in srgb, ' + m[3] + ' 60%, transparent)\"/>';\n      dots += '<circle class=\"wh-d\" r=\"9\" style=\"fill:' + m[3] + '\"/>';\n    });\n    let cards = '';\n    WH_MODES.forEach((m, i) => {\n      cards += '<div class=\"glass wh-c\" style=\"left:620px;top:' + (390 + i * 140) + 'px;width:960px;height:120px;padding:12px 28px;display:flex;align-items:center;gap:26px;border-color:color-mix(in srgb, ' + m[3] + ' 45%, transparent)\">' +\n        '<span class=\"pill\" style=\"color:' + m[3] + ';font-size:26px;min-width:150px;justify-content:center\">' + m[0] + '</span>' +\n        '<div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:32px;font-weight:700\">' + m[1] + '</span><span style=\"font-size:28px;color:color-mix(in srgb, var(--second) 62%, var(--gr )) * (1 - ei(seg(t, 15.4, 15.8))), lock > 0 ? 'var(--up)' : 'var(--down)');\n    UI.glow(this.cl, eo(seg(t, 16.0, 16.4)) * (0.7 + 0.3 * Math.sin(t * 4)), 'var(--down)');\n    XT_CALL.forEach((c, i) => {\n      const p2 = seg(t, c[0], c[0] + 0.6), nxt = XT_CALL[i + 1];\n      c.st.opacity = (eo(p2) * (nxt && t > nxt[0] ? 0.55 : 1)).toFixed(3);\n      c.st.transform = 'translateX(' + lerp(30, 0, eo(p2)).toFixed(1) + 'px)';\n    });\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Meet XORA\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 6 XORA Intelligence, lesson T24, Meet XORA; the tutor walks in beside a phone mock.\"\n    },\n    {\n      \"id\": \"what\",\n      \"name\": \"One engine, three modes\",\n      \"dur\": 28,\n      \"desc\": \"What XORA is: one engine that runs in Demo (default, simulated fills), Live (real Binance futures orders, opt-in) or Live Support (alerts only).\"\n    },\n    {\n      \"id\": \"tabs\",\n      \"name\": \"Five tabs\",\n      \"dur\": 18,\n      \"desc\": \"The five tabs light up in turn: Home, Signals, XORA (centre), Trades, Settings, each with what it shows.\"\n    },\n    {\n      \"id\": \"home\",\n      \"name\": \"The Home tab\",\n      \"dur\": 22,\n      \"desc\": \"Home mock: next engine check countdown, setups waiting, DEMO pill, BTC card with sparkline, account row and your coins with statuses.\"\n    },\n    {\n      \"id\": \"signals\",\n      \"name\": \"The Signals tab\",\n      \"dur\": 24,\n      \"desc\": \"Signals mock: coin picker or Xora AI coin selection, price chart forming, trade opportunity card, entry checklist ticks, BUY / LONG and SHORT / SELL buttons.\"\n    },\n    {\n      \"id\": \"xoratab\",\n      \"name\": \"The XORA tab\",\n      \"dur\": 22,\n      \"desc\": \"XORA tab mock: entry, leverage, margin, risk zone; unrealised P&L counting with price; trailing stop moving up; close position.\"\n    },\n    {\n      \"id\": \"trades\",\n      \"name\": \"Trades and Settings\",\n      \"dur\": 15,\n      \"desc\": \"Trades mock (My Trades: Overview, Trades, Insights, wins and losses listed) then the Settings list.\"\n    },\n    {\n      \"id\": \"flow\",\n      \"name\": \"The workflow\",\n      \"dur\": 24,\n      \"desc\": \"Six-step workflow: pick coins, read a coin on Signals, a setup triggers, approve or place your own (or skip), manage on XORA, review in Trades.\"\n    },\n    {\n      \"id\": \"approve\",\n      \"name\": \"You approve\",\n      \"dur\": 21,\n      \"desc\": \"Auto trade approval off: a setup waits for Approve and expires with no trade; the manual order sheet says if the engine agrees or it is your call.\"\n    },\n    {\n      \"id\": \"settings\",\n      \"name\": \"Trade Settings\",\n      \"dur\": 24,\n      \"desc\": \"Trade Settings mock and a worked example: 3 USDT margin at 10x is a 30 USDT position; 2 concurrent trades is up to 60 USDT; a 1% move is 0.30 USDT.\"\n    },\n    {\n      \"id\": \"safety\",\n      \"name\": \"Safety settings\",\n      \"dur\": 26,\n      \"desc\": \"Four safety pieces animate: a stop on every trade (safety close), daily stop loss pausing entries until 00:00 IST, concurrent trades and one per coin, API key with withdrawals disabled.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"A common mistake\",\n      \"dur\": 18,\n      \"desc\": \"Mistake: Live on day one with high leverage; correction: Demo first, low leverage, every setup is a maybe.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 18,\n      \"desc\": \"Pause and answer: auto approval is off and a setup triggers; the answer: it waits for your Approve or expires with no trade.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the limits\",\n      \"dur\": 21,\n      \"desc\": \"Risk cards: a tool not a guarantee, real losses in Live, leverage and fees, account security.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 20,\n      \"desc\": \"Three points: one engine and three modes, five tabs and one workflow, safety settings.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T25, how XORA analyses a coin; risk line.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // A quiet bed for a lesson that will carry a voiceover: pad and soft keys, a light pulse in the hands-on parts.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.flow, T.mistake);\n  const quiet = (s) => inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 28 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 42 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  [[T.title, 1.1], [T.what, 9.4], [T.what, 9.9], [T.what, 10.4], [T.what, 23.2], [T.home, 0.8], [T.home, 7.4], [T.home, 10.6], [T.home, 14.6], [T.signals, 0.6], [T.signals, 8.2], [T.signals, 16.2],\n   [T.xoratab, 0.6], [T.xoratab, 8.6], [T.xoratab, 15.8], [T.trades, 0.6], [T.trades, 7.6], [T.approve, 0.6], [T.approve, 7.4], [T.approve, 14.0], [T.settings, 7.8], [T.mistake, 7.8], [T.recap, 0.6], [T.recap, 5.5], [T.recap, 12.5], [T.next, 1.3]]\n    .forEach((b) => S.fx('pop', b[0] + b[1], { vel: 28, pitch: 7 }));\n  S.fx('whoosh', T.what + 9.0, { dur: 1.0, vel: 22 });\n  [14.6, 16.9, 19.3].forEach((a) => S.fx('chime', T.what + a, { vel: 26 }));\n  [7.4, 9.4, 11.4, 13.6, 15.3].forEach((a) => S.fx('tick', T.tabs + a, { vel: 30 }));\n  for (let i = 0; i < 5; i++) S.fx('pop', T.tabs + 1.4 + i * 0.45, { vel: 22, pitch: 5 });\n  for (let i = 0; i < 12; i++) S.fx('tick', T.signals + 1.0 + i * 0.35, { vel: 16 });\n  S.fx('ding', T.signals + 4.6, { vel: 30 });\n  S.fx('whoosh', T.signals + 8.4, { dur: 0.9, vel: 20 });\n  for (let i = 0; i < 4; i++) S.fx(i === 3 ? 'thud' : 'tick', T.signals + 11.8 + i * 0.7, { vel: 30 });\n  S.fx('chime', T.xoratab + 12.6, { vel: 30 });\n  S.fx('whoosh', T.trades + 7.4, { dur: 0.8, vel: 20 });\n  for (let i = 1; i < 6; i++) S.fx('ding', T.flow + [4.4, 7.8, 10.6, 13.4, 17.6, 20.8][i], { vel: 26 });\n  S.fx('ding', T.flow + 4.4, { vel: 26 });\n  for (let i = 0; i < 10; i++) S.fx('tick', T.approve + 2.4 + i, { vel: 18 });\n  S.fx('thud', T.approve + 12.4, { vel: 30 });\n  S.fx('whoosh', T.approve + 14.0, { dur: 0.9, vel: 22 });\n  [8.2, 11.6, 15.8].forEach((a) => S.fx('ding', T.settings + a, { vel: 30 }));\n  [0.6, 7.8, 11.0, 16.0].forEach((a) => S.fx('pop', T.safety + a, { vel: 28 }));\n  S.fx('chime', T.safety + 4.0, { vel: 24 }); S.fx('thud', T.safety + 10.0, { vel: 26 });\n  S.fx('tick', T.safety + 12.2, { vel: 26 }); S.fx('tick', T.safety + 13.4, { vel: 26 }); S.fx('thud', T.safety + 14.0, { vel: 32 });\n  for (let i = 0; i < 4; i++) S.fx('tick', T.safety + 16.6 + i * 0.9, { vel: 26 });\n  S.fx('tick', T.mistake + 2.0, { vel: 28 }); S.fx('thud', T.mistake + 6.4, { vel: 32 });\n  for (let i = 0; i < 4; i++) S.fx('pop', T.mistake + 8.6 + i * 1.3, { vel: 28 });\n  S.fx('pop', T.try + 0.6, { vel: 28 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 4.0 + i, { vel: 30 });\n  S.fx('chime', T.try + 10.0, { vel: 40 });\n  [0.6, 8.0, 11.4, 15.1].forEach((a) => S.fx('pop', T.risks + a, { vel: 24 }));\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 22, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T24 · Meet XORA',\n  TOTAL: 319,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // Side speech bubbles sit this far higher than in T01, so they clear the two-line caption band (y ≈ 784–930).\n  LIFT: 96,\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n  // ── Chart helpers (from T14) ──\n  // Piecewise eased value through keys [[t, v], ...].\n  path(keys, t) {\n    const K = UI.K; let v = keys[0][1];\n    for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = K.lerp(a[1], b[1], K.eio(K.clamp01((t - a[0]) / (b[0] - a[0])))); }\n    return v;\n  },\n  // Price grid for a chart: horizontal lines with price labels to the right of x1.\n  grid(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (+y + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Same grid with the price labels on the left, ending at x0 - 14.\n  gridL(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x0 - 14) + '\" y=\"' + (+y + 8) + '\" text-anchor=\"end\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n <script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *
 * build-lesson.mjs inlines this file into public/futures-edge/lessons/<id>.html, after a
 * `window.FILM = {...}` block that carries the scene list, module texts and asset paths.
 */
(function () {
  "use strict";

  const F = window.FILM;
  const W = F.width;
  const H = F.height;

  // ── Maths and easing ───────────────────────────────────────────────────────
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clamp01 = (x) => clamp(x, 0, 1);
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a)));

    x = clamp01(x);

  };

    x = clamp01(x);
    return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  };
  const rng = (seed) => {
    let a = seed >>> 0 || 1;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  // ── DOM helpers ────────────────────────────────────────────────────────────
  const h = (html) => {
    const tpl = document.createElement("template");
    tpl.innerHTML = String(html).trim();
    return tpl.content.firstElementChild;
  };
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    const e = document.createElement(tag);
    if (o.class) e.className = o.class;
    if (o.style) e.setAttribute("style", o.style);
    if (o.text != null) e.textContent = o.text;
    if (o.html != null) e.innerHTML = o.html;
    for (const [k, v] of Object.entries(o.attrs || {})) e.setAttribute(k, v);
    for (const c of children) e.append(c);

  };

  // Words of an element as inline-block spans (inline markup such as <b> is kept).
  const wordCache = new WeakMap();
  function words(root) {
    let list = wordCache.get(root);
    if (list) return list;
    list = [];
    const walk = (node) => {
      for (const child of Array.from(node.childNodes)) {
        if (child.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const part of child.textContent.split(/(\s+)/)) {

            if (/^\s+$/.test(part)) {
              frag.append(document.createTextNode(part));
            } else {
              const s = document.createElement("span");
              s.textContent = part;
              s.style.display = "inline-block";
              frag.append(s);
              list.push(s);
            }
          }
          node.replaceChild(frag, child);
        } else if (child.nodeType === 1) {
          walk(child);
        }

    wordCache.set(root, list);
    return list;
  }
