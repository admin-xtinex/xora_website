<script>window.FILM = {"id":"T20","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson twenty","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"A tempting moment","dur":18,"k":1,"oldStart":8,"oldDur":18},{"id":"steps","name":"The method","dur":22,"k":1,"oldStart":26,"oldDur":22},{"id":"trend","name":"Step 1: trend","dur":20,"k":1,"oldStart":48,"oldDur":20},{"id":"range","name":"Step 2: range","dur":23.2,"k":1.16,"oldStart":68,"oldDur":20},{"id":"zone","name":"Step 3: zones","dur":28.98,"k":1.38,"oldStart":88,"oldDur":21},{"id":"volume","name":"Step 4: volume","dur":22,"k":1,"oldStart":109,"oldDur":22},{"id":"risk","name":"Step 5: risk budget","dur":39.76,"k":1.42,"oldStart":131,"oldDur":28},{"id":"decide","name":"Step 6: decision","dur":24,"k":1,"oldStart":159,"oldDur":24},{"id":"mistake","name":"Direction first","dur":21,"k":1,"oldStart":183,"oldDur":21},{"id":"try","name":"Try it","dur":28,"k":1,"oldStart":204,"oldDur":28},{"id":"risks","name":"Know the limits","dur":29.04,"k":1.21,"oldStart":232,"oldDur":24},{"id":"recap","name":"Recap","dur":74.48,"k":2.66,"oldStart":256,"oldDur":28},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":284,"oldDur":10}],"voice":{"src":"T20/voice.mp3","lines":[{"t":0.6,"d":6.323,"text":"Lesson twenty: evaluating an entry opportunity. A careful checklist that can end in no trade.","ml":"ഇരുപതാം പാഠം: ഒരു entry അവസരം വിലയിരുത്താം. ട്രേഡ് ഇല്ല എന്നതിലും അവസാനിക്കാവുന്ന ചെക്ക്‌ലിസ്റ്റ്."},{"t":8.4,"d":5.693,"text":"Here's a fictional BTC chart. The last few candles are green, and price is near 60,000.","ml":"ഇതാ ഒരു സാങ്കൽപ്പിക BTC ചാർട്ട്. അവസാനത്തെ കുറച്ച് candles പച്ചയാണ്, വില 60,000-ന് അടുത്താണ്."},{"t":15,"d":3.179,"text":"It's tempting to press BUY right now. But what do we actually know?","ml":"ഇപ്പോൾ തന്നെ BUY അമർത്താൻ തോന്നും. പക്ഷേ നമുക്ക് ശരിക്കും എന്തറിയാം?"},{"t":20.4,"d":2.714,"text":"Instead of guessing, let's check the chart step by step.","ml":"ഊഹിക്കുന്നതിന് പകരം, ചാർട്ട് പടിപടിയായി പരിശോധിക്കാം."},{"t":26.4,"d":3.143,"text":"An entry opportunity is a moment when you consider opening a trade. Considering is not entering.","ml":"ഒരു ട്രേഡ് തുറക്കുന്നത് ആലോചിക്കുന്ന നിമിഷമാണ് entry അവസരം. ആലോചിക്കുന്നത് entry ചെയ്യലല്ല."},{"t":34.4,"d":5.581,"text":"Like a pilot before take-off: the same checks, in the same order, every time.","ml":"പറക്കുന്നതിന് മുമ്പുള്ള പൈലറ്റിനെപ്പോലെ: ഓരോ തവണയും ഒരേ പരിശോധനകൾ, ഒരേ ക്രമത്തിൽ."},{"t":41,"d":4.741,"text":"Trend, range, zones, volume, risk. Only then a tentative decision: buy, sell or wait.","ml":"ട്രെൻഡ്, range, zones, volume, റിസ്ക്. പിന്നെ മാത്രം താൽക്കാലിക തീരുമാനം: buy, sell, അല്ലെങ്കിൽ wait."},{"t":48.4,"d":6.635,"text":"Step one: the trend. A trend is the general direction price has been moving.","ml":"ഒന്നാം പടി: ട്രെൻഡ്. വില പൊതുവെ നീങ്ങിക്കൊണ്ടിരുന്ന ദിശയാണ് ട്രെൻഡ്."},{"t":55.585,"d":4.698,"text":"Over this hour, the lows kept getting higher. That leans up.","ml":"ഈ ഒരു മണിക്കൂറിൽ low-കൾ ഉയർന്നുകൊണ്ടിരുന്നു. അത് മുകളിലേക്കുള്ള ചായ്‌വാണ്."},{"t":60.833,"d":3.554,"text":"But the last high was lower than the one before. So: up, but choppy. Not a clear signal.","ml":"പക്ഷേ അവസാന high മുമ്പത്തേതിലും താഴെ. മുകളിലേക്ക്, പക്ഷേ ഇളക്കം. വ്യക്തമായ സിഗ്നലല്ല."},{"t":68.464,"d":5.258,"text":"Step two: the recent range. The space between the recent high and the recent low.","ml":"രണ്ടാം പടി: അടുത്തകാലത്തെ range. അടുത്തകാലത്തെ high-നും low-നും ഇടയിലുള്ള ദൂരം."},{"t":76.12,"d":4.507,"text":"Over the last eight candles: high 60,100, low 59,500. That's 600 USDT.","ml":"അവസാന എട്ട് candles-ൽ: high 60,100, low 59,500. അത് 600 USDT."},{"t":82.848,"d":7.898,"text":"600 out of 60,000 is about 1%. And price now sits near the top of this box.","ml":"60,000-ൽ 600 എന്നാൽ ഏകദേശം 1%. ഇപ്പോൾ വില ഈ box-ന്റെ മുകൾഭാഗത്തിന് അടുത്താണ്."},{"t":91.752,"d":5.781,"text":"Step three: zones. Support is like a floor where falls often paused. Resistance is like a ceiling.","ml":"മൂന്നാം പടി: zones. വീഴ്ചകൾ പലപ്പോഴും നിന്ന തറ പോലെയാണ് support. Resistance ഒരു മേൽക്കൂര പോലെ."},{"t":102.516,"d":6.567,"text":"Here, resistance sits at 60,050 to 60,150. Support sits at 59,500 to 59,600.","ml":"ഇവിടെ resistance 60,050 മുതൽ 60,150 വരെ. Support 59,500 മുതൽ 59,600 വരെ."},{"t":110.796,"d":8.961,"text":"Price is at 60,000, just under resistance. Only about 50 USDT of room before the ceiling.","ml":"വില 60,000-ൽ, resistance-ന് തൊട്ടുതാഴെ. മേൽക്കൂരയ്ക്ക് മുമ്പ് ഏകദേശം 50 USDT ഇടം മാത്രം."},{"t":120.58,"d":5.979,"text":"Step four: volume is how much was traded in each candle. Liquidity is how easily you can trade.","ml":"നാലാം പടി: ഓരോ candle-ലും നടന്ന ട്രേഡിന്റെ അളവാണ് volume. ട്രേഡ് ചെയ്യാനുള്ള എളുപ്പമാണ് liquidity."},{"t":128.38,"d":5.728,"text":"The big drop and first push up had high volume. This last push up has less and less.","ml":"വലിയ വീഴ്ചയിലും ആദ്യ കയറ്റത്തിലും volume കൂടുതൽ. ഈ അവസാന കയറ്റത്തിൽ അത് കുറയുന്നു."},{"t":134.98,"d":4.923,"text":"Fading volume is a weak sign, not proof. Volume alone never tells you the direction.","ml":"കുറയുന്ന volume ഒരു ദുർബല സൂചനയാണ്, തെളിവല്ല. Volume മാത്രം നോക്കി ദിശ പറയാനാവില്ല."},{"t":142.748,"d":5.386,"text":"Step five: your risk budget. The most you accept to lose on this one trade, decided before entering.","ml":"അഞ്ചാം പടി: റിസ്ക് ബജറ്റ്. ഈ ട്രേഡിൽ നഷ്ടപ്പെടുത്താൻ തയ്യാറുള്ള പരമാവധി, entry-ക്ക് മുമ്പേ തീരുമാനിച്ചത്."},{"t":154.392,"d":6.122,"text":"Example only: a 1,000 USDT practice account, and a risk budget of 10 USDT.","ml":"ഉദാഹരണം മാത്രം: 1,000 USDT പരിശീലന അക്കൗണ്ട്, റിസ്ക് ബജറ്റ് 10 USDT."},{"t":162.628,"d":6.226,"text":"A stop below support at 59,400 is 600 USDT away: 1%. Sized for that, a loss is about 10 USDT.","ml":"Support-ന് താഴെ stop 59,400: 600 USDT, 1% അകലെ. അതിനൊത്ത വലിപ്പത്തിൽ നഷ്ടം ഏകദേശം 10 USDT."},{"t":172.568,"d":8.945,"text":"If price reaches 60,100, the gain is only about 1.7 USDT, and fees take about 1 of it.","ml":"വില 60,100-ൽ എത്തിയാൽ, ലാഭം ഏകദേശം 1.7 USDT മാത്രം, അതിൽ ഏകദേശം 1 ഫീസ് കൊണ്ടുപോകും."},{"t":182.34,"d":7.089,"text":"Step six: a tentative decision. Buy, sell or wait, and you write down why.","ml":"ആറാം പടി: ഒരു താൽക്കാലിക തീരുമാനം. Buy, sell, അല്ലെങ്കിൽ wait, എന്തുകൊണ്ട് എന്ന് എഴുതിവെക്കുക."},{"t":189.979,"d":5.491,"text":"Mild uptrend, but price is under resistance, volume is fading, and the reward is tiny next to the risk.","ml":"ചെറിയ uptrend, പക്ഷേ വില resistance-ന് താഴെ, volume കുറയുന്നു, റിസ്കിനെക്കാൾ ലാഭം തീരെ ചെറുത്."},{"t":196.94,"d":5.822,"text":"So the decision is WAIT. No trade is a real, sensible result of the checklist.","ml":"അതുകൊണ്ട് തീരുമാനം WAIT. ട്രേഡ് ഇല്ല എന്നതും ചെക്ക്‌ലിസ്റ്റിന്റെ ശരിയായ, ബുദ്ധിയുള്ള ഫലമാണ്."},{"t":206.34,"d":4.791,"text":"A common mistake: deciding the direction first, then looking for reasons to agree.","ml":"ഒരു സാധാരണ തെറ്റ്: ആദ്യം ദിശ തീരുമാനിക്കുക, പിന്നെ അതിനെ ശരിവെക്കുന്ന കാരണങ്ങൾ തിരയുക."},{"t":212.94,"d":4.712,"text":"Green candles alone are not a reason. Work through the checklist in order, and write your why.","ml":"പച്ച candles മാത്രം ഒരു കാരണമല്ല. ചെക്ക്‌ലിസ്റ്റ് ക്രമത്തിൽ ചെയ്യുക, എന്തുകൊണ്ട് എന്ന് എഴുതുക."},{"t":220.14,"d":5.582,"text":"And WAIT is not a failure. It's often the best answer when the signals don't line up.","ml":"WAIT ഒരു പരാജയമല്ല. സിഗ്നലുകൾ ഒത്തുവരാത്തപ്പോൾ അത് പലപ്പോഴും ഏറ്റവും നല്ല ഉത്തരമാണ്."},{"t":227.34,"d":4.577,"text":"Your turn. A different fictional coin, checklist filled in. What's the sensible tentative decision?","ml":"നിങ്ങളുടെ ഊഴം. മറ്റൊരു സാങ്കൽപ്പിക coin, ചെക്ക്‌ലിസ്റ്റ് റെഡി. ബുദ്ധിയുള്ള താൽക്കാലിക തീരുമാനം ഏത്?"},{"t":235.34,"d":5.749,"text":"Pause if you need more time. Is it A, B or C?","ml":"കൂടുതൽ സമയം വേണമെങ്കിൽ pause ചെയ്യൂ. A, B, അതോ C?"},{"t":241.639,"d":3.11,"text":"C, wait. Every signal is neutral, so there's no reason to take the risk.","ml":"C, wait. എല്ലാ സിഗ്നലുകളും നിഷ്പക്ഷമാണ്, അതുകൊണ്ട് റിസ്ക് എടുക്കാൻ കാരണമില്ല."},{"t":247.14,"d":4.132,"text":"A is tempting, but one green candle is not a reason. Neutral signals mean no trade.","ml":"A ആകർഷകമാണ്, പക്ഷേ ഒരു പച്ച candle ഒരു കാരണമല്ല. നിഷ്പക്ഷ സിഗ്നലുകൾ എന്നാൽ ട്രേഡ് ഇല്ല."},{"t":255.303,"d":5.41,"text":"Before using any checklist, know its limits.","ml":"ഏത് ചെക്ക്‌ലിസ്റ്റ് ഉപയോഗിക്കുന്നതിന് മുമ്പും അതിന്റെ പരിധികൾ അറിയുക."},{"t":261.263,"d":2.766,"text":"A checklist cannot predict the future. Price can still move against you.","ml":"ചെക്ക്‌ലിസ്റ്റിന് ഭാവി പ്രവചിക്കാനാവില്ല. വില അപ്പോഴും നിങ്ങൾക്ക് എതിരായി നീങ്ങാം."},{"t":266.677,"d":3.938,"text":"Stops can slip, and fees eat small gains. Leverage makes losses bigger.","ml":"Stops slip ആകാം, ഫീസ് ചെറിയ ലാഭങ്ങൾ തിന്നുതീർക്കും. Leverage നഷ്ടങ്ങൾ വലുതാക്കും."},{"t":273.574,"d":4.746,"text":"These are fictional examples, not advice. When signals are unclear, WAIT is always allowed.","ml":"സാങ്കൽപ്പിക ഉദാഹരണങ്ങൾ മാത്രം, ഉപദേശമല്ല. സിഗ്നലുകൾ വ്യക്തമല്ലെങ്കിൽ WAIT എപ്പോഴും ആകാം."},{"t":285.044,"d":5.203,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":290.797,"d":0.732,"text":"One: check in order. Trend, range, zones, volume, then your risk budget.","ml":"ഒന്ന്: ക്രമത്തിൽ പരിശോധിക്കുക. ട്രെൻഡ്, range, zones, volume, പിന്നെ നിങ്ങളുടെ റിസ്ക് ബജറ്റ്."},{"t":304.196,"d":5.569,"text":"Two: a decision needs reasons. Write down why, not only the direction.","ml":"രണ്ട്: തീരുമാനത്തിന് കാരണങ്ങൾ വേണം. ദിശ മാത്രമല്ല, എന്തുകൊണ്ട് എന്നും എഴുതുക."},{"t":319.092,"d":4.418,"text":"Three: when signals are neutral or mixed, WAIT is a real decision.","ml":"മൂന്ന്: സിഗ്നലുകൾ നിഷ്പക്ഷമോ കലർന്നതോ ആണെങ്കിൽ, WAIT ഒരു യഥാർത്ഥ തീരുമാനമാണ്."},{"t":333.456,"d":4.23,"text":"Check yourself: price is just under resistance and volume is fading. A strong buy?","ml":"സ്വയം പരിശോധിക്കൂ: വില resistance-ന് തൊട്ടുതാഴെ, volume കുറയുന്നു. ഇത് ശക്തമായ buy ആണോ?"},{"t":351.012,"d":4.957,"text":"No. Those are reasons to wait.","ml":"അല്ല. അവ wait ചെയ്യാനുള്ള കാരണങ്ങളാണ്."},{"t":359.06,"d":2.063,"text":"Next up: T21, confirmation, false signals and NO_TRADE. Why waiting is a decision too.","ml":"അടുത്തത്: T21, confirmation, false signals, NO_TRADE. കാത്തിരിക്കുന്നതും ഒരു തീരുമാനമാണ്."}]},"ass ient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T20 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson twenty: evaluating an entry opportunity. A careful checklist that can end in no trade.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"Here's a fictional BTC chart. The last few candles are green, and price is near 60,000.\"\n    },\n    {\n      \"t\": 15.0,\n      \"text\": \"It's tempting to press BUY right now. But what do we actually know?\"\n    },\n    {\n      \"t\": 20.4,\n      \"text\": \"Instead of guessing, let's check the chart step by step.\"\n    },\n    {\n      \"t\": 26.4,\n      \"text\": \"An entry opportunity is a moment when you consider opening a trade. Considering is not entering.\"\n    },\n    {\n      \"t\": 34.4,\n      \"text\": \"Like a pilot before take-off: the same checks, in the same order, every time.\"\n    },\n    {\n      \"t\": 41.0,\n      \"text\": \"Trend, range, zones, volume, risk. Only then a tentative decision: buy, sell or wait.\"\n    },\n    {\n      \"t\": 48.4,\n      \"text\": \"Step one: the trend. A trend is the general direction price has been moving.\"\n    },\n    {\n      \"t\": 54.4,\n      \"text\": \"Over this hour, the lows kept getting higher. That leans up.\"\n    },\n    {\n      \"t\": 59.4,\n      \"text\": \"But the last high was lower than the one before. So: up, but choppy. Not a clear signal.\"\n    },\n    {\n      \"t\": 68.4,\n      \"text\": \"Step two: the recent range. The space between the recent high and the recent low.\"\n    },\n    {\n      \"t\": 75.0,\n      \"text\": \"Over the last eight candles: high 60,100, low 59,500. That's 600 USDT.\"\n    },\n    {\n      \"t\": 80.8,\n      \"text\": \"600 out of 60,000 is about 1%. And price now sits near the top of this box.\"\n    },\n    {\n      \"t\": 88.4,\n      \"text\": \"Step three: zones. Support is like a floor where falls often paused. Resistance is like a ceiling.\"\n    },\n    {\n      \"t\": 96.2,\n      \"text\": \"Here, resistance sits at 60,050 to 60,150. Support sits at 59,500 to 59,600.\"\n    },\n    {\n      \"t\": 102.2,\n      \"text\": \"Price is at 60,000, just under resistance. Only about 50 USDT of room before the ceiling.\"\n    },\n    {\n      \"t\": 109.4,\n      \"text\": \"Step four: volume is how much was traded in each candle. Liquidity is how easily you can trade.\"\n    },\n    {\n      \"t\": 117.2,\n      \"text\": \"The big drop and first push up had high volume. This last push up has less and less.\"\n    },\n    {\n      \"t\": 123.8,\n      \"text\": \"Fading volume is a weak sign, not proof. Volume alone never tells you the direction.\"\n    },\n    {\n      \"t\": 131.4,\n      \"text\": \"Step five: your risk budget. The most you accept to lose on this one trade, decided before entering.\"\n    },\n    {\n      \"t\": 139.6,\n      \"text\": \"Example only: a 1,000 USDT practice account, and a risk budget of 10 USDT.\"\n    },\n    {\n      \"t\": 145.4,\n      \"text\": \"A stop below support at 59,400 is 600 USDT away: 1%. Sized for that, a loss is about 10 USDT.\"\n    },\n    {\n      \"t\": 152.4,\n      \"text\": \"If price reaches 60,100, the gain is only about 1.7 USDT, and fees take about 1 of it.\"\n    },\n    {\n      \"t\": 159.4,\n      \"text\": \"Step six: a tentative decision. Buy, sell or wait, and you write down why.\"\n    },\n    {\n      \"t\": 166.0,\n      \"text\": \"Mild uptrend, but price is under resistance, volume is fading, and the reward is tiny next to the risk.\"\n    },\n    {\n      \"t\": 174.0,\n      \"text\": \"So the decision is WAIT. No trade is a real, sensible result of the checklist.\"\n    },\n    {\n      \"t\": 183.4,\n      \"text\": \"A common mistake: deciding the direction first, then looking for reasons to agree.\"\n    },\n    {\n      \"t\": 190.0,\n      \"text\": \"Green candles alone are not a reason. Work through the checklist in order, and write your why.\"\n    },\n    {\n      \"t\": 197.2,\n      \"text\": \"And WAIT is not a failure. It's often the best answer when the signals don't line up.\"\n    },\n    {\n      \"t\": 204.4,\n      \"text\": \"Your turn. A different fictional coin, checklist filled in. What's the sensible tentative decision?\"\n    },\n    {\n      \"t\": 212.4,\n      \"text\": \"Pause if you need more time. Is it A, B or C?\"\n    },\n    {\n      \"t\": 218.4,\n      \"text\": \"C, wait. Every signal is neutral, so there's no reason to take the risk.\"\n    },\n    {\n      \"t\": 224.2,\n      \"text\": \"A is tempting, but one green candle is not a reason. Neutral signals mean no trade.\"\n    },\n    {\n      \"t\": 232.3,\n      \"text\": \"Before using any checklist, know its limits.\"\n    },\n    {\n      \"t\": 236.0,\n      \"text\": \"A checklist cannot predict the future. Price can still move against you.\"\n    },\n    {\n      \"t\": 241.7,\n      \"text\": \"Stops can slip, and fees eat small gains. Leverage makes losses bigger.\"\n    },\n    {\n      \"t\": 247.4,\n      \"text\": \"These are fictional examples, not advice. When signals are unclear, WAIT is always allowed.\"\n    },\n    {\n      \"t\": 256.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 258.0,\n      \"text\": \"One: check in order. Trend, range, zones, volume, then your risk budget.\"\n    },\n    {\n      \"t\": 263.6,\n      \"text\": \"Two: a decision needs reasons. Write down why, not only the direction.\"\n    },\n    {\n      \"t\": 269.2,\n      \"text\": \"Three: when signals are neutral or mixed, WAIT is a real decision.\"\n    },\n    {\n      \"t\": 274.6,\n      \"text\": \"Check yourself: price is just under resistance and volume is fading. A strong buy?\"\n    },\n    {\n      \"t\": 281.2,\n      \"text\": \"No. Those are reasons to wait.\"\n    },\n    {\n      \"t\": 284.6,\n      \"text\": \"Next up: T21, confirmation, false signals and NO_TRADE. Why waiting is a decision too.\"\n    }\n  ]\n}","scene-decide.js":"// Layer 6: a tentative decision with a written reason. Here: WAIT.\nconst DC_W = 15.0;\nkit.scene('decide', UI.layerScene(kit, {\n  layer: 5, a: DC_W, val: 0.6,\n  kick: 'Step 6 · Tentative decision', title: 'Buy, sell or wait, and why?',\n  card: '<div style=\"display:flex;gap:16px\">' + ['BUY', 'SELL', 'WAIT'].map((b) => '<span class=\"dc-b mono\" style=\"flex:1;text-align:center;padding:6px 0;border-radius:14px;font-size:28px;font-weight:700;border:2px solid color-mix(in srgb, var(--second) 25%, transparent)\">' + b + '</span>').join('') + '</div>' +\n    '<p style=\"margin:12px 0 0;font-size:28px;font-weight:600;white-space:nowrap\"><span style=\"color:color-mix(in srgb, var(--second) 60%, var(--ground))\">Why: </span><span class=\"dc-why\"></span><span class=\"dc-cur\" style=\"color:var(--main)\">|</span></p>',\n  cardInit(kit, el) { this.bs = [...el.querySelectorAll('.dc-b')].map((e) => e.style); this.why = el.querySelector('.dc-why'); this.cur = el.querySelector('.dc-cur').style; },\n  cardRender(t) {\n    const W = 'Resistance, weak volume, reward < risk';\n    UI.set(this.why, W.slice(0, Math.floor(W.length * kit.seg(t, 7.2, 13.0))));\n    this.cur.opacity = t > 7.0 && Math.floor(t * 2.2) % 2 === 0 ? 1 : 0;\n    const p = kit.eo(kit.seg(t, DC_W, DC_W + 0.4));\n    this.bs.forEach((s, i) => {\n      if (i === 2) { s.background = 'color-mix(in srgb, var(--main) ' + (p * 100).toFixed(0) + '%, transparent)'; s.color = p > 0.5 ? 'var(--ground)' : 'var(--second)'; s.borderColor = p > 0 ? 'var(--main)' : ''; s.transform = 'scale(' + (1 + 0.1 * Math.sin(Math.PI * kit.seg(t, DC_W, DC_W + 0.5))).toFixed(3) + ')'; }\n      else s.opacity = kit.lerp(1, 0.4, p);\n    });\n  },\n  poses: [{ t: 0, pose: 'magnify' }, { t: 0.6, pose: 'explain' }, { t: 7.0, pose: 'writing' }, { t: DC_W, pose: 'thumbs' }],\n}));\n","scene-hook.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// The fictional chart draws in; a tempting BUY NOW button pulses, then gives way to \"check first\".\nkit.scene('hook', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\"><div class=\"words\" style=\"left:140px;top:150px;width:1500px\"><p class=\"kick hk-k\">A tempting moment</p>' +\n      '<h2 class=\"line hk-t\" style=\"font-size:64px\">Green candles. Buy now?</h2></div></div>'));\n    this.bd = UI.board(kit, -1, { draw: 0.4, list: false });\n    kit.stage.append(kit.h('<div class=\"hk-side\" style=\"position:absolute;left:1110px;top:330px;width:670px;display:flex;flex-direction:column;align-items:center;gap:30px\">' +\n      '<div class=\"hk-buy\" style=\"position:relative;padding:28px 70px;border-radius:24px;background:var(--up);color:var(--ground);font-size:52px;font-weight:800;letter-spacing:.04em\">BUY NOW?' +\n      '<div class=\"hk-x\" style=\"position:absolute;left:-10px;right:-10px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--accent)\"></div></div>' +\n      '<p class=\"fict\" style=\"margin:0\">Educational mock · not a real exchange button</p>' +\n      '<div class=\"glass hk-q\" style=\"position:relative;width:670px;padding:22px 30px\"><p class=\"kick\" style=\"margin:0 0 8px\">What do we actually know?</p>' +\n      '<p style=\"margin:0;font-size:30px;line-height:1.4;font-weight:600\">Not yet enough. Check the chart step by step first.</p></div></div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.hk-k').style; this.t = q('.hk-t'); this.buy = q('.hk-buy').style; this.x = q('.hk-x').style; this.qc = q('.hk-q').style; this.f = q('.hk-side .fict').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'present' }, { t: 0.6, pose: 'magnify' }, { t: 7.0, pose: 'confused' }, { t: 12.4, pose: 'idea' }],\n      says: [{ t0: 7.6, t1: 11.6, text: 'Hmm, wait.' }],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.bd.render(t, 0);\n    const b = seg(t, 7.0, 7.5), off = eio(seg(t, 12.4, 13.0));\n    this.buy.opacity = (eo(b) * lerp(1, 0.45, off)).toFixed(3);\n    this.buy.transform = 'scale(' + (lerp(0.7, 1, eob(b, 1.8)) * (1 + 0.035 * Math.sin(Math.max(0, t - 7.5) * 5) * (1 - off))).toFixed(4) + ')';\n    this.f.opacity = 0.9 * eo(seg(t, 7.6, 8.1));\n    this.x.transformOrigin = '0 50%'; this.x.transform = 'scaleX(' + eo(seg(t, 12.4, 12.9)).toFixed(3) + ')'; this.x.opacity = t >= 12.4 ? 1 : 0;\n    UI.rise(kit, this.qc, t, 12.8, 0.7);\n    this.tutor.render(t);\n  },\n});\n","scene-mistake.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Wrong way: direction first, reasons after. Right way: checklist in order, then a decision with a reason.\nkit.scene('mistake', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const step = (n, s) => '<div class=\"mk-s\" style=\"display:flex;align-items:center;gap:16px;height:46px\"><span class=\"mono\" style=\"flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--main);color:var(--ground)\">' + n + '</span><span style=\"font-size:30px;font-weight:600\">' + s + '</span></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:150px;width:1500px\"><p class=\"kick mk-k\" style=\"color:var(--accent)\">Common mistake</p>' +\n      '<h2 class=\"line mk-t\" style=\"font-size:64px\">Direction first, reasons later</h2></div>' +\n      '<div class=\"glass mk-a\" style=\"left:140px;top:310px;width:760px;height:340px;padding:28px 36px\"><p class=\"kick\" style=\"margin:0 0 18px;color:var(--accent)\">The mistake</p>' +\n      '<div style=\"display:flex;align-items:center;gap:20px\"><span class=\"chip mono\" style=\"background:var(--up);color:var(--ground);border-color:var(--up);font-size:32px\">BUY!</span><span style=\"font-size:36px\">→</span><span style=\"font-size:30px;font-weight:600\">look for reasons that agree</span></div>' +\n      '<p style=\"margin:26px 0 0;font-size:30px;line-height:1.4;color:color-mix(in srgb, var(--second) 75%, var(--ground))\">“The candles are green, so it must go up.”</p>' +\n      '<svg class=\"mk-x\" width=\"700\" height=\"120\" viewBox=\"0 0 700 120\" style=\"position:absolute;left:30px;top:150px\"><path class=\"mk-xp\" d=\"M30 20 L670 100 M670 20 L30 100\" pathLength=\"1\" fill=\"none\" stroke-width=\"8\" stroke-linecap=\"round\" style=\"stroke:var(--accent)\"/></svg></div>' +\n      '<div class=\"glass mk-b\" style=\"left:960px;top:310px;width:820px;height:340px;padding:28px 36px;border-color:var(--main)\"><p class=\"kick\" style=\"margin:0 0 12px\">The correction</p>' +\n      step(1, 'Trend → range → zones') + step(2, 'Volume → risk budget') + step(3, 'Then decide, and write why') +\n      '<div class=\"mk-w\" style=\"display:flex;align-items:center;gap:18px;margin-top:18px\"><span class=\"chip mono\" style=\"background:var(--main);color:var(--ground);border-color:var(--main);font-size:30px;padding:10px 26px\">WAIT</span><span style=\"font-size:30px;font-weight:600\">is a result, not a failure</span></div></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.mk-k').style; this.t = q('.mk-t'); this.a = q('.mk-a').style; this.b = q('.mk-b').style; this.xp = q('.mk-xp');\n    this.ss = [...kit.stage.querySelectorAll('.mk-s')].map((e) => e.style); this.w = q('.mk-w').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'confused' }, { t: 7.0, pose: 'checklist' }, { t: 14.2, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(kit, this.a, t, 0.6, 0.7);\n    this.xp.setAttribute('stroke-dasharray', eio(seg(t, 7.0, 7.7)).toFixed(3) + ' 1'); this.xp.style.opacity = t >= 7.0 ? 0.85 : 0;\n    this.a.filter = 'saturate(' + lerp(1, 0.4, eo(seg(t, 7.2, 8.0))).toFixed(2) + ')';\n    UI.rise(kit, this.b, t, 7.4, 0.7);\n    this.ss.forEach((s, i) => UI.rise(kit, s, t, 8.4 + i * 1.3, 0.5, 14));\n    const w = seg(t, 14.2, 14.8);\n    this.w.opacity = eo(w); this.w.transform = 'scale(' + lerp(0.8, 1, eob(w, 1.7)).toFixed(3) + ')'; this.w.transformOrigin = '0 50%';\n    this.tutor.render(t);\n  },\n});\n","scene-next.js":"const { seg, eo, eob, eio, lerp, TextFx } = kit;\nkit.scene('next', {\n  init(kit) {\n    const pts = UI.walk(kit, 20, 96, 140, 1780, 930, 840, 18);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><defs><linearGradient id=\"next20-g\" x1=\"0\" x2=\"1\"><stop offset=\"0\" style=\"stop-color:var(--main)\"/><stop offset=\"1\" style=\"stop-color:var(--accent)\"/></linearGradient></defs>' +\n      '<path class=\"next-path\" d=\"' + UI.d(pts) + '\" pathLength=\"1\" fill=\"none\" stroke=\"url(#next20-g)\" stroke-width=\"4\" stroke-linecap=\"round\" style=\"opacity:.5\"/></svg>' +\n      '<div class=\"next-lock\" style=\"position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center\"></div>' +\n      '<div class=\"words\" style=\"left:210px;top:300px;width:1500px;align-items:center;text-align:center;gap:28px\">' +\n      '<p class=\"kick next-k\">Lesson T20 complete · Up next: T21</p>' +\n      '<h2 class=\"line next-t\" style=\"font-size:80px\">Confirmation, False Signals and NO_TRADE</h2><p class=\"sub next-s\" style=\"margin:0\">Why waiting is a decision too</p>' +\n      '<div class=\"rule next-r\" style=\"width:240px\"></div>' +\n      '<div class=\"chip next-c\" style=\"font-size:32px;padding:20px 38px;background:var(--main);color:var(--ground);border-color:var(--main)\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 28 28\"><path d=\"M7 4 L24 14 L7 24 Z\" style=\"fill:var(--ground)\"/></svg><span>Continue to T21</span></div></div>' +\n      '<p class=\"fict next-f\" style=\"position:absolute;left:0;right:0;bottom:70px;margin:0;text-align:center\">Educational content only · Not financial advice · Leverage and futures involve high risk</p>' +\n      '</div>'));\n    kit.stage.querySelector('.next-lock').append(UI.lockup(kit));\n    const q = (s) => kit.stage.querySelector(s);\n    this.path = q('.next-path'); this.lock = q('.next-lock').style; this.k = q('.next-k').style;\n    this.t = q('.next-t'); this.s = q('.next-s'); this.r = q('.next-r').style; this.c = q('.next-c').style; this.f = q('.next-f').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }, { t: 1.1, x: 1620, y: 965, s: 230, d: 1.0 }],\n      poses: [{ t: 0, pose: 'thumbs' }, { t: 0.1, pose: 'walk', flip: true }, { t: 1.1, pose: 'wave' }, { t: 4.0, pose: 'present' }, { t: 6.8, pose: 'wave' }],\n      says: [{ t0: 1.3, t1: 5.6, text: 'See you in T21!', side: 'top' }],\n    });\n  },\n  render(t) {\n    this.path.setAttribute('stroke-dasharray', eio(seg(t, 0, 2.6)) + ' 1');\n    const l = seg(t, 0.1, 0.8);\n    this.lock.opacity = eo(l);\n    this.lock.transform = 'scale(' + lerp(0.85, 1, eob(l, 1.6)) + ')';\n    this.k.opacity = eo(seg(t, 0.5, 1.0));\n    TextFx.fadeFromRight(this.t, t, 0.7);\n    this.r.transform = 'scaleX(' + eo(seg(t, 1.5, 2.2)) + ')';\n    this.s.style.opacity = eo(seg(t, 1.3, 1.9));\n    const c = seg(t, 2.1, 2.7);\n    this.c.opacity = eo(seg(t, 2.1, 2.4));\n    this.c.transform = 'scale(' + (lerp(0.8, 1, eob(c, 1.7)) * kit.breathe(Math.max(0, t - 2.7), 0.015, 2.4)) + ')';\n    this.f.opacity = 0.9 * eo(seg(t, 2.8, 3.4));\n    this.tutor.render(t);\n  },\n});\n","scene-range.js":"// Layer 2: the recent range, with its worked numbers.\nkit.scene('range', UI.layerScene(kit, {\n  layer: 1, a: 7.0, val: 5.8,\n  kick: 'Step 2 · Recent range', title: 'How far has price been moving?',\n  card: '<p class=\"kick\" style=\"margin:0 0 6px\">Range = recent high − recent low</p>' +\n    '<p class=\"mono rg-1\" style=\"margin:0;font-size:30px\">60,100 − 59,500 = <span style=\"color:var(--main)\">600 USDT</span></p>' +\n    '<p class=\"mono rg-2\" style=\"margin:4px 0 0;font-size:28px;color:color-mix(in srgb, var(--second) 75%, var(--ground))\">600 ÷ 60,000 = 0.01 ≈ <span style=\"color:var(--main)\">1%</span></p>',\n  cardInit(kit, el) { this.r1 = el.querySelector('.rg-1').style; this.r2 = el.querySelector('.rg-2').style; },\n  cardRender(t) { UI.rise(kit, this.r1, t, 7.4, 0.5,  a + 0.4)).toFixed(3) + ' 1'); this.rows[i].opacity = lerp(0.45, 1, eo(seg(t, a, a + 0.3))); });\n    const w = seg(t, 4.9, 5.4);\n    this.w.opacity = eo(w); this.w.transform = 'scale(' + lerp(0.6, 1, eob(w, 1.8)).toFixed(3) + ')';\n    this.tutor.render(t);\n  },\n});\n","scene-trend.js":"// Layer 1: the trend.\nkit.scene('trend', UI.layerScene(kit, {\n  layer: 0, a: 6.4, val: 5.0,\n  kick: 'Step 1 · Trend', title: 'Which way has price been going?',\n  card: '<p class=\"kick\" style=\"margin:0 0 8px\">Meaning</p><p class=\"def\" style=\"margin:0;font-size:30px;line-height:1.35\"><b>Trend</b>: the general direction of recent price moves.</p>',\n  poses: [{ t: 0, pose: 'present' }, { t: 0.6, pose: 'explain' }, { t: 6.4, pose: 'point', flip: true }, { t: 11.4, pose: 'think' }],\n}));\n","scene-try.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// A second fictional coin with a filled checklist: every signal neutral. Choices BUY / SELL / WAIT; answer C.\nconst TY_ROWS = [['Trend', 'Sideways'], ['Range', 'Price in the middle'], ['Zones', 'None nearby'], ['Volume', 'Normal, steady'], ['Risk', 'Stop and target unclear']];\nconst TY_OPTS = [['BUY', 'The last candle is green'], ['SELL', 'It might drop soon'], ['WAIT', 'The signals are neutral']];\nconst TY_OK = 2, TY_BAD = 0, TY_R = 14.4, TY_N = 20.2;\nkit.scene('try', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let rows = '', opts = '';\n    TY_ROWS.forEach((r) => { rows += '<div class=\"ty-r\" style=\"display:flex;align-items:center;justify-content:space-between;height:52px;border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent)\"><span style=\"font-size:30px;font-weight:600\">' + r[0] + '</span><span class=\"mono\" style=\"font-size:28px;color:color-mix(in srgb, var(--second) 80%, var(--ground))\">' + r[1] + '</span></div>'; });\n    TY_OPTS.forEach((o, i) => {\n      const mark = i === TY_OK ? '<path class=\"ty-ok\" d=\"M10 23 L19 32 L35 13\" pathLength=\"1\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--main)\"/>'\n        : i === TY_BAD ? '<path class=\"ty-no\" d=\"M13 13 L31 31 M31 13 L13 31\" pathLength=\"1\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"stroke:var(--accent)\"/>' : '';\n      opts += '<div class=\"ty-o\" style=\"display:flex;align-items:center;gap:18px;padding:10px 20px;border-radius:20px;border:2px solid color-mix(in srgb, var(--second) 14%, transparent);background:color-mix(in srgb, var(--ground) 90%, var(--main))\">' +\n        '<span class=\"ty-l mono\" style=\"width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;border:2px solid color-mix(in srgb, var(--main) 45%, transparent)\">' + 'ABC'[i] + '</span>' +\n        '<span style=\"flex:1;font-size:28px;font-weight:600\"><b class=\"mono\" style=\"margin-right:10px\">' + o[0] + '</b>' + o[1] + '</span><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" style=\"flex:none\">' + mark + '</svg></div>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:150px;width:1500px\"><p class=\"kick ty-k\">Your turn · a different fictional coin</p>' +\n      '<h2 class=\"line ty-t\" style=\"font-size:64px\">What is the sensible decision?</h2></div>' +\n      '<div class=\"glass ty-q\" style=\"left:140px;top:300px;width:860px;padding:22px 34px\"><p class=\"fict\" style=\"margin:0 0 8px\">The checklist, filled in · fictional</p>' + rows + '</div>' +\n      '<div style=\"position:absolute;left:1060px;top:300px;width:720px;display:flex;flex-direction:column;gap:12px\">' + opts + '</div>' +\n      '<div class=\"glass ty-why\" style=\"left:1060px;top:556px;width:720px;padding:18px 28px;display:flex;flex-direction:column;gap:10px\">' +\n      '<div><p class=\"kick\" style=\"margin:0 0 4px\">Why C</p><p style=\"margin:0;font-size:28px;line-height:1.3;font-weight:600\">Signals are neutral. No reason to risk.</p></div>' +\n      '<div class=\"ty-w2\"><p class=\"kick\" style=\"margin:0 0 4px;color:var(--accent)\">Why not A</p><p style=\"margin:0;font-size:28px;line-height:1.3;font-weight:600\">One green candle is not a reason.</p></div></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.ty-k').style; this.t = q('.ty-t'); this.qc = q('.ty-q').style; this.why = q('.ty-why').style; this.w2 = q('.ty-w2').style;\n    this.rs = all('.ty-r').map((e) => e.style); this.os = all('.ty-o').map((e) => e.style); this.ls = all('.ty-l').map((e) => e.style); this.ok = q('.ty-ok'); this.no = q('.ty-no');\n    this.ring = UI.ring(kit, 1420, 694, 76, 8.4, 9.0, 5, TY_R, 'Pause to think');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'read' }, { t: 9.0, pose: 'think' }, { t: TY_R, pose: 'cheer' }, { t: TY_R + 2.2, pose: 'explain' }, { t: TY_N, pose: 'calm' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(kit, this.qc, t, 0.6, 0.7);\n    this.rs.forEach((s, i) => { s.opacity = eo(seg(t, 1.2 + i * 0.5, 1.6 + i * 0.5)); });\n    const rv = eo(seg(t, TY_R, TY_R + 0.5)), nb = eo(seg(t, TY_N, TY_N + 0.5));\n    const mix = (c, p, base) => 'color-mix(in srgb, ' + c + ' ' + (base + (100 - base) * p).toFixed(0) + '%, transparent)';\n    this.os.forEach((s, i) => {\n      const a = 4.2 + i * 0.4, p = eo(seg(t, a, a + 0.5)), good = i === TY_OK, tempt = i === TY_BAD;\n      const dim = good ? 1 : tempt ? lerp(lerp(1, 0.5, rv), 1, nb) : lerp(1, 0.4, rv);\n      s.opacity = (eo(seg(t, a, a + 0.3)) * dim).toFixed(3);\n      s.transform = 'translateX(' + lerp(30, 0, p).toFixed(1) + 'px) scale(' + (good ? 1 + 0.02 * rv : 1).toFixed(4) + ')';\n      s.transformOrigin = '0 50%';\n      if (good) { s.borderColor = mix('var(--main)', rv, 14); s.background = 'color-mix(in srgb, var(--ground) ' + lerp(90, 74, rv).toFixed(0) + '%, var(--main))'; this.ls[i].background = rv > 0.5 ? 'var(--main)' : 'transparent'; this.ls[i].color = rv > 0.5 ? 'var(--ground)' : 'var(--second)'; }\n      if (tempt) s.borderColor = nb > 0 ? mix('var(--accent)', nb, 14) : mix('var(--second)', 0, 14);\n    });\n    const po = seg(t, TY_R + 0.2, TY_R + 0.7), pn = seg(t, TY_N + 0.1, TY_N + 0.6);\n    this.ok.setAttribute('stroke-dasharray', eo(po).toFixed(3) + ' 1'); this.ok.style.opacity = po > 0 ? 1 : 0;\n    this.no.setAttribute('stroke-dasharray', eo(pn).toFixed(3) + ' 1'); this.no.style.opacity = pn > 0 ? 1 : 0;\n    UI.rise(kit, this.why, t, TY_R + 0.3, 0.6, 24);\n    this.w2.opacity = nb;\n    this.ring(t);\n    this.tutor.render(t);\n  },\n});\n","scene-volume.js":"// Layer 4: volume bars under the candles; the last push up fades.\nkit.scene('volume', UI.layerScene(kit, {\n  layer: 3, a: 8.2, val: 6.6,\n  kick: 'Step 4 · Volume and liquidity', title: 'How busy is the market?',\n  card: '<p class=\"def\" style=\"margin:0;font-size:28px;line-height:1.35\"><b>Volume</b>: how much was traded in a candle. <b>Liquidity</b>: how easily you can trade.</p>',\n  poses: [{ t: 0, pose: 'magnify' }, { t: 0.6, pose: 'explain' }, { t: 8.2, pose: 'point', flip: true }, { t: 14.8, pose: 'think' }],\n}));\n","scene-zone.js":"// Layer 3: support and resistance zones, and how little room is left above.\nkit.scene('zone', UI.layerScene(kit, {\n  layer: 2, a: 8.2, val: 6.0,\n  kick: 'Step 3 · Zones', title: 'Where is the floor, and the ceiling?',\n  card: '<p class=\"def zn-1\" style=\"margin:0;font-size:28px;line-height:1.35\"><b>Support</b>: a floor where falls often paused. <b style=\"color:var(--accent)\">Resistance</b>: a ceiling.</p>' +\n    '<p class=\"mono zn-2\" style=\"margin:8px 0 0;font-size:28px\">Room up: 60,000 → 60,050 = <span style=\"color:var(--accent)\">50 USDT</span></p>',\n  cardInit(kit, el) { this.z2 = el.querySelector('.zn-2').style; },\n  cardRender(t) { UI.rise(kit, this.z2, t, 14.2, 0.5, 12); },\n  poses: [{ t: 0, pose: 'present' }, { t: 0.6, pose: 'explain' }, { t: 8.2, pose: 'point', flip: true }, { t: 14.2, pose: 'magnify' }],\n}));\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson twenty\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 5, lesson T20, Evaluating an Entry Opportunity; a six-step checklist ticks down to WAIT; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"A tempting moment\",\n      \"dur\": 18,\n      \"desc\": \"A fictional BTC/USDT 5-minute chart draws in; a tempting BUY NOW mock button is crossed out in favour of checking first.\"\n    },\n    {\n      \"id\": \"steps\",\n      \"name\": \"The method\",\n      \"dur\": 22,\n      \"desc\": \"Entry opportunity defined; pilot checklist analogy; six steps in order: trend, range, zones, volume, risk budget, tentative decision.\"\n    },\n    {\n      \"id\": \"trend\",\n      \"name\": \"Step 1: trend\",\n      \"dur\": 20,\n      \"desc\": \"Layer 1 on the same chart: higher lows then a lower high; trend = up, but choppy.\"\n    },\n    {\n      \"id\": \"range\",\n      \"name\": \"Step 2: range\",\n      \"dur\": 20,\n      \"desc\": \"Layer 2: recent range box 59,500 to 60,100 = 600 USDT, about 1% of 60,000; price near the top.\"\n    },\n    {\n      \"id\": \"zone\",\n      \"name\": \"Step 3: zones\",\n      \"dur\": 21,\n      \"desc\": \"Layer 3: resistance zone 60,050-60,150 and support zone 59,500-59,600 grow in; price at 60,000 has about 50 USDT of room up.\"\n    },\n    {\n      \"id\": \"volume\",\n      \"name\": \"Step 4: volume\",\n      \"dur\": 22,\n      \"desc\": \"Layer 4: volume bars rise under the candles; the last push up fades; volume alone is not proof.\"\n    },\n    {\n      \"id\": \"risk\",\n      \"name\": \"Step 5: risk budget\",\n      \"dur\": 28,\n      \"desc\": \"Layer 5: example 1,000 USDT account, 10 USDT risk budget; stop 59,400 is 600 USDT (1%) away so about 1,000 USDT notional; reward to 60,100 about +1.7 USDT, fees about 1 USDT.\"\n    },\n    {\n      \"id\": \"decide\",\n      \"name\": \"Step 6: decision\",\n      \"dur\": 24,\n      \"desc\": \"Layer 6: BUY / SELL / WAIT with a typed reason; WAIT is selected.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"Direction first\",\n      \"dur\": 21,\n      \"desc\": \"Mistake: deciding direction first and finding reasons after; correction: the checklist in order, a written why, WAIT is a result.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 28,\n      \"desc\": \"A second fictional coin with all-neutral checklist; choices BUY, SELL, WAIT; 5-second countdown; answer C, WAIT; why not A.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the limits\",\n      \"dur\": 24,\n      \"desc\": \"A checklist does not predict; slippage and fees; leverage; fictional examples, WAIT is allowed.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 28,\n      \"desc\": \"Three key points and a check question about buying under resistance on fading volume.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T21, Confirmation, False Signals and NO_TRADE.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // No voice: the music is the only sound. Soft pad and keys, a light pulse while the checklist is worked through, quieter in the risk parts.\n  const BPM = 84, B = 60 / BPM;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.trend, T.mistake) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.mistake, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / (4 * B));\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  // Title: the checklist ticks down to WAIT.\n  for (let i = 0; i < 6; i++) S.fx('tick', T.title + 1.0 + i * 0.75, { vel: 26 });\n  S.fx('pop', T.title + 4.9, { vel: 30, pitch: 7 });\n  // Hook: candles draw in, the BUY button, the cross.\n  S.fx('whoosh', T.hook + 0.4, { dur: 2.2, vel: 18 }); S.fx('pop', T.hook + 7.0, { vel: 30, pitch: 9 }); S.fx('thud', T.hook + 12.4, { vel: 32 }); S.fx('pop', T.hook + 12.8, { vel: 26, pitch: 5 });\n  // Steps: definition, analogy, six cards.\n  S.fx('pop', T.steps + 0.6, { vel: 26, pitch: 7 }); S.fx('pop', T.steps + 8.4, { vel: 26, pitch: 7 });\n  for (let i = 0; i < 6; i++) S.fx('tick', T.steps + 15.0 + i * 0.75, { vel: 28 });\n  // Each layer: the layer draws, the checklist row fills.\n  [['trend', 6.4, 11.4], ['range', 7.0, 12.8], ['zone', 8.2, 14.2], ['volume', 8.2, 14.8], ['risk', 14.4, 21.4], ['decide', 7.0, 15.0]].forEach(([id, a, v]) => {\n    S.fx('whoosh', T[id] + a, { dur: 1.0, vel: 20 }); S.fx('ding', T[id] + v, { vel: 30 });\n  });\n  for (let i = 0; i < 18; i++) S.fx('tick', T.volume + 8.2 + i * 0.08, { vel: 14 });\n  S.fx('pop', T.risk + 8.6, { vel: 26, pitch: 7 }); S.fx('thud', T.risk + 15.6, { vel: 28 });\n  [0, 1, 2].forEach((i) => S.fx('pop', T.risk + 22.0 + i * 0.9, { vel: 26, pitch: 5 + i * 2 }));\n  S.fx('chime', T.decide + 15.0, { vel: 38 });\n  // Mistake.\n  S.fx('pop', T.mistake + 0.6, { vel: 26, pitch: 5 }); S.fx('thud', T.mistake + 7.0, { vel: 34 });\n  [8.4, 9.7, 11.0].forEach((a) => S.fx('tick', T.mistake + a, { vel: 28 })); S.fx('chime', T.mistake + 14.2, { vel: 30 });\n  // Try it.\n  S.fx('pop', T.try + 0.6, { vel: 28, pitch: 7 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 9.0 + i, { vel: 30 });\n  S.fx('chime', T.try + 14.4, { vel: 42 }); S.fx('pop', T.try + 20.2, { vel: 30, pitch: 5 });\n  [4.2, 9.8, 12.6, 15.4].forEach((a) => S.fx('pop', T.risks + a, { vel: 26 }));\n  [2.0, 7.6, 13.2].forEach((a) => S.fx('pop', T.recap + a + 0.5, { vel: 34 }));\n  S.fx('ding', T.recap + 25.4, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 22, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T20 · Evaluating an entry opportunity',\n  TOTAL: 294,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, se <script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *

  "use strict";

  // ── DOM helpers ────────────────────────────────────────────────────────────
