 this.ring.html.replace(/^/, '<svg class=\"art\" viewBox=\"0 0 1920 1080\">') + '</svg>' +\n      '<div class=\"glass ty-q\" style=\"left:140px;top:300px;width:820px;padding:22px 30px\"><p class=\"fict\" style=\"margin:0 0 8px\">Question · fictional prices</p>' +\n      '<p class=\"def\" style=\"margin:0;font-size:31px\">Expected move: <b>60 USDT</b> per BTC at <b>60,000</b>. Round-trip fees: <b>0.10%</b>. Worth taking?</p></div>' +\n      opt('ty-o1', 494, 'A', 'Take it: the move is positive') + opt('ty-o2', 572, 'B', 'NO_TRADE: fees eat the move') +\n      '<div class=\"glass ty-a\" style=\"left:140px;top:660px;width:820px;padding:14px 28px;border-color:var(--main);background:color-mix(in srgb, var(--ground) 76%, var(--main))\"><p class=\"mono\" style=\"margin:0;font-size:30px\">60,000 × 0.10% = 60 → 60 − 60 = <span class=\"hl\">0</span></p></div>' +\n      '<p class=\"kick ty-ml\" style=\"position:absolute;left:1080px;top:330px;margin:0;color:var(--up)\">Expected move</p>' +\n      '<div class=\"ty-mb\" style=\"position:absolute;left:1080px;top:370px;width:360px;height:56px;border-radius:10px;transform-origin:0 50%;background:color-mix(in srgb, var(--up) 50%, transparent);border:2px solid var(--up);display:flex;align-items:center;padding-left:18px;box-sizing:border-box\"><span class=\"mono\" style=\"font-size:28px;font-weight:600\">+60</span></div>' +\n      '<p class=\"kick ty-fl\" style=\"position:absolute;left:1080px;top:460px;margin:0;color:var(--down)\">Round-trip fees</p>' +\n      '<div class=\"ty-fb\" style=\"position:absolute;left:1080px;top:500px;width:360px;height:56px;border-radius:10px;transform-origin:0 50%;background:color-mix(in srgb, var(--down) 50%, transparent);border:2px solid var(--down);display:flex;align-items:center;padding-left:18px;box-sizing:border-box\"><span class=\"mono\" style=\"font-size:28px;font-weight:600\">−60</span></div>' +\n      '<p class=\"mono ty-z\" style=\"position:absolute;left:1080px;top:584px;margin:0;font-size:30px\">Left: <span class=\"hl\">0</span>, then slippage</p>' +\n      '<div class=\"glass ty-n\" style=\"left:1080px;top:650px;width:600px;padding:16px 26px\"><p style=\"margin:0;font-size:28px;font-weight:600;line-height:1.35\"><span class=\"hl\">NO_TRADE</span> is a sensible, skilled choice.</p></div>' +\n      '<p class=\"fict\" style=\"position:absolute;left:1080px;top:300px;margin:0\">USDT per BTC · example fees</p>' +\n      '<div class=\"words\" style=\"left:140px;top:160px;width:1000px\"><p class=\"kick ty-k\">Your turn</p>' +\n      '<h2 class=\"line ty-t\">Pause and decide</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.ty-k').style; this.t = q('.ty-t'); this.qc = q('.ty-q').style; this.o1 = q('.ty-o1').style; this.o2 = q('.ty-o2').style; this.a = q('.ty-a').style;\n    ['ml', 'mb', 'fl', 'fb', 'z', 'n'].forEach((n) => { this[n] = q('.ty-' + n).style; });\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'calm' }, { t: 0.5, pose: 'present' }, { t: TY_CD, pose: 'think' }, { t: TY_ANS, pose: 'checklist' }, { t: 17.2, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(this.qc, t, 0.8); UI.rise(this.o1, t, 5.6); UI.rise(this.o2, t, 5.9);\n    this.ml.opacity = eo(seg(t, 1.8, 2.2));\n    const mb = seg(t, 2.0, 2.8); this.mb.opacity = mb > 0 ? 1 : 0; this.mb.transform = 'scaleX(' + eo(mb).toFixed(3) + ')';\n    const show = eo(seg(t, TY_CD - 0.5, TY_CD)) * (1 - ei(seg(t, TY_ANS - 0.4, TY_ANS)));\n    this.ring.render(t, TY_CD, 5, show);\n    // Reveal: B lights up; the fee bar grows to exactly the move's length.\n    const r = seg(t, TY_ANS, TY_ANS + 0.5);\n    this.o2.borderColor = 'color-mix(in srgb, var(--main) ' + (22 + 70 * eo(r)).toFixed(0) + '%, transparent)';\n    this.o2.background = r > 0 ? 'color-mix(in srgb, var(--ground) ' + (100 - 22 * eo(r)).toFixed(0) + '%, var(--main))' : '';\n    if (r > 0) this.o1.opacity = (1 - 0.6 * eo(r)).toFixed(3);\n    this.fl.opacity = eo(seg(t, TY_ANS + 0.2, TY_ANS + 0.6));\n    const fb = seg(t, TY_ANS + 0.4, TY_ANS + 1.4); this.fb.opacity = fb > 0 ? 1 : 0; this.fb.transform = 'scaleX(' + eio(fb).toFixed(3) + ')';\n    UI.rise(this.a, t, TY_ANS + 1.0);\n    UI.rise(this.z, t, TY_ANS + 2.0, { dy: 10 });\n    UI.rise(this.n, t, 17.4);\n    this.tutor.render(t);\n  },\n});\n","scene-whennot.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Six situations, each stamped NO_TRADE.\nconst WN = [['Very thin market', 'Few orders, big slippage', 4.6], ['Wild news spike', 'Ranges jump in seconds', 5.8], ['Fees ≥ expected move', 'Nothing left after costs', 7.0],\n  ['No clear reason', 'Bored, or just a hunch', 10.3], ['No stop, no risk plan', 'Can’t say where you’re wrong', 11.5], ['Tired, upset, chasing', 'Feelings drive the clicks', 12.7]];\nkit.scene('whennot', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let cards = '';\n    WN.forEach((w, i) => {\n      const x = 140 + (i % 3) * 530, y = 310 + Math.floor(i / 3) * 230;\n      cards += '<div class=\"glass wn-c\" style=\"left:' + x + 'px;top:' + y + 'px;width:500px;height:200px;padding:26px 30px\"><p style=\"margin:0 0 10px;font-size:32px;font-weight:700\">' + w[0] + '</p><p style=\"margin:0;font-size:28px;line-height:1.35;color:color-mix(in srgb, var(--second) 72%, var(--ground))\">' + w[1] + '</p></div>' +\n        '<p class=\"wn-s mono\" style=\"position:absolute;left:' + (x + 250) + 'px;top:' + (y + 132) + 'px;margin:0;padding:6px 18px;border:3px solid var(--main);border-radius:10px;font-size:30px;font-weight:700;letter-spacing:.08em;color:var(--main);background:color-mix(in srgb, var(--ground) 80%, var(--main))\">NO_TRADE</p>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' + cards +\n      '<div class=\"words\" style=\"left:140px;top:160px;width:1500px\"><p class=\"kick wn-k\" style=\"color:var(--accent)\">When not to trade</p>' +\n      '<h2 class=\"line wn-t\">Some moments say WAIT</h2></div>' +\n      '</div>'));\n    const all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = kit.stage.querySelector('.wn-k').style; this.t = kit.stage.querySelector('.wn-t');\n    this.cs = all('.wn-c').map((e) => e.style); this.ss = all('.wn-s').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'thumbs' }, { t: 0.6, pose: 'think' }, { t: 4.5, pose: 'magnify' }, { t: 10.2, pose: 'confused' }, { t: 15.6, pose: 'checklist' }, { t: 19.0, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.cs.forEach((s, i) => UI.rise(s, t, WN[i][2]));\n    this.ss.forEach((s, i) => {\n      const a = 15.8 + i * 0.4, p = seg(t, a, a + 0.35);\n      s.opacity = eo(p); s.transform = 'rotate(-7deg) scale(' + lerp(1.8, 1, eob(p, 1.3)).toFixed(3) + ')';\n    });\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson nineteen\",\n      \"dur\": 10,\n      \"desc\": \"Title card: Phase 5, lesson T19, what is scalping; a short trade is bracketed on a fictional chart; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"From reading to deciding\",\n      \"dur\": 16,\n      \"desc\": \"The tools from T14–T18 line up; the question of how short-term traders use them, and what it costs.\"\n    },\n    {\n      \"id\": \"define\",\n      \"name\": \"Scalping\",\n      \"dur\": 22,\n      \"desc\": \"Scalping defined: small moves, trades of seconds to minutes; a stall making many small sales on thin margins.\"\n    },\n    {\n      \"id\": \"chart\",\n      \"name\": \"A short trade\",\n      \"dur\": 28,\n      \"desc\": \"A fictional 15-minute chart: two observations (a zone that holds, a thin-volume spike); a demo long 60,000 to 60,120 over 4 minutes.\"\n    },\n    {\n      \"id\": \"fees\",\n      \"name\": \"The costs\",\n      \"dur\": 24,\n      \"desc\": \"0.1 BTC (6,000 USDT): gross 12.00, fees 3.00 + 3.01, net 5.99; a losing scalp: about −12.00.\"\n    },\n    {\n      \"id\": \"frequency\",\n      \"name\": \"Trade frequency\",\n      \"dur\": 22,\n      \"desc\": \"Twenty round trips at about 6 USDT in fees each: about 120 USDT, win or lose.\"\n    },\n    {\n      \"id\": \"execution\",\n      \"name\": \"Execution quality\",\n      \"dur\": 20,\n      \"desc\": \"Slipping 10 USDT in and 10 out shrinks a 120 move to 100, before fees.\"\n    },\n    {\n      \"id\": \"compare\",\n      \"name\": \"Scalping vs holding longer\",\n      \"dur\": 22,\n      \"desc\": \"Minutes and many trades vs days and few trades; neither is safe.\"\n    },\n    {\n      \"id\": \"horizon\",\n      \"name\": \"XORA's 10–15 minutes\",\n      \"dur\": 20,\n      \"desc\": \"XORA's 10–15 minute analysis horizon is context: not a holding rule, not a prediction window.\"\n    },\n    {\n      \"id\": \"whennot\",\n      \"name\": \"When not to trade\",\n      \"dur\": 22,\n      \"desc\": \"Six situations stamped NO_TRADE: thin markets, news spikes, fees above the move, no reason, no stop, tired or chasing.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 22,\n      \"desc\": \"Pause: a 60 USDT expected move vs 0.10% round-trip fees at 60,000 (60 USDT). NO_TRADE.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the limits\",\n      \"dur\": 22,\n      \"desc\": \"Not easy money, fees and small losses add up, fast mistakes, leverage, demo first, NO_TRADE allowed.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 30,\n      \"desc\": \"Three key points and one question to check yourself.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T20, evaluating an entry opportunity.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // No voice: a soft pad and keys bed, a light pulse in the hands-on parts, quieter for the warnings.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.chart, T.execution) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.whennot, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  const pop = (t, v) => S.fx('pop', t, { vel: v || 28, pitch: 7 });\n  const tick = (t, v) => S.fx('tick', t, { vel: v || 26 });\n  pop(T.title + 2.9);\n  for (let i = 0; i < 15; i++) tick(T.title + 0.55 + i * 0.3, 14);\n  S.fx('chime', T.title + 6.0, { vel: 30 });\n  // Hook: the five tool cards, the stopwatch, the costs.\n  for (let i = 0; i < 5; i++) pop(T.hook + 0.9 + i * 0.9, 24);\n  S.fx('whoosh', T.hook + 6.5, { dur: 1.0, vel: 18 }); [9.8, 10.3, 10.8].forEach((a) => pop(T.hook + a, 28));\n  // Define: short trades open and close along the line.\n  [[0.08, 0.16], [0.3, 0.36], [0.47, 0.57], [0.68, 0.73], [0.84, 0.93]].forEach((r) => { tick(T.define + 4.4 + r[0] * 11.6, 22); tick(T.define + 4.4 + r[1] * 11.6, 18); });\n  pop(T.define + 12.9, 28); S.fx('thud', T.define + 18.4, { vel: 24 });\n  // Chart: candles, the two observations, the trade.\n  for (let i = 0; i < 15; i++) tick(T.chart + 0.8 + i * 0.3, 14);\n  pop(T.chart + 5.4, 26); pop(T.chart + 11.4, 30); pop(T.chart + 13.8, 30);\n  S.fx('ding', T.chart + 17.4, { vel: 32 }); S.fx('ding', T.chart + 19.6, { vel: 34, pitch: 4 }); S.fx('chime', T.chart + 22.8, { vel: 32 });\n  // Fees: gross bar, two fee chunks, the loss.\n  S.fx('whoosh', T.fees + 6.0, { dur: 1.0, vel: 18 }); S.fx('thud', T.fees + 9.6, { vel: 30 }); S.fx('thud', T.fees + 11.2, { vel: 30 });\n  S.fx('ding', T.fees + 14.5, { vel: 30 }); S.fx('thud', T.fees + 20.6, { vel: 28 }); S.fx('thud', T.fees + 21.2, { vel: 28 });\n  // Frequency: twenty tiles, the tank fills.\n  for (let i = 0; i < 20; i++) tick(T.frequency + 9.6 + i * 0.2, 20);\n  S.fx('thud', T.frequency + 13.6, { vel: 30 }); pop(T.frequency + 14.4, 26); S.fx('chime', T.frequency + 18.4, { vel: 32 });\n  // Execution: two slips.\n  S.fx('whoosh', T.execution + 2.2, { dur: 0.8, vel: 16 }); S.fx('thud', T.execution + 6.6, { vel: 28 }); S.fx('thud', T.execution + 8.2, { vel: 28 }); S.fx('ding', T.execution + 10.6, { vel: 30 });\n  // Compare.\n  for (let i = 0; i < 8; i++) tick(T.compare + 5.4 + i * 0.25, 20);\n  S.fx('whoosh', T.compare + 11.2, { dur: 2.0, vel: 18 }); S.fx('thud', T.compare + 17.2, { vel: 26 });\n  // Horizon.\n  S.fx('whoosh', T.horizon + 3.8, { dur: 1.0, vel: 16 }); S.fx('thud', T.horizon + 6.8, { vel: 26 }); S.fx('thud', T.horizon + 12.3, { vel: 26 }); S.fx('chime', T.horizon + 15.8, { vel: 30 });\n  // When not to trade: six cards, six stamps.\n  [4.6, 5.8, 7.0, 10.3, 11.5, 12.7].forEach((a) => pop(T.whennot + a, 24));\n  for (let i = 0; i < 6; i++) S.fx('thud', T.whennot + 15.8 + i * 0.4, { vel: 24 });\n  // Try it: countdown, then the answer.\n  pop(T.try + 0.8, 30);\n  for (let i = 0; i < 5; i++) tick(T.try + 6.6 + i, 30);\n  S.fx('chime', T.try + 11.6, { vel: 40 }); S.fx('thud', T.try + 12.4, { vel: 26 }); S.fx('ding', T.try + 17.4, { vel: 32 });\n  [5.2, 10.2, 11.8, 15.7].forEach((a) => pop(T.risks + a, 28));\n  [2.4, 8.0, 13.0].forEach((a) => pop(T.recap + a, 32));\n  S.fx('ding', T.recap + 24.5, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 21, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T19 · What is scalping?',\n  TOTAL: 290,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // Side speech bubbles sit this far higher than in T01, so they clear the caption band (y ≈ 784–930).\n  LIFT: 96,\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n  // ── Lesson helpers (T07–T09, kept for T14) ──\n  // Set text only when it changes.\n  txt(el, s) { if (el.textContent !== s) el.textContent = s; },\n  // Fade and rise in at a (and fade out at o.out); returns the eased progress.\n  rise(st, t, a, o) {\n    o = o || {}; const K = UI.K, d = o.d == null ? 0.6 : o.d, dy = o.dy == null ? 30 : o.dy;\n    const p = K.seg(t, a, a + d), out = o.out == null ? 0 : K.ei(K.seg(t, o.out, o.out + 0.5));\n    st.opacity = (K.eo(K.seg(t, a, a + d * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + K.lerp(dy, 0, K.eo(p)).toFixed(2) + 'px) scale(' + K.lerp(o.s == null ? 0.96 : o.s, 1, K.eob(p, 1.5)).toFixed(4) + ')';\n    return p;\n  },\n  // Piecewise eased value through keys [[t, v], ...].\n  path(keys, t) {\n    const K = UI.K; let v = keys[0][1];\n    for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = K.lerp(a[1], b[1], K.eio(K.clamp01((t - a[0]) / (b[0] - a[0])))); }\n    return v;\n  },\n  // Countdown ring for \"try it\": returns {el (svg group html), render(t, t0, n)}.\n  ring(kit, cls, cx, cy) {\n    const R = 110, C = 2 * Math.PI * R;\n    const html = '<g class=\"' + cls + '\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + R + '\" fill=\"none\" stroke-width=\"14\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"' + cls + '-arc\" r=\"' + R + '\" fill=\"none\" stroke-width=\"14\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<text class=\"' + cls + '-n mono\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:84px\"></text></g>';\n    let arc, n, g;\n    return {\n      html,\n      render(t, t0, len, show) {\n        if (!g) { g = kit.stage.querySelector('.' + cls); arc = kit.stage.querySelector('.' + cls + '-arc'); n = kit.stage.querySelector('.' + cls + '-n'); }\n        g.style.opacity = show;\n        arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + len)).toFixed(1));\n        UI.txt(n, t < t0 ? String(len) : String(Math.max(0, Math.min(len, Math.ceil(len - (t - t0))))));\n      },\n    };\n  },\n  // Price grid for a chart: horizontal lines with price labels to the right of x1.\n  grid(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (+y + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Same grid with the price labels on the left, ending at x0 - 14.\n  gridL(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x0 - 14) + '\" y=\"' + (+y + 8) + '\" text-anchor=\"end\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Polyline of a price function f(s) for s in [s0, s1], mapped with xOf and yOf.\n  line(f, s0, s1, xOf, yOf, dt) {\n    let d = '';\n    for (let s = s0; s <= s1 + 1e-6; s += dt || 0.05) d += (d ? 'L' : 'M') + xOf(s).toFixed(1) + ' ' + yOf(f(s)).toFixed(1);\n    return d || 'M0 0';\n  },\n  // ── Candle helpers (T14) ──\n  // n SVG candles: html to place inside an <svg>; set(i, c) draws candle i with\n  // c = {x, w, o, h, l, c, y: price → y, op?, live?, col?}. Up (close ≥ open) is --up, down is --down.\n  cdl(kit, cls, n) {\n    let html = '';\n    for (let i = 0; i < n; i++) html += '<g class=\"' + cls + '\"><line class=\"' + cls + '-w\" stroke-linecap=\"round\"/><rect class=\"' + cls + '-b\" rx=\"4\"/></g>';\n    let G, W, B;\n    return {\n      html,\n      set(i, c) {\n        if (!G) { const all = (s) => [...kit.stage.querySelectorAll(s)]; G = all('.' + cls); W = all('.' + cls + '-w'); B = all('.' + cls + '-b'); }\n        const col = c.col || (c.c >= c.o ? 'var(--up)' : 'var(--down)');\n        const yt = c.y(Math.max(c.o, c.c)), yb = c.y(Math.min(c.o, c.c)), bh = Math.max(c.min == null ? 4 : c.min, yb - yt), ym = (yt + yb) / 2;\n        const w = W[i], b = B[i], sw = Math.max(3, c.w * 0.07);\n        w.setAttribute('x1', c.x.toFixed(1)); w.setAttribute('x2', c.x.toFixed(1));\n        w.setAttribute('y1', c.y(c.h).toFixed(1)); w.setAttribute('y2', c.y(c.l).toFixed(1));\n        w.setAttribute('stroke-width', sw.toFixed(1)); w.style.stroke = col;\n        b.setAttribute('x', (c.x - c.w / 2).toFixed(1)); b.setAttribute('width', c.w.toFixed(1));\n        b.setAttribute('y', (ym - bh / 2).toFixed(1)); b.setAttribute('height', bh.toFixed(1));\n        b.setAttribute('stroke-width', (sw * 0.8).toFixed(1));\n        b.style.stroke = col;\n        b.style.fill = c.live ? 'color-mix(in srgb, ' + col + ' 38%, var(--ground))' : col;\n        G[i].style.opacity = c.op == null ? 1 : c.op;\n      },\n    };\n  },\n  // Price as a function of time from keys [[t, price], ...] plus a small fictional wiggle (amp USDT).\n  pf(keys, amp) { return (t) => UI.path(keys, t) + (amp ? (Math.sin(t * 2.9) * 0.6 + Math.sin(t * 7.3 + 1.1) * 0.4) * amp : 0); },\n  // Fade an element in at a and out at b (opacity only).\n  fade(st, t, a, b) { const K = UI.K; st.opacity = (K.eo(K.seg(t, a, a + 0.5)) * (b == null ? 1 : 1 - K.ei(K.seg(t, b, b + 0.45)))).toFixed(3); },\n  // ── T19: one fictional BTC/USDT 15-minute chart of 1-minute candles, volume in BTC ──\n  // [open, high, low, close, volume]. Support zone 59,960–60,020. Demo long at the close of #3 (60,000), closed at the close of #7 (60,120): 4 minutes.\n  // #11 spikes to 60,260 on thin volume (3 BTC).\n  H: [[60150, 60180, 60100, 60120, 8], [60120, 60140, 60040, 60060, 9], [60060, 60080, 59990, 60010, 12], [60010, 60050, 59970, 60000, 10], [60000, 60060, 59990, 60050, 9],\n    [60050, 60090, 60030, 60080, 8], [60080, 60110, 60060, 60070, 7], [60070, 60130, 60060, 60120, 9], [60120, 60140, 60090, 60100, 6], [60100, 60110, 60060, 60080, 5],\n    [60080, 60100, 60050, 60070, 4], [60070, 60260, 60060, 60110, 3], [60110, 60130, 60070, 60090, 4], [60090, 60120, 60060, 60100, 5], [60100, 60130, 60080, 60110, 5]],\n  // A forming candle: price through keys [[t, p]] with a small wiggle, kept inside [lo, hi]; returns the candle at time t.\n  forming(keys, lo, hi, t) {\n    const K = UI.K, a = keys[0][0], b = keys[keys.length - 1][0];\n    const f = (s) => Math.min(hi, Math.max(lo, UI.path(keys, s) + 9 * Math.sin(s * 9.3) * Math.sin(Math.PI * K.clamp01((s - a) / (b - a)))));\n    const e = Math.min(Math.max(t, a), b), hl = UI.hilo(f, a, e);\n    return { o: keys[0][1], h: hl[1], l: hl[0], c: f(e), live: t < b };\n  },\n  hilo(fn, a, b) { let lo = fn(a), hi = lo; for (let s = a; s <= b; s += 0.05) { const v = fn(s); if (v < lo) lo = v; if (v > hi) hi = v; } const v = fn(b); return [Math.min(lo, v), Math.max(hi, v)]; },\n};\nUI.K = kit;\n","tutor.json":"{\n  \"present\": {\n    \"w\": 546,\n    \"h\": 612,\n    \"ax\": 218,\n    \"feet\": 605,\n    \"bw\": 421\n  },\n  \"explain\": {\n    \"w\": 502,\n    \"h\": 602,\n    \"ax\": 275,\n    \"feet\": 594,\n    \"bw\": 394\n  },\n  \"think\": {\n    \"w\": 465,\n    \"h\": 656,\n    \"ax\": 229,\n    \"feet\": 648,\n    \"bw\": 452\n  },\n  \"point\": {\n    \"w\": 547,\n    \"h\": 568,\n    \"ax\": 210,\n    \"feet\": 561,\n    \"bw\": 415\n  },\n  \"magnify\": {\n    \"w\": 187,\n    \"h\": 170,\n    \"ax\": 85.5,\n    \"feet\": 163,\n    \"bw\": 138\n  },\n  \"thumbs\": {\n    \"w\": 181,\n    \"h\": 179,\n    \"ax\": 102,\n    \"feet\": 172,\n    \"bw\": 138\n  },\n  \"idea\": {\n    \"w\": 169,\n    \"h\": 178,\n    \"ax\": 69.5,\n    \"feet\": 171,\n    \"bw\": 138\n  },\n  \"checklist\": {\n    \"w\": 185,\n    \"h\": 161,\n    \"ax\": 97.5,\n    \"feet\": 153,\n    \"bw\": 138\n  },\n  \"confused\": {\n    \"w\": 185,\n    \"h\": 169,\n    \"ax\": 85,\n    \"feet\": 162,\n    \"bw\": 138\n  },\n  \"calm\": {\n    \"w\": 234,\n    \"h\": 174,\n    \"ax\": 111,\n    \"feet\": 167,\n    \"bw\": 138\n  },\n  \"wv1\": {\n    \"w\": 381,\n    \"h\": 448,\n    \"ax\": 163.5,\n    \"feet\": 434,\n    \"bw\": 305\n  },\n  \"wv2\": {\n    \"w\": 374,\n    \"h\": 448,\n    \"ax\": 165,\n    \"feet\": 436,\n    \"bw\": 305\n  },\n  \"wv3\": {\n    \"w\": 363,\n    \"h\": 448,\n    \"ax\": 166,\n    \"feet\": 431,\n    \"bw\": 305\n  },\n  \"wv4\": {\n    \"w\": 375,\n    \"h\": 446,\n    \"ax\": 166,\n    \"feet\": 431,\n    \"bw\": 305\n  },\n  \"wk0\": {\n    \"w\": 353,\n    \"h\": 460,\n    \"ax\": 162.5,\n    \"feet\": 446,\n    \"bw\": 310\n  },\n  \"wk1\": {\n    \"w\": 361,\n    \"h\": 460,\n    \"ax\": 164.5,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk2\": {\n    \"w\": 345,\n    \"h\": 460,\n    \"ax\": 170.5,\n    \"feet\": 448,\n    \"bw\": 310\n  },\n  \"wk3\": {\n    \"w\": 365,\n    \"h\": 460,\n    \"ax\": 164,\n    \"feet\": 446,\n    \"bw\": 310\n  },\n  \"wk4\": {\n    \"w\": 375,\n    \"h\": 457,\n    \"ax\": 167.5,\n    \"feet\": 444,\n    \"bw\": 310\n  },\n  \"wk5\": {\n    \"w\": 364,\n    \"h\": 457,\n    \"ax\": 167,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk6\": {\n    \"w\": 354,\n    \"h\": 457,\n    \"ax\": 166.5,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk7\": {\n    \"w\": 365,\n    \"h\": 457,\n    \"ax\": 167,\n    \"feet\": 445,\n    \"bw\": 310\n  }\n}"}};</script>
<script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *
 * build-lesson.mjs inlines this file into public/futures-edge/lessons/<id>.html, after a
 * `window.FILM = {...}` block that carries the scene list, module texts and asset paths.
 */
(function () {
  "use strict";

  const F = window.FILM;
  const W = F.width;
  const H = F.height;

  // ── Maths and easing ───────────────────────────────────────────────────────
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clamp01 = (x) => clamp(x, 0, 1);
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a)));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const ei = (x) => Math.pow(clamp01(x), 3);
  const eio = (x) => {
    x = clamp01(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  };
  const eob = (x, s = 1.4) => {
    x = clamp01(x);
    return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  };
  const rng = (seed) => {
    let a = seed >>> 0 || 1;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const breathe = (t, amt = 0.012, period = 3.2) => 1 + amt * Math.sin((2 * Math.PI * t) / period);

  // ── DOM helpers ────────────────────────────────────────────────────────────
  const h = (html) => {
    const tpl = document.createElement("template");
    tpl.innerHTML = String(html).trim();
    return tpl.content.firstElementChild;
  };
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const el = (tag, o = {}, children = []) => {
    const e = document.createElement(tag);
    if (o.class) e.className = o.class;
    if (o.style) e.setAttribute("style", o.style);
    if (o.text != null) e.textContent = o.text;
    if (o.html != null) e.innerHTML = o.html;
    for (const [k, v] of Object.entries(o.attrs || {})) e.setAttribute(k, v);
    for (const c of children) e.append(c);
    return e;
  };

  // Words of an element as inline-block spans (inline markup such as <b> is kept).
  const wordCache = new WeakMap();
  function words(root) {
    let list = wordCache.get(root);
    if (list) return list;
    list = [];
    const walk = (node) => {
      for (const child of Array.from(node.childNodes)) {
        if (child.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const part of child.textContent.split(/(\s+)/)) {
            if (!part) continue;
            if (/^\s+$/.test(part)) {
              frag.append(document.createTextNode(part));
            } else {
              const s = document.createElement("span");
              s.textContent = part;
              s.style.display = "inline-block";
              frag.append(s);
              list.push(s);
            }
          }
          node.replaceChild(frag, child);
        } else if (child.nodeType === 1) {
          walk(child);
        }
      }
    };
    walk(root);
    wordCache.set(root, list);
    return list;
  }
  const TextFx = {
    fadeFromRight(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.11, d = o.dur ?? 0.5, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = eo(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = p;
        s.style.transform = "translateX(" + ((1 - p) * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
    fadeOutLeft(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.04, d = o.dur ?? 0.35, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = ei(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = 1 - p;
        s.style.transform = "translateX(" + (-p * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
  };

  // ── The kit the scene modules use ──────────────────────────────────────────
  const modules = F.modules;
  const jsonCache = {};
  const assets = {
    url: (name) => F.assetBase + name,
    has: (name) => Object.prototype.hasOwnProperty.call(F.assets, name),
    list: () => Object.keys(F.assets),
  };
  const defs = {};
  let scoreFn = null;

  // start/dur: the scene in the played timeline; oldStart/oldDur: as authored (k = dur / oldDur).
  let acc = 0;
  const scenes = F.scenes.map((s) => {
    const o = Object.assign({ k: 1, oldStart: acc, oldDur: s.dur }, s, { start: acc });
    acc += s.dur;
    return o;
  });
  const END = acc;
  const OLD_END = scenes.reduce((a, s) => a + s.oldDur, 0);
  // Authored time to played time.
  function warp(x) {
    for (let i = scenes.length - 1; i >= 0; i--) {
      const s = scenes[i];
      if (x >= s.oldStart) return s.start + (x - s.oldStart) * s.k;
    }
    return x;
  }
  // Narration lines: spoken when the lesson has a voice track (F.voice.src), always shown as captions.
  const lines = (F.voice && F.voice.lines) || [];
  // Stretches where the music dips under the voice: each line plus a little either side, close ones joined.
  const duckSpans = [];
  if (F.voice && F.voice.src) for (const l of lines) {
    const a = l.t - 0.15, b = l.t + l.d + 0.25, last = duckSpans[duckSpans.length - 1];
    if (last && a - last[1] < 1.2) last[1] = b; else duckSpans.push([a, b]);
  }

  function makeKit(box, start, dur) {
    return {
      stage: box, start, dur, W, H,
      seg, lerp, eo, ei, eio, eob, clamp, clamp01, rng, breathe, TextFx, h, el, esc,
      assets,
      module: (n) => (n in modules ? modules[n] : null),
      json: (n) => (jsonCache[n] ??= JSON.parse(modules[n])),
      modules: () => Object.keys(modules),
      scene: (id, def) => { defs[id] = def; },
      score: (fn) => { scoreFn = fn; },
    };
  }
  const run = (name, kit) => new Function("kit", modules[name] + "\n//# sourceURL=" + F.id + "/" + name)(kit);

  // ── Stage ──────────────────────────────────────────────────────────────────
  const stage = document.getElementById("stage");
  const css = document.createElement("style");
  css.textContent = modules["base.css"] || "";
  document.head.append(css);

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 200));
  fit();

  // ── Audio: score.js recorded as events, then synthesised with WebAudio ─────
  function midiOf(p) {
    if (typeof p === "number") return p;
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(p).trim());
    if (!m) return 72;
    const base = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[m[1].toLowerCase()];
    return 12 * (Number(m[3]) + 1) + base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  }

  // score.js runs twice: the music against the played timeline, the sound effects against the
  // authored one and then moved onto the played one, so each cue stays with its animation.
  function recordScore() {
    const T = { END };
    for (const s of scenes) T[s.id] = s.start;
    const music = recordPass(T);
    const Told = { END: OLD_END };
    for (const s of scenes) Told[s.id] = s.oldStart;
    const cues = recordPass(Told);
    const ev = music.ev.filter((e) => e.k !== "f");
    for (const e of cues.ev) {
      if (e.k !== "f") continue;
      e.t = warp(e.t);
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      ev.push(e);
    }
    ev.sort((a, b) => a.s - b.s);
    return { ev, tracks: music.tracks, master: music.master };
  }

  function recordPass(T) {
    const ev = [];
    const tracks = {};
    const master = { gain: -6, music: 0, fadeOut: 1 };
    let B = 0.5, t0 = 0;
    const at = (o) => (o.t != null ? o.t : t0 + (o.beat || 0) * B);
    const len = (o, d) => (o.dur != null ? o.dur : o.beats != null ? o.beats * B : d);
    const push = (e) => {
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      if (e.s < -0.1) return;
      if (e.s < 0) { e.t += -e.s; e.s = 0; }
      ev.push(e);
    };
    const hits = (str, rep, step, from, vel, fn) => {
      for (let r = 0; r < rep; r++) {
        for (let i = 0; i < str.length; i++) {
          const c = str[i];
          if (c !== "x" && c !== "X" && c !== "o") continue;
          fn(t0 + (from + (r * str.length + i) * step) * B, vel * (c === "X" ? 1.25 : c === "o" ? 0.5 : 1));
        }
      }
    };
    const S = {
      tempo(bpm, o = {}) { B = 60 / bpm; t0 = o.t0 || 0; },
      beat: (n) => t0 + n * B,
      toBeat: (t) => (t - t0) / B,
      seed() {},
      program(track, patch, o = {}) {
        tracks[track] = { patch, gain: o.gain || 0, pan: o.pan || 0, rev: o.rev || 0, bright: o.bright ?? 1 };
      },
      note(track, p, o = {}) { push({ k: "n", track, m: midiOf(p), t: at(o), d: len(o, B), v: o.vel ?? 90 }); },
      chord(track, ps, o = {}) { ps.forEach((p) => S.note(track, p, o)); },
      pattern(track, str, o = {}) {
        const pitches = o.pitch || ["C5"];
        let k = 0;
        const step = o.step ?? 0.5;
        hits(str, o.repeat ?? 1, step, o.from || 0, o.vel ?? 80, (t, v) =>
          push({ k: "n", track, m: midiOf(pitches[k++ % pitches.length]), t, d: o.dur ?? step * B * 0.9, v }));
      },
      drum(name, o = {}) { push({ k: "d", name, t: at(o), d: 0.3, v: o.vel ?? 90 }); },
      drums(map, o = {}) {
        for (const name of Object.keys(map)) {
          hits(map[name], o.repeat ?? 1, o.step ?? 0.5, o.from || 0, o.vel ?? 80, (t, v) => push({ k: "d", name, t, d: 0.3, v }));
        }
      },
      ticks(times, o = {}) { times.forEach((t) => push({ k: "f", name: "tick", t, d: 0.03, v: o.vel ?? 40, pitch: 0 })); },
      fx(name, t, o = {}) { push({ k: "f", name, t, d: o.dur ?? 0.5, v: o.vel ?? 70, pitch: o.pitch || 0 }); },
      run(track, ps, o = {}) {
        const step = o.step ?? 0.1;
        ps.forEach((p, i) => push({ k: "n", track, m: midiOf(p), t: o.t + i * step, d: step * 2.5, v: (o.vel ?? 70) + i * (o.cresc || 0) }));
      },
      master(o = {}) {
        if (o.gain != null) master.gain = o.gain;
        if (o.music != null) master.music = o.music;
        if (o.fadeOut != null) master.fadeOut = o.fadeOut;
      },
    };
    if (scoreFn) scoreFn(S, T);
    return { ev, tracks, master };
  }

  const db = (x) => Math.pow(10, x / 20);
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const audio = {
    ctx: null, enabled: false, muted: false, score: null,
    out: null, verb: null, noise: null, session: null, timer: 0,
    voiceData: null, voiceBuf: null, voiceOut: null,
  };
  const DUCK = 0.4;

  function setupAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ctx = (audio.ctx = new AC());
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;
    comp.connect(ctx.destination);
    audio.out = ctx.createGain();
    audio.out.gain.value = db(audio.score.master.gain);
    audio.out.connect(comp);
    // A small generated room for the reverb send.
    const len = Math.floor(ctx.sampleRate * 2.4);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    const r = rng(9);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    audio.verb = ctx.createConvolver();
    audio.verb.buffer = ir;
    const verbGain = ctx.createGain();
    verbGain.gain.value = 0.5;
    audio.verb.connect(verbGain);
    verbGain.connect(audio.out);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    const r2 = rng(3);
    for (let i = 0; i < nd.length; i++) nd[i] = r2() * 2 - 1;
    audio.noise = nb;
    // The voice skips the music's compressor and goes straight out.
    audio.voiceOut = ctx.createGain();
    audio.voiceOut.gain.value = 1;
    audio.voiceOut.connect(ctx.destination);
    decodeVoice();
    return true;
  }

  async function decodeVoice() {
    if (!audio.ctx || audio.voiceBuf || !audio.voiceData) return;
    try {
      const data = await audio.voiceData;
      if (!data || audio.voiceBuf) return;
      audio.voiceBuf = await new Promise((ok, fail) => audio.ctx.decodeAudioData(data.slice(0), ok, fail));
    } catch (e) {
      return; // the lesson plays on without the voice
    }
    if (audio.session) startVoice(audio.session);
  }

  // The voice of one session, from the session's start point; the music dips under each line.
  function startVoice(s) {
    if (!audio.voiceBuf || s.voice) return;
    const ctx = audio.ctx;
    const at = Math.max(s.ctx0, ctx.currentTime + 0.02);
    const off = s.film0 + (at - s.ctx0);
    if (off >= audio.voiceBuf.duration) return;
    const src = ctx.createBufferSource();
    src.buffer = audio.voiceBuf;
    src.connect(audio.voiceOut);
    src.start(at, off);
    s.voice = src;
    for (const g of [s.duck.gain, s.send.gain]) {
      for (const [a, b] of duckSpans) {
        if (b <= off) continue;
        const ca = at + (a - off), cb = at + (b - off);
        if (ca > at) { g.setValueAtTime(1, ca); g.linearRampToValueAtTime(DUCK, ca + 0.25); } else g.setValueAtTime(DUCK, at);
        g.setValueAtTime(DUCK, cb);
        g.linearRampToValueAtTime(1, cb + 0.5);
      }
    }
  }

  // One playback session: a bus that can be dropped as a whole on pause or seek.
  function startSession(filmT) {
    stopSession();
    if (!audio.enabled || audio.muted) return;
    const ctx = audio.ctx;
    const bus = ctx.createGain();
    const duck = ctx.createGain();
    bus.connect(duck);
    duck.connect(audio.out);
    const send = ctx.createGain();
    send.connect(audio.verb);
    // The instruments (not the drums or sound effects) go through their own level, master({ music }).
    const music = ctx.createGain();
    music.gain.value = db(audio.score.master.music);
    music.connect(bus);
    const musicSend = ctx.createGain();
    musicSend.gain.value = music.gain.value;
    musicSend.connect(send);
    const tracks = {};
    for (const [name, tr] of Object.entries(audio.score.tracks)) {
      const g = ctx.createGain();
      g.gain.value = db(tr.gain);
      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (pan) { pan.pan.value = tr.pan; g.connect(pan); pan.connect(music); } else g.connect(music);
      const rs = ctx.createGain();
      rs.gain.value = tr.rev;
      g.connect(rs);
      rs.connect(musicSend);
      tracks[name] = { node: g, def: tr };
    }
    const s = { bus, duck, send, music, musicSend, tracks, ctx0: ctx.currentTime + 0.06, film0: filmT, upTo: filmT, idx: 0, voice: null };
    audio.session = s;
    startVoice(s);
    // Notes already sounding at the seek point start now with what is left of them.
    for (const e of audio.score.ev) {
      if (e.s >= filmT) break;
      if (e.k === "n" && e.s + e.d > filmT + 0.15) sound(e, s, filmT, e.s + e.d - filmT);
    }
    s.idx = audio.score.ev.findIndex((e) => e.s >= filmT);
    if (s.idx < 0) s.idx = audio.score.ev.length;
    // Fade the master out over the last seconds of the lesson.
    const fo = audio.score.master.fadeOut;
    if (fo > 0) {
      const a = Math.max(filmT, END - fo);
      bus.gain.setValueAtTime(1, s.ctx0 + (a - filmT));
      bus.gain.linearRampToValueAtTime(0.0001, s.ctx0 + (END - filmT));
    }
    audio.timer = setInterval(() => pump(), 50);
    pump();
  }

  function stopSession() {
    clearInterval(audio.timer);
    const s = audio.session;
    audio.session = null;
    if (!s) return;
    const now = audio.ctx.currentTime;
    s.bus.gain.cancelScheduledValues(now);
    s.bus.gain.setTargetAtTime(0, now, 0.03);
    s.send.gain.cancelScheduledValues(now);
    s.send.gain.setTargetAtTime(0, now, 0.03);
    if (s.voice) {
      const v = s.voice;
      try { v.stop(now + 0.05); } catch (e) { /* not started yet */ }
      setTimeout(() => v.disconnect(), 400);
    }
    setTimeout(() => { s.bus.disconnect(); s.duck.disconnect(); s.send.disconnect(); s.music.disconnect(); s.musicSend.disconnect(); }, 400);
  }

  function pump() {
    const s = audio.session;
    if (!s) return;
    const filmNow = s.film0 + (audio.ctx.currentTime - s.ctx0);
    const horizon = filmNow + 0.6;
    const ev = audio.score.ev;
    while (s.idx < ev.length && ev[s.idx].s <= horizon) {
      const e = ev[s.idx++];
      if (e.s >= s.film0) sound(e, s, e.s, e.d);
    }
  }

  function sound(e, s, filmStart, dur) {
    const ctx = audio.ctx;
    const when = Math.max(ctx.currentTime, s.ctx0 + (filmStart - s.film0));
    const v = Math.pow(clamp01(e.v / 127), 1.5);
    if (e.k === "n") {
      const tr = s.tracks[e.track];
      if (!tr) return;
      voice(tr.def.patch, tr.node, hz(e.m), when, Math.max(0.05, dur), v, tr.def.bright);
    } else if (e.k === "d") {
      drum(e.name, s.bus, when, v);
    } else {
      fx(e.name, s.bus, s.send, when, e.d, v, e.pitch || 0);
    }
  }

  function env(g, when, peak, attack, hold, release) {
    peak = Math.max(peak, 0.0002);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.setValueAtTime(peak, when + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, when + attack + hold + release);
    return when + attack + hold + release + 0.05;
  }
  function osc(type, f, dest, when, stop, detune) {
    const o = audio.ctx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    if (detune) o.detune.value = detune;
    o.connect(dest);
    o.start(when);
    o.stop(stop);
    return o;
  }
  function noiseSrc(dest, when, stop) {
    const n = audio.ctx.createBufferSource();
    n.buffer = audio.noise;
    n.loop = true;
    n.connect(dest);
    n.start(when);
    n.stop(stop);
    return n;
  }

  function voice(patch, dest, f, when, dur, v, bright) {
    const ctx = audio.ctx;
    const g = ctx.createGain();
    g.connect(dest);
    let stop;
    switch (patch) {
      case "pad": {
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 700 + 900 * bright;
        lp.connect(g);
        stop = env(g, when, 0.22 * v, 0.5, Math.max(0, dur - 0.5), 1.1);
        osc("sawtooth", f, lp, when, stop, -8);
        osc("sawtooth", f, lp, when, stop, 8);
        break;
      }
      case "ep":
      case "keys": {
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.22 * v + 0.0002, when + 0.008);
        g.gain.exponentialRampToValueAtTime(0.08 * v + 0.0001, when + Math.min(dur, 0.9));
        g.gain.exponentialRampToValueAtTime(0.0001, when + dur + 0.4);
        stop = when + dur + 0.45;
        osc("sine", f, g, when, stop);
        const h2 = ctx.createGain();
        h2.gain.value = 0.25;
        h2.connect(g);
        osc("sine", f * 2, h2, when, stop);
        break;
      }
      case "bass": {
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 500;
        lp.connect(g);
        stop = env(g, when, 0.34 * v, 0.01, Math.max(0, dur - 0.1), 0.18);
        osc("sine", f, lp, when, stop);
        osc("triangle", f * 2, lp, when, stop);
        break;
      }
      case "pluck": {
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.24 * v + 0.0002, when + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, when + Math.min(1.1, dur + 0.45));
        stop = when + Math.min(1.1, dur + 0.45) + 0.05;
        osc("triangle", f, g, when, stop);
        break;
      }
      default: {
        // marimba, vibes, glock and anything unknown: a struck bar.
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.26 * v + 0.0002, when + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, when + 0.7);
        stop = when + 0.75;
        osc("sine", f, g, when, stop);
        const h4 = ctx.createGain();
        h4.gain.value = 0.12;
        h4.connect(g);
        osc("sine", f * 4, h4, when, stop);
      }
    }
  }

  function drum(name, dest, when, v) {
    const ctx = audio.ctx;
    const g = ctx.createGain();
    g.connect(dest);
    if (name === "kick" || name === "tom") {
      const o = osc("sine", 140, g, when, when + 0.4);
      o.frequency.setValueAtTime(140, when);
      o.frequency.exponentialRampToValueAtTime(45, when + 0.12);
      env(g, when, 0.8 * v, 0.002, 0.02, 0.3);
    } else {
      const f = ctx.createBiquadFilter();
      f.type = name === "sidestick" || name === "woodblock" ? "bandpass" : "highpass";
      f.frequency.value = name === "sidestick" || name === "woodblock" ? 1900 : 7000;
      f.connect(g);
      noiseSrc(f, when, when + 0.2);
      env(g, when, 0.22 * v, 0.001, 0.005, name === "openhat" ? 0.25 : 0.045);
    }
  }

  function fx(name, dest, send, when, dur, v, pitch) {
    const ctx = audio.ctx;
    const tr = Math.pow(2, pitch / 12);
    const g = ctx.createGain();
    g.connect(dest);
    const wet = ctx.createGain();
    wet.gain.value = 0.35;
    g.connect(wet);
    wet.connect(send);
    const r = rng(Math.floor(when * 1000));
    switch (name) {
      case "tick": {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = 3000 + r() * 1500;
        f.Q.value = 3;
        f.connect(g);
        noiseSrc(f, when, when + 0.06);
        env(g, when, 0.5 * v, 0.001, 0.004, 0.025);
        break;
      }
      case "click": {
        osc("square", 1400, g, when, when + 0.06);
        env(g, when, 0.12 * v, 0.001, 0.005, 0.03);
        break;
      }
      case "ding": {
        osc("sine", 1046.5 * tr, g, when, when + 1.6);
        osc("sine", 1568 * tr, g, when, when + 1.6);
        env(g, when, 0.16 * v, 0.004, 0.02, 1.4);
        break;
      }
      case "chime": {
        [0, 4, 7].forEach((st, i) => {
          const gi = ctx.createGain();
          gi.connect(g);
          const t = when + i * 0.07;
          osc("sine", 1046.5 * tr * Math.pow(2, st / 12), gi, t, t + 1);
          env(gi, t, 0.14 * v, 0.003, 0.01, 0.9);
        });
        g.gain.value = 1;
        break;
      }
      case "sparkle": {
        for (let i = 0; i < 6; i++) {
          const gi = ctx.createGain();
          gi.connect(g);
          const t = when + r() * 0.5;
          osc("sine", 2000 + r() * 2200, gi, t, t + 0.2);
          env(gi, t, 0.07 * v, 0.002, 0.01, 0.12);
        }
        break;
      }
      case "whoosh":
      case "revswell": {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass";
        f.Q.value = 0.8;
        f.frequency.setValueAtTime(300, when);
        f.frequency.exponentialRampToValueAtTime(name === "whoosh" ? 2400 : 3200, when + dur);
        f.connect(g);
        noiseSrc(f, when, when + dur + 0.1);
        g.gain.setValueAtTime(0.0001, when);
        if (name === "whoosh") {
          g.gain.linearRampToValueAtTime(0.3 * v, when + dur * 0.5);
          g.gain.linearRampToValueAtTime(0.0001, when + dur);
        } else {
          g.gain.exponentialRampToValueAtTime(0.28 * v + 0.0002, when + dur);
          g.gain.linearRampToValueAtTime(0.0001, when + dur + 0.06);
        }
        break;
      }
      case "thud": {
        const o = osc("sine", 110, g, when, when + 0.4);
        o.frequency.setValueAtTime(110, when);
        o.frequency.exponentialRampToValueAtTime(45, when + 0.18);
        env(g, when, 0.5 * v, 0.002, 0.02, 0.3);
        break;
      }
      case "boing": {
        const o = osc("sine", 220 * tr, g, when, when + 0.5);
        o.frequency.setValueAtTime(220 * tr, when);
        o.frequency.linearRampToValueAtTime(520 * tr, when + 0.12);
        o.frequency.linearRampToValueAtTime(300 * tr, when + 0.4);
        env(g, when, 0.2 * v, 0.005, 0.05, 0.35);
        break;
      }
      default: {
        // pop, and any name this synth does not know.
        const o = osc("sine", 600 * tr, g, when, when + 0.2);
        o.frequency.setValueAtTime(600 * tr, when);
        o.frequency.exponentialRampToValueAtTime(1200 * tr, when + 0.06);
        env(g, when, 0.3 * v, 0.002, 0.01, 0.12);
      }
    }
  }

  // ── Playback ───────────────────────────────────────────────────────────────
  const state = { t: 0, playing: false, wall0: 0, t0: 0, current: -1 };
  let instances = [];

  function sceneAt(t) {
    for (let i = scenes.length - 1; i >= 0; i--) if (t >= scenes[i].start) return i;
    return 0;
  }

  function renderAt(t) {
    const i = sceneAt(t);
    if (i !== state.current) {
      instances.forEach((inst, k) => { inst.box.style.display = k === i ? "block" : "none"; });
      state.current = i;
    }
    const inst = instances[i];
    inst.def.render.call(inst.def, (Math.min(t, END - 1e-4) - inst.sc.start) / inst.sc.k, inst.kit);
    ui.update(t);
  }

  function now() { return performance.now() / 1000; }

  function play() {
    if (state.t >= END - 0.01) state.t = 0;
    state.playing = true;
    state.wall0 = now();
    state.t0 = state.t;
    startSession(state.t);
    ui.update(state.t);
  }
  function pause() {
    state.playing = false;
    stopSession();
    ui.update(state.t);
  }
  function seek(t) {
    state.t = clamp(t, 0, END);
    state.wall0 = now();
    state.t0 = state.t;
    if (state.playing) startSession(state.t);
    renderAt(state.t);
  }
  function tick() {
    if (state.playing) {
      state.t = state.t0 + (now() - state.wall0);
      if (state.t >= END) {
        state.t = END;
        pause();
      }
      renderAt(state.t);
    }
    requestAnimationFrame(tick);
  }

  async function enableAudio() {
    if (audio.enabled) return;
    if (!audio.ctx && !setupAudio()) return;
    try { await audio.ctx.resume(); } catch (e) { /* stays suspended */ }
    if (audio.ctx.state !== "running") return;
    audio.enabled = true;
    ui.sound();
    if (state.playing) startSession(state.t);
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  const fmt = (t) => {
    const s = Math.max(0, Math.floor(t));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  const ICON = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>',
    replay: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L7 6.5l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z" fill="currentColor"/></svg>',
    on: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    off: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    full: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    exit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  const CC_LANGS = [
    { id: "ml", label: "മലയാളം", short: "മ", name: "Malayalam" },
    { id: "en", label: "English", short: "EN", name: "English" },
    { id: "off", label: "Off", short: "CC", name: "Off" },
  ];

  // ── Full screen ────────────────────────────────────────────────────────────
  // The Fullscreen API where the browser has it (desktop, Android, iPad), turning a phone to
  // landscape where it allows. iPhone Safari has no Fullscreen API for pages, so inside the
  // course page the player asks the parent to grow the lesson to fill the whole screen instead.
  const embedded = window.parent !== window;
  const root = document.documentElement;
  const fs = {
    native: !!(document.fullscreenEnabled || document.webkitFullscreenEnabled),
    pseudo: false,
    available() { return this.native || embedded; },
    active() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || this.pseudo; },
    async toggle() {
      if (this.native) {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) { /* not locked */ }
          await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          return;
        }
        try {
          await (root.requestFullscreen || root.webkitRequestFullscreen).call(root, { navigationUI: "hide" });
          if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape").catch(() => {});
          return;
        } catch (e) {
          if (!embedded) return; // refused: fall through to the parent page below
        }
      }
      this.pseudo = !this.pseudo;
      window.parent.postMessage({ type: "futures-edge:fullscreen", on: this.pseudo }, location.origin);
      ui.full();
    },
  };
  document.addEventListener("fullscreenchange", () => ui.full());
  document.addEventListener("webkitfullscreenchange", () => ui.full());
  const ui = (() => {
    const bar = h(
      '<div class="fe-ui" role="group" aria-label="Lesson controls">' +
        '<button type="button" class="fe-btn fe-pp" aria-label="Pause"></button>' +
        '<div class="fe-track" role="slider" tabindex="0" aria-label="Lesson position" aria-valuemin="0"><i></i></div>' +
        '<span class="fe-time"></span>' +
        (lines.length ? '<div class="fe-ccw"><button type="button" class="fe-btn fe-cc" aria-haspopup="true" aria-expanded="false">CC</button>' +
          '<div class="fe-ccm" role="menu" aria-label="Subtitles" hidden>' +
          CC_LANGS.map((l) => '<button type="button" role="menuitemradio" data-lang="' + l.id + '"' + (l.id === "ml" ? ' lang="ml"' : "") + '>' + l.label + '</button>').join("") +
          '</div></div>' : "") +
        '<button type="button" class="fe-btn fe-snd" aria-label="Turn sound on"></button>' +
        (fs.available() ? '<button type="button" class="fe-btn fe-fs" aria-label="Full screen"></button>' : "") +
      "</div>"
    );
    const hint = h('<button type="button" class="fe-hint">Click anywhere for sound</button>');
    const cap = h('<p class="fe-cap" aria-live="off"></p>');
    document.body.append(cap, bar, hint);
    const cc = bar.querySelector(".fe-cc");
    const ccMenu = bar.querySelector(".fe-ccm");
    const fsb = bar.querySelector(".fe-fs");
    if (fsb) fsb.addEventListener("click", (e) => { e.stopPropagation(); fs.toggle(); wake(); });
    // Subtitle language: Malayalam by default when the lesson has it, then English, or off.
    // The viewer's choice is remembered on this device.
    const hasMl = lines.some((l) => l.ml);
    let ccLang = hasMl ? "ml" : "en", capText = null;
    try {
      const saved = localStorage.getItem("fe-subtitles");
      if (saved === "en" || saved === "off" || (saved === "ml" && hasMl)) ccLang = saved;
    } catch (e) { /* storage blocked: keep the default */ }
    const setLang = (lang) => {
      ccLang = lang;
      try { localStorage.setItem("fe-subtitles", lang); } catch (e) { /* not remembered */ }
      capText = null;
      api.update(state.t);
      api.cc();
    };
    const openMenu = (open) => {
      if (!ccMenu) return;
      ccMenu.hidden = !open;
      cc.setAttribute("aria-expanded", String(open));
      if (open) (ccMenu.querySelector('[aria-checked="true"]') || ccMenu.firstElementChild).focus();
    };
    if (cc) {
      cc.addEventListener("click", (e) => { e.stopPropagation(); openMenu(ccMenu.hidden); wake(); });
      ccMenu.addEventListener("click", (e) => {
        const b = e.target.closest("[data-lang]");
        if (!b) return;
        e.stopPropagation();
        setLang(b.dataset.lang);
        openMenu(false);
        cc.focus();
      });
      ccMenu.addEventListener("keydown", (e) => {
        const items = Array.from(ccMenu.children), i = items.indexOf(document.activeElement);
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
        }
        if (e.key === "Escape") { e.stopPropagation(); openMenu(false); cc.focus(); }
      });
      document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".fe-ccw")) openMenu(false); }, true);
      if (!hasMl) ccMenu.querySelector('[data-lang="ml"]').remove();
    }
    const pp = bar.querySelector(".fe-pp");
    const trk = bar.querySelector(".fe-track");
    const fill = trk.querySelector("i");
    const time = bar.querySelector(".fe-time");
    const snd = bar.querySelector(".fe-snd");
    trk.setAttribute("aria-valuemax", String(Math.round(END)));
    let idle = 0;
    const wake = () => {
      document.body.classList.remove("fe-idle");
      clearTimeout(idle);
      idle = setTimeout(() => { if (state.playing) document.body.classList.add("fe-idle"); }, 2600);
    };
    document.addEventListener("pointermove", wake);
    pp.addEventListener("click", (e) => { e.stopPropagation(); enableAudio(); state.playing ? pause() : play(); wake(); });
    snd.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!audio.enabled) { await enableAudio(); return; }
      audio.muted = !audio.muted;
      if (audio.muted) stopSession(); else if (state.playing) startSession(state.t);
      api.sound();
    });
    const seekTo = (clientX) => {
      const r = trk.getBoundingClientRect();
      seek(clamp01((clientX - r.left) / r.width) * END);
    };
    let drag = false;
    trk.addEventListener("pointerdown", (e) => { e.stopPropagation(); enableAudio(); drag = true; trk.setPointerCapture(e.pointerId); seekTo(e.clientX); });
    trk.addEventListener("pointermove", (e) => { if (drag) seekTo(e.clientX); });
    trk.addEventListener("pointerup", () => { drag = false; });
    trk.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { seek(state.t + 5); e.preventDefault(); }
      if (e.key === "ArrowLeft") { seek(state.t - 5); e.preventDefault(); }
    });
    // The first click anywhere turns the sound on; later clicks on the lesson pause and resume.
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".fe-ui")) return;
      if (!audio.enabled) { enableAudio(); return; }
      state.playing ? pause() : play();
      wake();
    });
    document.addEventListener("keydown", (e) => {
      if (e.target.closest && e.target.closest(".fe-ccw")) return; // the subtitle menu handles its own keys
      if (e.key === " " || e.key === "k") { e.preventDefault(); enableAudio(); state.playing ? pause() : play(); wake(); }
      if ((e.key === "f" || e.key === "F") && fs.available()) { fs.toggle(); wake(); }
      if (e.key === "Escape" && fs.pseudo) fs.toggle();
    });
    const api = {
      update(t) {
        const done = !state.playing && t >= END - 0.01;
        pp.innerHTML = state.playing ? ICON.pause : done ? ICON.replay : ICON.play;
        pp.setAttribute("aria-label", state.playing ? "Pause" : done ? "Replay" : "Play");
        fill.style.width = ((t / END) * 100).toFixed(3) + "%";
        trk.setAttribute("aria-valuenow", String(Math.round(t)));
        time.textContent = fmt(t) + " / " + fmt(END);
        let text = "";
        if (ccLang !== "off") for (const l of lines) if (t >= l.t - 0.1 && t < l.t + l.d + 0.4) text = (ccLang === "ml" && l.ml) || l.text;
        if (text !== capText) {
          capText = text;
          cap.textContent = text;
          cap.hidden = !text;
          cap.lang = ccLang === "ml" ? "ml" : "en";
        }
        if (!state.playing) wake();
      },
      sound() {
        const on = audio.enabled && !audio.muted;
        snd.innerHTML = on ? ICON.on : ICON.off;
        snd.setAttribute("aria-label", on ? "Mute" : "Turn sound on");
        hint.hidden = audio.enabled;
      },
      cc() {
        if (!cc) return;
        const cur = CC_LANGS.find((l) => l.id === ccLang);
        cc.textContent = ccLang === "off" ? "CC" : cur.short;
        cc.classList.toggle("is-off", ccLang === "off");
        cc.setAttribute("aria-label", "Subtitles: " + cur.name);
        for (const b of ccMenu.children) b.setAttribute("aria-checked", String(b.dataset.lang === ccLang));
      },
      full() {
        if (!fsb) return;
        const on = fs.active();
        fsb.innerHTML = on ? ICON.exit : ICON.full;
        fsb.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
      },
    };
    api.sound();
    api.full();
    api.cc();
    wake();
    return api;
  })();

  // For tests and frame-by-frame capture: window.lessonPlayer.ready.then(() => { pause(); seek(12.5); }).
  let markReady;
  window.lessonPlayer = {
    duration: END,
    ready: new Promise((r) => { markReady = r; }),
    play, pause, seek,
    time: () => state.t,
    score: () => audio.score,
    // The audio graph, for level checks: music and effects reach `out`, the voice `voiceOut`.
    audioGraph: () => ({ ctx: audio.ctx, out: audio.out, voiceOut: audio.voiceOut }),
    voice: () => ({ lines, loaded: !!audio.voiceBuf, playing: !!(audio.session && audio.session.voice) }),
  };

  // ── Boot ───────────────────────────────────────────────────────────────────
  async function boot() {
    if (F.voice && F.voice.src) {
      audio.voiceData = fetch(F.voice.src).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
    }
    try {
      await Promise.all(F.fontChecks.map((f) => document.fonts.load(f)));
    } catch (e) { /* system fonts stand in */ }
    run("shared.js", makeKit(stage, 0, OLD_END));
    for (const sc of scenes) {
      const box = el("div", { class: "fe-scene" });
      stage.append(box);
      const kit = makeKit(box, sc.oldStart, sc.oldDur);
      run("scene-" + sc.id + ".js", kit);
      const def = defs[sc.id];
      if (def && def.init) await def.init.call(def, kit);
      instances.push({ sc, def, box, kit });
    }
    if (modules["score.js"]) run("score.js", makeKit(stage, 0, OLD_END));
    audio.score = recordScore();
    // Wait (briefly) for the images so the first frames do not pop in.
    const imgs = Array.from(stage.querySelectorAll("img"));
    await Promise.race([
      Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; })))),
      new Promise((r) => setTimeout(r, 4000)),
    ]);
    instances.forEach((inst) => { inst.box.style.display = "none"; });
    renderAt(0);
    document.body.classList.add("fe-ready");
    // A parent page that allows autoplay (iframe allow="autoplay" after a click) gets sound
    // straight away; otherwise the first click turns it on.
    if (setupAudio() && audio.ctx.state === "running") { audio.enabled = true; ui.sound(); }
    play();
    requestAnimationFrame(tick);
    markReady();
  }
  boot().catch((e) => {
    document.querySelector(".fe-loading").textContent = "This lesson could not start. Please reload the page.";
    throw e;
  });
})();

</script>
</body>
</html>
