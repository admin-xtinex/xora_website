<script>window.FILM = {"id":"CPB","width":1920,"height":1080,"scenes":[{"id":"title","name":"Checkpoint B","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"how","name":"How it works","dur":19,"k":1,"oldStart":8,"oldDur":19},{"id":"q-candle","name":"Q1 reading a candle","dur":21,"k":1,"oldStart":27,"oldDur":21},{"id":"q-agg","name":"Q2 building a 5-minute candle","dur":21,"k":1,"oldStart":48,"oldDur":21},{"id":"q-fake","name":"Q3 breakout or fakeout","dur":21,"k":1,"oldStart":69,"oldDur":21},{"id":"q-vol","name":"Q4 volume","dur":21,"k":1,"oldStart":90,"oldDur":21},{"id":"q-fees","name":"Q5 scalping costs","dur":21,"k":1,"oldStart":111,"oldDur":21},{"id":"q-wait","name":"Q6 the NO_TRADE decision","dur":21,"k":1,"oldStart":132,"oldDur":21},{"id":"q-size","name":"Q7 position size","dur":21,"k":1,"oldStart":153,"oldDur":21},{"id":"q-after","name":"Q8 after a losing demo trade","dur":21,"k":1,"oldStart":174,"oldDur":21},{"id":"safety","name":"Critical safety","dur":30,"k":1,"oldStart":195,"oldDur":30},{"id":"revisit","name":"Where to revisit","dur":20,"k":1,"oldStart":225,"oldDur":20},{"id":"next","name":"Course complete","dur":14,"k":1,"oldStart":245,"oldDur":14}],"voice":{"src":null,"lines":[{"t":0.6,"d":7.15,"text":"Checkpoint B, the last stop. Let's review Phases 4 and 5: charts, scalping and risk.","ml":"Checkpoint B, അവസാനത്തെ നിർത്തൽ. Phase 4-ഉം 5-ഉം വീണ്ടും നോക്കാം: ചാർട്ടുകൾ, scalping, റിസ്ക്."},{"t":8.4,"d":5.65,"text":"Eight questions on T14 to T23: chart reading, risk maths and demo decisions.","ml":"T14 മുതൽ T23 വരെയുള്ള എട്ട് ചോദ്യങ്ങൾ: ചാർട്ട് വായന, റിസ്ക് കണക്ക്, ഡെമോ തീരുമാനങ്ങൾ."},{"t":14.3,"d":6.15,"text":"Read each question, pick an answer, and pause the video whenever you need more time.","ml":"ഓരോ ചോദ്യവും വായിക്കുക, ഒരു ഉത്തരം തിരഞ്ഞെടുക്കുക. കൂടുതൽ സമയം വേണമെങ്കിൽ എപ്പോൾ വേണമെങ്കിലും വീഡിയോ നിർത്താം."},{"t":20.7,"d":6.05,"text":"Not graded here. The graded Checkpoint B quiz is in the interactive course.","ml":"ഇവിടെ മാർക്കില്ല. മാർക്കുള്ള Checkpoint B ക്വിസ് ഇന്ററാക്ടീവ് കോഴ്സിലുണ്ട്."},{"t":27.3,"d":7.05,"text":"Question one, from T14. Open 60,000, high 60,300, low 59,800, close 60,200. Which is true?","ml":"ഒന്നാം ചോദ്യം, T14-ൽ നിന്ന്. Open 60,000, high 60,300, low 59,800, close 60,200. ഏതാണ് ശരി?"},{"t":34.6,"d":6.35,"text":"A. It's a green, up candle, and the top of its body is the close: 60,200.","ml":"A. ഇത് ഒരു പച്ച, മുകളിലേക്കുള്ള candle ആണ്; body-യുടെ മുകൾഭാഗം close ആണ്: 60,200."},{"t":41.2,"d":6.55,"text":"B mixes up high and close. 60,300 is the top of the wick, the highest price traded.","ml":"B, high-ഉം close-ഉം മാറിപ്പോയി. 60,300 wick-ന്റെ മുകളറ്റമാണ്, ട്രേഡ് ചെയ്ത ഏറ്റവും ഉയർന്ന വില."},{"t":48.3,"d":7.05,"text":"Question two, from T15. Five 1-minute candles become one 5-minute candle. What are its prices?","ml":"രണ്ടാം ചോദ്യം, T15-ൽ നിന്ന്. അഞ്ച് 1-minute candles ചേർന്ന് ഒരു 5-minute candle ആകുന്നു. അതിന്റെ വിലകൾ എന്ത്?"},{"t":55.6,"d":6.35,"text":"A. The first open, the highest high, the lowest low, and the last close.","ml":"A. ആദ്യത്തെ open, ഏറ്റവും ഉയർന്ന high, ഏറ്റവും താഴ്ന്ന low, അവസാനത്തെ close."},{"t":62.2,"d":6.55,"text":"B is tempting, but candles don't average. They keep the real open, high, low and close.","ml":"B ആകർഷകമായി തോന്നും, പക്ഷേ candles ശരാശരി എടുക്കില്ല. യഥാർത്ഥ open, high, low, close തന്നെ സൂക്ഷിക്കും."},{"t":69.3,"d":7.05,"text":"Question three, from T17. Price breaks above resistance, then falls back below within two candles.","ml":"മൂന്നാം ചോദ്യം, T17-ൽ നിന്ന്. വില resistance-ന് മുകളിലേക്ക് കടക്കുന്നു, പിന്നെ രണ്ട് candles-നുള്ളിൽ തിരികെ താഴേക്ക് വീഴുന്നു."},{"t":76.6,"d":6.35,"text":"B. It may be a fakeout. Wait for more evidence. No pattern is certain.","ml":"B. ഇത് ഒരു fakeout ആകാം. കൂടുതൽ തെളിവിനായി wait ചെയ്യുക. ഒരു പാറ്റേണും ഉറപ്പല്ല."},{"t":83.2,"d":6.55,"text":"A is the trap. A break alone is not confirmation, and buying on hope is not a plan.","ml":"A ആണ് കെണി. ഒരു break മാത്രം സ്ഥിരീകരണമല്ല, പ്രതീക്ഷയിൽ buy ചെയ്യുന്നത് ഒരു പ്ലാനുമല്ല."},{"t":90.3,"d":7.05,"text":"Question four, from T18. A big green candle has very high volume. What can you conclude?","ml":"നാലാം ചോദ്യം, T18-ൽ നിന്ന്. ഒരു വലിയ പച്ച candle-ന് വളരെ ഉയർന്ന volume ഉണ്ട്. എന്ത് നിഗമനം ചെയ്യാം?"},{"t":97.6,"d":6.35,"text":"B. A lot was traded. That's one clue, not proof of where price goes next.","ml":"B. ധാരാളം ട്രേഡ് നടന്നു. അത് ഒരു സൂചന മാത്രം, വില അടുത്തത് എങ്ങോട്ട് എന്നതിന്റെ തെളിവല്ല."},{"t":104.2,"d":6.55,"text":"A is tempting, but volume alone never tells you the direction.","ml":"A ആകർഷകമാണ്, പക്ഷേ volume മാത്രം ഒരിക്കലും ദിശ പറഞ്ഞുതരില്ല."},{"t":111.3,"d":7.05,"text":"Question five, from T19. Each scalp makes +0.80 USDT gross, and fees cost 1.00. After 10 trades?","ml":"അഞ്ചാം ചോദ്യം, T19-ൽ നിന്ന്. ഓരോ scalp-ഉം gross +0.80 USDT നേടുന്നു, ഫീസ് 1.00. 10 ട്രേഡുകൾക്ക് ശേഷം?"},{"t":118.6,"d":6.35,"text":"B, minus 2.00 USDT. Each trade nets minus 0.20, and 10 times minus 0.20 is minus 2.00.","ml":"B, മൈനസ് 2.00 USDT. ഓരോ ട്രേഡിലും net മൈനസ് 0.20; 10 തവണ മൈനസ് 0.20 എന്നാൽ മൈനസ് 2.00."},{"t":125.2,"d":6.55,"text":"A forgets the fees. Many small trades mean many fees.","ml":"A ഫീസ് മറന്നു. ഒരുപാട് ചെറിയ ട്രേഡുകൾ എന്നാൽ ഒരുപാട് ഫീസ്."},{"t":132.3,"d":7.05,"text":"Question six, from T20 and T21. Mid-range, flat trend, low volume, no level near. Your decision?","ml":"ആറാം ചോദ്യം, T20-ൽ നിന്നും T21-ൽ നിന്നും. Range-ന്റെ നടുവിൽ, ട്രെൻഡ് പരന്നത്, volume കുറവ്, അടുത്ത് ലെവലില്ല. തീരുമാനം?"},{"t":139.6,"d":6.35,"text":"C, NO_TRADE. Nothing lines up, so waiting is the sensible decision.","ml":"C, NO_TRADE. ഒന്നും ഒത്തുവരുന്നില്ല, അതിനാൽ wait ചെയ്യുന്നതാണ് ബുദ്ധിപരമായ തീരുമാനം."},{"t":146.2,"d":6.55,"text":"A is the trap: one green candle is not a reason to take a risk.","ml":"A ആണ് കെണി: ഒരു പച്ച candle റിസ്ക് എടുക്കാനുള്ള കാരണമല്ല."},{"t":153.3,"d":7.05,"text":"Question seven, from T22. Risk budget 10 USDT. Stop 2% from entry. About what notional?","ml":"ഏഴാം ചോദ്യം, T22-ൽ നിന്ന്. റിസ്ക് ബജറ്റ് 10 USDT. Stop entry-യിൽ നിന്ന് 2% അകലെ. ഏകദേശം എത്ര notional?"},{"t":160.6,"d":6.35,"text":"A, about 500 USDT. 10 divided by 2% is 500.","ml":"A, ഏകദേശം 500 USDT. 10-നെ 2% കൊണ്ട് ഹരിച്ചാൽ 500."},{"t":167.2,"d":6.55,"text":"B uses the whole account. 1,000 times 2% risks 20 USDT, double the budget.","ml":"B മുഴുവൻ അക്കൗണ്ടും ഉപയോഗിക്കുന്നു. 1,000-ന്റെ 2% എന്നാൽ 20 USDT റിസ്ക്, ബജറ്റിന്റെ ഇരട്ടി."},{"t":174.3,"d":7.05,"text":"Question eight, from T23. Your demo stop slipped: minus 6.30 instead of minus 6. What next?","ml":"എട്ടാം ചോദ്യം, T23-ൽ നിന്ന്. നിങ്ങളുടെ ഡെമോ stop slip ആയി: മൈനസ് 6-ന് പകരം മൈനസ് 6.30. ഇനി എന്ത്?"},{"t":181.6,"d":6.35,"text":"B. Journal it, check the process, and take a break. A small slip is normal.","ml":"B. ജേണലിൽ എഴുതുക, പ്രക്രിയ പരിശോധിക്കുക, ഒരു ഇടവേള എടുക്കുക. ചെറിയ slip സാധാരണമാണ്."},{"t":188.2,"d":6.55,"text":"A is revenge trading. Doubling the size doubles the risk.","ml":"A പ്രതികാര ട്രേഡിങ്ങാണ്. Size ഇരട്ടിയാക്കിയാൽ റിസ്കും ഇരട്ടിയാകും."},{"t":195.4,"d":3.45,"text":"Before you finish: critical safety.","ml":"അവസാനിക്കുന്നതിന് മുമ്പ്: നിർണായക സുരക്ഷ."},{"t":199.1,"d":6.25,"text":"Leverage magnifies losses. No leverage is safe, and liquidation can take your margin.","ml":"Leverage നഷ്ടങ്ങൾ വലുതാക്കും. ഒരു leverage-ഉം സുരക്ഷിതമല്ല, liquidation നിങ്ങളുടെ margin എടുത്തേക്കാം."},{"t":205.6,"d":5.05,"text":"A stop-loss is a trigger, not a promise. Gaps and slippage happen.","ml":"Stop-loss ഒരു ട്രിഗർ ആണ്, വാഗ്ദാനമല്ല. വിടവുകളും slippage-ഉം സംഭവിക്കും."},{"t":210.9,"d":6.25,"text":"Never share passwords, OTP or 2FA codes, or API secret keys. Not even with 'support'.","ml":"പാസ്‌വേഡ്, OTP, 2FA കോഡുകൾ, API secret keys ഒരിക്കലും പങ്കുവെക്കരുത്. 'support'-നോട് പോലും."},{"t":217.4,"d":7.35,"text":"Size from your risk budget first. When signals are unclear, NO_TRADE is a real decision.","ml":"ആദ്യം റിസ്ക് ബജറ്റിൽ നിന്ന് size കണക്കാക്കുക. സിഗ്നലുകൾ വ്യക്തമല്ലെങ്കിൽ, NO_TRADE ഒരു യഥാർത്ഥ തീരുമാനമാണ്."},{"t":225.4,"d":3.15,"text":"Here's where to look if you missed one.","ml":"ഏതെങ്കിലും തെറ്റിയെങ്കിൽ എവിടെ നോക്കണം എന്ന് ഇതാ."},{"t":228.8,"d":4.15,"text":"One: T14. Two: T15. Three: T16 and T17. Four: T18.","ml":"ഒന്ന്: T14. രണ്ട്: T15. മൂന്ന്: T16-ഉം T17-ഉം. നാല്: T18."},{"t":233.2,"d":4.15,"text":"Five: T19. Six: T20 and T21. Seven: T22. Eight: T23.","ml":"അഞ്ച്: T19. ആറ്: T20-ഉം T21-ഉം. ഏഴ്: T22. എട്ട്: T23."},{"t":237.6,"d":7.15,"text":"Rewatch any lesson, no penalty. Risk sizing and NO_TRADE deserve a second look.","ml":"ഏത് പാഠവും വീണ്ടും കാണാം, പിഴയില്ല. റിസ്ക് sizing-ഉം NO_TRADE-ഉം ഒന്നുകൂടി നോക്കുന്നത് നല്ലതാണ്."},{"t":245.6,"d":5.15,"text":"That's the whole course. Congratulations on finishing every lesson!","ml":"കോഴ്സ് മുഴുവനായി. എല്ലാ പാഠങ്ങളും പൂർത്തിയാക്കിയതിന് അഭിനന്ദനങ്ങൾ!"},{"t":251,"d":7.75,"text":"Finishing is not certification or permission to trade. Keep practising in demo mode.","ml":"പൂർത്തിയാക്കിയത് ഒരു സർട്ടിഫിക്കേഷനോ ട്രേഡ് ചെയ്യാനുള്ള അനുമതിയോ അല്ല. ഡെമോ മോഡിൽ പരിശീലനം തുടരുക."}]},"assetBase":"CPB/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-hi.webp":{"mime":"image/webp","w":518,"h":594},"tutor-writing.webp":{"mime":"image/webp","w":191,"h":169},"tutor-laptop.webp":{"mime":"image/webp","w":185,"h":170}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"CPB on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Checkpoint B, the last stop. Let's review Phases 4 and 5: charts, scalping and risk.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"Eight questions on T14 to T23: chart reading, risk maths and demo decisions.\"\n    },\n    {\n      \"t\": 14.3,\n      \"text\": \"Read each question, pick an answer, and pause the video whenever you need more time.\"\n    },\n    {\n      \"t\": 20.7,\n      \"text\": \"Not graded here. The graded Checkpoint B quiz is in the interactive course.\"\n    },\n    {\n      \"t\": 27.3,\n      \"text\": \"Question one, from T14. Open 60,000, high 60,300, low 59,800, close 60,200. Which is true?\"\n    },\n    {\n      \"t\": 34.6,\n      \"text\": \"A. It's a green, up candle, and the top of its body is the close: 60,200.\"\n    },\n    {\n      \"t\": 41.2,\n      \"text\": \"B mixes up high and close. 60,300 is the top of the wick, the highest price traded.\"\n    },\n    {\n      \"t\": 48.3,\n      \"text\": \"Question two, from T15. Five 1-minute candles become one 5-minute candle. What are its prices?\"\n    },\n    {\n      \"t\": 55.6,\n      \"text\": \"A. The first open, the highest high, the lowest low, and the last close.\"\n    },\n    {\n      \"t\": 62.2,\n      \"text\": \"B is tempting, but candles don't average. They keep the real open, high, low and close.\"\n    },\n    {\n      \"t\": 69.3,\n      \"text\": \"Question three, from T17. Price breaks above resistance, then falls back below within two candles.\"\n    },\n    {\n      \"t\": 76.6,\n      \"text\": \"B. It may be a fakeout. Wait for more evidence. No pattern is certain.\"\n    },\n    {\n      \"t\": 83.2,\n      \"text\": \"A is the trap. A break alone is not confirmation, and buying on hope is not a plan.\"\n    },\n    {\n      \"t\": 90.3,\n      \"text\": \"Question four, from T18. A big green candle has very high volume. What can you conclude?\"\n    },\n    {\n      \"t\": 97.6,\n      \"text\": \"B. A lot was traded. That's one clue, not proof of where price goes next.\"\n    },\n    {\n      \"t\": 104.2,\n      \"text\": \"A is tempting, but volume alone never tells you the direction.\"\n    },\n    {\n      \"t\": 111.3,\n      \"text\": \"Question five, from T19. Each scalp makes +0.80 USDT gross, and fees cost 1.00. After 10 trades?\"\n    },\n    {\n      \"t\": 118.6,\n      \"text\": \"B, minus 2.00 USDT. Each trade nets minus 0.20, and 10 times minus 0.20 is minus 2.00.\"\n    },\n    {\n      \"t\": 125.2,\n      \"text\": \"A forgets the fees. Many small trades mean many fees.\"\n    },\n    {\n      \"t\": 132.3,\n      \"text\": \"Question six, from T20 and T21. Mid-range, flat trend, low volume, no level near. Your decision?\"\n    },\n    {\n      \"t\": 139.6,\n      \"text\": \"C, NO_TRADE. Nothing lines up, so waiting is the sensible decision.\"\n    },\n    {\n      \"t\": 146.2,\n      \"text\": \"A is the trap: one green candle is not a reason to take a risk.\"\n    },\n    {\n      \"t\": 153.3,\n      \"text\": \"Question seven, from T22. Risk budget 10 USDT. Stop 2% from entry. About what notional?\"\n    },\n    {\n      \"t\": 160.6,\n      \"text\": \"A, about 500 USDT. 10 divided by 2% is 500.\"\n    },\n    {\n      \"t\": 167.2,\n      \"text\": \"B uses the whole account. 1,000 times 2% risks 20 USDT, double the budget.\"\n    },\n    {\n      \"t\": 174.3,\n      \"text\": \"Question eight, from T23. Your demo stop slipped: minus 6.30 instead of minus 6. What next?\"\n    },\n    {\n      \"t\": 181.6,\n      \"text\": \"B. Journal it, check the process, and take a break. A small slip is normal.\"\n    },\n    {\n      \"t\": 188.2,\n      \"text\": \"A is revenge trading. Doubling the size doubles the risk.\"\n    },\n    {\n      \"t\": 195.4,\n      \"text\": \"Before you finish: critical safety.\"\n    },\n    {\n      \"t\": 199.1,\n      \"text\": \"Leverage magnifies losses. No leverage is safe, and liquidation can take your margin.\"\n    },\n    {\n      \"t\": 205.6,\n      \"text\": \"A stop-loss is a trigger, not a promise. Gaps and slippage happen.\"\n    },\n    {\n      \"t\": 210.9,\n      \"text\": \"Never share passwords, OTP or 2FA codes, or API secret keys. Not even with 'support'.\"\n    },\n    {\n      \"t\": 217.4,\n      \"text\": \"Size from your risk budget first. When signals are unclear, NO_TRADE is a real decision.\"\n    },\n    {\n      \"t\": 225.4,\n      \"text\": \"Here's where to look if you missed one.\"\n    },\n    {\n      \"t\": 228.8,\n      \"text\": \"One: T14. Two: T15. Three: T16 and T17. Four: T18.\"\n    },\n    {\n      \"t\": 233.2,\n      \"text\": \"Five: T19. Six: T20 and T21. Seven: T22. Eight: T23.\"\n    },\n    {\n      \"t\": 237.6,\n      \"text\": \"Rewatch any lesson, no penalty. Risk sizing and NO_TRADE deserve a second look.\"\n    },\n    {\n      \"t\": 245.6,\n      \"text\": \"That's the whole course. Congratulations on finishing every lesson!\"\n    },\n    {\n      \"t\": 251.0,\n      \"text\": \"Finishing is not certification or permission to trade. Keep practising in demo mode.\"\n    }\n  ]\n}","scene-how.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst HOW = [\n  ['Read the question', '<rect x=\"14\" y=\"18\" width=\"60\" height=\"8\" rx=\"4\"/><rect x=\"14\" y=\"38\" width=\"48\" height=\"8\" rx=\"4\"/><rect x=\"14\" y=\"58\" width=\"54\" height=\"8\" rx= .tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'calm' }, { t: 0.6, pose: 'checklist' }, { t: 8.2, pose: 'point' }, { t: 12.6, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.s, t, 12.6, { stagger: 0.08 });\n    this.rows.forEach((s, i) => {\n      const a = REV[i][3], p = seg(t, a, a + 0.6), hi = Math.sin(Math.PI * seg(t, a + 0.4, a + 1.6));\n      s.opacity = eo(seg(t, a, a + 0.3));\n      s.transform = 'translateX(' + lerp(36, 0, eo(p)).toFixed(1) + 'px)';\n      s.borderColor = 'color-mix(in srgb, var(--main) ' + (22 + 60 * hi).toFixed(0) + '%, transparent)';\n      if (i >= 4) s.background = 'color-mix(in srgb, var(--ground) 82%, var(--accent))';\n    });\n    this.tutor.render(t);\n  },\n});\n","scene-safety.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst SAFE = [\n  ['Leverage and liquidation', 'Leverage magnifies losses. No leverage is safe, and liquidation can take your margin.', 4.1],\n  ['Stops have limits', 'A stop-loss is a trigger, not a promise. Gaps and slippage happen.', 10.6],\n  ['Guard your account', 'Never share passwords, OTP or 2FA codes, or API secret keys. Not even with “support”.', 15.9],\n  ['Size first, NO_TRADE allowed', 'Size from your risk budget first. When signals are unclear, NO_TRADE is a real decision.', 22.4],\n];\nkit.scene('safety', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let cards = '';\n    SAFE.forEach((r, i) => {\n      cards += '<div class=\"glass sf-c\" style=\"left:' + (140 + (i % 2) * 780) + 'px;top:' + (340 + Math.floor(i / 2) * 218) + 'px;width:750px;min-height:196px;padding:24px 34px\">' +\n        '<p class=\"kick\" style=\"margin:0 0 10px;color:var(--accent)\">' + r[0] + '</p><p style=\"margin:0;font-size:30px;line-height:1.4;font-weight:600\">' + r[1] + '</p></div>';\n    });\n    kit. n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.ti-k').style; this.t = q('.ti-t'); this.r = q('.ti-r').style; this.s = q('.ti-s').style;\n    this.ring = q('.ti-ring'); this.ticks = q('.ti-ticks'); this.tick = q('.ti-tick');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: 2080, y: C.y, s: C.s }, { t: 2.6, x: C.x, y: C.y, s: C.s, d: 1.9, ease: (p) => kit.lerp(p, kit.eo(p), 0.5) }],\n      poses: [{ t: 0, pose: 'walk', flip: true }, { t: 2.6, pose: 'hi' }, { t: 5.4, pose: 'present' }],\n      says: [{ t0: 2.9, t1: 7.4, text: 'Last review!' }],\n    });\n  },\n  render(t) {\n    this.k.opacity = eo(seg(t, -0.6, -0.1));\n    TextFx.fadeFromRight(this.t, t, -0.9);\n    this.r.transformOrigin = '0 50%';\n    this.r.transform = 'scaleX(' + eo(seg(t, 0.2, 0.9)) + ')';\n    this.s.opacity = eo(seg(t, 0.6, 1.1));\n    const c = seg(t, -0.6, 0.6);\n    this.ring.setAttribute('transform', 'translate(1340 ' + (470 - t * 2).toFixed(1) + ') scale(' + (lerp(0.9, 1, eob(c, 1.6)) * (1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.2))).toFixed(4) + ')');\n    this.ring.style.opacity = eo(c);\n    this.ticks.setAttribute('transform', 'rotate(' + (t * 6).toFixed(2) + ')');\n    const k = seg(t, 1.0, 1.8);\n    this.tick.setAttribute('stroke-dasharray', eio(k).toFixed(3) + ' 1'); this.tick.style.opacity = k > 0 ? 1 : 0;\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Checkpoint B\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 5 final checkpoint CPB, review of T14 to T23; a ring with a shield draws in; the tutor walks in.\"\n    },\n    {\n      \"id\": \"how\",\n      \"name\": \"How it works\",\n      \"dur\": 19,\n      \"desc\": \"Eight questions from T14 to T23: read, pause, pick, countdown, see why. Not graded here; the graded quiz is in the interactive course.\"\n    },\n    {\n      \"id\": \"q-candle\",\n      \"name\": \"Q1 reading a candle\",\n      \"dur\": 21,\n      \"desc\": \"T14: open 60,000, high 60,300, low 59,800, close 60,200: a green candle whose body top is the close; 60,300 is the wick top.\"\n    },\n    {\n      \"id\": \"q-agg\",\n      \"name\": \"Q2 building a 5-minute candle\",\n      \"dur\": 21,\n      \"desc\": \"T15: five 1-minute candles become one 5-minute candle: first open, highest high, lowest low, last close; never an average.\"\n    },\n    {\n      \"id\": \"q-fake\",\n      \"name\": \"Q3 breakout or fakeout\",\n      \"dur\": 21,\n      \"desc\": \"T16/T17: price breaks above resistance and falls back within two candles: a possible fakeout, wait for evidence.\"\n    },\n    {\n      \"id\": \"q-vol\",\n      \"name\": \"Q4 volume\",\n      \"dur\": 21,\n      \"desc\": \"T18: a big green candle on high volume is one clue, not proof of direction; two possible next paths.\"\n    },\n    {\n      \"id\": \"q-fees\",\n      \"name\": \"Q5 scalping costs\",\n      \"dur\": 21,\n      \"desc\": \"T19: +0.80 gross and 1.00 fees per trade; ten trades net -2.00 USDT.\"\n    },\n    {\n      \"id\": \"q-wait\",\n      \"name\": \"Q6 the NO_TRADE decision\",\n      \"dur\": 21,\n      \"desc\": \"T20/T21: mid-range, flat trend, low volume, no level near: NO_TRADE; one green candle is not a reason.\"\n    },\n    {\n      \"id\": \"q-size\",\n      \"name\": \"Q7 position size\",\n      \"dur\": 21,\n      \"desc\": \"T22: risk budget 10 USDT, stop 2% away: notional 10 / 2% = 500 USDT; 1,000 would risk 20.\"\n    },\n    {\n      \"id\": \"q-after\",\n      \"name\": \"Q8 after a losing demo trade\",\n      \"dur\": 21,\n      \"desc\": \"T23: the stop slipped to -6.30 against -6 planned: journal it, check the process, take a break; no revenge trading.\"\n    },\n    {\n      \"id\": \"safety\",\n      \"name\": \"Critical safety\",\n      \"dur\": 30,\n      \"desc\": \"Leverage and liquidation, stops are triggers not promises, never share codes or keys, NO_TRADE and sizing from a risk budget.\"\n    },\n    {\n      \"id\": \"revisit\",\n      \"name\": \"Where to revisit\",\n      \"dur\": 20,\n      \"desc\": \"Which lesson each question came from; rewatch with no penalty.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Course complete\",\n      \"dur\": 14,\n      \"desc\": \"End card: congratulations on finishing; not a certification or permission to trade; keep practising in demo mode; XTINEX | XORA lockup.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // No voice: the music is the only sound. A soft bed: pad and keys, a light pulse while the questions run, quieter for safety.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T['q-candle'], T.safety);\n  const quiet = (s) => inR(s, T.safety, T.revisit);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 30 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 46 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  S.fx('pop', T.title + 2.9, { vel: 26, pitch: 7 }); S.fx('chime', T.title + 1.4, { vel: 30 });\n  for (let i = 0; i < 4; i++) S.fx('pop', T.how + 2.6 + i * 0.35, { vel: 26, pitch: 5 });\n  [6.3, 7.7, 9.1, 11.9].forEach((a) => S.fx('tick', T.how + a, { vel: 30 }));\n  for (let i = 0; i < 3; i++) S.fx('pop', T.how + 12.9 + i * 0.4, { vel: 30, pitch: 7 });\n  ['q-candle', 'q-agg', 'q-fake', 'q-vol', 'q-fees', 'q-wait', 'q-size', 'q-after'].forEach((id) => {\n    const s = T[id];\n    S.fx('whoosh', s + 0.1, { dur: 0.8, vel: 18 });\n    for (let i = 0; i < 4; i++) S.fx('pop', s + 1.2 + i * 0.25, { vel: 24, pitch: 4 + i });\n    for (let i = 0; i < 5; i++) S.fx('tick', s + 2.5 + i, { vel: 28 });\n    S.fx('chime', s + 7.6, { vel: 40 });\n    S.fx('ding', s + 7.9, { vel: 30 });\n    S.fx('thud', s + 14.3, { vel: 24 });\n  });\n  S.fx('whoosh', T['q-fake'] + 1.6, { dur: 2.4, vel: 18 }); S.fx('thud', T['q-fake'] + 4.9, { vel: 22 });\n  for (let i = 0; i < 10; i++) S.fx('tick', T['q-fees'] + 3.6 + i * 0.3, { vel: 18 });\n  S.fx('ding', T['q-size'] + 8.6, { vel: 26 }); S.fx('pop', T['q-wait'] + 7.9, { vel: 30, pitch: 7 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T['q-agg'] + 1.6 + i * 0.35, { vel: 16 });\n  [4.1, 10.6, 15.9, 22.4].forEach((a) => S.fx('pop', T.safety + a, { vel: 30 }));\n  [3.8, 5.4, 6.8, 7.8, 8.2, 10.6].forEach((a) => S.fx('pop', T.revisit + a, { vel: 32, pitch: 7 }));\n  S.fx('ding', T.revisit + 12.6, { vel: 34 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 13, vel: 40 });\n  [6.2, 6.8, 7.4].forEach((a, i) => S.fx('pop', T.next + a, { vel: 30, pitch: 5 + i * 2 }));\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 12, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 21.5, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'CPB · Checkpoint B',\n  TOTAL: 259,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  // Checkpoint question. cfg: n, from, q (headline), opts[4], ok (right index), bad (tempting wrong index), why, whyNot,\n  // vis (HTML inside the visual panel), R (answer revealed), N (why-not shown). Returns render(t) for the shared parts.\n  quiz(kit, cfg) {\n    const L = 'ABCD', R = cfg.R || 7.6, N = cfg.N || 14.2;\n    let rows = '';\n    cfg.opts.forEach((o, i) => {\n      const mark = i === cfg.ok ? '<path class=\"qz-ok\" d=\"M10 23 L19 32 L35 13\" pathLength=\"1\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--main)\"/>'\n        : i === cfg.bad ? '<path class=\"qz-no\" d=\"M13 13 L31 31 M31 13 L13 31\" pathLength=\"1\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"stroke:var(--accent)\"/>' : '';\n      rows += '<div class=\"qz-o\" style=\"display:flex;align-items:center;gap:22px;padding:13px 22px;border-radius:20px;border:2px solid color-mix(in srgb, var(--second) 14%, transparent);background:color-mix(in srgb, var(--ground) 90%, var(--main))\">' +\n        '<span class=\"qz-l mono\" style=\"width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:26px;border:2px solid color-mix(in srgb, var(--main) 45%, transparent)\">' + L[i] + '</span>' +\n        '<span style=\"font-size:30px;font-weight:600;line-height:1.3;flex:1\">' + o + '</span>' +\n        '<svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" style=\"flex:none\">' + mark + '</svg></div>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:150px;width:1010px;gap:20px\"><p class=\"kick qz-k\">Question ' + cfg.n + ' of 8 · from ' + cfg.from + '</p>' +\n      '<h2 class=\"line qz-t\" style=\"font-size:64px\">' + cfg.q + '</h2>' +\n      '<div style=\"margin-top:14px;display:flex;flex-direction:column;gap:14px\">' + rows + '</div></div>' +\n      '<div class=\"glass qz-vis\" style=\"left:1220px;top:150px;width:560px;height:340px\">' + cfg.vis + '</div>' +\n      '<div class=\"glass qz-why\" style=\"left:1220px;top:508px;width:560px;padding:18px 28px;display:flex;flex-direction:column;gap:14px\">' +\n      '<div><p class=\"kick\" style=\"margin:0 0 4px\">Why ' + L[cfg.ok] + '</p><p style=\"margin:0;font-size:28px;line-height:1.32;font-weight:600\">' + cfg.why + '</p></div>' +\n      '<div class=\"qz-w2\"><p class=\"kick\" style=\"margin:0 0 4px;color:var(--accent)\">Why not ' + L[cfg.bad] + '</p><p style=\"margin:0;font-size:28px;line-height:1.32;font-weight:600\">' + cfg.whyNot + '</p></div></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    const k = q('.qz-k').style, head = q('.qz-t'), vis = q('.qz-vis').style, why = q('.qz-why').style, w2 = q('.qz-w2').style;\n    const os = all('.qz-o').map((e) => e.style), ls = all('.qz-l').map((e) => e.style), ok = q('.qz-ok'), no = q('.qz-no');\n    const ring = UI.ring(kit, 1500, 650, 80, 2.1, 2.5, 5, R + 0.3, 'Pause to think');\n    const C = UI.CORNER;\n    const tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: cfg.poses || [{ t: 0, pose: 'explain' }, { t: 0.5, pose: 'read' }, { t: 2.5, pose: 'think' }, { t: R, pose: 'cheer' }, { t: R + 2.2, pose: 'explain' }, { t: N, pose: 'magnify' }],\n      says: cfg.says || [],\n    });\n    const { seg, eo, ei, eob, lerp, TextFx } = kit;\n    const mix = (c, p, base) => 'color-mix(in srgb, ' + c + ' ' + (base + (100 - base) * p).toFixed(0) + '%, transparent)';\n    return (t) => {\n      k.opacity = eo(seg(t, 0, 0.5));\n      TextFx.fadeFromRight(head, t, 0.1, { stagger: 0.06 });\n      const vp = seg(t, 0.7, 1.4);\n      vis.opacity = eo(vp); vis.transform = 'translateY(' + lerp(30, 0, eo(vp)).toFixed(1) + 'px)';\n      const rv = eo(seg(t, R, R + 0.5)), nb = eo(seg(t, N, N + 0.5));\n      os.forEach((s, i) => {\n        const a = 1.2 + i * 0.25, p = eo(seg(t, a, a + 0.5)), good = i === cfg.ok, tempt = i === cfg.bad;\n        const dim = good ? 1 : tempt ? lerp(lerp(1, 0.5, rv), 1, nb) : lerp(1, 0.4, rv);\n        s.opacity = (eo(seg(t, a, a + 0.3)) * dim).toFixed(3);\n        s.transform = 'translateX(' + lerp(30, 0, p).toFixed(1) + 'px) scale(' + (good ? lerp(1, 1.025, Math.sin(Math.PI * seg(t, R, R + 0.7)) * 0.6 + rv * 0.4) : 1).toFixed(4) + ')';\n        s.transformOrigin = '0 50%';\n        if (good) { s.borderColor = mix('var(--main)', rv, 14); s.background = 'color-mix(in srgb, var(--ground) ' + lerp(90, 74, rv).toFixed(0) + '%, var(--main))'; ls[i].background = rv > 0.5 ? 'var(--main)' : 'transparent'; ls[i].color = rv > 0.5 ? 'var(--ground)' : 'var(--second)'; }\n        if (tempt) s.borderColor = nb > 0 ? mix('var(--accent)', nb, 14) : mix('var(--second)', 0, 14);\n      });\n      const po = seg(t, R + 0.2, R + 0.7), pn = seg(t, N + 0.1, N + 0.6);\n      ok.setAttribute('stroke-dasharray', eo(po).toFixed(3) + ' 1'); ok.style.opacity = po > 0 ? 1 : 0;\n      no.setAttribute('stroke-dasharray', eo(pn).toFixed(3) + ' 1'); no.style.opacity = pn > 0 ? 1 : 0;\n      const wp = seg(t, R + 0.3, R + 0.9);\n      why.opacity = eo(wp); why.transform = 'translateY(' + lerp(24, 0, eo(wp)).toFixed(1) + 'px)';\n      w2.opacity = nb; w2.transform = 'translateX(' + lerp(20, 0, nb).toFixed(1) + 'px)';\n      ring(t);\n      tutor.render(t);\n    };\n  },\n  // ── Candle helpers (T14) ──\n  // n SVG candles: html to place inside an <svg>; set(i, c) draws candle i with\n  // c = {x, w, o, h, l, c, y: price → y, op?, live?, col?}. Up (close ≥ open) is --up, down is --down.\n  cdl(kit, cls, n) {\n    let html = '';\n    for (let i = 0; i < n; i++) html += '<g class=\"' + cls + '\"><line class=\"' + cls + '-w\" stroke-linecap=\"r kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n};\n","tutor.json":"{\n  \"wv1\": {\n    \"w\": 381,\n    \"h\": 448,\n    \"ax\": 163.5,\n    \"feet\": 434,\n    \"bw\": 305\n  },\n  \"wv2\": {\n    \"w\": 374,\n    \"h\": 448,\n    \"ax\": 165.0,\n    \"feet\": 436,\n    \"bw\": 305\n  },\n  \"wv3\": {\n    \"w\": 363,\n    \"h\": 448,\n    \"ax\": 166.0,\n    \"feet\": 431,\n    \"bw\": 305\n  },\n  \"wv4\": {\n    \"w\": 375,\n    \"h\": 446,\n    \"ax\": 166.0,\n    \"feet\": 431,\n    \"bw\": 305\n  },\n  \"wk0\": {\n    \"w\": 353,\n    \"h\": 460,\n    \"ax\": 162.5,\n    \"feet\": 446,\n    \"bw\": 310\n  },\n  \"wk1\": {\n    \"w\": 361,\n    \"h\": 460,\n    \"ax\": 164.5,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk2\": {\n    \"w\": 345,\n    \"h\": 460,\n    \"ax\": 170.5,\n    \"feet\": 448,\n    \"bw\": 310\n  },\n  \"wk3\": {\n    \"w\": 365,\n    \"h\": 460,\n    \"ax\": 164.0,\n    \"feet\": 446,\n    \"bw\": 310\n  },\n  \"wk4\": {\n    \"w\": 375,\n    \"h\": 457,\n    \"ax\": 167.5,\n    \"feet\": 444,\n    \"bw\": 310\n  },\n  \"wk5\": {\n    \"w\": 364,\n    \"h\": 457,\n    \"ax\": 167.0,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk6\": {\n    \"w\": 354,\n    \"h\": 457,\n    \"ax\": 166.5,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk7\": {\n    \"w\": 365,\n    \"h\": 457,\n    \"ax\": 1 <script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *
 * build-lesson.mjs inlines this file into public/futures-edge/lessons/<id>.html, after a
 * `window.FILM = {...}` block that carries the scene list, module texts and asset paths.
 */
(function () {
  "use strict";

  const F = window.FILM;
  const W = F.width;
  const H = F.height;

  // ── Maths and easing ───────────────────────────────────────────────────────
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clamp01 = (x) => clamp(x, 0, 1);
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a)));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const ei = (x) => Math.pow(clamp01(x), 3);
  const eio = (x) => {
    x = clamp01(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  };
  const eob = (x, s = 1.4) => {
    x = clamp01(x);
    return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  };
  const rng = (seed) => {
    let a = seed >>> 0 || 1;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const breathe = (t, amt = 0.012, period = 3.2) => 1 + amt * Math.sin((2 * Math.PI * t) / period);

  // ── DOM helpers ────────────────────────────────────────────────────────────
  const h = (html) => {
    const tpl = document.createElement("template");
    tpl.innerHTML = String(html).trim();
    return tpl.content.firstElementChild;
  };
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const el = (tag, o = {}, children = []) => {
    const e = document.createElement(tag);
    if (o.class) e.className = o.class;
    if (o.style) e.setAttribute("style", o.style);
    if (o.text != null) e.textContent = o.text;
    if (o.html != null) e.innerHTML = o.html;
    for (const [k, v] of Object.entries(o.attrs || {})) e.setAttribute(k, v);
    for (const c of children) e.append(c);
    return e;
  };

  // Words of an element as inline-block spans (inline markup such as <b> is kept).
  const wordCache = new WeakMap();
  function words(root) {
    let list = wordCache.get(root);
    if (list) return list;
    list = [];
    const walk = (node) => {
      for (const child of Array.from(node.childNodes)) {
        if (child.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const part of child.textContent.split(/(\s+)/)) {
            if (!part) continue;
            if (/^\s+$/.test(part)) {
              frag.append(document.createTextNode(part));
            } else {
              const s = document.createElement("span");
              s.textContent = part;
              s.style.display = "inline-block";
              frag.append(s);
              list.push(s);
            }
          }
          node.replaceChild(frag, child);
        } else if (child.nodeType === 1) {
          walk(child);
        }
      }
    };
    walk(root);
    wordCache.set(root, list);
    return list;
  }

    fadeFromRight(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.11, d = o.dur ?? 0.5, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = eo(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = p;
        s.style.transform = "translateX(" + ((1 - p) * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
    fadeOutLeft(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.04, d = o.dur ?? 0.35, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = ei(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = 1 - p;
        s.style.transform = "translateX(" + (-p * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
  };

  // ── The kit the scene modules use ──────────────────────────────────────────
  const modules = F.modules;
  const jsonCache = {};
  const assets = {
    url: (name) => F.assetBase + name,
    has: (name) => Object.prototype.hasOwnProperty.call(F.assets, name),
    list: () => Object.keys(F.assets),
  };
  const defs = {};
  let scoreFn = null;

  // start/dur: the scene in the played timeline; oldStart/oldDur: as authored (k = dur / oldDur).
  let acc = 0;
  const scenes = F.scenes.map((s) => {
    const o = Object.assign({ k: 1, oldStart: acc, oldDur: s.dur }, s, { start: acc });
    acc += s.dur;
    return o;
  });
  const END = acc;
  const OLD_END = scenes.reduce((a, s) => a + s.oldDur, 0);
  // Authored time to played time.
  function warp(x) {
    for (let i = scenes.length - 1; i >= 0; i--) {
      const s = scenes[i];
      if (x >= s.oldStart) return s.start + (x - s.oldStart) * s.k;
    }

  }

  const lines = (F.voice && F.voice.lines) || [];
  // Voice language for lessons recorded in English and Malayalam (F.voice.srcMl): English unless the viewer chose Malayalam.
  let voiceLang = "en";
  try { if (localStorage.getItem("fe-voice-lang") === "ml") voiceLang = "ml"; } catch (e) { /* English */ }
  // Stretches where the music dips under the voice: each line plus a little either side, close ones joined.
  const duckSpans = [];
  if (F.voice && F.voice.src) for (const l of lines) {
    const a = l.t - 0.15, b = l.t + l.d + 0.25, last = duckSpans[duckSpans.length - 1];
    if (last && a - last[1] < 1.2) last[1] = b; else duckSpans.push([a, b]);
  }

  function makeKit(box, start, dur) {
    return {
      stage: box, start, dur, W, H,
      seg, lerp, eo, ei, eio, eob, clamp, clamp01, rng, breathe, TextFx, h, el, esc,
      assets,
      module: (n) => (n in modules ? modules[n] : null),
      json: (n) => (jsonCache[n] ??= JSON.parse(modules[n])),
      modules: () => Object.keys(modules),
      scene: (id, def) => { defs[id] = def; },
      score: (fn) => { scoreFn = fn; },
    };
  }
  const run = (name, kit) => new Function("kit", modules[name] + "\n//# sourceURL=" + F.id + "/" + name)(kit);

  // ── Stage ──────────────────────────────────────────────────────────────────
  const stage = document.getElementById("stage");
  const css = document.createElement("style");
  css.textContent = modules["base.css"] || "";
  document.head.append(css);

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 200));
  fit();

  // ── Audio: score.js recorded as events, then synthesised with WebAudio ─────
  function midiOf(p) {
    if (typeof p === "number") return p;
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(p).trim());
    if (!m) return 72;
    const base = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[m[1].toLowerCase()];
    return 12 * (Number(m[3]) + 1) + base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  }

  // score.js runs twice: the music against the played timeline, the sound effects against the
  // authored one and then moved onto the played one, so each cue stays with its animation.
  function recordScore() {
    const T = { END };
    for (const s of scenes) T[s.id] = s.start;
    const music = recordPass(T);
    const Told = { END: OLD_END };
    for (const s of scenes) Told[s.id] = s.oldStart;
    const cues = recordPass(Told);
    const ev = music.ev.filter((e) => e.k !== "f");
    for (const e of cues.ev) {
      if (e.k !== "f") continue;
      e.t = warp(e.t);
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      ev.push(e);
    }
    ev.sort((a, b) => a.s - b.s);
    return { ev, tracks: music.tracks, master: music.master };
  }

  function recordPass(T) {
    const ev = [];
    const tracks = {};
    const master = { gain: -6, music: 0, fadeOut: 1 };
    let B = 0.5, t0 = 0;
    const at = (o) => (o.t != null ? o.t : t0 + (o.beat || 0) * B);
    const len = (o, d) => (o.dur != null ? o.dur : o.beats != null ? o.beats * B : d);
    const push = (e) => {
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      if (e.s < -0.1) return;
      if (e.s < 0) { e.t += -e.s; e.s = 0; }
      ev.push(e);
    };
    const hits = (str, rep, step, from, vel, fn) => {
      for (let r = 0; r < rep; r++) {
        for (let i = 0; i < str.length; i++) {
          const c = str[i];
          if (c !== "x" && c !== "X" && c !== "o") continue;

        }
