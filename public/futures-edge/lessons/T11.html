<script>window.FILM = {"id":"T11","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson eleven","dur":9,"k":1,"oldStart":0,"oldDur":9},{"id":"hook","name":"Two traders","dur":16,"k":1,"oldStart":9,"oldDur":16},{"id":"spot","name":"Spot: you own it","dur":17.5,"k":1,"oldStart":25,"oldDur":17.5},{"id":"futures","name":"Futures: a contract","dur":20,"k":1,"oldStart":42.5,"oldDur":20},{"id":"perp","name":"Perpetual","dur":18.5,"k":1,"oldStart":62.5,"oldDur":18.5},{"id":"exposure","name":"Exposure","dur":16.5,"k":1,"oldStart":81,"oldDur":16.5},{"id":"side","name":"Side by side","dur":21,"k":1,"oldStart":97.5,"oldDur":21},{"id":"short","name":"Going short","dur":17,"k":1,"oldStart":118.5,"oldDur":17},{"id":"mistake","name":"No coin to withdraw","dur":17,"k":1,"oldStart":135.5,"oldDur":17},{"id":"extra","name":"Extra futures risks","dur":23.5,"k":1,"oldStart":152.5,"oldDur":23.5},{"id":"try","name":"Sort them","dur":22,"k":1,"oldStart":176,"oldDur":22},{"id":"compare","name":"The whole picture","dur":20,"k":1,"oldStart":198,"oldDur":20},{"id":"risks","name":"Know the risks","dur":20.5,"k":1,"oldStart":218,"oldDur":20.5},{"id":"recap","name":"Recap","dur":24.5,"k":1,"oldStart":238.5,"oldDur":24.5},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":263,"oldDur":10}],"voice":{"src":null,"lines":[{"t":0.6,"d":8.15,"text":"Lesson eleven: spot versus futures. What do you really own when you trade?"},{"t":9.6,"d":5.75,"text":"Asha and Rahul both think BTC might rise. Both trade 0.010 BTC at 60,000."},{"t":15.6,"d":4.35,"text":"Asha buys on spot. Rahul opens a long futures position."},{"t":20.2,"d":4.55,"text":"If BTC rises, both gain. So what's the difference?"},{"t":25.6,"d":5.65,"text":"Spot means buying the actual asset, paid in full, and it's yours right away."},{"t":31.5,"d":5.25,"text":"Like buying a gold coin at a shop. You pay, and you take the coin home."},{"t":37,"d":5.25,"text":"Asha pays 600 USDT, and 0.010 BTC lands in her wallet. She owns it."},{"t":43.1,"d":6.75,"text":"A futures contract is an agreement about the price of an asset. It is not the asset itself."},{"t":50.1,"d":5.55,"text":"The asset it follows is called the underlying. Here, the underlying is BTC."},{"t":55.9,"d":6.35,"text":"Rahul opens a long contract for 0.010 BTC. No BTC arrives. He holds a contract."},{"t":63.1,"d":5.35,"text":"Most crypto futures are perpetual. A perpetual contract has no end date."},{"t":68.7,"d":6.05,"text":"Older-style futures expire on a set date. A perpetual stays open until it's closed."},{"t":75,"d":5.75,"text":"When it closes, profit or loss is settled in USDT. No coins are delivered."},{"t":81.6,"d":4.25,"text":"Exposure is how much of your money moves with the price."},{"t":86.1,"d":4.55,"text":"Notional value is the full size of a position: size × price."},{"t":90.9,"d":6.35,"text":"0.010 BTC × 60,000 = 600 USDT. Asha and Rahul both have 600 USDT of exposure."},{"t":98.1,"d":4.25,"text":"Now let's follow the same price for both, side by side."},{"t":102.6,"d":5.75,"text":"BTC rises to 63,000. Asha's coins are worth 630 USDT. Rahul's PnL is +30 USDT."},{"t":108.6,"d":5.05,"text":"BTC falls to 57,000. Asha's coins: 570 USDT. Rahul's PnL: −30 USDT."},{"t":113.9,"d":4.35,"text":"Same moves, same money. But only Asha owns any BTC."},{"t":119.1,"d":5.75,"text":"Futures can also go short: you gain if the price falls, and lose if it rises."},{"t":125.1,"d":5.25,"text":"Short 0.010 BTC from 60,000. At 57,000: +30 USDT. At 63,000: −30 USDT."},{"t":130.6,"d":4.65,"text":"On plain spot, you can only sell coins you already hold."},{"t":136.1,"d":5.15,"text":"A common mistake: thinking a futures position means you own the coin."},{"t":141.5,"d":5.45,"text":"You can't withdraw BTC from a futures position. There is no coin to send."},{"t":147.2,"d":5.05,"text":"Correction: futures give price exposure. Spot gives ownership."},{"t":153.1,"d":3.65,"text":"Futures add risks that plain spot doesn't have."},{"t":157,"d":6.05,"text":"Margin and leverage: a small deposit controls a bigger position. That's lesson T12."},{"t":163.3,"d":6.15,"text":"Liquidation: if losses eat your margin, the exchange can close the position for you."},{"t":169.7,"d":6.05,"text":"Funding: perpetual traders pay or receive small amounts at set times. More in T13."},{"t":176.6,"d":8.35,"text":"Your turn. Spot or futures? Sort these five. Pause if you need more time."},{"t":185.2,"d":4.35,"text":"Holding coins in your wallet, and withdrawing them: spot."},{"t":189.8,"d":4.85,"text":"A perpetual long, funding payments and liquidation: all futures."},{"t":194.9,"d":2.85,"text":"Well done if you sorted them all!"},{"t":198.6,"d":3.05,"text":"Here's the whole picture in one table."},{"t":201.9,"d":6.65,"text":"With spot, you hold the coin and pay the full price. No expiry, no funding, no liquidation."},{"t":208.8,"d":5.25,"text":"With perpetual futures, you hold a contract. You can go long or short."},{"t":214.3,"d":3.45,"text":"And you face funding and liquidation."},{"t":218.6,"d":5.45,"text":"Neither one is safe. Spot prices can fall a lot, and you can lose money."},{"t":224.3,"d":4.65,"text":"Futures can lose faster, and a position can be closed for you."},{"t":229.2,"d":5.05,"text":"Fees and funding keep adding up while a futures position stays open."},{"t":234.5,"d":3.75,"text":"When unsure, WAIT. NO_TRADE is always allowed."},{"t":239.1,"d":3.45,"text":"Spot means you buy and own the actual coin."},{"t":242.8,"d":6.05,"text":"Futures are contracts about a price. You can go long or short, but you own no coin."},{"t":249.1,"d":3.95,"text":"Futures add funding, leverage and liquidation risk."},{"t":253.3,"d":4.95,"text":"Check yourself: you hold a BTC perpetual long. Do you own any BTC?"},{"t":258.5,"d":4.25,"text":"No. You hold a contract that follows the BTC price."},{"t":263.6,"d":9.15,"text":"Great work! Next up, T12: margin and leverage, and why they magnify losses as well as gains."}]},"assetBase":"T11/assets/"," self: you hold a BTC perpetual long. Do you own any BTC?\"\n    },\n    {\n      \"t\": 258.5,\n      \"text\": \"No. You hold a contract that follows the BTC price.\"\n    },\n    {\n      \"t\": 263.6,\n      \"text\": \"Great work! Next up, T12: margin and leverage, and why they magnify losses as well as gains.\"\n    }\n  ]\n}\n","scene-compare.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// [row, spot, futures, spot at, futures at]\nconst CP = [\n  ['What you hold', 'The coin itself', 'A contract', 4.2, 11.0],\n  ['What you pay', 'The full price', 'Margin (lesson T12)', 5.0, 12.4],\n  ['Go short?', 'No (plain spot)', 'Yes', 5.8, 13.6],\n  ['Expiry', 'None', 'None (perpetual)', 6.8, 14.4],\n  ['Funding', 'No', 'Yes, at set times', 7.8, 16.4],\n  ['Liquidation', 'No', 'Yes, possible', 8.8, 17.0],\n];\nkit.scene('compare', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let rows = '';\n    CP.forEach((r) => {\n      rows += '<div class=\"cp-r\" style=\"display:grid;grid-template-columns:420px 1fr 1fr;align-items:center;height:58px;border-top:1.5px solid color-mix(in srgb, var(--second) 10%, transparent);font-size:28px\">' +\n        '<span style=\"color:color-mix(in srgb, var(--second) 70%, var(--ground));font-weight:600\">' + r[0] + '</span><span class=\"cp-s\" style=\"font-weight:600\">' + r[1] + '</span><span class=\"cp-f\" style=\"font-weight:600\">' + r[2] + '</span></div>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1500px\"><p class=\"kick cp-k\">Side by side</p>' +\n      '<h2 class=\"line cp-t\">The whole picture</h2></div>' +\n      '<div class=\"glass cp-tb\" style=\"left:140px;top:320px;width:1480px;padding:16px 40px\">' +\n      '<div style=\"display:grid;grid-template-columns:420px 1fr 1fr;align-items:center;height:56px;font-size:30px;font-weight:700\"><span></span><span class=\"hl\">Spot</span><span class=\"hv\">Perpetual futures</span></div>' "xr-pl\" style=\"position:absolute;left:142px;bottom:126px;font-size:22px;font-weight:600\">Bigger position</span></div>';\n    // 2. Liquidation (conceptual): the margin bar drains as price moves against the position.\n    const liq = '<div style=\"position:absolute;left:30px;right:30px;bottom:30px\">' +\n      '<div style=\"display:flex;justify-content:space-between;font-size:22px;font-weight:600;margin-bottom:8px\"><span>Margin left</span><span class=\"mono xr-ml\"></span></div>' +\n      '<div style=\"height:40px;border-radius:10px;background:color-mix(in srgb, var(--second) 8%, transparent);overflow:hidden\"><div class=\"xr-mb\" style=\"height:100%;border-radius:10px\"></div></div>' +\n      '<span class=\"chip xr-st\" style=\"margin-top:16px;font-size:24px;padding:6px 18px;background:var(--accent);border-color:var(--accent)\">Closed for you</span>' +\n      '<p class=\"fict\" style=\"margin:10px 0 0\">Conceptual, not an exact exchange model</p></div>';\n    // 3. Funding: a clock; at each mark a small payment.\n    let marks = '';\n    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; marks += '<line x1=\"' + (Math.sin(a) * 52).toFixed(1) + '\" y1=\"' + (-Math.cos(a) * 52).toFixed(1) + '\" x2=\"' + (Math.sin(a) * 60).toFixed(1) + '\" y2=\"' + (-Math.cos(a) * 60).toFixed(1) + '\" stroke-width=\"3\" style=\"stroke:color-mix(in srgb, var(--second) 40%, transparent)\"/>'; }\n    const fund = '<svg style=\"position:absolute;left:30px;bottom:34px\" width=\"140\" height=\"140\" viewBox=\"-70 -70 140 140\"><circle r=\"64\" fill=\"none\" stroke-width=\"4\" style=\"stroke:var(--second)\"/>' + marks +\n      '<line class=\"xr-hand\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-48\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"stroke:var(--main)\"/><circle r=\"6\" style=\"fill:var(--second)\"/></svg>' +\n      '<div style=\"position:absolute;left:190px;right:24px;bottom:40px;display:flex;flex-direction:column;gap:10px\"><span class=\"chip xr-f1\" style=\"font-size:22px;padding:6px 14px;border-color:var(--accent)\">Pay 0.06 USDT</span><span class=\"chip xr-f2\" style=\"font-size:22px;padding:6px 14px;border-color:var(--main)\">Receive 0.06 USDT</span>' +\n      '<p class=\"mono\" style=\"margin:0;font-size:22px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">e.g. 600 × 0.01%</p></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1500px\"><p class=\"kick xr-k\" style=\"color:var(--accent)\">Extra futures risks</p>' +\n      '<h2 class=\"line xr-t\">What spot does not have</h2></div>' +\n      card(0, 'Lesson T12', 'Margin and leverage', 'A small deposit controls a bigger position.', lev) +\n      card(1, 'Lesson T13', 'Liquidation', 'If losses eat your margin, the position can be closed for you.', liq) +\n      card(2, 'Lesson T13', 'Funding', 'Perpetual traders pay or receive small amounts at set times.', fund) +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.xr-k').style; this.t = q('.xr-t'); this.cards = all('.xr-c').map((e) => e.style);\n    this.pos = q('.xr-pos').style; this.pl = q('.xr-pl').style; this.mb = q('.xr-mb').style; this.ml = q('.xr-ml'); this.st = q('.xr-st').style;\n    this.hand = q('.xr-hand'); this.f1 = q('.xr-f1').style; this.f2 = q('.xr-f2').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'think' }, { t: 4.5, pose: 'present' }, { t: 10.8, pose: 'confused' }, { t: 17.2, pose: 'checklist' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.cards.forEach((c, i) => {\n      const a = XR_AT[i], p = seg(t, a, a + 0.7);\n      c.opacity = eo(seg(t, a, a + 0.35)).toFixed(3);\n      c.transform = 'tra ).style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: 2080, y: C.y, s: C.s }, { t: 2.6, x: C.x, y: C.y, s: C.s, d: 1.9, ease: (p) => kit.lerp(p, kit.eo(p), 0.5) }],\n      poses: [{ t: 0, pose: 'walk', flip: true }, { t: 2.6, pose: 'present' }],\n      says: [{ t0: 2.9, t1: 8.4, text: 'Own it, or follow its price?' }],\n    });\n  },\n  render(t) {\n    this.k.opacity = eo(seg(t, -0.6, -0.1));\n    TextFx.fadeFromRight(this.t, t, -0.9);\n    this.r.transformOrigin = '0 50%';\n    this.r.transform = 'scaleX(' + eo(seg(t, 0.2, 0.9)) + ')';\n    this.s.opacity = eo(seg(t, 0.6, 1.1));\n    const c = seg(t, -0.6, 0.6);\n    this.coin.setAttribute('transform', 'translate(1340 ' + (470 - t * 2).toFixed(1) + ') scale(' + (lerp(0.9, 1, eob(c, 1.6)) * (1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.2))).toFixed(4) + ')');\n    this.coin.style.opacity = eo(c);\n    this.ticks.setAttribute('transform', 'rotate(' + (t * 6).toFixed(2) + ')');\n    [this.cx, this.doc].forEach((s, i) => { const p = seg(t, 0.3 + i * 0.5, 0.9 + i * 0.5); s.opacity = eo(p); s.transformBox = 'fill-box'; s.transformOrigin = 'center'; s.transform = 'translateX(' + lerp(i ? 40 : -40, 0, eo(p)).toFixed(1) + 'px) scale(' + lerp(0.6, 1, eob(p, 1.6)).toFixed(4) + ')'; });\n    this.tutor.render(t);\n  },\n});\n","scene-try.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst TRY_R = 60, TRY_C = 2 * Math.PI * TRY_R;\n// [text, bin (0 spot, 1 futures), pool centre x, y, final centre x, y, sorted at]\nconst TS = [\n  ['Buy BTC and hold it in your wallet', 0, 560, 350, 520, 630, 9.4],\n  ['Open a long BTCUSDT perpetual', 1, 1340, 350, 1380, 620, 14.0],\n  ['Pay funding at set times', 1, 560, 430, 1380, 676, 14.6],\n  ['Can be liquidated', 1, 1340, 430, 1380, 732, 15.2],\n  ['Withdraw the coins to your own wallet', 0, 950, 510, 520, 700, 10.2],\n];\nkit.scene('try', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const bin = (cls, x, label, col) => '<div class ty = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    const bp = seg(t, 0.6, 1.3);\n    this.bins.forEach((b) => { b.opacity = eo(bp); b.transform = 'translateY(' + lerp(30, 0, eo(bp)) + 'px)'; });\n    const glow = [0, 0];\n    this.chips.forEach((c, i) => {\n      const s = TS[i], show = seg(t, 1.2 + i * 0.3, 1.6 + i * 0.3), mv = eio(seg(t, s[6], s[6] + 0.8));\n      c.opacity = eo(show);\n      const x = lerp(s[2], s[4], mv), y = lerp(s[3], s[5], mv) - Math.sin(Math.PI * mv) * 50;\n      c.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%,-50%) scale(' + (lerp(0.7, 1, eob(show, 1.7)) * lerp(1, 0.96, mv)).toFixed(4) + ')';\n      const done = t >= s[6] + 0.8;\n      c.background = done ? 'color-mix(in srgb, var(--ground) 70%, ' + (s[1] ? 'var(--accent)' : 'var(--main)') + ')' : '';\n      c.borderColor = done ? (s[1] ? 'var(--accent)' : 'var(--main)') : '';\n      const land = seg(t, s[6] + 0.8, s[6] + 1.4);\n      if (land > 0 && land < 1) glow[s[1]] = Math.max(glow[s[1]], Math.sin(Math.PI * land));\n    });\n    this.bins.forEach((b, i) => { b.borderColor = 'color-mix(in srgb, ' + (i ? 'var(--accent)' : 'var(--main)') + ' ' + (22 + glow[i] * 60).toFixed(0) + '%, transparent)'; });\n    this.ring.opacity = (eo(seg(t, 3.0, 3.5)) * (1 - ei(seg(t, 8.8, 9.3)))).toFixed(3);\n    this.arc.setAttribute('stroke-dashoffset', (TRY_C * seg(t, 3.6, 8.6)).toFixed(1));\n    UI.set(this.n, t < 3.6 ? '5' : String(Math.min(5, Math.max(0, Math.ceil(5 - (t - 3.6))))));\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson eleven\",\n      \"dur\": 9,\n      \"desc\": \"Title card: Phase 3, lesson T11, spot vs futures; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"Two traders\",\n      \"dur\": 16,\n      \"desc\": \"Asha buys 0.010 BTC on spot; Rahul opens a long futures position of the same size; both gain when BTC rises.\"\n    },\n    {\n      \"id\": \"spot\",\n      \"name\": \"Spot: you own it\",\n      \"dur\": 17.5,\n      \"desc\": \"Spot defined; gold-coin analogy; Asha pays 600 USDT and 0.010 BTC lands in her wallet.\"\n    },\n    {\n      \"id\": \"futures\",\n      \"name\": \"Futures: a contract\",\n      \"dur\": 20,\n      \"desc\": \"Futures contract and underlying defined; Rahul opens a long contract and no BTC arrives in his wallet.\"\n    },\n    {\n      \"id\": \"perp\",\n      \"name\": \"Perpetual\",\n      \"dur\": 18.5,\n      \"desc\": \"Dated futures expire on a date; a perpetual has no end date; on close, profit or loss is settled in USDT.\"\n    },\n    {\n      \"id\": \"exposure\",\n      \"name\": \"Exposure\",\n      \"dur\": 16.5,\n      \"desc\": \"Exposure and notional value: 0.010 BTC x 60,000 = 600 USDT for both traders.\"\n    },\n    {\n      \"id\": \"side\",\n      \"name\": \"Side by side\",\n      \"dur\": 21,\n      \"desc\": \"The same price path for both: 63,000 gives 630 USDT / +30 USDT; 57,000 gives 570 USDT / -30 USDT.\"\n    },\n    {\n      \"id\": \"short\",\n      \"name\": \"Going short\",\n      \"dur\": 17,\n      \"desc\": \"A short futures position gains when price falls: +30 at 57,000, -30 at 63,000; plain spot can only sell coins you hold.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"No coin to withdraw\",\n      \"dur\": 17,\n      \"desc\": \"Common mistake: a futures position is not owned BTC; a withdraw attempt shows 0 BTC.\"\n    },\n    {\n      \"id\": \"extra\",\n      \"name\": \"Extra futures risks\",\n      \"dur\": 23.5,\n      \"desc\": \"Leverage (T12), liquidation as a conceptual shrinking margin, and a funding clock.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Sort them\",\n      \"dur\": 22,\n      \"desc\": \"Pause and sort five examples into spot or futures; countdown, then each card moves to its bin.\"\n    },\n    {\n      \"id\": \"compare\",\n      \"name\": \"The whole picture\",\n      \"dur\": 20,\n      \"desc\": \"Comparison table: what you hold, what you pay, short, expiry, funding, liquidation.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the risks\",\n      \"dur\": 20.5,\n      \"desc\": \"Neither is safe; futures can lose faster and be closed for you; costs add up; WAIT / NO_TRADE.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 24.5,\n      \"desc\": \"Three key points and one question to check yourself.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T12, margin and leverage.\"\n    }\n  ]\n}\n","score.js":"kit.score(function (S, T) {\n  // A soft bed under the captions: pad and keys, a light pulse in the hands-on parts, quieter for the safety parts.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.side, T.mistake) || inR(s, T.try, T.compare);\n  const quiet = (s) => inR(s, T.extra, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  const pop = (t, v) => S.fx('pop', t, { vel: v || 28, pitch: 7 });\n  const tick = (t, v) => S.fx('tick', t, { vel: v || 26 });\n  pop(T.title + 2.9);\n  // Hook: two traders, then the price ticks up.\n  pop(T.hook + 1.0, 26); pop(T.hook + 1.6, 26); pop(T.hook + 6.8, 30); pop(T.hook + 8.2, 30);\n  for (let i = 0; i < 6; i++) tick(T.hook + 11.6 + i * 0.27, 20);\n  // Spot: the coin goes home; USDT out, BTC in.\n  S.fx('whoosh', T.spot + 7.6, { dur: 1.2, vel: 22 }); S.fx('chime', T.spot + 8.9, { vel: 30 });\n  S.fx('whoosh', T.spot + 12.8, { dur: 1.0, vel: 20 }); S.fx('ding', T.spot + 14.4, { vel: 36 });\n  // Futures: the contract fills in; no BTC arrives.\n  pop(T.futures + 2.4, 26); S.fx('ding', T.futures + 7.9, { vel: 32 });\n  [13.8, 14.3, 14.8].forEach((a) => tick(T.futures + a, 28));\n  S.fx('thud', T.futures + 16.2, { vel: 30 });\n  // Perpetual: dated contract counts down and expires; the perpetual closes and settles.\n  [7.0, 7.8, 8.6].forEach((a) => tick(T.perp + a, 26)); S.fx('thud', T.perp + 9.6, { vel: 26 });\n  pop(T.perp + 12.9, 30); S.fx('ding', T.perp + 13.6, { vel: 34 });\n  // Exposure: the formula counts, the bars fill.\n  S.fx('ding', T.exposure + 11.2, { vel: 32 }); S.fx('whoosh', T.exposure + 11.9, { dur: 1.2, vel: 20 });\n  // Side by side: up, then down.\n  S.fx('ding', T.side + 7.6, { vel: 34 }); S.fx('thud', T.side + 13.6, { vel: 28 }); S.fx('chime', T.side + 16.6, { vel: 30 });\n  // Short: down is a gain, up is a loss.\n  S.fx('ding', T.short + 8.4, { vel: 34 }); S.fx('thud', T.short + 11.2, { vel: 28 }); pop(T.short + 12.1, 28);\n  // Mistake: withdraw fails.\n  pop(T.mistake + 1.4, 26); pop(T.mistake + 6.5, 30); S.fx('thud', T.mistake + 7.0, { vel: 34 }); S.fx('chime', T.mistake + 12.8, { vel: 30 });\n  // Extra risks: three cards; margin drains; funding clock.\n  [4.5, 10.8, 17.2].forEach((a) => pop(T.extra + a, 28));\n  S.fx('whoosh', T.extra + 5.6, { dur: 1.0, vel: 20 }); S.fx('thud', T.extra + 15.7, { vel: 30 });\n  for (let i = 1; i <= 2; i++) tick(T.extra + 17.6 + 360 / 140 * i, 30);\n  // Try it: countdown, then each card lands.\n  pop(T.try + 0.8, 30);\n  for (let i = 0; i < 5; i++) tick(T.try + 3.6 + i, 30);\n  S.fx('chime', T.try + 9.2, { vel: 40 });\n  [9.4, 10.2, 14.0, 14.6, 15.2].forEach((a) => pop(T.try + a + 0.8, 32));\n  // Compare: cells appear.\n  [4.2, 11.0, 16.4].forEach((a) => pop(T.compare + a, 26));\n  [0.8, 6.5, 11.4, 16.7].forEach((a) => pop(T.risks + a, 28));\n  [0.8, 4.5, 10.8].forEach((a) => pop(T.recap + a, 32));\n  S.fx('ding', T.recap + 20.0, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 23, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T11 · Spot vs futures',\n  TOTAL: 273,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount with a real minus sign: +6.00 / −6.00.\n  sgn(n, dp) { return (n >= 0 ? '+' : '−') + UI.fmt(Math.abs(n), dp); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // Eased path through keys [[t, value], ...].\n  path(keys) {\n    return (t) => {\n      let v = keys[0][1];\n      for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = a[1] + (b[1] - a[1]) * window.UI._eio(Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])))); }\n      return v;\n    };\n  },\n  _eio(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; },\n  // A small live wiggle so a price never sits perfectly still (fictional).\n  wig(t, amt) { return (Math.sin(t * 1.7) * 0.6 + Math.sin(t * 4.3 + 1) * 0.4) * amt; },\n  // Lowest and highest of fn over [a, b] (sampled), for a candle that is still forming.\n  hilo(fn, a, b) { let lo = fn(a), hi = lo; for (let s = a; s <= b; s += 0.05) { const v = fn(s); if (v < lo) lo = v; if (v > hi) hi = v; } const v = fn(b); return [Math.min(lo, v), Math.max(hi, v)]; },\n\n  // A wallet card: rows [[label, cls]]; returns { el, set(cls, text) }.\n  wallet(kit, x, y, w, title, rows) {\n    const el = kit.h('<div class=\"glass\" style=\"left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;padding:24px 30px;display:flex;flex-direction:column;gap:10px\">' +\n      '<p class=\"fict\" style=\"margin:0\">' + title + '</p>' +\n      rows.map((r) => '<div class=\"' + r[1] + '-row\" style=\"display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;margin:0 -12px;border-radius:12px\"><span style=\"font-size:28px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">' + r[0] + '</span><span class=\"mono ' + r[1] + '\" style=\"font-size:40px\"></span></div>').join('') + '</div>');\n    kit.stage.append(el);\n    return { el, row: (c) => el.querySelector('.' + c + '-row').style, val: (c) => el.querySelector('.' + c) };\n  },\n  // A person badge: a round initial and a name.\n  person(name, col, role) {\n    return '<div style=\"display:flex;align-items:center;gap:18px\"><span style=\"width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:34px;font-weight:700;background:color-mix(in srgb, ' + col + ' 30%, var(--ground));border:3px solid ' + col + '\">' + name[0] + '</span>' +\n      '<span style=\"display:flex;flex-direction:column\"><b style=\"font-size:34px\">' + name + '</b><span style=\"font-size:26px;color:' + col + ';font-weight:600\">' + role + '</span></span></div>';\n  },\n  // A callout card: kick, headline, body.\n  tip(kit, x, y, w, kick, head, body, extra) {\n    const el = kit.h('<div class=\"glass tip\" style=\"left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;padding:30px 36px;display:flex;flex-direction:column;gap:16px;border-color:color-mix(in srgb, var(--main) 45%, transparent)\">' +\n      '<p class=\"kick\" style=\"margin:0\">' + kick + '</p><h2 class=\"line\" style=\"margin:0;font-size:64px\">' + head + '</h2>' + (body ? '<p class=\"def\" style=\"margin:0;font-size:30px\">' + body + '</p>' : '') + (extra || '') + '</div>');\n    kit.stage.append(el);\n    return el;\n  },\n  // Fade and lift an element in at a, out at b.\n  show(st, t, a, b, dy) {\n    const p = Math.min(1, Math.max(0, (t - a) / 0.6)), q = b == null ? 0 : Math.min(1, Math.max(0, (t - b) / 0.45));\n    const eo = 1 - Math.pow(1 - p, 3);\n    st.opacity = (eo * (1 - q * q)).toFixed(3);\n    st.transform = 'translateY(' + ((1 - eo) * (dy == null ? 30 : dy)).toFixed(1) + 'px)';\n  },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // Side speech bubbles sit this far higher than in T01, so they clear the two-line caption band (y ≈ 784–930).\n  LIFT: 96,\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n};\n","tutor.json":"{\n  \"present\": {\n    \"w\": 546,\n    \"h\": 612,\n    \"ax\": 218,\n    \"feet\": 605,\n    \"bw\": 421\n  },\n  \"explain\": {\n    \"w\": 502,\n    \"h\": 602,\n    \"ax\": 275,\n    \"feet\": 594,\n    \"bw\": 394\n  },\n  \"point\": {\n    \"w\": 547,\n    \"h\": 568,\n    \"ax\": 210,\n    \"feet\": 561,\n    \"bw\": 415\n  },\n  \"think\": {\n    \"w\": 465,\n    \"h\": 656,\n    \"ax\": 229,\n    \"feet\": 648,\n    \"bw\": 452\n  },\n  \"magnify\": {\n    \"w\": 187,\n    \"h\": 170,\n    \"ax\": 85.5,\n    \"feet\": 163,\n    \"bw\": 138\n  },\n  \"thumbs\": {\n    \"w\": 181,\n    \"h\": 179,\n    \"ax\": 102.0,\n    \"feet\": 172,\n    \"bw\": 138\n  },\n  \"confused\": {\n    \"w\": 185,\n    \"h\": 169,\n    \"ax\": 85.0,\n    \"feet\": 162,\n    \"bw\": 138\n  },\n  \"checklist\": {\n    \"w\": 185,\n    \"h\": 161,\n    \"ax\": 97.5,\n    \"feet\": 153,\n    \"bw\": 138\n  },\n  \"idea\": {\n    \"w\": 169,\n    \"h\": 178,\n    \"ax\": 69.5,\n    \"feet\": 171,\n    \"bw\": 138\n  },\n  \"cheer\": {\n    \"w\": 207,\n    \"h\": 182,\n    \"ax\": 105.0,\n    \"feet\": 175,\n    \"bw\": 138\n  },\n  \"calm\": {\n    \"w\": 234,\n    \"h\": 174,\n    \"ax\": 111.0,\n    \"feet\": 167,\n    \"bw\": 138\n  },\n  \"wv1\": {\n    \"w\": 381,\n    \"h\": 448,\n    \"ax\": 163.5,\n    \"feet\": 434,\n    \"bw\": 305\n  },\n  \"wv2\": {\n    \"w\": 374,\n    \"h\": 448,\n    \"ax\": 165.0,\n    \"feet\": 436,\n    \"bw\": 305\n  },\n  \"wv3\": {\n    \"w\": 363,\n    \"h\": 448,\n    \"ax\": 166.0,\n    \"feet\": 431,\n    \"bw\": 305\n  },\n  \"wv4\": {\n    \"w\": 375,\n    \"h\": 446,\n    \"ax\": 166.0,\n    \"feet\": 431,\n    \"bw\": 305\n  },\n  \"wk0\": {\n    \"w\": 353,\n    \"h\": 460,\n    \"ax\": 162.5,\n    \"feet\": 446,\n    \"bw\": 310\n  },\n  \"wk1\": {\n    \"w\": 361,\n    \"h\": 460,\n    \"ax\": 164.5,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk2\": {\n    \"w\": 345,\n    \"h\": 460,\n    \"ax\": 170.5,\n    \"feet\": 448,\n    \"bw\": 310\n  },\n  \"wk3\": {\n    \"w\": 365,\n    \"h\": 460,\n    \"ax\": 164.0,\n    \"feet\": 446,\n    \"bw\": 310\n  },\n  \"wk4\": {\n    \"w\": 375,\n    \"h\": 457,\n    \"ax\": 167.5,\n    \"feet\": 444,\n    \"bw\": 310\n  },\n  \"wk5\": {\n    \"w\": 364,\n    \"h\": 457,\n    \"ax\": 167.0,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk6\": {\n    \"w\": 354,\n    \"h\": 457,\n    \"ax\": 166.5,\n    \"feet\": 445,\n    \"bw\": 310\n  },\n  \"wk7\": {\n    \"w\": 365,\n    \"h\": 457,\n    \"ax\": 167.0,\n    \"feet\": 445,\n    \"bw\": 310\n  }\n}"}};</script>
<script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *
 * build-lesson.mjs inlines this file into public/futures-edge/lessons/<id>.html, after a
 * `window.FILM = {...}` block that carries the scene list, module texts and asset paths.
 */
(function () {
  "use strict";

  const F = window.FILM;
  const W = F.width;
  const H = F.height;

  // ── Maths and easing ───────────────────────────────────────────────────────
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clamp01 = (x) => clamp(x, 0, 1);
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a)));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const ei = (x) => Math.pow(clamp01(x), 3);
  const eio = (x) => {
    x = clamp01(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  };
  const eob = (x, s = 1.4) => {
    x = clamp01(x);
    return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  };
  const rng = (seed) => {
    let a = seed >>> 0 || 1;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const breathe = (t, amt = 0.012, period = 3.2) => 1 + amt * Math.sin((2 * Math.PI * t) / period);

  // ── DOM helpers ────────────────────────────────────────────────────────────
  const h = (html) => {
    const tpl = document.createElement("template");
    tpl.innerHTML = String(html).trim();
    return tpl.content.firstElementChild;
  };
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const el = (tag, o = {}, children = []) => {
    const e = document.createElement(tag);
    if (o.class) e.className = o.class;
    if (o.style) e.setAttribute("style", o.style);
    if (o.text != null) e.textContent = o.text;
    if (o.html != null) e.innerHTML = o.html;
    for (const [k, v] of Object.entries(o.attrs || {})) e.setAttribute(k, v);
    for (const c of children) e.append(c);
    return e;
  };

  // Words of an element as inline-block spans (inline markup such as <b> is kept).
  const wordCache = new WeakMap();
  function words(root) {
    let list = wordCache.get(root);
    if (list) return list;
    list = [];
    const walk = (node) => {
      for (const child of Array.from(node.childNodes)) {
        if (child.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const part of child.textContent.split(/(\s+)/)) {
            if (!part) continue;
            if (/^\s+$/.test(part)) {
              frag.append(document.createTextNode(part));
            } else {
              const s = document.createElement("span");
              s.textContent = part;
              s.style.display = "inline-block";
              frag.append(s);
              list.push(s);
            }
          }
          node.replaceChild(frag, child);
        } else if (child.nodeType === 1) {
          walk(child);
        }
      }
    };
    walk(root);
    wordCache.set(root, list);
    return list;
  }
  const TextFx = {
    fadeFromRight(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.11, d = o.dur ?? 0.5, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = eo(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = p;
        s.style.transform = "translateX(" + ((1 - p) * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
    fadeOutLeft(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.04, d = o.dur ?? 0.35, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = ei(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = 1 - p;
        s.style.transform = "translateX(" + (-p * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
  };

  // ── The kit the scene modules use ──────────────────────────────────────────
  const modules = F.modules;
  const jsonCache = {};
  const assets = {
    url: (name) => F.assetBase + name,
    has: (name) => Object.prototype.hasOwnProperty.call(F.assets, name),
    list: () => Object.keys(F.assets),
  };
  const defs = {};
  let scoreFn = null;

  // start/dur: the scene in the played timeline; oldStart/oldDur: as authored (k = dur / oldDur).
  let acc = 0;
  const scenes = F.scenes.map((s) => {
    const o = Object.assign({ k: 1, oldStart: acc, oldDur: s.dur }, s, { start: acc });
    acc += s.dur;
    return o;
  });
  const END = acc;
  const OLD_END = scenes.reduce((a, s) => a + s.oldDur, 0);
  // Authored time to played time.
  function warp(x) {
    for (let i = scenes.length - 1; i >= 0; i--) {
      const s = scenes[i];
      if (x >= s.oldStart) return s.start + (x - s.oldStart) * s.k;
    }
    return x;
  }
  // Narration lines: spoken when the lesson has a voice track (F.voice.src), always shown as captions.
  const lines = (F.voice && F.voice.lines) || [];
  // Stretches where the music dips under the voice: each line plus a little either side, close ones joined.
  const duckSpans = [];
  if (F.voice && F.voice.src) for (const l of lines) {
    const a = l.t - 0.15, b = l.t + l.d + 0.25, last = duckSpans[duckSpans.length - 1];
    if (last && a - last[1] < 1.2) last[1] = b; else duckSpans.push([a, b]);
  }

  function makeKit(box, start, dur) {
    return {
      stage: box, start, dur, W, H,
      seg, lerp, eo, ei, eio, eob, clamp, clamp01, rng, breathe, TextFx, h, el, esc,
      assets,
      module: (n) => (n in modules ? modules[n] : null),
      json: (n) => (jsonCache[n] ??= JSON.parse(modules[n])),
      modules: () => Object.keys(modules),
      scene: (id, def) => { defs[id] = def; },
      score: (fn) => { scoreFn = fn; },
    };
  }
  const run = (name, kit) => new Function("kit", modules[name] + "\n//# sourceURL=" + F.id + "/" + name)(kit);

  // ── Stage ──────────────────────────────────────────────────────────────────
  const stage = document.getElementById("stage");
  const css = document.createElement("style");
  css.textContent = modules["base.css"] || "";
  document.head.append(css);

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 200));
  fit();

  // ── Audio: score.js recorded as events, then synthesised with WebAudio ─────
  function midiOf(p) {
    if (typeof p === "number") return p;
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(p).trim());
    if (!m) return 72;
    const base = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[m[1].toLowerCase()];
    return 12 * (Number(m[3]) + 1) + base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  }

  // score.js runs twice: the music against the played timeline, the sound effects against the
  // authored one and then moved onto the played one, so each cue stays with its animation.
  function recordScore() {
    const T = { END };
    for (const s of scenes) T[s.id] = s.start;
    const music = recordPass(T);
    const Told = { END: OLD_END };
    for (const s of scenes) Told[s.id] = s.oldStart;
    const cues = recordPass(Told);
    const ev = music.ev.filter((e) => e.k !== "f");
    for (const e of cues.ev) {
      if (e.k !== "f") continue;
      e.t = warp(e.t);
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      ev.push(e);
    }
    ev.sort((a, b) => a.s - b.s);
    return { ev, tracks: music.tracks, master: music.master };
  }

  function recordPass(T) {
    const ev = [];
    const tracks = {};
    const master = { gain: -6, music: 0, fadeOut: 1 };
    let B = 0.5, t0 = 0;
    const at = (o) => (o.t != null ? o.t : t0 + (o.beat || 0) * B);
    const len = (o, d) => (o.dur != null ? o.dur : o.beats != null ? o.beats * B : d);
    const push = (e) => {
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      if (e.s < -0.1) return;
      if (e.s < 0) { e.t += -e.s; e.s = 0; }
      ev.push(e);
    };
    const hits = (str, rep, step, from, vel, fn) => {
      for (let r = 0; r < rep; r++) {
        for (let i = 0; i < str.length; i++) {
          const c = str[i];
          if (c !== "x" && c !== "X" && c !== "o") continue;
          fn(t0 + (from + (r * str.length + i) * step) * B, vel * (c === "X" ? 1.25 : c === "o" ? 0.5 : 1));
        }
      }
    };
    const S = {
      tempo(bpm, o = {}) { B = 60 / bpm; t0 = o.t0 || 0; },
      beat: (n) => t0 + n * B,
      toBeat: (t) => (t - t0) / B,
      seed() {},
      program(track, patch, o = {}) {
        tracks[track] = { patch, gain: o.gain || 0, pan: o.pan || 0, rev: o.rev || 0, bright: o.bright ?? 1 };
      },
      note(track, p, o = {}) { push({ k: "n", track, m: midiOf(p), t: at(o), d: len(o, B), v: o.vel ?? 90 }); },
      chord(track, ps, o = {}) { ps.forEach((p) => S.note(track, p, o)); },
      pattern(track, str, o = {}) {
        const pitches = o.pitch || ["C5"];
        let k = 0;
        const step = o.step ?? 0.5;
        hits(str, o.repeat ?? 1, step, o.from || 0, o.vel ?? 80, (t, v) =>
          push({ k: "n", track, m: midiOf(pitches[k++ % pitches.length]), t, d: o.dur ?? step * B * 0.9, v }));
      },
      drum(name, o = {}) { push({ k: "d", name, t: at(o), d: 0.3, v: o.vel ?? 90 }); },
      drums(map, o = {}) {
        for (const name of Object.keys(map)) {
          hits(map[name], o.repeat ?? 1, o.step ?? 0.5, o.from || 0, o.vel ?? 80, (t, v) => push({ k: "d", name, t, d: 0.3, v }));
        }
      },
      ticks(times, o = {}) { times.forEach((t) => push({ k: "f", name: "tick", t, d: 0.03, v: o.vel ?? 40, pitch: 0 })); },
      fx(name, t, o = {}) { push({ k: "f", name, t, d: o.dur ?? 0.5, v: o.vel ?? 70, pitch: o.pitch || 0 }); },
      run(track, ps, o = {}) {
        const step = o.step ?? 0.1;
        ps.forEach((p, i) => push({ k: "n", track, m: midiOf(p), t: o.t + i * step, d: step * 2.5, v: (o.vel ?? 70) + i * (o.cresc || 0) }));
      },
      master(o = {}) {
        if (o.gain != null) master.gain = o.gain;
        if (o.music != null) master.music = o.music;
        if (o.fadeOut != null) master.fadeOut = o.fadeOut;
      },
    };
    if (scoreFn) scoreFn(S, T);
    return { ev, tracks, master };
  }

  const db = (x) => Math.pow(10, x / 20);
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const audio = {
    ctx: null, enabled: false, muted: false, score: null,
    out: null, verb: null, noise: null, session: null, timer: 0,
    voiceData: null, voiceBuf: null, voiceOut: null,
  };
  const DUCK = 0.4;

  function setupAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    const ctx = (audio.ctx = new AC());
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;
    comp.connect(ctx.destination);
    audio.out = ctx.createGain();
    audio.out.gain.value = db(audio.score.master.gain);
    audio.out.connect(comp);
    // A small generated room for the reverb send.
    const len = Math.floor(ctx.sampleRate * 2.4);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    const r = rng(9);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    audio.verb = ctx.createConvolver();
    audio.verb.buffer = ir;
    const verbGain = ctx.createGain();
    verbGain.gain.value = 0.5;
    audio.verb.connect(verbGain);
    verbGain.connect(audio.out);
    const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = nb.getChannelData(0);
    const r2 = rng(3);
    for (let i = 0; i < nd.length; i++) nd[i] = r2() * 2 - 1;
    audio.noise = nb;
    // The voice skips the music's compressor and goes straight out.
    audio.voiceOut = ctx.createGain();
    audio.voiceOut.gain.value = 1;
    audio.voiceOut.connect(ctx.destination);
    decodeVoice();
    return true;
  }

  async function decodeVoice() {
    if (!audio.ctx || audio.voiceBuf || !audio.voiceData) return;
    try {
      const data = await audio.voiceData;
      if (!data || audio.voiceBuf) return;
      audio.voiceBuf = await new Promise((ok, fail) => audio.ctx.decodeAudioData(data.slice(0), ok, fail));
    } catch (e) {
      return; // the lesson plays on without the voice
    }
    if (audio.session) startVoice(audio.session);
  }

  // The voice of one session, from the session's start point; the music dips under each line.
  function startVoice(s) {
    if (!audio.voiceBuf || s.voice) return;
    const ctx = audio.ctx;
    const at = Math.max(s.ctx0, ctx.currentTime + 0.02);
    const off = s.film0 + (at - s.ctx0);
    if (off >= audio.voiceBuf.duration) return;
    const src = ctx.createBufferSource();
    src.buffer = audio.voiceBuf;
    src.connect(audio.voiceOut);
    src.start(at, off);
    s.voice = src;
    for (const g of [s.duck.gain, s.send.gain]) {
      for (const [a, b] of duckSpans) {
        if (b <= off) continue;
        const ca = at + (a - off), cb = at + (b - off);
        if (ca > at) { g.setValueAtTime(1, ca); g.linearRampToValueAtTime(DUCK, ca + 0.25); } else g.setValueAtTime(DUCK, at);
        g.setValueAtTime(DUCK, cb);
        g.linearRampToValueAtTime(1, cb + 0.5);
      }
    }
  }

  // One playback session: a bus that can be dropped as a whole on pause or seek.
  function startSession(filmT) {
    stopSession();
    if (!audio.enabled || audio.muted) return;
    const ctx = audio.ctx;
    const bus = ctx.createGain();
    const duck = ctx.createGain();
    bus.connect(duck);
    duck.connect(audio.out);
    const send = ctx.createGain();
    send.connect(audio.verb);
    // The instruments (not the drums or sound effects) go through their own level, master({ music }).
    const music = ctx.createGain();
    music.gain.value = db(audio.score.master.music);
    music.connect(bus);
    const musicSend = ctx.createGain();
    musicSend.gain.value = music.gain.value;
    musicSend.connect(send);
    const tracks = {};
    for (const [name, tr] of Object.entries(audio.score.tracks)) {
      const g = ctx.createGain();
      g.gain.value = db(tr.gain);
      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (pan) { pan.pan.value = tr.pan; g.connect(pan); pan.connect(music); } else g.connect(music);
      const rs = ctx.createGain();
      rs.gain.value = tr.rev;
      g.connect(rs);
      rs.connect(musicSend);
      tracks[name] = { node: g, def: tr };
    }
    const s = { bus, duck, send, music, musicSend, tracks, ctx0: ctx.currentTime + 0.06, film0: filmT, upTo: filmT, idx: 0, voice: null };
    audio.session = s;
    startVoice(s);
    // Notes already sounding at the seek point start now with what is left of them.
    for (const e of audio.score.ev) {
      if (e.s >= filmT) break;
      if (e.k === "n" && e.s + e.d > filmT + 0.15) sound(e, s, filmT, e.s + e.d - filmT);
    }
    s.idx = audio.score.ev.findIndex((e) => e.s >= filmT);
    if (s.idx < 0) s.idx = audio.score.ev.length;
    // Fade the master out over the last seconds of the lesson.
    const fo = audio.score.master.fadeOut;
    if (fo > 0) {
      const a = Math.max(filmT, END - fo);
      bus.gain.setValueAtTime(1, s.ctx0 + (a - filmT));
      bus.gain.linearRampToValueAtTime(0.0001, s.ctx0 + (END - filmT));
    }
    audio.timer = setInterval(() => pump(), 50);
    pump();
  }

  function stopSession() {
    clearInterval(audio.timer);
    const s = audio.session;
    audio.session = null;
    if (!s) return;
    const now = audio.ctx.currentTime;
    s.bus.gain.cancelScheduledValues(now);
    s.bus.gain.setTargetAtTime(0, now, 0.03);
    s.send.gain.cancelScheduledValues(now);
    s.send.gain.setTargetAtTime(0, now, 0.03);
    if (s.voice) {
      const v = s.voice;
      try { v.stop(now + 0.05); } catch (e) { /* not started yet */ }
      setTimeout(() => v.disconnect(), 400);
    }
    setTimeout(() => { s.bus.disconnect(); s.duck.disconnect(); s.send.disconnect(); s.music.disconnect(); s.musicSend.disconnect(); }, 400);
  }

  function pump() {
    const s = audio.session;
    if (!s) return;
    const filmNow = s.film0 + (audio.ctx.currentTime - s.ctx0);
    const horizon = filmNow + 0.6;
    const ev = audio.score.ev;
    while (s.idx < ev.length && ev[s.idx].s <= horizon) {
      const e = ev[s.idx++];
      if (e.s >= s.film0) sound(e, s, e.s, e.d);
    }
  }

  function sound(e, s, filmStart, dur) {
    const ctx = audio.ctx;
    const when = Math.max(ctx.currentTime, s.ctx0 + (filmStart - s.film0));
    const v = Math.pow(clamp01(e.v / 127), 1.5);
    if (e.k === "n") {
      const tr = s.tracks[e.track];
      if (!tr) return;
      voice(tr.def.patch, tr.node, hz(e.m), when, Math.max(0.05, dur), v, tr.def.bright);
    } else if (e.k === "d") {
      drum(e.name, s.bus, when, v);
    } else {
      fx(e.name, s.bus, s.send, when, e.d, v, e.pitch || 0);
    }
  }

  function env(g, when, peak, attack, hold, release) {
    peak = Math.max(peak, 0.0002);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + attack);
    g.gain.setValueAtTime(peak, when + attack + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, when + attack + hold + release);
    return when + attack + hold + release + 0.05;
  }
  function osc(type, f, dest, when, stop, detune) {
    const o = audio.ctx.createOscillator();
    o.type = type;
    o.frequency.value = f;
    if (detune) o.detune.value = detune;
    o.connect(dest);
    o.start(when);
    o.stop(stop);
    return o;
  }
  function noiseSrc(dest, when, stop) {
    const n = audio.ctx.createBufferSource();
    n.buffer = audio.noise;
    n.loop = true;
    n.connect(dest);
    n.start(when);
    n.stop(stop);
    return n;
  }

  function voice(patch, dest, f, when, dur, v, bright) {
    const ctx = audio.ctx;
    const g = ctx.createGain();
    g.connect(dest);
    let stop;
    switch (patch) {
      case "pad": {
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 700 + 900 * bright;
        lp.connect(g);
        stop = env(g, when, 0.22 * v, 0.5, Math.max(0, dur - 0.5), 1.1);
        osc("sawtooth", f, lp, when, stop, -8);
        osc("sawtooth", f, lp, when, stop, 8);
        break;
      }
      case "ep":
      case "keys": {
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.22 * v + 0.0002, when + 0.008);
        g.gain.exponentialRampToValueAtTime(0.08 * v + 0.0001, when + Math.min(dur, 0.9));
        g.gain.exponentialRampToValueAtTime(0.0001, when + dur + 0.4);
        stop = when + dur + 0.45;
        osc("sine", f, g, when, stop);
        const h2 = ctx.createGain();
        h2.gain.value = 0.25;
        h2.connect(g);
        osc("sine", f * 2, h2, when, stop);
        break;
      }
      case "bass": {
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 500;
        lp.connect(g);
        stop = env(g, when, 0.34 * v, 0.01, Math.max(0, dur - 0.1), 0.18);
        osc("sine", f, lp, when, stop);
        osc("triangle", f * 2, lp, when, stop);
        break;
      }
      case "pluck": {
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.24 * v + 0.0002, when + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, when + Math.min(1.1, dur + 0.45));
        stop = when + Math.min(1.1, dur + 0.45) + 0.05;
        osc("triangle", f, g, when, stop);
        break;
      }
      default: {
        // marimba, vibes, glock and anything unknown: a struck bar.
        g.gain.setValueAtTime(0.0001, when);
        g.gain.linearRampToValueAtTime(0.26 * v + 0.0002, when + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, when + 0.7);
        stop = when + 0.75;
        osc("sine", f, g, when, stop);
        const h4 = ctx.createGain();
        h4.gain.value = 0.12;
        h4.connect(g);
        osc("sine", f * 4, h4, when, stop);
      }
    }
  }

  function drum(name, dest, when, v) {
    const ctx = audio.ctx;
    const g = ctx.createGain();
    g.connect(dest);
    if (name === "kick" || name === "tom") {
      const o = osc("sine", 140, g, when, when + 0.4);
      o.frequency.setValueAtTime(140, when);
      o.frequency.exponentialRampToValueAtTime(45, when + 0.12);
      env(g, when, 0.8 * v, 0.002, 0.02, 0.3);
    } else {
      const f = ctx.createBiquadFilter();
      f.type = name === "sidestick" || name === "woodblock" ? "bandpass" : "highpass";
      f.frequency.value = name === "sidestick" || name === "woodblock" ? 1900 : 7000;
      f.connect(g);
      noiseSrc(f, when, when + 0.2);
      env(g, when, 0.22 * v, 0.001, 0.005, name === "openhat" ? 0.25 : 0.045);
    }
  }

  function fx(name, dest, send, when, dur, v, pitch) {
    const ctx = audio.ctx;
    const tr = Math.pow(2, pitch / 12);
    const g = ctx.createGain();
    g.connect(dest);
    const wet = ctx.createGain();
    wet.gain.value = 0.35;
    g.connect(wet);
    wet.connect(send);
    const r = rng(Math.floor(when * 1000));
    switch (name) {
      case "tick": {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = 3000 + r() * 1500;
        f.Q.value = 3;
        f.connect(g);
        noiseSrc(f, when, when + 0.06);
        env(g, when, 0.5 * v, 0.001, 0.004, 0.025);
        break;
      }
      case "click": {
        osc("square", 1400, g, when, when + 0.06);
        env(g, when, 0.12 * v, 0.001, 0.005, 0.03);
        break;
      }
      case "ding": {
        osc("sine", 1046.5 * tr, g, when, when + 1.6);
        osc("sine", 1568 * tr, g, when, when + 1.6);
        env(g, when, 0.16 * v, 0.004, 0.02, 1.4);
        break;
      }
      case "chime": {
        [0, 4, 7].forEach((st, i) => {
          const gi = ctx.createGain();
          gi.connect(g);
          const t = when + i * 0.07;
          osc("sine", 1046.5 * tr * Math.pow(2, st / 12), gi, t, t + 1);
          env(gi, t, 0.14 * v, 0.003, 0.01, 0.9);
        });
        g.gain.value = 1;
        break;
      }
      case "sparkle": {
        for (let i = 0; i < 6; i++) {
          const gi = ctx.createGain();
          gi.connect(g);
          const t = when + r() * 0.5;
          osc("sine", 2000 + r() * 2200, gi, t, t + 0.2);
          env(gi, t, 0.07 * v, 0.002, 0.01, 0.12);
        }
        break;
      }
      case "whoosh":
      case "revswell": {
        const f = ctx.createBiquadFilter();
        f.type = "bandpass";
        f.Q.value = 0.8;
        f.frequency.setValueAtTime(300, when);
        f.frequency.exponentialRampToValueAtTime(name === "whoosh" ? 2400 : 3200, when + dur);
        f.connect(g);
        noiseSrc(f, when, when + dur + 0.1);
        g.gain.setValueAtTime(0.0001, when);
        if (name === "whoosh") {
          g.gain.linearRampToValueAtTime(0.3 * v, when + dur * 0.5);
          g.gain.linearRampToValueAtTime(0.0001, when + dur);
        } else {
          g.gain.exponentialRampToValueAtTime(0.28 * v + 0.0002, when + dur);
          g.gain.linearRampToValueAtTime(0.0001, when + dur + 0.06);
        }
        break;
      }
      case "thud": {
        const o = osc("sine", 110, g, when, when + 0.4);
        o.frequency.setValueAtTime(110, when);
        o.frequency.exponentialRampToValueAtTime(45, when + 0.18);
        env(g, when, 0.5 * v, 0.002, 0.02, 0.3);
        break;
      }
      case "boing": {
        const o = osc("sine", 220 * tr, g, when, when + 0.5);
        o.frequency.setValueAtTime(220 * tr, when);
        o.frequency.linearRampToValueAtTime(520 * tr, when + 0.12);
        o.frequency.linearRampToValueAtTime(300 * tr, when + 0.4);
        env(g, when, 0.2 * v, 0.005, 0.05, 0.35);
        break;
      }
      default: {
        // pop, and any name this synth does not know.
        const o = osc("sine", 600 * tr, g, when, when + 0.2);
        o.frequency.setValueAtTime(600 * tr, when);
        o.frequency.exponentialRampToValueAtTime(1200 * tr, when + 0.06);
        env(g, when, 0.3 * v, 0.002, 0.01, 0.12);
      }
    }
  }

  // ── Playback ───────────────────────────────────────────────────────────────
  const state = { t: 0, playing: false, wall0: 0, t0: 0, current: -1 };
  let instances = [];

  function sceneAt(t) {
    for (let i = scenes.length - 1; i >= 0; i--) if (t >= scenes[i].start) return i;
    return 0;
  }

  function renderAt(t) {
    const i = sceneAt(t);
    if (i !== state.current) {
      instances.forEach((inst, k) => { inst.box.style.display = k === i ? "block" : "none"; });
      state.current = i;
    }
    const inst = instances[i];
    inst.def.render.call(inst.def, (Math.min(t, END - 1e-4) - inst.sc.start) / inst.sc.k, inst.kit);
    ui.update(t);
  }

  function now() { return performance.now() / 1000; }

  function play() {
    if (state.t >= END - 0.01) state.t = 0;
    state.playing = true;
    state.wall0 = now();
    state.t0 = state.t;
    startSession(state.t);
    ui.update(state.t);
  }
  function pause() {
    state.playing = false;
    stopSession();
    ui.update(state.t);
  }
  function seek(t) {
    state.t = clamp(t, 0, END);
    state.wall0 = now();
    state.t0 = state.t;
    if (state.playing) startSession(state.t);
    renderAt(state.t);
  }
  function tick() {
    if (state.playing) {
      state.t = state.t0 + (now() - state.wall0);
      if (state.t >= END) {
        state.t = END;
        pause();
      }
      renderAt(state.t);
    }
    requestAnimationFrame(tick);
  }

  async function enableAudio() {
    if (audio.enabled) return;
    if (!audio.ctx && !setupAudio()) return;
    try { await audio.ctx.resume(); } catch (e) { /* stays suspended */ }
    if (audio.ctx.state !== "running") return;
    audio.enabled = true;
    ui.sound();
    if (state.playing) startSession(state.t);
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  const fmt = (t) => {
    const s = Math.max(0, Math.floor(t));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  const ICON = {
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></svg>',
    replay: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L7 6.5l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z" fill="currentColor"/></svg>',
    on: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    off: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    full: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    exit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  // ── Full screen ────────────────────────────────────────────────────────────
  // The Fullscreen API where the browser has it (desktop, Android, iPad), turning a phone to
  // landscape where it allows. iPhone Safari has no Fullscreen API for pages, so inside the
  // course page the player asks the parent to grow the lesson to fill the whole screen instead.
  const embedded = window.parent !== window;
  const root = document.documentElement;
  const fs = {
    native: !!(document.fullscreenEnabled || document.webkitFullscreenEnabled),
    pseudo: false,
    available() { return this.native || embedded; },
    active() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || this.pseudo; },
    async toggle() {
      if (this.native) {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch (e) { /* not locked */ }
          await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          return;
        }
        try {
          await (root.requestFullscreen || root.webkitRequestFullscreen).call(root, { navigationUI: "hide" });
          if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape").catch(() => {});
          return;
        } catch (e) {
          if (!embedded) return; // refused: fall through to the parent page below
        }
      }
      this.pseudo = !this.pseudo;
      window.parent.postMessage({ type: "futures-edge:fullscreen", on: this.pseudo }, location.origin);
      ui.full();
    },
  };
  document.addEventListener("fullscreenchange", () => ui.full());
  document.addEventListener("webkitfullscreenchange", () => ui.full());
  const ui = (() => {
    const bar = h(
      '<div class="fe-ui" role="group" aria-label="Lesson controls">' +
        '<button type="button" class="fe-btn fe-pp" aria-label="Pause"></button>' +
        '<div class="fe-track" role="slider" tabindex="0" aria-label="Lesson position" aria-valuemin="0"><i></i></div>' +
        '<span class="fe-time"></span>' +
        (lines.length ? '<button type="button" class="fe-btn fe-cc" aria-pressed="true" aria-label="Captions">CC</button>' : "") +
        '<button type="button" class="fe-btn fe-snd" aria-label="Turn sound on"></button>' +
        (fs.available() ? '<button type="button" class="fe-btn fe-fs" aria-label="Full screen"></button>' : "") +
      "</div>"
    );
    const hint = h('<button type="button" class="fe-hint">Click anywhere for sound</button>');
    const cap = h('<p class="fe-cap" aria-live="off"></p>');
    document.body.append(cap, bar, hint);
    const cc = bar.querySelector(".fe-cc");
    const fsb = bar.querySelector(".fe-fs");
    if (fsb) fsb.addEventListener("click", (e) => { e.stopPropagation(); fs.toggle(); wake(); });
    let ccOn = true, capText = null;
    if (cc) cc.addEventListener("click", (e) => {
      e.stopPropagation();
      ccOn = !ccOn;
      cc.setAttribute("aria-pressed", String(ccOn));
      capText = null;
      api.update(state.t);
    });
    const pp = bar.querySelector(".fe-pp");
    const trk = bar.querySelector(".fe-track");
    const fill = trk.querySelector("i");
    const time = bar.querySelector(".fe-time");
    const snd = bar.querySelector(".fe-snd");
    trk.setAttribute("aria-valuemax", String(Math.round(END)));
    let idle = 0;
    const wake = () => {
      document.body.classList.remove("fe-idle");
      clearTimeout(idle);
      idle = setTimeout(() => { if (state.playing) document.body.classList.add("fe-idle"); }, 2600);
    };
    document.addEventListener("pointermove", wake);
    pp.addEventListener("click", (e) => { e.stopPropagation(); enableAudio(); state.playing ? pause() : play(); wake(); });
    snd.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!audio.enabled) { await enableAudio(); return; }
      audio.muted = !audio.muted;
      if (audio.muted) stopSession(); else if (state.playing) startSession(state.t);
      api.sound();
    });
    const seekTo = (clientX) => {
      const r = trk.getBoundingClientRect();
      seek(clamp01((clientX - r.left) / r.width) * END);
    };
    let drag = false;
    trk.addEventListener("pointerdown", (e) => { e.stopPropagation(); enableAudio(); drag = true; trk.setPointerCapture(e.pointerId); seekTo(e.clientX); });
    trk.addEventListener("pointermove", (e) => { if (drag) seekTo(e.clientX); });
    trk.addEventListener("pointerup", () => { drag = false; });
    trk.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { seek(state.t + 5); e.preventDefault(); }
      if (e.key === "ArrowLeft") { seek(state.t - 5); e.preventDefault(); }
    });
    // The first click anywhere turns the sound on; later clicks on the lesson pause and resume.
    document.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".fe-ui")) return;
      if (!audio.enabled) { enableAudio(); return; }
      state.playing ? pause() : play();
      wake();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "k") { e.preventDefault(); enableAudio(); state.playing ? pause() : play(); wake(); }
      if ((e.key === "f" || e.key === "F") && fs.available()) { fs.toggle(); wake(); }
      if (e.key === "Escape" && fs.pseudo) fs.toggle();
    });
    const api = {
      update(t) {
        const done = !state.playing && t >= END - 0.01;
        pp.innerHTML = state.playing ? ICON.pause : done ? ICON.replay : ICON.play;
        pp.setAttribute("aria-label", state.playing ? "Pause" : done ? "Replay" : "Play");
        fill.style.width = ((t / END) * 100).toFixed(3) + "%";
        trk.setAttribute("aria-valuenow", String(Math.round(t)));
        time.textContent = fmt(t) + " / " + fmt(END);
        let text = "";
        if (ccOn) for (const l of lines) if (t >= l.t - 0.1 && t < l.t + l.d + 0.4) text = l.text;
        if (text !== capText) {
          capText = text;
          cap.textContent = text;
          cap.hidden = !text;
        }
        if (!state.playing) wake();
      },
      sound() {
        const on = audio.enabled && !audio.muted;
        snd.innerHTML = on ? ICON.on : ICON.off;
        snd.setAttribute("aria-label", on ? "Mute" : "Turn sound on");
        hint.hidden = audio.enabled;
      },
      full() {
        if (!fsb) return;
        const on = fs.active();
        fsb.innerHTML = on ? ICON.exit : ICON.full;
        fsb.setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
      },
    };
    api.sound();
    api.full();
    wake();
    return api;
  })();

  // For tests and frame-by-frame capture: window.lessonPlayer.ready.then(() => { pause(); seek(12.5); }).
  let markReady;
  window.lessonPlayer = {
    duration: END,
    ready: new Promise((r) => { markReady = r; }),
    play, pause, seek,
    time: () => state.t,
    score: () => audio.score,
    // The audio graph, for level checks: music and effects reach `out`, the voice `voiceOut`.
    audioGraph: () => ({ ctx: audio.ctx, out: audio.out, voiceOut: audio.voiceOut }),
    voice: () => ({ lines, loaded: !!audio.voiceBuf, playing: !!(audio.session && audio.session.voice) }),
  };

  // ── Boot ───────────────────────────────────────────────────────────────────
  async function boot() {
    if (F.voice && F.voice.src) {
      audio.voiceData = fetch(F.voice.src).then((r) => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
    }
    try {
      await Promise.all(F.fontChecks.map((f) => document.fonts.load(f)));
    } catch (e) { /* system fonts stand in */ }
    run("shared.js", makeKit(stage, 0, OLD_END));
    for (const sc of scenes) {
      const box = el("div", { class: "fe-scene" });
      stage.append(box);
      const kit = makeKit(box, sc.oldStart, sc.oldDur);
      run("scene-" + sc.id + ".js", kit);
      const def = defs[sc.id];
      if (def && def.init) await def.init.call(def, kit);
      instances.push({ sc, def, box, kit });
    }
    if (modules["score.js"]) run("score.js", makeKit(stage, 0, OLD_END));
    audio.score = recordScore();
    // Wait (briefly) for the images so the first frames do not pop in.
    const imgs = Array.from(stage.querySelectorAll("img"));
    await Promise.race([
      Promise.all(imgs.map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; })))),
      new Promise((r) => setTimeout(r, 4000)),
    ]);
    instances.forEach((inst) => { inst.box.style.display = "none"; });
    renderAt(0);
    document.body.classList.add("fe-ready");
    // A parent page that allows autoplay (iframe allow="autoplay" after a click) gets sound
    // straight away; otherwise the first click turns it on.
    if (setupAudio() && audio.ctx.state === "running") { audio.enabled = true; ui.sound(); }
    play();
    requestAnimationFrame(tick);
    markReady();
  }
  boot().catch((e) => {
    document.querySelector(".fe-loading").textContent = "This lesson could not start. Please reload the page.";
    throw e;
  });
})();

</script>
</body>
</html>
