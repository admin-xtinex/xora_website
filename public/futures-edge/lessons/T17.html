<script>window.FILM = {"id":"T17","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson seventeen","dur":10.5,"k":1,"oldStart":0,"oldDur":10.5},{"id":"hook","name":"The same two areas","dur":16.5,"k":1,"oldStart":10.5,"oldDur":16.5},{"id":"support","name":"Support","dur":23.5,"k":1,"oldStart":27,"oldDur":23.5},{"id":"resist","name":"Resistance","dur":18.68,"k":1.01,"oldStart":50.5,"oldDur":18.5},{"id":"zone","name":"Zones, not lines","dur":38.16,"k":1.59,"oldStart":69,"oldDur":24},{"id":"breakout","name":"Breakout","dur":28.34,"k":1.09,"oldStart":93,"oldDur":26},{"id":"fakeout","name":"Fakeout","dur":26.5,"k":1.06,"oldStart":119,"oldDur":25},{"id":"confirm","name":"What counts as confirmation","dur":25.5,"k":1,"oldStart":144,"oldDur":25.5},{"id":"mistake","name":"Common mistake","dur":22,"k":1,"oldStart":169.5,"oldDur":22},{"id":"try","name":"Try it","dur":26.68,"k":1.16,"oldStart":191.5,"oldDur":23},{"id":"thin","name":"Thin liquidity","dur":23,"k":1,"oldStart":214.5,"oldDur":23},{"id":"risks","name":"Know the limits","dur":22,"k":1,"oldStart":237.5,"oldDur":22},{"id":"recap","name":"Recap","dur":31.5,"k":1,"oldStart":259.5,"oldDur":31.5},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":291,"oldDur":10}],"voice":{"src":"T17/voice.mp3","lines":[{"t":0.6,"d":4.406,"text":"Lesson seventeen: support, resistance, breakout and fakeout.","ml":"പാഠം പതിനേഴ്: support, resistance, breakout, fakeout."},{"t":5.556,"d":3.191,"text":"The price areas traders watch, and how to read them calmly.","ml":"ട്രേഡർമാർ ശ്രദ്ധിക്കുന്ന വില മേഖലകൾ, അവ ശാന്തമായി എങ്ങനെ വായിക്കാം എന്നും."},{"t":11.1,"d":4.078,"text":"In lesson sixteen, you marked swing highs and swing lows on a chart.","ml":"പാഠം പതിനാറിൽ, ചാർട്ടിലെ swing high-കളും swing low-കളും നിങ്ങൾ അടയാളപ്പെടുത്തി."},{"t":16.5,"d":5.194,"text":"Look closely. Price keeps turning back near the same two areas.","ml":"ശ്രദ്ധിച്ച് നോക്കൂ. വില വീണ്ടും വീണ്ടും ഒരേ രണ്ട് മേഖലകൾക്കടുത്ത് തിരിയുന്നു."},{"t":22.244,"d":3.049,"text":"Why does that happen? And what if price finally pushes through?","ml":"അത് എന്തുകൊണ്ടാണ്? ഒടുവിൽ വില അത് കടന്നുപോയാലോ?"},{"t":27.6,"d":4.399,"text":"Support is a price area where falling price has stopped and turned up before.","ml":"Support എന്നാൽ, താഴേക്ക് വന്ന വില മുമ്പ് നിന്ന് മുകളിലേക്ക് തിരിഞ്ഞ ഒരു വില മേഖല."},{"t":33.6,"d":4.034,"text":"Think of a floor. Price drops, lands on it, and bounces.","ml":"ഒരു തറ പോലെ കരുതൂ. വില താഴേക്ക് വീഴുന്നു, തറയിൽ തട്ടുന്നു, തിരിച്ചു പൊങ്ങുന്നു."},{"t":38.2,"d":5.953,"text":"Here, price fell to about 59,850 three times. Each touch is called a test.","ml":"ഇവിടെ വില മൂന്ന് തവണ ഏകദേശം 59,850 വരെ താണു. ഓരോ തൊടലിനെയും test എന്ന് പറയും."},{"t":44.703,"d":4.597,"text":"Buyers stepped in there before. That is all support tells you: what happened before.","ml":"മുമ്പ് അവിടെ വാങ്ങുന്നവർ എത്തി. Support പറയുന്നത് അത്ര മാത്രം: മുമ്പ് എന്ത് സംഭവിച്ചു എന്ന്."},{"t":51.106,"d":4.457,"text":"Resistance is the opposite: an area where rising price has stopped and turned down.","ml":"Resistance നേരെ തിരിച്ചാണ്: മുകളിലേക്ക് പോയ വില നിന്ന് താഴേക്ക് തിരിഞ്ഞ ഒരു മേഖല."},{"t":57.772,"d":3.798,"text":"Like a ceiling. Price climbs, bumps into it, and falls back.","ml":"ഒരു മേൽക്കൂര പോലെ. വില കയറുന്നു, അതിൽ തട്ടുന്നു, തിരിച്ചു വീഴുന്നു."},{"t":63.024,"d":5.712,"text":"Here, rallies stalled near 60,350 twice. Sellers were waiting there before.","ml":"ഇവിടെ രണ്ട് തവണ വില 60,350-ന് അടുത്ത് നിന്നു. മുമ്പ് അവിടെ വിൽക്കുന്നവർ കാത്തുനിന്നിരുന്നു."},{"t":70.134,"d":4.626,"text":"An important detail: support and resistance are zones, not exact lines.","ml":"ഒരു പ്രധാന കാര്യം: support-ഉം resistance-ഉം മേഖലകളാണ്, കൃത്യമായ വരകളല്ല."},{"t":79.356,"d":9.838,"text":"The three lows were 59,830, 59,860 and 59,880. Not one exact price.","ml":"മൂന്ന് low-കൾ 59,830, 59,860, 59,880 ആയിരുന്നു. ഒരൊറ്റ കൃത്യമായ വിലയല്ല."},{"t":89.744,"d":7.747,"text":"So we draw a band from 59,800 to 59,900. That zone is 100 USDT tall.","ml":"അതുകൊണ്ട് 59,800 മുതൽ 59,900 വരെ ഒരു ബാൻഡ് വരയ്ക്കുന്നു. ആ zone-ന്റെ ഉയരം 100 USDT."},{"t":98.04,"d":3.779,"text":"Price can poke into a zone, or a little through it, without anything changing.","ml":"ഒന്നും മാറാതെ തന്നെ വില ഒരു zone-ലേക്ക് കയറാം, അൽപ്പം അതിനപ്പുറവും പോകാം."},{"t":107.994,"d":3.786,"text":"A breakout is when price closes beyond a zone and keeps going.","ml":"വില ഒരു zone-ന് അപ്പുറം close ചെയ്ത് തുടർന്നും മുന്നോട്ട് പോകുന്നതാണ് breakout."},{"t":113.444,"d":5.848,"text":"Our resistance zone runs from 60,300 to 60,400. Watch this candle.","ml":"നമ്മുടെ resistance zone 60,300 മുതൽ 60,400 വരെയാണ്. ഈ candle നോക്കൂ."},{"t":119.842,"d":5.667,"text":"It closes at 60,480: a full 80 USDT above the top of the zone.","ml":"അത് 60,480-ൽ close ചെയ്യുന്നു: zone-ന്റെ മുകളറ്റത്തേക്കാൾ 80 USDT മുകളിൽ."},{"t":126.06,"d":5.023,"text":"Then price comes back to the zone from above. That's a retest. Here, it holds.","ml":"പിന്നെ വില മുകളിൽ നിന്ന് zone-ലേക്ക് തിരിച്ചുവരുന്നു: retest. ഇവിടെ അത് പിടിച്ചുനിൽക്കുന്നു."},{"t":131.633,"d":3.178,"text":"The old ceiling acted like a floor. This time.","ml":"പഴയ മേൽക്കൂര ഒരു തറ പോലെ പ്രവർത്തിച്ചു. ഇത്തവണ മാത്രം."},{"t":136.316,"d":2.301,"text":"Now the same chart, with a different ending.","ml":"ഇനി അതേ ചാർട്ട്, വേറൊരു അവസാനത്തോടെ."},{"t":140.344,"d":5.411,"text":"A fakeout, or false breakout, is when price pokes beyond a zone, then falls back inside.","ml":"വില zone-ന് അപ്പുറം ഒന്ന് തൊട്ട് വീണ്ടും ഉള്ളിലേക്ക് വീഴുന്നതാണ് fakeout, അഥവാ false breakout."},{"t":147.976,"d":7.495,"text":"The wick reaches 60,460, but the candle closes at 60,350, back inside the zone.","ml":"Wick 60,460 വരെ എത്തുന്നു, പക്ഷേ candle 60,350-ൽ, zone-ന്റെ ഉള്ളിൽ തന്നെ close ചെയ്യുന്നു."},{"t":156.021,"d":5.685,"text":"Then price drops toward 60,150. Same past chart, two different futures.","ml":"പിന്നെ വില 60,150-ലേക്ക് താഴുന്നു. ഒരേ പഴയ ചാർട്ട്, രണ്ട് വ്യത്യസ്ത ഭാവികൾ."},{"t":162.78,"d":3.995,"text":"So what counts as confirmation? Evidence that a breakout is holding.","ml":"അപ്പോൾ confirmation എന്താണ്? ഒരു breakout പിടിച്ചുനിൽക്കുന്നു എന്നതിന്റെ തെളിവ്."},{"t":168.18,"d":4.214,"text":"One: a candle closes beyond the zone. A wick alone is not enough.","ml":"ഒന്ന്: ഒരു candle zone-ന് അപ്പുറം close ചെയ്യണം. ഒരു wick മാത്രം പോരാ."},{"t":173.38,"d":2.868,"text":"Two: the next candles stay beyond it, too.","ml":"രണ്ട്: അടുത്ത candles-ഉം അതിനപ്പുറം തന്നെ നിൽക്കണം."},{"t":176.98,"d":3.835,"text":"Three: if price comes back for a retest, the zone holds.","ml":"മൂന്ന്: വില retest-ന് തിരിച്ചുവന്നാൽ, zone പിടിച്ചുനിൽക്കണം."},{"t":181.58,"d":3.83,"text":"Confirmation makes a breakout more believable. It never makes it certain.","ml":"Confirmation ഒരു breakout-നെ കൂടുതൽ വിശ്വസനീയമാക്കും. ഒരിക്കലും ഉറപ്പാക്കില്ല."},{"t":188.28,"d":4.409,"text":"A common mistake: drawing one exact line and expecting price to obey it.","ml":"ഒരു സാധാരണ തെറ്റ്: ഒരൊറ്റ കൃത്യമായ വര വരച്ച് വില അത് അനുസരിക്കുമെന്ന് കരുതുന്നത്."},{"t":194.08,"d":2.486,"text":"Or jumping in the moment a wick crosses that line.","ml":"അല്ലെങ്കിൽ ഒരു wick ആ വര കടക്കുന്ന നിമിഷം തന്നെ ചാടിക്കയറുന്നത്."},{"t":198.28,"d":5.473,"text":"The fix: draw zones, wait for candles to close, and treat every level as a maybe.","ml":"പരിഹാരം: zone-കൾ വരയ്ക്കുക, candle close-ന് കാത്തിരിക്കുക, ഓരോ ലെവലും ഒരു 'ഒരുപക്ഷേ' മാത്രം."},{"t":204.48,"d":3.325,"text":"And WAIT is always allowed. You never have to act on a level.","ml":"WAIT എപ്പോഴും അനുവദനീയമാണ്. ഒരു ലെവൽ കണ്ട് നിർബന്ധമായും എന്തെങ്കിലും ചെയ്യേണ്ടതില്ല."},{"t":210.376,"d":4.867,"text":"Your turn. The resistance zone is 60,300 to 60,400.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. Resistance zone 60,300 മുതൽ 60,400 വരെ."},{"t":215.793,"d":7.534,"text":"The last candle wicked to 60,450 but closed at 60,380. Is the breakout confirmed?","ml":"അവസാന candle-ന്റെ wick 60,450 വരെ പോയി, പക്ഷേ 60,380-ൽ close ചെയ്തു. Breakout confirm ആയോ?"},{"t":223.878,"d":5.942,"text":"Not yet. The close, 60,380, is still 20 USDT inside the zone.","ml":"ഇതുവരെ ഇല്ല. Close 60,380 ഇപ്പോഴും zone-ന്റെ 20 USDT ഉള്ളിലാണ്."},{"t":230.369,"d":4.166,"text":"A sensible choice here is WAIT, and watch where the next candle closes.","ml":"ഇവിടെ നല്ല തീരുമാനം WAIT ആണ്. അടുത്ത candle എവിടെ close ചെയ്യുന്നു എന്ന് നോക്കുക."},{"t":236.96,"d":4.203,"text":"One more warning. Liquidity means how many orders are waiting near the price.","ml":"ഒരു മുന്നറിയിപ്പ് കൂടി. വിലയ്ക്കടുത്ത് എത്ര ഓർഡറുകൾ കാത്തിരിക്കുന്നു എന്നതാണ് liquidity."},{"t":243.16,"d":3.52,"text":"When liquidity is thin, only a few small orders are waiting.","ml":"Liquidity കുറവാകുമ്പോൾ, കുറച്ച് ചെറിയ ഓർഡറുകൾ മാത്രമേ കാത്തിരിക്കുന്നുള്ളൂ."},{"t":247.96,"d":4.58,"text":"Then one larger order can jump price through a zone, and it snaps back moments later.","ml":"അപ്പോൾ ഒരു വലിയ ഓർഡർ വിലയെ zone കടത്തി ചാടിക്കാം, നിമിഷങ്ങൾക്കകം അത് തിരിച്ചുവരും."},{"t":254.56,"d":2.891,"text":"It looked like a breakout. It was just a thin market.","ml":"ഒരു breakout പോലെ തോന്നി. പക്ഷേ അത് liquidity കുറഞ്ഞ മാർക്കറ്റ് മാത്രമായിരുന്നു."},{"t":259.96,"d":2.479,"text":"Before you use any of this, know the limits.","ml":"ഇതൊക്കെ ഉപയോഗിക്കുന്നതിന് മുമ്പ്, ഇതിന്റെ പരിധികൾ അറിയുക."},{"t":263.76,"d":3.928,"text":"Lines come from past prices. They promise nothing about the future.","ml":"വരകൾ പഴയ വിലകളിൽ നിന്നാണ് വരുന്നത്. ഭാവിയെക്കുറിച്ച് അവ ഒന്നും ഉറപ്പ് തരുന്നില്ല."},{"t":269.16,"d":4.136,"text":"Fakeouts are common, thin markets can fake a breakout, and stops can slip.","ml":"Fakeout-കൾ സാധാരണം. നേർത്ത മാർക്കറ്റ് breakout പോലെ തോന്നിക്കാം. Stop-കൾ slip ആകാം."},{"t":275.16,"d":4.165,"text":"Losses are always possible. WAIT is a decision, not a failure.","ml":"നഷ്ടം എപ്പോഴും സംഭവിക്കാം. WAIT ഒരു തീരുമാനമാണ്, പരാജയമല്ല."},{"t":281.96,"d":0.743,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":283.76,"d":4.406,"text":"Support and resistance are zones where price turned before. Not walls.","ml":"Support-ഉം resistance-ഉം മുമ്പ് വില തിരിഞ്ഞ മേഖലകളാണ്. മതിലുകളല്ല."},{"t":289.36,"d":4.613,"text":"A breakout closes beyond a zone and holds. A fakeout falls back inside.","ml":"Breakout zone-ന് അപ്പുറം close ചെയ്ത് പിടിച്ചുനിൽക്കും. Fakeout തിരിച്ച് ഉള്ളിലേക്ക് വീഴും."},{"t":294.96,"d":4.544,"text":"Confirmation is evidence, not certainty. WAIT is always allowed.","ml":"Confirmation തെളിവാണ്, ഉറപ്പല്ല. WAIT എപ്പോഴും അനുവദനീയമാണ്."},{"t":300.56,"d":5.444,"text":"Check yourself: a wick crosses resistance, but the candle closes inside. Breakout?","ml":"സ്വയം പരിശോധിക്കൂ: wick resistance കടന്നു, പക്ഷേ candle ഉള്ളിൽ close ചെയ്തു. Breakout ആണോ?"},{"t":306.86,"d":3.88,"text":"Not confirmed. It could be a fakeout. Wait for a close beyond the zone.","ml":"Confirm ആയിട്ടില്ല. അതൊരു fakeout ആകാം. Zone-ന് അപ്പുറം ഒരു close വരെ കാത്തിരിക്കുക."},{"t":313.46,"d":5.501,"text":"Well done! Next up: volume, volatility and range. See you in lesson eighteen.","ml":"നന്നായി! അടുത്തത്: volume, volatility, range. പാഠം പതിനെട്ടിൽ കാണാം."}]},"assetBase":"T17/assets/","assets":{"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"xtinex-x.png":{"mime":"image/png","w":320,"h":205}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T17 captions, written as a warm tutor speaking; each line starts at film time t (seconds). Can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson seventeen: support, resistance, breakout and fakeout.\"\n    },\n    {\n      \"t\": 5.4,\n      \"text\": \"The price areas traders watch, and how to read them calmly.\"\n    },\n    {\n      \"t\": 11.1,\n      \"text\": \"In lesson sixteen, you marked swing highs and swing lows on a chart.\"\n    },\n    {\n      \"t\": 16.5,\n      \"text\": \"Look closely. Price keeps turning back near the same two areas.\"\n    },\n    {\n      \"t\": 21.5,\n      \"text\": \"Why does that happen? And what if price finally pushes through?\"\n    },\n    {\n      \"t\": 27.6,\n      \"text\": \"Support is a price area where falling price has stopped and turned up before.\"\n    },\n    {\n      \"t\": 33.6,\n      \"text\": \"Think of a floor. Price drops, lands on it, and bounces.\"\n    },\n    {\n      \"t\": 38.2,\n      \"text\": \"Here, price fell to about 59,850 three times. Each touch is called a test.\"\n    },\n    {\n      \"t\": 43.9,\n      \"text\": \"Buyers stepped in there before. That is all support tells you: what happened before.\"\n    },\n    {\n      \"t\": 51.1,\n      \"text\": \"Resistance is the opposite: an area where rising price has stopped and turned down.\"\n    },\n    {\n      \"t\": 57.7,\n      \"text\": \"Like a ceiling. Price climbs, bumps into it, and falls back.\"\n    },\n    {\n      \"t\": 62.9,\n      \"text\": \"Here, rallies stalled near 60,350 twice. Sellers were waiting there before.\"\n    },\n    {\n      \"t\": 69.6,\n      \"text\": \"An important detail: support and resistance are zones, not exact lines.\"\n    },\n    {\n      \"t\": 75.4,\n      \"text\": \"The three lows were 59,830, 59,860 and 59,880. Not one exact price.\"\n    },\n    {\n      \"t\": 81,\n      \"text\": \"So we draw a band from 59,800 to 59,900. That zone is 100 USDT tall.\"\n    },\n    {\n      \"t\": 86.6,\n      \"text\": \"Price can poke into a zone, or a little through it, without anything changing.\"\n    },\n    {\n      \"t\": 93.6,\n      \"text\": \"A breakout is when price closes beyond a zone and keeps going.\"\n    },\n    {\n      \"t\": 98.6,\n      \"text\": \"Our resistance zone runs from 60,300 to 60,400. Watch this candle.\"\n    },\n    {\n      \"t\": 103.8,\n      \"text\": \"It closes at 60,480: a full 80 USDT above the top of the zone.\"\n    },\n    {\n      \"t\": 108.8,\n      \"text\": \"Then price comes back to the zone from above. That's a retest. Here, it holds.\"\n    },\n    {\n      \"t\": 114.8,\n      \"text\": \"The old ceiling acted like a floor. This time.\"\n    },\n    {\n      \"t\": 119.6,\n      \"text\": \"Now the same chart, with a different ending.\"\n    },\n    {\n      \"t\": 123.4,\n      \"text\": \"A fakeout, or false breakout, is when price pokes beyond a zone, then falls back inside.\"\n    },\n    {\n      \"t\": 130.6,\n      \"text\": \"The wick reaches 60,460, but the candle closes at 60,350, back inside the zone.\"\n    },\n    {\n      \"t\": 137.6,\n      \"text\": \"Then price drops toward 60,150. Same past chart, two different futures.\"\n    },\n    {\n      \"t\": 144.6,\n      \"text\": \"So what counts as confirmation? Evidence that a breakout is holding.\"\n    },\n    {\n      \"t\": 150,\n      \"text\": \"One: a candle closes beyond the zone. A wick alone is not enough.\"\n    },\n    {\n      \"t\": 155.2,\n      \"text\": \"Two: the next candles stay beyond it, too.\"\n    },\n    {\n      \"t\": 158.8,\n      \"text\": \"Three: if price comes back for a retest, the zone holds.\"\n    },\n    {\n      \"t\": 163.4,\n      \"text\": \"Confirmation makes a breakout more believable. It never makes it certain.\"\n    },\n    {\n      \"t\": 170.1,\n      \"text\": \"A common mistake: drawing one exact line and expecting price to obey it.\"\n    },\n    {\n      \"t\": 175.9,\n      \"text\": \"Or jumping in the moment a wick crosses that line.\"\n    },\n    {\n      \"t\": 180.1,\n      \"text\": \"The fix: draw zones, wait for candles to close, and treat every level as a maybe.\"\n    },\n    {\n      \"t\": 186.3,\n      \"text\": \"And WAIT is always allowed. You never have to act on a level.\"\n    },\n    {\n      \"t\": 192.1,\n      \"text\": \"Your turn. The resistance zone is 60,300 to 60,400.\"\n    },\n    {\n      \"t\": 196.3,\n      \"text\": \"The last candle wicked to 60,450 but closed at 60,380. Is the breakout confirmed?\"\n    },\n    {\n      \"t\": 202.5,\n      \"text\": \"Not yet. The close, 60,380, is still 20 USDT inside the zone.\"\n    },\n    {\n      \"t\": 208.1,\n      \"text\": \"A sensible choice here is WAIT, and watch where the next candle closes.\"\n    },\n    {\n      \"t\": 215.1,\n      \"text\": \"One more warning. Liquidity means how many orders are waiting near the price.\"\n    },\n    {\n      \"t\": 221.3,\n      \"text\": \"When liquidity is thin, only a few small orders are waiting.\"\n    },\n    {\n      \"t\": 226.1,\n      \"text\": \"Then one larger order can jump price through a zone, and it snaps back moments later.\"\n    },\n    {\n      \"t\": 232.7,\n      \"text\": \"It looked like a breakout. It was just a thin market.\"\n    },\n    {\n      \"t\": 238.1,\n      \"text\": \"Before you use any of this, know the limits.\"\n    },\n    {\n      \"t\": 241.9,\n      \"text\": \"Lines come from past prices. They promise nothing about the future.\"\n    },\n    {\n      \"t\": 247.3,\n      \"text\": \"Fakeouts are common, thin markets can fake a breakout, and stops can slip.\"\n    },\n    {\n      \"t\": 253.3,\n      \"text\": \"Losses are always possible. WAIT is a decision, not a failure.\"\n    },\n    {\n      \"t\": 260.1,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 261.9,\n      \"text\": \"Support and resistance are zones where price turned before. Not walls.\"\n    },\n    {\n      \"t\": 267.5,\n      \"text\": \"A breakout closes beyond a zone and holds. A fakeout falls back inside.\"\n    },\n    {\n      \"t\": 273.1,\n      \"text\": \"Confirmation is evidence, not certainty. WAIT is always allowed.\"\n    },\n    {\n      \"t\": 278.7,\n      \"text\": \"Check yourself: a wick crosses resistance, but the candle closes inside. Breakout?\"\n    },\n    {\n      \"t\": 285,\n      \"text\": \"Not confirmed. It could be a fakeout. Wait for a close beyond the zone.\"\n    },\n    {\n      \"t\": 291.6,\n      \"text\": \"Well done! Next up: volume, volatility and range. See you in lesson eighteen.\"\n    }\n  ]\n}\n","scene-breakout.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Breakout branch: close 60,480 above the 60,300–60,400 zone, then a retest (low 60,390) that holds.\nconst BO = UI.SR, BO_C = BO.PRE.concat(BO.UP);\n// Forming windows [start, end, keys] for the last four candles.\nconst BO_F = [\n  [6.4, 10.6, [[6.4, 60310], [7.3, 60290], [8.5, 60410], [9.6, 60500], [10.6, 60480]]],\n  [12.6, 14.2, [[12.6, 60480], [13.1, 60460], [13.7, 60560], [14.2, 60530]]],\n  [15.8, 18.6, [[15.8, 60530], [16.3, 60540], [17.4, 60390], [18.6, 60460]]],\n  [19.4, 21.2, [[19.4, 60460], [19.8, 60450], [20.7, 60610], [21.2, 60590]]],\n];\nkit.scene('breakout', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'bo-c', BO_C.length);\n    const row = (a, v, cls) => '<div class=\"row bo-r\"><span>' + a + '</span><span class=\"mono ' + (cls || '') + '\" style=\"font-size:34px\">' + v + '</span></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"bo-grid\">' + UI.grid(170, 1240, BO.y, 60000, 60600, 100) + '</g>' +\n      '<rect class=\"bo-zone\" x=\"170\" y=\"' + BO.y(60400).toFixed(1) + '\" width=\"1070\" height=\"' + (BO.y(60300) - BO.y(60400)).toFixed(1) + '\" rx=\"8\" style=\"stroke-width:2\"/>' +\n      this.cd.html +\n      '<circle class=\"bo-ring\" cx=\"' + BO.x(11) + '\" cy=\"' + BO.y(60390).toFixed(1) + '\" r=\"24\" fill=\"none\" stroke-width=\"4\" style=\"stroke:var(--main)\"/></svg>' +\n      '<p class=\"tag bo-zl\" style=\"left:186px;top:' + (BO.y(60400) - 52).toFixed(0) + 'px;color:var(--accent);border-color:var(--accent)\">Resistance 60,300–60,400</p>' +\n      '<p class=\"tag bo-zl2\" style=\"left:186px;top:' + (BO.y(60400) - 52).toFixed(0) + 'px;color:var(--main);border-color:var(--main)\">Old ceiling, now a floor</p>' +\n      '<p class=\"tag bo-cl\" style=\"left:' + (BO.x(9) - 160) + 'px;top:' + (BO.y(60480) - 70).toFixed(0) + 'px;color:var(--up);border-color:var(--up)\">Close 60,480</p>' +\n      '<p class=\"tag bo-rt\" style=\"left:' + (BO.x(11) - 70) + 'px;top:' + (BO.y(60390) + 34).toFixed(0) + 'px;color:var(--main);border-color:var(--main)\">Retest held</p>' +\n      '<p class=\"fict\" style=\"position:absolute;left:170px;top:300px;margin:0\">BTC/USDT · 1-minute candles · fictional</p>' +\n      '<div class=\"glass bo-pan\" style=\"left:1380px;top:330px;width:350px;padding:16px 28px\">' +\n      row('Zone top', '60,400') + row('Close', '60,480', 'up') + '<div class=\"row bo-r\" style=\"border:0\"><span>Beyond by</span><span class=\"mono up\" style=\"font-size:34px\">+80</span></div>' +\n      '<p class=\"mono bo-r\" style=\"margin:2px 0 4px;font-size:22px;color:color-mix(in srgb, var(--second) 60%, var(--ground))\">60,480 − 60,400 = 80 USDT</p></div>' +\n      '<div class=\"words\" style=\"left:140px;top:160px;width:1500px\"><p class=\"kick bo-k\">Breakout</p>' +\n      '<h2 class=\"line bo-t\">Close beyond, and keep going</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.bo-k').style; this.t = q('.bo-t'); this.grid = q('.bo-grid').style; this.zone = q('.bo-zone').style;\n    this.zl = q('.bo-zl').style; this.zl2 = q('.bo-zl2').style; this.cl = q('.bo-cl').style; this.rt = q('.bo-rt').style; this.ring = q('.bo-ring').style;\n    this.pan = q('.bo-pan').style; this.rows = all('.bo-r').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'calm' }, { t: 0.5, pose: 'explain' }, { t: 5.6, pose: 'magnify' }, { t: 10.8, pose: 'thumbs' }, { t: 15.8, pose: 'point', flip: true }, { t: 21.8, pose: 'idea' }],\n      says: [{ t0: 22.0, t1: 25.6, text: 'This time!' }],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.3, 0.9));\n    BO_C.forEach((c, i) => {\n      if (i < 9) {\n        const a = 0.8 + i * 0.4, p = seg(t, a, a + 0.5);\n        this.cd.set(i, { x: BO.x(i), w: 46, o: c[0], h: c[1], l: c[2], c: lerp(c[0], c[3], eo(p)), y: BO.y, op: eo(seg(t, a, a + 0.25)) });\n      } else {\n        const f = BO_F[i - 9];\n        const k = t >= f[1] ? { o: c[0], h: c[1], l: c[2], c: c[3] } : UI.forming(f[2], c[2], c[1], t);\n        this.cd.set(i, { x: BO.x(i), w: 46, o: k.o, h: k.h, l: k.l, c: k.c, y: BO.y, live: !!k.live, op: eo(seg(t, f[0] - 0.2, f[0] + 0.1)) });\n      }\n    });\n    // The zone: violet resistance, turning cyan once the retest has held.\n    const z = seg(t, 5.6, 6.3), flip = eio(seg(t, 21.8, 22.8));\n    this.zone.opacity = eo(z);\n    this.zone.fill = 'color-mix(in srgb, ' + (flip > 0.5 ? 'var(--main)' : 'var(--accent)') + ' ' + (20 + 14 * Math.sin(Math.PI * seg(t, 10.6, 11.6))).toFixed(0) + '%, transparent)';\n    this.zone.stroke = flip > 0.5 ? 'color-mix(in srgb, var(--main) 70%, transparent)' : 'color-mix(in srgb, var(--accent) 75%, transparent)';\n    this.zl.opacity = eo(seg(t, 5.9, 6.4)) * (1 - flip); this.zl2.opacity = flip;\n    UI.rise(this.cl, t, 10.8, { dy: 14 });\n    UI.rise(this.pan, t, 10.8);\n    this.rows.forEach((s, i) => { const a = 11.0 + i * 0.6; s.opacity = eo(seg(t, a, a + 0.4)); });\n    const r = seg(t, 18.6, 19.2);\n    this.ring.opacity = eo(r); this.ring.transformBox = 'fill-box'; this.ring.transformOrigin = 'center'; this.ring.transform = 'scale(' + lerp(1.8, 1, eob(r, 1.5)).toFixed(3) + ')';\n    UI.rise(this.rt, t, 18.8, { dy: 14 });\n    this.tutor.render(t);\n  },\n});\n","scene-confirm.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Fictional candles against the 60,300–60,400 zone; each one adds (or fails to add) evidence.\nconst CF_C = [[60310, 60460, 60290, 60350], [60350, 60500, 60340, 60480], [60480, 60550, 60460, 60530], [60530, 60580, 60500, 60560], [60560, 60570, 60390, 60500]];\nconst CF_AT = [6.2, 8.4, 11.4, 12.2, 15.0];\nconst CF_OK = [0, 1, 1, 1, 1];\nconst cfX = (i) => 1060 + i * 105, cfY = (p) => 740 - (p - 60200) / 400 * 340;\nconst CF_ITEMS = ['A close beyond the zone, not just a wick', 'The next candles stay beyond it', 'A retest of the zone holds'];\nconst CF_IT = [8.6, 12.4, 15.4];\nconst CF_FILL = [[6.0, 0], [9.0, 0.24], [12.8, 0.48], [15.8, 0.7]];\nkit.scene('confirm', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'cf-c', CF_C.length);\n    let marks = '';\n    CF_C.forEach((c, i) => {\n      const x = cfX(i), y = cfY(c[1]) - 42, ok = CF_OK[i], col = ok ? 'var(--up)' : 'var(--down)';\n      marks += '<g transform=\"translate(' + x + ' ' + y.toFixed(1) + ')\"><g class=\"cf-m\"><circle r=\"20\" stroke-width=\"3\" style=\"fill:color-mix(in srgb, var(--ground) 70%, ' + col + ');stroke:' + col + '\"/>' +\n        (ok ? '<path d=\"M-9 1 L-3 7 L9 -6\" fill=\"none\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--second)\"/>' : '<path d=\"M-7 -7 L7 7 M7 -7 L-7 7\" fill=\"none\" stroke-width=\"4\" stroke-linecap=\"round\" style=\"stroke:var(--second)\"/>') + '</g></g>';\n    });\n    let items = '';\n    CF_ITEMS.forEach((s, i) => {\n      items += '<div class=\"c
