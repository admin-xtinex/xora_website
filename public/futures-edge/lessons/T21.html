<script>window.FILM = {"id":"T21","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson twenty-one","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"Same past, three futures","dur":28.75,"k":1.15,"oldStart":8,"oldDur":25},{"id":"confirm","name":"What confirmation is","dur":26,"k":1,"oldStart":33,"oldDur":26},{"id":"weak","name":"Weak or conflicting","dur":26,"k":1,"oldStart":59,"oldDur":26},{"id":"fakeout","name":"A false breakout","dur":60.84,"k":2.34,"oldStart":85,"oldDur":26},{"id":"fade","name":"Momentum fade","dur":27.12,"k":1.13,"oldStart":111,"oldDur":24},{"id":"hindsight","name":"Hindsight bias","dur":26,"k":1,"oldStart":135,"oldDur":26},{"id":"notrade","name":"NO_TRADE is a decision","dur":28,"k":1,"oldStart":161,"oldDur":28},{"id":"mistake","name":"Judging by outcome","dur":25,"k":1,"oldStart":189,"oldDur":25},{"id":"try","name":"Try it","dur":37.4,"k":1.1,"oldStart":214,"oldDur":34},{"id":"risks","name":"Know the limits","dur":26.4,"k":1.1,"oldStart":248,"oldDur":24},{"id":"recap","name":"Recap","dur":61.76,"k":1.93,"oldStart":272,"oldDur":32},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":304,"oldDur":10}],"voice":{"src":"T21/voice.mp3","lines":[{"t":0.6,"d":6.19,"text":"Lesson twenty-one: confirmation, false signals and NO_TRADE. Why waiting is a decision too.","ml":"ഇരുപത്തിയൊന്നാം പാഠം: confirmation, false signals, NO_TRADE. കാത്തിരിക്കുന്നതും ഒരു തീരുമാനമാണ്."},{"t":8.46,"d":6.051,"text":"Here's a fictional BTC chart. Twice, price climbed to about 60,000 and turned back down.","ml":"ഇതാ ഒരു സാങ്കൽപ്പിക BTC ചാർട്ട്. രണ്ടു തവണ വില ഏകദേശം 60,000 വരെ കയറി, പിന്നെ തിരിച്ചിറങ്ങി."},{"t":16.28,"d":6.71,"text":"Now it's back near that zone, at 59,970. Tempting to think: this time it breaks out!","ml":"ഇപ്പോൾ വില വീണ്ടും ആ zone-ന് അടുത്ത്, 59,970-ൽ. ഇത്തവണ breakout ഉറപ്പാണെന്ന് തോന്നാം!"},{"t":23.87,"d":8.19,"text":"But from this same past, price could break out to 60,350, drift sideways, or fall to 59,650.","ml":"പക്ഷേ ഇതേ കഴിഞ്ഞകാലത്തിൽ നിന്ന് വില 60,350-ലേക്ക് കയറാം, sideways പോകാം, 59,650-ലേക്ക് വീഴാം."},{"t":32.61,"d":3.721,"text":"Nobody knows in advance which one will happen.","ml":"ഇതിൽ ഏതാണ് സംഭവിക്കുക എന്ന് ആർക്കും മുൻകൂട്ടി അറിയില്ല."},{"t":37.15,"d":2.462,"text":"Confirmation is extra evidence, after a signal, that supports an idea. You met it in T17.","ml":"ഒരു സിഗ്നലിന് ശേഷം, ആശയത്തെ പിന്തുണയ്ക്കുന്ന അധിക തെളിവാണ് confirmation. T17-ൽ ഇത് കണ്ടു."},{"t":44.15,"d":5.855,"text":"For a breakout: a candle closes beyond the zone, and the next candles hold there.","ml":"ഒരു breakout-ന്: ഒരു candle zone-ന് അപ്പുറം close ചെയ്യണം, അടുത്ത candles അവിടെ നിൽക്കണം."},{"t":50.555,"d":4.431,"text":"Think of dark clouds. They make rain more likely, but don't promise it.","ml":"കാർമേഘങ്ങളെ ഓർക്കൂ. മഴയ്ക്കുള്ള സാധ്യത കൂട്ടും, പക്ഷേ മഴ ഉറപ്പ് തരില്ല."},{"t":55.95,"d":4.286,"text":"Confirmation can raise or lower the odds. It cannot tell you what the next candle will do.","ml":"Confirmation സാധ്യത കൂട്ടാം, കുറയ്ക്കാം. അടുത്ത candle എന്ത് ചെയ്യുമെന്ന് പറയാനാവില്ല."},{"t":63.15,"d":4.999,"text":"Not all evidence is equal. Weak evidence is small or easy to fake, like one wick above a level.","ml":"തെളിവുകൾ ഒരുപോലെയല്ല. ദുർബല തെളിവ് ചെറുതാണ്, എളുപ്പം വ്യാജമാകാം: level-ന് മുകളിലെ ഒരു wick പോലെ."},{"t":70.35,"d":5.616,"text":"Conflicting evidence points in different directions at the same time.","ml":"വിരുദ്ധ തെളിവുകൾ ഒരേ സമയം പല ദിശകളിലേക്ക് ചൂണ്ടുന്നു."},{"t":76.516,"d":3.3,"text":"Here, the trend leans up, but price is under resistance and volume is fading.","ml":"ഇവിടെ ട്രെൻഡ് മുകളിലേക്ക് ചായുന്നു, പക്ഷേ വില resistance-ന് താഴെ, volume കുറയുന്നു."},{"t":81.95,"d":4.224,"text":"When evidence is weak or mixed, the scale doesn't tip. That's a reason for NO_TRADE.","ml":"തെളിവ് ദുർബലമോ കലർന്നതോ ആണെങ്കിൽ, തുലാസ് ചായില്ല. അത് NO_TRADE-നുള്ള ഒരു കാരണമാണ്."},{"t":89.686,"d":4.81,"text":"A false signal looks real but doesn't follow through. A false breakout is the classic one.","ml":"False signal ശരിയെന്ന് തോന്നും, പക്ഷേ തുടർന്ന് നടക്കില്ല. False breakout ആണ് സാധാരണ ഉദാഹരണം."},{"t":106.066,"d":5.135,"text":"Watch this candle. It pokes up to 60,090, above the zone, then closes at 59,960, back below.","ml":"ഈ candle നോക്കൂ. zone-ന് മുകളിൽ 60,090 വരെ പോകുന്നു, പിന്നെ താഴെ 59,960-ൽ close ചെയ്യുന്നു."},{"t":122.914,"d":8.45,"text":"Say someone bought 0.01 BTC at 60,060 on that poke. At the close: −1.00 USDT, before fees.","ml":"ആ കയറ്റത്തിൽ ഒരാൾ 60,060-ന് 0.01 BTC buy ചെയ്തെന്ന് കരുതുക. Close-ൽ: −1.00 USDT, ഫീസിന് മുമ്പ്."},{"t":139.762,"d":9.393,"text":"A wick above a level is not a close above it.","ml":"ഒരു level-ന് മുകളിലെ wick, അതിന് മുകളിലെ close അല്ല."},{"t":150.042,"d":2.514,"text":"Momentum is how strongly price is moving. A fade is when each push gets smaller.","ml":"വില എത്ര ശക്തമായി നീങ്ങുന്നു എന്നതാണ് momentum. ഓരോ കയറ്റവും ചെറുതാകുന്നതാണ് fade."},{"t":157.048,"d":5.178,"text":"Like a ball rolled uphill: it keeps going for a while, but slower and slower.","ml":"കയറ്റത്തിലേക്ക് ഉരുട്ടിയ പന്ത് പോലെ: കുറച്ചുനേരം പോകും, പക്ഷേ പതുക്കെ പതുക്കെ."},{"t":163.828,"d":4.307,"text":"Here, four green candles gain 80, then 50, then 25, then only 10 USDT.","ml":"ഇവിടെ നാല് പച്ച candles നേടുന്നത് 80, പിന്നെ 50, പിന്നെ 25, പിന്നെ 10 USDT മാത്രം."},{"t":170.156,"d":6.096,"text":"A fade is a warning sign, not proof. Price can fade, then push on again.","ml":"Fade ഒരു മുന്നറിയിപ്പാണ്, തെളിവല്ല. വില fade ആയ ശേഷം വീണ്ടും കയറാം."},{"t":177.11,"d":4.722,"text":"Hindsight bias: after you see what happened, it feels like it was obvious all along.","ml":"Hindsight bias: എന്ത് സംഭവിച്ചു എന്ന് കണ്ടശേഷം, അത് ആദ്യം മുതലേ വ്യക്തമായിരുന്നു എന്ന് തോന്നും."},{"t":183.71,"d":4.517,"text":"Looking back at this chart, the breakout seems certain. Of course it went up!","ml":"ഈ ചാർട്ട് തിരിഞ്ഞുനോക്കുമ്പോൾ breakout ഉറപ്പായിരുന്നു എന്ന് തോന്നും. വില കയറുമെന്ന് വ്യക്തമല്ലേ!"},{"t":189.91,"d":4.054,"text":"But at decision time, the right side was hidden. You only had this.","ml":"പക്ഷേ തീരുമാനമെടുക്കുന്ന സമയത്ത് വലതുവശം മറഞ്ഞിരുന്നു. നിങ്ങളുടെ മുന്നിൽ ഇത് മാത്രം."},{"t":195.51,"d":3.859,"text":"Old charts look clearer than live ones. Judge a decision by what was known at the time.","ml":"പഴയ ചാർട്ടുകൾ live ചാർട്ടിനേക്കാൾ വ്യക്തമായി തോന്നും. അന്ന് അറിഞ്ഞത് വെച്ച് വിലയിരുത്തുക."},{"t":203.11,"d":4.879,"text":"NO_TRADE means you looked, and decided not to open a position. It's an active choice.","ml":"NO_TRADE: നിങ്ങൾ നോക്കി, position തുറക്കേണ്ട എന്ന് തീരുമാനിച്ചു. അതൊരു സജീവ തീരുമാനമാണ്."},{"t":209.71,"d":5.299,"text":"Like a batter leaving a ball outside off stump. You don't have to play every ball.","ml":"Off stump-ന് പുറത്തുള്ള പന്ത് വിട്ടുകളയുന്ന ബാറ്ററെപ്പോലെ. എല്ലാ പന്തും കളിക്കേണ്ടതില്ല."},{"t":216.31,"d":4.192,"text":"Write down what you'd need to see. For example: a 5-minute close above 60,050, then a hold.","ml":"എന്ത് കാണണമെന്ന് എഴുതുക. ഉദാഹരണം: 60,050-ന് മുകളിൽ ഒരു 5-minute close, പിന്നെ അവിടെ നിൽക്കൽ."},{"t":223.31,"d":6.326,"text":"Until then: NO_TRADE. No fees, no new risk. At most, you miss a move.","ml":"അതുവരെ: NO_TRADE. ഫീസില്ല, പുതിയ റിസ്കില്ല. പരമാവധി, ഒരു നീക്കം നഷ്ടമാകും."},{"t":231.11,"d":5.543,"text":"A common mistake: judging a decision only by what happened next.","ml":"ഒരു സാധാരണ തെറ്റ്: അടുത്തത് എന്ത് സംഭവിച്ചു എന്നത് മാത്രം നോക്കി തീരുമാനം വിലയിരുത്തുക."},{"t":237.203,"d":3.639,"text":"You waited, then price went up. Was waiting wrong? Not if the evidence was weak.","ml":"നിങ്ങൾ wait ചെയ്തു, പിന്നെ വില കയറി. കാത്തിരുന്നത് തെറ്റായോ? തെളിവ് ദുർബലമായിരുന്നെങ്കിൽ, ഇല്ല."},{"t":242.91,"d":4.294,"text":"A good decision can have a bad outcome, and a bad one can get lucky.","ml":"നല്ല തീരുമാനത്തിന് മോശം ഫലം വരാം, മോശം തീരുമാനത്തിന് ഭാഗ്യം കിട്ടാം."},{"t":248.31,"d":3.879,"text":"So review your reasons, not just the result. Was the evidence clear, or were you guessing?","ml":"ഫലം മാത്രമല്ല, കാരണങ്ങളും നോക്കുക. തെളിവ് വ്യക്തമായിരുന്നോ, അതോ ഊഹമായിരുന്നോ?"},{"t":256.15,"d":5.345,"text":"Your turn. Same zone, 60,000 to 60,050. Let's reveal new candles one at a time.","ml":"നിങ്ങളുടെ ഊഴം. അതേ zone, 60,000 മുതൽ 60,050 വരെ. പുതിയ candles ഓരോന്നായി കാണിക്കാം."},{"t":262.97,"d":5.96,"text":"Candle one wicks to 60,070 but closes at 60,030, inside the zone. Two small candles follow.","ml":"ഒന്നാം candle-ന്റെ wick 60,070 വരെ, പക്ഷേ close zone-ന് ഉള്ളിൽ 60,030-ൽ. പിന്നെ രണ്ട് ചെറിയ candles."},{"t":270.89,"d":7.943,"text":"Volume is falling. What's sensible: A, buy, B, sell, or C, wait? Pause if you need more time.","ml":"Volume കുറയുന്നു. A, buy? B, sell? C, wait? ഏതാണ് ബുദ്ധി? സമയം വേണമെങ്കിൽ pause ചെയ്യൂ."},{"t":279.383,"d":6.725,"text":"C, wait. No candle closed above the zone, and the pushes are fading. Weak evidence.","ml":"C, wait. ഒരു candle-ഉം zone-ന് മുകളിൽ close ചെയ്തില്ല, കയറ്റങ്ങൾ fade ആകുന്നു. തെളിവ് ദുർബലം."},{"t":286.658,"d":5.9,"text":"A is tempting, but a wick is not a breakout. And B? Nothing confirms a drop either.","ml":"A ആകർഷകമാണ്, പക്ഷേ wick ഒരു breakout അല്ല. B? വീഴ്ചയ്ക്കും ഒരു confirmation ഇല്ല."},{"t":293.55,"d":5.535,"text":"Before you rely on confirmation, know its limits.","ml":"Confirmation-നെ ആശ്രയിക്കുന്നതിന് മുമ്പ്, അതിന്റെ പരിധികൾ അറിയുക."},{"t":299.635,"d":2.711,"text":"Confirmed signals still fail. And waiting for confirmation often means a worse entry.","ml":"Confirm ആയ സിഗ്നലുകളും പരാജയപ്പെടാം. Confirmation-ന് കാത്തിരുന്നാൽ പലപ്പോഴും entry വില മോശമാകും."},{"t":305.65,"d":4.902,"text":"False breakouts can trigger stops, and stops can slip. Leverage makes each loss bigger.","ml":"False breakouts stops trigger ചെയ്യാം, stops slip ആകാം. Leverage ഓരോ നഷ്ടവും വലുതാക്കും."},{"t":312.91,"d":5.205,"text":"These are fictional examples, not advice. NO_TRADE is always allowed.","ml":"ഇവ സാങ്കൽപ്പിക ഉദാഹരണങ്ങളാണ്, ഉപദേശമല്ല. NO_TRADE എപ്പോഴും അനുവദനീയമാണ്."},{"t":320.282,"d":4.028,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":324.86,"d":0.798,"text":"One: confirmation is evidence, not certainty. The same past can lead to different futures.","ml":"ഒന്ന്: confirmation തെളിവാണ്, ഉറപ്പല്ല. ഒരേ കഴിഞ്ഞകാലം വ്യത്യസ്ത ഭാവികളിലേക്ക് നയിക്കാം."},{"t":336.494,"d":5.681,"text":"Two: weak or conflicting evidence, a false breakout or a fading push are reasons for care.","ml":"രണ്ട്: ദുർബലമോ വിരുദ്ധമോ ആയ തെളിവ്, false breakout, fade ആകുന്ന കയറ്റം: ശ്രദ്ധിക്കേണ്ട സൂചനകൾ."},{"t":350.004,"d":5.636,"text":"Three: NO_TRADE is a real decision. Judge it by your reasons, not the result.","ml":"മൂന്ന്: NO_TRADE ഒരു യഥാർത്ഥ തീരുമാനമാണ്. ഫലം നോക്കിയല്ല, കാരണങ്ങൾ നോക്കി വിലയിരുത്തുക."},{"t":362.356,"d":5.213,"text":"Check yourself: you waited, then price rose. Was waiting a mistake?","ml":"സ്വയം പരിശോധിക്കൂ: നിങ്ങൾ wait ചെയ്തു, പിന്നെ വില കയറി. കാത്തിരുന്നത് തെറ്റായിരുന്നോ?"},{"t":372.778,"d":4.25,"text":"Not if the evidence was weak. Judge the reasons.","ml":"തെളിവ് ദുർബലമായിരുന്നെങ്കിൽ, അല്ല. കാരണങ്ങൾ വിലയിരുത്തുക."},{"t":381.67,"d":2.955,"text":"Next up: T22, position sizing and risk budget. Size a position from the risk you accept.","ml":"അടുത്തത്: T22, position sizing, റിസ്ക് ബജറ്റ്. സ്വീകരിക്കുന്ന റിസ്കിൽ നിന്ന് position വലിപ്പം കണ്ടെത്താം."}]},"assetBase":"T21/assets/","assets":{"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-writing.webp":{"mime":"image/webp","w":191,"h":169},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp"," 90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T21 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson twenty-one: confirmation, false signals and NO_TRADE. Why waiting is a decision too.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"Here's a fictional BTC chart. Twice, price climbed to about 60,000 and turned back down.\"\n    },\n    {\n      \"t\": 15.2,\n      \"text\": \"Now it's back near that zone, at 59,970. Tempting to think: this time it breaks out!\"\n    },\n    {\n      \"t\": 21.8,\n      \"text\": \"But from this same past, price could break out to 60,350, drift sideways, or fall to 59,650.\"\n    },\n    {\n      \"t\": 28.8,\n      \"text\": \"Nobody knows in advance which one will happen.\"\n    },\n    {\n      \"t\": 33.4,\n      \"text\": \"Confirmation is extra evidence, after a signal, that supports an idea. You met it in T17.\"\n    },\n    {\n      \"t\": 40.4,\n      \"text\": \"For a breakout: a candle closes beyond the zone, and the next candles hold there.\"\n    },\n    {\n      \"t\": 46.6,\n      \"text\": \"Think of dark clouds. They make rain more likely, but don't promise it.\"\n    },\n    {\n      \"t\": 52.2,\n      \"text\": \"Confirmation can raise or lower the odds. It cannot tell you what the next candle will do.\"\n    },\n    {\n      \"t\": 59.4,\n      \"text\": \"Not all evidence is equal. Weak evidence is small or easy to fake, like one wick above a level.\"\n    },\n    {\n      \"t\": 66.6,\n      \"text\": \"Conflicting evidence points in different directions at the same time.\"\n    },\n    {\n      \"t\": 72.2,\n      \"text\": \"Here, the trend leans up, but price is under resistance and volume is fading.\"\n    },\n    {\n      \"t\": 78.2,\n      \"text\": \"When evidence is weak or mixed, the scale doesn't tip. That's a reason for NO_TRADE.\"\n    },\n    {\n      \"t\": 85.4,\n      \"text\": \"A false signal looks real but doesn't follow through. A false breakout is the classic one.\"\n    },\n    {\n      \"t\": 92.4,\n      \"text\": \"Watch this candle. It pokes up to 60,090, above the zone, then closes at 59,960, back below.\"\n    },\n    {\n      \"t\": 99.6,\n      \"text\": \"Say someone bought 0.01 BTC at 60,060 on that poke. At the close: −1.00 USDT, before fees.\"\n    },\n    {\n      \"t\": 106.8,\n      \"text\": \"A wick above a level is not a close above it.\"\n    },\n    {\n      \"t\": 111.4,\n      \"text\": \"Momentum is how strongly price is moving. A fade is when each push gets smaller.\"\n    },\n    {\n      \"t\": 117.6,\n      \"text\": \"Like a ball rolled uphill: it keeps going for a while, but slower and slower.\"\n    },\n    {\n      \"t\": 123.6,\n      \"text\": \"Here, four green candles gain 80, then 50, then 25, then only 10 USDT.\"\n    },\n    {\n      \"t\": 129.2,\n      \"text\": \"A fade is a warning sign, not proof. Price can fade, then push on again.\"\n    },\n    {\n      \"t\": 135.4,\n      \"text\": \"Hindsight bias: after you see what happened, it feels like it was obvious all along.\"\n    },\n    {\n      \"t\": 142.0,\n      \"text\": \"Looking back at this chart, the breakout seems certain. Of course it went up!\"\n    },\n    {\n      \"t\": 148.2,\n      \"text\": \"But at decision time, the right side was hidden. You only had this.\"\n    },\n    {\n      \"t\": 153.8,\n      \"text\": \"Old charts look clearer than live ones. Judge a decision by what was known at the time.\"\n    },\n    {\n      \"t\": 161.4,\n      \"text\": \"NO_TRADE means you looked, and decided not to open a position. It's an active choice.\"\n    },\n    {\n      \"t\": 168.0,\n      \"text\": \"Like a batter leaving a ball outside off stump. You don't have to play every ball.\"\n    },\n    {\n      \"t\": 174.6,\n      \"text\": \"Write down what you'd need to see. For example: a 5-minute close above 60,050, then a hold.\"\n    },\n    {\n      \"t\": 181.6,\n      \"text\": \"Until then: NO_TRADE. No fees, no new risk. At most, you miss a move.\"\n    },\n    {\n      \"t\": 189.4,\n      \"text\": \"A common mistake: judging a decision only by what happened next.\"\n    },\n    {\n      \"t\": 194.8,\n      \"text\": \"You waited, then price went up. Was waiting wrong? Not if the evidence was weak.\"\n    },\n    {\n      \"t\": 201.2,\n      \"text\": \"A good decision can have a bad outcome, and a bad one can get lucky.\"\n    },\n    {\n      \"t\": 206.6,\n      \"text\": \"So review your reasons, not just the result. Was the evidence clear, or were you guessing?\"\n    },\n    {\n      \"t\": 214.4,\n      \"text\": \"Your turn. Same zone, 60,000 to 60,050. Let's reveal new candles one at a time.\"\n    },\n    {\n      \"t\": 220.6,\n      \"text\": \"Candle one wicks to 60,070 but closes at 60,030, inside the zone. Two small candles follow.\"\n    },\n    {\n      \"t\": 227.8,\n      \"text\": \"Volume is falling. What's sensible: A, buy, B, sell, or C, wait? Pause if you need more time.\"\n    },\n    {\n      \"t\": 235.0,\n      \"text\": \"C, wait. No candle closed above the zone, and the pushes are fading. Weak evidence.\"\n    },\n    {\n      \"t\": 241.6,\n      \"text\": \"A is tempting, but a wick is not a breakout. And B? Nothing confirms a drop either.\"\n    },\n    {\n      \"t\": 248.4,\n      \"text\": \"Before you rely on confirmation, know its limits.\"\n    },\n    {\n      \"t\": 252.6,\n      \"text\": \"Confirmed signals still fail. And waiting for confirmation often means a worse entry.\"\n    },\n    {\n      \"t\": 259.4,\n      \"text\": \"False breakouts can trigger stops, and stops can slip. Leverage makes each loss bigger.\"\n    },\n    {\n      \"t\": 266.0,\n      \"text\": \"These are fictional examples, not advice. NO_TRADE is always allowed.\"\n    },\n    {\n      \"t\": 272.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 274.0,\n      \"text\": \"One: confirmation is evidence, not certainty. The same past can lead to different futures.\"\n    },\n    {\n      \"t\": 280.8,\n      \"text\": \"Two: weak or conflicting evidence, a false breakout or a fading push are reasons for care.\"\n    },\n    {\n      \"t\": 287.8,\n      \"text\": \"Three: NO_TRADE is a real decision. Judge it by your reasons, not the result.\"\n    },\n    {\n      \"t\": 294.2,\n      \"text\": \"Check yourself: you waited, then price rose. Was waiting a mistake?\"\n    },\n    {\n      \"t\": 299.6,\n      \"text\": \"Not if the evidence was weak. Judge the reasons.\"\n    },\n    {\n      \"t\": 304.4,\n      \"text\": \"Next up: T22, position sizing and risk budget. Size a position from the risk you accept.\"\n    }\n  ]\n}","scene-confirm.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Confirmation defined; a mini chart shows a close beyond the zone and a hold; the dark-clouds meter rises but never reaches certain; can / cannot.\nconst CF_C = [[60, 96, 52, 88], [88, 140, 84, 132], [132, 150, 112, 128], [128, 152, 120, 146]];\nconst CF_CAN = ['Show what has already happened', 'Make an idea more, or less, likely'];\nconst CF_NOT = ['Tell you what the next candle does', 'Remove the risk of a loss'];\nkit.scene('confirm', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    // Mini chart: price units 0..160 map to y 120..10; the zone is 100..115.\n    const my = (v) => 122 - (v - 46);\n    this.cd = UI.cdl(kit, 'cf-c', 4);\n    const li = (s, ok) => '<div class=\"cf-i\" style=\"display:flex;align-items:center;gap:16px;height:52px\"><svg width=\"40\" height=\"40\" vie solute;left:32px;right:32px;top:170px\"><div style=\"position:relative;height:26px;border-radius:13px;background:color-mix(in srgb, var(--second) 10%, transparent)\">' +\n      '<div class=\"cf-bar\" style=\"position:absolute;left:0;top:0;bottom:0;width:0;border-radius:13px;background:linear-gradient(90deg, var(--main), var(--accent))\"></div>' +\n      '<div style=\"position:absolute;right:0;top:-8px;bottom:-8px;width:3px;background:var(--second)\"></div></div>' +\n      '<div style=\"display:flex;justify-content:space-between;margin-top:10px;font-size:24px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\"><span>Less likely</span><span class=\"cf-ml\" style=\"color:var(--main)\">More likely</span><span>Certain</span></div></div></div>' +\n      '<div class=\"glass cf-can\" style=\"left:140px;top:600px;width:800px;height:170px;padding:14px 32px;border-color:var(--main)\"><p class=\"kick\" style=\"margin:0 0 4px\">It can</p>' + li(CF_CAN[0], 1) + li(CF_CAN[1], 1) + '</div>' +\n      '<div class=\"glass cf-not\" style=\"left:980px;top:600px;width:800px;height:170px;padding:14px 32px\"><p class=\"kick\" style=\"margin:0 0 4px;color:var(--accent)\">It cannot</p>' + li(CF_NOT[0], 0) + li(CF_NOT[1], 0) + '</div>');\n    this.my = my;\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.a = q('.cf-a').style; this.b = q('.cf-b').style; this.can = q('.cf-can').style; this.not = q('.cf-not').style;\n    this.t1 = q('.cf-t1').style; this.t2 = q('.cf-t2').style; this.bar = q('.cf-bar').style; this.ml = q('.cf-ml').style;\n    this.items = all('.cf-i').map((e) => e.style); this.marks = all('.cf-m');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'read' }, { t: 7.4, pose: 'magnify' }, { t: 13.6, pose: 'idea' }, { t: 19.2, pose: 'explain' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.h.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.h.t, t, 0.1);\n    UI.rise(kit, this.a, t, 0.5, 0.7);\n    CF_C.forEach((c, i) => {\n      const a = i < 1 ? 1.2 : 7.6 + (i - 1) * 1.5, p = eo(seg(t, a, a + 0.8));\n      this.cd.set(i, { x: 50 + i * 78, w: 40, o: c[0], h: c[0] + (c[1] - c[0]) * p, l: c[0] + (c[2] - c[0]) * p, c: c[0] + (c[3] - c[0]) * p, y: this.my, op: eo(seg(t, a, a + 0.2)), min: 3 });\n    });\n    UI.rise(kit, this.t1, t, 8.6, 0.5, 12); UI.rise(kit, this.t2, t, 11.4, 0.5, 12);\n    UI.rise(kit, this.b, t, 13.6, 0.7);\n    // The meter climbs as evidence arrives, then stops well short of certain.\n    const m = lerp(0.18, 0.5, eio(seg(t, 14.6, 16.0))) + lerp(0, 0.22, eio(seg(t, 16.6, 18.0))) + 0.012 * Math.sin(t * 2.2) * seg(t, 18, 19);\n    this.bar.width = (m * 100).toFixed(1) + '%'; this.ml.opacity = eo(seg(t, 17.6, 18.2));\n    UI.rise(kit, this.can, t, 19.2, 0.6); UI.rise(kit, this.not, t, 19.8, 0.6);\n    this.items.forEach((s, i) => { const a = (i < 2 ? 19.8 : 22.4) + (i % 2) * 1.0; s.opacity = eo(seg(t, a, a + 0.4)); this.marks[i].setAttribute('stroke-dasharray', eo(seg(t, a + 0.2, a + 0.6)).toFixed(3) + ' 1'); });\n    this.tutor.render(t);\n  },\n});\n","scene-fade.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Momentum fade: four green candles gain 80, 50, 25, then 10 USDT on falling volume; a ball rolled uphill slows down.\nconst FD_C = [[59700, 59800, 59690, 59780], [59780, 59845, 59770, 59830], [59830, 59872, 59815, 59855], [59855, 59880, 59845, 59865]];\nconst FD_G = [80, 50, 25, 10], FD_V = [0.95, 0.7, 0.45, 0.28];\nconst FD_X = (i) => 250 + i * 150, FD_Y = (p) => 690 - (p - 59680) * 1.5;\nkit.scene('fade', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'fd-c', 4);\n    let lab = '', vol = '';\n    FD_C.forEach((c, i) => {\n      lab += '<text class=\"fd-g mono\" x=\"' + FD_X(i) + '\" y=\"' + (FD_Y(c[1]) - 22).toFixed(1) + '\" text-anchor=\"middle on":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson twenty-one\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 5, lesson T21, Confirmation, False Signals and NO_TRADE; one past line forks into three futures; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"Same past, three futures\",\n      \"dur\": 25,\n      \"desc\": \"Fictional BTC/USDT 5-minute chart: two rejections at the 60,000-60,050 zone, price back at 59,970; three futures branch: 60,350, 59,960, 59,650.\"\n    },\n    {\n      \"id\": \"confirm\",\n      \"name\": \"What confirmation is\",\n      \"dur\": 26,\n      \"desc\": \"Confirmation defined; a close beyond the zone and a hold; dark-clouds analogy with a likelihood meter that never reaches certain; can and cannot.\"\n    },\n    {\n      \"id\": \"weak\",\n      \"name\": \"Weak or conflicting\",\n      \"dur\": 26,\n      \"desc\": \"Weak vs conflicting evidence; a balance scale takes four weights (wick, trend, resistance, fading volume) and ends level: NO_TRADE.\"\n    },\n    {\n      \"id\": \"fakeout\",\n      \"name\": \"A false breakout\",\n      \"dur\": 26,\n      \"desc\": \"False signal defined; a candle forms, wicks to 60,090 a the only sound. Soft pad and keys, a light pulse while charts move, quieter in the risk parts.\n  const BPM = 84, B = 60 / BPM;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.hook, T.confirm) || inR(s, T.fakeout, T.hindsight) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.mistake, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / (4 * B));\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  const pop = (t, v, p) => S.fx('pop', t, { vel: v || 28, pitch: p == null ? 7 : p });\n  // Title: the line forks, NO_TRADE settles.\n  S.fx('whoosh', T.title + 0.4, { dur: 1.4, vel: 16 }); [2.0, 2.35, 2.7].forEach((a, i) => pop(T.title + a + 0.8, 24, 5 + i * 2)); pop(T.title + 4.2, 32, 9);\n  // Hook: candles draw, two rejections, three futures.\n  S.fx('whoosh', T.hook + 0.6, { dur: 2.6, vel: 18 }); [4.0, 4.8].forEa rade + 20.8, { vel: 34 }); S.fx('chime', T.notrade + 21.2, { vel: 36 }); [22.0, 22.6].forEach((a) => pop(T.notrade + a, 24));\n  // Mistake.\n  pop(T.mistake + 0.5, 26, 5); [5.8, 7.4, 9.2].forEach((a) => S.fx('tick', T.mistake + a, { vel: 26 })); S.fx('thud', T.mistake + 10.4, { vel: 32 }); pop(T.mistake + 12.2);\n  for (let i = 0; i < 4; i++) S.fx('tick', T.mistake + 13.0 + i * 0.8, { vel: 24 }); S.fx('chime', T.mistake + 16.4, { vel: 30 });\n  // Try it: candles revealed, countdown, answer.\n  [6.6, 9.6, 11.2].forEach((a) => S.fx('whoosh', T.try + a, { dur: 1.0, vel: 16 })); [13.8, 14.2, 14.6].forEach((a) => pop(T.try + a, 26));\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 15.2 + i, { vel: 30 });\n  S.fx('chime', T.try + 21.0, { vel: 42 }); pop(T.try + 27.8, 26, 5); pop(T.try + 29.8, 26, 5);\n  [4.6, 8.2, 11.4, 18.0].forEach((a) => pop(T.risks + a, 26));\n  [2.0, 8.8, 15.8].forEach((a) => pop(T.recap + a + 0.5, 34));\n  S.fx('ding', T.recap + 27.6, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 22, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T21 · Confirmation, false signals and NO_TRADE',\n  TOTAL: 314,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // Side speech bubbles sit this far higher than in T01, so they clear the two-line caption band (y ≈ 784–930).\n  LIFT: 96,\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n yOf, dt) {\n    let d = '';\n    for (let s = s0; s <= s1 + 1e-6; s += dt || 0.05) d += (d ? 'L' : 'M') + xOf(s).toFixed(1) + ' ' + yOf(f(s)).toFixed(1);\n    return d || 'M0 0';\n  },\n  // ── Candle helpers (T14) ──\n  // n SVG candles: html to place inside an <svg>; set(i, c) draws candle i with\n  // c = {x, w, o, h, l, c, y: price → y, op?, live?, col?}. Up (close ≥ open) is --up, down is --down.\n  cdl(kit, cls, n) {\n    let html = '';\n    for (let i = 0; i < n; i++) html += '<g class=\"' + cls + '\"><line class=\"' + cls + '-w\" stroke-linecap=\"round\"/><rect class=\"' + cls + '-b\" rx=\"4\"/></g>';\n    let G, W, B;\n    return {\n      html,\n      set(i, c) {\n        if (!G) { const all = (s) => [...kit.stage.querySelectorAll(s)]; G = all('.' + cls); W = all('.' + cls + '-w'); B = all('.' + cls + '-b'); }\n        const col = c.col || (c.c >= c.o ? 'var(--up)' : 'var(--down)');\n        const yt = c.y(Math.max(c.o, c.c)), yb = c.y(Math.min(c.o, c.c)), bh = Math.max(c.min == null ? 4 : c.min, yb - yt), ym = (yt + yb) / 2;\n        const w = W[i], b = B[i], sw = Math.max(3, c.w * 0.07);\n        w.setAttribute('x1', c.x.toFixed(1)); w.setAttribute('x2', c.x.toFixed(1));\n        w.setAttribute('y1', c.y(c.h).toFixed(1)); w.setAttribute('y2', c.y(c.l).toFixed(1));\n        w.setAttribute('stroke-width', sw.toFixed(1)); w.style.stroke = col;\n        b.setAttribute('x', (c.x - c.w / 2).toFixed(1)); b.setAttribute('width', c.w.toFixed(1));\n        b.setAttribute('y', (ym - bh / 2).toFixed(1)); b.setAttribute('height', bh.toFixed(1));\n        b.setAttribute('stroke-width', (sw * 0.8).toFixed(1));\n        b.style.stroke = col;\n        b.style.fill = c.live ? 'color-mix(in srgb, ' + col + ' 38%, var(--ground))' : col;\n        G[i].style.opacity = c.op == null ? 1 : c.op;\n      },\n    };\n  },\n  // Fade an element in at a and out at b (opacity only).\n  fade(st, t, a, b) { const K = UI.K; st.opacity = (K.eo(K.seg(t, a, a + 0.5)) * (b == null ? 1 : 1 - K.ei(K.seg(t, b, b + 0.45)))).toFixed(3); },\n  hilo(fn, a, b) { let lo = fn(a), hi = lo; for (let s = a; s <= b; s += 0.05) { const v = fn(s); if (v < lo) lo = v; if (v > hi) hi = v; } const v = fn(b); return [Math.min(lo, v), Math.max(hi, v)]; },\n  // A forming candle: price through keys [[t, p]] with a small wiggle, kept inside [lo, hi]; returns the candle at time t.\n  forming(keys, lo, hi, t) {\n    const K = UI.K, a = keys[0][0], b = keys[keys.length - 1][0];\n    const f = (s) => Math.min(hi, Math.max(lo, UI.path(keys, s) + 7 * Math.sin(s * 9.3) * Math.sin(Math.PI * K.clamp01((s - a) / (b - a)))));\n    const e = Math.min(Math.max(t, a), b), hl = UI.hilo(f, a, e);\n    return { o: keys[0][1], h: hl[1], l: hl[0], c: f(e), live: t < b };\n  },\n  // ── T21: one fictional BTC/USDT 5-minute chart. Resistance zone 60,000–60,050 (two earlier rejections). Last close 59,970. ──\n  Q: {\n    P: [[59800, 59900, 59780, 59880], [59880, 60020, 59860, 60000], [60000, 60030, 59880, 59900], [59900, 59920, 59760, 59780], [59780, 59820, 59700, 59740], [59740, 59840, 59720, 59820],\n      [59820, 59900, 59800, 59880], [59880, 60040, 59870, 59990], [59990, 60010, 59850, 59870], [59870, 59920, 59840, 59900], [59900, 59960, 59880, 59940], [59940, 59990, 59920, 59970]],\n    V: [0.45, 0.8, 0.75, 0.5, 0.4, 0.45, 0.5, 0.85, 0.7, 0.45, 0.5, 0.55],\n    // Three possible futures from the same last close (one close per step): breakout, sideways, fakeout and fall.\n    F: [[59970, 60080, 60140, 60110, 60220, 60280, 60350], [59970, 60020, 59950, 59990, 59940, 60000, 59960], [59970, 60060, 59930, 59850, 59780, 59720, 59650]],\n    ZL: 60000, ZH: 60050,\n    x: (i) => 200 + i * 46,\n    y: (p) => 700 - (p - 59600) * 0.5,\n  },\n  // Candles [o, h, l, c] from a close path (first value is the open).\n  fromPath(pts, wick) { const out = []; for (let i = 1; i < pts.length; i++) { const o = pts[i - 1], c = pts[i]; out.push([o, Math.max(o, c) + (wick || 20), Math.min(o, c) - (wick || 20), c]); } s=\"fict\" style=\"position:absolute;left:150px;top:' + (o.ft || 282) + 'px;margin:0\">BTC/USDT · 5-minute candles · fictional, not real market data</p>');\n    kit.stage.append(tag); kit.stage.append(f);\n    const g = svg.querySelector('.' + cls + '-g').style, z = svg.querySelector('.' + cls + '-z').style, vs = [...svg.querySelectorAll('.' + cls + '-v')];\n    return {\n      svg, cd, X, Y,\n      // Grid and label fade in at a; zone grows in at za (its label too, gone after zOut).\n      base(t, a, za, zOut) {\n        g.opacity = K.eo(K.seg(t, a, a + 0.6)); f.style.opacity = (0.9 * K.eo(K.seg(t, a + 0.3, a + 0.9))).toFixed(3);\n        const p = K.seg(t, za, za + 0.8); z.opacity = K.eo(p); z.transformBox = 'fill-box'; z.transformOrigin = '0 50%'; z.transform = 'scaleX(' + K.eo(p).toFixed(3) + ')';\n        UI.fade(tag.style, t, za + 0.5, zOut);\n      },\n      // Candle i from [o, h, l, c], growing from its open over p (0..1).\n      put(i, c, p, op, extra) { const e = K.eo(p); cd.set(i, Object.assign({ x: X(i), w: 28, o: c[0], h: c[0] + (c[1] - c[0]) * e, l: c[0] + (c[2] - c[0]) * e, c: c[0] + (c[3] - c[0]) * e, y: Y, op: op == null ? (p > 0 ? 1 : 0) : op }, extra || {})); },\n      // The shared past: 12 candles drawing in from a, step s apart.\n      past(t, a, s, op) { Q.P.forEach((c, i) => { const b = a + i * (s || 0.14); this.put(i, c, K.seg(t, b, b + 0.4), K.eo(K.seg(t, b, b + 0.2)) * (op == null ? 1 : op)); }); },\n      // Volume bar i of height v (0..1), grown by p; col optional.\n      vol(i, v, p, col) { const r = vs[i], h = v * 56 * K.eo(p); r.setAttribute('y', (772 - h).toFixed(1)); r.setAttribute('height', h.toFixed(1)); r.style.fill = col || 'color-mix(in srgb, var(--main) 55%, transparent)'; },\n    };\n  },\n  // Standard header for a T21 scene: ground with kick and headline (64 px). Returns {k, t} handles.\n  head(kit, kick, title, extra, kickColor) {\n    kit.stage.append(kit.h('<div class=\"ground\"><div class=\"words\" style=\"left:140px;t
