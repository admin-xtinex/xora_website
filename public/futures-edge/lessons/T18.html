<script>window.FILM = {"id":"T18","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson eighteen","dur":10,"k":1,"oldStart":0,"oldDur":10},{"id":"hook","name":"Same change, different ride","dur":16,"k":1,"oldStart":10,"oldDur":16},{"id":"volume","name":"Volume","dur":26.4,"k":1.1,"oldStart":26,"oldDur":24},{"id":"bars","name":"Volume bars","dur":22,"k":1,"oldStart":50,"oldDur":22},{"id":"range","name":"Range","dur":23.54,"k":1.07,"oldStart":72,"oldDur":22},{"id":"volatility","name":"Volatility","dur":36.96,"k":1.54,"oldStart":94,"oldDur":24},{"id":"lookback","name":"Previous high and low","dur":45.5,"k":1.75,"oldStart":118,"oldDur":26},{"id":"compare","name":"Two windows compared","dur":35.28,"k":1.47,"oldStart":144,"oldDur":24},{"id":"liquidity","name":"Liquidity context","dur":47.3,"k":2.15,"oldStart":168,"oldDur":22},{"id":"mistake","name":"Common mistake","dur":24.6,"k":1.23,"oldStart":190,"oldDur":20},{"id":"try","name":"Try it","dur":51.92,"k":2.36,"oldStart":210,"oldDur":22},{"id":"risks","name":"Know the limits","dur":22,"k":1,"oldStart":232,"oldDur":22},{"id":"recap","name":"Recap","dur":55.18,"k":1.78,"oldStart":254,"oldDur":31},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":285,"oldDur":10}],"voice":{"src":"T18/voice.mp3","lines":[{"t":0.6,"d":3.415,"text":"Lesson eighteen: volume, volatility and range.","ml":"പാഠം പതിനെട്ട്: volume, volatility, range."},{"t":5,"d":3.431,"text":"Three ways to describe how busy and how jumpy a market is.","ml":"ഒരു മാർക്കറ്റ് എത്ര തിരക്കുള്ളതാണ്, എത്ര ചാടുന്നതാണ് എന്ന് പറയാൻ മൂന്ന് വഴികൾ."},{"t":10.6,"d":3.588,"text":"In lesson seventeen, you met zones, breakouts and fakeouts.","ml":"പാഠം പതിനേഴിൽ നിങ്ങൾ zone-കൾ, breakout-കൾ, fakeout-കൾ എന്നിവ കണ്ടു."},{"t":15.4,"d":5.344,"text":"Here are two fictional charts. Both start at 60,000 and end at 60,100.","ml":"ഇതാ രണ്ട് സാങ്കൽപ്പിക ചാർട്ടുകൾ. രണ്ടും 60,000-ൽ തുടങ്ങി 60,100-ൽ അവസാനിക്കുന്നു."},{"t":21.294,"d":3.699,"text":"Same change in price. A very different ride. Let's measure it.","ml":"വിലയിലെ മാറ്റം ഒന്നുതന്നെ. പക്ഷേ യാത്ര തീർത്തും വ്യത്യസ്തം. നമുക്ക് അളന്നുനോക്കാം."},{"t":26.66,"d":4.102,"text":"Volume is how much was traded in a period of time.","ml":"ഒരു നിശ്ചിത സമയത്തിനുള്ളിൽ എത്രത്തോളം ട്രേഡ് നടന്നു എന്നതാണ് volume."},{"t":31.312,"d":2.882,"text":"Think of a shop counting how many items it sold each minute.","ml":"ഓരോ മിനിറ്റിലും എത്ര സാധനം വിറ്റു എന്ന് എണ്ണുന്ന ഒരു കട പോലെ കരുതൂ."},{"t":36.56,"d":3.245,"text":"In this fictional minute, trades of 2, 5, 3 and 2 BTC go through.","ml":"ഈ സാങ്കൽപ്പിക മിനിറ്റിൽ 2, 5, 3, 2 BTC വീതമുള്ള ട്രേഡുകൾ നടക്കുന്നു."},{"t":42.28,"d":5.216,"text":"Add them up: 12 BTC. That is this candle's volume.","ml":"കൂട്ടിയാൽ 12 BTC. അതാണ് ഈ candle-ന്റെ volume."},{"t":48.046,"d":3.882,"text":"At 60,000 USDT each, that's about 720,000 USDT traded.","ml":"ഒരു BTC-ക്ക് 60,000 USDT വെച്ച്, ഏകദേശം 720,000 USDT-യുടെ ട്രേഡ്."},{"t":53,"d":5.252,"text":"On most charts, volume shows as bars under the candles.","ml":"മിക്ക ചാർട്ടുകളിലും volume, candles-ന് താഴെ ബാറുകളായി കാണിക്കും."},{"t":58.802,"d":3.39,"text":"Each bar sits under its own candle, and covers the same minute.","ml":"ഓരോ ബാറും സ്വന്തം candle-ന് താഴെയാണ്, അതേ മിനിറ്റിനെയാണ് കാണിക്കുന്നത്."},{"t":62.742,"d":3.419,"text":"A short bar means a quiet minute. A tall bar means a busy one.","ml":"ചെറിയ ബാർ എന്നാൽ ശാന്തമായ മിനിറ്റ്. ഉയരമുള്ള ബാർ എന്നാൽ തിരക്കുള്ള മിനിറ്റ്."},{"t":67.6,"d":3.894,"text":"Here, the busiest minutes came with big moves. Often, not always.","ml":"ഇവിടെ ഏറ്റവും തിരക്കുള്ള മിനിറ്റുകളിൽ വലിയ നീക്കങ്ങൾ ഉണ്ടായി. പലപ്പോഴും, എപ്പോഴുമല്ല."},{"t":75.042,"d":4.221,"text":"Range is the distance between the high and the low.","ml":"High-ഉം low-ഉം തമ്മിലുള്ള അകലമാണ് range."},{"t":79.813,"d":2.68,"text":"Like the gap between the warmest and coldest hour of a day.","ml":"ഒരു ദിവസത്തെ ഏറ്റവും ചൂടുള്ളതും തണുത്തതുമായ മണിക്കൂറുകൾ തമ്മിലുള്ള വ്യത്യാസം പോലെ."},{"t":84.565,"d":2.978,"text":"This candle's high is 60,300 and its low is 60,000. Range: 300 USDT.","ml":"ഈ candle-ന്റെ high 60,300, low 60,000. Range: 300 USDT."},{"t":90.236,"d":7.252,"text":"As a percent: 300 ÷ 60,000 × 100 = 0.5%. We divide by the low.","ml":"ശതമാനമായി: 300 ÷ 60,000 × 100 = 0.5%. നമ്മൾ low കൊണ്ടാണ് ഹരിക്കുന്നത്."},{"t":98.864,"d":8.017,"text":"Volatility is how much, and how fast, price moves around.","ml":"വില എത്രത്തോളം, എത്ര വേഗത്തിൽ മാറുന്നു എന്നതാണ് volatility."},{"t":107.431,"d":3.627,"text":"Like a calm lake versus a choppy sea.","ml":"ശാന്തമായ ഒരു തടാകവും ഇളകിമറിയുന്ന കടലും പോലെ."},{"t":113.34,"d":2.379,"text":"On the left, four quiet candles. Their ranges average 40 USDT.","ml":"ഇടതുവശത്ത് നാല് ശാന്തമായ candles. അവയുടെ range-കളുടെ ശരാശരി 40 USDT."},{"t":120.886,"d":4.777,"text":"On the right, four volatile candles. Ranges average 250 USDT.","ml":"വലതുവശത്ത് നാല് volatile candles. Range-കളുടെ ശരാശരി 250 USDT."},{"t":128.894,"d":5.206,"text":"More volatility means bigger swings, both ways.","ml":"Volatility കൂടുമ്പോൾ ആട്ടങ്ങൾ വലുതാകും, രണ്ട് ദിശയിലും."},{"t":135.95,"d":3.112,"text":"Traders often check the previous high and low of the last few minutes.","ml":"കഴിഞ്ഞ കുറച്ച് മിനിറ്റുകളിലെ മുൻ high-ഉം low-ഉം ട്രേഡർമാർ പലപ്പോഴും നോക്കും."},{"t":145.575,"d":3.585,"text":"This box is a lookback window: the last 10 one-minute candles.","ml":"ഈ പെട്ടി ഒരു lookback window ആണ്: അവസാനത്തെ 10 ഒരു-മിനിറ്റ് candles."},{"t":154.15,"d":3.907,"text":"Highest high 60,300. Lowest low 60,000. Range 300 USDT, or 0.5%.","ml":"ഏറ്റവും ഉയർന്ന high 60,300. ഏറ്റവും താഴ്ന്ന low 60,000. Range 300 USDT, അഥവാ 0.5%."},{"t":163.075,"d":9.504,"text":"Now stretch it to 15 minutes. An older high, 60,600, joins in.","ml":"ഇനി അത് 15 മിനിറ്റിലേക്ക് നീട്ടാം. പഴയൊരു high, 60,600, ഉള്ളിലേക്ക് വരുന്നു."},{"t":173.129,"d":5.185,"text":"Range doubles: 600 USDT, 1%. Your window changes the answer.","ml":"Range ഇരട്ടിയാകുന്നു: 600 USDT, 1%. നിങ്ങൾ എടുക്കുന്ന window ഉത്തരം മാറ്റും."},{"t":181.282,"d":5.646,"text":"Let's compare two fictional 15-minute windows.","ml":"രണ്ട് സാങ്കൽപ്പിക 15-മിനിറ്റ് window-കൾ താരതമ്യം ചെയ്യാം."},{"t":187.478,"d":2.63,"text":"Window A: range 150 USDT, 0.25%, and low volume.","ml":"Window A: range 150 USDT, 0.25%, volume കുറവ്."},{"t":193.336,"d":6.702,"text":"Window B: range 900 USDT, 1.5%, and high volume.","ml":"Window B: range 900 USDT, 1.5%, volume കൂടുതൽ."},{"t":200.588,"d":5.829,"text":"In A, round-trip fees of 0.10%, 60 USDT per BTC, eat a big part of the range.","ml":"A-യിൽ 0.10% round-trip ഫീസ്, ഒരു BTC-ക്ക് 60 USDT, range-ന്റെ വലിയൊരു ഭാഗം തിന്നുന്നു."},{"t":208.33,"d":6.937,"text":"In B, moves are bigger, but so are the swings against you.","ml":"B-യിൽ നീക്കങ്ങൾ വലുതാണ്, പക്ഷേ നിങ്ങൾക്കെതിരായ ആട്ടങ്ങളും വലുതാണ്."},{"t":216.97,"d":3.415,"text":"Volume also hints at liquidity: how many orders wait near the price.","ml":"Volume liquidity-യെക്കുറിച്ചും സൂചന തരും: വിലയ്ക്കടുത്ത് എത്ര ഓർഡറുകൾ കാത്തിരിക്കുന്നു എന്ന്."},{"t":228.58,"d":4.222,"text":"Busy book: a 2 BTC market buy fills at 60,000.","ml":"തിരക്കുള്ള ബുക്ക്: 2 BTC-യുടെ ഒരു market buy 60,000-ൽ fill ആകുന്നു."},{"t":237.18,"d":3.804,"text":"Thin book: 1 BTC fills at 60,000, the other at 60,100.","ml":"നേർത്ത ബുക്ക്: 1 BTC 60,000-ൽ, ബാക്കി 60,100-ൽ fill ആകുന്നു."},{"t":246.64,"d":6.05,"text":"Average 60,050. That's 50 USDT per BTC worse: slippage.","ml":"ശരാശരി 60,050. ഒരു BTC-ക്ക് 50 USDT മോശം: ഇതാണ് slippage."},{"t":256.315,"d":6.256,"text":"Quiet times often mean thin books.","ml":"ശാന്തമായ സമയങ്ങളിൽ ബുക്കുകൾ പലപ്പോഴും നേർത്തതായിരിക്കും."},{"t":263.718,"d":2.511,"text":"A common mistake: a huge volume bar means strong buyers. Go long!","ml":"ഒരു സാധാരണ തെറ്റ്: വലിയ volume ബാർ എന്നാൽ ശക്തരായ വാങ്ങുന്നവർ. Long പോകാം!"},{"t":270.114,"d":4.644,"text":"But every trade has a buyer and a seller. 40 BTC bought means 40 BTC sold.","ml":"പക്ഷേ ഓരോ ട്രേഡിലും ഒരാൾ വാങ്ങുന്നു, ഒരാൾ വിൽക്കുന്നു. 40 BTC വാങ്ങിയാൽ 40 BTC വിറ്റു."},{"t":277.125,"d":5.979,"text":"Volume shows how busy it was, not who wins next.","ml":"Volume കാണിക്കുന്നത് എത്ര തിരക്കായിരുന്നു എന്നാണ്, അടുത്തത് ആര് ജയിക്കും എന്നല്ല."},{"t":283.654,"d":3.216,"text":"Read it with candles and zones. WAIT is still allowed.","ml":"Candles-ഉം zone-കളും ചേർത്ത് വായിക്കുക. WAIT ഇപ്പോഴും അനുവദനീയമാണ്."},{"t":288.996,"d":3.105,"text":"Your turn. In the last 10 minutes, the high was 60,240 and the low 60,000.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. കഴിഞ്ഞ 10 മിനിറ്റിൽ high 60,240, low 60,000 ആയിരുന്നു."},{"t":302.684,"d":6.79,"text":"What is the range in USDT, and as a percent? Pause if you need to.","ml":"Range USDT-യിൽ എത്ര, ശതമാനമായി എത്ര? വേണമെങ്കിൽ pause ചെയ്യൂ."},{"t":314.956,"d":4.557,"text":"Range: 60,240 − 60,000 = 240 USDT. Then 240 ÷ 60,000 × 100 = 0.4%.","ml":"Range: 60,240 − 60,000 = 240 USDT. പിന്നെ 240 ÷ 60,000 × 100 = 0.4%."},{"t":327.464,"d":11.628,"text":"That tells you how far price travelled. Not where it goes next.","ml":"വില എത്ര ദൂരം പോയി എന്ന് അത് പറയും. അടുത്തത് എങ്ങോട്ട് എന്നല്ല."},{"t":340.1,"d":3.829,"text":"Before you lean on these numbers, know the limits.","ml":"ഈ സംഖ്യകളെ ആശ്രയിക്കുന്നതിന് മുമ്പ്, പരിധികൾ അറിയുക."},{"t":344.479,"d":2.696,"text":"A past range is history. The next minutes can be calmer, or much wilder.","ml":"പഴയ range ചരിത്രമാണ്. അടുത്ത മിനിറ്റുകൾ കൂടുതൽ ശാന്തമാകാം, അല്ലെങ്കിൽ വളരെ ഭ്രാന്തമാകാം."},{"t":349.9,"d":4.592,"text":"Volatility can jump fast. With leverage, big swings reach liquidation sooner.","ml":"Volatility പെട്ടെന്ന് കുതിക്കാം. Leverage-ൽ, വലിയ ആട്ടങ്ങൾ liquidation-ലേക്ക് വേഗം എത്തും."},{"t":356,"d":4.889,"text":"Thin volume can mean slippage. And WAIT is always a valid choice.","ml":"കുറഞ്ഞ volume slippage-ന് കാരണമാകാം. WAIT എപ്പോഴും ശരിയായ ഒരു തീരുമാനമാണ്."},{"t":362.568,"d":4.148,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":367.266,"d":0.745,"text":"Volume is how much traded. It shows activity, not direction.","ml":"Volume എന്നാൽ എത്ര ട്രേഡ് നടന്നു എന്ന്. അത് പ്രവർത്തനം കാണിക്കും, ദിശയല്ല."},{"t":375.74,"d":3.428,"text":"Range is high minus low. Volatility is how big and fast the swings are.","ml":"Range എന്നാൽ high മൈനസ് low. ആട്ടങ്ങൾ എത്ര വലുതും വേഗവുമാണ് എന്നതാണ് volatility."},{"t":385.708,"d":4.746,"text":"The lookback window you choose changes the range. Past ranges promise nothing.","ml":"നിങ്ങൾ എടുക്കുന്ന lookback window range മാറ്റും. പഴയ range-കൾ ഒന്നും ഉറപ്പ് തരുന്നില്ല."},{"t":396.744,"d":4.801,"text":"Check yourself: a huge green volume bar. Does it prove price will rise?","ml":"സ്വയം പരിശോധിക്കൂ: ഒരു വലിയ പച്ച volume ബാർ. വില കൂടുമെന്ന് അത് തെളിയിക്കുമോ?"},{"t":407.424,"d":4.751,"text":"No. Volume shows activity, not direction. Every buy had a seller.","ml":"ഇല്ല. Volume പ്രവർത്തനം കാണിക്കും, ദിശയല്ല. ഓരോ വാങ്ങലിനും ഒരു വിൽപ്പനക്കാരനുണ്ടായിരുന്നു."},{"t":417.28,"d":4.865,"text":"Well done! Phase 5 starts next: what is scalping? See you in lesson nineteen.","ml":"നന്നായി! അടുത്തത് Phase 5: scalping എന്താണ്? പാഠം പത്തൊൻപതിൽ കാണാം."}]},"assetBase":"T18/assets/","assets":{"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"xtinex-x.png":{"mime":"image/png","w":320,"h":205}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T18 captions, written as a warm tutor speaking; each line starts at film time t (seconds). Can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson eighteen: volume, volatility and range.\"\n    },\n    {\n      \"t\": 5.0,\n      \"text\": \"Three ways to describe how busy and how jumpy a market is.\"\n    },\n    {\n      \"t\": 10.6,\n      \"text\": \"In lesson seventeen, you met zones, breakouts and fakeouts.\"\n    },\n    {\n      \"t\": 15.4,\n      \"text\": \"Here are two fictional charts. Both start at 60,000 and end at 60,100.\"\n    },\n    {\n      \"t\": 21.0,\n      \"text\": \"Same change in price. A very different ride. Let's measure it.\"\n    },\n    {\n      \"t\": 26.6,\n      \"text\": \"Volume is how much was traded in a period of time.\"\n    },\n    {\n      \"t\": 30.8,\n      \"text\": \"Think of a shop counting how many items it sold each minute.\"\n    },\n    {\n      \"t\": 35.6,\n      \"text\": \"In this fictional minute, trades of 2, 5, 3 and 2 BTC go through.\"\n    },\n    {\n      \"t\": 40.8,\n      \"text\": \"Add them up: 12 BTC. That is this candle's volume.\"\n    },\n    {\n      \"t\": 45.2,\n      \"text\": \"At 60,000 USDT each, that's about 720,000 USDT traded.\"\n    },\n    {\n      \"t\": 50.6,\n      \"text\": \"On most charts, volume shows as bars under the candles.\"\n    },\n    {\n      \"t\": 55.1,\n      \"text\": \"Each bar sits under its own candle, and covers the same minute.\"\n    },\n    {\n      \"t\": 60.2,\n      \"text\": \"A short bar means a quiet minute. A tall bar means a busy one.\"\n    },\n    {\n      \"t\": 65.2,\n      \"text\": \"Here, the busiest minutes came with big moves. Often, not always.\"\n    },\n    {\n      \"t\": 72.6,\n      \"text\": \"Range is the distance between the high and the low.\"\n    },\n    {\n      \"t\": 76.8,\n      \"text\": \"Like the gap between the warmest and coldest hour of a day.\"\n    },\n    {\n      \"t\": 81.5,\n      \"text\": \"This candle's high is 60,300 and its low is 60,000. Range: 300 USDT.\"\n    },\n    {\n      \"t\": 86.8,\n      \"text\": \"As a percent: 300 ÷ 60,000 × 100 = 0.5%. We divide by the low.\"\n    },\n    {\n      \"t\": 94.6,\n      \"text\": \"Volatility is how much, and how fast, price moves around.\"\n    },\n    {\n      \"t\": 99.2,\n      \"text\": \"Like a calm lake versus a choppy sea.\"\n    },\n    {\n      \"t\": 104.0,\n      \"text\": \"On the left, four quiet candles. Their ranges average 40 USDT.\"\n    },\n    {\n      \"t\": 108.9,\n      \"text\": \"On the right, four volatile candles. Ranges average 250 USDT.\"\n    },\n    {\n      \"t\": 114.1,\n      \"text\": \"More volatility means bigger swings, both ways.\"\n    },\n    {\n      \"t\": 118.6,\n      \"text\": \"Traders often check the previous high and low of the last few minutes.\"\n    },\n    {\n      \"t\": 124.1,\n      \"text\": \"This box is a lookback window: the last 10 one-minute candles.\"\n    },\n    {\n      \"t\": 129.0,\n      \"text\": \"Highest high 60,300. Lowest low 60,000. Range 300 USDT, or 0.5%.\"\n    },\n    {\n      \"t\": 134.1,\n      \"text\": \"Now stretch it to 15 minutes. An older high, 60,600, joins in.\"\n    },\n    {\n      \"t\": 139.0,\n      \"text\": \"Range doubles: 600 USDT, 1%. Your window changes the answer.\"\n    },\n    {\n      \"t\": 144.6,\n      \"text\": \"Let's compare two fictional 15-minute windows.\"\n    },\n    {\n      \"t\": 148.6,\n      \"text\": \"Window A: range 150 USDT, 0.25%, and low volume.\"\n    },\n    {\n      \"t\": 152.8,\n      \"text\": \"Window B: range 900 USDT, 1.5%, and high volume.\"\n    },\n    {\n      \"t\": 156.9,\n      \"text\": \"In A, round-trip fees of 0.10%, 60 USDT per BTC, eat a big part of the range.\"\n    },\n    {\n      \"t\": 163.0,\n      \"text\": \"In B, moves are bigger, but so are the swings against you.\"\n    },\n    {\n      \"t\": 168.6,\n      \"text\": \"Volume also hints at liquidity: how many orders wait near the price.\"\n    },\n    {\n      \"t\": 174.0,\n      \"text\": \"Busy book: a 2 BTC market buy fills at 60,000.\"\n    },\n    {\n      \"t\": 178.0,\n      \"text\": \"Thin book: 1 BTC fills at 60,000, the other at 60,100.\"\n    },\n    {\n      \"t\": 182.4,\n      \"text\": \"Average 60,050. That's 50 USDT per BTC worse: slippage.\"\n    },\n    {\n      \"t\": 186.9,\n      \"text\": \"Quiet times often mean thin books.\"\n    },\n    {\n      \"t\": 190.6,\n      \"text\": \"A common mistake: a huge volume bar means strong buyers. Go long!\"\n    },\n    {\n      \"t\": 195.8,\n      \"text\": \"But every trade has a buyer and a seller. 40 BTC bought means 40 BTC sold.\"\n    },\n    {\n      \"t\": 201.5,\n      \"text\": \"Volume shows how busy it was, not who wins next.\"\n    },\n    {\n      \"t\": 205.6,\n      \"text\": \"Read it with candles and zones. WAIT is still allowed.\"\n    },\n    {\n      \"t\": 210.6,\n      \"text\": \"Your turn. In the last 10 minutes, the high was 60,240 and the low 60,000.\"\n    },\n    {\n      \"t\": 216.4,\n      \"text\": \"What is the range in USDT, and as a percent? Pause if you need to.\"\n    },\n    {\n      \"t\": 221.6,\n      \"text\": \"Range: 60,240 − 60,000 = 240 USDT. Then 240 ÷ 60,000 × 100 = 0.4%.\"\n    },\n    {\n      \"t\": 226.9,\n      \"text\": \"That tells you how far price travelled. Not where it goes next.\"\n    },\n    {\n      \"t\": 232.6,\n      \"text\": \"Before you lean on these numbers, know the limits.\"\n    },\n    {\n      \"t\": 236.8,\n      \"text\": \"A past range is history. The next minutes can be calmer, or much wilder.\"\n    },\n    {\n      \"t\": 242.4,\n      \"text\": \"Volatility can jump fast. With leverage, big swings reach liquidation sooner.\"\n    },\n    {\n      \"t\": 248.5,\n      \"text\": \"Thin volume can mean slippage. And WAIT is always a valid choice.\"\n    },\n    {\n      \"t\": 254.6,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 256.4,\n      \"text\": \"Volume is how much traded. It shows activity, not direction.\"\n    },\n    {\n      \"t\": 262.0,\n      \"text\": \"Range is high minus low. Volatility is how big and fast the swings are.\"\n    },\n    {\n      \"t\": 267.6,\n      \"text\": \"The lookback window you choose changes the range. Past ranges promise nothing.\"\n    },\n    {\n      \"t\": 273.8,\n      \"text\": \"Check yourself: a huge green volume bar. Does it prove price will rise?\"\n    },\n    {\n      \"t\": 279.8,\n      \"text\": \"No. Volume shows activity, not direction. Every buy had a seller.\"\n    },\n    {\n      \"t\": 285.6,\n      \"text\": \"Well done! Phase 5 starts next: what is scalping? See you in lesson nineteen.\"\n    }\n  ]\n}","scene-bars.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// The fictional 15-minute history with a volume bar under each candle (BTC per minute).\nconst BR_H = UI.H, brX = (i) => 240 + i * 74, brY = (p) => 570 - (p - 60000) / 600 * 220, BR_B = 770, BR_U = 6;\nconst BR_BIG = [1, 2, 9];\nkit.scene('bars', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'br-c', BR_H.length);\n    let bars = '', nums = '';\n    BR_H.forEach((c, i) => {\n      bars += '<rect class=\"br-v\" x=\"' + (brX(i) - 24) + '\" width=\"48\" rx=\"4\" style=\"fill:color-mix(in srgb, ' + (c[3] >= c[0] ? 'var(--up)' : 'var(--down)') + ' 55%, transparent)\"/>';\n      nums += '<text class=\"br-n mono\" x=\"' + brX(i) + '\" y=\"' + (BR_B - c[4] * BR_U - 10) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 75%, var(--ground));font-size:22px\">' + c[4] + '</text>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"br-grid\">' + UI.grid(200, 1310, brY, 60000, 60600, 100) + '</g>' +\n      '<rect class=\"br-col\  });\n    this.tutor.render(t);\n  },\n});\n","scene-volume.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// One fictional minute: four trades (2, 5, 3, 2 BTC) fill the volume bar to 12 BTC while the candle forms.\nconst VO_TR = [[2, 10.2], [5, 11.4], [3, 12.6], [2, 13.8]];\nconst VO_K = [[9.6, 60000], [10.6, 60040], [11.6, 60080], [12.6, 59990], [13.4, 59960], [14.6, 60050]];\nconst voY = (p) => 520 - (p - 59900) / 250 * 200, VO_X = 1270, VO_B = 760, VO_U = 13;\nkit.scene('volume', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'vo-c', 1);\n    let chips = '';\n    VO_TR.forEach((v) => { chips += '<p class=\"chip vo-t mono\" style=\"position:absolute;left:0;top:0;margin:0;font-size:28px;padding:10px 22px\">' + v[0] + ' BTC</p>'; });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"vo-grid\">' + UI.gridL(1180, 1360, voY, 59950, 60100, 50) + '</g>' + this.cd.html +\n      '<line class=\"vo-base\" x1=\"1180\" x2=\"1360\" y1=\"' + VO_B + '\" y2=\"' + VO_B + '\" stroke-width=\"2\" style=\"stroke:color-mix(in srgb, var(--second) 30%, transparent)\"/>' +\n      '<rect class=\"vo-bar\" x=\"' + (VO_X - 32) + '\" width=\"64\" rx=\"6\" style=\"fill:color-mix(in srgb, var(--up) 60%, transparent);stroke:var(--up);stroke-width:2\"/></svg>' + chips +\n      '<p class=\"tag vo-n\" style=\"left:' + (VO_X + 56) + 'px;top:0;font-size:28px;color:var(--up);border-color:var(--up)\">0 BTC</p>' +\n      '<p class=\"fict vo-f\" style=\"position:absolute;left:1060px;top:300px;margin:0\">One fictional 1-minute candle</p>' +\n      '<p class=\"kick vo-vl\" style=\"position:absolute;left:1060px;top:' + (VO_B + 4) + 'px;margin:0;font-size:20px\">Volume</p>' +\n      '<div class=\"words\" style=\"left:140px;top:160px;width:900px\"><p class=\"kick vo-k\">Volume</p>' +\n      '<h2 class=\"line vo-tt\">How much was traded</h2></div>' +\n      '<p class=\"def vo-d\" style=\"position:absolute;left:140px;top:310px;width:800px;margin:0\"><b>Volume</b> is the total amount traded in a period of time, such as one minute.</p>' +\n      '<p class=\"chip vo-a\" style=\"position:absolute;left:140px;top:450px;margin:0;font-size:28px\"><span class=\"dot\"></span>Like a shop counting items sold each minute</p>' +\n      '<div class=\"glass vo-p\" style=\"left:140px;top:560px;width:800px;padding:20px 32px\">' +\n      '<p class=\"fict\" style=\"margin:0 0 8px\">Fictional trades in this minute</p>' +\n      '<p class=\"mono\" style=\"margin:0;font-size:40px\"><span class=\"vo-s\">2</span><span class=\"vo-s\"> + 5</span><span class=\"vo-s\"> + 3</span><span class=\"vo-s\"> + 2</span><span class=\"vo-eq\"> = <span class=\"up\">12 BTC</span></span></p>' +\n      '<p class=\"mono vo-u\" style=\"margin:10px 0 0;font-size:30px;color:color-mix(in srgb, var(--second) 80%, var(--ground))\">12 × 60,000 ≈ <span class=\"hl\">720,000 USDT</span></p></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.vo-k').style; this.t = q('.vo-tt'); this.d = q('.vo-d'); this.a = q('.vo-a').style; this.p = q('.vo-p').style;\n    this.ss = all('.vo-s').map((e) => e.style); this.eq = q('.vo-eq').style; this.u = q('.vo-u').style;\n    this.grid = q('.vo-grid').style; this.base = q('.vo-base').style; this.bar = q('.vo-bar'); this.n = q('.vo-n'); this.f = q('.vo-f').style; this.vl = q('.vo-vl').style;\n    this.chips = all('.vo-t').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'think' }, { t: 0.6, pose: 'explain' }, { t: 4.8, pose: 'idea' }, { t: 9.6, pose: 'magnify' }, { t: 14.8, pose: 'checklist' }, { t: 19.2, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.d, t, 0.7, { stagger: 0.04 });\n    UI.rise(this.a, t, 4.9);\n    this.grid.opacity = eo(seg(t, 8.8, 9.4)); this.base.opacity = this.grid.opacity; this.f.opacity = this.grid.opacity; this.vl.opacity = this.grid.opacity;\n    const k = t >= 14.6 ? { o: 60000, h: 60080, l: 59960, c: 60050 } : UI.forming(VO_K, 59960, 60080, t);\n    this.cd.set(0, { x: VO_X, w: 64, o: k.o, h: k.h, l: k.l, c: k.c, y: voY, live: !!k.live, op: eo(seg(t, 9.4, 9.7)) });\n    // Each trade chip flies into the bar; the bar then grows by that amount.\n    let vol = 0;\n    VO_TR.forEach((v, i) => {\n      const a = v[1], fly = eio(seg(t, a + 0.5, a + 1.1));\n      const s = this.chips[i];\n      s.opacity = (eo(seg(t, a, a + 0.3)) * (1 - ei(seg(t, a + 0.9, a + 1.15)))).toFixed(3);\n      s.transform = 'translate(' + lerp(1480, VO_X - 60, fly).toFixed(1) + 'px,' + lerp(360 + i * 30, VO_B - vol * VO_U - 60, fly).toFixed(1) + 'px) scale(' + lerp(1, 0.6, fly).toFixed(3) + ')';\n      vol += v[0] * eo(seg(t, a + 1.0, a + 1.4));\n    });\n    this.bar.setAttribute('y', (VO_B - vol * VO_U).toFixed(1)); this.bar.setAttribute('height', (vol * VO_U).toFixed(1));\n    this.bar.style.opacity = vol > 0.01 ? 1 : 0;\n    this.n.style.top = (VO_B - vol * VO_U - 22).toFixed(1) + 'px';\n    this.n.style.opacity = eo(seg(t, 10.0, 10.4));\n    UI.txt(this.n, Math.round(vol) + ' BTC');\n    UI.rise(this.p, t, 10.0);\n    this.ss.forEach((s, i) => { s.opacity = eo(seg(t, VO_TR[i][1] + 1.0, VO_TR[i][1] + 1.4)); });\n    this.eq.opacity = eo(seg(t, 15.0, 15.5));\n    this.u.opacity = eo(seg(t, 19.4, 19.9));\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson eighteen\",\n      \"dur\": 10,\n      \"desc\": \"Title card: Phase 4, lesson T18, volume, volatility and range; volume bars rise under candles; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"Same change, different ride\",\n      \"dur\": 16,\n      \"desc\": \"Two fictional charts both go from 60,000 to 60,100: one calm, one jumpy.\"\n    },\n    {\n      \"id\": \"volume\",\n      \"name\": \"Volume\",\n      \"dur\": 24,\n      \"desc\": \"Volume defined; a shop counting sales; trades of 2, 5, 3 and 2 BTC fill a 12 BTC volume bar, about 720,000 USDT.\"\n    },\n    {\n      \"id\": \"bars\",\n      \"name\": \"Volume bars\",\n      \"dur\": 22,\n      \"desc\": \"Fifteen fictional candles with a volume bar under each; quiet and busy minutes.\"\n    },\n    {\n      \"id\": \"range\",\n      \"name\": \"Range\",\n      \"dur\": 22,\n      \"desc\": \"Range is high minus low: 60,300 − 60,000 = 300 USDT, 0.5% of the low.\"\n    },\n    {\n      \"id\": \"volatility\",\n      \"name\": \"Volatility\",\n      \"dur\": 24,\n      \"desc\": \"Calm lake vs choppy sea: quiet candles average a 40 USDT range, volatile ones 250 USDT.\"\n    },\n    {\n      \"id\": \"lookback\",\n      \"name\": \"Previous high and low\",\n      \"dur\": 26,\n      \"desc\": \"A 10-minute lookback window gives 300 USDT (0.5%); stretched to 15 minutes, 600 USDT (1%).\"\n    },\n    {\n      \"id\": \"compare\",\n      \"name\": \"Two windows compared\",\n      \"dur\": 24,\n      \"desc\": \"Window A: 150 USDT range (0.25%), low volume, fees take a big share. Window B: 900 USDT (1.5%), high volume, bigger swings.\"\n    },\n    {\n      \"id\": \"liquidity\",\n      \"name\": \"Liquidity context\",\n      \"dur\": 22,\n      \"desc\": \"A 2 BTC market buy in a busy book fills at 60,000; in a thin book it averages 60,050: 50 USDT per BTC of slippage.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"Common mistake\",\n      \"dur\": 20,\n      \"desc\": \"A huge volume bar is not proof of buyers: 40 BTC bought means 40 BTC sold.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 22,\n      \"desc\": \"Pause: high 60,240, low 60,000. Range 240 USDT, 0.4%.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the limits\",\n      \"dur\": 22,\n      \"desc\": \"Past ranges promise nothing, volatility can jump, leverage and slippage, WAIT allowed.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 31,\n      \"desc\": \"Three key points and one question to check yourself.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T19, what is scalping (Phase 5).\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // No voice: a soft pad and keys bed, a light pulse in the hands-on parts, quieter for the warnings.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.volume, T.range) || inR(s, T.lookback, T.liquidity) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.mistake, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  const pop = (t, v) => S.fx('pop', t, { vel: v || 28, pitch: 7 });\n  const tick = (t, v) => S.fx('tick', t, { vel: v || 26 });\n  pop(T.title + 2.9);\n  for (let i = 0; i < 15; i++) tick(T.title + 0.75 + i * 0.32, 14);\n  // Hook: two paths draw, the +100 tags.\n  S.fx('whoosh', T.hook + 5.6, { dur: 1.4, vel: 18 }); pop(T.hook + 10.8, 28); pop(T.hook + 11.1, 28);\n  // Volume: four trades land in the bar, the sum.\n  [10.2, 11.4, 12.6, 13.8].forEach((a) => { pop(T.volume + a, 22); S.fx('tick', T.volume + a + 1.05, { vel: 32 }); });\n  S.fx('ding', T.volume + 15.0, { vel: 34 }); S.fx('chime', T.volume + 19.4, { vel: 30 });\n  // Bars: candles and bars grow; quiet vs busy; the big moves.\n  for (let i = 0; i < 15; i++) tick(T.bars + 1.0 + i * 0.3, 16);\n  S.fx('whoosh', T.bars + 5.2, { dur: 0.8, vel: 16 }); pop(T.bars + 10.8, 28); pop(T.bars + 12.0, 30);\n  [15.6, 15.9, 16.2].forEach((a) => pop(T.bars + a, 26));\n  // Range: the candle forms, the bracket, the percent.\n  S.fx('ding', T.range + 8.6, { vel: 30 }); S.fx('whoosh', T.range + 11.4, { dur: 0.8, vel: 18 }); S.fx('chime', T.range + 15.0, { vel: 32 });\n  // Volatility: quiet candles, volatile candles, averages.\n  for (let i = 0; i < 4; i++) { tick(T.volatility + 10.2 + i * 0.55, 18); pop(T.volatility + 15.1 + i * 0.55, 24); }\n  S.fx('ding', T.volatility + 13.0, { vel: 28 }); S.fx('ding', T.volatility + 17.9, { vel: 32 }); S.fx('thud', T.volatility + 20.6, { vel: 26 });\n  // Lookback: window appears, lines, the drag back, numbers change.\n  for (let i = 0; i < 15; i++) tick(T.lookback + 0.8 + i * 0.3, 14);\n  pop(T.lookback + 6.4, 28); [11.4, 12.0, 12.8, 13.6].forEach((a) => pop(T.lookback + a, 24));\n  S.fx('whoosh', T.lookback + 16.4, { dur: 1.8, vel: 20 }); S.fx('ding', T.lookback + 17.5, { vel: 36 });\n  // Compare: two windows, fee bars, a swing against you.\n  S.fx('whoosh', T.compare + 4.8, { dur: 1.6, vel: 16 }); S.fx('whoosh', T.compare + 9.0, { dur: 1.6, vel: 18 });\n  S.fx('thud', T.compare + 13.6, { vel: 28 }); pop(T.compare + 15.8, 26); S.fx('thud', T.compare + 19.4, { vel: 26 });\n  // Liquidity: the order eats the book.\n  pop(T.liquidity + 6.0, 28); tick(T.liquidity + 6.9, 30); S.fx('ding', T.liquidity + 8.0, { vel: 30 });\n  pop(T.liquidity + 10.0, 28); tick(T.liquidity + 10.9, 30); tick(T.liquidity + 11.6, 30); S.fx('thud', T.liquidity + 14.6, { vel: 30 });\n  // Mistake: the claim, the cross, the two equal sides.\n  pop(T.mistake + 3.4, 28); S.fx('thud', T.mistake + 5.4, { vel: 32 }); pop(T.mistake + 6.6, 28); pop(T.mistake + 8.4, 28); S.fx('chime', T.mistake + 17.2, { vel: 32 });\n  // Try it: countdown, then the answer.\n  pop(T.try + 0.8, 30);\n  for (let i = 0; i < 5; i++) tick(T.try + 6.4 + i, 30);\n  S.fx('chime', T.try + 11.8, { vel: 40 }); S.fx('ding', T.try + 14.0, { vel: 32 }); pop(T.try + 17.1, 26);\n  [4.8, 10.4, 16.5, 18.2].forEach((a) => pop(T.risks + a, 28));\n  [2.4, 8.0, 13.6].forEach((a) => pop(T.recap + a, 32));\n  S.fx('ding', T.recap + 25.8, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 21, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T18 · Volume, volatility and range',\n  TOTAL: 295,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // Side speech bubbles sit this far higher than in T01, so they clear the caption band (y ≈ 784–930).\n  LIFT: 96,\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n  // ── Lesson helpers (T07–T09, kept for T14) ──\n  // Set text only when it changes.\n  txt(el, s) { if (el.textContent !== s) el.textContent = s; },\n  // Fade and rise in at a (and fade out at o.out); returns the eased progress.\n  rise(st, t, a, o) {\n    o = o || {}; const K = UI.K, d = o.d == null ? 0.6 : o.d, dy = o.dy == null ? 30 : o.dy;\n    const p = K.seg(t, a, a + d), out = o.out == null ? 0 : K.ei(K.seg(t, o.out, o.out + 0.5));\n    st.opacity = (K.eo(K.seg(t, a, a + d * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + K.lerp(dy, 0, K.eo(p)).toFixed(2) + 'px) scale(' + K.lerp(o.s == null ? 0.96 : o.s, 1, K.eob(p, 1.5)).toFixed(4) + ')';\n    return p;\n  },\n  // Piecewise eased value through keys [[t, v], ...].\n  path(keys, t) {\n    const K = UI.K; let v = keys[0][1];\n    for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = K.lerp(a[1], b[1], K.eio(K.clamp01((t - a[0]) / (b[0] - a[0])))); }\n    return v;\n  },\n  // Countdown ring for \"try it\": returns {el (svg group html), render(t, t0, n)}.\n  ring(kit, cls, cx, cy) {\n    const R = 110, C = 2 * Math.PI * R;\n    const html = '<g class=\"' + cls + '\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + R + '\" fill=\"none\" stroke-width=\"14\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"' + cls + '-arc\" r=\"' + R + '\" fill=\"none\" stroke-width=\"14\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<text class=\"' + cls + '-n mono\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:84px\"></text></g>';\n    let arc, n, g;\n    return {\n      html,\n      render(t, t0, len, show) {\n        if (!g) { g = kit.stage.querySelector('.' + cls); arc = kit.stage.querySelector('.' + cls + '-arc'); n = kit.stage.querySelector('.' + cls + '-n'); }\n        g.style.opacity = show;\n        arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + len)).toFixed(1));\n        UI.txt(n, t < t0 ? String(len) : String(Math.max(0, Math.min(len, Math.ceil(len - (t - t0))))));\n      },\n    };\n  },\n  // Price grid for a chart: horizontal lines with price labels to the right of x1.\n  grid(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (+y + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Same grid with the price labels on the left, ending at x0 - 14.\n  gridL(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x0 - 14) + '\" y=\"' + (+y + 8) + '\" text-anchor=\"end\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Polyline of a price function f(s) for s in [s0, s1], mapped with xOf and yOf.\n  line(f, s0, s1, xOf, yOf, dt) {\n    let d = '';\n    for (let s = s0; s <= s1 + 1e-6; s += dt || 0.05) d += (d ? 'L' : 'M') + xOf(s).toFixed(1) + ' ' + yOf(f(s)).toFixed(1);\n    return d || 'M0 0';\n  },\n  // ── Candle helpers (T14) ──\n  // n SVG candles: html to place inside an <svg>; set(i, c) draws candle i with\n  // c = {x, w, o, h, l, c, y: price → y, op?, live?, col?}. Up (close ≥ open) is --up, down is --down.\n  cdl(kit, cls, n) {\n    let html = '';\n    for (let i = 0; i < n; i++) html += '<g class=\"' + cls + '\"><line class=\"' + cls + '-w\" stroke-linecap=\"round\"/><rect class=\"' + cls + '-b\" rx=\"4\"/></g>';\n    let G, W, B;\n    return {\n      html,\n      set(i, c) {\n        if (!G) { const all = (s) => [...kit.stage.querySelectorAll(s)]; G = all('.' + cls); W = all('.' + cls + '-w'); B = all('.' + cls + '-b'); }\n        const col = c.col || (c.c >= c.o ? 'var(--up)' : 'var(--down)');\n        const yt = c.y(Math.max(c.o, c.c)), yb = c.y(Math.min(c.o, c.c)), bh = Math.max(c.min == null ? 4 : c.min, yb - yt), ym = (yt + yb) / 2;\n        const w = W[i], b = B[i], sw = Math.max(3, c.w * 0.07);\n        w.setAttribute('x1', c.x.toFixed(1)); w.setAttribute('x2', c.x.toFixed(1));\n        w.setAttribute('y1', c.y(c.h).toFixed(1)); w.setAttribute('y2', c.y(c.l).toFixed(1));\n        w.setAttribute('stroke-width', sw.toFixed(1)); w.style.stroke = col;\n        b.setAttribute('x', (c.x - c.w / 2).toFixed(1)); b.setAttribute('width', c.w.toFixed(1));\n        b.setAttribute('y', (ym - bh / 2).toFixed(1)); b.setAttribute('height', bh.toFixed(1));\n        b.setAttribute('stroke-width', (sw * 0.8).toFixed(1));\n        b.style.stroke = col;\n        b.style.fill = c.live ? 'color-mix(in srgb, ' + col + ' 38%, var(--ground))' : col;\n        G[i].style.opacity = c.op == null ? 1 : c.op;\n      },\n    };\n  },\n  // Price as a function of time from keys [[t, price], ...] plus a small fictional wiggle (amp USDT).\n  pf(keys, amp) { return (t) => UI.path(keys, t) + (amp ? (Math.sin(t * 2.9) * 0.6 + Math.sin(t * 7.3 + 1.1) * 0.4) * amp : 0); },\n  // Fade an element in at a and out at b (opacity only).\n  fade(st, t, a, b) { const K = UI.K; st.opacity = (K.eo(K.seg(t, a, a + 0.5)) * (b == null ? 1 : 1 - K.ei(K.seg(t, b, b + 0.45)))).toFixed(3); },\n  // ── T18: one fictional BTC/USDT 1-minute history (15 candles) with volume in BTC ──\n  // [open, high, low, close, volume]; each open is the previous close. Last 10: high 60,300 (#6), low 60,000 (#9). All 15: high 60,600 (#0).\n  H: [[60520, 60600, 60500, 60580, 9], [60580, 60590, 60380, 60400, 22], [60400, 60420, 60220, 60250, 18], [60250, 60330, 60230, 60310, 8], [60310, 60320, 60180, 60200, 10],\n    [60200, 60260, 60150, 60240, 6], [60240, 60300, 60220, 60280, 7], [60280, 60290, 60180, 60190, 9], [60190, 60210, 60100, 60120, 11], [60120, 60140, 60000, 60040, 24],\n    [60040, 60130, 60020, 60110, 15], [60110, 60170, 60090, 60160, 8], [60160, 60200, 60140, 60150, 5], [60150, 60230, 60130, 60210, 6], [60210, 60260, 60190, 60240, 7]],\n  // A forming candle: price through keys [[t, p]] with a small wiggle, kept inside [lo, hi]; returns the candle at time t.\n  forming(keys, lo, hi, t) {\n    const K = UI.K, a = keys[0][0], b = keys[keys.length - 1][0];\n    const f = (s) => Math.min(hi, Math.max(lo, UI.path(keys, s) + 9 * Math.sin(s * 9.3) * Math.sin(Math.PI * K.clamp01((s - a) / (b - a)))));\n    const e = Math.min(Math.max(t, a), b), hl = UI.hilo(f, a, e);\n    return { o: keys[0][1], h: hl[1], l: hl[0], c: f(e), live: t < b };\n  },\n  hilo(fn, a, b) { let lo = fn(a), hi = lo; for (let s = a; s <= b; s += 0.05) { const v = fn(s); if (v < lo) lo = v; if (v > hi) hi = v; } const v = fn(b); return [Math.min(lo, v), Math.max(hi, v)]; },\n};\nUI.K = kit;\n","tutor.json":"{\n  \"present\": {\n    \"w\": 546,\n    \"h\": 612,\n    \"ax\": 218,\n    \"feet\": 605,\n    \"bw\": 421\n  },\n  \"explain\": {\n    \"w\": 502,\n    \"h\": <script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *
 * build-lesson.mjs inlines this file into public/futures-edge/lessons/<id>.html, after a
 * `window.FILM = {...}` block that carries the scene list, module texts and asset paths.
 */
(function () {
  "use strict";

  const F = window.FILM;
  const W = F.width;
  const H = F.height;

  // ── Maths and easing ───────────────────────────────────────────────────────
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clamp01 = (x) => clamp(x, 0, 1);
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a)));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const ei = (x) => Math.pow(clamp01(x), 3);
  const eio = (x) => {
    x = clamp01(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  };
  const eob = (x, s = 1.4) => {
    x = clamp01(x);
    return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  };
  const rng = (seed) => {
    let a = seed >>> 0 || 1;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const breathe = (t, amt = 0.012, period = 3.2) => 1 + amt * Math.sin((2 * Math.PI * t) / period);

  // ── DOM helpers ────────────────────────────────────────────────────────────
  const h = (html) => {
    const tpl = document.createElement("template");
    tpl.innerHTML = String(html).trim();
    return tpl.content.firstElementChild;
  };
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    const e = document.createElement(tag);
    if (o.class) e.className = o.class;
    if (o.style) e.setAttribute("style", o.style);
    if (o.text != null) e.textContent = o.text;
    if (o.html != null) e.innerHTML = o.html;
    for (const [k, v] of Object.entries(o.attrs || {})) e.setAttribute(k, v);
    for (const c of children) e.append(c);

    let list = wordCache.get(root);
    if (list) return list;
    list = [];
    const walk = (node) => {
      for (const child of Array.from(node.childNodes)) {
        if (child.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const part of child.textContent.split(/(\s+)/)) {
            if (!part) continue;
            if (/^\s+$/.test(part)) {
              frag.append(document.createTextNode(part));
            } else {
              const s = document.createElement("span");
              s.textContent = part;
              s.style.display = "inline-block";
              frag.append(s);
              list.push(s);
            }
          }
          node.replaceChild(frag, child);
        } else if (child.nodeType === 1) {
          walk(child);
        }

    };
    walk(root);
    wordCache.set(root, list);
    return list;

    fadeFromRight(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.11, d = o.dur ?? 0.5, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = eo(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = p;
        s.style.transform = "translateX(" + ((1 - p) * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
    fadeOutLeft(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.04, d = o.dur ?? 0.35, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = ei(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = 1 - p;
        s.style.transform = "translateX(" + (-p * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
  };

  // ── The kit the scene modules use ──────────────────────────────────────────
  const modules = F.modules;
  const jsonCache = {};
  const assets = {
    url: (name) => F.assetBase + name,
    has: (name) => Object.prototype.hasOwnProperty.call(F.assets, name),
    list: () => Object.keys(F.assets),
  };
  const defs = {};
  let scoreFn = null;

  // start/dur: the scene in the played timeline; oldStart/oldDur: as authored (k = dur / oldDur).
  let acc = 0;
  const scenes = F.scenes.map((s) => {
    const o = Object.assign({ k: 1, oldStart: acc, oldDur: s.dur }, s, { start: acc });
    acc += s.dur;
