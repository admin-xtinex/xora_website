<script>window.FILM = {"id":"T27","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson twenty-seven","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"One coin, many cards","dur":14,"k":1,"oldStart":8,"oldDur":14},{"id":"opportunity","name":"Trade opportunity","dur":21,"k":1,"oldStart":22,"oldDur":21},{"id":"rmath","name":"What R means","dur":22,"k":1,"oldStart":43,"oldDur":22},{"id":"insights","name":"AI insights page","dur":28,"k":1,"oldStart":65,"oldDur":28},{"id":"plan","name":"The trade plan maths","dur":23,"k":1,"oldStart":93,"oldDur":23},{"id":"market","name":"Market: ATR and swings","dur":20,"k":1,"oldStart":116,"oldDur":20},{"id":"carousel1","name":"Xora read and volume","dur":21,"k":1,"oldStart":136,"oldDur":21},{"id":"carousel2","name":"Order book, replay, levels","dur":30,"k":1,"oldStart":157,"oldDur":30},{"id":"horizon","name":"A 1-minute horizon","dur":20,"k":1,"oldStart":187,"oldDur":20},{"id":"mistake","name":"Not a forecast","dur":17,"k":1,"oldStart":207,"oldDur":17},{"id":"try","name":"Try it","dur":24,"k":1,"oldStart":224,"oldDur":24},{"id":"risks","name":"Know the limits","dur":22,"k":1,"oldStart":248,"oldDur":22},{"id":"recap","name":"Recap","dur":20,"k":1,"oldStart":270,"oldDur":20},{"id":"finish","name":"Course complete","dur":13,"k":1,"oldStart":290,"oldDur":13}],"voice":{"src":null,"lines":[{"t":0.6,"d":7.15,"text":"Lesson twenty-seven: reading XORA trading insights. The last lesson of Phase 6.","ml":"പാഠം ഇരുപത്തിയേഴ്: XORA trading insights വായിക്കാം. Phase 6-ലെ അവസാന പാഠം."},{"t":8.4,"d":5.35,"text":"In T26 you learned how XORA decides. Now let's read what it shows you.","ml":"T26-ൽ XORA എങ്ങനെ തീരുമാനിക്കുന്നു എന്ന് പഠിച്ചു. ഇനി അത് കാണിക്കുന്നത് വായിക്കാം."},{"t":14,"d":7.75,"text":"The Signals screen packs a lot onto one coin. We'll read it card by card, top to bottom.","ml":"Signals സ്ക്രീനിൽ ഒരു കോയിനെക്കുറിച്ച് ഒരുപാടുണ്ട്. മുകളിൽ നിന്ന് ഓരോ card ആയി വായിക്കാം."},{"t":22.4,"d":7.35,"text":"First, the TRADE OPPORTUNITY card. It shows the direction and the setup: here, BUY, support reclaim.","ml":"ആദ്യം TRADE OPPORTUNITY card. ദിശയും setup-ഉം കാണിക്കും: ഇവിടെ BUY, support reclaim."},{"t":30,"d":6.55,"text":"ENTRY is where the trade would start. STOP is where it closes if price goes against you.","ml":"ENTRY: ട്രേഡ് തുടങ്ങുന്ന വില. STOP: വില എതിരായി പോയാൽ ട്രേഡ് അടയുന്ന വില."},{"t":36.8,"d":5.95,"text":"RISK is the stop distance in percent. NEXT RES. is the next resistance above.","ml":"RISK: stop-ലേക്കുള്ള ദൂരം ശതമാനത്തിൽ. NEXT RES.: മുകളിലെ അടുത്ത resistance."},{"t":43.4,"d":5.15,"text":"Under the numbers, a bar reads: 2.0 R to the next level. What is R?","ml":"അക്കങ്ങൾക്ക് താഴെ ഒരു bar: 2.0 R to the next level. R എന്താണ്?"},{"t":48.8,"d":6.35,"text":"One R is your risk: the distance from entry to stop. Here, 60,000 minus 59,700 is 300.","ml":"ഒരു R = നിങ്ങളുടെ റിസ്ക്: entry മുതൽ stop വരെയുള്ള ദൂരം. ഇവിടെ 60,000 − 59,700 = 300."},{"t":55.4,"d":5.75,"text":"The next resistance is 600 away. 600 divided by 300 is 2. So, 2.0 R of room.","ml":"അടുത്ത resistance 600 അകലെ. 600 ÷ 300 = 2. അതായത് 2.0 R ഇടം."},{"t":61.4,"d":3.35,"text":"It's room on the chart, not a promise.","ml":"അത് ചാർട്ടിലെ ഇടമാണ്, ഉറപ്പല്ല."},{"t":65.4,"d":5.75,"text":"Tap Full AI insights for the detailed page. It refreshes every 20 seconds.","ml":"വിശദമായ പേജിന് Full AI insights തൊടൂ. അത് ഓരോ 20 സെക്കൻഡിലും പുതുക്കും."},{"t":71.4,"d":5.95,"text":"At the top, the verdict: BUY if price trades above 60,000. For this candle only.","ml":"മുകളിൽ verdict: വില 60,000-ന് മുകളിൽ പോയാൽ BUY. ഈ candle-ന് മാത്രം."},{"t":77.6,"d":6.75,"text":"The PRICE MAP lines up resistance, support, your stop and entry, with distances in percent.","ml":"PRICE MAP-ൽ resistance, support, stop, entry എന്നിവ ശതമാന ദൂരത്തോടെ നിരത്തുന്നു."},{"t":84.6,"d":8.15,"text":"Further down: the ENTRY CHECKLIST, TRADE MANAGEMENT for open trades, and ENGINE STATUS.","ml":"താഴെ: ENTRY CHECKLIST, തുറന്ന ട്രേഡുകൾക്ക് TRADE MANAGEMENT, പിന്നെ ENGINE STATUS."},{"t":93.4,"d":5.75,"text":"The TRADE PLAN does the maths. First, size: your margin times your leverage.","ml":"TRADE PLAN കണക്ക് ചെയ്യും. ആദ്യം size: നിങ്ങളുടെ margin × leverage."},{"t":99.4,"d":5.15,"text":"With 3 USDT margin at 10x, the position size is 3 times 10: 30 USDT.","ml":"3 USDT margin-ഉം 10x leverage-ഉം ആണെങ്കിൽ position size 3 × 10 = 30 USDT."},{"t":104.8,"d":4.25,"text":"The stop is 0.50% away. 0.50% of 30 USDT is 0.15 USDT.","ml":"Stop 0.50% അകലെ. 30 USDT-ന്റെ 0.50% = 0.15 USDT."},{"t":109.3,"d":6.45,"text":"So if the stop is hit, you lose about 0.15 USDT, plus fees. Slippage can make it more.","ml":"Stop hit ആയാൽ ഏകദേശം 0.15 USDT നഷ്ടം, ഫീസ് വേറെ. Slippage അത് കൂട്ടാം."},{"t":116.4,"d":6.55,"text":"MARKET shows volatility as ATR, the average true range: how far a candle usually travels.","ml":"MARKET volatility ATR ആയി കാണിക്കും: ഒരു candle സാധാരണ എത്ര ദൂരം നീങ്ങും എന്ന്."},{"t":123.2,"d":5.65,"text":"Here, ATR on 5 minutes is 90 USDT. Bigger ATR means wilder moves.","ml":"ഇവിടെ 5 മിനിറ്റ് ATR 90 USDT. ATR കൂടിയാൽ നീക്കങ്ങൾ കൂടുതൽ ശക്തം."},{"t":129.1,"d":6.65,"text":"Recent swing highs and lows are the turning points price left behind.","ml":"അടുത്തിടെയുള്ള swing high-ഉം low-ഉം വില തിരിഞ്ഞ സ്ഥലങ്ങളാണ്."},{"t":136.4,"d":5.95,"text":"Next, swipe the market-read carousel. Card one: the Xora read, a plain summary.","ml":"ഇനി market-read carousel swipe ചെയ്യൂ. ഒന്നാം card: Xora read, ലളിതമായ ചുരുക്കം."},{"t":142.6,"d":7.25,"text":"Its note says: computed on this phone, explanatory only. The engine's stop and exits do not use it.","ml":"കുറിപ്പ്: ഫോണിൽ കണക്കാക്കിയത്, വിശദീകരണം മാത്രം. Engine-ന്റെ stop-ഉം exit-ഉം ഇത് ഉപയോഗിക്കില്ല."},{"t":150.1,"d":6.65,"text":"Card two: VOLUME COMPARISON. Buy volume against sell volume in this price range.","ml":"രണ്ടാം card: VOLUME COMPARISON. ഈ വില പരിധിയിൽ buy volume-ഉം sell volume-ഉം."},{"t":157.4,"d":7.15,"text":"Card three: ORDER BOOK DIFFERENCE. Big resting orders, called walls, on each side, and the spread.","ml":"മൂന്നാം card: ORDER BOOK DIFFERENCE. ഇരുവശത്തും വലിയ ഓർഡറുകൾ, walls, പിന്നെ spread."},{"t":164.8,"d":4.55,"text":"Spoof risk: walls that appear and vanish may be fake.","ml":"Spoof risk: വന്നുപോകുന്ന walls വ്യാജമാകാം."},{"t":169.6,"d":4.75,"text":"Absorption: big orders soak up trades, and price barely moves.","ml":"Absorption: വലിയ ഓർഡറുകൾ ട്രേഡുകൾ ഏറ്റെടുക്കുന്നു, വില കാര്യമായി നീങ്ങുന്നില്ല."},{"t":174.6,"d":5.75,"text":"Card four: PRICE-RANGE REPLAY. When price was here before, compared with now.","ml":"നാലാം card: PRICE-RANGE REPLAY. മുമ്പ് വില ഇവിടെ വന്നപ്പോൾ എന്ത് സംഭവിച്ചു, ഇപ്പോൾ എങ്ങനെ."},{"t":180.6,"d":6.15,"text":"Card five: TRIGGER LEVELS. For example, the stop: where the trade closes.","ml":"അഞ്ചാം card: TRIGGER LEVELS. ഉദാഹരണം: stop, ട്രേഡ് അടയുന്ന സ്ഥലം."},{"t":187.4,"d":5.25,"text":"How far ahead does XORA look? Decisions are made per 1-minute candle.","ml":"XORA എത്ര മുന്നോട്ട് നോക്കും? തീരുമാനങ്ങൾ ഓരോ 1 മിനിറ്റ് candle-നും."},{"t":192.9,"d":5.95,"text":"Each plan lasts one candle. When it closes, the checks run again on fresh data.","ml":"ഓരോ plan-ഉം ഒരു candle മാത്രം. അത് അടയുമ്പോൾ പുതിയ ഡാറ്റയിൽ പരിശോധനകൾ വീണ്ടും."},{"t":199.1,"d":7.65,"text":"The 5m, 15m and 1h charts add context. XORA does not predict price 10 or 15 minutes ahead.","ml":"5m, 15m, 1h ചാർട്ടുകൾ സന്ദർഭം നൽകും. 10 അല്ലെങ്കിൽ 15 മിനിറ്റ് മുന്നിലെ വില XORA പ്രവചിക്കില്ല."},{"t":207.4,"d":5.95,"text":"A common mistake: treating insights as a forecast. 2.0 R is room, not a promise.","ml":"സാധാരണ തെറ്റ്: insights പ്രവചനമായി കാണുന്നത്. 2.0 R ഇടമാണ്, ഉറപ്പല്ല."},{"t":213.6,"d":5.35,"text":"And the Xora read only explains the market now. It does not predict it.","ml":"Xora read ഇപ്പോഴത്തെ മാർക്കറ്റ് വിശദീകരിക്കുന്നു. അത് പ്രവചിക്കുന്നില്ല."},{"t":219.2,"d":4.55,"text":"Use insights to understand a setup, then decide calmly.","ml":"Insights കൊണ്ട് setup മനസ്സിലാക്കൂ, എന്നിട്ട് ശാന്തമായി തീരുമാനിക്കൂ."},{"t":224.4,"d":11.35,"text":"Your turn. Margin 3 USDT at 10x. Entry 60,000, stop 59,400. How much is at risk?","ml":"നിങ്ങളുടെ ഊഴം. Margin 3 USDT, 10x. Entry 60,000, stop 59,400. എത്ര റിസ്ക്?"},{"t":236,"d":6.35,"text":"Size is 3 times 10: 30 USDT. The stop is 600 away: 1.00%. 1.00% of 30 is 0.30 USDT.","ml":"Size 3 × 10 = 30 USDT. Stop 600 അകലെ: 1.00%. 30-ന്റെ 1.00% = 0.30 USDT."},{"t":242.6,"d":5.15,"text":"That's 0.30 USDT before fees and slippage. Well done if you got it!","ml":"ഫീസും slippage-ഉം കൂടാതെ 0.30 USDT. കിട്ടിയെങ്കിൽ കൊള്ളാം!"},{"t":248.4,"d":4.25,"text":"Insights help, but they don't remove risk.","ml":"Insights സഹായിക്കും, പക്ഷേ റിസ്ക് ഇല്ലാതാക്കില്ല."},{"t":252.9,"d":5.35,"text":"XORA does not guarantee profits. Setups fail, and losing trades happen.","ml":"XORA ലാഭം ഉറപ്പ് നൽകുന്നില്ല. Setup-കൾ പരാജയപ്പെടാം, നഷ്ട ട്രേഡുകൾ സംഭവിക്കും."},{"t":258.5,"d":5.35,"text":"Fees, slippage and leverage can make a loss bigger than the plan shows.","ml":"ഫീസ്, slippage, leverage എന്നിവ plan കാണിക്കുന്നതിലും വലിയ നഷ്ടം ഉണ്ടാക്കാം."},{"t":264.1,"d":5.65,"text":"Practise in DEMO first. This is education, not financial advice.","ml":"ആദ്യം DEMO-യിൽ പരിശീലിക്കൂ. ഇത് പഠനമാണ്, സാമ്പത്തിക ഉപദേശമല്ല."},{"t":270.4,"d":5.55,"text":"Recap. The TRADE OPPORTUNITY card: entry, stop, risk, next level, and R.","ml":"ചുരുക്കം: TRADE OPPORTUNITY card: entry, stop, risk, next level, R."},{"t":276.2,"d":5.15,"text":"Size is margin times leverage. Risk is size times the stop distance.","ml":"Size = margin × leverage. Risk = size × stop ദൂരം."},{"t":281.6,"d":8.15,"text":"Insights explain the market now. They are not predictions.","ml":"Insights ഇപ്പോഴത്തെ മാർക്കറ്റ് വിശദീകരിക്കുന്നു. അവ പ്രവചനങ്ങളല്ല."},{"t":290.6,"d":5.75,"text":"Congratulations! You've finished Phase 6, and the whole Futures Edge course.","ml":"അഭിനന്ദനങ്ങൾ! Phase 6-ഉം മുഴുവൻ Futures Edge കോഴ്സും നിങ്ങൾ പൂർത്തിയാക്കി."},{"t":296.6,"d":6.15,"text":"Now practise in DEMO. XORA does not guarantee profits. Not financial advice.","ml":"ഇനി DEMO-യിൽ പരിശീലിക്കൂ. XORA ലാഭം ഉറപ്പ് നൽകുന്നില്ല. സാമ്പത്തിക ഉപദേശമല്ല."}]},"assetBase":"T27/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-laptop.webp":{"mime":"image/webp","w":185,"h":170},"tutor-pointer.webp":{"mime":"image/webp","w":248,"h":171},"tutor-writing.webp":{"mime":"image/webp","w":191,"h":169}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* Phase 6: app colours (green buy, red sell), phone mock-ups of the XORA app */\n#stage { --up:#2fd897; --down:#ff5c7c; --warn:#ffb547 }\n.up { color:var(--up) } .dn { color:var(--down) }\n.phone { position:absolute; box-sizing:border-box; border-radius:54px; padding:30px 26px 22px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 86%, var(--main)), color-mix(in srgb, var(--ground) 95%, var(--second))); border:2px solid color-mix(in srgb, var(--main) 28%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.5); overflow:hidden }\n.phone-notch { width:110px; height:8px; border-radius:8px; margin:0 auto 18px; background:color-mix(in srgb, var(--second) 18%, transparent) }\n.phone-top { display:flex; align-items:center; justify-content:space-between; margin:0 6px 14px }\n.phone-top b { font-family:var(--display, var(--sans)); font-size:30px; letter-spacing:.06em }\n.pill { display:inline-flex; align-items:center; gap:8px; padding:6px 16px; border-radius:999px; font-family:var(--mono, ui-monospace, monospace); font-size:22px; font-weight:600; border:1.5px solid currentColor; white-space:nowrap }\n.card { box-sizing:border-box; border-radius:22px; padding:16px 20px; background:color-mix(in srgb, var(--ground) 80%, var(--second)); border:1.5px solid color-mix(in srgb, var(--second) 12%, transparent) }\n.card-h { margin:0 0 10px; font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.14em; color:color-mix(in srgb, var(--second) 62%, var(--ground)) }\n.lbl { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.06em; color:color-mix(in srgb, var(--second) 58%, var(--ground)) }\n.mock { position:absolute; margin:0; font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.12em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 50%, var(--ground)); white-space:nowrap }\n.risk-line { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.08em; color:var(--warn) }\n","narration.json":"{\n  \"about\": \"T27 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson twenty-seven: reading XORA trading insights. The last lesson of Phase 6.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"In T26 you learned how XORA decides. Now let's read what it shows you.\"\n    },\n    {\n      \"t\": 14.0,\n      \"text\": \"The Signals screen packs a lot onto one coin. We'll read it card by card, top to bottom.\"\n    },\n    {\n      \"t\": 22.4,\n      \"text\": \"First, the TRADE OPPORTUNITY card. It shows the direction and the setup: here, BUY, support reclaim.\"\n    },\n    {\n      \"t\": 30.0,\n      \"text\": \"ENTRY is where the trade would start. STOP is where it closes if price goes against you.\"\n    },\n    {\n      \"t\": 36.8,\n      \"text\": \"RISK is the stop distance in percent. NEXT RES. is the next resistance above.\"\n    },\n    {\n      \"t\": 43.4,\n      \"text\": \"Under the numbers, a bar reads: 2.0 R to the next level. What is R?\"\n    },\n    {\n      \"t\": 48.8,\n      \"text\": \"One R is your risk: the distance from entry to stop. Here, 60,000 minus 59,700 is 300.\"\n    },\n    {\n      \"t\": 55.4,\n      \"text\": \"The next resistance is 600 away. 600 divided by 300 is 2. So, 2.0 R of room.\"\n    },\n    {\n      \"t\": 61.4,\n      \"text\": \"It's room on the chart, not a promise.\"\n    },\n    {\n      \"t\": 65.4,\n      \"text\": \"Tap Full AI insights for the detailed page. It refreshes every 20 seconds.\"\n    },\n    {\n      \"t\": 71.4,\n      \"text\": \"At the top, the verdict: BUY if price trades above 60,000. For this candle only.\"\n    },\n    {\n      \"t\": 77.6,\n      \"text\": \"The PRICE MAP lines up resistance, support, your stop and entry, with distances in percent.\"\n    },\n    {\n      \"t\": 84.6,\n      \"text\": \"Further down: the ENTRY CHECKLIST, TRADE MANAGEMENT for open trades, and ENGINE STATUS.\"\n    },\n    {\n      \"t\": 93.4,\n      \"text\": \"The TRADE PLAN does the maths. First, size: your margin times your leverage.\"\n    },\n    {\n      \"t\": 99.4,\n      \"text\": \"With 3 USDT margin at 10x, the position size is 3 times 10: 30 USDT.\"\n    },\n    {\n      \"t\": 104.8,\n      \"text\": \"The stop is 0.50% away. 0.50% of 30 USDT is 0.15 USDT.\"\n    },\n    {\n      \"t\": 109.3,\n      \"text\": \"So if the stop is hit, you lose about 0.15 USDT, plus fees. Slippage can make it more.\"\n    },\n    {\n      \"t\": 116.4,\n      \"text\": \"MARKET shows volatility as ATR, the average true range: how far a candle usually travels.\"\n    },\n    {\n      \"t\": 123.2,\n      \"text\": \"Here, ATR on 5 minutes is 90 USDT. Bigger ATR means wilder moves.\"\n    },\n    {\n      \"t\": 129.1,\n      \"text\": \"Recent swing highs and lows are the turning points price left behind.\"\n    },\n    {\n      \"t\": 136.4,\n      \"text\": \"Next, swipe the market-read carousel. Card one: the Xora read, a plain summary.\"\n    },\n    {\n      \"t\": 142.6,\n      \"text\": \"Its note says: computed on this phone, explanatory only. The engine's stop and exits do not use it.\"\n    },\n    {\n      \"t\": 150.1,\n      \"text\": \"Card two: VOLUME COMPARISON. Buy volume against sell volume in this price range.\"\n    },\n    {\n      \"t\": 157.4,\n      \"text\": \"Card three: ORDER BOOK DIFFERENCE. Big resting orders, called walls, on each side, and the spread.\"\n    },\n    {\n      \"t\": 164.8,\n      \"text\": \"Spoof risk: walls that appear and vanish may be fake.\"\n    },\n    {\n      \"t\": 169.6,\n      \"text\": \"Absorption: big orders soak up trades, and price barely moves.\"\n    },\n    {\n      \"t\": 174.6,\n      \"text\": \"Card four: PRICE-RANGE REPLAY. When price was here before, compared with now.\"\n    },\n    {\n      \"t\": 180.6,\n      \"text\": \"Card five: TRIGGER LEVELS. For example, the stop: where the trade closes.\"\n    },\n    {\n      \"t\": 187.4,\n      \"text\": \"How far ahead does XORA look? Decisions are made per 1-minute candle.\"\n    },\n    {\n      \"t\": 192.9,\n      \"text\": \"Each plan lasts one candle. When it closes, the checks run again on fresh data.\"\n    },\n    {\n      \"t\": 199.1,\n      \"text\": \"The 5m, 15m and 1h charts add context. XORA does not predict price 10 or 15 minutes ahead.\"\n    },\n    {\n      \"t\": 207.4,\n      \"text\": \"A common mistake: treating insights as a forecast. 2.0 R is room, not a promise.\"\n    },\n    {\n      \"t\": 213.6,\n      \"text\": \"And the Xora read only explains the market now. It does not predict it.\"\n    },\n    {\n      \"t\": 219.2,\n      \"text\": \"Use insights to understand a setup, then decide calmly.\"\n    },\n    {\n      \"t\": 224.4,\n      \"text\": \"Your turn. Margin 3 USDT at 10x. Entry 60,000, stop 59,400. How much is at risk?\"\n    },\n    {\n      \"t\": 236.0,\n      \"text\": \"Size is 3 times 10: 30 USDT. The stop is 600 away: 1.00%. 1.00% of 30 is 0.30 USDT.\"\n    },\n    {\n      \"t\": 242.6,\n      \"text\": \"That's 0.30 USDT before fees and slippage. Well done if you got it!\"\n    },\n    {\n      \"t\": 248.4,\n      \"text\": \"Insights help, but they don't remove risk.\"\n    },\n    {\n      \"t\": 252.9,\n      \"text\": \"XORA does not guarantee profits. Setups fail, and losing trades happen.\"\n    },\n    {\n      \"t\": 258.5,\n      \"text\": \"Fees, slippage and leverage can make a loss bigger than the plan shows.\"\n    },\n    {\n      \"t\": 264.1,\n      \"text\": \"Practise in DEMO first. This is education, not financial advice.\"\n    },\n    {\n      \"t\": 270.4,\n      \"text\": \"Recap. The TRADE OPPORTUNITY card: entry, stop, risk, next level, and R.\"\n    },\n    {\n      \"t\": 276.2,\n      \"text\": \"Size is margin times leverage. Risk is size times the stop distance.\"\n    },\n    {\n      \"t\": 281.6,\n      \"text\": \"Insights explain the market now. They are not predictions.\"\n    },\n    {\n      \"t\": 290.6,\n      \"text\": \"Congratulations! You've finished Phase 6, and the whole Futures Edge course.\"\n    },\n    {\n      \"t\": 296.6,\n      \"text\": \"Now practise in DEMO. XORA does not guarantee profits. Not financial advice.\"\n    }\n  ]\n}","scene-carousel1.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Carousel cards one and two: the Xora read (explanatory only) and the volume comparison.\nconst C1_NAMES = ['Xora read', 'Volume', 'Order book', 'Replay', 'Levels'];\nkit.scene('carousel1', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\"></div>'));\n    this.car = UI.carousel(kit, 'c1');\n    let names = '';\n    C1_NAMES.forEach((n, i) => { names += '<div class=\"c1-n\" style=\"display:flex;align-items:center;gap:18px\"><span class=\"mono\" style=\"width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:2px solid currentColor;flex:none\">' + (i + 1) + '</span><span style=\"font-size:32px;font-weight:700\">' + n + '</span></div>'; });\n    kit.stage.append(kit.h('<div>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:900px\"><p class=\"kick c1-k\">Market-read carousel</p><h2 class=\"line c1-t\" style=\"font-size:72px\">Swipe to read the market</h2></div>' +\n      ' (t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(kit, this.qc, t, 0.8, 0.6, 24);\n    UI.rise(kit, this.a, t, 12.0, 0.5, 20);\n    this.ss.forEach((s, i) => { const a = TY_STEPS[i][0]; s.opacity = eo(seg(t, a, a + 0.5)); s.transform = 'translateX(' + lerp(20, 0, eo(seg(t, a, a + 0.6))).toFixed(1) + 'px)'; });\n    this.f.opacity = eo(seg(t, 18.6, 19.1));\n    this.ring(t);\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as T01: deep void ground, frosted glass panels, clean generic phone mock-ups of the XORA app (fictional numbers), the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson twenty-seven\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 6 XORA Intelligence, lesson T27 Reading XORA trading insights.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"One coin, many cards\",\n      \"dur\": 14,\n      \"desc\": \"A phone mock of the Signals screen scrolls through its cards.\"\n    },\n    {\n      \"id\": \"opportunity\",\n      \"name\": \"Trade opportunity\",\n      \"dur\": 21,\n      \"desc\": \"TRADE OPPORTUNITY card: BUY, support reclaim, ENTRY, STOP, RISK %, NEXT RES., approve countdown.\"\n    },\n    {\n      \"id\": \"rmath\",\n      \"name\": \"What R means\",\n      \"dur\": 22,\n      \"desc\": \"Stop, entry, target bar: risk 300, room 600, 2.0 R to the \"Recap\",\n      \"dur\": 20,\n      \"desc\": \"Three points to remember.\"\n    },\n    {\n      \"id\": \"finish\",\n      \"name\": \"Course complete\",\n      \"dur\": 13,\n      \"desc\": \"Congratulations on finishing Phase 6 and the course; practise in DEMO; risk line; lockup.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // Soft pad and keys bed (no voice), a light pulse in the hands-on parts, quieter in the risk scenes, a closing chord.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.hook, T.opportunity) || inR(s, T.plan, T.market) || inR(s, T.carousel1, T.horizon) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.mistake, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.finish - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 32 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 46 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.finish + 0.1, T.finish + 1.1);\n  [[T.title, 0.8], [T.title, 1.3], [T.title, 1.8], [T.hook, 0.5], [T.opportunity, 0.4], [T.opportunity, 0.6], [T.opportunity, 8.0], [T.opportunity, 14.8],\n    [T.rmath, 1.0], [T.rmath, 1.6], [T.rmath, 2.2], [T.insights, 0.5], [T.insights, 12.9], [T.plan, 0.4], [T.plan, 1.4], [T.plan, 11.8],\n    [T.market, 7.2], [T.carousel1, 0.5], [T.carousel1, 7.4], [T.carousel2, 0.6], [T.carousel2, 7.8], [T.carousel2, 12.6], [T.horizon, 0.8], [T.horizon, 14.4],\n    [T.mistake, 1.0], [T.mistake, 6.6], [T.try, 0.8]].forEach((b) => S.fx('pop', b[0] + b[1], { vel: 26, pitch: 7 }));\n  for (let i = 0; i < 6; i++) S.fx('whoosh', T.hook + 5.6 + i * 1.2, { dur: 0.6, vel: 16 });\n  S.fx('whoosh', T.rmath + 12.6, { dur: 1.0, vel: 22 }); S.fx('tick', T.rmath + 13.6, { vel: 32 }); S.fx('tick', T.rmath + 15.4, { vel: 32 }); S.fx('ding', T.rmath + 16.0, { vel: 36 });\n  for (let i = 0; i < 4; i++) S.fx('tick', T.insights + 13.4 + i * 0.9, { vel: 24 });\n  S.fx('whoosh', T.insights + 19.8, { dur: 1.4, vel: 22 });\n  S.fx('ding', T.plan + 7.6, { vel: 36 }); S.fx('ding', T.plan + 13.6, { vel: 36 }); S.fx('thud', T.plan + 16.4, { vel: 24 });\n  for (let i = 0; i < 6; i++) S.fx('tick', T.market + 3.2 + i * 0.4, { vel: 24 });\n  S.fx('chime', T.market + 6.0, { vel: 30 }); S.fx('pop', T.market + 13.4, { vel: 30 }); S.fx('pop', T.market + 14.4, { vel: 30 });\n  S.fx('whoosh', T.carousel1 + 13.6, { dur: 0.8, vel: 24 });\n  S.fx('whoosh', T.carousel2 + 17.4, { dur: 0.8, vel: 24 }); S.fx('whoosh', T.carousel2 + 23.4, { dur: 0.8, vel: 24 });\n  S.fx('thud', T.horizon + 5.6, { vel: 28 }); S.fx('chime', T.horizon + 6.4, { vel: 30 });\n  S.fx('whoosh', T.mistake + 3.6, { dur: 0.6, vel: 24 }); S.fx('thud', T.mistake + 3.9, { vel: 28 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 6.4 + i, { vel: 30 });\n  S.fx('chime', T.try + 12.0, { vel: 40 }); S.fx('ding', T.try + 16.2, { vel: 36 });\n  for (let i = 0; i < 4; i++) S.fx('pop', T.risks + [4.9, 10.5, 12.4, 16.1][i], { vel: 28 });\n  for (let i = 0; i < 3; i++) S.fx('pop', T.recap + [0.6, 6.4, 11.8][i] + 0.5, { vel: 34 });\n  S.fx('ding', T.recap + 16.5, { vel: 38 });\n  S.fx('revswell', T.finish, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.finish, dur: 12, vel: 42 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.finish + 0.7, dur: 11, vel: 52 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.finish + 1.0, step: 0.12, vel: 42, cresc: 6 });\n  S.run('mal', ['A5', 'B5', 'D6', 'F#6'], { t: T.finish + 6.4, step: 0.14, vel: 36, cresc: 4 });\n  S.chord('keys', ['D4', 'F#4', 'A4', 'D5'], { t: T.finish + 8.0, dur: 4.5, vel: 46 });\n  S.master({ gain: -10, music: 22, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T27 · Reading XORA trading insights',\n  TOTAL: 303,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  // Phone mock-up of the XORA app: returns the element (already appended). opts: left, top, w, h, cls, title, pill, body (html).\n  phone(kit, o) {\n    const el = kit.h('<div class=\"phone ' + (o.cls || '') + '\" style=\"left:' + o.left + 'px;top:' + o.top + 'px;width:' + o.w + 'px;height:' + o.h + 'px\">' +\n      '<div class=\"phone-notch\"></div><div class=\"phone-top\"><b>' + (o.title || 'XORA') + '</b>' + (o.pill || '<span class=\"pill\" style=\"color:var(--main)\">DEMO</span>') + '</div>' +\n      (o.body || '') + '</div>');\n    kit.stage.append(el);\n    return el;\n  },\n  // The on-screen label every app mock carries.\n  mockLabel(kit, left, top, align) {\n    const el = kit.h('<p class=\"mock\" style=\"left:' + left + 'px;top:' + top + 'px' + (align === 'c' ? ';transform:translateX(-50%)' : '') + '\">Illustrative mock of the XORA app · numbers are fictional</p>');\n    kit.stage.append(el);\n    return el;\n  },\n  // T27: the market-read carousel inside a phone mock. Returns { go(t, idx) } where idx (may be fractional) is the card shown.\n  carousel(kit, pfx) {\n    const W = 500;\n    const c = (title, sub, inner) => '<div class=\"card\" style=\"flex:none;width:' + W + 'px;height:470px;box-sizing:border-box;padding:18px 22px\"><p class=\"card-h\" style=\"margin:0\">' + title + '</p>' +\n      '<p class=\"lbl\" style=\"margin:4px 0 14px\">' + sub + '</p>' + inner + '</div>';\n    const bar = (lab, w, col, cls) => '<div style=\"margin:10px 0\"><div style=\"display:flex;justify-content:space-between;font-size:22px\"><span>' + lab + '</span><span class=\"mono ' + cls + '-v\"></span></div>' +\n      '<div style=\"height:16px;border-radius:8px;margin-top:6px;background:color-mix(in srgb, var(--second) 10%, transparent)\"><div class=\"' + cls + '\" style=\"height:100%;width:0;border-radius:8px;background:' + col + '\"></div></div></div>';\n    let book = '';\n    const bids = [30, 46, 92, 38, 28], asks = [26, 34, 40, 30, 24];\n    for (let i = 0; i < 5; i++) {\n      book += '<div style=\"display:flex;gap:6px;align-items:center;margin:5px 0\"><div style=\"flex:1;display:flex;justify-content:flex-end\"><div class=\"' + pfx + '-bid\" style=\"height:22px;width:' + bids[i] + '%;border-radius:4px;background:color-mix(in srgb, var(--up) 55%, transparent)\"></div></div>' +\n        '<div style=\"flex:1\"><div class=\"' + pfx + '-ask\" style=\"height:22px;width:' + asks[i] + '%;border-radius:4px;background:color-mix(in srgb, var(--down) 55%, transparent)\"></div></div></div>';\n    }\n    const kv = (a, b, col) => '<div style=\"display:flex;justify-content:space-between;padding:8px 0;border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent)\"><span style=\"font-size:22px\">' + a + '</span><span class=\"mono\" style=\"font-size:22px;' + (col ? 'color:' + col : '') + '\">' + b + '</span></div>';\n    const cards = [\n      c('XORA SUGGESTION', 'Xora read', '<p style=\"margin:0;font-size:24px;line-height:1.45;font-weight:600\">Price is holding above support. Buyers are a little stronger in this range.</p>' +\n        '<p class=\"' + pfx + '-disc\" style=\"margin:18px 0 0;padding:12px 14px;border-radius:12px;font-size:21px;line-height:1.4;border:1.5px dashed color-mix(in srgb, var(--warn) 70%, transparent);color:var(--warn)\">Computed on this phone from candles and the order book. Explanatory only — the engine\\'s stop and exits do not use it.</p>'),\n      c('VOLUME COMPARISON', 'Buy vs sell volume in this range', bar('Buy volume', 0, 'var(--up)', pfx + '-vb') + bar('Sell volume', 0, 'var(--down)', pfx + '-vs') +\n        '<p style=\"margin:14px 0 0;font-size:22px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">Fictional numbers</p>'),\n      c('ORDER BOOK DIFFERENCE', 'Bid walls vs ask walls', '<div style=\"display:flex;justify-content:space-between\" class=\"lbl\"><span style=\"color:var(--up)\">BIDS · buy orders</span><span style=\"color:var(--down)\">ASKS · sell orders</span></div>' + book +\n        kv('Spread', '0.02%') + kv('Spoof risk', '<span class=\"' + pfx + '-sp\">Low</span>') + '<div style=\"padding:8px 0;font-size:22px\">Absorption: <span class=\"' + pfx + '-ab\" style=\"color:var(--up)\">bids absorbing sells</span></div>'),\n      c('PRICE-RANGE REPLAY', 'When price was here before vs now', '<div style=\"display:flex;gap:10px\">' +\n        '<div style=\"flex:1;padding:12px;border-radius:14px;border:1.5px solid color-mix(in srgb, var(--second) 14%, transparent)\"><p class=\"lbl\" style=\"margin:0\">BEFORE</p><svg width=\"190\" height=\"120\" viewBox=\"0 0 190 120\"><path class=\"' + pfx + '-r1\" d=\"M0 40 L40 70 L80 95 L110 90 L140 60 L190 30\" pathLength=\"1\" fill=\"none\" stroke-width=\"4\" style=\"stroke:var(--main)\"/><line x1=\"0\" x2=\"190\" y1=\"95\" y2=\"95\" stroke-dasharray=\"6 5\" stroke-width=\"2\" style=\"stroke:var(--up)\"/></svg><p style=\"margin:0;font-size:22px\">Bounced here</p></div>' +\n        '<div style=\"flex:1;padding:12px;border-radius:14px;border:1.5px solid color-mix(in srgb, var(--main) 45%, transparent)\"><p class=\"lbl\" style=\"margin:0\">NOW</p><svg width=\"190\" height=\"120\" viewBox=\"0 0 190 120\"><path class=\"' + pfx + '-r2\" d=\"M0 35 L45 65 L85 92 L120 88 L150 80\" pathLength=\"1\" fill=\"none\" stroke-width=\"4\" style=\"stroke:var(--accent)\"/><line x1=\"0\" x2=\"190\" y1=\"95\" y2=\"95\" stroke-dasharray=\"6 5\" stroke-width=\"2\" style=\"stroke:var(--up)\"/></svg><p style=\"margin:0;font-size:22px\">Testing it again</p></div></div>' +\n        '<p style=\"margin:14px 0 0;font-size:22px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">Past behaviour is context, not a forecast.</p>'),\n      c('TRIGGER LEVELS', 'Levels that matter for this plan', kv('Next res.', '60,600', 'var(--up)') + kv('Entry', '60,000') + kv('Stop', '59,700', 'var(--down)') +\n        '<p class=\"' + pfx + '-stop\" style=\"margin:16px 0 0;padding:12px 14px;border-radius:12px;font-size:23px;font-weight:600;border:1.5px solid var(--down)\">The stop: where the trade closes.</p>'),\n    ];\n    let dots = '';\n    for (let i = 0; i < 5; i++) dots += '<span class=\"' + pfx + '-dot\" style=\"width:12px;height:12px;border-radius:6px;background:var(--second)\"></span>';\n    const body = '<div style=\"position:relative;height:470px;overflow:hidden;border-radius:22px\"><div class=\"' + pfx + '-track\" style=\"display:flex;gap:20px\">' + cards.join('') + '</div></div>' +\n      '<div style=\"display:flex;justify-content:center;gap:10px;margin-top:16px\">' + dots + '</div>';\n    const ph = UI.phone(kit, { left: 1120, top: 140, w: 560, h: 630, title: 'BTC/USDT', body });\n    const ml = UI.mockLabel(kit, 1120, 100);\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    const track = q('.' + pfx + '-track').style, ds = all('.' + pfx + '-dot').map((e) => e.style);\n    const cs = [...q('.' + pfx + '-track').children].map((e) => e.style);\n    return {\n      ph: ph.style, ml: ml.style, q, all,\n      go(idx) {\n        track.transform = 'translateX(' + (-(W + 20) * idx).toFixed(1) + 'px)';\n        cs.forEach((e, i) => { e.opacity = Math.max(0, 1 - Math.abs(idx - i) * 1.2).toFixed(3); });\n        ds.forEach((d, i) => { const on = Math.max(0, 1 - Math.abs(idx - i)); d.width = (12 + 22 * on).toFixed(1) + 'px'; d.opacity = (0.35 + 0.65 * on).toFixed(3); d.background = on > 0.5 ? 'var(--main)' : 'var(--second)'; });\n      },\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (l <script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *
 * build-lesson.mjs inlines this file into public/futures-edge/lessons/<id>.html, after a
 * `window.FILM = {...}` block that carries the scene list, module texts and asset paths.
 */
(function () {
  "use strict";

  const F = window.FILM;
  const W = F.width;
  const H = F.height;

  // ── Maths and easing ───────────────────────────────────────────────────────
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clamp01 = (x) => clamp(x, 0, 1);
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp01((t - a) / (b - a)));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = (x) => 1 - Math.pow(1 - clamp01(x), 3);
  const ei = (x) => Math.pow(clamp01(x), 3);
  const eio = (x) => {
    x = clamp01(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  };
  const eob = (x, s = 1.4) => {
    x = clamp01(x);
    return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  };
  const rng = (seed) => {
    let a = seed >>> 0 || 1;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const breathe = (t, amt = 0.012, period = 3.2) => 1 + amt * Math.sin((2 * Math.PI * t) / period);

  // ── DOM helpers ────────────────────────────────────────────────────────────
  const h = (html) => {
    const tpl = document.createElement("template");
    tpl.innerHTML = String(html).trim();
    return tpl.content.firstElementChild;
  };
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const el = (tag, o = {}, children = []) => {
    const e = document.createElement(tag);
    if (o.class) e.className = o.class;
    if (o.style) e.setAttribute("style", o.style);
    if (o.text != null) e.textContent = o.text;
    if (o.html != null) e.innerHTML = o.html;
    for (const [k, v] of Object.entries(o.attrs || {})) e.setAttribute(k, v);
    for (const c of children) e.append(c);
    return e;
  };

  // Words of an element as inline-block spans (inline markup such as <b> is kept).
  const wordCache = new WeakMap();
  function words(root) {
    let list = wordCache.get(root);
    if (list) return list;
    list = [];
    const walk = (node) => {
      for (const child of Array.from(node.childNodes)) {
        if (child.nodeType === 3) {
          const frag = document.createDocumentFragment();
          for (const part of child.textContent.split(/(\s+)/)) {
            if (!part) continue;
            if (/^\s+$/.test(part)) {
              frag.append(document.createTextNode(part));
            } else {
              const s = document.createElement("span");
              s.textContent = part;
              s.style.display = "inline-block";
              frag.append(s);
              list.push(s);
            }
          }
          node.replaceChild(frag, child);
        } else if (child.nodeType === 1) {
          walk(child);
        }
      }
    };
    walk(root);
    wordCache.set(root, list);
    return list;
  }
  const TextFx = {
    fadeFromRight(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.11, d = o.dur ?? 0.5, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = eo(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = p;
        s.style.transform = "translateX(" + ((1 - p) * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
    fadeOutLeft(root, t, t0, o = {}) {
      const st = o.stagger ?? 0.04, d = o.dur ?? 0.35, dx = o.dx ?? 26;
      const list = words(root);
      list.forEach((s, i) => {
        const p = ei(seg(t, t0 + i * st, t0 + i * st + d));
        s.style.opacity = 1 - p;
        s.style.transform = "translateX(" + (-p * dx).toFixed(2) + "px)";
      });
      return t0 + Math.max(0, list.length - 1) * st + d;
    },
  };

  // ── The kit the scene modules use ──────────────────────────────────────────
  const modules = F.modules;
  const jsonCache = {};
  const assets = {
    url: (name) => F.assetBase + name,
    has: (name) => Object.prototype.hasOwnProperty.call(F.assets, name),
    list: () => Object.keys(F.assets),
  };
  const defs = {};
  let scoreFn = null;

  // start/dur: the scene in the played timeline; oldStart/oldDur: as authored (k = dur / oldDur).
  let acc = 0;
  const scenes = F.scenes.map((s) => {
    const o = Object.assign({ k: 1, oldStart: acc, oldDur: s.dur }, s, { start: acc });
    acc += s.dur;
    return o;
  });
  const END = acc;
  const OLD_END = scenes.reduce((a, s) => a + s.oldDur, 0);
  // Authored time to played time.
  function warp(x) {
    for (let i = scenes.length - 1; i >= 0; i--) {
      const s = scenes[i];
      if (x >= s.oldStart) return s.start + (x - s.oldStart) * s.k;
    }
    return x;
  }
  // Narration lines: spoken when the lesson has a voice track (F.voice.src), always shown as captions.
  const lines = (F.voice && F.voice.lines) || [];
  // Voice language for lessons recorded in English and Malayalam (F.voice.srcMl): English unless the viewer chose Malayalam.
  let voiceLang = "en";
  try { if (localStorage.getItem("fe-voice-lang") === "ml") voiceLang = "ml"; } catch (e) { /* English */ }
  // Stretches where the music dips under the voice: each line plus a little either side, close ones joined.
  const duckSpans = [];
  if (F.voice && F.voice.src) for (const l of lines) {
    const a = l.t - 0.15, b = l.t + l.d + 0.25, last = duckSpans[duckSpans.length - 1];
    if (last && a - last[1] < 1.2) last[1] = b; else duckSpans.push([a, b]);
  }

  function makeKit(box, start, dur) {
    return {
      stage: box, start, dur, W, H,
      seg, lerp, eo, ei, eio, eob, clamp, clamp01, rng, breathe, TextFx, h, el, esc,
      assets,
      module: (n) => (n in modules ? modules[n] : null),
      json: (n) => (jsonCache[n] ??= JSON.parse(modules[n])),
      modules: () => Object.keys(modules),
      scene: (id, def) => { defs[id] = def; },
      score: (fn) => { scoreFn = fn; },
    };
  }
  const run = (name, kit) => new Function("kit", modules[name] + "\n//# sourceURL=" + F.id + "/" + name)(kit);

  // ── Stage ──────────────────────────────────────────────────────────────────
  const stage = document.getElementById("stage");
  const css = document.createElement("style");
  css.textContent = modules["base.css"] || "";
  document.head.append(css);

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 200));
  fit();

  // ── Audio: score.js recorded as events, then synthesised with WebAudio ─────
  function midiOf(p) {
    if (typeof p === "number") return p;
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(p).trim());
    if (!m) return 72;
    const base = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 }[m[1].toLowerCase()];
    return 12 * (Number(m[3]) + 1) + base + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
  }

  // score.js runs twice: the music against the played timeline, the sound effects against the
  // authored one and then moved onto the played one, so each cue stays with its animation.
  function recordScore() {
    const T = { END };
    for (const s of scenes) T[s.id] = s.start;
    const music = recordPass(T);
    const Told = { END: OLD_END };
    for (const s of scenes) Told[s.id] = s.oldStart;
    const cues = recordPass(Told);
    const ev = music.ev.filter((e) => e.k !== "f");
    for (const e of cues.ev) {
      if (e.k !== "f") continue;
      e.t = warp(e.t);
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      ev.push(e);
    }
    ev.sort((a, b) => a.s - b.s);
    return { ev, tracks: music.tracks, master: music.master };
  }

  function recordPass(T) {
    const ev = [];
    const tracks = {};
    const master = { gain: -6, music: 0, fadeOut: 1 };
    let B = 0.5, t0 = 0;
    const at = (o) => (o.t != null ? o.t : t0 + (o.beat || 0) * B);
    const len = (o, d) => (o.dur != null ? o.dur : o.beats != null ? o.beats * B : d);
    const push = (e) => {
      e.s = e.name === "revswell" ? e.t - e.d : e.t;
      if (e.s < -0.1) return;
      if (e.s < 0) { e.t += -e.s; e.s = 0; }
      ev.push(e);
    };
    const hits = (str, rep, step, from, vel, fn) => {
      for (let r = 0; r < rep; r++) {
        for (let i = 0; i < str.length; i++) {
          const c = str[i];
          if (c !== "x" && c !== "X" && c !== "o") continue;
