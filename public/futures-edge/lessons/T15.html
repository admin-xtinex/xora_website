<script>window.FILM = {"id":"T15","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson fifteen","dur":10,"k":1,"oldStart":0,"oldDur":10},{"id":"hook","name":"Same market, three views","dur":19,"k":1,"oldStart":10,"oldDur":19},{"id":"timeframe","name":"What a timeframe is","dur":21,"k":1,"oldStart":29,"oldDur":21},{"id":"build5","name":"Build a 5-minute candle","dur":34,"k":1,"oldStart":50,"oldDur":34},{"id":"build15","name":"Build a 15-minute candle","dur":21,"k":1,"oldStart":84,"oldDur":21},{"id":"switch","name":"One path, three views","dur":24,"k":1,"oldStart":105,"oldDur":24},{"id":"noise","name":"Noise and signal","dur":23,"k":1,"oldStart":129,"oldDur":23},{"id":"context","name":"Higher-timeframe context","dur":21,"k":1,"oldStart":152,"oldDur":21},{"id":"mistake","name":"No averages","dur":22,"k":1,"oldStart":173,"oldDur":22},{"id":"try","name":"Try it","dur":25,"k":1,"oldStart":195,"oldDur":25},{"id":"sort","name":"View or market?","dur":18,"k":1,"oldStart":220,"oldDur":18},{"id":"risks","name":"Know the limits","dur":20,"k":1,"oldStart":238,"oldDur":20},{"id":"recap","name":"Recap","dur":28,"k":1,"oldStart":258,"oldDur":28},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":286,"oldDur":10}],"voice":{"src":null,"lines":[{"t":0.6,"d":4.55,"text":"Lesson fifteen: 1-minute, 5-minute and 15-minute timeframes."},{"t":5.4,"d":4.35,"text":"Same market, grouped in different time windows."},{"t":10.4,"d":5.45,"text":"Here are fifteen minutes of a fictional BTC chart, one candle per minute."},{"t":16.1,"d":4.25,"text":"Tap 5m: now there are three candles. Tap 15m: just one."},{"t":20.6,"d":4.15,"text":"Did the market change? No. Only the way it is grouped."},{"t":25,"d":3.75,"text":"That grouping is called a timeframe."},{"t":29.4,"d":3.75,"text":"A timeframe is how much time each candle covers."},{"t":33.4,"d":5.55,"text":"On a 1-minute chart, each candle is one minute. On a 5-minute chart, five."},{"t":39.2,"d":5.45,"text":"Like a diary: notes for each day, a summary each week, one for the month."},{"t":44.9,"d":4.85,"text":"Same life, different summaries. Same trades, different candles."},{"t":50.4,"d":4.55,"text":"Let's build one 5-minute candle from five 1-minute candles."},{"t":55.2,"d":3.15,"text":"Open: the first minute's open. 60,000."},{"t":58.6,"d":5.05,"text":"High: the highest high of all five. That is 60,110, in minute four."},{"t":63.9,"d":4.65,"text":"Low: the lowest low of all five. 59,980, in the first minute."},{"t":68.8,"d":3.15,"text":"Close: the last minute's close. 60,090."},{"t":72.2,"d":6.15,"text":"Watch them merge: open 60,000, high 60,110, low 59,980, close 60,090."},{"t":78.6,"d":5.15,"text":"It is green, because 60,090 closed above 60,000."},{"t":84.4,"d":5.25,"text":"Fifteen minutes works the same way. Take all fifteen 1-minute candles."},{"t":89.9,"d":4.65,"text":"First open, 60,000. Highest high, 60,170. Lowest low, 59,920."},{"t":94.8,"d":3.75,"text":"Last close, 60,150. One green 15-minute candle."},{"t":98.8,"d":5.95,"text":"The three 5-minute candles give the same answer. The maths always agrees."},{"t":105.4,"d":4.85,"text":"Now one chart, one time axis. Under it all, the same price path."},{"t":110.5,"d":4.55,"text":"Switch to 1-minute: fifteen narrow candles sit on the path."},{"t":115.3,"d":4.15,"text":"Switch to 5-minute: they merge into three wider ones."},{"t":119.7,"d":4.15,"text":"Switch to 15-minute: one candle for the whole stretch."},{"t":124.1,"d":4.65,"text":"The path never moved. Only the grouping changed."},{"t":129.4,"d":5.25,"text":"Short timeframes show every small back-and-forth. That is called noise."},{"t":134.9,"d":4.55,"text":"On the 1-minute chart, 10:05 to 10:07 looks like a big drop."},{"t":139.7,"d":5.25,"text":"On the 15-minute view, that drop is just a dip inside one green candle."},{"t":145.2,"d":6.55,"text":"A signal is a change big enough to stand out from the noise. It is still no promise."},{"t":152.4,"d":4.55,"text":"Higher-timeframe context: check the bigger view first."},{"t":157.2,"d":5.25,"text":"Like a map: zoom out to see the city, then zoom in to find the street."},{"t":162.7,"d":4.45,"text":"Look at 15m for the big picture, then 5m and 1m for detail."},{"t":167.4,"d":5.35,"text":"If the views disagree, that is a reason to be careful, or to wait."},{"t":173.4,"d":5.35,"text":"A common mistake: averaging the 1-minute highs to get the 5-minute high."},{"t":179,"d":4.35,"text":"The average of these five highs is 60,060. That is wrong."},{"t":183.6,"d":5.45,"text":"The 5-minute high is the highest of them: 60,120. Price really reached it."},{"t":189.3,"d":5.45,"text":"Open is first, close is last, high is highest, low is lowest. No averages."},{"t":195.4,"d":4.75,"text":"Your turn. Here are five 1-minute candles, from 10:10 to 10:14."},{"t":200.4,"d":5.35,"text":"What are the 5-minute open, high, low and close? Pause if you need time."},{"t":206,"d":4.45,"text":"Open 60,010, the first open. Close 60,150, the last close."},{"t":210.7,"d":4.45,"text":"High 60,170, the highest high. Low 59,990, the lowest low."},{"t":215.4,"d":4.35,"text":"A green 5-minute candle. Well done if you got all four."},{"t":220.4,"d":5.25,"text":"Quick check: is each one a change in the view, or a real market event?"},{"t":225.9,"d":5.85,"text":"Switching timeframes and wider candles: just the view."},{"t":232,"d":5.75,"text":"Trades and price moves are the market. The view only groups them."},{"t":238.4,"d":3.15,"text":"Before we move on, a few honest limits."},{"t":241.8,"d":5.55,"text":"Shorter timeframes are noisier. More candles do not mean more good chances."},{"t":247.6,"d":4.05,"text":"Trading every small move piles up fees and mistakes."},{"t":251.9,"d":5.85,"text":"No timeframe predicts the future. WAIT and NO_TRADE are always allowed."},{"t":258.4,"d":1.35,"text":"Let's recap."},{"t":260,"d":3.75,"text":"A timeframe is how much time each candle covers."},{"t":264,"d":5.15,"text":"To combine candles: first open, highest high, lowest low, last close."},{"t":269.4,"d":4.65,"text":"Check the bigger view for context. Short timeframes are noisy."},{"t":274.3,"d":6.45,"text":"Check yourself: five 1-minute candles, the last closes at 60,090. The 5-minute close?"},{"t":281,"d":4.75,"text":"60,090. The 5-minute close is always the last 1-minute close."},{"t":286.6,"d":4.15,"text":"Great work! Next up: trend and market structure."},{"t":291,"d":4.75,"text":"See you in lesson sixteen."}]},"assetBase":"T15/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":331,"h":446},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-candles.webp":{"mime":"image/webp","w":257,"h":160},"tutor-pointer.webp":{"mi tion:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n/* T15: OHLC tables */\n.otab { position:absolute; box-sizing:border-box; display:grid; grid-template-columns:118px repeat(4, 1fr); row-gap:4px; font-family:var(--mono, ui-monospace, monospace); font-size:28px; font-variant-numeric:tabular-nums }\n.otab > span { padding:8px 10px; border-radius:10px; text-align:right; white-space:nowrap }\n.otab > span.h { font-family:var(--sans, system-ui, sans-serif); font-size:22px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)) }\n.otab > span.tm { text-align:left; color:color-mix(in srgb, var(--second) 65%, var(--ground)) }\n.otab > span.res { border-top:2px solid color-mix(in srgb, var(--main) 50%, transparent); border-radius:0 0 10px 10px; padding-top:12px }\n","narration.json":"{\n  \"about\": \"T15 captions, written as a warm, clear tutor speaking; can be recorded as voiceover later. Times in seconds from the start of the lesson.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson fifteen: 1-minute, 5-minute and 15-minute timeframes.\"\n    },\n    {\n      \"t\": 5.4,\n      \"text\": \"Same market, grouped in different time windows.\"\n    },\n    {\n      \"t\": 10.4,\n      \"text\": \"Here are fifteen minutes of a fictional BTC chart, one candle per minute.\"\n    },\n    {\n      \"t\": 16.1,\n      \"text\": \"Tap 5m: now there are three candles. Tap 15m: just one.\"\n    },\n    {\n      \"t\": 20.6,\n      \"text\": \"Did the market change? No. Only the way it is grouped.\"\n    },\n    {\n      \"t\": 25.0,\n      \"text\": \"That grouping is called a timeframe.\"\n    },\n    {\n      \"t\": 29.4,\n      \"text\": \"A timeframe is how much time each candle covers.\"\n    },\n    {\n      \"t\": 33.4,\n      \"text\": \"On a 1-minute chart, each candle is one minute. On a 5-minute chart, five.\"\n    },\n    {\n      \"t\": 39.2,\n      \"text\": \"Like a diary: notes for each day, a summary each week, one for the month.\"\n    },\n    {\n      \"t\": 44.9,\n      \"text\": \"Same life, different summaries. Same trades, different candles.\"\n    },\n    {\n      \"t\": 50.4,\n      \"text\": \"Let's build one 5-minute candle from five 1-minute candles.\"\n    },\n    {\n      \"t\": 55.2,\n      \"text\": \"Open: the first minute's open. 60,000.\"\n    },\n    {\n      \"t\": 58.6,\n      \"text\": \"High: the highest high of all five. That is 60,110, in minute four.\"\n    },\n    {\n      \"t\": 63.9,\n      \"text\": \"Low: the lowest low of all five. 59,980, in the first minute.\"\n    },\n    {\n      \"t\": 68.8,\n      \"text\": \"Close: the last minute's close. 60,090.\"\n    },\n    {\n      \"t\": 72.2,\n      \"text\": \"Watch them merge: open 60,000, high 60,110, low 59,980, close 60,090.\"\n    },\n    {\n      \"t\": 78.6,\n      \"text\": \"It is green, because 60,090 closed above 60,000.\"\n    },\n    {\n      \"t\": 84.4,\n      \"text\": \"Fifteen minutes works the same way. Take all fifteen 1-minute candles.\"\n    },\n    {\n      \"t\": 89.9,\n      \"text\": \"First open, 60,000. Highest high, 60,170. Lowest low, 59,920.\"\n    },\n    {\n      \"t\": 94.8,\n      \"text\": \"Last close, 60,150. One green 15-minute candle.\"\n    },\n    {\n      \"t\": 98.8,\n      \"text\": \"The three 5-minute candles give the same answer. The maths always agrees.\"\n    },\n    {\n      \"t\": 105.4,\n      \"text\": \"Now one chart, one time axis. Under it all, the same price path.\"\n    },\n    {\n      \"t\": 110.5,\n      \"text\": \"Switch to 1-minute: fifteen narrow candles sit on the path.\"\n    },\n    {\n      \"t\": 115.3,\n      \"text\": \"Switch to 5-minute: they merge into three wider ones.\"\n    },\n    {\n      \"t\": 119.7,\n      \"text\": \"Switch to 15-minute: one candle for the whole stretch.\"\n    },\n    {\n      \"t\": 124.1,\n      \"text\": \"The path never moved. Only the grouping changed.\"\n    },\n    {\n      \"t\": 129.4,\n      \"text\": \"Short timeframes show every small back-and-forth. That is called noise.\"\n    },\n    {\n      \"t\": 134.9,\n      \"text\": \"On the 1-minute chart, 10:05 to 10:07 looks like a big drop.\"\n    },\n    {\n      \"t\": 139.7,\n      \"text\": \"On the 15-minute view, that drop is just a dip inside one green candle.\"\n    },\n    {\n      \"t\": 145.2,\n      \"text\": \"A signal is a change big enough to stand out from the noise. It is still no promise.\"\n    },\n    {\n      \"t\": 152.4,\n      \"text\": \"Higher-timeframe context: check the bigger view first.\"\n    },\n    {\n      \"t\": 157.2,\n      \"text\": \"Like a map: zoom out to see the city, then zoom in to find the street.\"\n    },\n    {\n      \"t\": 162.7,\n      \"text\": \"Look at 15m for the big picture, then 5m and 1m for detail.\"\n    },\n    {\n      \"t\": 167.4,\n      \"text\": \"If the views disagree, that is a reason to be careful, or to wait.\"\n    },\n    {\n      \"t\": 173.4,\n      \"text\": \"A common mistake: averaging the 1-minute highs to get the 5-minute high.\"\n    },\n    {\n      \"t\": 179.0,\n      \"text\": \"The average of these five highs is 60,060. That is wrong.\"\n    },\n    {\n      \"t\": 183.6,\n      \"text\": \"The 5-minute high is the highest of them: 60,120. Price really reached it.\"\n    },\n    {\n      \"t\": 189.3,\n      \"text\": \"Open is first, close is last, high is highest, low is lowest. No averages.\"\n    },\n    {\n      \"t\": 195.4,\n      \"text\": \"Your turn. Here are five 1-minute candles, from 10:10 to 10:14.\"\n    },\n    {\n      \"t\": 200.4,\n      \"text\": \"What are the 5-minute open, high, low and close? Pause if you need time.\"\n    },\n    {\n      \"t\": 206.0,\n      \"text\": \"Open 60,010, the first open. Close 60,150, the last close.\"\n    },\n    {\n      \"t\": 210.7,\n      \"text\": \"High 60,170, the highest high. Low 59,990, the lowest low.\"\n    },\n    {\n      \"t\": 215.4,\n      \"text\": \"A green 5-minute candle. Well done if you got all four.\"\n    },\n    {\n      \"t\": 220.4,\n      \"text\": \"Quick check: is each one a change in the view, or a real market event?\"\n    },\n    {\n      \"t\": 225.9,\n      \"text\": \"Switching timeframes and wider candles: just the view.\"\n    },\n    {\n      \"t\": 232.0,\n      \"text\": \"Trades and price moves are the market. The view only groups them.\"\n    },\n    {\n      \"t\": 238.4,\n      \"text\": \"Before we move on, a few honest limits.\"\n    },\n    {\n      \"t\": 241.8,\n      \"text\": \"Shorter timeframes are noisier. More candles do not mean more good chances.\"\n    },\n    {\n      \"t\": 247.6,\n      \"text\": \"Trading every small move piles up fees and mistakes.\"\n    },\n    {\n      \"t\": 251.9,\n      \"text\": \"No timeframe predicts the future. WAIT and NO_TRADE are always allowed.\"\n    },\n    {\n      \"t\": 258.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 260.0,\n      \"text\": \"A timeframe is how much time each candle covers.\"\n    },\n    {\n      \"t\": 264.0,\n      \"text\": \"To combine candles: first open, highest high, lowest low, last close.\"\n    },\n    {\n      \"t\": 269.4,\n      \"text\": \"Check the bigger view for context. Short timeframes are noisy.\"\n    },\n    {\n      \"t\": 274.3,\n      \"text\": \"Check yourself: five 1-minute candles, the last closes at 60,090. The 5-minute close?\"\n    },\n    {\n      \"t\": 281.0,\n      \"text\": \"60,090. The 5-minute close is always the last 1-minute close.\"\n    },\n    {\n      \"t\": 286.6,\n      \"text\": \"Great work! Next up: trend and market structure.\"\n    },\n    {\n      \"t\": 291.0,\n      \"text\": \"See you in lesson sixteen.\"\n    }\n  ]\n}","scene-build15.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst BF_X0 = 260, BF_PPM = 44, BF_RX = 1050, bfY = (p) => 700 - (p - 59900) / 290 * 320;\nconst BF = UI.agg(UI.M1), BF5 = UI.tf(5);\n// [label, value, note, at, source minute, which price (0 open .. 3 close)]\nconst BF_ROWS = [['Open', BF[0], 'first open', 6.0, 0, 0], ['High', BF[1], 'highest high', 7.6, 14, 1], ['Low', BF[2], 'lowest low', 9.0, 7, 2], ['Close', BF[3], 'last close', 10.9, 14, 3]];\nconst BF_ST = [[0, 1], [14.8, 5]];\nkit.scene('build15', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'bf-c', 20);\n    let rows = '', guides = '', tags = '';\n    BF_ROWS.forEach((r) => {\n      rows += '<div class=\"bf-r\" style=\"display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent)\"><span style=\"width:90px;font-size:28px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">' + r[0] + '</span>' +\n        '<span class=\"mono\" style=\"font-size:38px\">' + UI.fmt(r[1]) + '</span><span style=\"margin-left:auto;font-size:24px;color:var(--main)\">' + r[2] + '</span></div>';\n      const y = bfY(r[1]).toFixed(1);\n      guides += '<line class=\"bf-g\" x1=\"' + (BF_X0 + (r[4] + 0.5) * BF_PPM + 14) + '\" x2=\"' + (BF_RX - 64) + '\" y1=\"' + y + '\" y2=\"' + y + '\" stroke-width=\"2.5\" stroke-dasharray=\"6 7\" style=\"stroke:var(--main)\"/>';\n    });\n    BF5.forEach((c, k) => {\n      const x = BF_X0 + (k * 5 + 2.5) * BF_PPM;\n      tags += '<text class=\"bf-tg mono\" x=\"' + x + '\" y=\"' + (bfY(c[1]) - 16).toFixed(1) + '\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:22px\">' + UI.fmt(c[1]) + '</text>' +\n        '<text class=\"bf-tg mono\" x=\"' + x + '\" y=\"' + (bfY(c[2]) + 34).toFixed(1) + '\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:22px\">' + UI.fmt(c[2]) + '</text>';\n    });\n    let tl = '';\n    for (let m = 0; m <= 15; m += 5) tl += '<text x=\"' + (BF_X0 + m * BF_PPM) + '\" y=\"736\" text-anchor=\"middle\" class=\"axis\">' + UI.hm(m) + '</text>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"bf-grid\">' + UI.gridL(250, 940, bfY, 59950, 60150, 50) + tl +\n      '<text x=\"' + BF_RX + '\" y=\"736\" text-anchor=\"middle\" class=\"axis\" style=\"fill:var(--main)\">15m</text></g>' + guides + this.cd.html + tags + '</svg>' +\n      '<div class=\"glass bf-card\" style=\"left:1180px;top:330px;width:520px;padding:18px 32px 22px\"><p class=\"fict\" style=\"margin:0 0 4px\">15m candle · 10:00–10:15</p>' + rows +\n      '<p class=\"chip bf-ok\" style=\"margin:16px 0 0;font-size:24px;padding:10px 20px;border-color:var(--up)\">Same answer from the three 5m candles</p></div>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1000px\"><p class=\"kick bf-k\">Same rule, bigger window</p>' +\n      '<h2 class=\"line bf-t\">Building a 15m candle</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.bf-k').style; this.t = q('.bf-t'); this.grid = q('.bf-grid').style; this.card = q('.bf-card').style; this.ok = q('.bf-ok').style;\n    this.rows = all('.bf-r').map((e) => e.style); this.g = all('.bf-g'); this.tg = all('.bf-tg').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'cheer' }, { t: 0.5, pose: 'explain' }, { t: 5.9, pose: 'checklist' }, { t: 10.8, pose: 'thumbs' }, { t: 14.8, pose: 'magnify' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.4, 1.0));\n    UI.rise(this.card, t, 5.6);\n    const st = UI.tfState(BF_ST, t);\n    UI.tfAll(this.cd, st, BF_X0, BF_PPM, bfY, eo(seg(t, 0.6, 1.4)));\n    BF_ROWS.forEach((r, i) => {\n      UI.rise(this.rows[i], t, r[3], { dy: 16 });\n      this.g[i].setAttribute('stroke-dasharray', '6 7');\n      this.g[i].style.opacity = eo(seg(t, r[3], r[3] + 0.4)) * (1 - eo(seg(t, 13.8, 14.4)));\n    });\n    // The 15-minute candle: built from the four values, filled once the close is known.\n    const w = eio(seg(t, 7.6, 9.4)), f = eob(seg(t, 10.9, 11.8), 1.3);\n    this.cd.set(19, { x: BF_RX, w: lerp(16, 120, f), o: BF[0], h: lerp(BF[0], BF[1], eio(seg(t, 7.6, 8.4))), l: lerp(BF[0], BF[2], eio(seg(t, 9.0, 9.8))), c: lerp(BF[0], BF[3], f), y: bfY, op: eo(seg(t, 6.0, 6.4)), live: f < 1 });\n    this.tg.forEach((s, i) => { s.opacity = eo(seg(t, 15.4 + Math.floor(i / 2) * 0.3, 15.8 + Math.floor(i / 2) * 0.3)); });\n    UI.rise(this.ok, t, 16.4, { s: 0.9 });\n    this.tutor.render(t);\n  },\n});\n","scene-build5.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Five fictional 1-minute candles (10:00 to 10:04) combined into one 5-minute candle.\nconst B5 = UI.M1.slice(0, 5), B5R = UI.agg(B5);\nconst B5_X = (i) => 320 + i * 100, B5_RX = 920, b5Y = (p) => 720 - (p - 59960) / 170 * 340;\n// Steps: [start, column (1 open .. 4 close), source row, rule text, result at]\nconst B5_STEPS = [[5.2, 1, 0, 'Open = the first open', 6.2], [8.6, 2, 3, 'High = the highest high', 11.4], [13.9, 3, 0, 'Low = the lowest low', 16.4], [18.8, 4, 4, 'Close = the last close', 19.8]];\nconst B5_M = 22.4, B5_ME = 25.0;\nkit.scene('build5', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'b5-c', 6);\n    let guides = '';\n    B5_STEPS.forEach((s) => {\n      const v = B5[s[2]][s[1] - 1], y = b5Y(v).toFixed(1);\n      guides += '<line class=\"b5-g\" x1=\"' + (B5_X(s[2]) + 34) + '\" x2=\"' + (B5_RX - 70) + '\" y1=\"' + y + '\" y2=\"' + y + '\" stroke-width=\"2.5\" stroke-dasharray=\"6 7\" style=\"stroke:var(--main)\"/>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"b5-grid\">' + UI.gridL(250, 990, b5Y, 60000, 60100, 50) +\n      [0, 1, 2, 3, 4].map((i) => '<text x=\"' + B5_X(i) + '\" y=\"756\" text-anchor=\"middle\" class=\"axis b5-tl\">' + UI.hm(i) + '</text>').join('') +\n      '<text x=\"' + B5_RX + '\" y=\"756\" text-anchor=\"middle\" class=\"axis b5-rl\" style=\"fill:var(--main)\">5m</text></g>' + guides +\n      '<line class=\"b5-ot\" x1=\"' + (B5_RX - 64) + '\" x2=\"' + (B5_RX + 64) + '\" y1=\"' + b5Y(B5R[0]) + '\" y2=\"' + b5Y(B5R[0]) + '\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"stroke:var(--second)\"/>' +\n      '<line class=\"b5-ct\" x1=\"' + (B5_RX - 64) + '\" x2=\"' + (B5_RX + 64) + '\" y1=\"' + b5Y(B5R[3]) + '\" y2=\"' + b5Y(B5R[3]) + '\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"stroke:var(--second)\"/>' +\n      '<line class=\"b5-wk\" x1=\"' + B5_RX + '\" x2=\"' + B5_RX + '\" stroke-width=\"8\" stroke-linecap=\"round\" style=\"stroke:var(--second)\"/>' +\n      this.cd.html + '</svg>' +\n      '<p class=\"chip b5-rule\" style=\"position:absolute;left:250px;top:318px;margin:0;font-size:28px;padding:12px 26px;border-color:var(--main)\"></p>' +\n      '<div class=\"glass b5-card\" style=\"left:1030px;top:300px;width:670px;height:450px\"></div>' +\n      UI.otab('b5-t', 1045, 318, 640, B5.map((c, i) => [UI.hm(i)].concat(c)), '5m') +\n      '<p class=\"chip b5-up\" style=\"position:absolute;left:250px;top:318px;margin:0;font-size:28px;padding:12px 26px;background:var(--up);color:var(--ground);border-color:var(--up)\">60,090 &gt; 60,000 · up candle</p>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1500px\"><p class=\"kick b5-k\">Candle aggregation</p>' +\n      '<h2 class=\"line b5-t2\">Five 1m candles, one 5m candle</h2></div>' +\n      '<p class=\"fict\" style=\"position:absolute;left:1045px;top:762px;margin:0\">BTC/USDT · fictional prices in USDT</p>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.b5-k').style; this.t = q('.b5-t2'); this.grid = q('.b5-grid').style; this.card = q('.b5-card').style;\n    this.rule = q('.b5-rule'); this.up = q('.b5-up').style; this.g = all('.b5-g'); this.ot = q('.b5-ot'); this.ct = q('.b5-ct'); this.wk = q('.b5-wk');\n    this.cells = all('.b5-t-c'); this.tab = q('.b5-t').style; this.tl = all('.b5-tl').map((e) => e.style); this.rl = q('.b5-rl').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'present' }, { t: 0.6, pose: 'candles', flip: true }, { t: 5.2, pose: 'checklist' }, { t: 8.6, pose: 'magnify' }, { t: 18.8, pose: 'checklist' }, { t: 22.2, pose: 'point', flip: true }, { t: 28.6, pose: 'cheer' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.4, 1.0));\n    UI.rise(this.card, t, 0.6);\n    this.tab.opacity = eo(seg(t, 0.8, 1.2));\n    const m = eio(seg(t, B5_M, B5_ME));\n    // The five 1-minute candles grow in, then slide into the 5-minute slot and fade as it fills.\n    B5.forEach((c, i) => {\n      const a = 0.8 + i * 0.4, p = seg(t, a, a + 0.6);\n      this.cd.set(i, { x: lerp(B5_X(i), B5_RX, m), w: 56, o: c[0], h: c[1], l: c[2], c: lerp(c[0], c[3], eo(p)), y: b5Y, op: eo(seg(t, a, a + 0.3)) * (1 - eo(seg(t, B5_ME - 1.0, B5_ME))) });\n    });\n    for (const s of this.tl) s.opacity = 1 - eo(seg(t, B5_M, B5_M + 0.6));\n    this.rl.opacity = eo(seg(t, 5.6, 6.0));\n    const fill = eob(seg(t, B5_ME - 1.0, B5_ME + 0.2), 1.3);\n    this.cd.set(5, { x: B5_RX, w: lerp(40, 128, fill), o: B5R[0], h: B5R[1], l: B5R[2], c: lerp(B5R[0], B5R[3], fill), y: b5Y, op: eo(seg(t, B5_ME - 1.0, B5_ME - 0.6)) });\n    // Table rows appear with their candles.\n    this.cells.forEach((e, k) => {\n      const r = Math.floor(k / 5), col = k % 5;\n      if (r < 5) e.style.opacity = eo(seg(t, 0.8 + r * 0.4, 1.2 + r * 0.4));\n      e.style.background = 'transparent'; e.style.color = '';\n    });\n    // The four steps: scan the column, pick the winner, write it into the 5m row and onto the chart.\n    let ruleTxt = '', ruleOn =
