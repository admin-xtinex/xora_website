<script>window.FILM = {"id":"T23","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson twenty-three","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"Eight steps","dur":22,"k":1,"oldStart":8,"oldDur":22},{"id":"coin","name":"Step 1 · Choose a coin","dur":25,"k":1,"oldStart":30,"oldDur":25},{"id":"context","name":"Step 2 · Context","dur":28,"k":1,"oldStart":55,"oldDur":28},{"id":"levels","name":"Step 3 · Range and levels","dur":26,"k":1,"oldStart":83,"oldDur":26},{"id":"doubt","name":"Step 4 · Write down doubts","dur":26,"k":1,"oldStart":109,"oldDur":26},{"id":"costs","name":"Step 5 · Costs and risk","dur":33,"k":1,"oldStart":135,"oldDur":33},{"id":"decide","name":"Step 6 · Decide","dur":27,"k":1,"oldStart":168,"oldDur":27},{"id":"monitor","name":"Step 7 · Monitor and exit","dur":34,"k":1,"oldStart":195,"oldDur":34},{"id":"journal","name":"Step 8 · Journal","dur":27,"k":1,"oldStart":229,"oldDur":27},{"id":"notrade","name":"The NO_TRADE route","dur":27,"k":1,"oldStart":256,"oldDur":27},{"id":"mistake","name":"Common mistakes","dur":27,"k":1,"oldStart":283,"oldDur":27},{"id":"try","name":"Try it","dur":26,"k":1,"oldStart":310,"oldDur":26},{"id":"risks","name":"Honest limits","dur":28,"k":1,"oldStart":336,"oldDur":28},{"id":"recap","name":"Recap","dur":28,"k":1,"oldStart":364,"oldDur":28},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":392,"oldDur":10}],"voice":{"src":null,"lines":[{"t":0.6,"d":7.15,"text":"Lesson twenty-three: the full scalping decision lifecycle, from chart to journal.","ml":"പാഠം ഇരുപത്തിമൂന്ന്: scalping തീരുമാനത്തിന്റെ മുഴുവൻ ചക്രം, ചാർട്ട് മുതൽ ജേണൽ വരെ."},{"t":8.6,"d":5.25,"text":"This is the capstone: T14 to T22, used together on one fictional chart.","ml":"ഇതാണ് അവസാന പ്രായോഗിക പാഠം: T14 മുതൽ T22 വരെ പഠിച്ചതെല്ലാം ഒരു സാങ്കൽപ്പിക ചാർട്ടിൽ ഒരുമിച്ച്."},{"t":14.1,"d":6.25,"text":"Eight steps, in the same order every time, from choosing a coin to writing a journal.","ml":"എട്ട് ഘട്ടങ്ങൾ, എപ്പോഴും ഒരേ ക്രമത്തിൽ: കോയിൻ തിരഞ്ഞെടുക്കുന്നത് മുതൽ ജേണൽ എഴുതുന്നത് വരെ."},{"t":20.6,"d":5.65,"text":"It's an educational simulation, in demo mode. No real money, no real orders.","ml":"ഇത് ഡെമോ മോഡിലുള്ള ഒരു പഠന സിമുലേഷനാണ്. യഥാർത്ഥ പണമില്ല, യഥാർത്ഥ ഓർഡറുകളുമില്ല."},{"t":26.5,"d":3.25,"text":"And we score the process, not the profit.","ml":"നമ്മൾ മാർക്ക് നൽകുന്നത് പ്രക്രിയയ്ക്കാണ്, ലാഭത്തിനല്ല."},{"t":30.6,"d":6.05,"text":"Step one: choose a coin. In this simulation, the coins and all prices are made up.","ml":"ഒന്നാം ഘട്ടം: ഒരു കോയിൻ തിരഞ്ഞെടുക്കുക. ഈ സിമുലേഷനിലെ കോയിനുകളും എല്ലാ വിലകളും സാങ്കൽപ്പികമാണ്."},{"t":36.9,"d":5.65,"text":"Liquidity means how easily you can buy or sell without moving the price much.","ml":"Liquidity എന്നാൽ വില അധികം മാറാതെ എത്ര എളുപ്പത്തിൽ buy അല്ലെങ്കിൽ sell ചെയ്യാം എന്നതാണ്."},{"t":42.8,"d":5.95,"text":"BTC/USDT has many traders and a tiny spread. XYZ/USDT is thin: a 1% spread.","ml":"BTC/USDT-ൽ ധാരാളം ട്രേഡർമാരുണ്ട്, spread വളരെ ചെറുതാണ്. XYZ/USDT നേർത്തതാണ്: 1% spread."},{"t":49,"d":5.75,"text":"Thin coins slip more. So we pick BTC/USDT, on a 1,000 USDT demo account.","ml":"നേർത്ത കോയിനുകളിൽ slippage കൂടുതലാണ്. അതുകൊണ്ട് 1,000 USDT ഡെമോ അക്കൗണ്ടിൽ BTC/USDT എടുക്കുന്നു."},{"t":55.6,"d":6.25,"text":"Step two: context. First the 5-minute chart, for the bigger picture of the last hour.","ml":"രണ്ടാം ഘട്ടം: സാഹചര്യം. ആദ്യം 5-minute ചാർട്ട്, കഴിഞ്ഞ ഒരു മണിക്കൂറിന്റെ വലിയ ചിത്രത്തിന്."},{"t":62.1,"d":6.45,"text":"Higher highs and higher lows. So on 5 minutes, the trend leans up. Trends can still end.","ml":"Higher highs-ഉം higher lows-ഉം. അതിനാൽ 5 മിനിറ്റിൽ ട്രെൻഡ് മുകളിലേക്ക് ചായുന്നു. എങ്കിലും ട്രെൻഡുകൾ അവസാനിക്കാം."},{"t":68.8,"d":6.05,"text":"Now zoom into the last 15 minutes on the 1-minute chart. Same prices, more detail.","ml":"ഇനി 1-minute ചാർട്ടിൽ അവസാന 15 മിനിറ്റ് സൂം ചെയ്യാം. അതേ വിലകൾ, കൂടുതൽ വിശദാംശം."},{"t":75.1,"d":7.65,"text":"The 1-minute chart is noisier: a run up, then a pull-back. Use it for detail, not direction.","ml":"1-minute ചാർട്ടിൽ ബഹളം കൂടുതലാണ്: ആദ്യം കയറ്റം, പിന്നെ ഒരു ഇറക്കം. വിശദാംശത്തിന് ഉപയോഗിക്കുക, ദിശയ്ക്കല്ല."},{"t":83.6,"d":6.35,"text":"Step three: range and levels. Over 15 minutes, the high was 60,650 and the low 59,850.","ml":"മൂന്നാം ഘട്ടം: range-ഉം ലെവലുകളും. 15 മിനിറ്റിൽ high 60,650, low 59,850."},{"t":90.2,"d":4.15,"text":"That's a range of 800 USDT, about 1.3% of the price.","ml":"അതായത് 800 USDT-ന്റെ range, വിലയുടെ ഏകദേശം 1.3%."},{"t":94.6,"d":5.95,"text":"Twice, price dipped into 59,850 to 59,950 and bounced. That's our support zone.","ml":"രണ്ടു തവണ വില 59,850 മുതൽ 59,950 വരെ താഴ്ന്ന് തിരിച്ചുകയറി. അതാണ് നമ്മുടെ support സോൺ."},{"t":100.8,"d":7.95,"text":"Resistance sits near the top, 60,550 to 60,650. Price is now 60,000, just above support.","ml":"Resistance മുകളിൽ, 60,550 മുതൽ 60,650 വരെ. ഇപ്പോൾ വില 60,000, support-ന് തൊട്ടു മുകളിൽ."},{"t":109.6,"d":5.95,"text":"Step four: write down what you're unsure about. Beginners often skip this step.","ml":"നാലാം ഘട്ടം: ഉറപ്പില്ലാത്തത് എന്താണെന്ന് എഴുതിവെക്കുക. തുടക്കക്കാർ പലപ്പോഴും ഈ ഘട്ടം ഒഴിവാക്കും."},{"t":115.8,"d":5.95,"text":"What I lean towards: a bounce up from support, because the 5-minute trend is up.","ml":"ഞാൻ ചായുന്നത്: support-ൽ നിന്ന് ഒരു തിരിച്ചുകയറ്റം, കാരണം 5-minute ട്രെൻഡ് മുകളിലേക്കാണ്."},{"t":122,"d":5.75,"text":"What argues against it: support was already tested twice, and it could break.","ml":"അതിനെതിരെയുള്ളത്: support ഇതിനകം രണ്ടു തവണ പരീക്ഷിക്കപ്പെട്ടു, അത് തകരാം."},{"t":128,"d":6.75,"text":"What would prove me wrong: a fall below 59,700. Confidence: medium, not certain.","ml":"ഞാൻ തെറ്റാണെന്ന് കാണിക്കുന്നത്: 59,700-ന് താഴേക്കുള്ള വീഴ്ച. ആത്മവിശ്വാസം: ഇടത്തരം, ഉറപ്പില്ല."},{"t":135.6,"d":6.55,"text":"Step five: costs and risk, before any button. Example numbers only, not a recommendation.","ml":"അഞ്ചാം ഘട്ടം: ഏത് ബട്ടൺ അമർത്തുന്നതിനും മുമ്പ് ചെലവും റിസ്കും. ഉദാഹരണ സംഖ്യകൾ മാത്രം, നിർദ്ദേശമല്ല."},{"t":142.4,"d":6.15,"text":"Entry near 60,000. Stop at 59,700, just under support. That's 300 USDT away: 0.5%.","ml":"Entry ഏകദേശം 60,000. Stop 59,700-ൽ, support-ന് തൊട്ടു താഴെ. അത് 300 USDT അകലെ: 0.5%."},{"t":148.8,"d":6.55,"text":"Example budget: 6 USDT. Fees at 0.05% each way take about 1, leaving 5 for the price move.","ml":"ഉദാഹരണ ബജറ്റ്: 6 USDT. ഓരോ വശത്തും 0.05% ഫീസ് ഏകദേശം 1 എടുക്കും; വില നീക്കത്തിന് 5 ബാക്കി."},{"t":155.6,"d":5.55,"text":"5 divided by 0.5% gives a notional of about 1,000 USDT. No leverage needed.","ml":"5-നെ 0.5% കൊണ്ട് ഹരിച്ചാൽ notional ഏകദേശം 1,000 USDT. Leverage വേണ്ട."},{"t":161.4,"d":6.35,"text":"Stop hit: about −6 USDT with fees. Target 60,600 hit: +10 minus fees, about +9 USDT.","ml":"Stop തട്ടിയാൽ: ഫീസ് ഉൾപ്പെടെ ഏകദേശം −6 USDT. Target 60,600 എത്തിയാൽ: +10-ൽ നിന്ന് ഫീസ് കുറച്ച്, ഏകദേശം +9 USDT."},{"t":168.6,"d":5.55,"text":"Step six: decide. DEMO BUY, DEMO SELL or NO_TRADE. All three are allowed.","ml":"ആറാം ഘട്ടം: തീരുമാനിക്കുക. DEMO BUY, DEMO SELL അല്ലെങ്കിൽ NO_TRADE. മൂന്നും അനുവദനീയമാണ്."},{"t":174.4,"d":6.35,"text":"Whatever you choose, write one or two lines of why. A direction alone is not a reason.","ml":"എന്ത് തിരഞ്ഞെടുത്താലും, എന്തുകൊണ്ട് എന്ന് ഒന്നോ രണ്ടോ വരി എഴുതുക. ദിശ മാത്രം ഒരു കാരണമല്ല."},{"t":181,"d":6.65,"text":"Here: trend up, a bounce at support, and a planned loss of about 6 USDT, inside the budget.","ml":"ഇവിടെ: ട്രെൻഡ് മുകളിലേക്ക്, support-ൽ തിരിച്ചുകയറ്റം, ബജറ്റിനുള്ളിൽ ഏകദേശം 6 USDT ആസൂത്രിത നഷ്ടം."},{"t":187.9,"d":6.85,"text":"So this learner picks DEMO BUY, with the stop and target set at the same time.","ml":"അതിനാൽ ഈ പഠിതാവ് DEMO BUY തിരഞ്ഞെടുക്കുന്നു, stop-ഉം target-ഉം ഒരേ സമയം സെറ്റ് ചെയ്ത്."},{"t":195.6,"d":5.75,"text":"Step seven: monitor and exit. From here, price could go up, sideways or down.","ml":"ഏഴാം ഘട്ടം: നിരീക്ഷിക്കുക, പുറത്തുകടക്കുക. ഇവിടെ നിന്ന് വില മുകളിലേക്കോ, വശത്തേക്കോ, താഴേക്കോ പോകാം."},{"t":201.6,"d":5.95,"text":"Nobody knows which path will come. That's why the stop and target were set first.","ml":"ഏത് വഴി വരുമെന്ന് ആർക്കും അറിയില്ല. അതുകൊണ്ടാണ് stop-ഉം target-ഉം ആദ്യമേ സെറ്റ് ചെയ്തത്."},{"t":207.8,"d":6.35,"text":"Now the replay. Price rises to 60,400. Tempting to dream, but the plan stays the same.","ml":"ഇനി replay. വില 60,400 വരെ കയറുന്നു. സ്വപ്നം കാണാൻ തോന്നും, പക്ഷേ പ്ലാൻ മാറുന്നില്ല."},{"t":214.4,"d":6.75,"text":"Then it turns, breaks support, and hits the stop. The fill is 59,680: 20 USDT of slippage.","ml":"പിന്നെ വില തിരിഞ്ഞ്, support തകർത്ത്, stop തട്ടുന്നു. Fill 59,680-ൽ: 20 USDT slippage."},{"t":221.4,"d":7.35,"text":"The exit happens as planned, about eight minutes in. No moving the stop, no adding more.","ml":"ഏകദേശം എട്ട് മിനിറ്റിൽ, പ്ലാൻ പോലെ തന്നെ exit. Stop മാറ്റുന്നില്ല, കൂടുതൽ ചേർക്കുന്നുമില്ല."},{"t":229.6,"d":6.35,"text":"Step eight: the journal. Write what you planned, what happened, and what you learned.","ml":"എട്ടാം ഘട്ടം: ജേണൽ. എന്ത് പ്ലാൻ ചെയ്തു, എന്ത് സംഭവിച്ചു, എന്ത് പഠിച്ചു എന്ന് എഴുതുക."},{"t":236.2,"d":5.55,"text":"Price result: −5.33 USDT. Fees: −1.00. Net: −6.33 USDT, close to the plan.","ml":"വിലയിലെ ഫലം: −5.33 USDT. ഫീസ്: −1.00. Net: −6.33 USDT, പ്ലാനിനോട് അടുത്ത്."},{"t":242,"d":6.55,"text":"Did we follow the plan? Yes: size, stop and exit all as written. Process score: 8 of 8.","ml":"നമ്മൾ പ്ലാൻ പാലിച്ചോ? അതെ: size, stop, exit എല്ലാം എഴുതിയതുപോലെ. പ്രക്രിയ സ്കോർ: 8-ൽ 8."},{"t":248.8,"d":6.95,"text":"A good process can still lose. Judge decisions by the process, not by one outcome.","ml":"നല്ല പ്രക്രിയയിലും നഷ്ടം വരാം. തീരുമാനങ്ങളെ ഒരു ഫലം കൊണ്ടല്ല, പ്രക്രിയ കൊണ്ട് വിലയിരുത്തുക."},{"t":256.6,"d":5.95,"text":"Now the other route. Another learner saw the same chart and the same numbers.","ml":"ഇനി മറ്റേ വഴി. മറ്റൊരു പഠിതാവ് അതേ ചാർട്ടും അതേ സംഖ്യകളും കണ്ടു."},{"t":262.8,"d":6.75,"text":"Their notes: support tested twice, weak volume on the bounce, not confident. So: NO_TRADE.","ml":"അവരുടെ കുറിപ്പ്: support രണ്ടു തവണ പരീക്ഷിക്കപ്പെട്ടു, തിരിച്ചുകയറ്റത്തിൽ volume കുറവ്, ഉറപ്പില്ല. അതിനാൽ: NO_TRADE."},{"t":269.8,"d":6.25,"text":"Result: 0 USDT, no fees, and a journal entry. Process: complete. That's a success too.","ml":"ഫലം: 0 USDT, ഫീസില്ല, ഒരു ജേണൽ എൻട്രി. പ്രക്രിയ: പൂർണം. അതും ഒരു വിജയമാണ്."},{"t":276.3,"d":6.45,"text":"Not because of how the replay ended. They decided before knowing, with a clear reason.","ml":"Replay എങ്ങനെ അവസാനിച്ചു എന്നതുകൊണ്ടല്ല. ഫലം അറിയുന്നതിന് മുമ്പ്, വ്യക്തമായ കാരണത്തോടെ അവർ തീരുമാനിച്ചു."},{"t":283.6,"d":5.95,"text":"Three common mistakes. First: moving the stop further away as price gets close.","ml":"മൂന്ന് സാധാരണ തെറ്റുകൾ. ഒന്ന്: വില അടുത്തെത്തുമ്പോൾ stop കൂടുതൽ ദൂരേക്ക് മാറ്റുന്നത്."},{"t":289.8,"d":6.35,"text":"That turns a planned 6 USDT loss into about 11. Keep the stop where the plan put it.","ml":"അങ്ങനെ ആസൂത്രണം ചെയ്ത 6 USDT നഷ്ടം ഏകദേശം 11 ആകും. പ്ലാനിൽ വെച്ചിടത്തു തന്നെ stop നിർത്തുക."},{"t":296.4,"d":6.65,"text":"Second: doubling the size to win a loss back. That doubles the risk too. Take a break first.","ml":"രണ്ട്: നഷ്ടം തിരിച്ചുപിടിക്കാൻ size ഇരട്ടിയാക്കുന്നത്. അത് റിസ്കും ഇരട്ടിയാക്കും. ആദ്യം ഒരു ഇടവേള എടുക്കുക."},{"t":303.3,"d":6.45,"text":"Third: judging only by profit. Judge the process, because good process can still lose.","ml":"മൂന്ന്: ലാഭം മാത്രം നോക്കി വിലയിരുത്തുന്നത്. പ്രക്രിയ വിലയിരുത്തുക, കാരണം നല്ല പ്രക്രിയയിലും നഷ്ടം വരാം."},{"t":310.6,"d":6.75,"text":"Your turn. The stop must go at 59,400: 1% away. The budget for the move is still 5 USDT.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. Stop 59,400-ൽ വെക്കണം: 1% അകലെ. നീക്കത്തിനുള്ള ബജറ്റ് ഇപ്പോഴും 5 USDT."},{"t":317.6,"d":5.55,"text":"About what notional fits? Pause if you need more time.","ml":"ഏകദേശം എത്ര notional ചേരും? കൂടുതൽ സമയം വേണമെങ്കിൽ വീഡിയോ നിർത്തുക."},{"t":323.4,"d":5.95,"text":"B, about 500 USDT. 5 divided by 1% is 500. A wider stop means a smaller position.","ml":"B, ഏകദേശം 500 USDT. 5-നെ 1% കൊണ്ട് ഹരിച്ചാൽ 500. Stop ദൂരെയാകുമ്പോൾ position ചെറുതാകണം."},{"t":329.6,"d":6.15,"text":"A is tempting, but 1,000 USDT with a 1% stop risks 10 USDT, double the budget.","ml":"A ആകർഷകമായി തോന്നും, പക്ഷേ 1% stop-ഓടെ 1,000 USDT എന്നാൽ 10 USDT റിസ്ക്, ബജറ്റിന്റെ ഇരട്ടി."},{"t":336.6,"d":7.55,"text":"Honest limits. A simulation is not the market: real fills can slip more, and real money feels different.","ml":"സത്യസന്ധമായ പരിധികൾ. സിമുലേഷൻ യഥാർത്ഥ മാർക്കറ്റല്ല: യഥാർത്ഥ fill കൂടുതൽ slip ചെയ്യാം, യഥാർത്ഥ പണം വേറെ അനുഭവമാണ്."},{"t":344.4,"d":5.75,"text":"Even a careful plan loses often. Never trade money you can't afford to lose.","ml":"ശ്രദ്ധയോടെയുള്ള പ്ലാനും പലപ്പോഴും നഷ്ടത്തിലാകും. നഷ്ടപ്പെടുത്താൻ കഴിയാത്ത പണം കൊണ്ട് ഒരിക്കലും ട്രേഡ് ചെയ്യരുത്."},{"t":350.4,"d":6.55,"text":"This plan used no leverage. More leverage makes losses bigger and can lead to liquidation.","ml":"ഈ പ്ലാനിൽ leverage ഉപയോഗിച്ചില്ല. കൂടുതൽ leverage നഷ്ടം വലുതാക്കും, liquidation-ലേക്ക് നയിക്കാം."},{"t":357.2,"d":6.55,"text":"Everything here is fictional and educational, not advice. NO_TRADE is always allowed.","ml":"ഇവിടെയുള്ളതെല്ലാം സാങ്കൽപ്പികവും പഠനത്തിനുള്ളതുമാണ്, ഉപദേശമല്ല. NO_TRADE എപ്പോഴും അനുവദനീയമാണ്."},{"t":364.6,"d":5.85,"text":"Recap. One: eight steps, in order, from choosing a coin to writing the journal.","ml":"ചുരുക്കത്തിൽ. ഒന്ന്: എട്ട് ഘട്ടങ്ങൾ, ക്രമത്തിൽ, കോയിൻ തിരഞ്ഞെടുക്കൽ മുതൽ ജേണൽ എഴുത്ത് വരെ."},{"t":370.7,"d":5.95,"text":"Two: your size comes from the risk budget and the stop distance, before deciding.","ml":"രണ്ട്: നിങ്ങളുടെ size വരുന്നത് റിസ്ക് ബജറ്റിൽ നിന്നും stop ദൂരത്തിൽ നിന്നുമാണ്, തീരുമാനിക്കുന്നതിന് മുമ്പ്."},{"t":376.9,"d":5.55,"text":"Three: judge the process, not one outcome. NO_TRADE can be a full success.","ml":"മൂന്ന്: ഒരു ഫലമല്ല, പ്രക്രിയ വിലയിരുത്തുക. NO_TRADE-ഉം പൂർണ വിജയമാകാം."},{"t":382.7,"d":5.05,"text":"Check yourself: you followed the plan and still lost. Bad decision?","ml":"സ്വയം പരിശോധിക്കൂ: പ്ലാൻ പാലിച്ചിട്ടും നഷ്ടം വന്നു. മോശം തീരുമാനമാണോ?"},{"t":388,"d":3.75,"text":"Not necessarily. Check the process first.","ml":"നിർബന്ധമില്ല. ആദ്യം പ്രക്രിയ പരിശോധിക്കുക."},{"t":392.6,"d":9.15,"text":"Next up: Checkpoint B, a review of T14 to T23. Well done for reaching the end of the lessons!","ml":"അടുത്തത്: Checkpoint B, T14 മുതൽ T23 വരെയുള്ള ഒരു റിവ്യൂ. പാഠങ്ങളുടെ അവസാനം വരെ എത്തിയതിന് അഭിനന്ദനങ്ങൾ!"}]},"assetBase":"T23/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-laptop.webp":{"mime":"image/webp","w":185,"h":170},"tutor-typing.webp":{"mime":"image/webp","w":207,"h":175},"tutor-writing.webp":{"mime":"image/webp","w":191,"h":169},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-hi.webp":{"mime":"image/webp","w":518,"h":594},"tutor-candles.webp":{"mime":"image/webp","w":257,"h":160},"tutor-pointer.webp":{"mime":"image/webp","w":248,"h":171}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T23 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson twenty-three: the full scalping decision lifecycle, from chart to journal.\"\n    },\n    {\n      \"t\": 8.6,\n      \"text\": \"This is the capstone: T14 to T22, used together on one fictional chart.\"\n    },\n    {\n      \"t\": 14.1,\n      \"text\": \"Eight steps, in the same order every time, from choosing a coin to writing a journal.\"\n    },\n    {\n      \"t\": 20.6,\n      \"text\": \"It's an educational simulation, in demo mode. No real money, no real orders.\"\n    },\n    {\n      \"t\": 26.5,\n      \"text\": \"And we score the process, not the profit.\"\n    },\n    {\n      \"t\": 30.6,\n      \"text\": \"Step one: choose a coin. In this simulation, the coins and all prices are made up.\"\n    },\n    {\n      \"t\": 36.9,\n      \"text\": \"Liquidity means how easily you can buy or sell without moving the price much.\"\n    },\n    {\n      \"t\": 42.8,\n      \"text\": \"BTC/USDT has many traders and a tiny spread. XYZ/USDT is thin: a 1% spread.\"\n    },\n    {\n      \"t\": 49.0,\n      \"text\": \"Thin coins slip more. So we pick BTC/USDT, on a 1,000 USDT demo account.\"\n    },\n    {\n      \"t\": 55.6,\n      \"text\": \"Step two: context. First the 5-minute chart, for the bigger picture of the last hour.\"\n    },\n    {\n      \"t\": 62.1,\n      \"text\": \"Higher highs and higher lows. So on 5 minutes, the trend leans up. Trends can still end.\"\n    },\n    {\n      \"t\": 68.8,\n      \"text\": \"Now zoom into the last 15 minutes on the 1-minute chart. Same prices, more detail.\"\n    },\n    {\n      \"t\": 75.1,\n      \"text\": \"The 1-minute chart is noisier: a run up, then a pull-back. Use it for detail, not direction.\"\n    },\n    {\n      \"t\": 83.6,\n      \"text\": \"Step three: range and levels. Over 15 minutes, the high was 60,650 and the low 59,850.\"\n    },\n    {\n      \"t\": 90.2,\n      \"text\": \"That's a range of 800 USDT, about 1.3% of the price.\"\n    },\n    {\n      \"t\": 94.6,\n      \"text\": \"Twice, price dipped into 59,850 to 59,950 and bounced. That's our support zone.\"\n    },\n    {\n      \"t\": 100.8,\n      \"text\": \"Resistance sits near the top, 60,550 to 60,650. Price is now 60,000, just above support.\"\n    },\n    {\n      \"t\": 109.6,\n      \"text\": \"Step four: write down what you're unsure about. Beginners often skip this step.\"\n    },\n    {\n      \"t\": 115.8,\n      \"text\": \"What I lean towards: a bounce up from support, because the 5-minute trend is up.\"\n    },\n    {\n      \"t\": 122.0,\n      \"text\": \"What argues against it: support was already tested twice, and it could break.\"\n    },\n    {\n      \"t\": 128.0,\n      \"text\": \"What would prove me wrong: a fall below 59,700. Confidence: medium, not certain.\"\n    },\n    {\n      \"t\": 135.6,\n      \"text\": \"Step five: costs and risk, before any button. Example numbers only, not a recommendation.\"\n    },\n    {\n      \"t\": 142.4,\n      \"text\": \"Entry near 60,000. Stop at 59,700, just under support. That's 300 USDT away: 0.5%.\"\n    },\n    {\n      \"t\": 148.8,\n      \"text\": \"Example budget: 6 USDT. Fees at 0.05% each way take about 1, leaving 5 for the price move.\"\n    },\n    {\n      \"t\": 155.6,\n      \"text\": \"5 divided by 0.5% gives a notional of about 1,000 USDT. No leverage needed.\"\n    },\n    {\n      \"t\": 161.4,\n      \"text\": \"Stop hit: about −6 USDT with fees. Target 60,600 hit: +10 minus fees, about +9 USDT.\"\n    },\n    {\n      \"t\": 168.6,\n      \"text\": \"Step six: decide. DEMO BUY, DEMO SELL or NO_TRADE. All three are allowed.\"\n    },\n    {\n      \"t\": 174.4,\n      \"text\": \"Whatever you choose, write one or two lines of why. A direction alone is not a reason.\"\n    },\n    {\n      \"t\": 181.0,\n      \"text\": \"Here: trend up, a bounce at support, and a planned loss of about 6 USDT, inside the budget.\"\n    },\n    {\n      \"t\": 187.9,\n      \"text\": \"So this learner picks DEMO BUY, with the stop and target set at the same time.\"\n    },\n    {\n      \"t\": 195.6,\n      \"text\": \"Step seven: monitor and exit. From here, price could go up, sideways or down.\"\n    },\n    {\n      \"t\": 201.6,\n      \"text\": \"Nobody knows which path will come. That's why the stop and target were set first.\"\n    },\n    {\n      \"t\": 207.8,\n      \"text\": \"Now the replay. Price rises to 60,400. Tempting to dream, but the plan stays the same.\"\n    },\n    {\n      \"t\": 214.4,\n      \"text\": \"Then it turns, breaks support, and hits the stop. The fill is 59,680: 20 USDT of slippage.\"\n    },\n    {\n      \"t\": 221.4,\n      \"text\": \"The exit happens as planned, about eight minutes in. No moving the stop, no adding more.\"\n    },\n    {\n      \"t\": 229.6,\n      \"text\": \"Step eight: the journal. Write what you planned, what happened, and what you learned.\"\n    },\n    {\n      \"t\": 236.2,\n      \"text\": \"Price result: −5.33 USDT. Fees: −1.00. Net: −6.33 USDT, close to the plan.\"\n    },\n    {\n      \"t\": 242.0,\n      \"text\": \"Did we follow the plan? Yes: size, stop and exit all as written. Process score: 8 of 8.\"\n    },\n    {\n      \"t\": 248.8,\n      \"text\": \"A good process can still lose. Judge decisions by the process, not by one outcome.\"\n    },\n    {\n      \"t\": 256.6,\n      \"text\": \"Now the other route. Another learner saw the same chart and the same numbers.\"\n    },\n    {\n      \"t\": 262.8,\n      \"text\": \"Their notes: support tested twice, weak volume on the bounce, not confident. So: NO_TRADE.\"\n    },\n    {\n      \"t\": 269.8,\n      \"text\": \"Result: 0 USDT, no fees, and a journal entry. Process: complete. That's a success too.\"\n    },\n    {\n      \"t\": 276.3,\n      \"text\": \"Not because of how the replay ended. They decided before knowing, with a clear reason.\"\n    },\n    {\n      \"t\": 283.6,\n      \"text\": \"Three common mistakes. First: moving the stop further away as price gets close.\"\n    },\n    {\n      \"t\": 289.8,\n      \"text\": \"That turns a planned 6 USDT loss into about 11. Keep the stop where the plan put it.\"\n    },\n    {\n      \"t\": 296.4,\n      \"text\": \"Second: doubling the size to win a loss back. That doubles the risk too. Take a break first.\"\n    },\n    {\n      \"t\": 303.3,\n      \"text\": \"Third: judging only by profit. Judge the process, because good process can still lose.\"\n    },\n    {\n      \"t\": 310.6,\n      \"text\": \"Your turn. The stop must go at 59,400: 1% away. The budget for the move is still 5 USDT.\"\n    },\n    {\n      \"t\": 317.6,\n      \"text\": \"About what notional fits? Pause if you need more time.\"\n    },\n    {\n      \"t\": 323.4,\n      \"text\": \"B, about 500 USDT. 5 divided by 1% is 500. A wider stop means a smaller position.\"\n    },\n    {\n      \"t\": 329.6,\n      \"text\": \"A is tempting, but 1,000 USDT with a 1% stop risks 10 USDT, double the budget.\"\n    },\n    {\n      \"t\": 336.6,\n      \"text\": \"Honest limits. A simulation is not the market: real fills can slip more, and real money feels different.\"\n    },\n    {\n      \"t\": 344.4,\n      \"text\": \"Even a careful plan loses often. Never trade money you can't afford to lose.\"\n    },\n    {\n      \"t\": 350.4,\n      \"text\": \"This plan used no leverage. More leverage makes losses bigger and can lead to liquidation.\"\n    },\n    {\n      \"t\": 357.2,\n      \"text\": \"Everything here is fictional and educational, not advice. NO_TRADE is always allowed.\"\n    },\n    {\n      \"t\": 364.6,\n      \"text\": \"Recap. One: eight steps, in order, from choosing a coin to writing the journal.\"\n    },\n    {\n      \"t\": 370.7,\n      \"text\": \"Two: your size comes from the risk budget and the stop distance, before deciding.\"\n    },\n    {\n      \"t\": 376.9,\n      \"text\": \"Three: judge the process, not one outcome. NO_TRADE can be a full success.\"\n    },\n    {\n      \"t\": 382.7,\n      \"text\": \"Check yourself: you followed the plan and still lost. Bad decision?\"\n    },\n    {\n      \"t\": 388.0,\n      \"text\": \"Not necessarily. Check the process first.\"\n    },\n    {\n      \"t\": 392.6,\n      \"text\": \"Next up: Checkpoint B, a review of T14 to T23. Well done for reaching the end of the lessons!\"\n    }\n  ]\n}","scene-coin.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Two made-up markets: a deep book with a tiny spread, and a thin one with a 1% spread.\nconst CN = [\n  { n: 'BTC/USDT', ba: 'Bid 59,999 · Ask 60,001', sp: 'Spread 2 USDT ≈ 0.003%', bids: [0.95, 0.8, 0.9, 0.7, 0.85], asks: [0.9, 0.85, 0.75, 0.95, 0.8], liq: 0.9, lq: 'High', res: '✓ Chosen', col: 'var(--main)' },\n  { n: 'XYZ/USDT', ba: 'Bid 0.995 · Ask 1.005', sp: 'Spread 0.01 USDT = 1%', bids: [0.22, 0.1, 0.16, 0.06, 0.12], asks: [0.14, 0.2, 0.08, 0.12, 0.05], liq: 0.16, lq: 'Thin', res: 'Skip', col: 'var(--accent)' },\n];\nkit.scene('coin', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.head = UI.head(kit, 'Step 1 of 8 · Choose a coin', 'Choose a liquid market');\n    this.track = UI.track(kit, 1);\n    let cards = '';\n    CN.forEach((c, k) => {\n      let book = '';\n      for (let i = 0; i < 5; i++) {\n        book += '<div style=\"position:absolute;right:50%;margin-right:10px;top:' + (i * 24) + 'px;height:16px;border-radius:4px 0 0 4px;background:color-mix(in srgb, var(--up) 70%, transparent)\" class=\"cn-b\" data-w=\"' + c.bids[i] + '\"></div>' +\n          '<div style=\"position:absolute;left:50%;margin-left:10px;top:' + (i * 24) + 'px;height:16px;border-radius:0 4px 4px 0;background:color-mix(in srgb, var(--down) 70%, transparent)\" class=\"cn-b\" data-w=\"' + c.asks[i] + '\"></div>';\n      }\n      cards += '<div class=\"glass cn-c\" style=\"left:' + (140 + k * 510) + 'px;top:300px;width:480px;height:420px;padding:26px 30px\">' +\n        '<div style=\"display:flex;align-items:center;justify-content:space-between\"><span class=\"mono\" style=\"font-size:40px\">' + c.n + '</span>' +\n        '<span class=\"chip cn-r\" style=\"font-size:24px;padding:6px 18px;' + (k ? 'border-color:var(--accent);color:var(--accent)' : 'background:var(--main);color:var(--ground);border-color:var(--main)') + '\">' + c.res + '</span></div>' +\n        '<p class=\"mono\" style=\"margin:12px 0 0;font-size:26px;color:color-mix(in srgb, var(--second) 75%, var(--ground))\">' + c.ba + '</p>' +\n        '<p class=\"fict\" style=\"margin:22px 0 8px\">Order book · buyers | sellers</p>' +\n        '<div style=\"position:relative;height:116px\">' + book + '<div style=\"position:absolute;left:50%;top:-4px;width:2px;height:120px;background:color-mix(in srgb, var(--second) 30%, transparent)\"></div></div>' +\n        '<p class=\"mono cn-sp\" style=\"margin:18px 0 0;font-size:26px;color:' + c.col + '\">' + c.sp + '</p>' +\n        '<div class=\"cn-m\" style=\"display:flex;align-items:center;gap:16px;margin-top:20px\"><span style=\"font-size:26px;font-weight:600;width:120px\">Liquidity</span>' +\n        '<div style=\"flex:1;height:16px;border-radius:8px;background:color-mix(in srgb, var(--second) 10%, transparent);overflow:hidden\"><div class=\"cn-f\" style=\"height:100%;width:0;background:' + c.col + '\"></div></div><span class=\"mono\" style=\"font-size:24px;width:70px\">' + c.lq + '</span></div>' +\n        '</div>';\n    });\n    kit.stage.append(kit.h('<div><p class=\"fict\" style=\"position:absolute;left:140px;top:262px;margin:0\">Made-up coins · fictional prices · educational simulation</p>' + cards +\n      '<div class=\"glass cn-d\" style=\"left:1180px;top:300px;width:600px;padding:24px 32px\"><p class=\"kick\" style=\"margin:0 0 10px\">Liquidity</p><p class=\"def\" style=\"margin:0;font-size:30px\">How easily you can <b>buy or sell</b> without moving the price much.</p></div>' +\n      '<div class=\"glass cn-a\" style=\"left:1180px;top:520px;width:600px;padding:24px 32px;border-color:var(--main)\"><div style=\"display:flex;align-items:center;gap:16px\"><p class=\"kick\" style=\"margin:0\">Demo account</p><span class=\"chip mono\" style=\"font-size:20px;padding:4px 14px;background:var(--main);color:var(--ground);border-color:var(--main)\">DEMO</span></div>' +\n      '<p class=\"mono\" style=\"margin:8px 0 0;font-size:64px\"><span class=\"cn-v\">0</span> <span style=\"font-size:32px;color:color-mix(in srgb, var(--second) 60%, var(--ground))\">USDT</span></p>' +\n      '<p style=\"margin:4px 0 0;font-size:24px;color:color-mix(in srgb, var(--second) 62%, var(--ground))\">Practice money · no real orders</p></div></div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.cards = all('.cn-c').map((e) => e.style); this.bars = all('.cn-b').map((e) => ({ st: e.style, w: +e.dataset.w }));\n    this.sp = all('.cn-sp').map((e) => e.style); this.m = all('.cn-m').map((e) => e.style); this.f = all('.cn-f').map((e) => e.style); this.r = all('.cn-r').map((e) => e.style);\n    this.d = q('.cn-d').style; this.a = q('.cn-a').style; this.v = q('.cn-v');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 1.0, pose: 'magnify' }, { t: 6.9, pose: 'explain' }, { t: 12.8, pose: 'think' }, { t: 19.0, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t); this.head(t); this.track(t);\n    this.cards.forEach((s, i) => { UI.rise(kit, s, t, 1.0 + i * 0.4, 0.7, 34); });\n    this.bars.forEach((b, i) => { const a = 7.2 + (i % 10) * 0.08 + (i >= 10 ? 0.5 : 0); b.st.width = (b.w * 170 * eio(seg(t, a, a + 0.7))).toFixed(1) + 'px'; });\n    this.sp.forEach((s, i) => { UI.rise(kit, s, t, 12.9 + i * 2.2, 0.5, 14); });\n    this.m.forEach((s, i) => { s.opacity = eo(seg(t, 7.2, 7.6)); });\n    this.f.forEach((s, i) => { s.width = (CN[i].liq * 100 * eio(seg(t, 8.0 + i * 0.5, 9.2 + i * 0.5))).toFixed(1) + '%'; });\n    this.r.forEach((s, i) => { const p = seg(t, 19.2 + i * 0.6, 19.8 + i * 0.6); s.opacity = eo(p); s.transform = 'scale(' + lerp(0.7, 1, eob(p, 1.8)).toFixed(3) + ')'; });\n    const dim = eo(seg(t, 19.8, 20.4));\n    this.cards[1].opacity = (+this.cards[1].opacity * lerp(1, 0.55, dim)).toFixed(3);\n    this.cards[0].borderColor = dim > 0 ? 'var(--main)' : '';\n    UI.rise(kit, this.d, t, 6.9, 0.6, 24);\n    UI.rise(kit, this.a, t, 19.4, 0.6, 24);\n    UI.set(this.v, UI.fmt(Math.round(1000 * eo(seg(t, 19.8, 21.0)))));\n    this.tutor.render(t);\n  },\n});\n","scene-context.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// The 5-minute hour first (higher highs, higher lows), then its last three candles become fifteen 1-minute candles.\nconst CX_LO = [0, 2, 5, 11], CX_HI = [1, 4, 9];\nkit.scene('context', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.head = UI.head(kit, 'Step 2 of 8 · Context', 'Big picture first');\n    this.track = UI.track(kit, 2);\n    const D = UI.D, X = D.x5, Y = D.y5;\n    this.c5 = UI.cdl(kit, 'cx5', 12);\n    let dots = '';\n    CX_LO.forEach((i) => { dots += '<circle class=\"cx-d\" cx=\"' + X(i) + '\" cy=\"' + (Y(D.K5[i][2]) + 16).toFixed(1) + '\" r=\"9\" style=\"fill:var(--main)\"/>'; });\n    CX_HI.forEach((i) => { dots += '<circle class=\"cx-d\" cx=\"' + X(i) + '\" cy=\"' + (Y(D.K5[i][1]) - 16).toFixed(1) + '\" r=\"9\" style=\"fill:var(--accent)\"/>'; });\n    const bx = X(9) - 32, bw = X(11) - X(9) + 64, by = Y(60650) - 18, bh = Y(59850) - Y(60650) + 36;\n    const svg5 = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"cx-5\">' + UI.grid(160, 1040, Y, 58800, 60800, 400) + this.c5.html +\n      '<line class=\"cx-tl\" x1=\"' + X(0) + '\" y1=\"' + (Y(58950) + 16).toFixed(1) + '\" x2=\"' + X(11) + '\" y2=\"' + (Y(59850) + 16).toFixed(1) + '\" pathLength=\"1\" stroke-width=\"3\" stroke-dasharray=\"1 1\" style=\"stroke:var(--main)\"/>' +\n      dots + '<rect class=\"cx-box\" x=\"' + bx + '\" y=\"' + by.toFixed(1) + '\" width=\"' + bw + '\" height=\"' 'magnify' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t); this.head(t);\n    UI.rise(kit, this.qc, t, 1.0, 0.7, 30);\n    const rv = eo(seg(t, TR_R, TR_R + 0.5)), nb = eo(seg(t, TR_N, TR_N + 0.5));\n    this.os.forEach((s, i) => {\n      const a = 3.0 + i * 0.4, p = eo(seg(t, a, a + 0.5)), good = i === TR_OK, tempt = i === TR_BAD;\n      const dim = good ? 1 : tempt ? lerp(lerp(1, 0.5, rv), 1, nb) : lerp(1, 0.4, rv);\n      s.opacity = (eo(seg(t, a, a + 0.3)) * dim).toFixed(3);\n      s.transform = 'translateX(' + lerp(30, 0, p).toFixed(1) + 'px)';\n      if (good) { s.borderColor = 'color-mix(in srgb, var(--main) ' + (14 + 86 * rv).toFixed(0) + '%, transparent)'; s.background = 'color-mix(in srgb, var(--ground) ' + lerp(90, 74, rv).toFixed(0) + '%, var(--main))'; this.ls[i].background = rv > 0.5 ? 'var(--main)' : 'transparent'; this.ls[i].color = rv > 0.5 ? 'var(--ground)' : 'var(--second)'; }\n      if (tempt) s.borderColor = 'color-mix(in srgb, ' + (nb > 0 ? 'var(--accent)' : 'var(--second)') + ' ' + (14 + 86 * nb).toFixed(0) + '%, transparent)';\n    });\n    const po = seg(t, TR_R + 0.2, TR_R + 0.7), pn = seg(t, TR_N + 0.1, TR_N + 0.6);\n    this.ok.setAttribute('stroke-dasharray', eo(po).toFixed(3) + ' 1'); this.ok.style.opacity = po > 0 ? 1 : 0;\n    this.no.setAttribute('stroke-dasharray', eo(pn).toFixed(3) + ' 1'); this.no.style.opacity = pn > 0 ? 1 : 0;\n    this.ring(t);\n    this.hint.style.opacity = eo(seg(t, 10.0, 10.5)) * (1 - ei(seg(t, TR_R - 0.2, TR_R + 0.2)));\n    const wp = seg(t, TR_R + 0.6, TR_R + 1.2);\n    this.w.opacity = eo(wp); this.w.transform = 'translateY(' + lerp(24, 0, eo(wp)).toFixed(1) + 'px)';\n    this.w2.opacity = nb; this.w2.transform = 'translateX(' + lerp(20, 0, nb).toFixed(1) + 'px)';\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson twenty-three\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 5, lesson T23, Full Scalping Decision Lifecycle; an eight-step loop draws around a DEMO badge; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"Eight steps\",\n      \"dur\": 22,\n      \"desc\": \"The capstone: eight step cards in order, from choosing a coin to the journal; educational simulation, demo only; scored on process, not profit.\"\n    },\n    {\n      \"id\": \"coin\",\n      \"name\": \"Step 1 · Choose a coin\",\n      \"dur\": 25,\n      \"desc\": \"Liquidity defined; made-up BTC/USDT (deep book, spread about 0.003%) against XYZ/USDT (thin book, 1% spread); BTC/USDT chosen on a 1,000 USDT demo account.\"\n    },\n    {\n      \"id\": \"context\",\n      \"name\": \"Step 2 · Context\",\n      \"dur\": 28,\n      \"desc\": \"A fictional 5-minute chart: higher highs and higher lows, trend leans up; the last three 5-minute candles become fifteen 1-minute candles with a run up and a pull-back.\"\n    },\n    {\n      \"id\": \"levels\",\n      \"name\": \"Step 3 · Range and levels\",\n      \"dur\": 26,\n      \"desc\": \"On the 1-minute chart: range 59,850 to 60,650 = 800 USDT, about 1.3%; support zone 59,850-59,950 touched twice; resistance 60,550-60,650; price now 60,000.\"\n    },\n    {\n      \"id\": \"doubt\",\n      \"name\": \"Step 4 · Write down doubts\",\n      \"dur\": 26,\n      \"desc\": \"Notes typed in: leaning (bounce from support), against (support tested twice), wrong if below 59,700, confidence medium; two possible paths fork from the price.\"\n    },\n    {\n      \"id\": \"costs\",\n      \"name\": \"Step 5 · Costs and risk\",\n      \"dur\": 33,\n      \"desc\": \"Entry 60,000, stop 59,700 (0.5%), target 60,600 (1%); example budget 6 USDT, fees about 1 USDT, 5 USDT for the move, notional 5 / 0.5% = 1,000 USDT at 1x; stop about -6, target about +9.\"\n    },\n    {\n      \"id\": \"decide\",\n      \"name\": \"Step 6 · Decide\",\n      \"dur\": 27,\n      \"desc\": \"DEMO BUY, DEMO SELL and NO_TRADE buttons; a written reason types in; DEMO BUY is chosen with stop and target set; a demo ticket appears.\"\n    },\n    {\n      \"id\": \"monitor\",\n      \"name\": \"Step 7 · Monitor and exit\",\n      \"dur\": 34,\n      \"desc\": \"Three possible paths fan out; the replay forms eight 1-minute candles: up to 60,400, then down through support; the stop triggers and fills at 59,680; open PnL meter moves and freezes at -5.33.\"\n    },\n    {\n      \"id\": \"journal\",\n      \"name\": \"Step 8 · Journal\",\n      \"dur\": 27,\n      \"desc\": \"Journal card fills in: plan, exit, result -5.33 price, -1.00 fees, -6.33 net; process score ticks to 8 of 8; demo balance 993.67 USDT.\"\n    },\n    {\n      \"id\": \"notrade\",\n      \"name\": \"The NO_TRADE route\",\n      \"dur\": 27,\n      \"desc\": \"Same chart and numbers; a second learner writes doubts and picks NO_TRADE: 0 USDT, no fees, process complete, a success decided before knowing the outcome.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"Common mistakes\",\n      \"dur\": 27,\n      \"desc\": \"Moving the stop (loss about 6 becomes about 11), doubling size to win back a loss (risk doubles), judging only by profit; each with its correction.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 26,\n      \"desc\": \"Pause and calculate: stop 1% away, 5 USDT for the move; options 1,000 / 500 / 5,000 USDT; 5-second countdown; answer B, 500 USDT; why not A.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Honest limits\",\n      \"dur\": 28,\n      \"desc\": \"Simulation is not the market; careful plans still lose; leverage and liquidation; fictional and educational, NO_TRADE always allowed.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 28,\n      \"desc\": \"Three key points and a check question: followed the plan and still lost, bad decision? Not necessarily.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: Phase 5 lessons complete; next, Checkpoint B (CPB), a video recap of T14 to T23.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // No voice: the music is the only sound. Soft pad and keys; a light pulse while the steps run; quieter for mistakes and limits.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.coin, T.doubt) || inR(s, T.costs, T.journal) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.mistake, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 30 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 46 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  const pops = (s, at, v, p) => at.forEach((a) => S.fx('pop', s + a, { vel: v || 28, pitch: p == null ? 5 : p }));\n  // title + hook\n  for (let i = 0; i < 8; i++) S.fx('pop', T.title + 0.9 + i * 0.5, { vel: 22, pitch: 2 + i });\n  for (let i = 0; i < 9; i++) S.fx('tick', T.hook + 1.0 + i * 0.3, { vel: 22 });\n  for (let i = 0; i < 8; i++) S.fx('pop', T.hook + 6.4 + i * 0.7, { vel: 28, pitch: 2 + i });\n  S.fx('ding', T.hook + 12.6, { vel: 32 }); S.fx('chime', T.hook + 18.5, { vel: 36 });\n  // steps\n  pops(T.coin, [1.0, 1.4], 28); S.fx('whoosh', T.coin + 7.2, { dur: 1.0, vel: 20 }); S.fx('ding', T.coin + 19.2, { vel: 36 }); S.fx('pop', T.coin + 19.8, { vel: 26, pitch: -3 });\n  for (let i = 0; i < 12; i++) S.fx('tick', T.context + 1.0 + i * 0.3, { vel: 18 });\n  for (let i = 0; i < 7; i++) S.fx('pop', T.context + 7.3 + i * 0.35, { vel: 24, pitch: i });\n  S.fx('whoosh', T.context + 14.9, { dur: 1.2, vel: 24 });\n  pops(T.levels, [1.4, 3.0], 30); S.fx('whoosh', T.levels + 7.2, { dur: 0.9, vel: 18 }); pops(T.levels, [12.8, 14.0], 30, 9); S.fx('pop', T.levels + 18.0, { vel: 28, pitch: 2 }); S.fx('ding', T.levels + 20.6, { vel: 30 });\n  pops(T.doubt, [7.0, 13.2, 19.2], 26); S.fx('whoosh', T.doubt + 7.4, { dur: 1.0, vel: 18 }); S.fx('whoosh', T.doubt + 13.6, { dur: 1.0, vel: 18 }); S.fx('ding', T.doubt + 22.0, { vel: 28 });\n  pops(T.costs, [1.0, 8.6, 14.0, 15.8, 17.8], 26); S.fx('ding', T.costs + 21.2, { vel: 36 }); S.fx('thud', T.costs + 26.6, { vel: 28 }); S.fx('chime', T.costs + 29.4, { vel: 34 });\n  [1.4, 2.0, 2.6].forEach((a) => S.fx('tick', T.decide + a, { vel: 26 }));\n  { const ts = []; for (let s = 13.3; s < 17.8; s += 0.22) ts.push(T.decide + s); S.ticks(ts, { vel: 12 }); }\n  S.fx('pop', T.decide + 20.2, { vel: 36, pitch: 0 }); S.fx('chime', T.decide + 20.8, { vel: 36 });\n  S.fx('whoosh', T.monitor + 1.2, { dur: 1.8, vel: 20 });\n  for (let j = 0; j < 8; j++) S.fx('tick', T.monitor + 11.4 + j * 1.6, { vel: 24 });\n  S.fx('thud', T.monitor + 23.5, { vel: 36 }); S.fx('ding', T.monitor + 26.4, { vel: 26 });\n  pops(T.journal, [1.2, 2.0, 2.8, 3.6], 24); for (let i = 0; i < 3; i++) S.fx('tick', T.journal + 7.6 + i * 1.4, { vel: 24 });\n  for (let i = 0; i < 8; i++) S.fx('pop', T.journal + 13.6 + i * 0.4, { vel: 28, pitch: 2 + i });\n  S.fx('chime', T.journal + 16.9, { vel: 38 });\n  S.fx('pop', T.notrade + 11.4, { vel: 34, pitch: 0 }); pops(T.notrade, [14.0, 14.9, 15.8], 26, 7); S.fx('chime', T.notrade + 17.0, { vel: 40 }); S.fx('whoosh', T.notrade + 20.6, { dur: 1.2, vel: 18 });\n  [0.8, 13.4, 20.3].forEach((a) => S.fx('thud', T.mistake + a, { vel: 24 })); [6.8, 17.6, 23.0].forEach((a) => S.fx('chime', T.mistake + a, { vel: 30 }));\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 8.0 + i, { vel: 30 });\n  S.fx('chime', T.try + 13.4, { vel: 42 }); S.fx('ding', T.try + 13.7, { vel: 30 }); S.fx('thud', T.try + 19.6, { vel: 24 });\n  [1.0, 8.6, 14.6, 21.4].forEach((a) => S.fx('pop', T.risks + a, { vel: 26 }));\n  [1.4, 7.5, 13.7].forEach((a) => S.fx('pop', T.recap + a, { vel: 32, pitch: 7 })); S.fx('ding', T.recap + 24.0, { vel: 36 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 21, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T23 · Full scalping decision lifecycle',\n  TOTAL: 402,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // Side speech bubbles sit this far higher than in T01, so they clear the two-line caption band (y ≈ 784–930).\n  LIFT: 96,\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n  // ── Chart helpers (from T14) ──\n  // Piecewise eased value through keys [[t, v], ...].\n  path(keys, t) {\n    const K = UI.K; let v = keys[0][1];\n    for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = K.lerp(a[1], b[1], K.eio(K.clamp01((t - a[0]) / (b[0] - a[0])))); }\n    return v;\n  },\n  // Price grid for a chart: horizontal lines with price labels to the right of x1.\n  grid(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (+y + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Same grid with the price labels on the left, ending at x0 <script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *
 * build-lesson.mjs inlines this file into public/futures-edge/lessons/<id>.html, after a
 * `window.FILM = {...}` block that carries the scene list, module texts and asset paths.
 */
(function () {
  "use strict";

  const F = window.FILM;
  const W = F.width;
  const H = F.height;

  // ── Maths and easing ───────────────────────────────────────────────────────

  const clamp01 = (x) => clamp(x, 0, 1);

    x = clamp01(x);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  };

    x = clamp01(x);
    return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
  };
  const rng = (seed) => {
    let a = seed >>> 0 || 1;
