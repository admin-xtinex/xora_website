<script>window.FILM = {"id":"T09","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson nine","dur":9,"k":1,"oldStart":0,"oldDur":9},{"id":"hook","name":"A tiny win?","dur":17,"k":1,"oldStart":9,"oldDur":17},{"id":"fee","name":"Trading fees","dur":22,"k":1,"oldStart":26,"oldDur":22},{"id":"maker","name":"Maker and taker","dur":22,"k":1,"oldStart":48,"oldDur":22},{"id":"spread","name":"Spread","dur":20,"k":1,"oldStart":70,"oldDur":20},{"id":"slip","name":"Slippage","dur":17,"k":1,"oldStart":90,"oldDur":17},{"id":"funding","name":"Funding","dur":21,"k":1,"oldStart":107,"oldDur":21},{"id":"add","name":"Add it up","dur":25,"k":1,"oldStart":128,"oldDur":25},{"id":"breakeven","name":"Break-even move","dur":20,"k":1,"oldStart":153,"oldDur":20},{"id":"mistake","name":"Common mistake","dur":18,"k":1,"oldStart":173,"oldDur":18},{"id":"try","name":"Try it","dur":24,"k":1,"oldStart":191,"oldDur":24},{"id":"check","name":"Check first","dur":22,"k":1,"oldStart":215,"oldDur":22},{"id":"risks","name":"Know the limits","dur":22,"k":1,"oldStart":237,"oldDur":22},{"id":"recap","name":"Recap","dur":26,"k":1,"oldStart":259,"oldDur":26},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":285,"oldDur":10}],"voice":{"src":null,"lines":[{"t":0.6,"d":3.35,"text":"Lesson nine: fees, spread and slippage."},{"t":4.2,"d":4.55,"text":"The small costs that can turn a win into a loss."},{"t":9.4,"d":6.05,"text":"Here's a tiny trade: 0.01 BTC. The price on the chart goes from 60,000 to 60,080."},{"t":15.7,"d":4.75,"text":"On the chart, that looks like a gain of 0.80 USDT. Easy money?"},{"t":20.7,"d":5.05,"text":"Not so fast. Three costs are waiting: fees, spread and slippage."},{"t":26.4,"d":6.75,"text":"A trading fee is charged each time an order fills, as a percentage of the position value."},{"t":33.4,"d":6.45,"text":"Like a booking fee on a ticket: you pay it every time, whether things go well or not."},{"t":40.1,"d":7.65,"text":"0.01 BTC at 60,000 is 600 USDT. At 0.05%, the fee is 0.30 USDT, on entry and again on exit."},{"t":48.4,"d":7.35,"text":"Many exchanges charge two rates. A taker order fills at once against the book, like a market order."},{"t":56,"d":6.85,"text":"A maker order waits in the book, like a limit order, and adds to it. Makers often pay less."},{"t":63.1,"d":6.65,"text":"In this example: maker 0.02%, taker 0.05%. Real rates vary by exchange and account."},{"t":70.4,"d":4.65,"text":"The spread is the gap between the best ask and the best bid."},{"t":75.3,"d":6.25,"text":"Like a money changer: one price to buy from them, a lower price to sell back."},{"t":81.8,"d":7.95,"text":"Ask 60,005, bid 59,995: spread 10. Buy and sell at once, and you lose 0.10 USDT on 0.01 BTC."},{"t":90.4,"d":5.15,"text":"Slippage, from T07: the fill is worse than the price you expected."},{"t":95.8,"d":6.05,"text":"Say each market order slips 10 USDT per BTC, on the way in and on the way out."},{"t":102.1,"d":4.65,"text":"That is 20 per BTC, or 0.20 USDT on 0.01 BTC."},{"t":107.4,"d":6.85,"text":"Futures have one more cost: funding. It's a regular payment between long and short traders."},{"t":114.5,"d":6.55,"text":"It's separate from trading fees. You may pay it, or receive it, depending on the rate."},{"t":121.3,"d":6.45,"text":"Example: a 0.01% rate on 600 USDT is 0.06 USDT, each funding time. T13 covers it."},{"t":128.4,"d":3.55,"text":"Now let's add it all up for our tiny trade."},{"t":132.2,"d":4.95,"text":"Chart gain: plus 0.80. Spread: minus 0.10. Slippage: minus 0.20."},{"t":137.4,"d":3.45,"text":"Fees on entry and exit: minus 0.60 USDT."},{"t":141.1,"d":4.95,"text":"Net result: minus 0.10 USDT. A gross winner became a net loser."},{"t":146.3,"d":6.45,"text":"Funding is left out here, because this trade was closed within minutes."},{"t":153.4,"d":5.55,"text":"The break-even move is how far price must move just to cover your costs."},{"t":159.2,"d":5.15,"text":"Fees alone: 2 × 0.05% = 0.10%. On 60,000, that's 60 USDT per BTC."},{"t":164.6,"d":8.15,"text":"Add spread and slippage, and it's about 90 USDT per BTC, or 0.15%, before you make anything."},{"t":173.4,"d":4.55,"text":"A common mistake: fees look tiny, so people ignore them."},{"t":178.2,"d":5.75,"text":"But 20 small trades at 0.60 USDT of fees each cost 12 USDT, win or lose."},{"t":184.2,"d":6.55,"text":"Small, frequent trades feel the costs most. Count them before you trade."},{"t":191.4,"d":6.35,"text":"Your turn. Buy 0.01 BTC at 60,000, sell at 60,040. Fees: 0.30 USDT on each side."},{"t":198,"d":6.85,"text":"Ignore spread and slippage. What is the gross result, and the net? Pause if you need to."},{"t":205.1,"d":5.45,"text":"Gross: 40 × 0.01 = plus 0.40 USDT. Fees: 0.60. Net: minus 0.20 USDT."},{"t":210.8,"d":3.95,"text":"A winner on the chart, a loser in your account."},{"t":215.4,"d":3.45,"text":"Before any trade, check your real costs."},{"t":219.1,"d":6.45,"text":"Your actual fee rate and account tier. The spread right now. How deep the book is."},{"t":225.8,"d":6.45,"text":"The funding rate and time. And does the move you expect beat the break-even move?"},{"t":232.5,"d":4.25,"text":"If not, NO_TRADE is the sensible choice."},{"t":237.4,"d":4.45,"text":"This lesson used a simple model, with example numbers."},{"t":242.1,"d":6.15,"text":"Real fees depend on your exchange and account tier. Check them before you act."},{"t":248.5,"d":5.95,"text":"Fees are charged on the full position value, not just the money you put in."},{"t":254.7,"d":4.05,"text":"And slippage grows in fast markets."},{"t":259.4,"d":1.55,"text":"Let's recap."},{"t":261.2,"d":5.45,"text":"Fees are charged on entry and exit, as a percentage of position value."},{"t":266.9,"d":6.45,"text":"Spread and slippage quietly worsen your prices. Funding is a separate futures cost."},{"t":273.6,"d":6.65,"text":"Check yourself: the move you expect is smaller than the break-even move. What do you do?"},{"t":280.5,"d":4.25,"text":"Don't trade. Choose WAIT, or NO_TRADE."},{"t":285.6,"d":9.15,"text":"Well done! That completes Phase 2. Next up, T10: a tour of an exchange platform."}]},"assetBase":"T09/assets/","assets":{"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-candles.webp":{"mime":"image/webp","w":257,"h":160},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":331,"h":446},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gr  just to cover your costs.\"\n    },\n    {\n      \"t\": 159.2,\n      \"text\": \"Fees alone: 2 × 0.05% = 0.10%. On 60,000, that's 60 USDT per BTC.\"\n    },\n    {\n      \"t\": 164.6,\n      \"text\": \"Add spread and slippage, and it's about 90 USDT per BTC, or 0.15%, before you make anything.\"\n    },\n    {\n      \"t\": 173.4,\n      \"text\": \"A common mistake: fees look tiny, so people ignore them.\"\n    },\n    {\n      \"t\": 178.2,\n      \"text\": \"But 20 small trades at 0.60 USDT of fees each cost 12 USDT, win or lose.\"\n    },\n    {\n      \"t\": 184.2,\n      \"text\": \"Small, frequent trades feel the costs most. Count them before you trade.\"\n    },\n    {\n      \"t\": 191.4,\n      \"text\": \"Your turn. Buy 0.01 BTC at 60,000, sell at 60,040. Fees: 0.30 USDT on each side.\"\n    },\n    {\n      \"t\": 198,\n      \"text\": \"Ignore spread and slippage. What is the gross result, and the net? Pause if you need to.\"\n    },\n    {\n      \"t\": 205.1,\n      \"text\": \"Gross: 40 × 0.01 = plus 0.40 USDT. Fees: 0.60. Net: minus 0.20 USDT.\"\n    },\n    {\n      \"t\": 210.8,\n      \"text\": \"A winner on the chart, a loser in your account.\"\n    },\n    {\n      \"t\": 215.4,\n      \"text\": \"Before any trade, check your real costs.\"\n    },\n    {\n      \"t\": 219.1,\n      \"text\": \"Your actual fee rate and account tier. The spread right now. How deep the book is.\"\n    },\n    {\n      \"t\": 225.8,\n      \"text\": \"The funding rate and time. And does the move you expect beat the break-even move?\"\n    },\n    {\n      \"t\": 232.5,\n      \"text\": \"If not, NO_TRADE is the sensible choice.\"\n    },\n    {\n      \"t\": 237.4,\n      \"text\": \"This lesson used a simple model, with example numbers.\"\n    },\n    {\n      \"t\": 242.1,\n      \"text\": \"Real fees depend on your exchange and account tier. Check them before you act.\"\n    },\n    {\n      \"t\": 248.5,\n      \"text\": \"Fees are charged on the full position value, not just the money you put in.\"\n    },\n    {\n      \"t\": 254.7,\n      \"text\": \"And slippage grows in fast markets.\"\n    },\n    {\n      \"t\": 259.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 261.2,\n      \"text\": \"Fees are charged on entry and exit, as a percentage of position value.\"\n    },\n    {\n      \"t\": 266.9,\n      \"text\": \"Spread and slippage quietly worsen your prices. Funding is a separate futures cost.\"\n    },\n    {\n      \"t\": 273.6,\n      \"text\": \"Check yourself: the move you expect is smaller than the break-even move. What do you do?\"\n    },\n    {\n      \"t\": 280.5,\n      \"text\": \"Don't trade. Choose WAIT, or NO_TRADE.\"\n    },\n    {\n      \"t\": 285.6,\n      \"text\": \"Well done! That completes Phase 2. Next up, T10: a tour of an exchange platform.\"\n    }\n  ]\n}\n","scene-add.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Waterfall in USDT: start +0.80, then −0.10, −0.20, −0.60, net −0.10.\nconst AD_Z = 600, AD_K = 380;\nconst AD_STEPS = [['Chart gain', 0, 0.80, 'var(--main)', 4.3], ['Spread', 0.80, 0.70, 'var(--accent)', 6.0], ['Slippage', 0.70, 0.50, 'var(--accent)', 7.7], ['Fees', 0.50, -0.10, 'var(--accent)', 9.6], ['Net', 0, -0.10, 'var(--accent)', 13.2]];\nconst adY = (v) => AD_Z - v * AD_K;\nconst adS = (v) => (v > 0 ? '+' : '−') + Math.abs(v).toFixed(2);\nkit.scene('add', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let bars = '', rows = '';\n    AD_STEPS.forEach((s, i) => {\n      const x = 1000 + i * 150, top = adY(Math.max(s[1], s[2])), h = Math.abs(s[2] - s[1]) * AD_K;\n      bars += '<g class=\"ad-bar\"><rect class=\"ad-rect\" x=\"' + x + '\" y=\"' + top.toFixed(1) + '\" width=\"100\" height=\"' + h.toFixed(1) + '\" rx=\"8\" style=\"fill:color-mix(in srgb, ' + s[3] + ' 45%, var(--ground));stroke:' + s[3] + ';stroke-width:2\"/>' +\n        '<text x=\"' + (x + 50) + '\" y=\"' + (s[2] >= s[1] && s[2] > 0 ? top - 14 : top + h + 32).t a, a + 0.5))).toFixed(1) + 'px)';\n    });\n    UI.rise(this.fill, t, 14.4);\n    UI.rise(this.fu, t, 18.4);\n    this.tutor.render(t);\n  },\n});\n","scene-breakeven.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Chart price rises from 60,000: fees covered at 60,060 (~10.2), break-even at 60,090 (~14.6), then 60,130.\nconst BE_K = [[0, 60000], [6.2, 60005], [10.2, 60060], [14.6, 60090], [18.6, 60130], [20, 60132]];\nconst beP = (s) => UI.path(BE_K, s) + Math.sin(s * 4.7) * 3;\nconst beX = (s) => 1000 + Math.min(s, 18.6) / 18.6 * 560, beY = (p) => 720 - (p - 59960) / 200 * 460;\nkit.scene('breakeven', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const lvl = (cls, p, label, col, dash) => '<g class=\"' + cls + '\"><line x1=\"1000\" x2=\"1560\" y1=\"' + beY(p).toFixed(1) + '\" y2=\"' + beY(p).toFixed(1) + '\" stroke-width=\"3\"' + (dash ? ' stroke-dasharray=\"12 9\"' : '') + ' style=\"stroke:' + col + '\"/>' +\n      '<text x=\"1012\" y=\"' + (beY(p) + (cls === 'be-e' ? 34 : -12)).toFixed(1) + '\" style=\"fill:' + col + ';font-size:24px;font-weight:700\">' + label + '</text></g>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\">' + UI.grid(1000, 1560, beY, 59960, 60160, 40) +\n      '<rect class=\"be-zone\" x=\"1000\" y=\"' + beY(60090).toFixed(1) + '\" width=\"560\" height=\"' + (beY(60000) - beY(60090)).toFixed(1) + '\" style=\"fill:color-mix(in srgb, var(--accent) 12%, transparent)\"/>' +\n      lvl('be-e', 60000, 'Start · chart price 60,000', 'var(--second)') + lvl('be-f', 60060, 'Fees alone · +60', 'color-mix(in srgb, var(--accent) 80%, var(--second))', true) + lvl('be-b', 60090, 'All costs · +90 · break-even 60,090', 'var(--main)', true) +\n      '<path class=\"be-line\" fill=\"none\" stroke-width=\"5\" stroke-linejoin=\"round\" style=\"stroke:var(--second)\"/><circle class=\"be-dot\" r=\"10\" style=\"fill:var(--second)\"/>' +\n      '<text x=\"1000\" y=\"232\" class=\"fict\" style=\"fill:color-mix(in srgb, var(--second) 45%, var(--ground))\">BTC chart price in USDT · fictional</text></svg>' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:820px\"><p class=\"kick be-k\">How far must it move?</p>' +\n      '<h2 class=\"line be-t\">The break-even move</h2></div>' +\n      '<div class=\"glass be-def\" style=\"left:140px;top:340px;width:820px;padding:28px 36px\"><p class=\"def\" style=\"margin:0\">The <b>break-even move</b> is how far price must move in your favour just to cover all your costs.</p></div>' +\n      '<div class=\"glass be-w\" style=\"left:140px;top:340px;width:820px;padding:24px 36px\"><p class=\"mono\" style=\"margin:0;font-size:30px\">10 spread + 20 slippage + 60 fees</p>' +\n      '<p class=\"mono\" style=\"margin:12px 0 0;font-size:30px\">= <span style=\"color:var(--main)\">90 USDT per BTC</span> · 90 ÷ 60,000 = 0.15%</p></div>' +\n      '</div>'));\n    this.m = UI.meter(kit, 'be-m', 140, 560, 620, 'Net result · after all costs');\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.be-k').style; this.t = q('.be-t'); this.def = q('.be-def').style; this.w = q('.be-w').style;\n    this.zone = q('.be-zone').style; this.e = q('.be-e').style; this.f = q('.be-f').style; this.b = q('.be-b').style;\n    this.line = q('.be-line'); this.dot = q('.be-dot');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'confused' }, { t: 0.5, pose: 'explain' }, { t: 6.2, pose: 'candles' }, { t: 11.6, pose: 'point', flip: true }, { t: 15.0, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(this.def, t, 0.6, { out: 11.2 });\n    UI.rise(this.w, t, 11.7);\n    this.e.opacity = eo(seg(t, 0.8, 1.3));\n    this.f.opacity = eo(seg(t, 6.4, 6.9));\n    this.b.opacity = this.zone.opacity = eo(seg(t, 11.8, ar(--main) 55%, transparent)\">' + ticks + '</g>' +\n      '<circle r=\"200\" fill=\"none\" stroke=\"url(#tt-g)\" stroke-width=\"10\"/>' + pills + '</g></svg>' +\n      '<div class=\"words\" style=\"left:140px;top:250px;width:900px\"><p class=\"kick tt-k\">Phase 2 · Trading fundamentals</p>' +\n      '<h1 class=\"line tt-t\" style=\"font-size:112px\">Fees, spread and slippage</h1>' +\n      '<div class=\"rule tt-r\" style=\"width:260px\"></div>' +\n      '<p class=\"sub tt-s\">Lesson T09 · about 5 minutes</p></div>' +\n      '<p class=\"fict\" style=\"position:absolute;left:140px;bottom:80px;margin:0\">Education only · Not financial advice</p>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.tt-k').style; this.t = q('.tt-t'); this.r = q('.tt-r').style; this.s = q('.tt-s').style;\n    this.coin = q('.tt-coin'); this.ticks = q('.tt-ticks');\n    this.pills = [...kit.stage.querySelectorAll('.tt-pill')];\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: 2080, y: C.y, s: C.s }, { t: 2.6, x: C.x, y: C.y, s: C.s, d: 1.9, ease: (p) => kit.lerp(p, kit.eo(p), 0.5) }],\n      poses: [{ t: 0, pose: 'walk', flip: true }, { t: 2.6, pose: 'present' }],\n      says: [{ t0: 2.9, t1: 8.4, text: 'Small costs add up.' }],\n    });\n  },\n  render(t) {\n    this.k.opacity = eo(seg(t, -0.6, -0.1));\n    TextFx.fadeFromRight(this.t, t, -0.9);\n    this.r.transformOrigin = '0 50%';\n    this.r.transform = 'scaleX(' + eo(seg(t, 0.2, 0.9)) + ')';\n    this.s.opacity = eo(seg(t, 0.6, 1.1));\n    const c = seg(t, -0.6, 0.6);\n    this.coin.setAttribute('transform', 'translate(1340 ' + (470 - t * 2).toFixed(1) + ') scale(' + (lerp(0.9, 1, eob(c, 1.6)) * (1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.2))).toFixed(4) + ')');\n    this.coin.style.opacity = eo(c);\n    this.ticks.setAttribute('transform', 'rotate(' + (t * 6).toFixed(2) + ')');\n    const cur = Math.floor(Math.max(0, t - 1.2) / 1.6) % 3;\n    this.pills.forEach((g, i) => {\n      const p = seg(t, 0.3 + i * 0.25, 0.8 + i * 0.25);\n      const on = t > 1.2 && i === cur ? 1 : 0;\n      g.style.opacity = eo(p) * (0.55 + 0.45 * on);\n      g.querySelector('rect').style.stroke = on ? 'var(--main)' : 'color-mix(in srgb, var(--main) 45%, transparent)';\n      g.setAttribute('transform', 'translate(' + lerp(40, 0, eo(p)).toFixed(1) + ' ' + (-92 + i * 92) + ') scale(' + (on ? 1.06 : 1) + ')');\n    });\n    this.tutor.render(t);\n  },\n});\n","scene-try.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst TY_TILES = [['Gross', '+0.40', '40 × 0.01', 'var(--main)', 14.3], ['Fees', '−0.60', '0.30 + 0.30', 'var(--accent)', 15.8], ['Net', '−0.20', '0.40 − 0.60', 'var(--accent)', 17.4]];\nconst TY_CD = 7.4, TY_ANS = 14.1;\nkit.scene('try', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.ring = UI.ring(kit, 'ty-ring', 1500, 470);\n    let tiles = '';\n    TY_TILES.forEach((d, i) => {\n      tiles += '<div class=\"glass ty-tl\" style=\"left:' + (140 + i * 380) + 'px;top:560px;width:350px;padding:22px 28px\">' +\n        '<p class=\"kick\" style=\"margin:0 0 6px;color:' + d[3] + '\">' + d[0] + '</p>' +\n        '<div style=\"position:relative;height:64px\"><p class=\"mono ty-q\" style=\"position:absolute;margin:0;font-size:52px;color:color-mix(in srgb, var(--second) 40%, var(--ground))\">?</p>' +\n        '<p class=\"mono ty-a\" style=\"position:absolute;margin:0;font-size:48px;color:' + d[3] + '\">' + d[1] + ' <span style=\"font-size:28px\">USDT</span></p></div>' +\n        '<p class=\"mono ty-s\" style=\"margin:6px 0 0;font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">' + d[2] + '</p></div>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:1000px\"><p class=\"kick ty-k\">Your turn</p>' +\n      '<h2 class=\"line ty-t\">Pause and work it out</h2></div>' +\n      '<div class=\"glass ty-qc\" style=\"left:140px;top:330px;width:1110px;padding:26px 38px\"><p class=\"fict\" style=\"margin:0 0 10px\">Question · fictional prices · ignore spread and slippage</p>' +\n      '<p class=\"def\" style=\"margin:0\">Buy <b>0.01 BTC</b> at <b>60,000</b>, sell at <b>60,040</b>. Fees: <b>0.30 USDT</b> on each side. What are the gross and net results?</p></div>' +\n      tiles +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\">' + this.ring.html +\n      '<text class=\"ty-hint\" x=\"1500\" y=\"640\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 65%, var(--ground));font-size:28px\">Hint: net = gross − fees</text></svg>' +\n      '<div class=\"glass ty-w\" style=\"left:1330px;top:340px;width:400px;padding:26px 30px;border-color:var(--accent)\"><p class=\"kick\" style=\"margin:0 0 10px;color:var(--accent)\">Remember</p>' +\n      '<p style=\"margin:0;font-size:30px;line-height:1.35;font-weight:700\">A gross winner can be a net loser.</p></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.ty-k').style; this.t = q('.ty-t'); this.qc = q('.ty-qc').style; this.hint = q('.ty-hint').style; this.w = q('.ty-w').style;\n    this.tl = all('.ty-tl').map((e) => e.style); this.qs = all('.ty-q').map((e) => e.style); this.as = all('.ty-a').map((e) => e.style); this.ss = all('.ty-s').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.5, pose: 'present' }, { t: TY_CD, pose: 'think' }, { t: TY_ANS, pose: 'checklist' }, { t: 19.8, pose: 'calm' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(this.qc, t, 0.8);\n    this.tl.forEach((s, i) => {\n      UI.rise(s, t, 3.0 + i * 0.3);\n      const a = TY_TILES[i][4], p = seg(t, a, a + 0.5);\n      this.qs[i].opacity = 1 - eo(p);\n      this.as[i].opacity = eo(p); this.as[i].transform = 'scale(' + lerp(0.8, 1, eob(p, 1.7)) + ')'; this.as[i].transformOrigin = '0 50%';\n      this.ss[i].opacity = eo(seg(t, a + 0.4, a + 0.8));\n      s.borderColor = p > 0 ? 'color-mix(in srgb, ' + TY_TILES[i][3] + ' ' + (22 + 50 * eo(p)).toFixed(0) + '%, transparent)' : '';\n    });\n    const show = eo(seg(t, TY_CD - 0.6, TY_CD)) * (1 - ei(seg(t, TY_ANS - 0.6, TY_ANS - 0.2)));\n    this.ring.render(t, TY_CD, 5, show);\n    this.hint.opacity = eo(seg(t, 9.0, 9.5)) * (1 - ei(seg(t, TY_ANS - 0.6, TY_ANS - 0.2)));\n    UI.rise(this.w, t, 19.9);\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson nine\",\n      \"dur\": 9,\n      \"desc\": \"Title card: Phase 2, lesson T09, Fees, Spread and Slippage; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"A tiny win?\",\n      \"dur\": 17,\n      \"desc\": \"A small trade shows +0.80 USDT on the chart; three cost tags appear: fees, spread, slippage.\"\n    },\n    {\n      \"id\": \"fee\",\n      \"name\": \"Trading fees\",\n      \"dur\": 22,\n      \"desc\": \"Fee defined as a percentage of position value; 600 USDT at 0.05% costs 0.30 USDT on entry and on exit.\"\n    },\n    {\n      \"id\": \"maker\",\n      \"name\": \"Maker and taker\",\n      \"dur\": 22,\n      \"desc\": \"A taker order fills at once against the book; a maker order rests in it; example rates 0.05% and 0.02%.\"\n    },\n    {\n      \"id\": \"spread\",\n      \"name\": \"Spread\",\n      \"dur\": 20,\n      \"desc\": \"Best ask 60,005 and best bid 59,995: buying and selling at once loses the 10 USDT spread, 0.10 USDT on 0.01 BTC.\"\n    },\n    {\n      \"id\": \"slip\",\n      \"name\": \"Slippage\",\n      \"dur\": 17,\n      \"desc\": \"Expected and actual fill prices on entry and exit: 10 worse each way, 0.20 USDT on 0.01 BTC.\"\n    },\n    {\n      \"id\": \"funding\",\n      \"name\": \"Funding\",\n      \"dur\": 21,\n      \"desc\": \"Funding passes between longs and shorts each funding time; 0.01% on 600 USDT is 0.06 USDT.\"\n    },\n    {\n      \"id\": \"add\",\n      \"name\": \"Add it up\",\n      \"dur\": 25,\n      \"desc\": \"A waterfall: chart gain +0.80, minus spread, slippage and fees, ends at a net −0.10 USDT.\"\n    },\n    {\n      \"id\": \"breakeven\",\n      \"name\": \"Break-even move\",\n      \"dur\": 20,\n      \"desc\": \"Price must rise about 90 USDT per BTC (0.15%) before the trade makes anything; the net meter crosses zero.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"Common mistake\",\n      \"dur\": 18,\n      \"desc\": \"Twenty small trades stack 0.60 USDT of fees each into 12 USDT.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 24,\n      \"desc\": \"Pause and work out gross and net for a small trade; the answer +0.40 gross, −0.20 net is revealed.\"\n    },\n    {\n      \"id\": \"check\",\n      \"name\": \"Check first\",\n      \"dur\": 22,\n      \"desc\": \"A checklist of real costs ticks through; if the expected move is below break-even, NO_TRADE.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the limits\",\n      \"dur\": 22,\n      \"desc\": \"A model with example numbers; real rates vary; fees on full position value; slippage grows in fast markets.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 26,\n      \"desc\": \"Three key points and one question to check yourself.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: Phase 2 complete; next lesson T10, exchange platform tour.\"\n    }\n  ]\n}\n","score.js":"kit.score(function (S, T) {\n  // No voice: a soft pad and keys bed, a light pulse in the hands-on parts, quieter for the risk scenes.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.maker, T.funding) || inR(s, T.add, T.mistake) || inR(s, T.try, T.check);\n  const quiet = (s) => inR(s, T.mistake, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  [[T.title, 2.9], [T.hook, 6.8], [T.fee, 0.6], [T.fee, 7.5], [T.maker, 0.6], [T.maker, 8.1], [T.spread, 0.6], [T.spread, 5.4], [T.slip, 0.6], [T.funding, 0.6], [T.breakeven, 0.6], [T.mistake, 0.8], [T.next, 1.3]]\n    .forEach((b) => S.fx('pop', b[0] + b[1], { vel: 26, pitch: 7 }));\n  for (let i = 0; i < 3; i++) S.fx('thud', T.hook + 11.9 + i * 0.5, { vel: 26 });\n  for (let i = 0; i < 4; i++) S.fx('tick', T.fee + [1.4, 3.8, 14.4, 16.2][i], { vel: 28 });\n  S.fx('thud', T.fee + 18.4, { vel: 26 }); S.fx('thud', T.fee + 19.8, { vel: 26 });\n  S.fx('whoosh', T.maker + 2.9, { dur: 1.2, vel: 22 }); S.fx('ding', T.maker + 4.2, { vel: 32 }); S.fx('pop', T.maker + 9.0, { vel: 32 });\n  S.fx('ding', T.spread + 13.0, { vel: 30 }); S.fx('ding', T.spread + 14.4, { vel: 26 }); S.fx('thud', T.spread + 15.0, { vel: 26 });\n  S.fx('whoosh', T.slip + 6.4, { dur: 1.0, vel: 22 }); S.fx('whoosh', T.slip + 8.6, { dur: 1.0, vel: 22 }); S.fx('chime', T.slip + 12.2, { vel: 30 });\n  for (let i = 0; i < 4; i++) S.fx('tick', T.funding + 2.4 + i * 1.6, { vel: 22 });\n  S.fx('whoosh', T.funding + 9.0, { dur: 0.8, vel: 24 }); S.fx('chime', T.funding + 14.4, { vel: 30 });\n  for (let i = 0; i < 5; i++) S.fx(i ? 'thud' : 'pop', T.add + [4.3, 6.0, 7.7, 9.6, 13.2][i], { vel: i ? 28 : 34 });\n  S.fx('chime', T.add + 14.4, { vel: 30 });\n  S.fx('tick', T.breakeven + 10.2, { vel: 30 }); S.fx('ding', T.breakeven + 14.6, { vel: 38 });\n  S.fx('whoosh', T.mistake + 5.2, { dur: 0.6, vel: 24 });\n  for (let i = 0; i < 20; i++) S.fx('tick', T.mistake + 5.6 + i * 0.24, { vel: 20 });\n  S.fx('chime', T.mistake + 11.3, { vel: 30 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 7.4 + i, { vel: 30 });\n  S.fx('ding', T.try + 14.3, { vel: 34 }); S.fx('ding', T.try + 15.8, { vel: 30 }); S.fx('chime', T.try + 17.4, { vel: 40 });\n  for (let i = 0; i < 5; i++) S.fx('pop', T.check + [4.7, 6.8, 8.9, 11.4, 13.9][i], { vel: 30 });\n  S.fx('chime', T.check + 17.6, { vel: 36 });\n  for (let i = 0; i < 4; i++) S.fx('pop', T.risks + [0.8, 5.2, 11.6, 17.8][i], { vel: 28 });\n  for (let i = 0; i < 3; i++) S.fx('pop', T.recap + [2.9, 8.6, 11.9][i], { vel: 34 });\n  S.fx('ding', T.recap + 21.5, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 21, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T09 · Fees, spread and slippage',\n  TOTAL: 295,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n  // ── Lesson helpers (T07–T09) ──\n  // Set text only when it changes.\n  txt(el, s) { if (el.textContent !== s) el.textContent = s; },\n  // Fade and rise in at a (and fade out at o.out); returns the eased progress.\n  rise(st, t, a, o) {\n    o = o || {}; const K = UI.K, d = o.d == null ? 0.6 : o.d, dy = o.dy == null ? 30 : o.dy;\n    const p = K.seg(t, a, a + d), out = o.out == null ? 0 : K.ei(K.seg(t, o.out, o.out + 0.5));\n    st.opacity = (K.eo(K.seg(t, a, a + d * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + K.lerp(dy, 0, K.eo(p)).toFixed(2) + 'px) scale(' + K.lerp(o.s == null ? 0.96 : o.s, 1, K.eob(p, 1.5)).toFixed(4) + ')';\n    return p;\n  },\n  // Piecewise eased value through keys [[t, v], ...].\n  path(keys, t) {\n    const K = UI.K; let v = keys[0][1];\n    for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = K.lerp(a[1], b[1], K.eio(K.clamp01((t - a[0]) / (b[0] - a[0])))); }\n    return v;\n  },\n  // Countdown ring for \"try it\": returns {el (svg group html), render(t, t0, n)}.\n  ring(kit, cls, cx, cy) {\n    const R = 110, C = 2 * Math.PI * R;\n    const html = '<g class=\"' + cls + '\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + R + '\" fill=\"none\" stroke-width=\"14\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"' + cls + '-arc\" r=\"' + R + '\" fill=\"none\" stroke-width=\"14\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<text class=\"' + cls + '-n mono\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:84px\"></text></g>';\n    let arc, n, g;\n    return {\n      html,\n      render(t, t0, len, show) {\n        if (!g) { g = kit.stage.querySelector('.' + cls); arc = kit.stage.querySelector('.' + cls + '-arc'); n = kit.stage.querySelector('.' + cls + '-n'); }\n        g.style.opacity = show;\n        arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + len)).toFixed(1));\n        UI.txt(n, t < t0 ? String(len) : String(Math.max(0, Math.min(len, Math.ceil(len - (t - t0))))));\n      },\n    };\n  },\n  // A fictional order book: n ask rows over n bid rows. book.set(state) with\n  // state = {asks: [[price, qty, op?, hl?, tag?], ...] top to bottom, bids: same, spread: text, max: qty for a full bar}.\n  book(kit, cls, x, y, w, n, title) {\n    let rows = '';\n    const row = (side, i) => '<div class=\"' + cls + '-r\" data-s=\"' + side + '\" style=\"position:relative;display:flex;align-items:center;height:54px;padding:0 22px;border-radius:12px\">' +\n      '<span class=\"' + cls + '-bar\" style=\"position:absolute;right:0;top:6px;bottom:6px;border-radius:10px;background:color-mix(in srgb, ' + (side === 'a' ? 'var(--accent)' : 'var(--main)') + ' 20%, transparent)\"></span>' +\n      '<span class=\"mono ' + cls + '-p\" style=\"position:relative;flex:1;font-size:30px;color:' + (side === 'a' ? 'var(--accent)' : 'var(--main)') + '\"></span>' +\n      '<span class=\"' + cls + '-tag\" style=\"position:relative;margin-right:18px;padding:4px 14px;border-radius:999px;font-size:22px;font-weight:700;background:var(--second);color:var(--ground);opacity:0\"></span>' +\n      '<span class=\"mono ' + cls + '-q\" style=\"position:relative;width:120px;text-align:right;font-size:28px\"></span></div>';\n    for (let i = 0; i < n; i++) rows += row('a', i);\n    rows += '<div style=\"display:flex;align-items:center;justify-content:center;height:46px\"><span class=\"mono ' + cls + '-sp\" style=\"font-size:22px;color:color-mix(in srgb, var(--second) 60%, var(--ground))\"></span></div>';\n    for (let i = 0; i < n; i++) rows += row('b', i);\n    const el = kit.h('<div class=\"glass ' + cls + '\" style=\"left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;padding:22px 22px 18px\">' +\n      '<p class=\"fict\" style=\"margin:0 0 10px 22px\">' + (title || 'Order book · BTC/USDT · fictional') + '</p>' +\n      '<div style=\"display:flex;padding:0 22px 8px;font-size:22px;color:color-mix(in srgb, var(--second) 55%, var(--ground))\"><span style=\"flex:1\">Price (USDT)</span><span>Amount (BTC)</span></div>' + rows + '</div>');\n    kit.stage.append(el);\n    const all = (s) => [...el.querySelectorAll(s)];\n    const R = all('.' + cls + '-r'), P = all('.' + cls + '-p'), Q = all('.' + cls + '-q'), B = all('.' + cls + '-bar'), G = all('.' + cls + '-tag');\n    const sp = el.querySelector('.' + cls + '-sp');\n    return {\n      el, st: el.style, rows: R,\n      set(s) {\n        const list = s.asks.concat(s.bids), max = s.max || 0.02;\n        list.forEach((r, i) => {\n          if (!R[i]) return;\n          UI.txt(P[i], r[0] == null ? '' : UI.fmt(r[0]));\n          UI.txt(Q[i], r[1] == null ? '' : r[1].toFixed(3));\n          B[i].style.width = (Math.min(1, (r[1] || 0) / max) * 70).toFixed(1) + '%';\n          R[i].style.opacity = r[2] == null ? 1 : r[2];\n          const hl = r[3] || 0;\n          R[i].style.background = 'color-mix(in srgb, var(--second) ' + (hl * 14).toFixed(1) + '%, transparent)';\n          R[i].style.outline = hl > 0.02 ? '2px solid color-mix(in srgb, var(--second) ' + (hl * 70).toFixed(0) + '%, transparent)' : 'none';\n          UI.txt(G[i], r[4] || ''); G[i].style.opacity = r[4] ? 1 : 0;\n        });\n        UI.txt(sp, s.spread || '');\n      },\n    };\n  },\n  // Price grid for a chart: horizontal lines with price labels to the right of x1.\n  grid(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (+y + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Polyline of a price function f(s) for s in [s0, s1], mapped with xOf and yOf.\n  line(f, s0, s1, xOf, yOf, dt) {\n    let d = '';\n    for (let s = s0; s <= s1 + 1e-6; s += dt || 0.05) d += (d ? 'L' : 'M') + xOf(s).toFixed(1) + ' ' + yOf(f(s)).toFixed(1);\n    return d || 'M0 0';\n  },\n  // PnL meter card: label, value counting, a bar from the middle (+ right / − left).\n  meter(kit, cls, x, y, w, label) {\n    const el = kit.h('<div class=\"glass ' + cls + '\" style=\"left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;padding:22px 30px\">' +\n      '<p class=\"fict\" style=\"margin:0 0 6px\">' + label + '</p><p class=\"mono ' + cls + '-v\" style=\"margin:0;font-size:52px\"></p>' +\n      '<div style=\"position:relative;height:16px;margin-top:14px;border-radius:8px;background:color-mix(in srgb, var(--second) 8%, transparent)\"><span style=\"position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;background:color-mix(in srgb, var(--second) 40%, transparent)\"></span><span class=\"' + cls + '-b\" style=\"position:absolute;top:0;bottom:0;border-radius:8px\"></span></div></div>');\n    kit.stage.append(el);\n    const v = el.querySelector('.' + cls + '-v'), b = el.querySelector('.' + cls + '-b').style;\n    return {\n      st: el.style,\n      set(val, full, unit) {\n        const c = val >= 0 ? 'var(--main)' : 'var(--accent)';\n        UI.txt(v, (val > 0.004 ? '+' : val < -0.004 ? '−' : '') + Math.abs(val).toFixed(2) + ' ' + (unit || 'USDT'));\n        v.style.color = Math.abs(val) < 0.005 ? 'var(--second)' : c;\n        const f = Math.min(1, Math.abs(val) / full) * 50;\n        b.left = (val >= 0 ? 50 : 50 - f).toFixed(2) + '%'; b.width = f.toFixed(2) + '%'; b.background = c;\n      },\n    };\n  },\n};\nUI.K = kit;\n","tutor.json":"{\n  \"idle\": {\n    \"w\": 331,\n    \"h\": 446,\n    \"ax\": 164.5,\n    \"feet\": 432,\n    \"bw\": 305\n  },\n  \"present\": {\n    \"w\": 546,\n    \"h\": 612,\n    \"ax\": 218,\n    \"feet\": 605,\n    \"bw\": 421\n  },\n  \"checklist\": {\n    \"w\": 185,\n    \"h\": 161,\n    \"ax\": 97.5,\n    \"feet\": 153,\n    \"bw\": 138\n  },\n  \"confused\": {\n    \"w\": 185,\n    \"h\": 169,\n    \"ax\": 85,\n    \"feet\": 162,\n    \"bw\": 138\n  },\n  \"explain\": {\n    \"w\": 502,\n    \"h\": 602,\n    \"ax\": 275,\n    \"feet\": 594,\n    \"bw\": 394\n  },\n  \"candles\": {\n    \"w\": 257,\n    \"h\": 160,\n    \"ax\": 70.5,\n    \"feet\": 151,\n    \"bw\": 138\n  },\n  \"point\": {\n    \"w\": 547,\n    \"h\": 568,\n    \"ax\": 210,\n    \"feet\": 561,\n    \"bw\": 415\n  },\n  \"thumbs\": {\n    \"w\": 181,\n    \"h\": 179,\n    \"ax\": 102,\n    \"feet\": 172,\n    \"bw\": 138\n  },\n  \"think\": {\n    \"w\": 465,\n    \"h\": 656,\n    \"ax\": 229,\n    \"feet\": 648,\n    \"bw\": 452\n  },\n  \"calm\": {\n    \"w\": 234,\n    \"h\": 174,\n    \"ax\": 111,\n    \"feet\": 167,\n    \"bw\": 138\n  },\n  \"idea\": {\n    \"w\": 169,\n    \"h\": 178,\n    \"ax\": 69.5,\n    \"feet\": 171,\n    \"bw\": 138\n  },\n  \"magnify\": {\n    \"w\": 187,\n    \"h\": 170,\n    \"ax\": 85.5,\n    \"feet\": 163,\n    \"bw\": 138\n  },\n  \"cheer\": {\n    \"w\": 207,\n    \"h\": 182,\n
