<script>window.FILM = {"id":"T12","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson twelve","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"Same move, different results","dur":20,"k":1,"oldStart":8,"oldDur":20},{"id":"margin","name":"Margin is a deposit","dur":20,"k":1,"oldStart":28,"oldDur":20},{"id":"notional","name":"Notional exposure","dur":18,"k":1,"oldStart":48,"oldDur":18},{"id":"leverage","name":"Leverage","dur":24,"k":1,"oldStart":66,"oldDur":24},{"id":"path","name":"One path, three leverages","dur":27,"k":1,"oldStart":90,"oldDur":27},{"id":"example","name":"Worked example","dur":21,"k":1,"oldStart":117,"oldDur":21},{"id":"both","name":"Both directions","dur":22,"k":1,"oldStart":138,"oldDur":22},{"id":"maint","name":"Maintenance margin","dur":21,"k":1,"oldStart":160,"oldDur":21},{"id":"modes","name":"Isolated and cross","dur":28,"k":1,"oldStart":181,"oldDur":28},{"id":"mistake","name":"Common mistake","dur":18,"k":1,"oldStart":209,"oldDur":18},{"id":"try","name":"Try it","dur":23,"k":1,"oldStart":227,"oldDur":23},{"id":"risks","name":"Know the risks","dur":26,"k":1,"oldStart":250,"oldDur":26},{"id":"recap","name":"Recap","dur":25,"k":1,"oldStart":276,"oldDur":25},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":301,"oldDur":10}],"voice":{"src":null,"lines":[{"t":0.6,"d":7.15,"text":"Lesson twelve: margin and leverage. Why small price moves can feel very big.","ml":"പന്ത്രണ്ടാം പാഠം: margin-ഉം leverage-ഉം. ചെറിയ വിലമാറ്റങ്ങൾ എന്തുകൊണ്ട് വളരെ വലുതായി തോന്നുന്നു എന്ന് നോക്കാം."},{"t":8.4,"d":4.65,"text":"Two traders each put 100 USDT into the same BTC futures trade.","ml":"രണ്ട് ട്രേഡർമാർ ഒരേ BTC futures ട്രേഡിൽ 100 USDT വീതം ഇടുന്നു."},{"t":13.3,"d":4.65,"text":"BTC rises 2%. Trader A gains 2 USDT. Trader B gains 20 USDT.","ml":"BTC 2% ഉയരുന്നു. ട്രേഡർ A-ക്ക് 2 USDT ലാഭം. ട്രേഡർ B-ക്ക് 20 USDT ലാഭം."},{"t":18.2,"d":4.55,"text":"Then BTC falls to 2% below the start. A loses 2. B loses 20.","ml":"പിന്നെ BTC തുടക്കത്തേക്കാൾ 2% താഴേക്ക് വീഴുന്നു. A-ക്ക് 2 നഷ്ടം. B-ക്ക് 20 നഷ്ടം."},{"t":23,"d":4.75,"text":"Same coin, same move. What made the difference? Leverage.","ml":"ഒരേ കോയിൻ, ഒരേ മാറ്റം. പിന്നെ എന്താണ് വ്യത്യാസം ഉണ്ടാക്കിയത്? Leverage."},{"t":28.4,"d":6.45,"text":"First word: margin. Initial margin is the money you set aside to open a futures position.","ml":"ആദ്യത്തെ വാക്ക്: margin. ഒരു futures പൊസിഷൻ തുറക്കാൻ നിങ്ങൾ മാറ്റിവെക്കുന്ന പണമാണ് initial margin."},{"t":35.1,"d":5.85,"text":"Your futures wallet holds 500 USDT. You lock 100 USDT as margin. 400 stays free.","ml":"നിങ്ങളുടെ futures വാലറ്റിൽ 500 USDT ഉണ്ട്. 100 USDT margin ആയി ലോക്ക് ചെയ്യുന്നു. 400 ഉപയോഗിക്കാതെ ബാക്കിയുണ്ട്."},{"t":41.2,"d":6.55,"text":"Think of a deposit on a rented car. Any damage comes out of that deposit.","ml":"വാടകയ്ക്കെടുത്ത കാറിന് കൊടുക്കുന്ന ഡെപ്പോസിറ്റ് പോലെ കരുതുക. എന്ത് കേടുപാടും ആ ഡെപ്പോസിറ്റിൽ നിന്നാണ് പോകുന്നത്."},{"t":48.4,"d":5.35,"text":"Next: notional exposure. That's the full value of the position, in USDT.","ml":"അടുത്തത്: notional exposure. അത് പൊസിഷന്റെ മുഴുവൻ മൂല്യമാണ്, USDT-യിൽ."},{"t":54,"d":5.05,"text":"With 100 USDT of margin, you could hold a position worth 1,000 USDT.","ml":"100 USDT margin കൊണ്ട് 1,000 USDT മൂല്യമുള്ള ഒരു പൊസിഷൻ പിടിക്കാം."},{"t":59.3,"d":6.45,"text":"Price moves act on the full 1,000 USDT, not just on your 100.","ml":"വിലമാറ്റം ബാധിക്കുന്നത് മുഴുവൻ 1,000 USDT-യെയുമാണ്, നിങ്ങളുടെ 100-നെ മാത്രമല്ല."},{"t":66.4,"d":5.05,"text":"Leverage is how many times bigger the position is than your margin.","ml":"പൊസിഷൻ margin-ന്റെ എത്ര മടങ്ങ് വലുതാണ് എന്നതാണ് leverage."},{"t":71.7,"d":5.55,"text":"At 1x, 100 USDT of margin holds 100 of notional. At 3x, 300. At 10x, 1,000.","ml":"1x-ൽ 100 USDT margin 100 notional പിടിക്കും. 3x-ൽ 300. 10x-ൽ 1,000."},{"t":77.5,"d":5.65,"text":"So notional is roughly margin times leverage. Your 100 USDT does not change.","ml":"അതായത് notional ഏകദേശം margin ഗുണം leverage ആണ്. നിങ്ങളുടെ 100 USDT മാറുന്നില്ല."},{"t":83.4,"d":6.35,"text":"Leverage is like a magnifying glass. It enlarges every move, good and bad.","ml":"Leverage ഒരു ഭൂതക്കണ്ണാടി പോലെയാണ്. നല്ലതും ചീത്തയുമായ എല്ലാ മാറ്റങ്ങളും അത് വലുതാക്കും."},{"t":90.4,"d":5.65,"text":"Now one price path, three ways. Each trader is long with 100 USDT of margin.","ml":"ഇനി ഒരേ വിലപ്പാത, മൂന്ന് രീതിയിൽ. ഓരോ ട്രേഡറും 100 USDT margin-ൽ long ആണ്."},{"t":96.3,"d":5.65,"text":"BTC rises 2%, to 61,200. 1x makes 2 USDT. 3x makes 6. 10x makes 20.","ml":"BTC 2% ഉയർന്ന് 61,200-ൽ എത്തുന്നു. 1x-ന് 2 USDT ലാഭം. 3x-ന് 6. 10x-ന് 20."},{"t":102.2,"d":6.95,"text":"Then it falls to 58,800, 2% below the start. Now 1x loses 2, 3x loses 6, 10x loses 20.","ml":"പിന്നെ 58,800-ലേക്ക് വീഴുന്നു, തുടക്കത്തേക്കാൾ 2% താഴെ. ഇപ്പോൾ 1x-ന് 2 നഷ്ടം, 3x-ന് 6, 10x-ന് 20."},{"t":109.4,"d":7.35,"text":"The market moved the same for all three. Leverage only changed the size of the result.","ml":"മൂന്നുപേർക്കും മാർക്കറ്റ് ഒരുപോലെയാണ് നീങ്ങിയത്. Leverage ഫലത്തിന്റെ വലിപ്പം മാത്രമാണ് മാറ്റിയത്."},{"t":117.4,"d":5.95,"text":"A worked example. Gross PnL is about notional times the signed percentage move.","ml":"ഒരു ഉദാഹരണം നോക്കാം. Gross PnL ഏകദേശം notional ഗുണം, പ്ലസ്/മൈനസ് ചിഹ്നമുള്ള ശതമാനമാറ്റം ആണ്."},{"t":123.6,"d":5.05,"text":"1,000 USDT times minus 2% is minus 20 USDT, before fees and funding.","ml":"1,000 USDT ഗുണം മൈനസ് 2% എന്നാൽ മൈനസ് 20 USDT, ഫീസും funding-ഉം കൂട്ടാതെ."},{"t":128.9,"d":4.15,"text":"Divide by your margin: minus 20 over 100 is minus 20%.","ml":"അത് നിങ്ങളുടെ margin കൊണ്ട് ഹരിക്കുക: മൈനസ് 20-നെ 100 കൊണ്ട് ഹരിച്ചാൽ മൈനസ് 20%."},{"t":133.3,"d":4.45,"text":"A 2% price move became 20% of your money.","ml":"2% വിലമാറ്റം നിങ്ങളുടെ പണത്തിന്റെ 20% ആയി മാറി."},{"t":138.4,"d":3.85,"text":"This works in both directions. Say BTC falls 10%.","ml":"ഇത് രണ്ട് ദിശയിലും പ്രവർത്തിക്കും. BTC 10% വീഴുന്നു എന്ന് കരുതുക."},{"t":142.5,"d":6.85,"text":"At 1x, you lose 10 USDT, 10% of your margin. At 10x, you lose 100 USDT: all of it, on paper.","ml":"1x-ൽ 10 USDT നഷ്ടം, margin-ന്റെ 10%. 10x-ൽ 100 USDT നഷ്ടം: മുഴുവനും, കണക്കിൽ."},{"t":149.6,"d":6.05,"text":"In reality, the exchange closes the position before that point. That's liquidation.","ml":"യഥാർത്ഥത്തിൽ, അതിനുമുമ്പേ exchange പൊസിഷൻ ക്ലോസ് ചെയ്യും. അതാണ് liquidation."},{"t":155.9,"d":3.85,"text":"Where exactly depends on its rules and costs.","ml":"കൃത്യമായി എവിടെ എന്നത് exchange-ന്റെ നിയമങ്ങളെയും ചെലവുകളെയും ആശ്രയിച്ചിരിക്കും."},{"t":160.4,"d":5.85,"text":"Maintenance margin is the minimum the exchange needs to keep your position open.","ml":"പൊസിഷൻ തുറന്നുവെക്കാൻ exchange-ന് വേണ്ട ഏറ്റവും കുറഞ്ഞ തുകയാണ് maintenance margin."},{"t":166.5,"d":6.25,"text":"Your margin balance is your margin plus any open profit or loss. Losses push it down.","ml":"നിങ്ങളുടെ margin-ഉം തുറന്ന ലാഭമോ നഷ്ടമോ ചേർന്നതാണ് margin balance. നഷ്ടം അതിനെ താഴ്ത്തും."},{"t":173,"d":7.75,"text":"Fall to the maintenance level, and the exchange can close the position. Its rules set the level.","ml":"അത് maintenance ലെവലിലേക്ക് താഴ്ന്നാൽ, exchange-ന് പൊസിഷൻ ക്ലോസ് ചെയ്യാം. ആ ലെവൽ അതിന്റെ നിയമങ്ങളാണ് തീരുമാനിക്കുന്നത്."},{"t":181.4,"d":3.85,"text":"You also choose a margin mode: isolated or cross.","ml":"നിങ്ങൾ ഒരു margin mode-ഉം തിരഞ്ഞെടുക്കണം: isolated അല്ലെങ്കിൽ cross."},{"t":185.5,"d":5.85,"text":"Isolated: losses on that position generally stay within the margin you gave it.","ml":"Isolated: ആ പൊസിഷനിലെ നഷ്ടം സാധാരണയായി അതിന് നൽകിയ margin-നുള്ളിൽ നിൽക്കും."},{"t":191.6,"d":5.45,"text":"Like a separate envelope of cash. The other 400 USDT is not touched by it.","ml":"പണം വെച്ച ഒരു വേറിട്ട കവർ പോലെ. ബാക്കി 400 USDT-യെ അത് തൊടില്ല."},{"t":197.3,"d":6.15,"text":"Cross: your whole futures balance backs your positions. One loss can reach far more.","ml":"Cross: നിങ്ങളുടെ മുഴുവൻ futures ബാലൻസും പൊസിഷനുകൾക്ക് പിന്നിൽ നിൽക്കുന്നു. ഒരു നഷ്ടം അതിലും വളരെ കൂടുതൽ പണത്തിലേക്ക് എത്താം."},{"t":203.7,"d":5.05,"text":"Neither mode is safe. They decide how far a loss can reach.","ml":"ഒരു mode-ഉം സുരക്ഷിതമല്ല. ഒരു നഷ്ടം എത്ര ദൂരം എത്താം എന്ന് മാത്രമാണ് അവ തീരുമാനിക്കുന്നത്."},{"t":209.4,"d":4.25,"text":"A common mistake: thinking leverage is free extra money.","ml":"ഒരു സാധാരണ തെറ്റ്: leverage സൗജന്യമായി കിട്ടുന്ന അധിക പണമാണെന്ന് കരുതുന്നത്."},{"t":213.9,"d":5.65,"text":"It isn't. It's extra exposure. Losses on the full 1,000 come out of your 100.","ml":"അല്ല. അത് അധിക exposure ആണ്. മുഴുവൻ 1,000-ലെ നഷ്ടവും നിങ്ങളുടെ 100-ൽ നിന്നാണ് പോകുന്നത്."},{"t":219.8,"d":6.95,"text":"And no leverage number is safe. Lower leverage only means smaller swings.","ml":"ഒരു leverage നമ്പറും സുരക്ഷിതമല്ല. കുറഞ്ഞ leverage എന്നാൽ ചെറിയ ചാഞ്ചാട്ടങ്ങൾ എന്ന് മാത്രം."},{"t":227.4,"d":8.35,"text":"Your turn. Margin 50 USDT, 5x, long. BTC rises 4%. Find the notional, the PnL and the % of margin.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. Margin 50 USDT, 5x, long. BTC 4% ഉയരുന്നു. Notional, PnL, margin-ന്റെ % എന്നിവ കണ്ടെത്തുക."},{"t":236,"d":5.35,"text":"Notional: 50 times 5 is 250 USDT. PnL: 250 times 4% is plus 10 USDT.","ml":"Notional: 50 ഗുണം 5 = 250 USDT. PnL: 250 ഗുണം 4% = പ്ലസ് 10 USDT."},{"t":241.6,"d":5.35,"text":"That's 20% of your margin. Had BTC fallen 4%, it would be minus 10 USDT.","ml":"അത് നിങ്ങളുടെ margin-ന്റെ 20% ആണ്. BTC 4% വീണിരുന്നെങ്കിൽ, മൈനസ് 10 USDT ആയേനെ."},{"t":247.2,"d":2.55,"text":"Did you get it? Well done.","ml":"ശരിയായോ? നന്നായി."},{"t":250.4,"d":3.05,"text":"Before you go further, know the risks.","ml":"മുന്നോട്ട് പോകും മുമ്പ്, റിസ്കുകൾ അറിയുക."},{"t":253.7,"d":3.75,"text":"Leverage magnifies losses just as much as gains.","ml":"Leverage ലാഭം പോലെ തന്നെ നഷ്ടവും വലുതാക്കും."},{"t":257.7,"d":6.55,"text":"If losses eat your margin, the exchange can close your position. More on that next lesson.","ml":"നഷ്ടം നിങ്ങളുടെ margin തിന്നുതീർത്താൽ, exchange-ന് പൊസിഷൻ ക്ലോസ് ചെയ്യാം. അടുത്ത പാഠത്തിൽ കൂടുതൽ."},{"t":264.5,"d":5.45,"text":"Fees and funding are charged on the notional, so they grow with leverage.","ml":"ഫീസും funding-ഉം notional-ൽ ആണ് ഈടാക്കുന്നത്, അതുകൊണ്ട് leverage കൂടുമ്പോൾ അവയും കൂടും."},{"t":270.2,"d":5.55,"text":"There is no safe leverage. And you can always choose WAIT, or no trade.","ml":"സുരക്ഷിതമായ leverage ഇല്ല. എപ്പോഴും WAIT, അല്ലെങ്കിൽ ട്രേഡ് വേണ്ട എന്ന് തിരഞ്ഞെടുക്കാം."},{"t":276.4,"d":1.35,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":278,"d":3.25,"text":"Notional is about margin times leverage.","ml":"Notional ഏകദേശം margin ഗുണം leverage ആണ്."},{"t":281.5,"d":4.75,"text":"Gross PnL is about notional times the signed move, before fees.","ml":"Gross PnL ഏകദേശം notional ഗുണം ചിഹ്നമുള്ള വിലമാറ്റം ആണ്, ഫീസിന് മുമ്പ്."},{"t":286.5,"d":4.75,"text":"Leverage magnifies gains and losses alike. No leverage is safe.","ml":"Leverage ലാഭവും നഷ്ടവും ഒരുപോലെ വലുതാക്കും. ഒരു leverage-ഉം സുരക്ഷിതമല്ല."},{"t":291.5,"d":5.35,"text":"Check yourself: 100 USDT of margin at 10x. BTC falls 3%. What's the PnL?","ml":"സ്വയം പരിശോധിക്കൂ: 100 USDT margin, 10x. BTC 3% വീഴുന്നു. PnL എത്ര?"},{"t":297.1,"d":3.65,"text":"Minus 30 USDT, which is 30% of your margin.","ml":"മൈനസ് 30 USDT, അതായത് നിങ്ങളുടെ margin-ന്റെ 30%."},{"t":301.8,"d":8.95,"text":"Next up, T13: liquidation, funding and futures risks. See you there!","ml":"അടുത്തത് T13: liquidation, funding, futures റിസ്കുകൾ. അവിടെ കാണാം!"}]},"assetBase":"T12/assets/","assets":{"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-writing.webp":{"mime":"image/webp","w":191,"h":169},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n","narration.json":"{\n  \"about\": \"T12 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson twelve: margin and leverage. Why small price moves can feel very big.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"Two traders each put 100 USDT into the same BTC futures trade.\"\n    },\n    {\n      \"t\": 13.3,\n      \"text\": \"BTC rises 2%. Trader A gains 2 USDT. Trader B gains 20 USDT.\"\n    },\n    {\n      \"t\": 18.2,\n      \"text\": \"Then BTC falls to 2% below the start. A loses 2. B loses 20.\"\n    },\n    {\n      \"t\": 23.0,\n      \"text\": \"Same coin, same move. What made the difference? Leverage.\"\n    },\n    {\n      \"t\": 28.4,\n      \"text\": \"First word: margin. Initial margin is the money you set aside to open a futures position.\"\n    },\n    {\n      \"t\": 35.1,\n      \"text\": \"Your futures wallet holds 500 USDT. You lock 100 USDT as margin. 400 stays free.\"\n    },\n    {\n      \"t\": 41.2,\n      \"text\": \"Think of a deposit on a rented car. Any damage comes out of that deposit.\"\n    },\n    {\n      \"t\": 48.4,\n      \"text\": \"Next: notional exposure. That's the full value of the position, in USDT.\"\n    },\n    {\n      \"t\": 54.0,\n      \"text\": \"With 100 USDT of margin, you could hold a position worth 1,000 USDT.\"\n    },\n    {\n      \"t\": 59.3,\n      \"text\": \"Price moves act on the full 1,000 USDT, not just on your 100.\"\n    },\n    {\n      \"t\": 66.4,\n      \"text\": \"Leverage is how many times bigger the position is than your margin.\"\n    },\n    {\n      \"t\": 71.7,\n      \"text\": \"At 1x, 100 USDT of margin holds 100 of notional. At 3x, 300. At 10x, 1,000.\"\n    },\n    {\n      \"t\": 77.5,\n      \"text\": \"So notional is roughly margin times leverage. Your 100 USDT does not change.\"\n    },\n    {\n      \"t\": 83.4,\n      \"text\": \"Leverage is like a magnifying glass. It enlarges every move, good and bad.\"\n    },\n    {\n      \"t\": 90.4,\n      \"text\": \"Now one price path, three ways. Each trader is long with 100 USDT of margin.\"\n    },\n    {\n      \"t\": 96.3,\n      \"text\": \"BTC rises 2%, to 61,200. 1x makes 2 USDT. 3x makes 6. 10x makes 20.\"\n    },\n    {\n      \"t\": 102.2,\n      \"text\": \"Then it falls to 58,800, 2% below the start. Now 1x loses 2, 3x loses 6, 10x loses 20.\"\n    },\n    {\n      \"t\": 109.4,\n      \"text\": \"The market moved the same for all three. Leverage only changed the size of the result.\"\n    },\n    {\n      \"t\": 117.4,\n      \"text\": \"A worked example. Gross PnL is about notional times the signed percentage move.\"\n    },\n    {\n      \"t\": 123.6,\n      \"text\": \"1,000 USDT times minus 2% is minus 20 USDT, before fees and funding.\"\n    },\n    {\n      \"t\": 128.9,\n      \"text\": \"Divide by your margin: minus 20 over 100 is minus 20%.\"\n    },\n    {\n      \"t\": 133.3,\n      \"text\": \"A 2% price move became 20% of your money.\"\n    },\n    {\n      \"t\": 138.4,\n      \"text\": \"This works in both directions. Say BTC falls 10%.\"\n    },\n    {\n      \"t\": 142.5,\n      \"text\": \"At 1x, you lose 10 USDT, 10% of your margin. At 10x, you lose 100 USDT: all of it, on paper.\"\n    },\n    {\n      \"t\": 149.6,\n      \"text\": \"In reality, the exchange closes the position before that point. That's liquidation.\"\n    },\n    {\n      \"t\": 155.9,\n      \"text\": \"Where exactly depends on its rules and costs.\"\n    },\n    {\n      \"t\": 160.4,\n      \"text\": \"Maintenance margin is the minimum the exchange needs to keep your position open.\"\n    },\n    {\n      \"t\": 166.5,\n      \"text\": \"Your margin balance is your margin plus any open profit or loss. Losses push it down.\"\n    },\n    {\n      \"t\": 173.0,\n      \"text\": \"Fall to the maintenance level, and the exchange can close the position. Its rules set the level.\"\n    },\n    {\n      \"t\": 181.4,\n      \"text\": \"You also choose a margin mode: isolated or cross.\"\n    },\n    {\n      \"t\": 185.5,\n      \"text\": \"Isolated: losses on that position generally stay within the margin you gave it.\"\n    },\n    {\n      \"t\": 191.6,\n      \"text\": \"Like a separate envelope of cash. The other 400 USDT is not touched by it.\"\n    },\n    {\n      \"t\": 197.3,\n      \"text\": \"Cross: your whole futures balance backs your positions. One loss can reach far more.\"\n    },\n    {\n      \"t\": 203.7,\n      \"text\": \"Neither mode is safe. They decide how far a loss can reach.\"\n    },\n    {\n      \"t\": 209.4,\n      \"text\": \"A common mistake: thinking leverage is free extra money.\"\n    },\n    {\n      \"t\": 213.9,\n      \"text\": \"It isn't. It's extra exposure. Losses on the full 1,000 come out of your 100.\"\n    },\n    {\n      \"t\": 219.8,\n      \"text\": \"And no leverage number is safe. Lower leverage only means smaller swings.\"\n    },\n    {\n      \"t\": 227.4,\n      \"text\": \"Your turn. Margin 50 USDT, 5x, long. BTC rises 4%. Find the notional, the PnL and the % of margin.\"\n    },\n    {\n      \"t\": 236.0,\n      \"text\": \"Notional: 50 times 5 is 250 USDT. PnL: 250 times 4% is plus 10 USDT.\"\n    },\n    {\n      \"t\": 241.6,\n      \"text\": \"That's 20% of your margin. Had BTC fallen 4%, it would be minus 10 USDT.\"\n    },\n    {\n      \"t\": 247.2,\n      \"text\": \"Did you get it? Well done.\"\n    },\n    {\n      \"t\": 250.4,\n      \"text\": \"Before you go further, know the risks.\"\n    },\n    {\n      \"t\": 253.7,\n      \"text\": \"Leverage magnifies losses just as much as gains.\"\n    },\n    {\n      \"t\": 257.7,\n      \"text\": \"If losses eat your margin, the exchange can close your position. More on that next lesson.\"\n    },\n    {\n      \"t\": 264.5,\n      \"text\": \"Fees and funding are charged on the notional, so they grow with leverage.\"\n    },\n    {\n      \"t\": 270.2,\n      \"text\": \"There is no safe leverage. And you can always choose WAIT, or no trade.\"\n    },\n    {\n      \"t\": 276.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 278.0,\n      \"text\": \"Notional is about margin times leverage.\"\n    },\n    {\n      \"t\": 281.5,\n      \"text\": \"Gross PnL is about notional times the signed move, before fees.\"\n    },\n    {\n      \"t\": 286.5,\n      \"text\": \"Leverage magnifies gains and losses alike. No leverage is safe.\"\n    },\n    {\n      \"t\": 291.5,\n      \"text\": \"Check yourself: 100 USDT of margin at 10x. BTC falls 3%. What's the PnL?\"\n    },\n    {\n      \"t\": 297.1,\n      \"text\": \"Minus 30 USDT, which is 30% of your margin.\"\n    },\n    {\n      \"t\": 301.8,\n      \"text\": \"Next up, T13: liquidation, funding and futures risks. See you there!\"\n    }\n  ]\n}","scene-both.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// BTC falls 10% (fictional): 60,000 → 54,000. Margin 100 USDT in both cases.\nkit.scene('both', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const row = (cls, lev, notional) => '<div class=\"glass ' + cls + '\" style=\"position:relative;width:960px;height:150px;padding:18px 30px\">' +\n      '<div style=\"display:flex;align-items:baseline;gap:16px\"><span class=\"chip mono\" style=\"font-size:28px;padding:6px 20px\">' + lev + '</span><span style=\"font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">notional <span class=\"mono\" style=\"color:var(--second)\">' + notional + ' USDT</span></span>' +\n      '<span style=\"margin-left:auto;font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">loss</span><span class=\"mono ' + cls + '-l\" style=\"font-size:40px;color:var(--accent)\">0</span></div>' +\n      '<div style=\"position:absolute;left:30px;right:200px;bottom:26px;height:34px;border-radius:10px;border:2px dashed color-mix(in srgb, var(--second) 25%, transparent)\"><div class=\"' + cls + '-f\" style=\"position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--main)\"></div></div>' +\n      '<span class=\"mono ' + cls + '-v\" style=\"position:absolute;right:30px;bottom:24px;font-size:30px\">100 left</span></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:960px\"><p class=\"kick bo-k\" style=\"color:var(--accent)\">Both directions</p>' +\n      '<h2 class=\"line bo-t\" style=\"font-size:72px\">A bigger fall, magnified</h2></div>' +\n      '<div class=\"glass bo-px\" style=\"left:1180px;top:160px;width:600px;padding:22px 30px\"><p class=\"fict\" style=\"margin:0 0 6px\">BTC price · fictional</p>' +\n      '<p style=\"margin:0;display:flex;align-items:baseline;gap:18px\"><span class=\"mono bo-p\" style=\"font-size:52px\">60,000</span><span class=\"mono bo-c\" style=\"font-size:30px;color:var(--accent)\"></span></p></div>' +\n      '<div style=\"position:absolute;left:140px;top:350px;display:flex;flex-direction:column;gap:20px\">' + row('bo-a', '1x', '100') + row('bo-b', '10x', '1,000') + '</div>' +\n      '<p class=\"kick bo-n\" style=\"position:absolute;left:140px;top:700px;margin:0;font-size:20px;color:color-mix(in srgb, var(--second) 55%, var(--ground))\">Bar = margin left, on paper · before fees</p>' +\n      '<div class=\"glass bo-liq\" style=\"left:1180px;top:350px;width:600px;padding:24px 32px;border-color:var(--accent)\"><p class=\"kick\" style=\"margin:0 0 10px;color:var(--accent)\">In reality · liquidation</p>' +\n      '<p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">The exchange closes the position <b style=\"color:var(--accent)\">before</b> your margin reaches zero.</p>' +\n      '<p class=\"bo-rule\" style=\"margin:14px 0 0;font-size:28px;line-height:1.4;font-weight:600;border-radius:10px\">Exactly where depends on its rules, fees and position size. More in T13.</p></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.bo-k').style; this.t = q('.bo-t'); this.px = q('.bo-px').style; this.p = q('.bo-p'); this.c = q('.bo-c');\n    this.rows = [q('.bo-a').style, q('.bo-b').style]; this.n = q('.bo-n').style;\n    this.l = [q('.bo-a-l'), q('.bo-b-l')]; this.f = [q('.bo-a-f').style, q('.bo-b-f').style]; this.v = [q('.bo-a-v'), q('.bo-b-v')];\n    this.liq = q('.bo-liq').style; this.rule = q('.bo-rule').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'think' }, { t: 4.5, pose: 'magnify' }, { t: 11.6, pose: 'explain' }, { t: 17.9, pose: 'calm' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(kit, this.px, t, 0.6, 0.7);\n    this.rows.forEach((s, i) => UI.rise(kit, s, t, 1.2 + i * 0.4, 0.6));\n    this.n.opacity = 0.9 * eo(seg(t, 2.2, 2.8));\n    // The fall plays out from 4.6 to 9.6: price −10%, the 1x margin loses 10, the 10x margin loses all 100 on paper.\n    const fall = eio(seg(t, 4.6, 9.6)), move = -0.10 * fall;\n    UI.set(this.p, UI.fmt(Math.round((60000 * (1 + move)) / 10) * 10));\n    UI.set(this.c, fall > 0.01 ? '▼ −' + Math.abs(move * 100).toFixed(1) + '%' : '');\n    [100, 1000].forEach((n, i) => {\n      const loss = Math.min(100, -n * move), left = 100 - loss;\n      UI.set(this.l[i], loss > 0.05 ? '−' + UI.fmt(loss, 0) + ' USDT' : '0');\n      this.f[i].width = left.toFixed(2) + '%';\n      this.f[i].background = left > 60 ? 'var(--main)' : 'var(--accent)';\n      UI.set(this.v[i], UI.fmt(left, 0) + ' left');\n      this.v[i].style.color = left < 1 ? 'var(--accent)' : 'var(--second)';\n    });\n    UI.rise(kit, this.liq, t, 11.6, 0.7);\n    const hl = eo(seg(t, 17.9, 18.5));\n    this.rule.background = 'color-mix(in srgb, var(--accent) ' + (hl * 16).toFixed(1) + '%, transparent)';\n    this.rule.outline = hl > 0 ? '6px solid color-mix(in srgb, var(--accent) ' + (hl * 16).toFixed(1) + '%, transparent)' : 'none';\n    this.tutor.render(t);\n  },\n});\n","scene-example.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nkit.scene('example', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const tile = (cls, top, big, small, hl) => '<div class=\"glass ' + cls + '\" style=\"position:relative;width:300px;padding:18px 26px;' + (hl ? 'border-color:var(--accent);background:color-mix(in srgb, var(--ground) 80%, var(--accent))' : '') + '\"><p class=\"fict\" style=\"margin:0 0 6px\">' + top + '</p><p class=\"mono ' + cls + '-n\" style=\"margin:0;font-size:48px\">' + big + '</p><p style=\"margin:4px 0 0;font-size:22px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">' + small + '</p></div>';\n    const op = (cls, s) => '<span class=\"mono ' + cls + '\" style=\"font-size:56px;width:50px;text-align:center;color:var(--main)\">' + s + '</span>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1500px;gap:18px\"><p class=\"kick ex-k\">Worked example · 10x long, 100 USDT margin</p>' +\n      '<h2 class=\"line ex-t\" style=\"font-size:72px\">From price move to PnL</h2>' +\n      '<p class=\"sub ex-s\" style=\"margin:0\">Gross PnL ≈ notional × signed % move</p>' +\n      '<p class=\"fict ex-f\" style=\"margin:0\">Fictional · simplified linear contract · before fees and funding · for a short, the sign flips</p></div>' +\n      '<div style=\"position:absolute;left:140px;top:440px;display:flex;align-items:center;gap:22px\">' +\n      tile('ex-a', 'Notional', '1,000', 'USDT') + op('ex-x', '×') + tile('ex-b', 'Price move', '−2%', '60,000 → 58,800') + op('ex-e', '=') + tile('ex-c', 'Gross PnL', '0', 'USDT', 1) + '</div>' +\n      '<div style=\"position:absolute;left:140px;top:618px;display:flex;align-items:center;gap:22px\">' +\n      tile('ex-d', 'Gross PnL', '−20', 'USDT') + op('ex-y', '÷') + tile('ex-g', 'Margin', '100', 'USDT') + op('ex-q', '=') + tile('ex-h', 'Return on margin', '0%', 'of your money', 1) + '</div>' +\n      '<div class=\"glass ex-sum\" style=\"left:1380px;top:440px;width:400px;padding:24px 30px;border-color:var(--accent)\"><p class=\"kick\" style=\"margin:0 0 10px;color:var(--accent)\">Magnified</p>' +\n      '<p style=\"margin:0;font-size:30px;line-height:1.35;font-weight:600\">A <span class=\"mono\">2%</span> price move became <span class=\"mono\" style=\"color:var(--accent)\">20%</span> of your margin.</p></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.ex-k').style; this.t = q('.ex-t'); this.s = q('.ex-s'); this.f = q('.ex-f').style;\n    this.r1 = ['.ex-a', '.ex-x', '.ex-b', '.ex-e', '.ex-c'].map((s) => q(s).style);\n    this.r2 = ['.ex-d', '.ex-y', '.ex-g', '.ex-q', '.ex-h'].map((s) => q(s).style);\n    this.c = q('.ex-c-n'); this.h = q('.ex-h-n'); this.sum = q('.ex-sum').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'writing' }, { t: 6.6, pose: 'present' }, { t: 11.9, pose: 'writing' }, { t: 16.3, pose: 'think' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.s, t, 1.2, { stagger: 0.06 });\n    this.f.opacity = 0.9 * eo(seg(t, 3.4, 4.0));\n    const a1 = [6.6, 7.4, 7.7, 8.6, 8.9], a2 = [11.9, 12.6, 12.9, 13.8, 14.1];\n    const pop = (s, a) => { const p = seg(t, a, a + 0.6); s.opacity = eo(seg(t, a, a + 0.3)); s.transform = 'translateY(' + lerp(30, 0, eo(p)).toFixed(1) + 'px) scale(' + lerp(0.9, 1, eob(p, 1.6)).toFixed(4) + ')'; };\n    this.r1.forEach((s, i) => pop(s, a1[i]));\n    this.r2.forEach((s, i) => pop(s, a2[i]));\n    UI.set(this.c, UI.sgn(-20 * eo(seg(t, 9.0, 10.0)), 0));\n    UI.set(this.h, UI.sgn(-20 * eo(seg(t, 14.2, 15.2)), 0) + '%');\n    UI.rise(kit, this.sum, t, 16.3, 0.7);\n    this.tutor.render(t);\n  },\n});\n","scene-hook.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Fictional BTC price: 60,000, up 2% to 61,200, then down to 58,800 (2% below the start).\nconst HK_KEYS = [[0, 60000], [5.3, 60000], [7.8, 61200], [10.2, 61200], [12.9, 58800], [20, 58800]];\nconst hkPrice = (t) => { let v = HK_KEYS[0][1]; for (let i = 1; i < HK_KEYS.length; i++) { const a = HK_KEYS[i - 1], b = HK_KEYS[i]; if (t >= a[0]) v = lerp(a[1], b[1], eio(kit.clamp01((t - a[0]) / (b[0] - a[0])))); } return v; };\nconst HK_X = (t) => 1250 + Math.min(t, 18) / 18 * 490, HK_Y = (p) => 410 - (p - 58400) / 3200 * 110;\nkit.scene('hook', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const card = (cls, x, name, lev, notional) => '<div class=\"glass ' + cls + '\" style=\"left:' + x + 'px;top:460px;width:780px;height:260px;padding:26px 36px\">' +\n      '<div style=\"display:flex;align-items:center;gap:18px\"><span style=\"font-size:32px;font-weight:700\">' + name + '</span><span class=\"chip mono ' + cls + '-lev\" style=\"font-size:28px;padding:8px 22px\">' + lev + '</span>' +\n      '<span style=\"margin-left:auto;font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">Margin <b class=\"mono\" style=\"color:var(--second)\">100 USDT</b></span></div>' +\n      '<p style=\"margin:8px 0 0;font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">Position size (notional): <span class=\"mono\" style=\"color:var(--second)\">' + notional + ' USDT</span></p>' +\n      '<div style=\"display:flex;align-items:baseline;gap:20px;margin-top:18px\"><span style=\"font-size:26px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">Profit / loss</span><span class=\"mono ' + cls + '-pnl\" style=\"font-size:60px\">0.00</span><span style=\"font-size:26px\">USDT</span></div>' +\n      '<div style=\"position:absolute;left:36px;right:36px;bottom:26px;height:12px;border-radius:6px;background:color-mix(in srgb, var(--second) 8%, transparent)\"><div class=\"' + cls + '-bar\" style=\"position:absolute;left:50%;top:0;bottom:0;border-radius:6px\"></div><div style=\"position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;background:color-mix(in srgb, var(--second) 40%, transparent)\"></div></d tor.render(t);\n  },\n});\n","scene-leverage.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst LV_STEPS = [[6.0, 1], [8.0, 3], [9.8, 10]];\nconst LV_K = 0.6; // px per USDT for the bars\nkit.scene('leverage', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let pills = '';\n    LV_STEPS.forEach((s) => { pills += '<span class=\"chip mono lv-pill\" style=\"font-size:32px;padding:12px 30px\">' + s[1] + 'x</span>'; });\n    const r = kit.rng(12); let wig = 'M20 70'; for (let i = 1; i <= 24; i++) wig += ' L' + (20 + i * 9) + ' ' + (70 + (r() - 0.5) * 34 - Math.sin(i / 3) * 10).toFixed(1);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1040px\"><p class=\"kick lv-k\">New word · leverage</p>' +\n      '<h2 class=\"line lv-t\">Leverage multiplies size</h2>' +\n      '<p class=\"def lv-d\"><b>Leverage</b> is how many times bigger the position is than your margin.</p></div>' +\n      '<div style=\"position:absolute;left:140px;top:480px\">' +\n      '<div style=\"display:flex;align-items:center;gap:24px;height:64px\"><span style=\"width:200px;flex:none;font-size:26px;font-weight:600\">Margin</span><div class=\"lv-m\" style=\"flex:none;height:46px;width:' + (100 * LV_K) + 'px;border-radius:10px;background:var(--main)\"></div><span class=\"mono lv-mv\" style=\"font-size:30px\">100 USDT</span></div>' +\n      '<div style=\"display:flex;align-items:center;gap:24px;height:64px;margin-top:14px\"><span style=\"width:200px;flex:none;font-size:26px;font-weight:600\">Notional</span><div class=\"lv-n\" style=\"flex:none;height:46px;width:0;border-radius:10px;background:linear-gradient(90deg, var(--main), var(--accent))\"></div><span class=\"mono lv-nv\" style=\"font-size:30px;white-space:nowrap\"></span></div></div>' +\n      '<div class=\"chip lv-f\" style=\"position:absolute;left:140px;top:680px;font-size:30px;padding:14px 30px\">notional ≈ margin × leverage<span style=\"width:2px;height:30px;background:color-mix(in srgb, var(--second) 25%, transparent)\"></span><span class=\"mono lv-fx\" style=\"color:var(--main)\"></span></div>' +\n      '<div class=\"glass lv-sel\" style=\"left:1240px;top:170px;width:540px;height:280px;padding:24px 32px\"><p class=\"fict\" style=\"margin:0 0 16px\">Leverage · educational mock</p>' +\n      '<div style=\"display:flex;gap:16px\">' + pills + '</div>' +\n      '<p style=\"margin:22px 0 0;font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">Position size = <span class=\"mono lv-x\" style=\"font-size:40px;color:var(--second)\">1</span> × your margin</p></div>' +\n      '<div class=\"glass lv-mag\" style=\"left:1240px;top:476px;width:540px;height:196px;padding:20px 28px\">' +\n      '<svg width=\"200\" height=\"150\" viewBox=\"0 0 250 150\" style=\"position:absolute;left:18px;top:24px;overflow:visible\"><path d=\"' + wig + '\" fill=\"none\" stroke-width=\"3\" style=\"stroke:color-mix(in srgb, var(--second) 45%, transparent)\"/>' +\n      '<g class=\"lv-lens\"><circle cx=\"0\" cy=\"0\" r=\"46\" stroke-width=\"5\" style=\"fill:color-mix(in srgb, var(--ground) 70%, var(--main));stroke:var(--main)\"/><line x1=\"33\" y1=\"33\" x2=\"62\" y2=\"62\" stroke-width=\"9\" stroke-linecap=\"round\" style=\"stroke:var(--main)\"/>' +\n      '<path class=\"lv-zoom\" fill=\"none\" stroke-width=\"4\" style=\"stroke:var(--second)\"/></g></svg>' +\n      '<p style=\"position:absolute;left:250px;right:24px;top:30px;margin:0;font-size:28px;line-height:1.35;font-weight:600\">Like a magnifying glass: every move looks bigger, good and bad.</p></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.lv-k').style; this.t = q('.lv-t'); this.d = q('.lv-d');\n    this.m = q('.lv-m').style; this.mv = q('.lv-mv').style; this.n = q('.lv-n').style; this.nv = q('.lv-nv');\n    this.f = q('.lv-f').style; this.fx = q('.lv-fx'); this.sel = q('.lv-sel').style; this.pills = all('.lv-pill').map((e) => e.style); this.x = q('.lv-x');\n    this.mag = q('.lv-mag').style; this.lens = q('.lv-lens'); this.zoom = q('.lv-zoom');\n    this.wr = kit.rng(5); this.zr = []; for (let i = 0; i < 9; i++) this.zr.push(this.wr());\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'present' }, { t: 6.0, pose: 'point', flip: true }, { t: 11.5, pose: 'writing' }, { t: 17.4, pose: 'magnify' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.d, t, 0.9, { stagger: 0.05 });\n    UI.rise(kit, this.sel, t, 3.4, 0.7);\n    const mp = seg(t, 4.2, 4.8);\n    this.m.transformOrigin = '0 50%'; this.m.transform = 'scaleX(' + eo(mp) + ')'; this.mv.opacity = eo(mp);\n    // Step through 1x, 3x, 10x: the notional bar grows, the margin bar never changes.\n    let lev = 0, prev = 0, at = 0;\n    LV_STEPS.forEach((s) => { if (t >= s[0]) { prev = lev; lev = s[1]; at = s[0]; } });\n    const g = eio(seg(t, at, at + 0.9));\n    const cur = lev ? lerp(prev, lev, g) : 0;\n    this.n.width = (100 * cur * LV_K).toFixed(1) + 'px';\n    UI.set(this.nv, lev ? UI.fmt(Math.round(100 * cur)) + ' USDT' : '');\n    UI.set(this.x, lev || 1);\n    this.pills.forEach((s, i) => {\n      const on = lev === LV_STEPS[i][1] ? eo(seg(t, LV_STEPS[i][0], LV_STEPS[i][0] + 0.3)) : 0;\n      s.background = on ? 'color-mix(in srgb, var(--ground) ' + lerp(88, 0, on).toFixed(0) + '%, var(--main))' : 'color-mix(in srgb, var(--ground) 88%, var(--main))';\n      s.color = on > 0.5 ? 'var(--ground)' : 'var(--second)';\n      s.transform = 'scale(' + (1 + 0.08 * Math.sin(Math.PI * seg(t, LV_STEPS[i][0], LV_STEPS[i][0] + 0.5))).toFixed(3) + ')';\n    });\n    UI.set(this.fx, '100 × ' + (lev || 10) + ' = ' + UI.fmt(100 * (lev || 10)) + ' USDT')
