<script>window.FILM = {"id":"T13","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson thirteen","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"Closed for you","dur":18,"k":1,"oldStart":8,"oldDur":18},{"id":"buffer","name":"Your margin buffer","dur":32.12,"k":1.46,"oldStart":26,"oldDur":22},{"id":"liquidation","name":"Liquidation","dur":24,"k":1,"oldStart":48,"oldDur":24},{"id":"room","name":"Leverage and room","dur":25.41,"k":1.21,"oldStart":72,"oldDur":21},{"id":"mark","name":"Mark price","dur":24,"k":1,"oldStart":93,"oldDur":24},{"id":"funding","name":"Funding","dur":43.44,"k":1.81,"oldStart":117,"oldDur":24},{"id":"fundadd","name":"Funding adds up","dur":22.26,"k":1.06,"oldStart":141,"oldDur":21},{"id":"gap","name":"Gap risk","dur":27.14,"k":1.18,"oldStart":162,"oldDur":23},{"id":"stop","name":"Common mistake","dur":23,"k":1,"oldStart":185,"oldDur":23},{"id":"try","name":"Try it","dur":24,"k":1,"oldStart":208,"oldDur":24},{"id":"risks","name":"Know the risks","dur":27,"k":1,"oldStart":232,"oldDur":27},{"id":"recap","name":"Recap","dur":29,"k":1,"oldStart":259,"oldDur":29},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":288,"oldDur":10}],"voice":{"src":"T13/voice.mp3","lines":[{"t":0.6,"d":6.122,"text":"Lesson thirteen: liquidation, funding and futures risks. What can close a position for you.","ml":"പതിമൂന്നാം പാഠം: liquidation, funding, futures റിസ്കുകൾ. ഒരു പൊസിഷൻ നിങ്ങളറിയാതെ ക്ലോസ് ആകാൻ കാരണമാകുന്നത് എന്തൊക്കെ?"},{"t":8.4,"d":5.507,"text":"Imagine you open a 10x long. Then BTC falls, and you see this.","ml":"നിങ്ങൾ ഒരു 10x long തുറക്കുന്നു എന്ന് കരുതുക. പിന്നെ BTC വീഴുന്നു, നിങ്ങൾ ഇത് കാണുന്നു."},{"t":14.457,"d":3.639,"text":"Your position was closed by the exchange. You didn't press anything.","ml":"നിങ്ങളുടെ പൊസിഷൻ exchange ക്ലോസ് ചെയ്തു. നിങ്ങൾ ഒന്നും അമർത്തിയില്ല."},{"t":18.7,"d":3.439,"text":"That's called liquidation. Let's see how it happens, step by step.","ml":"ഇതിനെയാണ് liquidation എന്ന് പറയുന്നത്. ഇത് എങ്ങനെ സംഭവിക്കുന്നു എന്ന് പടിപടിയായി നോക്കാം."},{"t":26.584,"d":4.259,"text":"Start with your margin balance: your margin plus the open profit or loss.","ml":"ആദ്യം നിങ്ങളുടെ margin balance: margin-ഉം തുറന്ന ലാഭമോ നഷ്ടമോ ചേർന്നത്."},{"t":34.906,"d":7.768,"text":"A 10x long: 100 USDT of margin, 1,000 USDT notional, entry 60,000.","ml":"ഒരു 10x long: 100 USDT margin, 1,000 USDT notional, എൻട്രി 60,000."},{"t":43.224,"d":7.6,"text":"BTC falls 1%: 90 left. Falls 3%: 70 left. Falls 5%: only 50 left.","ml":"BTC 1% വീണാൽ: 90 ബാക്കി. 3% വീണാൽ: 70 ബാക്കി. 5% വീണാൽ: 50 മാത്രം ബാക്കി."},{"t":51.374,"d":3.067,"text":"Each fall eats into the room left above the maintenance level.","ml":"ഓരോ വീഴ്ചയും maintenance ലെവലിന് മുകളിലുള്ള ബാക്കി ഇടം തിന്നുതീർക്കുന്നു."},{"t":58.52,"d":4.706,"text":"Liquidation is a forced closure. The exchange closes your position for you.","ml":"Liquidation എന്നാൽ നിർബന്ധിതമായി ക്ലോസ് ചെയ്യലാണ്. Exchange നിങ്ങൾക്ക് പകരം പൊസിഷൻ ക്ലോസ് ചെയ്യുന്നു."},{"t":64.32,"d":3.067,"text":"It happens when your margin balance falls to the maintenance level.","ml":"നിങ്ങളുടെ margin balance maintenance ലെവലിലേക്ക് താഴുമ്പോഴാണ് ഇത് സംഭവിക്കുന്നത്."},{"t":69.62,"d":4.471,"text":"You don't choose the price or the moment. Most or all of the margin can be gone.","ml":"വിലയോ സമയമോ നിങ്ങൾ തിരഞ്ഞെടുക്കുന്നില്ല. Margin-ന്റെ ഭൂരിഭാഗമോ മുഴുവനോ പോകാം."},{"t":75.72,"d":4.641,"text":"Like a rental firm taking the car back early. Each exchange has its own rules.","ml":"വാടകക്കമ്പനി കാർ നേരത്തെ തിരിച്ചെടുക്കുന്നത് പോലെ. ഓരോ exchange-നും സ്വന്തം നിയമങ്ങളുണ്ട്."},{"t":82.604,"d":2.033,"text":"Leverage changes how much room you have.","ml":"നിങ്ങൾക്ക് എത്ര ഇടമുണ്ട് എന്നത് leverage മാറ്റും."},{"t":86.839,"d":6.681,"text":"Same 1,000 USDT position. At 10x you put in 100. At 4x, 250.","ml":"ഒരേ 1,000 USDT പൊസിഷൻ. 10x-ൽ നിങ്ങൾ 100 ഇടുന്നു. 4x-ൽ 250."},{"t":94.07,"d":7.391,"text":"A 5% fall costs 50 USDT either way. At 10x, half your margin is gone. At 4x, a fifth.","ml":"5% വീഴ്ചയ്ക്ക് രണ്ടിലും 50 USDT പോകും. 10x-ൽ margin-ന്റെ പകുതി പോയി. 4x-ൽ അഞ്ചിലൊന്ന്."},{"t":102.011,"d":4.2,"text":"More room is not safety. A big enough move can reach any level.","ml":"കൂടുതൽ ഇടം എന്നാൽ സുരക്ഷ എന്നല്ല. വലിയൊരു മാറ്റം ഏത് ലെവലിലും എത്താം."},{"t":107.93,"d":4.831,"text":"Exchanges usually check liquidation against the mark price, not only the last trade.","ml":"Exchange-കൾ സാധാരണ liquidation പരിശോധിക്കുന്നത് mark price വെച്ചാണ്, അവസാന ട്രേഡ് മാത്രം നോക്കിയല്ല."},{"t":114.33,"d":4.734,"text":"The mark price is a reference price the exchange works out, often from several markets.","ml":"Exchange കണക്കാക്കുന്ന ഒരു റഫറൻസ് വിലയാണ് mark price, പലപ്പോഴും പല മാർക്കറ്റുകളിൽ നിന്ന്."},{"t":120.93,"d":5.446,"text":"Here one odd trade spikes down. The last price jumps. The mark price moves much less.","ml":"ഇവിടെ ഒരു വിചിത്ര ട്രേഡ് പെട്ടെന്ന് താഴേക്ക് കുത്തുന്നു. Last price ചാടുന്നു. Mark price വളരെ കുറച്ചേ നീങ്ങുന്നുള്ളൂ."},{"t":127.43,"d":2.176,"text":"But in a real crash, it falls too.","ml":"പക്ഷേ ഒരു യഥാർത്ഥ തകർച്ചയിൽ അതും വീഴും."},{"t":132.254,"d":5.558,"text":"Now funding. Perpetual futures never expire, so they need a way to stay near the spot price.","ml":"ഇനി funding. Perpetual futures ഒരിക്കലും കാലഹരണപ്പെടില്ല, അതുകൊണ്ട് spot വിലയ്ക്കടുത്ത് നിൽക്കാൻ ഒരു വഴി വേണം."},{"t":144.743,"d":5.375,"text":"The funding rate sets a payment between longs and shorts, at set times, often every 8 hours.","ml":"Funding rate longs-ഉം shorts-ഉം തമ്മിൽ ഒരു പേയ്മെന്റ് നിശ്ചയിക്കുന്നു, നിശ്ചിത സമയങ്ങളിൽ, പലപ്പോഴും ഓരോ 8 മണിക്കൂറിലും."},{"t":157.232,"d":4.497,"text":"Positive rate: longs pay shorts. Negative rate: shorts pay longs.","ml":"Rate പോസിറ്റീവ്: longs shorts-ന് കൊടുക്കുന്നു. Rate നെഗറ്റീവ്: shorts longs-ന് കൊടുക്കുന്നു."},{"t":166.463,"d":8.082,"text":"Example: 1,000 USDT times 0.01% is 0.10 USDT each time.","ml":"ഉദാഹരണം: 1,000 USDT ഗുണം 0.01% = ഓരോ തവണയും 0.10 USDT."},{"t":175.394,"d":2.95,"text":"Funding adds up when you hold a position for a long time.","ml":"ഒരു പൊസിഷൻ ഏറെ നേരം പിടിച്ചുവെച്ചാൽ funding കൂടിക്കൂടി വരും."},{"t":180.27,"d":6.934,"text":"Three times a day for three days is nine payments: 0.90 USDT at 1,000 notional.","ml":"ദിവസം മൂന്ന് തവണ, മൂന്ന് ദിവസം എന്നാൽ ഒമ്പത് പേയ്മെന്റുകൾ: 1,000 notional-ൽ 0.90 USDT."},{"t":187.754,"d":5.737,"text":"At 10,000 notional, 9 USDT. Real rates change, and can be much higher.","ml":"10,000 notional-ൽ 9 USDT. യഥാർത്ഥ rate-കൾ മാറും, വളരെ കൂടുതലുമാകാം."},{"t":194.041,"d":2.353,"text":"Funding comes out of your margin balance too.","ml":"Funding-ഉം നിങ്ങളുടെ margin balance-ൽ നിന്നാണ് പോകുന്നത്."},{"t":197.702,"d":5.144,"text":"Gap risk. Sometimes price jumps from one level to another, with no trades in between.","ml":"Gap റിസ്ക്. ചിലപ്പോൾ ഇടയിൽ ഒരു ട്രേഡും ഇല്ലാതെ വില ഒരു ലെവലിൽ നിന്ന് മറ്റൊന്നിലേക്ക് ചാടും."},{"t":205.372,"d":8.356,"text":"Your stop-loss is at 59,000. News hits. Price jumps from 59,600 straight to 58,300.","ml":"നിങ്ങളുടെ stop-loss 59,000-ൽ ആണ്. ഒരു വാർത്ത വരുന്നു. വില 59,600-ൽ നിന്ന് നേരെ 58,300-ലേക്ക് ചാടുന്നു."},{"t":214.278,"d":5.438,"text":"The stop triggers, but it fills near 58,300. A bigger loss than planned.","ml":"Stop ട്രിഗർ ആകുന്നു, പക്ഷേ fill ആകുന്നത് 58,300-ന് അടുത്താണ്. പ്ലാൻ ചെയ്തതിലും വലിയ നഷ്ടം."},{"t":220.266,"d":2.575,"text":"A gap can bring liquidation just as suddenly.","ml":"ഒരു gap അതുപോലെ പെട്ടെന്ന് liquidation-ഉം കൊണ്ടുവരാം."},{"t":224.77,"d":4.425,"text":"A common mistake: thinking a stop-loss protects you from liquidation.","ml":"ഒരു സാധാരണ തെറ്റ്: stop-loss നിങ്ങളെ liquidation-ൽ നിന്ന് രക്ഷിക്കും എന്ന് കരുതുന്നത്."},{"t":230.17,"d":3.517,"text":"With high leverage, the liquidation zone can sit closer than your stop.","ml":"ഉയർന്ന leverage-ൽ, liquidation സോൺ നിങ്ങളുടെ stop-നേക്കാൾ അടുത്താകാം."},{"t":235.67,"d":3.202,"text":"Then the position is liquidated before the stop is ever reached.","ml":"അപ്പോൾ stop-ൽ എത്തുന്നതിന് മുമ്പേ പൊസിഷൻ liquidate ആകും."},{"t":240.77,"d":5.036,"text":"And in a gap, a stop can fill late. A stop-loss is not liquidation insurance.","ml":"ഒരു gap-ൽ stop വൈകി fill ആകാം. Stop-loss ഒരു liquidation ഇൻഷുറൻസ് അല്ല."},{"t":247.77,"d":6.006,"text":"Your turn. BTC is swinging hard before big news. Your buffer is small. You're unsure.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. വലിയ വാർത്തയ്ക്ക് മുമ്പ് BTC ശക്തമായി ആടുന്നു. നിങ്ങളുടെ buffer ചെറുതാണ്. നിങ്ങൾക്ക് ഉറപ്പില്ല."},{"t":254.326,"d":4.453,"text":"What's the sensible choice: A, B or C? Pause if you need more time.","ml":"ഏതാണ് ബുദ്ധിപരമായ തീരുമാനം: A, B, അല്ലെങ്കിൽ C? കൂടുതൽ സമയം വേണമെങ്കിൽ വീഡിയോ നിർത്തൂ."},{"t":259.57,"d":5.021,"text":"C. Reduce your exposure or close, then wait. No trade is a real decision.","ml":"C. Exposure കുറയ്ക്കുക, അല്ലെങ്കിൽ ക്ലോസ് ചെയ്യുക, പിന്നെ കാത്തിരിക്കുക. ട്രേഡ് ചെയ്യാതിരിക്കുന്നതും ഒരു യഥാർത്ഥ തീരുമാനമാണ്."},{"t":265.27,"d":3.304,"text":"Adding leverage to win it back makes the next move hit harder.","ml":"നഷ്ടം തിരിച്ചുപിടിക്കാൻ leverage കൂട്ടിയാൽ, അടുത്ത മാറ്റം കൂടുതൽ ശക്തമായി അടിക്കും."},{"t":271.77,"d":2.8,"text":"Before you go further, know the risks of futures.","ml":"മുന്നോട്ട് പോകും മുമ്പ്, futures-ന്റെ റിസ്കുകൾ അറിയുക."},{"t":275.87,"d":4.314,"text":"Liquidation can take most or all of your margin, at a price you didn't choose.","ml":"നിങ്ങൾ തിരഞ്ഞെടുക്കാത്ത ഒരു വിലയിൽ, liquidation margin-ന്റെ ഭൂരിഭാഗമോ മുഴുവനോ എടുക്കാം."},{"t":281.87,"d":4.112,"text":"Funding is paid or charged every period, and the rate keeps changing.","ml":"ഓരോ കാലയളവിലും funding കിട്ടുകയോ ഈടാക്കുകയോ ചെയ്യും, rate മാറിക്കൊണ്ടേയിരിക്കും."},{"t":287.27,"d":2.926,"text":"Gaps and slippage can make exits worse than planned.","ml":"Gap-ഉം slippage-ഉം കാരണം exit പ്ലാൻ ചെയ്തതിലും മോശമാകാം."},{"t":291.57,"d":5.087,"text":"No strategy is guaranteed safe. When unsure, reduce exposure or choose no trade.","ml":"ഒരു തന്ത്രവും ഉറപ്പായും സുരക്ഷിതമല്ല. ഉറപ്പില്ലെങ്കിൽ exposure കുറയ്ക്കുക, അല്ലെങ്കിൽ ട്രേഡ് വേണ്ടെന്ന് വെക്കുക."},{"t":298.77,"d":0.692,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":300.37,"d":4.441,"text":"Liquidation is a forced closure when your margin balance hits the maintenance level.","ml":"Margin balance maintenance ലെവലിൽ എത്തുമ്പോൾ നിർബന്ധിതമായി ക്ലോസ് ചെയ്യുന്നതാണ് liquidation."},{"t":306.77,"d":4.01,"text":"Funding is a regular payment between longs and shorts on perpetual futures.","ml":"Perpetual futures-ൽ longs-ഉം shorts-ഉം തമ്മിലുള്ള പതിവ് പേയ്മെന്റാണ് funding."},{"t":312.57,"d":4.82,"text":"A stop-loss is not liquidation insurance. Waiting is always allowed.","ml":"Stop-loss liquidation ഇൻഷുറൻസ് അല്ല. കാത്തിരിക്കാൻ എപ്പോഴും അനുവാദമുണ്ട്."},{"t":317.94,"d":3.767,"text":"Check yourself: can a stop-loss guarantee you won't be liquidated?","ml":"സ്വയം പരിശോധിക്കൂ: നിങ്ങൾ liquidate ആകില്ലെന്ന് ഒരു stop-loss-ന് ഉറപ്പ് തരാൻ കഴിയുമോ?"},{"t":323.07,"d":3.205,"text":"No. Stops can slip, and liquidation can come first.","ml":"ഇല്ല. Stop-കൾ slip ആകാം, liquidation ആദ്യം വരാം."},{"t":328.17,"d":5.904,"text":"Phase 3 complete! Next up: Checkpoint A, a review of lessons T01 to T13.","ml":"ഘട്ടം 3 പൂർത്തിയായി! അടുത്തത്: Checkpoint A, T01 മുതൽ T13 വരെയുള്ള പാഠങ്ങളുടെ ഒരു റിവ്യൂ."}]},"assetBase":"T13/assets/","assets":{"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-writing.webp":{"mime":"image/webp","w":191,"h":169},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n","narration.json":"{\n  \"about\": \"T13 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson thirteen: liquidation, funding and futures risks. What can close a position for you.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"Imagine you open a 10x long. Then BTC falls, and you see this.\"\n    },\n    {\n      \"t\": 13.4,\n      \"text\": \"Your position was closed by the exchange. You didn't press anything.\"\n    },\n    {\n      \"t\": 18.7,\n      \"text\": \"That's called liquidation. Let's see how it happens, step by step.\"\n    },\n    {\n      \"t\": 26.4,\n      \"text\": \"Start with your margin balance: your margin plus the open profit or loss.\"\n    },\n    {\n      \"t\": 32.1,\n      \"text\": \"A 10x long: 100 USDT of margin, 1,000 USDT notional, entry 60,000.\"\n    },\n    {\n      \"t\": 37.3,\n      \"text\": \"BTC falls 1%: 90 left. Falls 3%: 70 left. Falls 5%: only 50 left.\"\n    },\n    {\n      \"t\": 42.4,\n      \"text\": \"Each fall eats into the room left above the maintenance level.\"\n    },\n    {\n      \"t\": 48.4,\n      \"text\": \"Liquidation is a forced closure. The exchange closes your position for you.\"\n    },\n    {\n      \"t\": 54.2,\n      \"text\": \"It happens when your margin balance falls to the maintenance level.\"\n    },\n    {\n      \"t\": 59.5,\n      \"text\": \"You don't choose the price or the moment. Most or all of the margin can be gone.\"\n    },\n    {\n      \"t\": 65.6,\n      \"text\": \"Like a rental firm taking the car back early. Each exchange has its own rules.\"\n    },\n    {\n      \"t\": 72.4,\n      \"text\": \"Leverage changes how much room you have.\"\n    },\n    {\n      \"t\": 75.9,\n      \"text\": \"Same 1,000 USDT position. At 10x you put in 100. At 4x, 250.\"\n    },\n    {\n      \"t\": 80.7,\n      \"text\": \"A 5% fall costs 50 USDT either way. At 10x, half your margin is gone. At 4x, a fifth.\"\n    },\n    {\n      \"t\": 87.2,\n      \"text\": \"More room is not safety. A big enough move can reach any level.\"\n    },\n    {\n      \"t\": 93.4,\n      \"text\": \"Exchanges usually check liquidation against the mark price, not only the last trade.\"\n    },\n    {\n      \"t\": 99.8,\n      \"text\": \"The mark price is a reference price the exchange works out, often from several markets.\"\n    },\n    {\n      \"t\": 106.4,\n      \"text\": \"Here one odd trade spikes down. The last price jumps. The mark price moves much less.\"\n    },\n    {\n      \"t\": 112.9,\n      \"text\": \"But in a real crash, it falls too.\"\n    },\n    {\n      \"t\": 117.4,\n      \"text\": \"Now funding. Perpetual futures never expire, so they need a way to stay near the spot price.\"\n    },\n    {\n      \"t\": 124.3,\n      \"text\": \"The funding rate sets a payment between longs and shorts, at set times, often every 8 hours.\"\n    },\n    {\n      \"t\": 131.2,\n      \"text\": \"Positive rate: longs pay shorts. Negative rate: shorts pay longs.\"\n    },\n    {\n      \"t\": 136.3,\n      \"text\": \"Example: 1,000 USDT times 0.01% is 0.10 USDT each time.\"\n    },\n    {\n      \"t\": 141.4,\n      \"text\": \"Funding adds up when you hold a position for a long time.\"\n    },\n    {\n      \"t\": 146.0,\n      \"text\": \"Three times a day for three days is nine payments: 0.90 USDT at 1,000 notional.\"\n    },\n    {\n      \"t\": 152.1,\n      \"text\": \"At 10,000 notional, 9 USDT. Real rates change, and can be much higher.\"\n    },\n    {\n      \"t\": 157.6,\n      \"text\": \"Funding comes out of your margin balance too.\"\n    },\n    {\n      \"t\": 162.4,\n      \"text\": \"Gap risk. Sometimes price jumps from one level to another, with no trades in between.\"\n    },\n    {\n      \"t\": 168.9,\n      \"text\": \"Your stop-loss is at 59,000. News hits. Price jumps from 59,600 straight to 58,300.\"\n    },\n    {\n      \"t\": 175.2,\n      \"text\": \"The stop triggers, but it fills near 58,300. A bigger loss than planned.\"\n    },\n    {\n      \"t\": 180.8,\n      \"text\": \"A gap can bring liquidation just as suddenly.\"\n    },\n    {\n      \"t\": 185.4,\n      \"text\": \"A common mistake: thinking a stop-loss protects you from liquidation.\"\n    },\n    {\n      \"t\": 190.8,\n      \"text\": \"With high leverage, the liquidation zone can sit closer than your stop.\"\n    },\n    {\n      \"t\": 196.3,\n      \"text\": \"Then the position is liquidated before the stop is ever reached.\"\n    },\n    {\n      \"t\": 201.4,\n      \"text\": \"And in a gap, a stop can fill late. A stop-loss is not liquidation insurance.\"\n    },\n    {\n      \"t\": 208.4,\n      \"text\": \"Your turn. BTC is swinging hard before big news. Your buffer is small. You're unsure.\"\n    },\n    {\n      \"t\": 214.9,\n      \"text\": \"What's the sensible choice: A, B or C? Pause if you need more time.\"\n    },\n    {\n      \"t\": 220.2,\n      \"text\": \"C. Reduce your exposure or close, then wait. No trade is a real decision.\"\n    },\n    {\n      \"t\": 225.9,\n      \"text\": \"Adding leverage to win it back makes the next move hit harder.\"\n    },\n    {\n      \"t\": 232.4,\n      \"text\": \"Before you go further, know the risks of futures.\"\n    },\n    {\n      \"t\": 236.5,\n      \"text\": \"Liquidation can take most or all of your margin, at a price you didn't choose.\"\n    },\n    {\n      \"t\": 242.5,\n      \"text\": \"Funding is paid or charged every period, and the rate keeps changing.\"\n    },\n    {\n      \"t\": 247.9,\n      \"text\": \"Gaps and slippage can make exits worse than planned.\"\n    },\n    {\n      \"t\": 252.2,\n      \"text\": \"No strategy is guaranteed safe. When unsure, reduce exposure or choose no trade.\"\n    },\n    {\n      \"t\": 259.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 261.0,\n      \"text\": \"Liquidation is a forced closure when your margin balance hits the maintenance level.\"\n    },\n    {\n      \"t\": 267.4,\n      \"text\": \"Funding is a regular payment between longs and shorts on perpetual futures.\"\n    },\n    {\n      \"t\": 273.2,\n      \"text\": \"A stop-loss is not liquidation insurance. Waiting is always allowed.\"\n    },\n    {\n      \"t\": 278.5,\n      \"text\": \"Check yourself: can a stop-loss guarantee you won't be liquidated?\"\n    },\n    {\n      \"t\": 283.7,\n      \"text\": \"No. Stops can slip, and liquidation can come first.\"\n    },\n    {\n      \"t\": 288.8,\n      \"text\": \"Phase 3 complete! Next up: Checkpoint A, a review of lessons T01 to T13.\"\n    }\n  ]\n}","scene-buffer.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// 10x long, 100 USDT margin, 1,000 USDT notional, entry 60,000 (fictional). Falls of 1%, 3%, 5%.\nconst BF_STEPS = [[11.3, 1, 59400, 90], [12.9, 3, 58200, 70], [14.5, 5, 57000, 50]];\nconst BF_X0 = 140, BF_W = 1300, BF_ML = 0.14; // the maintenance line sits at a fixed spot on the bar; no number is shown for it\nkit.scene('buffer', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const row = (a, b) => '<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent)\"><span style=\"font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">' + a + '</span><span class=\"mono\" style=\"font-size:28px\">' + b + '</span></div>';\n    let chips = '';\n    BF_STEPS.forEach((s) => { chips += '<span class=\"chip mono bf-c\" style=\"font-size:26px;padding:10px 22px\">−' + s[1] + '% · ' + UI.fmt(s[2]) + ' → <span style=\"color:var(--main)\">' + s[3] + ' left</span></span>'; });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1000px\"><p class=\"kick bf-k\">Margin balance</p>' +\n      '<h2 class=\"line bf-t\" style=\"font-size:72px\">Your buffer shrinks</h2></div>' +\n      '<div class=\"glass bf-eq\" style=\"left:140px;top:320px;width:1000px;padding:20px 32px\"><p style=\"margin:0;font-size:32px;font-weight:700\">Margin balance = margin + unrealized PnL</p>' +\n      '<p style=\"margin:6px 0 0;font-size:26px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">Unrealized PnL: open profit or loss, not locked in yet</p></div>' +\n      '<div class=\"glass bf-tk\" style=\"left:1220px;top:170px;width:560px;padding:20px 30px\"><p class=\"fict\" style=\"margin:0 0 6px\">Position · fictional</p>' +\n      row('Side', 'Long 10x') + row('Margin', '100 USDT') + row('Notional', '1,000 USDT') + row('Entry', '60,000') +\n      '<div style=\"display:flex;justify-content:space-between;align-items:baseline;padding:8px 0\"><span style=\"font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">Unrealized PnL</span><span class=\"mono bf-pnl\" style=\"font-size:28px\">0</span></div></div>' +\n      '<p class=\"kick\" style=\"position:absolute;left:' + BF_X0 + 'px;top:516px;margin:0\">Margin balance</p>' +\n      '<p class=\"mono bf-v\" style=\"position:absolute;left:' + (BF_X0 + 290) + 'px;top:504px;margin:0;font-size:34px\"></p>' +\n      '<div style=\"position:absolute;left:' + BF_X0 + 'px;top:560px;width:' + BF_W + 'px;height:64px;border-radius:14px;background:color-mix(in srgb, var(--second) 7%, transparent);border:1.5px solid color-mix(in srgb, var(--second) 16%, transparent)\"><div class=\"bf-fill\" style=\"position:absolute;left:0;top:0;bottom:0;border-radius:13px\"></div></div>' +\n      '<div style=\"position:absolute;left:' + (BF_X0 + BF_W * BF_ML) + 'px;top:540px;height:104px;border-left:4px dashed var(--accent)\"></div>' +\n      '<p style=\"position:absolute;left:' + BF_X0 + 'px;top:652px;width:' + (BF_W * BF_ML + 140) + 'px;margin:0;font-size:22px;line-height:1.3;font-weight:600;color:var(--accent)\">Maintenance level · exchange rules</p>' +\n      '<div class=\"bf-room\" style=\"position:absolute;top:546px;height:0;border-top:3px solid var(--main)\"></div>' +\n      '<p class=\"bf-rl\" style=\"position:absolute;top:574px;margin:0;font-size:26px;font-weight:700;color:var(--ground);text-align:center\">room left</p>' +\n      '<div class=\"bf-chips\" style=\"position:absolute;left:' + (BF_X0 + BF_W * BF_ML + 200) + 'px;top:650px;display:flex;gap:14px\">' + chips + '</div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.bf-k').style; this.t = q('.bf-t'); this.eq = q('.bf-eq').style; this.tk = q('.bf-tk').style; this.pnl = q('.bf-pnl');\n    this.v = q('.bf-v'); this.fill = q('.bf-fill').style; this.room = q('.bf-room').style; this.rl = q('.bf-rl').style; this.chips = all('.bf-c').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'writing' }, { t: 6.1, pose: 'present' }, { t: 11.3, pose: 'point', flip: true }, { t: 16.4, pose: 'think' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(kit, this.eq, t, 0.7, 0.7);\n    UI.rise(kit, this.tk, t, 6.1, 0.7);\n    // Balance steps 100 → 90 → 70 → 50 as each fall plays.\n    let bal = 100;\n    BF_STEPS.forEach((s, i) => { const prev = i ? BF_STEPS[i - 1][3] : 100; if (t >= s[0]) bal = lerp(prev, s[3], eio(seg(t, s[0], s[0] + 0.8))); });\n    const pnl = bal - 100;\n    UI.set(this.pnl, UI.sgn(Math.round(pnl), 0) + ' USDT');\n    this.pnl.style.color = pnl < -0.5 ? 'var(--accent)' : 'var(--second)';\n    UI.set(this.v, UI.fmt(Math.round(bal)) + ' USDT');\n    const w = BF_W * bal / 100;\n    this.fill.width = w.toFixed(1) + 'px';\n    this.fill.background = bal > 60 ? 'linear-gradient(90deg, color-mix(in srgb, var(--main) 60%, var(--accent)), var(--main))' : 'linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--main)))';\n    this.fill.opacity = eo(seg(t, 6.4, 7.0)); this.v.style.opacity = eo(seg(t, 6.4, 7.0));\n    this.chips.forEach((s, i) => UI.rise(kit, s, t, BF_STEPS[i][0], 0.5, 16));\n    // \"Room left\": the stretch between the maintenance line and the end of the fill.\n    const rp = eo(seg(t, 16.4, 17.0)), x0 = BF_X0 + BF_W * BF_ML;\n    this.room.left = x0.toFixed(1) + 'px'; this.room.width = ((BF_X0 + w - x0) * rp).toFixed(1) + 'px';\n    this.rl.left = x0.toFixed(1) + 'px'; this.rl.width = (BF_X0 + w - x0).toFixed(1) + 'px'; this.rl.opacity = rp;\n    this.tutor.render(t);\n  },\n});\n","scene-fundadd.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Nine funding times (3 a day for 3 days) at a fictional +0.01%: 0.10 USDT each on 1,000 notional, 1.00 on 10,000.\nconst FA_T0 = 5.4, FA_STEP = 0.55, FA_X0 = 420, FA_DX = 140;\nkit.scene('fundadd', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let dots = '', days = '';\n    for (let i = 0; i < 9; i++) dots += '<span class=\"fa-dot\" style=\"position:absolute;left:' + (FA_X0 + i * FA_DX - 16) + 'px;top:384px;width:32px;height:32px;border-radius:50%;border:3px solid var(--main);box-sizing:border-box\"></span>';\n    for (let d = 0; d < 3; d++) days += '<p class=\"kick\" style=\"position:absolute;left:' + (FA_X0 + d * 3 * FA_DX - 16) + 'px;top:336px;margin:0;font-size:20px\">Day ' + (d + 1) + '</p>';\n    const row = (cls, top, label) => '<div class=\"glass ' + cls + '\" style=\"left:140px;top:' + top + 'px;width:1500px;height:96px;padding:0 30px;display:flex;align-items:center;gap:24px\">' +\n      '<span style=\"width:330px;flex:none;white-space:nowrap;font-size:28px;font-weight:600\">' + label + '</span><span style=\"font-size:24px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">paid so far</span>' +\n      '<span class=\"mono ' + cls + '-v\" style=\"margin-left:auto;font-size:44px;color:var(--accent)\">0.00</span><span style=\"font-size:26px\">USDT</span></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1500px\"><p class=\"kick fa-k\">Funding adds up</p>' +\n      '<h2 class=\"line fa-t\" style=\"font-size:72px\">Small payments, many times</h2></div>' +\n      '<div style=\"position:absolute;left:' + (FA_X0 - 30) + 'px;top:398px;width:' + (8 * FA_DX + 60) + 'px;height:4px;border-radius:2px;background:color-mix(in srgb, var(--second) 14%, transparent)\"></div>' +\n      days + dots + '<p class=\"fa-lab\" style=\"position:absolute;left:140px;top:382px;margin:0;font-size:26px;font-weight:600\">Funding times</p>' +\n      row('fa-a', 460, '1,000 USDT notional') + row('fa-b', 574, '10,000 USDT notional') +\n      '<p class=\"fict fa-f\" style=\"position:absolute;left:140px;top:690px;margin:0\">Fictional rate +0.01%, long · real rates change every period and can be much higher</p>' +\n      '<div class=\"glass fa-m\" style=\"left:1140px;top:160px;width:640px;padding:18px 28px;border-color:var(--accent)\"><p style=\"margin:0;font-size:26px;line-height:1.35;font-weight:600\">Each payment comes out of your <span style=\"color:var(--accent)\">margin balance</span>.</p></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.fa-k').style; this.t = q('.fa-t'); this.dots = all('.fa-dot').map((e) => e.style); this.lab = q('.fa-lab').style;\n    this.rows = [q('.fa-a').style, q('.fa-b').style]; this.va = q('.fa-a-v'); this.vb = q('.fa-b-v'); this.f = q('.fa-f').style; this.m = q('.fa-m').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'writing' }, { t: 0.6, pose: 'explain' }, { t: 5.0, pose: 'checklist' }, { t: 11.1, pose: 'magnify' }, { t: 16.6, pose: 'think' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.lab.opacity = eo(seg(t, 1.0, 1.5));\n    this.dots.forEach((s, i) => {\n      s.opacity = eo(seg(t, 1.2 + i * 0.08, 1.6 + i * 0.08));\n      const hit = seg(t, FA_T0 + i * FA_STEP, FA_T0 + i * FA_STEP + 0.3);\n      s.background = hit > 0 ? 'var(--accent)' : 'transparent';\n      s.borderColor = hit > 0 ? 'var(--accent)' : 'var( , lerp, TextFx } = kit;\n// Concept: the margin-balance gauge sinks to the maintenance line, and the position is force-closed. No numbers for the line.\nconst LQ_TOP = 260, LQ_BOT = 660, LQ_LINE = 600;\nkit.scene('liquidation', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:960px\"><p class=\"kick lq-k\">New word · liquidation</p>' +\n      '<h2 class=\"line lq-t\" style=\"font-size:72px\">A forced closure</h2></div>' +\n      '<div class=\"glass lq-def\" style=\"left:140px;top:320px;width:960px;padding:26px 34px\"><p class=\"def lq-d\" style=\"margin:0\"><b>Liquidation</b> is when the exchange force-closes your position, because your margin balance fell to the maintenance level.</p></div>' +\n      '<div class=\"glass lq-out\" style=\"left:140px;top:530px;width:960px;padding:22px 34px;border-color:var(--accent)\"><p class=\"kick\" style=\"margin:0 0 8px;color:var(--accent)\">What it means for you</p>' +\n      '<p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">You don’t pick the price or the moment. Most or all of the margin can be lost, and a fee may apply.</p></div>' +\n      '<div class=\"glass lq-an\" style=\"left:140px;top:530px;width:960px;padding:22px 34px;display:flex;align-items:center;gap:26px\">' +\n      '<svg width=\"120\" height=\"70\" viewBox=\"0 0 120 70\" style=\"flex:none\"><path d=\"M8 50 L14 30 Q18 20 30 20 L80 20 Q92 20 100 30 L112 40 L112 50 Z\" fill=\"none\" stroke-width=\"4\" stroke-linejoin=\"round\" style=\"stroke:var(--main)\"/><circle cx=\"32\" cy=\"54\" r=\"10\" stroke-width=\"4\" style=\"fill:var(--ground);stroke:var(--main)\"/><circle cx=\"88\" cy=\"54\" r=\"10\" stroke-width=\"4\" style=\"fill:var(--ground);stroke:var(--main)\"/></svg>' +\n      '<p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">Like a rental firm taking the car back early, before the damage passes the depos ).style; this.sd = q('.lq-sd').style; this.stt = q('.lq-stt');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'think' }, { t: 0.6, pose: 'explain' }, { t: 6.2, pose: 'magnify' }, { t: 11.5, pose: 'calm' }, { t: 17.6, pose: 'idea' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(kit, this.def, t, 0.7, 0.7);\n    TextFx.fadeFromRight(this.d, t, 0.9, { stagger: 0.04 });\n    UI.rise(kit, this.g, t, 2.4, 0.7);\n    // 6.6–10.4: the balance sinks to the line; at 10.4 the position is closed.\n    const fall = eio(seg(t, 6.6, 10.4)), full = LQ_BOT - LQ_TOP, h = lerp(full * 0.92, LQ_BOT - LQ_LINE, fall);\n    this.fill.height = h.toFixed(1) + 'px';\n    const shut = t >= 10.4;\n    this.fill.background = shut ? 'color-mix(in srgb, var(--second) 22%, transparent)' : fall > 0.6 ? 'var(--accent)' : 'linear-gradient(0deg, var(--main), color-mix(in srgb, var(--main) 55%, var(--accent)))';\n    this.bl.top = (LQ_BOT - h - 2).toFixed(1) + 'px'; this.bl.opacity = eo(seg(t, 2.8, 3.3)) * (shut ? 0 : 1);\n    UI.set(this.stt, shut ? 'Closed' : 'Open');\n    this.st.borderColor = shut ? 'var(--accent)' : 'color-mix(in srgb, var(--main) 30%, transparent)';\n    this.sd.background = shut ? 'var(--accent)' : 'var(--main)';\n    const sp = seg(t, 10.4, 10.9);\n    this.stamp.opacity = eo(sp); this.stamp.transform = 'rotate(-8deg) scale(' + lerp(1.6, 1, eob(sp, 1.4)).toFixed(3) + ')';\n    UI.rise(kit, this.out, t, 11.5, 0.7, 30, 17.2, 17.6);\n    UI.rise(kit, this.an, t, 17.6, 0.7);\n    this.tutor.render(t);\n  },\n});\n","scene-mark.js":"const { seg, eo, ei, eob, eio, lerp, clamp01, TextFx } = kit;\n// Fictional prices. The last price has one odd spike down at ~14 s; the mark price barely moves. From 20 s both fall.\nconst MK_X = (t) => 1010 + Math.min(t, 23) / 23 * 720, MK_Y = (p) => 420 - (p - 59500) / 1000 * 260;\nkit.scene('mark', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const r = kit.rng(77); this.noise = []; for (let i = 0; i < 240; i++) this.noise.push((r() - 0.5));\n    let grid = '';\n    [59000, 59500, 60000].forEach((p) => { grid += '<line x1=\"1010\" x2=\"1730\" y1=\"' + MK_Y(p) + '\" y2=\"' + MK_Y(p) + '\" style=\"stroke:color-mix(in srgb, var(--second) 8%, transparent);stroke-width:1.5\"/><text x=\"1740\" y=\"' + (MK_Y(p) + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 45%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>'; });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:760px\"><p class=\"kick mk-k\">New word · mark price</p>' +\n      '<h2 class=\"line mk-t\" style=\"font-size:72px\">Mark price</h2></div>' +\n      '<div class=\"glass mk-def\" style=\"left:140px;top:320px;width:760px;padding:26px 34px\"><p class=\"def mk-d\" style=\"margin:0\"><b>Mark price</b> is a reference price the exchange works out, often from several markets. It is usually what liquidation checks use.</p></div>' +\n      '<div class=\"glass mk-note\" style=\"left:140px;top:590px;width:760px;padding:20px 34px\"><p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">It filters out one odd trade. It does <span style=\"color:var(--accent)\">not</span> stop a real crash.</p></div>' +\n      '<div class=\"glass mk-g\" style=\"left:960px;top:170px;width:820px;height:560px\"></div>' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"mk-chart\">' + grid +\n      '<path class=\"mk-last\" fill=\"none\" stroke-width=\"2.5\" stroke-linejoin=\"round\" style=\"stroke:color-mix(in srgb, var(--second) 70%, transparent)\"/>' +\n      '<path class=\"mk-mark\" fill=\"none\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"stroke:var(--main)\"/>' +\n      '<circle class=\"mk-spk\" r=\"16\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--accent)\"/></g>' +\n      '<text x=\"990\" y=\"214\" class=\"fict\" style=\"fill:color-mix(in srgb, var(--second) 45%, var(--ground))\">BTC · fictional · illustrative</text>' +\n      '<g class=\"mk-leg\"><line x1=\"1000\" x2=\"1040\" y1=\"690\" y2=\"690\" stroke-width=\"3\" style=\"stroke:color-mix(in srgb, var(--second) 70%, transparent)\"/><text x=\"1052\" y=\"698\" style=\"fill:var(--second);font-size:24px\">Last trade price</text>' +\n      '<line x1=\"1330\" x2=\"1370\" y1=\"690\" y2=\"690\" stroke-width=\"6\" style=\"stroke:var(--main)\"/><text x=\"1382\" y=\"698\" style=\"fill:var(--second);font-size:24px\">Mark price</text></g></svg>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.mk-k').style; this.t = q('.mk-t'); this.def = q('.mk-def').style; this.d = q('.mk-d'); this.note = q('.mk-note').style;\n    this.g = q('.mk-g').style; this.chart = q('.mk-chart').style; this.leg = q('.mk-leg').style;\n    this.last = q('.mk-last'); this.mark = q('.mk-mark'); this.spk = q('.mk-spk');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'read' }, { t: 6.8, pose: 'present' }, { t: 13.4, pose: 'magnify' }, { t: 19.9, pose: 'calm' }],\n      says: [],\n    });\n  },\n  // Price model: gentle drift; spike only in the last price; crash for both after 20 s.\n  base(s) { return 59850 + Math.sin(s * 0.7) * 60 + Math.sin(s * 1.9) * 25 - 650 * eio(clamp01((s - 20) / 3)); },\n  lastP(s) { const i = Math.min(239, Math.floor(s * 10)); const sp = Math.max(0, 1 - Math.abs(s - 14.0) / 0.45); return this.base(s) + this.noise[i] * 70 - 950 * sp; },\n  markP(s) { const sp = Math.max(0, 1 - Math.abs(s - 14.1) / 0.9); return this.base(s) - 40 * sp; },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise( k').style; this.t = q('.title-t'); this.r = q('.title-r').style; this.s = q('.title-s').style;\n    this.art = q('.t13-art'); this.arc = q('.t13-arc'); this.hand = q('.t13-hand');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: 2080, y: C.y, s: C.s }, { t: 2.6, x: C.x, y: C.y, s: C.s, d: 1.9, ease: (p) => kit.lerp(p, kit.eo(p), 0.5) }],\n      poses: [{ t: 0, pose: 'walk', flip: true }, { t: 2.6, pose: 'present' }],\n      says: [{ t0: 2.9, t1: 7.4, text: 'Know what can close you out.' }],\n    });\n  },\n  render(t) {\n    this.k.opacity = eo(seg(t, -0.6, -0.1));\n    TextFx.fadeFromRight(this.t, t, -0.9);\n    this.r.transformOrigin = '0 50%';\n    this.r.transform = 'scaleX(' + eo(seg(t, 0.2, 0.9)) + ')';\n    this.s.opacity = eo(seg(t, 0.6, 1.1));\n    const c = seg(t, -0.6, 0.6);\n    this.art.setAttribute('transform', 'translate(1380 470) scale(' + (lerp(0.9, 1, eob(c, 1.6)) * (1 + 0.01 * Math.sin(t * 2 * Math.PI / 3.2))).toFixed(4) + ')');\n    this.art.style.opacity = eo(c);\n    this.arc.setAttribute('stroke-dashoffset', (TT_C * 0.62 * eio(seg(t, 0.4, 7.5))).toFixed(1));\n    this.hand.setAttribute('transform', 'rotate(' + (t * 45).toFixed(2) + ')');\n    this.tutor.render(t);\n  },\n});\n","scene-try.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst TY_OPTS = ['Add more leverage to win it back fast', 'Hold on and hope it turns around', 'Reduce exposure or close, then wait'];\nconst TY_OK = 2, TY_BAD = 0, TY_R = 12.2, TY_N = 17.9;\nkit.scene('try', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let rows = '';\n    TY_OPTS.forEach((o, i) => {\n      const mark = i === TY_OK ? '<path class=\"ty-ok\" d=\"M10 23 L19 32 L35 13\" pathLength=\"1\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--main)\"/>'\n        : i === TY_BAD ? '<path class=\"ty-no\" d=\"M13 13 L31 31 M31 13 L13 31\" pathLength=\"1\" fill=\"none\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"stroke:var(--accent)\"/>' : '';\n      rows += '<div class=\"ty-o\" style=\"display:flex;align-items:center;gap:22px;padding:12px 22px;border-radius:20px;border:2px solid color-mix(in srgb, var(--second) 14%, transparent);background:color-mix(in srgb, var(--ground) 90%, var(--main))\">' +\n        '<span class=\"ty-l mono\" style=\"width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:26px;border:2px solid color-mix(in srgb, var(--main) 45%, transparent)\">' + 'ABC'[i] + '</span>' +\n        '<span style=\"font-size:30px;font-weight:600;flex:1\">' + o + '</span><svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" style=\"flex:none\">' + mark + '</svg></div>';\n    });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:160px;width:1000px\"><p class=\"kick ty-k\">Your turn · scenario</p>' +\n      '<h2 class=\"line ty-t\" style=\"font-size:72px\">What would you do?</h2></div>' +\n      '<div class=\"glass ty-q\" style=\"left:140px;top:300px;width:1060px;padding:22px 34px\"><p class=\"fict\" style=\"margin:0 0 8px\">Fictional scenario · demo only</p>' +\n      '<p style=\"margin:0;font-size:30px;line-height:1.4;font-weight:600\">You hold a 10x long. BTC swings hard before big news. Your margin buffer is small, and you are unsure.</p></div>' +\n      '<div style=\"position:absolute;left:140px;top:470px;width:1060px;display:flex;flex-direction:column;gap:12px\">' + rows + '</div>' +\n      '<div class=\"glass ty-why\" style=\"left:1260px;top:300px;width:520px;padding:22px 30px;display:flex;flex-direction:column;gap:16px\">' +\n      '<div><p class=\"kick\" style=\"margin:0 0 6px\">Why C</p><p style=\"margin:0;font-size:28px;line-height:1.35;font-weight:600\">Less exposure means less to lose. Waiting, or no trade, is a real decision.</p></div>' +\n      '<div class=\"ty-w2\"><p class=\"kick\" style=\"margin:0 0 6px;color:var(--accent)\">Why not A</p><p style=\"margin:0;font-size:28px;line-height:1.35;font-weight:600\">More leverage makes the next move hit harder.</p></div></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.ty-k').style; this.t = q('.ty-t'); this.qc = q('.ty-q').style; this.why = q('.ty-why').style; this.w2 = q('.ty-w2').style;\n    this.os = all('.ty-o').map((e) => e.style); this.ls = all('.ty-l').map((e) => e.style); this.ok = q('.ty-ok'); this.no = q('.ty-no');\n    this.ring = UI.ring(kit, 1500, 450, 100, 6.4, 7.0, 5, TY_R, 'Pause to think');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'read' }, { t: 7.0, pose: 'think' }, { t: TY_R, pose: 'cheer' }, { t: TY_R + 2.2, pose: 'explain' }, { t: TY_N, pose: 'calm' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(kit, this.qc, t, 0.6, 0.7);\n    const rv = eo(seg(t, TY_R, TY_R + 0.5)), nb = eo(seg(t, TY_N, TY_N + 0.5));\n    const mix = (c, p, base) => 'color-mix(in srgb, ' + c + ' ' + (base + (100 - base) * p).toFixed(0) + '%, transparent)';\n    this.os.forEach((s, i) => {\n      const a = 2.0 + i * 0.3, p = eo(seg(t, a, a + 0.5)), good = i === TY_OK, tempt = i === TY_BAD;\n      const dim = good ? 1 : tempt ? lerp(lerp(1, 0.5, rv), 1, nb) : lerp(1, 0.4, rv);\n      s.opacity = (eo(seg(t, a, a + 0.3)) * dim).toFixed(3);\n      s.transform = 'translateX(' + lerp(30, 0, p).toFixed(1) + 'px) scale(' + (good ? 1 + 0.02 * rv : 1).toFixed(4) + ')';\n      s.transformOrigin = '0 50%';\n      if (good) { s.borderColor = mix('var(--main)', rv, 14); s.background = 'color-mix(in srgb, var(--ground) ' + lerp(90, 74, rv).toFixed(0) + '%, var(--main))'; this.ls[i].background = rv > 0.5 ? 'var(--main)' : 'transparent'; this.ls[i].color = rv > 0.5 ? 'var(--ground)' : 'var(--second)'; }\n      if (tempt) s.borderColor = nb > 0 ? mix('var(--accent)', nb, 14) : mix('var(--second)', 0, 14);\n    });\n    const po = seg(t, TY_R + 0.2, TY_R + 0.7), pn = seg(t, TY_N + 0.1, TY_N + 0.6);\n    this.ok.setAttribute('stroke-dasharray', eo(po).toFixed(3) + ' 1'); this.ok.style.opacity = po > 0 ? 1 : 0;\n    this.no.setAttribute('stroke-dasharray', eo(pn).toFixed(3) + ' 1'); this.no.style.opacity = pn > 0 ? 1 : 0;\n    const wp = seg(t, TY_R + 0.3, TY_R + 0.9);\n    this.why.opacity = eo(wp); this.why.transform = 'translateY(' + lerp(24, 0, eo(wp)).toFixed(1) + 'px)';\n    this.w2.opacity = nb;\n    this.ring(t);\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson thirteen\",\n      \"dur\": 8,\n      \"desc\": \"Title card: Phase 3, lesson T13, Liquidation, Funding and Futures Risks; a margin-buffer ring drains while a funding clock ticks; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"Closed for you\",\n      \"dur\": 18,\n      \"desc\": \"Educational mock: a 10x long's margin balance sinks and the position card flips from Open to Closed by the exchange.\"\n    },\n    {\n      \"id\": \"buffer\",\n      \"name\": \"Your margin buffer\",\n      \"dur\": 22,\n      \"desc\": \"Margin balance = margin + unrealized PnL: 10x long, 100 USDT margin, 1,000 notional; BTC falls 1%, 3%, 5% and the buffer shrinks to 90, 70, 50 toward an unnumbered maintenance level.\"\n    },\n    {\n      \"id\": \"liquidation\",\n      \"name\": \"Liquidation\",\n      \"dur\": 24,\n      \"desc\": \"Liquidation defined as forced closure when the margin balance reaches the maintenance level; the bar touches the line and the position is stamped closed; conceptual, not an exchange formula.\"\n    },\n    {\n      \"id\": \"room\",\n      \"name\": \"Leverage and room\",\n      \"dur\": 21,\n      \"desc\": \"Same 1,000 USDT position at 10x (100 margin) and 4x (250 margin); a 5% fall costs 50 USDT in both, leaving 50 of 100 versus 200 of 250; more room is not safety.\"\n    },\n    {\n      \"id\": \"mark\",\n      \"name\": \"Mark price\",\n      \"dur\": 24,\n      \"desc\": \"Mark price defined; a one-off spike in the last price barely moves the smoother mark price line; liquidation checks usually use mark price.\"\n    },\n    {\n      \"id\": \"funding\",\n      \"name\": \"Funding\",\n      \"dur\": 24,\n      \"desc\": \"Funding rate defined for perpetual futures; a clock reaches the funding time and 0.10 USDT flows from longs to shorts (1,000 x 0.01%); the arrow flips for a negative rate.\"\n    },\n    {\n      \"id\": \"fundadd\",\n      \"name\": \"Funding adds up\",\n      \"dur\": 21,\n      \"desc\": \"Nine funding times over three days: 0.90 USDT at 1,000 notional, 9 USDT at 10,000; it comes out of the margin balance.\"\n    },\n    {\n      \"id\": \"gap\",\n      \"name\": \"Gap risk\",\n      \"dur\": 23,\n      \"desc\": \"A stop at 59,000; news makes price jump from 59,600 straight to 58,300; the stop triggers but fills near 58,300.\"\n    },\n    {\n      \"id\": \"stop\",\n      \"name\": \"Common mistake\",\n      \"dur\": 23,\n      \"desc\": \"Misconception: a stop-loss protects from liquidation. A high-leverage position's liquidation zone sits above a far stop; price reaches liquidation first. A stop-loss is not liquidation insurance.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 24,\n      \"desc\": \"Scenario: wild swings before news, small buffer, unsure. Choices: add leverage, hold and hope, reduce or close and wait. Countdown; answer C.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the risks\",\n      \"dur\": 27,\n      \"desc\": \"Liquidation, funding, gaps and slippage, no guaranteed safe strategy; reduce exposure or NO_TRADE when unsure.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 29,\n      \"desc\": \"Three key points and a check question: a stop-loss cannot guarantee you will not be liquidated.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: Phase 3 complete; next, Checkpoint A, reviewing T01 to T13.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // No voice: the music is the only sound. Soft pad and keys, a light pulse in the hands-on parts, quieter in the risk parts.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.buffer, T.liquidation) || inR(s, T.funding, T.fundadd) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.liquidation, T.room) || inR(s, T.gap, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 36 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 50 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  S.fx('thud', T.title + 0.6, { vel: 26 }); S.fx('pop', T.title + 1.6, { vel: 30, pitch: 7 }); S.fx('pop', T.title + 2.9, { vel: 26, pitch: 7 });\n  // Hook: the line falls, the position closes, the toast.\n  S.fx('whoosh', T.hook + 0.8, { dur: 4.0, vel: 18 }); S.fx('thud', T.hook + 5.0, { vel: 34 }); S.fx('pop', T.hook + 5.4, { vel: 30, pitch: 5 });\n  // Buffer: three falls.\n  S.fx('pop', T.buffer + 0.7, { vel: 26, pitch: 7 }); S.fx('pop', T.buffer + 6.1, { vel: 26, pitch: 7 });\n  [11.3, 12.9, 14.5].forEach((a, i) => S.fx('tick', T.buffer + a, { vel: 30 + i * 3 }));\n  S.fx('chime', T.buffer + 16.4, { vel: 28 });\n  // Liquidation: the gauge sinks, the stamp.\n  S.fx('whoosh', T.liquidation + 6.6, { dur: 3.8, vel: 18 }); S.fx('thud', T.liquidation + 10.4, { vel: 40 });\n  S.fx('pop', T.liquidation + 11.5, { vel: 26, pitch: 5 }); S.fx('pop', T.liquidation + 17.6, { vel: 26, pitch: 7 });\n  // Room.\n  S.fx('pop', T.room + 3.9, { vel: 28, pitch: 7 }); S.fx('pop', T.room + 5.3, { vel: 28, pitch: 7 }); S.fx('thud', T.room + 10.6, { vel: 30 }); S.fx('pop', T.room + 15.2, { vel: 30, pitch: 5 });\n  // Mark price: the spike.\n  S.fx('pop', T.mark + 2.4, { vel: 26, pitch: 7 }); S.fx('whoosh', T.mark + 13.7, { dur: 0.6, vel: 26 }); S.fx('ding', T.mark + 14.4, { vel: 30 });\n  S.fx('pop', T.mark + 19.9, { vel: 26, pitch: 5 });\n  // Funding: the clock ticks to funding time; payments.\n  for (let i = 0; i < 8; i++) S.fx('tick', T.funding + 7.8 + i * 0.52, { vel: 22 });\n  S.fx('chime', T.funding + 12.0, { vel: 38 }); S.fx('whoosh', T.funding + 14.4, { dur: 1.2, vel: 22 }); S.fx('pop', T.funding + 15.6, { vel: 32, pitch: 7 });\n  S.fx('whoosh', T.funding + 16.9, { dur: 1.2, vel: 22 }); S.fx('pop', T.funding + 18.1, { vel: 32, pitch: 9 }); S.fx('pop', T.funding + 19.3, { vel: 28, pitch: 7 });\n  // Funding adds up: nine payments, then the 10,000 row.\n  for (let i = 0; i < 9; i++) S.fx('tick', T.fundadd + 5.4 + i * 0.55, { vel: 28 });\n  S.fx('pop', T.fundadd + 11.1, { vel: 30, pitch: 7 }); S.fx('ding', T.fundadd + 13.4, { vel: 32 }); S.fx('pop', T.fundadd + 16.6, { vel: 28, pitch: 5 });\n  // Gap.\n  S.fx('thud', T.gap + 9.6, { vel: 40 }); S.fx('pop', T.gap + 13.2, { vel: 30, pitch: 5 }); S.fx('pop', T.gap + 18.8, { vel: 26, pitch: 5 });\n  // Stop vs liquidation.\n  S.fx('pop', T.stop + 2.6, { vel: 26, pitch: 7 }); S.fx('pop', T.stop + 5.8, { vel: 26, pitch: 5 }); S.fx('thud', T.stop + 12.0, { vel: 40 });\n  S.fx('whoosh', T.stop + 16.4, { dur: 0.6, vel: 24 }); S.fx('chime', T.stop + 16.8, { vel: 30 });\n  // Try it.\n  S.fx('pop', T.try + 0.6, { vel: 28, pitch: 7 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 7.0 + i, { vel: 30 });\n  S.fx('chime', T.try + 12.2, { vel: 42 }); S.fx('pop', T.try + 17.9, { vel: 30, pitch: 5 });\n  [4.5, 10.5, 15.9, 20.2].forEach((a) => S.fx('pop', T.risks + a, { vel: 28 }));\n  [2.0, 8.4, 14.2].forEach((a) => S.fx('pop', T.recap + a + 0.5, { vel: 34 }));\n  S.fx('ding', T.recap + 24.7, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 22, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T13 · Liquidation, funding and futures risks',\n  TOTAL: 298,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0  M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n};\n","tutor.json":"{\n  \"present\": {\n    \"w\": 546,\n    \"h\": 612,\n    \"ax\": 218,\n    \"feet\": 605,\n    \"bw\": 421\n  },\n  \"explain\": {\n    \"w\": 502,\n    \"h\": 602,\n    \"ax\": 275,\n    \"feet\": 594,\n    \"bw\": 394\n  },\n  \"think\": {\n    \"w\": 465,\n    \"h\": 656,\n    \"ax\": 229,\n    \"feet\": 648,\n    \"bw\": 452\n  },\n  \"point\": {\n    \"w\": 547,\n    \"h\": 568,\n    \"ax\": 210,\n    \"feet\": 561,\n    \"bw\": 415\n  },\n  \"thumbs\": {\n    \"w\": 181,\n    \"h\": 179,\n    \"ax\": 102.0,\n    \"feet\": 172,\n    \"bw\": 138\n  },\n  \"idea\": {\n    \"w\": 169,\n    \"h\": 178,\n    \"ax\": 69.5,\n    \"feet\": 171,\n    \"bw\": 138\n  },\n  \"read\": {\n    \"w\": 190,\n    \"h\": 181,\n    \"ax\": 82.5,\n    \"feet\": 175,\n    \"bw\": 138\n  },\n  \"magnify\": {\n    \"w\": 187,\n    \"h\": 170,\n    \"ax\": 85.5,\n    \"feet\": 163,\n
