<script>window.FILM = {"id":"T19","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson nineteen","dur":10,"k":1,"oldStart":0,"oldDur":10},{"id":"hook","name":"From reading to deciding","dur":19.04,"k":1.19,"oldStart":10,"oldDur":16},{"id":"define","name":"Scalping","dur":24.42,"k":1.11,"oldStart":26,"oldDur":22},{"id":"chart","name":"A short trade","dur":31.36,"k":1.12,"oldStart":48,"oldDur":28},{"id":"fees","name":"The costs","dur":45.36,"k":1.89,"oldStart":76,"oldDur":24},{"id":"frequency","name":"Trade frequency","dur":26.62,"k":1.21,"oldStart":100,"oldDur":22},{"id":"execution","name":"Execution quality","dur":20,"k":1,"oldStart":122,"oldDur":20},{"id":"compare","name":"Scalping vs holding longer","dur":22.88,"k":1.04,"oldStart":142,"oldDur":22},{"id":"horizon","name":"XORA's 10–15 minutes","dur":20,"k":1,"oldStart":164,"oldDur":20},{"id":"whennot","name":"When not to trade","dur":22,"k":1,"oldStart":184,"oldDur":22},{"id":"try","name":"Try it","dur":39.16,"k":1.78,"oldStart":206,"oldDur":22},{"id":"risks","name":"Know the limits","dur":22,"k":1,"oldStart":228,"oldDur":22},{"id":"recap","name":"Recap","dur":40.8,"k":1.36,"oldStart":250,"oldDur":30},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":280,"oldDur":10}],"voice":{"src":"T19/voice.mp3","lines":[{"t":0.6,"d":4.445,"text":"Lesson nineteen, and the start of Phase 5: scalping and risk management.","ml":"പാഠം പത്തൊൻപത്, Phase 5-ന്റെ തുടക്കം: scalping-ഉം റിസ്ക് മാനേജ്മെന്റും."},{"t":6.3,"d":1.961,"text":"First question: what is scalping?","ml":"ആദ്യ ചോദ്യം: scalping എന്താണ്?"},{"t":10.714,"d":4.919,"text":"So far you've learned to read candles, timeframes, trends, zones and volume.","ml":"ഇതുവരെ നിങ്ങൾ candles, timeframes, ട്രെൻഡുകൾ, zone-കൾ, volume എന്നിവ വായിക്കാൻ പഠിച്ചു."},{"t":17.735,"d":4.112,"text":"Now: how do short-term traders use them? And what does it really cost?","ml":"ഇനി: ഹ്രസ്വകാല ട്രേഡർമാർ ഇവ എങ്ങനെ ഉപയോഗിക്കുന്നു? ശരിക്കും എത്ര ചെലവുണ്ട്?"},{"t":24.399,"d":4.24,"text":"Let's look honestly, costs and all.","ml":"ചെലവുകൾ ഉൾപ്പെടെ, സത്യസന്ധമായി നോക്കാം."},{"t":29.706,"d":2.275,"text":"Scalping means trying to profit from small price moves, in trades that last minutes.","ml":"ചെറിയ വിലനീക്കങ്ങളിൽ നിന്ന് ലാഭം നേടാനുള്ള ശ്രമമാണ് scalping. ട്രേഡുകൾ മിനിറ്റുകൾ മാത്രം."},{"t":36.81,"d":4.603,"text":"Sometimes only seconds. Then the trader exits and waits for the next one.","ml":"ചിലപ്പോൾ സെക്കൻഡുകൾ മാത്രം. പിന്നെ ട്രേഡർ പുറത്തിറങ്ങി അടുത്തതിനായി കാത്തിരിക്കും."},{"t":43.248,"d":3.942,"text":"Think of a stall that makes many small sales, each with a thin margin.","ml":"ഓരോന്നിലും ചെറിയ ലാഭം മാത്രമുള്ള, ഒരുപാട് ചെറിയ വിൽപ്പനകൾ നടത്തുന്ന ഒരു കട പോലെ."},{"t":49.353,"d":3.683,"text":"Thin margins mean costs matter a lot.","ml":"ലാഭം നേർത്തതായതിനാൽ ചെലവുകൾ വളരെ പ്രധാനമാണ്."},{"t":54.132,"d":2.353,"text":"Here's a fictional 15-minute chart of 1-minute candles.","ml":"ഇതാ 1-മിനിറ്റ് candles ഉള്ള ഒരു സാങ്കൽപ്പിക 15-മിനിറ്റ് ചാർട്ട്."},{"t":59.284,"d":3.115,"text":"A scalper might notice two things. These are observations, not signals.","ml":"ഒരു scalper രണ്ട് കാര്യങ്ങൾ ശ്രദ്ധിച്ചേക്കാം. ഇവ നിരീക്ഷണങ്ങളാണ്, സിഗ്നലുകളല്ല."},{"t":65.668,"d":4.368,"text":"One: price dips to a support zone and holds. Two: a sudden spike on thin volume.","ml":"ഒന്ന്: വില support zone-ൽ പിടിച്ചുനിൽക്കുന്നു. രണ്ട്: കുറഞ്ഞ volume-ൽ ഒരു കുതിപ്പ്."},{"t":72.5,"d":5.567,"text":"Say a demo long opens at 60,000 and closes 4 minutes later at 60,120.","ml":"ഒരു ഡെമോ long 60,000-ൽ തുറന്ന്, 4 മിനിറ്റിന് ശേഷം 60,120-ൽ അടയ്ക്കുന്നു എന്ന് കരുതുക."},{"t":78.772,"d":5.615,"text":"Held for 4 minutes. Price move: +120 USDT. It could have failed.","ml":"4 മിനിറ്റ് കൈവശം വെച്ചു. വിലനീക്കം: +120 USDT. ഇത് പരാജയപ്പെടാമായിരുന്നു."},{"t":85.954,"d":5.136,"text":"Now the costs. The position is 0.1 BTC: 6,000 USDT at 60,000.","ml":"ഇനി ചെലവുകൾ. പൊസിഷൻ 0.1 BTC: 60,000-ൽ 6,000 USDT."},{"t":95.593,"d":7.351,"text":"Gross profit: 0.1 × 120 = 12.00 USDT.","ml":"മൊത്ത ലാഭം: 0.1 × 120 = 12.00 USDT."},{"t":103.494,"d":5.185,"text":"Fees at an example 0.05% each side: 3.00 to enter, 3.01 to exit.","ml":"ഓരോ വശത്തും ഉദാഹരണമായി 0.05% ഫീസ്: കയറാൻ 3.00, ഇറങ്ങാൻ 3.01."},{"t":111.847,"d":6.355,"text":"Net: 12.00 − 3.00 − 3.01 = 5.99 USDT. Half the move went to fees.","ml":"അറ്റ ലാഭം: 12.00 − 3.00 − 3.01 = 5.99 USDT. നീക്കത്തിന്റെ പകുതി ഫീസിന് പോയി."},{"t":121.864,"d":7.432,"text":"A losing scalp pays fees too, so the loss gets bigger.","ml":"നഷ്ടത്തിലായ scalp-ഉം ഫീസ് കൊടുക്കണം, അതുകൊണ്ട് നഷ്ടം വലുതാകും."},{"t":130.906,"d":3.46,"text":"Trade frequency is how many trades you make in a period.","ml":"ഒരു സമയപരിധിയിൽ നിങ്ങൾ എത്ര ട്രേഡുകൾ ചെയ്യുന്നു എന്നതാണ് trade frequency."},{"t":136.593,"d":2.921,"text":"Each round trip here costs about 6 USDT in fees.","ml":"ഇവിടെ ഓരോ round trip-നും ഏകദേശം 6 USDT ഫീസ്."},{"t":141.554,"d":3.567,"text":"Twenty trades in a day: about 120 USDT in fees, win or lose.","ml":"ഒരു ദിവസം ഇരുപത് ട്രേഡുകൾ: ഏകദേശം 120 USDT ഫീസ്, ലാഭമായാലും നഷ്ടമായാലും."},{"t":147.483,"d":5.601,"text":"And every trade is one more chance to be wrong.","ml":"ഓരോ ട്രേഡും തെറ്റാനുള്ള ഒരു അവസരം കൂടിയാണ്."},{"t":153.634,"d":2.729,"text":"More trades is not more profit.","ml":"കൂടുതൽ ട്രേഡ് എന്നാൽ കൂടുതൽ ലാഭമല്ല."},{"t":157.4,"d":2.03,"text":"Execution quality is how close your fill is to the price you expected.","ml":"നിങ്ങൾ പ്രതീക്ഷിച്ച വിലയോട് എത്ര അടുത്താണ് നിങ്ങളുടെ fill എന്നതാണ് execution quality."},{"t":163,"d":3.824,"text":"Say you slip 10 USDT getting in and 10 getting out.","ml":"കയറുമ്പോൾ 10 USDT-ഉം ഇറങ്ങുമ്പോൾ 10-ഉം slip ആകുന്നു എന്ന് കരുതുക."},{"t":167.374,"d":3.911,"text":"Our 120 move shrinks to 100, before fees.","ml":"നമ്മുടെ 120-ന്റെ നീക്കം 100 ആയി ചുരുങ്ങുന്നു, ഫീസിന് മുമ്പേ."},{"t":171.835,"d":3.401,"text":"When moves are small, spread and slippage take a big share.","ml":"നീക്കങ്ങൾ ചെറുതാകുമ്പോൾ, spread-ഉം slippage-ഉം വലിയൊരു ഭാഗം എടുക്കും."},{"t":177.424,"d":3.477,"text":"How does scalping compare with holding for days or weeks?","ml":"ദിവസങ്ങളോ ആഴ്ചകളോ കൈവശം വെക്കുന്നതുമായി scalping എങ്ങനെ വ്യത്യാസപ്പെടുന്നു?"},{"t":182.312,"d":3.125,"text":"Scalping: minutes, many trades, costs are a big share of each small move.","ml":"Scalping: മിനിറ്റുകൾ, ഒരുപാട് ട്രേഡുകൾ, ഓരോ ചെറിയ നീക്കത്തിലും ചെലവ് വലിയൊരു ഭാഗം."},{"t":188.344,"d":4.548,"text":"Longer holding: fewer trades, bigger moves, but more time exposed to news.","ml":"കൂടുതൽ നേരം കൈവശം: കുറച്ച് ട്രേഡുകൾ, വലിയ നീക്കങ്ങൾ, പക്ഷേ വാർത്തകളുടെ റിസ്ക് കൂടുതൽ നേരം."},{"t":194.48,"d":4.777,"text":"Neither is safe. Both can lose money.","ml":"രണ്ടും സുരക്ഷിതമല്ല. രണ്ടിലും പണം നഷ്ടപ്പെടാം."},{"t":200.28,"d":2.325,"text":"A note on XORA. It looks at about 10 to 15 minutes of recent price for context.","ml":"XORA-യെക്കുറിച്ച്: സാഹചര്യത്തിനായി അത് ഏകദേശം 10 മുതൽ 15 മിനിറ്റ് വരെയുള്ള വില നോക്കും."},{"t":206.58,"d":4.794,"text":"That is an analysis horizon. It is not a time you must hold a trade.","ml":"അതൊരു analysis horizon ആണ്. നിർബന്ധമായും ട്രേഡ് കൈവശം വെക്കേണ്ട സമയമല്ല."},{"t":212.08,"d":4.073,"text":"And it is not a promise of where price will be in 15 minutes.","ml":"15 മിനിറ്റിൽ വില എവിടെയായിരിക്കും എന്നതിന്റെ ഉറപ്പുമല്ല."},{"t":220.28,"d":3.165,"text":"Some moments are simply not good for trading.","ml":"ചില സമയങ്ങൾ ട്രേഡിങ്ങിന് പറ്റിയതല്ല."},{"t":224.18,"d":2.596,"text":"Very thin markets. Wild news spikes. Fees bigger than the expected move.","ml":"വളരെ നേർത്ത മാർക്കറ്റ്. വാർത്തയിലെ വലിയ കുതിപ്പ്. പ്രതീക്ഷിച്ച നീക്കത്തേക്കാൾ വലിയ ഫീസ്."},{"t":229.88,"d":4.798,"text":"No clear reason, no stop, or you're tired, upset or chasing a loss.","ml":"കാരണമില്ല, stop ഇല്ല, അല്ലെങ്കിൽ ക്ഷീണം, ദേഷ്യം, നഷ്ടം തിരിച്ചുപിടിക്കാനുള്ള ഓട്ടം."},{"t":235.28,"d":4.857,"text":"In all of these, NO_TRADE is the right call. Waiting is a skill.","ml":"ഇവയിലെല്ലാം NO_TRADE ആണ് ശരിയായ തീരുമാനം. കാത്തിരിക്കുന്നതും ഒരു കഴിവാണ്."},{"t":242.748,"d":4.023,"text":"Your turn. A scalp's expected move is 60 USDT per BTC, at a price of 60,000.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. ഒരു scalp-ൽ പ്രതീക്ഷിക്കുന്ന നീക്കം ഒരു BTC-ക്ക് 60 USDT, വില 60,000."},{"t":253.428,"d":6.728,"text":"Round-trip fees are 0.10%. Is it worth taking? Pause and think.","ml":"Round-trip ഫീസ് 0.10%. ഈ ട്രേഡ് എടുക്കണോ? Pause ചെയ്ത് ആലോചിക്കൂ."},{"t":262.328,"d":5.375,"text":"Fees: 60,000 × 0.10% = 60 USDT per BTC. The move only covers the fees.","ml":"ഫീസ്: 60,000 × 0.10% = ഒരു BTC-ക്ക് 60 USDT. നീക്കം ഫീസിന് മാത്രമേ തികയൂ."},{"t":272.296,"d":8.134,"text":"Even before slippage, it's zero. NO_TRADE makes sense.","ml":"Slippage-ന് മുമ്പേ തന്നെ ബാക്കി പൂജ്യം. NO_TRADE ആണ് ശരി."},{"t":281.44,"d":3.801,"text":"Before you try scalping, even in demo, know the limits.","ml":"Scalping പരീക്ഷിക്കുന്നതിന് മുമ്പ്, ഡെമോയിൽ ആണെങ്കിലും, അതിന്റെ പരിധികൾ അറിയുക."},{"t":286.04,"d":3.249,"text":"It is not easy money. Many small losses and fees add up fast.","ml":"ഇത് എളുപ്പത്തിലുള്ള പണമല്ല. ചെറിയ നഷ്ടങ്ങളും ഫീസും വേഗം കുമിഞ്ഞുകൂടും."},{"t":291.04,"d":4.133,"text":"Fast decisions bring mistakes, and leverage makes every loss bigger.","ml":"വേഗത്തിലുള്ള തീരുമാനങ്ങൾ തെറ്റുകൾ വരുത്തും, leverage ഓരോ നഷ്ടവും വലുതാക്കും."},{"t":296.54,"d":3.938,"text":"Practise in demo first. NO_TRADE is always allowed.","ml":"ആദ്യം ഡെമോയിൽ പരിശീലിക്കുക. NO_TRADE എപ്പോഴും അനുവദനീയമാണ്."},{"t":303.656,"d":3.392,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":307.598,"d":0.823,"text":"Scalping aims for small moves in short trades: seconds to minutes.","ml":"ചെറിയ ട്രേഡുകളിൽ ചെറിയ നീക്കങ്ങൾ ലക്ഷ്യമിടുന്നതാണ് scalping: സെക്കൻഡ് മുതൽ മിനിറ്റ് വരെ."},{"t":313.72,"d":4.021,"text":"Fees, spread and slippage take a big share of small moves.","ml":"ചെറിയ നീക്കങ്ങളുടെ വലിയൊരു ഭാഗം ഫീസ്, spread, slippage എന്നിവ എടുക്കും."},{"t":320.52,"d":3.7,"text":"XORA's 10 to 15 minutes is context, not a holding rule. NO_TRADE is allowed.","ml":"XORA-യുടെ 10 മുതൽ 15 മിനിറ്റ് സാഹചര്യമാണ്, കൈവശം വെക്കാനുള്ള നിയമമല്ല. NO_TRADE അനുവദനീയം."},{"t":328.952,"d":5.226,"text":"Check yourself: a move of 60 USDT per BTC, fees of 60. Worth it?","ml":"സ്വയം പരിശോധിക്കൂ: ഒരു BTC-ക്ക് 60 USDT നീക്കം, ഫീസ് 60. എടുക്കണോ?"},{"t":336.16,"d":5.702,"text":"No. It only covers fees, before slippage. Waiting is the better call.","ml":"വേണ്ട. Slippage-ന് മുമ്പേ അത് ഫീസിന് മാത്രമേ തികയൂ. കാത്തിരിക്കുന്നതാണ് നല്ലത്."},{"t":344.24,"d":4.374,"text":"Well done! Next up: evaluating an entry opportunity. See you in lesson twenty.","ml":"നന്നായി! അടുത്തത്: ഒരു entry അവസരം എങ്ങനെ വിലയിരുത്താം. പാഠം ഇരുപതിൽ കാണാം."}]},"assetBase":"T19/assets/","assets":{"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"xtinex-x.png":{"mime":"image/png","w":320,"h":205}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1 tter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T19 captions, written as a warm tutor speaking; each line starts at film time t (seconds). Can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson nineteen, and the start of Phase 5: scalping and risk management.\"\n    },\n    {\n      \"t\": 6.3,\n      \"text\": \"First question: what is scalping?\"\n    },\n    {\n      \"t\": 10.6,\n      \"text\": \"So far you've learned to read candles, timeframes, trends, zones and volume.\"\n    },\n    {\n      \"t\": 16.5,\n      \"text\": \"Now: how do short-term traders use them? And what does it really cost?\"\n    },\n    {\n      \"t\": 22.1,\n      \"text\": \"Let's look honestly, costs and all.\"\n    },\n    {\n      \"t\": 26.6,\n      \"text\": \"Scalping means trying to profit from small price moves, in trades that last minutes.\"\n    },\n    {\n      \"t\": 33.0,\n      \"text\": \"Sometimes only seconds. Then the trader exits and waits for the next one.\"\n    },\n    {\n      \"t\": 38.8,\n      \"text\": \"Think of a stall that makes many small sales, each with a thin margin.\"\n    },\n    {\n      \"t\": 44.3,\n      \"text\": \"Thin margins mean costs matter a lot.\"\n    },\n    {\n      \"t\": 48.6,\n      \"text\": \"Here's a fictional 15-minute chart of 1-minute candles.\"\n    },\n    {\n      \"t\": 53.2,\n      \"text\": \"A scalper might notice two things. These are observations, not signals.\"\n    },\n    {\n      \"t\": 58.9,\n      \"text\": \"One: price dips to a support zone and holds. Two: a sudden spike on thin volume.\"\n    },\n    {\n      \"t\": 65.0,\n      \"text\": \"Say a demo long opens at 60,000 and closes 4 minutes later at 60,120.\"\n    },\n    {\n      \"t\": 70.6,\n      \"text\": \"Held for 4 minutes. Price move: +120 USDT. It could have failed.\"\n    },\n    {\n      \"t\": 76.6,\n      \"text\": \"Now the costs. The position is 0.1 BTC: 6,000 USDT at 60,000.\"\n    },\n    {\n      \"t\": 81.7,\n      \"text\": \"Gross profit: 0.1 × 120 = 12.00 USDT.\"\n    },\n    {\n      \"t\": 85.1,\n      \"text\": \"Fees at an example 0.05% each side: 3.00 to enter, 3.01 to exit.\"\n    },\n    {\n      \"t\": 90.3,\n      \"text\": \"Net: 12.00 − 3.00 − 3.01 = 5.99 USDT. Half the move went to fees.\"\n    },\n    {\n      \"t\": 95.6,\n      \"text\": \"A losing scalp pays fees too, so the loss gets bigger.\"\n    },\n    {\n      \"t\": 100.6,\n      \"text\": \"Trade frequency is how many trades you make in a period.\"\n    },\n    {\n      \"t\": 105.3,\n      \"text\": \"Each round trip here costs about 6 USDT in fees.\"\n    },\n    {\n      \"t\": 109.4,\n      \"text\": \"Twenty trades in a day: about 120 USDT in fees, win or lose.\"\n    },\n    {\n      \"t\": 114.3,\n      \"text\": \"And every trade is one more chance to be wrong.\"\n    },\n    {\n      \"t\": 118.3,\n      \"text\": \"More trades is not more profit.\"\n    },\n    {\n      \"t\": 122.6,\n      \"text\": \"Execution quality is how close your fill is to the price you expected.\"\n    },\n    {\n      \"t\": 128.2,\n      \"text\": \"Say you slip 10 USDT getting in and 10 getting out.\"\n    },\n    {\n      \"t\": 132.5,\n      \"text\": \"Our 120 move shrinks to 100, before fees.\"\n    },\n    {\n      \"t\": 136.1,\n      \"text\": \"When moves are small, spread and slippage take a big share.\"\n    },\n    {\n      \"t\": 142.6,\n      \"text\": \"How does scalping compare with holding for days or weeks?\"\n    },\n    {\n      \"t\": 147.3,\n      \"text\": \"Scalping: minutes, many trades, costs are a big share of each small move.\"\n    },\n    {\n      \"t\": 153.1,\n      \"text\": \"Longer holding: fewer trades, bigger moves, but more time exposed to news.\"\n    },\n    {\n      \"t\": 159.0,\n      \"text\": \"Neither is safe. Both can lose money.\"\n    },\n    {\n      \"t\": 164.6,\n      \"text\": \"A note on XORA. It looks at about 10 to 15 minutes of recent price for context.\"\n    },\n    {\n      \"t\": 170.9,\n      \"text\": \"That is an analysis horizon. It is not a time you must hold a trade.\"\n    },\n    {\n      \"t\": 176.4,\n      \"text\": \"And it is not a promise of where price will be in 15 minutes.\"\n    },\n    {\n      \"t\": 184.6,\n      \"text\": \"Some moments are simply not good for trading.\"\n    },\n    {\n      \"t\": 188.5,\n      \"text\": \"Very thin markets. Wild news spikes. Fees bigger than the expected move.\"\n    },\n    {\n      \"t\": 194.2,\n      \"text\": \"No clear reason, no stop, or you're tired, upset or chasing a loss.\"\n    },\n    {\n      \"t\": 199.6,\n      \"text\": \"In all of these, NO_TRADE is the right call. Waiting is a skill.\"\n    },\n    {\n      \"t\": 206.6,\n      \"text\": \"Your turn. A scalp's expected move is 60 USDT per BTC, at a price of 60,000.\"\n    },\n    {\n      \"t\": 212.6,\n      \"text\": \"Round-trip fees are 0.10%. Is it worth taking? Pause and think.\"\n    },\n    {\n      \"t\": 217.6,\n      \"text\": \"Fees: 60,000 × 0.10% = 60 USDT per BTC. The move only covers the fees.\"\n    },\n    {\n      \"t\": 223.2,\n      \"text\": \"Even before slippage, it's zero. NO_TRADE makes sense.\"\n    },\n    {\n      \"t\": 228.6,\n      \"text\": \"Before you try scalping, even in demo, know the limits.\"\n    },\n    {\n      \"t\": 233.2,\n      \"text\": \"It is not easy money. Many small losses and fees add up fast.\"\n    },\n    {\n      \"t\": 238.2,\n      \"text\": \"Fast decisions bring mistakes, and leverage makes every loss bigger.\"\n    },\n    {\n      \"t\": 243.7,\n      \"text\": \"Practise in demo first. NO_TRADE is always allowed.\"\n    },\n    {\n      \"t\": 250.6,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 252.4,\n      \"text\": \"Scalping aims for small moves in short trades: seconds to minutes.\"\n    },\n    {\n      \"t\": 258.0,\n      \"text\": \"Fees, spread and slippage take a big share of small moves.\"\n    },\n    {\n      \"t\": 263.0,\n      \"text\": \"XORA's 10 to 15 minutes is context, not a holding rule. NO_TRADE is allowed.\"\n    },\n    {\n      \"t\": 269.2,\n      \"text\": \"Check yourself: a move of 60 USDT per BTC, fees of 60. Worth it?\"\n    },\n    {\n      \"t\": 274.5,\n      \"text\": \"No. It only covers fees, before slippage. Waiting is the better call.\"\n    },\n    {\n      \"t\": 280.6,\n      \"text\": \"Well done! Next up: evaluating an entry opportunity. See you in lesson twenty.\"\n    }\n  ]\n}","scene-chart.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// The fictional 15-minute chart: two observations, then one demo trade from 60,000 (#3) to 60,120 (#7), 4 minutes.\nconst CH_H = UI.H, chX = (i) => 236 + i * 70, chY = (p) => 660 - (p - 59940) / 340 * 330, CH_B = 772, CH_U = 5;\nkit.scene('chart', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'ch-c', CH_H.length);\n    let bars = '';\n    CH_H.forEach((c, i) => { bars += '<rect class=\"ch-v\" x=\"' + (chX(i) - 20) + '\" y=\"' + (CH_B - c[4] * CH_U) + '\" width=\"40\" height=\"' + c[4] * CH_U + '\" rx=\"3\" style=\"fill:color-mix(in srgb, ' + (c[3] >= c[0] ? 'var(--up)' : 'var(--down)') + ' 50%, transparent)\"/>'; });\n    const ring = (cls, x, y, col) => '<circle class=\"' + cls + '\" cx=\"' + x + '\" cy=\"' + y.toFixed(1) + '\" r=\"26\" fill=\"none\" stroke-width=\"4\" style=\"stroke:' + col + '\"/>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ch-grid\">' + UI.grid(200, 1250, chY, 59950, 60200, 50) + '</g>' +\n      '<rect class=\"ch-zone\" x=\"200\" y=\"' + chY(60020).toFixed(1) + '\" width=\"1050\" height=\"' + (chY(59960) - chY(60020)).toFixed(1) + '\" rx=\"8\" style=\"fill:color-mix(in srgb, var(--main) 16%, transparent);stroke:color-mix(in srgb, var(--main) 60%, transparent);stroke-width:2\"/>' +\n      this.cd.html + bars +\n      ring('ch-m1', chX(3), chY(59970) + 8, 'var(--main)') + ring('ch-m2', chX(11), chY(60260) - 6, 'var(--accent)') +\n      '<rect class=\"ch-vh\" x=\"' + (chX(11) - 28) + '\" y=\"' + (CH_B - 3 * CH_U - 10) + '\" width=\"56\" height=\"' + (3 * CH_U + 14) + '\" rx=\"6\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--accent)\"/>' +\n      '<circle class=\"ch-en\" cx=\"' + chX(3) + '\" cy=\"' + chY(60000).toFixed(1) + '\" r=\"12\" style=\"fill:var(--up);stroke:var(--ground);stroke-width:3\"/>' +\n      '<circle class=\"ch-ex\" cx=\"' + chX(7) + '\" cy=\"' + chY(60120).toFixed(1) + '\" r=\"12\" style=\"fill:var(--second);stroke:var(--ground);stroke-width:3\"/>' +\n      '<g class=\"ch-hb\"><line x1=\"' + chX(3) + '\" x2=\"' + chX(7) + '\" y1=\"' + (chY(60230)) + '\" y2=\"' + (chY(60230)) + '\" stroke-width=\"4\" style=\"stroke:var(--up)\"/>' +\n      '<line x1=\"' + chX(3) + '\" x2=\"' + chX(3) + '\" y1=\"' + (chY(60230) - 12) + '\" y2=\"' + (chY(60230) + 12) + '\" stroke-width=\"4\" style=\"stroke:var(--up)\"/><line x1=\"' + chX(7) + '\" x2=\"' + chX(7) + '\" y1=\"' + (chY(60230) - 12) + '\" y2=\"' + (chY(60230) + 12) + '\" stroke-width=\"4\" style=\"stroke:var(--up)\"/></g>' +\n      '<g class=\"ch-vb\"><line x1=\"' + (chX(7) + 40) + '\" x2=\"' + (chX(7) + 40) + '\" y1=\"' + chY(60120).toFixed(1) + '\" y2=\"' + chY(60000).toFixed(1) + '\" stroke-width=\"4\" style=\"stroke:var(--up)\"/>' +\n      '<line x1=\"' + chX(3) + '\" x2=\"' + (chX(7) + 52) + '\" y1=\"' + chY(60000).toFixed(1) + '\" y2=\"' + chY(60000).toFixed(1) + '\" stroke-width=\"2\" stroke-dasharray=\"6 6\" style=\"stroke:var(--up)\"/></g></svg>' +\n      '<p class=\"tag ch-zl\" style=\"left:880px;top:' + (chY(59960) + 8).toFixed(0) + 'px;color:var(--main);border-color:var(--main)\">Support zone 59,960–60,020</p>' +\n      '<p class=\"tag ch-t1\" style=\"left:210px;top:' + (chY(59960) + 8).toFixed(0) + 'px;color:var(--main);border-color:var(--main)\">1 · Dip holds</p>' +\n      '<p class=\"tag ch-t2\" style=\"left:' + (chX(11) + 36) + 'px;top:296px;color:var(--accent);border-color:var(--accent)\">2 · Spike, thin volume</p>' +\n      '<p class=\"tag ch-et\" style=\"left:210px;top:' + (chY(59960) + 8).toFixed(0) + 'px;color:var(--up);border-color:var(--up)\">Demo long 60,000</p>' +\n      '<p class=\"tag ch-xt\" style=\"left:' + (chX(7) - 80) + 'px;top:' + (chY(60120) - 70).toFixed(0) + 'px\">Close 60,120</p>' +\n      '<p class=\"tag ch-hl\" style=\"left:' + (chX(7) + 22) + 'px;top:' + (chY(60230) - 22).toFixed(0) + 'px;color:var(--up);border-color:var(--up)\">4 min</p>' +\n      '<p class=\"fict\" style=\"position:absolute;left:200px;top:306px;margin:0\">Fictional 1-minute candles · demo</p>' +\n      '<p class=\"chip ch-ns\" style=\"position:absolute;left:1400px;top:330px;margin:0;font-size:26px;padding:12px 22px;border-color:var(--accent)\"><span class=\"dot\" style=\"background:var(--accent)\"></span>Observations, not signals</p>' +\n      '<div class=\"glass ch-p\" style=\"left:1400px;top:430px;width:370px;padding:12px 26px\">' +\n      '<div class=\"row ch-r\"><span>Holding period</span><span class=\"mono\" style=\"font-size:32px\">4 min</span></div>' +\n      '<div class=\"row ch-r\" style=\"border:0\"><span>Price move</span><span class=\"mono up\" style=\"font-size:32px\">+120</span></div>' +\n      '<p class=\"fict ch-r\" style=\"margin:0 0 8px\">USDT per BTC · could have failed</p></div>' +\n      '<div class=\"words\" style=\"left:140px;top:160px;width:1500px\"><p class=\"kick ch-k\">A short trade</p>' +\n      '<h2 class=\"line ch-t\">Fifteen minutes, one scalp</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.ch-k').style; this.t = q('.ch-t'); this.grid = q('.ch-grid').style; this.zone = q('.ch-zone').style; this.zl = q('.ch-zl').style;\n    this.vs = all('.ch-v').map((e) => e.style);\n    this.m1 = q('.ch-m1').style; this.m2 = q('.ch-m2').style; this.vh = q('.ch-vh').style; this.t1 = q('.ch-t1').style; this.t2 = q('.ch-t2').style;\n    this.en = q('.ch-en').style; this.ex = q('.ch-ex').style; this.hb = q('.ch-hb').style; this.vb = q('.ch-vb').style;\n    this.et = q('.ch-et').style; this.xt = q('.ch-xt').style; this.hl = q('.ch-hl').style; this.ns = q('.ch-ns').style; this.p = q('.ch-p').style; this.rows = all('.ch-r').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n  seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Scalping (many short trades) next to holding longer (one long trade): same week, different shape.\nconst CO_ROWS = [['Holding time', 'Seconds to minutes', 'Days to weeks'], ['Trades', 'Many', 'Few'], ['Costs vs move', 'Big share', 'Smaller share'], ['Main danger', 'Fast mistakes, noise', 'News, overnight swings']];\nconst CO_SC = [0.04, 0.14, 0.22, 0.35, 0.47, 0.6, 0.72, 0.85];\nkit.scene('compare', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const card = (k) => {\n      const L = k ? 960 : 140, col = k ? 'var(--accent)' : 'var(--main)';\n      let rows = '';\n      CO_ROWS.forEach((r, i) => { rows += '<div class=\"row co-r' + k + '\"' + (i === 3 ? ' style=\"border:0\"' : '') + '><span>' + r[0] + '</span><span style=\"font-size:28px;font-weight:700;color:' + col + '\">' + r[1 + k] + '</span></div>'; });\n      let segs = '';\n      if (k) segs = '<rect class=\"co-s1\" x=\"' + (L + 70) + '\" y=\"372\" width=\"560\" height=\"24\" rx=\"12\" style=\"fill:' + col + '\"/>';\n      else CO_SC.forEach((a) => { segs += '<rect class=\"co-s0\" x=\"' + (L + 40 + a * 660).toFixed(0) + '\" y=\"372\" width=\"22\" height=\"24\" rx=\"6\" style=\"fill:' + col + '\"/>'; });\n      return '<div class=\"glass co-c\" style=\"left:' + L + 'px;top:300px;width:760px;height:400px;padding:20px 32px\"><p class=\"kick\" style=\"margin:0 0 70px;color:' + col + '\">' + (k ? 'Holding longer' : 'Scalping') + '</p>' + rows + '</div>' +\n        '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><line x1=\"' + (L + 40) + '\" x2=\"' + (L + 720) + '\" y1=\"384\" y2=\"384\" stroke-width=\"2\" style=\"stroke:color-mix(in srgb, var(--second) 25%, transparent)\"/>' + segs + '</svg>';\n    };\n    kit.stage.append(kit.h('<div class=\"ground\">' + card(0) + card(1) +\n      '<p class=\"fict\" style=\"position:absolute;right:200px;top:262px;margin:0\">Each bar on the line is one trade · illustrative</p>' +\n      '<div style=\"position:absolute;left:0;
