<script>window.FILM = {"id":"T07","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson seven","dur":9,"k":1,"oldStart":0,"oldDur":9},{"id":"intent","name":"An order is an instruction","dur":19,"k":1,"oldStart":9,"oldDur":19},{"id":"book","name":"The order book","dur":19,"k":1,"oldStart":28,"oldDur":19},{"id":"market","name":"Market order","dur":39.36,"k":1.64,"oldStart":47,"oldDur":24},{"id":"slippage","name":"Slippage","dur":39.79,"k":1.73,"oldStart":71,"oldDur":23},{"id":"limit","name":"Limit order","dur":29.21,"k":1.27,"oldStart":94,"oldDur":23},{"id":"unfilled","name":"A limit may not fill","dur":18.87,"k":1.11,"oldStart":117,"oldDur":17},{"id":"partial","name":"Partial fill","dur":24.32,"k":1.52,"oldStart":134,"oldDur":16},{"id":"stop","name":"Stop order","dur":35.62,"k":1.37,"oldStart":150,"oldDur":26},{"id":"gap","name":"Stops can slip","dur":28.2,"k":1.41,"oldStart":176,"oldDur":20},{"id":"compare","name":"Side by side","dur":18,"k":1,"oldStart":196,"oldDur":18},{"id":"mistake","name":"Common mistake","dur":18,"k":1,"oldStart":214,"oldDur":18},{"id":"try","name":"Try it","dur":24,"k":1,"oldStart":232,"oldDur":24},{"id":"risks","name":"Know the risks","dur":22,"k":1,"oldStart":256,"oldDur":22},{"id":"recap","name":"Recap","dur":22,"k":1,"oldStart":278,"oldDur":22},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":300,"oldDur":10}],"voice":{"src":"T07/voice.mp3","lines":[{"t":0.6,"d":3.175,"text":"Lesson seven: market, limit and stop orders.","ml":"പാഠം ഏഴ്: market, limit, stop orders."},{"t":4.4,"d":2.541,"text":"Three ways to tell an exchange what you want.","ml":"നിങ്ങൾക്ക് എന്താണ് വേണ്ടതെന്ന് exchange-നോട് പറയാൻ മൂന്ന് വഴികൾ."},{"t":9.4,"d":5.19,"text":"In T06 you worked out profit and loss. Now: how do you actually get into a trade?","ml":"T06-ൽ നിങ്ങൾ ലാഭവും നഷ്ടവും കണക്കാക്കി. ഇനി: ശരിക്കും ഒരു ട്രേഡിൽ എങ്ങനെ കയറും?"},{"t":15.7,"d":5.614,"text":"You place an order: an instruction to the exchange to buy or sell, how much, and on what terms.","ml":"നിങ്ങൾ ഒരു ഓർഡർ കൊടുക്കുന്നു: buy ചെയ്യണോ sell ചെയ്യണോ, എത്ര, ഏത് വ്യവസ്ഥയിൽ എന്ന് exchange-നുള്ള നിർദ്ദേശം."},{"t":22.9,"d":2.995,"text":"There are three main types. Let's meet them one by one.","ml":"പ്രധാനമായി മൂന്ന് തരമുണ്ട്. ഓരോന്നായി പരിചയപ്പെടാം."},{"t":28.4,"d":5.683,"text":"Remember the order book from T04? Sellers' asks sit on top, buyers' bids below.","ml":"T04-ലെ order book ഓർമ്മയുണ്ടോ? വിൽക്കുന്നവരുടെ asks മുകളിൽ, വാങ്ങുന്നവരുടെ bids താഴെ."},{"t":34.633,"d":3.581,"text":"The gap between the best ask and the best bid is the spread.","ml":"ഏറ്റവും നല്ല ask-ഉം ഏറ്റവും നല്ല bid-ഉം തമ്മിലുള്ള വിടവാണ് spread."},{"t":39.5,"d":4.974,"text":"When your order meets an order on the other side, a trade happens. That is called a fill.","ml":"നിങ്ങളുടെ ഓർഡർ മറുവശത്തെ ഒരു ഓർഡറുമായി ചേരുമ്പോൾ ട്രേഡ് നടക്കും. അതിനെ fill എന്ന് പറയും."},{"t":47.656,"d":4.487,"text":"A market order says: buy or sell right now, at the best price available.","ml":"Market order പറയുന്നത്: ഇപ്പോൾ തന്നെ, കിട്ടാവുന്ന ഏറ്റവും നല്ല വിലയ്ക്ക് buy അല്ലെങ്കിൽ sell ചെയ്യുക."},{"t":57.004,"d":4.899,"text":"Like buying at a stall at whatever price is asked today: quick, but you don't pick the price.","ml":"കടയിൽ ഇന്ന് പറയുന്ന വിലയ്ക്ക് തന്നെ വാങ്ങുന്നത് പോലെ: വേഗമുണ്ട്, പക്ഷേ വില നിങ്ങൾ തീരുമാനിക്കുന്നില്ല."},{"t":68.648,"d":9.955,"text":"Here we buy 0.01 BTC. It takes 0.004 at 60,010, then 0.006 at 60,020.","ml":"ഇവിടെ നമ്മൾ 0.01 BTC buy ചെയ്യുന്നു. 0.004 കിട്ടുന്നത് 60,010-ന്, പിന്നെ 0.006 കിട്ടുന്നത് 60,020-ന്."},{"t":79.153,"d":5.895,"text":"Average price: 60,016 USDT. Fast, but the price was not fixed.","ml":"ശരാശരി വില: 60,016 USDT. വേഗമുണ്ട്, പക്ഷേ വില ഉറപ്പിച്ചിരുന്നില്ല."},{"t":87.052,"d":4.1,"text":"Slippage is the difference between the price you expected and the price you actually got.","ml":"നിങ്ങൾ പ്രതീക്ഷിച്ച വിലയും ശരിക്കും കിട്ടിയ വിലയും തമ്മിലുള്ള വ്യത്യാസമാണ് slippage."},{"t":98.816,"d":5.547,"text":"You saw a best ask of 60,010. But news hits, and the sellers move up in a flash.","ml":"നിങ്ങൾ കണ്ട best ask 60,010 ആയിരുന്നു. പക്ഷേ ഒരു വാർത്ത വരുന്നു, വിൽക്കുന്നവർ ഞൊടിയിടയിൽ വില കൂട്ടുന്നു."},{"t":109.542,"d":6.533,"text":"Your market order fills at 60,100. That is 90 USDT per BTC worse than expected.","ml":"നിങ്ങളുടെ market order fill ആകുന്നത് 60,100-ന്. പ്രതീക്ഷിച്ചതിലും ഒരു BTC-ക്ക് 90 USDT മോശം."},{"t":120.268,"d":5.467,"text":"On 0.01 BTC, you paid 0.90 USDT more.","ml":"0.01 BTC-ക്ക് നിങ്ങൾ 0.90 USDT കൂടുതൽ കൊടുത്തു."},{"t":126.658,"d":4.082,"text":"A limit order says: buy or sell only at my price, or a better one.","ml":"Limit order പറയുന്നത്: എന്റെ വിലയ്ക്കോ അതിലും നല്ല വിലയ്ക്കോ മാത്രം buy അല്ലെങ്കിൽ sell ചെയ്യുക."},{"t":133.389,"d":3.546,"text":"Like telling a shopkeeper: call me if the price drops to my number.","ml":"കടക്കാരനോട് പറയുന്നത് പോലെ: വില എന്റെ തുകയിലേക്ക് കുറഞ്ഞാൽ എന്നെ വിളിക്കണം."},{"t":140.247,"d":6.537,"text":"We place a limit buy for 0.01 BTC at 59,950. It waits in the book.","ml":"നമ്മൾ 0.01 BTC-ക്ക് 59,950-ൽ ഒരു limit buy ഇടുന്നു. അത് book-ൽ കാത്തിരിക്കുന്നു."},{"t":147.334,"d":7.541,"text":"Price comes down, a seller meets our price, and it fills: 599.50 USDT, no more.","ml":"വില താഴേക്ക് വരുന്നു, ഒരു വിൽപ്പനക്കാരൻ നമ്മുടെ വിലയ്ക്ക് തയ്യാറാകുന്നു, fill ആകുന്നു: 599.50 USDT, അതിൽ കൂടുതലില്ല."},{"t":155.804,"d":2.28,"text":"But a limit order is not guaranteed to fill.","ml":"പക്ഷേ ഒരു limit order fill ആകുമെന്ന് ഉറപ്പില്ല."},{"t":160.022,"d":7.386,"text":"Here our limit buy at 59,900 waits. Price dips to 59,920, then rises away.","ml":"ഇവിടെ 59,900-ലെ നമ്മുടെ limit buy കാത്തിരിക്കുന്നു. വില 59,920 വരെ താഴുന്നു, പിന്നെ മുകളിലേക്ക് പോകുന്നു."},{"t":167.958,"d":4.391,"text":"Our price was never reached, so nothing was bought. The order is still waiting.","ml":"നമ്മുടെ വില ഒരിക്കലും എത്തിയില്ല, അതുകൊണ്ട് ഒന്നും വാങ്ങിയില്ല. ഓർഡർ ഇപ്പോഴും കാത്തിരിക്കുകയാണ്."},{"t":174.838,"d":3.942,"text":"Sometimes only part of an order fills. That is a partial fill.","ml":"ചിലപ്പോൾ ഓർഡറിന്റെ ഒരു ഭാഗം മാത്രം fill ആകും. അതാണ് partial fill."},{"t":182.438,"d":8.463,"text":"We want 0.01 BTC at 59,950, but only 0.004 is sold at that price.","ml":"നമുക്ക് 59,950-ന് 0.01 BTC വേണം, പക്ഷേ ആ വിലയ്ക്ക് 0.004 മാത്രമേ വിൽക്കുന്നുള്ളൂ."},{"t":191.451,"d":6.632,"text":"0.004 filled, 0.006 still waiting. You hold less than you planned.","ml":"0.004 fill ആയി, 0.006 ഇപ്പോഴും കാത്തിരിക്കുന്നു. നിങ്ങൾ പ്ലാൻ ചെയ്തതിലും കുറവാണ് കയ്യിൽ."},{"t":199.098,"d":4.062,"text":"A stop order waits for a trigger price. Until then, nothing happens.","ml":"Stop order ഒരു trigger വിലയ്ക്കായി കാത്തിരിക്കും. അതുവരെ ഒന്നും നടക്കില്ല."},{"t":206.496,"d":4.175,"text":"When the market reaches the trigger, the stop sends an order, often a market order.","ml":"മാർക്കറ്റ് trigger-ൽ എത്തുമ്പോൾ stop ഒരു ഓർഡർ അയയ്ക്കും, പലപ്പോഴും ഒരു market order."},{"t":215.264,"d":4.717,"text":"Think of a tripwire: nothing happens until price touches it, then the order goes out.","ml":"ഒരു കെണിക്കമ്പി പോലെ ചിന്തിക്കൂ: വില അതിൽ തൊടുന്നത് വരെ ഒന്നുമില്ല, തൊട്ടാൽ ഓർഡർ പോകും."},{"t":224.306,"d":9.413,"text":"We hold 0.01 BTC with a stop at 59,500. Price falls, touches it, and it sells at 59,480.","ml":"നമ്മുടെ കയ്യിൽ 0.01 BTC, stop 59,500-ൽ. വില താഴുന്നു, അതിൽ തൊടുന്നു, 59,480-ന് sell ആകുന്നു."},{"t":234.734,"d":3.522,"text":"In a fast fall, price can jump straight past your trigger.","ml":"വേഗത്തിലുള്ള ഇടിവിൽ വില നിങ്ങളുടെ trigger കടന്ന് നേരെ ചാടിപ്പോകാം."},{"t":241.502,"d":8.014,"text":"Trigger 59,500. The next trade is at 59,200. Your stop fills near 59,200.","ml":"Trigger 59,500. അടുത്ത ട്രേഡ് 59,200-ൽ. നിങ്ങളുടെ stop fill ആകുന്നത് 59,200-ന് അടുത്ത്."},{"t":250.066,"d":7.389,"text":"That is 300 USDT per BTC of slippage, or 3 USDT on 0.01 BTC.","ml":"അത് ഒരു BTC-ക്ക് 300 USDT slippage, അല്ലെങ്കിൽ 0.01 BTC-ക്ക് 3 USDT."},{"t":258.005,"d":2.724,"text":"A stop is a trigger, not a promise of price.","ml":"Stop ഒരു trigger ആണ്, വിലയുടെ ഉറപ്പല്ല."},{"t":262.77,"d":3.941,"text":"Let's compare. A market order is fast, but the price is not fixed.","ml":"നമുക്ക് താരതമ്യം ചെയ്യാം. Market order വേഗമുള്ളതാണ്, പക്ഷേ വില ഉറപ്പില്ല."},{"t":268.07,"d":4.213,"text":"A limit order controls the price, but it may fill late, in part, or never.","ml":"Limit order വില നിയന്ത്രിക്കും, പക്ഷേ fill വൈകാം, ഭാഗികമാകാം, അല്ലെങ്കിൽ ഒരിക്കലും ആകാതിരിക്കാം."},{"t":273.87,"d":3.541,"text":"A stop waits for its trigger. Once triggered, the price can still slip.","ml":"Stop അതിന്റെ trigger-നായി കാത്തിരിക്കും. Trigger ആയ ശേഷവും വില slip ആകാം."},{"t":280.77,"d":3.952,"text":"A common mistake: thinking a stop order guarantees your exit price.","ml":"ഒരു സാധാരണ തെറ്റ്: stop order നിങ്ങളുടെ exit വില ഉറപ്പാക്കും എന്ന് കരുതുന്നത്."},{"t":286.17,"d":5.024,"text":"It doesn't. It guarantees a trigger, and in a fast market the fill can be much worse.","ml":"അങ്ങനെയല്ല. ഉറപ്പ് trigger-ന് മാത്രമാണ്. വേഗത്തിലുള്ള മാർക്കറ്റിൽ fill വളരെ മോശമാകാം."},{"t":292.77,"d":3.833,"text":"Plan for slippage, and never treat a stop as perfect protection.","ml":"Slippage മുൻകൂട്ടി കണക്കിലെടുക്കുക. Stop-നെ ഒരിക്കലും പൂർണ്ണ സംരക്ഷണമായി കാണരുത്."},{"t":298.77,"d":7.551,"text":"Your turn. BTC is at 60,000. You want to buy only if it drops to 59,500, and you can wait.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. BTC 60,000-ൽ ആണ്. 59,500 വരെ താഴ്ന്നാൽ മാത്രം buy ചെയ്യണം, കാത്തിരിക്കാനും തയ്യാർ."},{"t":306.871,"d":4.179,"text":"Which order type fits? Market, limit, or stop? Think it over.","ml":"ഏത് ഓർഡർ തരമാണ് ചേരുക? Market, limit, അതോ stop? ആലോചിച്ചു നോക്കൂ."},{"t":311.6,"d":6.294,"text":"A limit buy at 59,500. The trade-off: price may never get there, and that's okay.","ml":"59,500-ൽ ഒരു limit buy. പോരായ്മ: വില ഒരിക്കലും അവിടെ എത്തിയില്ലെന്ന് വരാം, അതും കുഴപ്പമില്ല."},{"t":318.444,"d":3.418,"text":"Waiting, with no order at all, is always a choice too.","ml":"ഒരു ഓർഡറും ഇടാതെ കാത്തിരിക്കുന്നതും എപ്പോഴും ഒരു തീരുമാനമാണ്."},{"t":322.77,"d":2.81,"text":"Before you place any order, know what can go wrong.","ml":"ഏത് ഓർഡർ ഇടും മുമ്പും, എന്തൊക്കെ തെറ്റാം എന്ന് അറിയുക."},{"t":327.07,"d":4.241,"text":"Market orders can slip, most of all when prices move fast or the book is thin.","ml":"Market orders slip ആകാം, പ്രത്യേകിച്ച് വില വേഗം മാറുമ്പോഴോ book നേർത്തതാകുമ്പോഴോ."},{"t":333.17,"d":3.36,"text":"Limit orders may fill only in part, or not at all.","ml":"Limit orders ഭാഗികമായി മാത്രം fill ആകാം, അല്ലെങ്കിൽ ഒട്ടും ആകാതിരിക്കാം."},{"t":337.37,"d":4.669,"text":"Stops can fill well past the trigger. And choosing not to trade is always allowed.","ml":"Stops trigger കടന്ന് വളരെ ദൂരെ fill ആകാം. ട്രേഡ് ചെയ്യാതിരിക്കാനും എപ്പോഴും തീരുമാനിക്കാം."},{"t":344.77,"d":0.739,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":346.57,"d":5.554,"text":"Market: fast, price not fixed. Limit: your price or better, fill not guaranteed.","ml":"Market: വേഗം, വില ഉറപ്പില്ല. Limit: നിങ്ങളുടെ വിലയോ അതിലും നല്ലതോ, പക്ഷേ fill ഉറപ്പില്ല."},{"t":352.77,"d":2.982,"text":"Stop: waits for a trigger, then the fill can slip.","ml":"Stop: ഒരു trigger-നായി കാത്തിരിക്കും, പിന്നെ fill slip ആകാം."},{"t":356.97,"d":3.483,"text":"Check yourself: which order type can stay unfilled forever?","ml":"സ്വയം പരിശോധിക്കൂ: ഏത് ഓർഡർ തരമാണ് എന്നെന്നേക്കും fill ആകാതെ കിടക്കാവുന്നത്?"},{"t":361.77,"d":2.481,"text":"A limit order, if its price is never reached.","ml":"ഒരു limit order, അതിന്റെ വില ഒരിക്കലും എത്തിയില്ലെങ്കിൽ."},{"t":366.97,"d":6.384,"text":"Well done! Next up, T08: stop-loss and take-profit. Plan your exit before you enter.","ml":"നന്നായി! അടുത്തത് T08: stop-loss, take-profit. ട്രേഡിൽ കയറും മുമ്പ് exit പ്ലാൻ ചെയ്യുക."}]},"assetBase":"T07/assets/","assets":{"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-candles.webp":{"mime":"image/webp","w":257,"h":160},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":3 d)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n","narration.json":"{\n  \"about\": \"T07 captions, shown on screen while the lesson plays (no voice yet). Each line starts at film time t (seconds); they can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson seven: market, limit and stop orders.\"\n    },\n    {\n      \"t\": 4.4,\n      \"text\": \"Three ways to tell an exchange what you want.\"\n    },\n    {\n      \"t\": 9.4,\n      \"text\": \"In T06 you worked out profit and loss. Now: how do you actually get into a trade?\"\n    },\n    {\n      \"t\": 15.7,\n      \"text\": \"You place an order: an instruction to the exchange to buy or sell, how much, and on what terms.\"\n    },\n    {\n      \"t\": 22.9,\n      \"text\": \"There are three main types. Let's meet them one by one.\"\n    },\n    {\n      \"t\": 28.4,\n      \"text\": \"Remember the order book from T04? Sellers' asks sit on top, buyers' bids below.\"\n    },\n    {\n      \"t\": 34.6,\n      \"text\": \"The gap between the best ask and the best bid is the spread.\"\n    },\n    {\n      \"t\": 39.5,\n      \"text\": \"When your order meets an order on the other side, a trade happens. That is called a fill.\"\n    },\n    {\n      \"t\": 47.4,\n      \"text\": \"A market order says: buy or sell right now, at the best price available.\"\n    },\n    {\n      \"t\": 53.1,\n      \"text\": \"Like buying at a stall at whatever price is asked today: quick, but you don't pick the price.\"\n    },\n    {\n      \"t\": 60.2,\n      \"text\": \"Here we buy 0.01 BTC. It takes 0.004 at 60,010, then 0.006 at 60,020.\"\n    },\n    {\n      \"t\": 65.7,\n      \"text\": \"Average price: 60,016 USDT. Fast, but the price was not fixed.\"\n    },\n    {\n      \"t\": 71.4,\n      \"text\": \"Slippage is the difference between the price you expected and the price you actually got.\"\n    },\n    {\n      \"t\": 78.2,\n      \"text\": \"You saw a best ask of 60,010. But news hits, and the sellers move up in a flash.\"\n    },\n    {\n      \"t\": 84.4,\n      \"text\": \"Your market order fills at 60,100. That is 90 USDT per BTC worse than expected.\"\n    },\n    {\n      \"t\": 90.6,\n      \"text\": \"On 0.01 BTC, you paid 0.90 USDT more.\"\n    },\n    {\n      \"t\": 94.4,\n      \"text\": \"A limit order says: buy or sell only at my price, or a better one.\"\n    },\n    {\n      \"t\": 99.7,\n      \"text\": \"Like telling a shopkeeper: call me if the price drops to my number.\"\n    },\n    {\n      \"t\": 105.1,\n      \"text\": \"We place a limit buy for 0.01 BTC at 59,950. It waits in the book.\"\n    },\n    {\n      \"t\": 110.4,\n      \"text\": \"Price comes down, a seller meets our price, and it fills: 599.50 USDT, no more.\"\n    },\n    {\n      \"t\": 117.4,\n      \"text\": \"But a limit order is not guaranteed to fill.\"\n    },\n    {\n      \"t\": 121.2,\n      \"text\": \"Here our limit buy at 59,900 waits. Price dips to 59,920, then rises away.\"\n    },\n    {\n      \"t\": 127,\n      \"text\": \"Our price was never reached, so nothing was bought. The order is still waiting.\"\n    },\n    {\n      \"t\": 134.4,\n      \"text\": \"Sometimes only part of an order fills. That is a partial fill.\"\n    },\n    {\n      \"t\": 139.4,\n      \"text\": \"We want 0.01 BTC at 59,950, but only 0.004 is sold at that price.\"\n    },\n    {\n      \"t\": 144.6,\n      \"text\": \"0.004 filled, 0.006 still waiting. You hold less than you planned.\"\n    },\n    {\n      \"t\": 150.4,\n      \"text\": \"A stop order waits for a trigger price. Until then, nothing happens.\"\n    },\n    {\n      \"t\": 155.8,\n      \"text\": \"When the market reaches the trigger, the stop sends an order, often a market order.\"\n    },\n    {\n      \"t\": 162.2,\n      \"text\": \"Think of a tripwire: nothing happens until price touches it, then the order goes out.\"\n    },\n    {\n      \"t\": 168.8,\n      \"text\": \"We hold 0.01 BTC with a stop at 59,500. Price falls, touches it, and it sells at 59,480.\"\n    },\n    {\n      \"t\": 176.4,\n      \"text\": \"In a fast fall, price can jump straight past your trigger.\"\n    },\n    {\n      \"t\": 181.2,\n      \"text\": \"Trigger 59,500. The next trade is at 59,200. Your stop fills near 59,200.\"\n    },\n    {\n      \"t\": 187,\n      \"text\": \"That is 300 USDT per BTC of slippage, or 3 USDT on 0.01 BTC.\"\n    },\n    {\n      \"t\": 191.9,\n      \"text\": \"A stop is a trigger, not a promise of price.\"\n    },\n    {\n      \"t\": 196.4,\n      \"text\": \"Let's compare. A market order is fast, but the price is not fixed.\"\n    },\n    {\n      \"t\": 201.7,\n      \"text\": \"A limit order controls the price, but it may fill late, in part, or never.\"\n    },\n    {\n      \"t\": 207.5,\n      \"text\": \"A stop waits for its trigger. Once triggered, the price can still slip.\"\n    },\n    {\n      \"t\": 214.4,\n      \"text\": \"A common mistake: thinking a stop order guarantees your exit price.\"\n    },\n    {\n      \"t\": 219.8,\n      \"text\": \"It doesn't. It guarantees a trigger, and in a fast market the fill can be much worse.\"\n    },\n    {\n      \"t\": 226.4,\n      \"text\": \"Plan for slippage, and never treat a stop as perfect protection.\"\n    },\n    {\n      \"t\": 232.4,\n      \"text\": \"Your turn. BTC is at 60,000. You want to buy only if it drops to 59,500, and you can wait.\"\n    },\n    {\n      \"t\": 239.3,\n      \"text\": \"Which order type fits? Market, limit, or stop? Think it over.\"\n    },\n    {\n      \"t\": 244.3,\n      \"text\": \"A limit buy at 59,500. The trade-off: price may never get there, and that's okay.\"\n    },\n    {\n      \"t\": 250.6,\n      \"text\": \"Waiting, with no order at all, is always a choice too.\"\n    },\n    {\n      \"t\": 256.4,\n      \"text\": \"Before you place any order, know what can go wrong.\"\n    },\n    {\n      \"t\": 260.7,\n      \"text\": \"Market orders can slip, most of all when prices move fast or the book is thin.\"\n    },\n    {\n      \"t\": 266.8,\n      \"text\": \"Limit orders may fill only in part, or not at all.\"\n    },\n    {\n      \"t\": 271,\n      \"text\": \"Stops can fill well past the trigger. And choosing not to trade is always allowed.\"\n    },\n    {\n      \"t\": 278.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 280.2,\n      \"text\": \"Market: fast, price not fixed. Limit: your price or better, fill not guaranteed.\"\n    },\n    {\n      \"t\": 286.4,\n      \"text\": \"Stop: waits for a trigger, then the fill can slip.\"\n    },\n    {\n      \"t\": 290.6,\n      \"text\": \"Check yourself: which order type can stay unfilled forever?\"\n    },\n    {\n      \"t\": 295.4,\n      \"text\": \"A limit order, if its price is never reached.\"\n    },\n    {\n      \"t\": 300.6,\n      \"text\": \"Well done! Next up, T08: stop-loss and take-profit. Plan your exit before you enter.\"\n    }\n  ]\n}\n","scene-book.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nkit.scene('book', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:820px\"><p class=\"kick bk-k\">Quick refresher from T04</p>' +\n      '<h2 class=\"line bk-t\">The order book</h2>' +\n      '<p class=\"sub bk-s\">A live list of who wants to buy and who wants to sell, and at what price.</p></div>' +\n      '<div class=\"glass bk-sp\" style=\"left:140px;top:470px;width:820px;padding:26px 36px\"><p class=\"kick\" style=\"margin:0 0 10px\">Spread</p>' +\n      '<p class=\"mono\" style=\"margin:0;font-size:36px\">60,010 − 60,000 = <span style=\"color:var(--main)\">10 USDT</span></p>' +\n      '<p style=\"margin:8px 0 0;font-size:28px;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">best ask − best bid</p></div>' +\n      '<div class=\"glass bk-def\" style=\"left:140px;top:470px;width:820px;padding:26px 36px\"><p class=\"def\" style=\"margin:0\">A <b>fill</b> is when your order is matched with an order on the other side, and the trade happens.</p></div>' +\n      '<p class=\"bk-la\" style=\"position:absolute;left:1690px;top:330px;margin:0;font-size:26px;font-weight:700;color:var(--accent)\">Asks<br><span style=\"font-weight:500;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">sellers</span></p>' +\n      '<p class=\"bk-lb\" style=\"position:absolute;left:1690px;top:540px;margin:0;font-size:26px;font-weight:700;color:var(--main)\">Bids<br><span style=\"font-weight:500;color:color-mix(in srgb, var(--second) 65%, var(--ground))\">buyers</span></p>' +\n      '<span class=\"chip bk-o\" style=\"position:absolute;left:0;top:0;font-size:26px;padding:10px 22px;background:var(--main);color:var(--ground);border-color:var(--main);z-index:3\">Buy 0.002 BTC</span>' +\n      '<span class=\"chip bk-f\" style=\"position:absolute;left:1060px;top:720px;font-size:26px;padding:12px 24px;border-color:var(--main)\">Filled: 0.002 BTC at 60,010</span>' +\n      '</div>'));\n    this.book = UI.book(kit, 'bkb', 1060, 200, 600, 3);\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.bk-k').style; this.t = q('.bk-t'); this.s = q('.bk-s'); this.sp = q('.bk-sp').style; this.def = q('.bk-def').style;\n    this.la = q('.bk-la').style; this.lb = q('.bk-lb').style; this.o = q('.bk-o').style; this.f = q('.bk-f').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'present' }, { t: 0.6, pose: 'point', flip: true }, { t: 6.6, pose: 'magnify' }, { t: 11.5, pose: 'explain' }, { t: 15.6, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.s, t, 1.0, { stagger: 0.05 });\n    UI.rise(this.book.st, t, 0.6);\n    this.la.opacity = eo(seg(t, 2.0, 2.5)); this.lb.opacity = eo(seg(t, 3.4, 3.9));\n    const rows = (i) => eo(seg(t, 1.0 + i * 0.25, 1.4 + i * 0.25));\n    const hs = eo(seg(t, 6.8, 7.3)) * (1 - eo(seg(t, 10.6, 11.2)));\n    // A small buy meets the best ask: 0.004 -> 0.002.\n    const fill = eio(seg(t, 13.6, 14.6));\n    const best = 0.004 - 0.002 * fill;\n    this.book.set({\n      asks: [[60050, 0.010, rows(0)], [60020, 0.006, rows(1)], [60010, best, rows(2), Math.max(hs, Math.sin(Math.PI * seg(t, 13.4, 15.2)))]],\n      bids: [[60000, 0.005, rows(4), hs], [59990, 0.008, rows(5)], [59950, 0.004, rows(6)]],\n      spread: t > 1.6 ? 'spread 10 USDT' : '', max: 0.012,\n    });\n    UI.rise(this.sp, t, 6.8, { out: 11.0 });\n    UI.rise(this.def, t, 11.6);\n    // The order chip flies in from the left to the best-ask row.\n    const r = this.book.rows[2], y = 200 + r.offsetTop + 8;\n    const go = seg(t, 12.2, 13.5);\n    this.o.left = lerp(980, 1260, eio(go)).toFixed(1) + 'px'; this.o.top = (y - Math.sin(Math.PI * go) * 40).toFixed(1) + 'px';\n    this.o.opacity = eo(seg(t, 11.9, 12.3)) * (1 - ei(seg(t, 14.4, 14.9)));\n    UI.rise(this.f, t, 14.6);\n    this.tutor.render(t);\n  },\n});\n","scene-compare.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst CP_COLS = [\n  ['Market', 'Right now', 'Not fixed', 'Usually fills, if the book has orders', 0.6],\n  ['Limit', 'At your price or better', 'You set it', 'May fill late, in part, or never', 5.8],\n  ['Stop', 'After the trigger', 'Not fixed once triggered', 'Can fill well past the trigger', 11.6],\n];\nconst CP_ROWS = ['When it acts', 'Price', 'Fill'];\nkit.scene('compare', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let cols = '';\n    CP_COLS.forEach((c, i) => {\n      cols += '<div class=\"glass cp-c\" style=\"left:' + (520 + i * 420) + 'px;top:300px;width:396px;height:470px;padding:26px 28px\">' +\n        '<p style=\"margin:0 0 18px;font-family:var(--display);font-size:44px;font-weight:700;color:var(--main)\">' + c[0] + '</p>' +\n        c.slice(1, 4).map((v, j) => '<p class=\"cp-v\" style=\"margin:0;height:' + (j === 2 ? 130 : 110) + 'px;font-size:28px;line-height:1.35;font-weight:600\">' + v + '</p>').join('') + '</div>';\n    });\n    let rows = '';\n    CP_ROWS.forEach((r, j) => { rows += '<p class=\"kick\" style=\"position:absolute;left:140px;top:' + (402 + j * 110) + 'px;margin:0;font-size:24px\">' + r + '</p>'; });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:150px;width:1500px\"><p class=\"kick cp-k\">Side by side</p>' +\n      '<h2 class=\"line cp-t\">Three orders, three trade-offs</h2></div>' +\n      '<div class=\"cp-rows\">' + rows + '</div>' + cols +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.cp-k').style; this.t = q('.cp-t'); this.rows = q('.cp-rows').style;\n    this.cols = all('.cp-c').map((e) => e.style); this.vs = all('.cp-v').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'magnify' }, { t: 0.5, pose: 'checklist' }, { t: 11.6, pose: 'think' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.rows.opacity = eo(seg(t, 0.4, 0.9));\n    let cur = -1;\n    CP_COLS.forEach((c, i) => { if (t >= c[4]) cur = i; });\n    this.cols.forEach((s, i) => {\n      const a = CP_COLS[i][4];\n      UI.rise(s, t, a - 0.2);\n      const on = i === cur ? eo(seg(t, a, a + 0.4)) : 0;\n      s.borderColor = 'color-mix(in srgb, var(--main) ' + (22 + on * 60).toFixed(0) + '%, transparent)';\n      s.background = on > 0 ? 'linear-gradient(180deg, color-mix(in srgb, var(--ground) ' + (82 - on * 8).toFixed(1) + '%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second)))' : '';\n      for (let j = 0; j < 3; j++) { const v = this.vs[i * 3 + j], b = a + 0.3 + j * 0.5; v.opacity = eo(seg(t, b, b + 0.4)); v.transform = 'translateX(' + lerp(20, 0, eo(seg(t, b, b + 0.5))).toFixed(1) + 'px)'; }\n    });\n    this.tutor.render(t);\n  },\n});\n","scene-gap.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Price drifts down to 59,700, then jumps (no trades between) to 59,200 at 5.6.\nconst GP_GAP = 5.6;\nconst gpP = (s) => s < GP_GAP ? UI.path([[0, 59900], [GP_GAP, 59700]], s) + Math.sin(s * 5.1) * 18 : UI.path([[GP_GAP, 59200], [9, 59160], [20, 59260]], s) + Math.sin(s * 3.3) * 10 * seg(s, GP_GAP + 1, GP_GAP + 3);\nconst gpX = (s) => 1040 + Math.min(s, 18) / 18 * 560, gpY = (p) => 700 - (p - 59100) / 900 * 440;\nkit.scene('gap', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const yt = gpY(59500).toFixed(1), xg = gpX(GP_GAP).toFixed(1);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"gp-chart\">' + UI.grid(1040, 1600, gpY, 59100, 60000, 100) +\n      '<line class=\"gp-trg\" x1=\"1040\" x2=\"1600\" y1=\"' + yt + '\" y2=\"' + yt + '\" stroke-width=\"4\" stroke-dasharray=\"14 10\" style=\"stroke:var(--accent)\"/>' +\n      '<text x=\"1600\" y=\"' + (yt - 16) + '\" text-anchor=\"end\" style=\"fill:var(--accent);font-size:24px;font-weight:700\">Stop trigger · 59,500</text>' +\n      '<path class=\"gp-a\" fill=\"none\" stroke-width=\"5\" stroke-linejoin=\"round\" style=\"stroke:var(--second)\"/>' +\n      '<line class=\"gp-jump\" x1=\"' + xg + '\" x2=\"' + xg + '\" y1=\"' + gpY(59700).toFixed(1) + '\" y2=\"' + gpY(59200).toFixed(1) + '\" stroke-width=\"3\" stroke-dasharray=\"4 10\" stroke-linecap=\"round\" style=\"stroke:color-mix(in srgb, var(--second) 60%, transparent)\"/>' +\n      '<path class=\"gp-b\" fill=\"none\" stroke-width=\"5\" stroke-linejoin=\"round\" style=\"stroke:var(--second)\"/><circle class=\"gp-dot\" r=\"10\" style=\"fill:var(--second)\"/>' +\n      '<text class=\"gp-nt\" x=\"' + (+xg - 16) + '\" y=\"' + gpY(59380).toFixed(1) + '\" text-anchor=\"end\" style=\"fill:color-mix(in srgb, var(--second) 75%, var(--ground));font-size:24px\">no trades here</text>' +\n      '<g class=\"gp-fill\"><circle cx=\"' + xg + '\" cy=\"' + gpY(59200).toFixed(1) + '\" r=\"14\" style=\"fill:var(--main)\"/>' +\n      '<text x=\"' + (+xg + 20) + '\" y=\"' + (gpY(59200) + 46).toFixed(1) + '\" style=\"fill:var(--main);font-size:24px;font-weight:700\">Filled near 59,200</text></g>' +\n      '<g class=\"gp-br\"><path d=\"M' + (+xg + 60) + ' ' + yt + ' h18 V' + gpY(59200).toFixed(1) + ' h-18\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--accent)\"/>' +\n      '<text x=\"' + (+xg + 94) + '\" y=\"' + gpY(59360).toFixed(1) + '\" style=\"fill:var(--accent);font-size:24px;font-weight:700\">300 USDT per BTC</text></g>' +\n      '<text x=\"1040\" y=\"232\" class=\"fict\" style=\"fill:color-mix(in srgb, var(--second) 45%, var(--ground))\">BTC price in USDT · fictional</text></g></svg>' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:820px\"><p class=\"kick gp-k\" style=\"color:var(--accent)\">Not guaranteed</p>' +\n      '<h2 class=\"line gp-t\">Stops can slip</h2></div>' +\n      '<div class=\"glass gp-def\" style=\"left:140px;top:340px;width:820px;padding:28px 36px\"><p class=\"def\" style=\"margin:0\">A <b>gap</b> is when price jumps from one level to another, with no trades in between.</p></div>' +\n      '<div class=\"glass gp-w\" style=\"left:140px;top:540px;width:820px;padding:24px 36px\"><p class=\"fict\" style=\"margin:0 0 10px\">Worked example · fictional prices</p>' +\n      '<p class=\"mono\" style=\"margin:0;font-size:32px\">Trigger 59,500 → filled 59,200</p>' +\n      '<p class=\"mono gp-w2\" style=\"margin:12px 0 0;font-size:32px\">300 × 0.01 BTC = <span style=\"color:var(--accent)\">3.00 USDT</span> worse</p></div>' +\n      '<div class=\"glass gp-m\" style=\"left:140px;top:740px;width:820px;padding:18px 36px;border-color:var(--accent)\"><p style=\"margin:0;font-size:32px;font-weight:700\">A stop is a trigger, <span style=\"color:var(-
