<script>window.FILM = {"id":"T16","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson sixteen","dur":10,"k":1,"oldStart":0,"oldDur":10},{"id":"hook","name":"Up, down or nowhere?","dur":20,"k":1,"oldStart":10,"oldDur":20},{"id":"swings","name":"Peaks and dips","dur":20,"k":1,"oldStart":30,"oldDur":20},{"id":"uptrend","name":"Uptrend","dur":39.12,"k":1.63,"oldStart":50,"oldDur":24},{"id":"downtrend","name":"Downtrend","dur":35.6,"k":1.78,"oldStart":74,"oldDur":20},{"id":"sideways","name":"Sideways","dur":18,"k":1,"oldStart":94,"oldDur":18},{"id":"structure","name":"Structure changes","dur":31,"k":1,"oldStart":112,"oldDur":31},{"id":"numbers","name":"Check with numbers","dur":27.8,"k":1.39,"oldStart":143,"oldDur":20},{"id":"mistake","name":"One candle is not a trend","dur":19.95,"k":1.05,"oldStart":163,"oldDur":19},{"id":"try","name":"Try it","dur":29.12,"k":1.12,"oldStart":182,"oldDur":26},{"id":"subjective","name":"A judgement call","dur":18,"k":1,"oldStart":208,"oldDur":18},{"id":"risks","name":"Know the limits","dur":21.6,"k":1.08,"oldStart":226,"oldDur":20},{"id":"recap","name":"Recap","dur":79.52,"k":2.84,"oldStart":246,"oldDur":28},{"id":"next","name":"Up next","dur":12.6,"k":1.26,"oldStart":274,"oldDur":10}],"voice":{"src":"T16/voice.mp3","lines":[{"t":0.6,"d":2.973,"text":"Lesson sixteen: trend and market structure.","ml":"പതിനാറാം പാഠം: ട്രെൻഡും മാർക്കറ്റ് ഘടനയും (market structure)."},{"t":4.6,"d":3.273,"text":"We'll read the shape of price, one peak and dip at a time.","ml":"വിലയുടെ രൂപം നമ്മൾ വായിക്കും, ഓരോ കൊടുമുടിയും ഓരോ താഴ്ചയും ആയി."},{"t":10.3,"d":4.094,"text":"Here is a fictional BTC chart. Is price going up, down, or nowhere?","ml":"ഇതാ ഒരു സാങ്കൽപ്പിക BTC ചാർട്ട്. വില മുകളിലേക്കാണോ, താഴേക്കാണോ, അതോ എങ്ങോട്ടുമില്ലേ?"},{"t":15.6,"d":4.168,"text":"One candle cannot tell you. Look at the peaks and the dips instead.","ml":"ഒരു candle-ന് അത് പറയാൻ കഴിയില്ല. പകരം കൊടുമുടികളും താഴ്ചകളും നോക്കുക."},{"t":20.9,"d":2.626,"text":"The pattern they make is called market structure.","ml":"അവ ഉണ്ടാക്കുന്ന പാറ്റേണിനെയാണ് market structure എന്ന് പറയുന്നത്."},{"t":25,"d":2.579,"text":"It describes the past. It does not promise the future.","ml":"അത് കഴിഞ്ഞകാലം വിവരിക്കുന്നു. ഭാവിയെക്കുറിച്ച് ഒരു ഉറപ്പും തരുന്നില്ല."},{"t":30.4,"d":3.195,"text":"A swing high is a peak: price rose, then turned down.","ml":"Swing high ഒരു കൊടുമുടിയാണ്: വില കയറി, പിന്നെ താഴേക്ക് തിരിഞ്ഞു."},{"t":34.8,"d":3.451,"text":"A swing low is a dip: price fell, then turned up.","ml":"Swing low ഒരു താഴ്ചയാണ്: വില വീണു, പിന്നെ മുകളിലേക്ക് തിരിഞ്ഞു."},{"t":38.9,"d":3.143,"text":"Think of a hilly road. The hilltops are swing highs, the valleys swing lows.","ml":"കയറ്റിറക്കങ്ങളുള്ള ഒരു റോഡ് ഓർക്കുക. കുന്നിൻമുകളുകൾ swing high-കൾ, താഴ്വരകൾ swing low-കൾ."},{"t":44.8,"d":4.68,"text":"A peak is only clear after price turns away from it.","ml":"വില അതിൽ നിന്ന് തിരിഞ്ഞുപോയതിന് ശേഷമേ ഒരു കൊടുമുടി വ്യക്തമാകൂ."},{"t":50.652,"d":2.791,"text":"An uptrend has higher highs and higher lows.","ml":"ഒരു uptrend-ൽ higher highs-ഉം higher lows-ഉം ഉണ്ടാകും."},{"t":56.846,"d":2.85,"text":"Each peak tops the last one: 60,100, then 60,200, then 60,300.","ml":"ഓരോ കൊടുമുടിയും മുമ്പത്തേതിനെ കടക്കുന്നു: 60,100, പിന്നെ 60,200, പിന്നെ 60,300."},{"t":64.996,"d":7.052,"text":"Each dip stays above the last one: 59,980, then 60,080, then 60,180.","ml":"ഓരോ താഴ്ചയും മുമ്പത്തേതിന് മുകളിൽ നിൽക്കുന്നു: 59,980, പിന്നെ 60,080, പിന്നെ 60,180."},{"t":73.798,"d":9.399,"text":"Like climbing stairs: a step up, a small step back, then up again.","ml":"പടികൾ കയറുന്നത് പോലെ: ഒരു പടി മുകളിലേക്ക്, ചെറുതായി ഒന്ന് പിന്നോട്ട്, പിന്നെ വീണ്ടും മുകളിലേക്ക്."},{"t":83.747,"d":4.238,"text":"HH means higher high. HL means higher low.","ml":"HH എന്നാൽ higher high. HL എന്നാൽ higher low."},{"t":89.832,"d":3.772,"text":"A downtrend is the mirror: lower highs and lower lows.","ml":"Downtrend അതിന്റെ കണ്ണാടിരൂപമാണ്: lower highs-ഉം lower lows-ഉം."},{"t":97.842,"d":3.754,"text":"Peaks: 60,320, then 60,220, then 60,120. Each one is lower.","ml":"കൊടുമുടികൾ: 60,320, പിന്നെ 60,220, പിന്നെ 60,120. ഓരോന്നും താഴ്ന്നത്."},{"t":106.208,"d":9.186,"text":"Dips: 60,200, then 60,100, then 60,000. LH and LL for short.","ml":"താഴ്ചകൾ: 60,200, പിന്നെ 60,100, പിന്നെ 60,000. ചുരുക്കത്തിൽ LH, LL."},{"t":115.944,"d":8.35,"text":"Lower highs, lower lows: a downtrend, so far.","ml":"Lower highs, lower lows: ഇതുവരെ ഒരു downtrend."},{"t":125.12,"d":3.513,"text":"Sideways means neither: highs and lows stay at about the same levels.","ml":"Sideways എന്നാൽ ഇത് രണ്ടുമല്ല: highs-ഉം lows-ഉം ഏകദേശം ഒരേ ലെവലുകളിൽ നിൽക്കും."},{"t":130.62,"d":4.247,"text":"Peaks near 60,200, dips near 60,000. Price moves, but goes nowhere.","ml":"കൊടുമുടികൾ 60,200-ന് അടുത്ത്, താഴ്ചകൾ 60,000-ന് അടുത്ത്. വില നീങ്ങുന്നു, പക്ഷേ എങ്ങോട്ടും പോകുന്നില്ല."},{"t":135.92,"d":5.488,"text":"This is also called a range. No clear direction is an answer too.","ml":"ഇതിനെ range എന്നും പറയും. വ്യക്തമായ ദിശ ഇല്ല എന്നതും ഒരു ഉത്തരമാണ്."},{"t":143.12,"d":3.762,"text":"Now watch structure change as price writes the chart.","ml":"ഇനി വില ചാർട്ട് വരയ്ക്കുമ്പോൾ structure മാറുന്നത് നോക്കൂ."},{"t":147.52,"d":3.147,"text":"Higher highs, higher lows: an uptrend.","ml":"Higher highs, higher lows: ഒരു uptrend."},{"t":151.72,"d":2.974,"text":"Each new label appears only after price turns. That is how swings work.","ml":"വില തിരിഞ്ഞതിന് ശേഷം മാത്രമാണ് ഓരോ പുതിയ ലേബലും വരുന്നത്. Swing-കൾ അങ്ങനെയാണ്."},{"t":157.72,"d":4.548,"text":"Then a peak that is not higher: the climb stalls, sideways.","ml":"പിന്നെ ഉയരം കൂടാത്ത ഒരു കൊടുമുടി: കയറ്റം നിലയ്ക്കുന്നു, sideways."},{"t":162.818,"d":4.383,"text":"A lower high, then a lower low. The structure has turned down.","ml":"ഒരു lower high, പിന്നെ ഒരു lower low. Structure താഴേക്ക് തിരിഞ്ഞു."},{"t":167.751,"d":3.394,"text":"Structure tells you what changed. It cannot tell you what comes next.","ml":"എന്ത് മാറി എന്ന് structure പറയും. അടുത്തത് എന്ത് വരും എന്ന് പറയാൻ അതിന് കഴിയില്ല."},{"t":174.276,"d":3.635,"text":"Let's check with numbers. Compare each peak with the last peak.","ml":"നമ്പറുകൾ വെച്ച് പരിശോധിക്കാം. ഓരോ കൊടുമുടിയെയും മുമ്പത്തെ കൊടുമുടിയുമായി താരതമ്യം ചെയ്യുക."},{"t":181.226,"d":3.561,"text":"60,240 minus 60,290 is minus 50. A lower high.","ml":"60,240 മൈനസ് 60,290 = മൈനസ് 50. ഒരു lower high."},{"t":186.786,"d":6.345,"text":"60,060 minus 60,150 is minus 90. A lower low.","ml":"60,060 മൈനസ് 60,150 = മൈനസ് 90. ഒരു lower low."},{"t":193.681,"d":6.419,"text":"Both changed: the uptrend's pattern of higher highs and lows is broken.","ml":"രണ്ടും മാറി: uptrend-ന്റെ higher highs, higher lows പാറ്റേൺ തകർന്നു."},{"t":201.94,"d":4.281,"text":"A common mistake: one big green candle does not make an uptrend.","ml":"ഒരു സാധാരണ തെറ്റ്: ഒരു വലിയ പച്ച candle കൊണ്ട് മാത്രം uptrend ആകില്ല."},{"t":207.295,"d":4.068,"text":"Here, a big jump, but the highs and lows are still falling.","ml":"ഇവിടെ ഒരു വലിയ കുതിപ്പുണ്ട്, പക്ഷേ highs-ഉം lows-ഉം ഇപ്പോഴും താഴുകയാണ്."},{"t":212.23,"d":3.134,"text":"Trend comes from the pattern of swings, not from one candle.","ml":"ട്രെൻഡ് വരുന്നത് swing-കളുടെ പാറ്റേണിൽ നിന്നാണ്, ഒരു candle-ൽ നിന്നല്ല."},{"t":217.375,"d":3.682,"text":"And always say which timeframe you mean.","ml":"ഏത് timeframe ആണ് ഉദ്ദേശിക്കുന്നത് എന്ന് എപ്പോഴും പറയുക."},{"t":221.918,"d":2.396,"text":"Your turn. Three fictional charts: A, B and C.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. മൂന്ന് സാങ്കൽപ്പിക ചാർട്ടുകൾ: A, B, C."},{"t":226.286,"d":3.703,"text":"Which is an uptrend, which a downtrend, which sideways? Pause if you need time.","ml":"ഏതാണ് uptrend, ഏതാണ് downtrend, ഏതാണ് sideways? സമയം വേണമെങ്കിൽ വീഡിയോ നിർത്തൂ."},{"t":233.118,"d":4.947,"text":"A: lower highs and lower lows. A downtrend.","ml":"A: lower highs-ഉം lower lows-ഉം. ഒരു downtrend."},{"t":238.615,"d":3.354,"text":"B: highs and lows at the same levels. Sideways.","ml":"B: highs-ഉം lows-ഉം ഒരേ ലെവലുകളിൽ. Sideways."},{"t":242.519,"d":3.814,"text":"C: higher highs and higher lows. An uptrend.","ml":"C: higher highs-ഉം higher lows-ഉം. ഒരു uptrend."},{"t":246.883,"d":3.236,"text":"Well done if you got all three.","ml":"മൂന്നും ശരിയായെങ്കിൽ, നന്നായി."},{"t":250.99,"d":1.632,"text":"Be honest about the limits. Spotting swings is partly a judgement call.","ml":"പരിമിതികളെക്കുറിച്ച് സത്യസന്ധരാകാം. Swing-കൾ കണ്ടെത്തുന്നത് ഭാഗികമായി ഒരു വിലയിരുത്തലാണ്."},{"t":256.59,"d":4.009,"text":"Two people can mark the same chart differently, and both can be fair.","ml":"ഒരേ ചാർട്ട് രണ്ടുപേർ വ്യത്യസ്തമായി അടയാളപ്പെടുത്താം, രണ്ടും ന്യായമാകാം."},{"t":261.99,"d":3.628,"text":"Tiny wiggles are usually ignored. A different timeframe can show a different trend.","ml":"ചെറിയ ഇളക്കങ്ങൾ സാധാരണ അവഗണിക്കും. വേറൊരു timeframe വേറൊരു ട്രെൻഡ് കാണിച്ചേക്കാം."},{"t":269.022,"d":4.617,"text":"Before we move on, a few honest limits.","ml":"മുന്നോട്ട് പോകും മുമ്പ്, ചില സത്യസന്ധമായ പരിമിതികൾ."},{"t":274.189,"d":2.363,"text":"A trend can end at any time, often without warning.","ml":"ഒരു ട്രെൻഡ് എപ്പോൾ വേണമെങ്കിലും അവസാനിക്കാം, പലപ്പോഴും ഒരു മുന്നറിയിപ്പുമില്ലാതെ."},{"t":277.23,"d":3.032,"text":"Buying late into a long trend can mean buying near the top.","ml":"ഒരു നീണ്ട ട്രെൻഡിൽ വൈകി വാങ്ങിയാൽ, ഏറ്റവും മുകളിലെത്താറായപ്പോൾ വാങ്ങുന്നതാകാം."},{"t":282.414,"d":3.143,"text":"Structure is not a signal to trade. WAIT and NO_TRADE are always allowed.","ml":"Structure ട്രേഡ് ചെയ്യാനുള്ള സിഗ്നൽ അല്ല. WAIT-ഉം NO_TRADE-ഉം എപ്പോഴും അനുവദനീയമാണ്."},{"t":291.326,"d":4.969,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":296.845,"d":0.745,"text":"Uptrend: higher highs and higher lows. Downtrend: lower highs and lower lows.","ml":"Uptrend: higher highs-ഉം higher lows-ഉം. Downtrend: lower highs-ഉം lower lows-ഉം."},{"t":312.626,"d":5.485,"text":"Sideways: highs and lows stay at about the same levels.","ml":"Sideways: highs-ഉം lows-ഉം ഏകദേശം ഒരേ ലെവലുകളിൽ നിൽക്കും."},{"t":325.406,"d":3.602,"text":"Swings are only clear after price turns, and they are a judgement call.","ml":"വില തിരിഞ്ഞതിന് ശേഷമേ swing-കൾ വ്യക്തമാകൂ, അവ ഒരു വിലയിരുത്തലുമാണ്."},{"t":341.026,"d":3.871,"text":"Check yourself: peaks 60,300 then 60,240; dips 60,150 then 60,060. What is it?","ml":"സ്വയം പരിശോധിക്കൂ: കൊടുമുടികൾ 60,300, പിന്നെ 60,240; താഴ്ചകൾ 60,150, പിന്നെ 60,060. ഇത് എന്താണ്?"},{"t":358.35,"d":10.928,"text":"Lower highs and lower lows: a downtrend, so far.","ml":"Lower highs-ഉം lower lows-ഉം: ഇതുവരെ ഒരു downtrend."},{"t":370.466,"d":3.437,"text":"Great work! Next up: support, resistance, breakout and fakeout.","ml":"നന്നായി! അടുത്തത്: support, resistance, breakout, fakeout."},{"t":377.27,"d":4.627,"text":"See you in lesson seventeen.","ml":"പതിനേഴാം പാഠത്തിൽ കാണാം."}]},"assetBase":"T16/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":331,"h":446},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-candles.webp":{"mime":"image/webp","w":257,"h":160},"tutor-pointer.webp":{"mime":"image/webp","w":248,"h":171},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T16 captions, written as a warm, clear tutor speaking; can be recorded as voiceover later. Times in seconds from the start of the lesson.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson sixteen: trend and market structure.\"\n    },\n    {\n      \"t\": 4.6,\n      \"text\": \"We'll read the shape of price, one peak and dip at a time.\"\n    },\n    {\n      \"t\": 10.3,\n      \"text\": \"Here is a fictional BTC chart. Is price going up, down, or nowhere?\"\n    },\n    {\n      \"t\": 15.6,\n      \"text\": \"One candle cannot tell you. Look at the peaks and the dips instead.\"\n    },\n    {\n      \"t\": 20.9,\n      \"text\": \"The pattern they make is called market structure.\"\n    },\n    {\n      \"t\": 25.0,\n      \"text\": \"It describes the past. It does not promise the future.\"\n    },\n    {\n      \"t\": 30.4,\n      \"text\": \"A swing high is a peak: price rose, then turned down.\"\n    },\n    {\n      \"t\": 34.8,\n      \"text\": \"A swing low is a dip: price fell, then turned up.\"\n    },\n    {\n      \"t\": 38.9,\n      \"text\": \"Think of a hilly road. The hilltops are swing highs, the valleys swing lows.\"\n    },\n    {\n      \"t\": 44.8,\n      \"text\": \"A peak is only clear after price turns away from it.\"\n    },\n    {\n      \"t\": 50.4,\n      \"text\": \"An uptrend has higher highs and higher lows.\"\n    },\n    {\n      \"t\": 54.2,\n      \"text\": \"Each peak tops the last one: 60,100, then 60,200, then 60,300.\"\n    },\n    {\n      \"t\": 59.2,\n      \"text\": \"Each dip stays above the last one: 59,980, then 60,080, then 60,180.\"\n    },\n    {\n      \"t\": 64.6,\n      \"text\": \"Like climbing stairs: a step up, a small step back, then up again.\"\n    },\n    {\n      \"t\": 69.8,\n      \"text\": \"HH means higher high. HL means higher low.\"\n    },\n    {\n      \"t\": 74.4,\n      \"text\": \"A downtrend is the mirror: lower highs and lower lows.\"\n    },\n    {\n      \"t\": 78.9,\n      \"text\": \"Peaks: 60,320, then 60,220, then 60,120. Each one is lower.\"\n    },\n    {\n      \"t\": 83.6,\n      \"text\": \"Dips: 60,200, then 60,100, then 60,000. LH and LL for short.\"\n    },\n    {\n      \"t\": 88.5,\n      \"text\": \"Lower highs, lower lows: a downtrend, so far.\"\n    },\n    {\n      \"t\": 94.4,\n      \"text\": \"Sideways means neither: highs and lows stay at about the same levels.\"\n    },\n    {\n      \"t\": 99.9,\n      \"text\": \"Peaks near 60,200, dips near 60,000. Price moves, but goes nowhere.\"\n    },\n    {\n      \"t\": 105.2,\n      \"text\": \"This is also called a range. No clear direction is an answer too.\"\n    },\n    {\n      \"t\": 112.4,\n      \"text\": \"Now watch structure change as price writes the chart.\"\n    },\n    {\n      \"t\": 116.8,\n      \"text\": \"Higher highs, higher lows: an uptrend.\"\n    },\n    {\n      \"t\": 121.0,\n      \"text\": \"Each new label appears only after price turns. That is how swings work.\"\n    },\n    {\n      \"t\": 127.0,\n      \"text\": \"Then a peak that is not higher: the climb stalls, sideways.\"\n    },\n    {\n      \"t\": 131.8,\n      \"text\": \"A lower high, then a lower low. The structure has turned down.\"\n    },\n    {\n      \"t\": 136.8,\n      \"text\": \"Structure tells you what changed. It cannot tell you what comes next.\"\n    },\n    {\n      \"t\": 143.4,\n      \"text\": \"Let's check with numbers. Compare each peak with the last peak.\"\n    },\n    {\n      \"t\": 148.4,\n      \"text\": \"60,240 minus 60,290 is minus 50. A lower high.\"\n    },\n    {\n      \"t\": 152.4,\n      \"text\": \"60,060 minus 60,150 is minus 90. A lower low.\"\n    },\n    {\n      \"t\": 156.3,\n      \"text\": \"Both changed: the uptrend's pattern of higher highs and lows is broken.\"\n    },\n    {\n      \"t\": 163.4,\n      \"text\": \"A common mistake: one big green candle does not make an uptrend.\"\n    },\n    {\n      \"t\": 168.5,\n      \"text\": \"Here, a big jump, but the highs and lows are still falling.\"\n    },\n    {\n      \"t\": 173.2,\n      \"text\": \"Trend comes from the pattern of swings, not from one candle.\"\n    },\n    {\n      \"t\": 178.1,\n      \"text\": \"And always say which timeframe you mean.\"\n    },\n    {\n      \"t\": 182.4,\n      \"text\": \"Your turn. Three fictional charts: A, B and C.\"\n    },\n    {\n      \"t\": 186.3,\n      \"text\": \"Which is an uptrend, which a downtrend, which sideways? Pause if you need time.\"\n    },\n    {\n      \"t\": 192.4,\n      \"text\": \"A: lower highs and lower lows. A downtrend.\"\n    },\n    {\n      \"t\": 196.1,\n      \"text\": \"B: highs and lows at the same levels. Sideways.\"\n    },\n    {\n      \"t\": 200.1,\n      \"text\": \"C: higher highs and higher lows. An uptrend.\"\n    },\n    {\n      \"t\": 203.9,\n      \"text\": \"Well done if you got all three.\"\n    },\n    {\n      \"t\": 208.4,\n      \"text\": \"Be honest about the limits. Spotting swings is partly a judgement call.\"\n    },\n    {\n      \"t\": 214.0,\n      \"text\": \"Two people can mark the same chart differently, and both can be fair.\"\n    },\n    {\n      \"t\": 219.4,\n      \"text\": \"Tiny wiggles are usually ignored. A different timeframe can show a different trend.\"\n    },\n    {\n      \"t\": 226.4,\n      \"text\": \"Before we move on, a few honest limits.\"\n    },\n    {\n      \"t\": 229.8,\n      \"text\": \"A trend can end at any time, often without warning.\"\n    },\n    {\n      \"t\": 234.0,\n      \"text\": \"Buying late into a long trend can mean buying near the top.\"\n    },\n    {\n      \"t\": 238.8,\n      \"text\": \"Structure is not a signal to trade. WAIT and NO_TRADE are always allowed.\"\n    },\n    {\n      \"t\": 246.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 248.0,\n      \"text\": \"Uptrend: higher highs and higher lows. Downtrend: lower highs and lower lows.\"\n    },\n    {\n      \"t\": 253.9,\n      \"text\": \"Sideways: highs and lows stay at about the same levels.\"\n    },\n    {\n      \"t\": 258.4,\n      \"text\": \"Swings are only clear after price turns, and they are a judgement call.\"\n    },\n    {\n      \"t\": 263.9,\n      \"text\": \"Check yourself: peaks 60,300 then 60,240; dips 60,150 then 60,060. What is it?\"\n    },\n    {\n      \"t\": 270.0,\n      \"text\": \"Lower highs and lower lows: a downtrend, so far.\"\n    },\n    {\n      \"t\": 274.6,\n      \"text\": \"Great work! Next up: support, resistance, breakout and fakeout.\"\n    },\n    {\n      \"t\": 280.0,\n      \"text\": \"See you in lesson seventeen.\"\n    }\n  ]\n}","scene-downtrend.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Shared by the uptrend and downtrend scenes: pivots, labels, the two steps lines and the summary card.\nconst UP = { pv: [60400, 60200, 60320, 60100, 60220, 60000, 60120, 59940], lab: ['', 'L 60,200', 'LH 60,320', 'LL 60,100', 'LH 60,220', 'LL 60,000', 'LH 60,120', ''],\n  rows: [['Peaks', '60,320 → 60,220 → 60,120', 4.9], ['Dips', '60,200 → 60,100 → 60,000', 9.6]], legend: 'LH = lower high · LL = lower low', col: 'var(--down)' };\nconst UP_X0 = 260, UP_DX = 160, upY = (p) => 740 - (p - 59880) / 560 * 410;\nkit.scene('downtrend', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.sw = UI.swing(kit, 'up-s', { pv: UP.pv, x0: UP_X0, dx: UP_DX, yOf: upY, lab: UP.lab, t0: 1.0, t1: 12.6 });\n    const pt = (i) => (UP_X0 + i * UP_DX) + ' ' + upY(UP.pv[i]).toFixed(1);\n    let rows = '';\n    UP.rows.forEach((r) => { rows += '<div class=\"up-r\" style=\"display:flex;gap:24px;align-items:baseline\"><span style=\"width:90px;font-size:28px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">' + r[0] + '</span><span class=\"mono\" style=\"font-size:30px\">' + r[1] + '</span><span style=\"font-size:30px;color:' + UP.col + '\">▼</span></div>'; });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"up-grid\">' + UI.grid(220, 1420, upY, 59950, 60400, 50) + '</g>' +\n      '<path class=\"up-hi\" d=\"M' + pt(2) + ' L' + pt(4) + ' L' + pt(6) + '\" pathLength=\"1\" fill=\"none\" stroke-width=\"3\" stroke-dasharray=\"1 1\" style=\"stroke:' + UP.col + '\"/>' +\n      '<path class=\"up-lo\" d=\"M' + pt(1) + ' L' + pt(3) + ' L' + pt(5) + '\" pathLength=\"1\" fill=\"none\" stroke-width=\"3\" style=\"stroke:' + UP.col + '\"/>' +\n      this.sw.html + '</svg>' + this.sw.tags +\n      '<div class=\"glass up-card\" style=\"left:760px;top:176px;width:700px;padding:16px 30px;display:flex;flex-direction:column;gap:6px\">' + rows + '</div>' +\n      '<p class=\"chip up-leg\" style=\"position:absolute;left:1480px;top:190px;margin:0;font-size:24px;padding:10px 20px;line-height:1.3;white-space:normal;width:240px;box-sizing:border-box\">' + UP.legend.replace(' · ', '<br>') + '</p>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:600px\"><p class=\"kick up-k\" style=\"color:' + UP.col + '\">Lower highs, lower lows</p>' +\n      '<h2 class=\"line up-t\">Downtrend</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.up-k').style; this.t = q('.up-t'); this.grid = q('.up-grid').style; this.card = q('.up-card').style; this.rows = all('.up-r').map((e) => e.style);\n    this.hi = q('.up-hi'); this.lo = q('.up-lo'); this.leg = q('.up-leg').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.5, pose: 'present' }, { t: 4.2, pose: 'point', flip: true }, { t: 14.5, pose: 'think' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.4, 1.0));\n    UI.rise(this.card, t, 4.0);\n    this.rows.forEach((s, i) => UI.rise(s, t, UP.rows[i][2], { dy: 14 }));\n    this.sw.render(t);\n    for (const [p, a] of [[this.hi, 13.0], [this.lo, 13.8]]) { p.setAttribute('stroke-dasharray', eio(seg(t, a, a + 1.2)) + ' 1'); p.style.opacity = t > a ? 0.85 : 0; }\n    UI.rise(this.leg, t, 14.6, { s: 0.9 });\n    this.tutor.render(t);\n  },\n});\n","scene-hook.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst HK_PV = [60000, 60150, 60040, 60220, 60100, 60260, 60170];\nconst HK_X0 = 260, HK_DX = 200, hkY = (p) => 720 - (p - 59960) / 340 * 360;\nkit.scene('hook', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.sw = UI.swing(kit, 'hk-s', { pv: HK_PV, x0: HK_X0, dx: HK_DX, yOf: hkY, lab: ['', 'Peak', 'Dip', 'Peak', 'Dip', 'Peak', ''], t0: 11.0, t1: 14.4, conf: false, wig: 0 });\n    this.cs = UI.candlesOf(this.sw.f, 6, 24);\n    this.cd = UI.cdl(kit, 'hk-c', 24);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"hk-grid\">' + UI.grid(220, 1500, hkY, 60000, 60250, 50) + '</g>' + this.cd.html +\n      '<rect class=\"hk-one\" x=\"' + (HK_X0 + 13 * 50 - 4) + '\" y=\"380\" width=\"58\" height=\"360\" rx=\"12\" fill=\"none\" stroke-width=\"3\" stroke-dasharray=\"8 6\" style=\"stroke:var(--accent)\"/>' +\n      this.sw.html + '</svg>' + this.sw.tags +\n      '<p class=\"tag hk-q\" style=\"left:' + (HK_X0 + 13 * 50 + 25) + 'px;top:318px;transform:translateX(-50%);border-color:var(--accent);color:var(--accent)\">Up? Down?</p>' +\n      '<p class=\"fict\" style=\"position:absolute;left:1100px;top:250px;margin:0\">BTC/USDT · 1-minute candles · fictional</p>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:940px\"><p class=\"kick hk-k\">Market structure</p>' +\n      '<h2 class=\"line hk-t\">Where is price going?</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.hk-k').style; this.t = q('.hk-t'); this.grid = q('.hk-grid').style; this.one = q('.hk-one').style; this.q = q('.hk-q').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'present' }, { t: 0.5, pose: 'think' }, { t: 5.6, pose: 'confused' }, { t: 10.9, pose: 'point', flip: true }, { t: 15.0, pose: 'calm' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.4, 1.0));\n    const dim = 1 - 0.55 * eo(seg(t, 10.8, 11.4));\n    this.cs.forEach((c, i) => {\n      const p = seg(t, 0.6 + i * 0.16, 1.0 + i * 0.16);\n      this.cd.set(i, { x: HK_X0 + i * 50 + 25, w: 30, o: c[0], h: c[1], l: c[2], c: lerp(c[0], c[3], eo(p)), y: hkY, op: eo(p) * (i === 13 ? 1 : dim * (t > 5.8 && t < 10.8 ? 0.5 : 1)) });\n    });\n    const one = eo(seg(t, 5.8, 6.3)) * (1 - eo(seg(t, 10.4, 10.9)));\n    this.one.opacity = one; this.q.opacity = one;\n    this.sw.render(t);\n    this.tutor.render(t);\n  },\n});\n","scene-mistake.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst MK_PV = [60320, 60150, 60250, 60080, 60210, 59990, 60110, 59930];\nconst MK_X0 = 260, MK_DX = 160, mkY = (p) => 740 - (p - 59880) / 500 * 400, MK_BIG = 13;\nkit.scene('mistake', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.sw = UI.swing(kit, 'mk-s', { pv: MK_PV, x0: MK_X0, dx: MK_DX, yOf: mkY, lab: ['', 'L', 'LH', 'LL', 'LH', 'LL', 'LH', ''], t0: 5.6, t1: 9.6, conf: false, wig: 0, fs: 22 });\n    const cs = UI.candlesOf(this.sw.f, 7, 28);\n    // The rise from 60,080 to 60,210 happens mostly in one big green candle.\n    cs[12] = [cs[12][0], Math.max(cs[12][0], 60095), Math.min(cs[12][0], 60070), 60090];\n    cs[13] = [60090, 60200, 60085, 60195]; cs[14] = [60195, 60214, 60182, 60205]; cs[15] = [60205, 60216, 60190, 60200];\n    cs[16] = [60200, Math.max(60200, cs[16][1]), cs[16][2], cs[16][3]];\n    this.cs = cs;\n    this.cd = UI.cdl(kit, 'mk-c', 28);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"mk-grid\">' + UI.grid(220, 1420, mkY, 59950, 60300, 50) + '</g>' + this.cd.html + this.sw.html + '</svg>' + this.sw.tags +\n      '<p class=\"tag mk-big\" style=\"left:' + (MK_X0 + MK_BIG * 40 + 20) + 'px;top:' + (mkY(60200) - 120).toFixed(1) + 'px;transform:translateX(-50%);border-color:var(--up);color:var(--up)\">+105 in one candle!</p>' +\n      '<div class=\"glass mk-card\" style=\"left:1060px;top:176px;width:620px;padding:18px 28px\"><p class=\"def\" style=\"margin:0;font-size:30px\">Trend comes from the <b>swings</b>, on a stated <b>timeframe</b>, not one candle.</p></div>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:900px\"><p class=\"kick mk-k\" style=\"color:var(--accent)\">Common mistake</p>' +\n      '<h2 class=\"line mk-t\">Not from one candle</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.mk-k').style; this.t = q('.mk-t'); this.grid = q('.mk-grid').style; this.big = q('.mk-big').style; this.card = q('.mk-card').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.5, pose: 'confused' }, { t: 5.5, pose: 'magnify' }, { t: 10.2, pose: 'explain' }, { t: 15.1, pose: 'thumbs' }],\n      says: [{ t0: 1.6, t1: 4.8, text: 'Uptrend now?' }],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.4, 1.0));\n    const dim = 1 - 0.45 * eo(seg(t, 5.4, 6.0));\n    this.cs.forEach((c, i) => {\n      const p = seg(t, 0.5 + i * 0.05, 0.9 + i * 0.05);\n      const hot = i === MK_BIG ? 1 + 0.06 * Math.sin(Math.PI
