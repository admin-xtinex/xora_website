<script>window.FILM = {"id":"T25","width":1920,"height":1080,"scenes":[{"id":"title","name":"How XORA analyses a coin","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"The routine","dur":19,"k":1,"oldStart":8,"oldDur":19},{"id":"candles","name":"Candles in","dur":21,"k":1,"oldStart":27,"oldDur":21},{"id":"closed","name":"Closed candles only","dur":21,"k":1,"oldStart":48,"oldDur":21},{"id":"volatility","name":"Volatility","dur":21,"k":1,"oldStart":69,"oldDur":21},{"id":"trend","name":"Swings and trend","dur":24,"k":1,"oldStart":90,"oldDur":24},{"id":"zones","name":"Support and resistance zones","dur":20,"k":1,"oldStart":114,"oldDur":20},{"id":"movement","name":"Movement","dur":21,"k":1,"oldStart":134,"oldDur":21},{"id":"setups","name":"Candidate setups","dur":22,"k":1,"oldStart":155,"oldDur":22},{"id":"plan","name":"A plan for one candle","dur":28,"k":1,"oldStart":177,"oldDur":28},{"id":"trigger","name":"At the trigger","dur":22,"k":1,"oldStart":205,"oldDur":22},{"id":"mistake","name":"A common mistake","dur":16,"k":1,"oldStart":227,"oldDur":16},{"id":"try","name":"Try it","dur":18,"k":1,"oldStart":243,"oldDur":18},{"id":"risks","name":"Know the limits","dur":19,"k":1,"oldStart":261,"oldDur":19},{"id":"recap","name":"Recap","dur":19,"k":1,"oldStart":280,"oldDur":19},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":299,"oldDur":10}],"voice":{"src":null,"lines":[{"t":0.6,"d":7.15,"text":"Lesson T25: how XORA analyses a coin. Let's look inside the routine.","ml":"പാഠം T25: XORA ഒരു കോയിൻ എങ്ങനെ വിശകലനം ചെയ്യുന്നു. ആ ദിനചര്യയുടെ ഉള്ളിലേക്ക് നോക്കാം."},{"t":8.4,"d":5.85,"text":"What does XORA do with a coin? Every minute, it runs the same careful routine.","ml":"XORA ഒരു കോയിനുമായി എന്ത് ചെയ്യും? ഓരോ മിനിറ്റിലും അത് ഒരേ ശ്രദ്ധയുള്ള ദിനചര്യ നടത്തും."},{"t":14.5,"d":5.95,"text":"Candles in. Then volatility, swings, trend, zones, movement and possible setups.","ml":"ആദ്യം candle-കൾ. പിന്നെ volatility, swings, trend, zones, movement, സാധ്യമായ setup-കൾ."},{"t":20.7,"d":6.05,"text":"Out comes a plan for one candle, or no plan. Let's follow one fictional coin.","ml":"ഫലം ഒരു candle-ന് മാത്രമുള്ള ഒരു പ്ലാൻ, അല്ലെങ്കിൽ പ്ലാനേ ഇല്ല. ഒരു സാങ്കൽപ്പിക കോയിൻ പിന്തുടരാം."},{"t":27.4,"d":7.15,"text":"It starts with history: the coin's recent 1-minute candles. Each shows open, high, low and close.","ml":"തുടക്കം ചരിത്രത്തിൽ നിന്ന്: കോയിന്റെ അടുത്തകാലത്തെ 1-minute candle-കൾ. ഓരോന്നും open, high, low, close കാണിക്കും."},{"t":34.8,"d":5.85,"text":"XORA also checks bigger timeframes, like 5 and 15 minutes, and the order book.","ml":"XORA വലിയ timeframe-കളും നോക്കും, 5, 15 മിനിറ്റ് പോലെ, പിന്നെ order book-ഉം."},{"t":40.9,"d":6.85,"text":"These are common techniques. XORA's filters draw on them; the exact rules are its own.","ml":"ഇവ സാധാരണ ടെക്നിക്കുകളാണ്. XORA-യുടെ filter-കൾ ഇവ ഉപയോഗിക്കുന്നു; കൃത്യമായ നിയമങ്ങൾ അതിന്റെ സ്വന്തം."},{"t":48.4,"d":6.75,"text":"One rule matters a lot: XORA uses closed candles only. A forming candle can still change.","ml":"ഒരു നിയമം വളരെ പ്രധാനം: XORA അടഞ്ഞ candle-കൾ മാത്രമേ ഉപയോഗിക്കൂ. രൂപപ്പെടുന്ന candle ഇനിയും മാറാം."},{"t":55.4,"d":6.75,"text":"Its high, low and colour can flip before the minute ends, so a signal from it could vanish.","ml":"മിനിറ്റ് തീരും മുൻപ് അതിന്റെ high, low, നിറം മാറാം. അതിൽ നിന്നുള്ള സിഗ്നൽ അപ്രത്യക്ഷമാകാം."},{"t":62.4,"d":6.35,"text":"So at every candle close, the engine makes a fresh plan for each coin.","ml":"അതുകൊണ്ട് ഓരോ candle close-ലും engine ഓരോ കോയിനും പുതിയൊരു പ്ലാൻ ഉണ്ടാക്കും."},{"t":69.4,"d":6.95,"text":"Next: volatility, how much price usually moves. A common measure is ATR, average true range.","ml":"അടുത്തത്: volatility, വില സാധാരണ എത്ര നീങ്ങുന്നു എന്ന്. ഒരു സാധാരണ അളവ് ATR, average true range."},{"t":76.6,"d":6.95,"text":"Simple version: average recent candle sizes. 60, 50, 40, 50 and 100 USDT average 60 USDT.","ml":"ലളിതമായി: അടുത്ത candle-കളുടെ വലിപ്പത്തിന്റെ ശരാശരി. 60, 50, 40, 50, 100 USDT-ന്റെ ശരാശരി 60 USDT."},{"t":83.8,"d":5.95,"text":"Stops need room beyond that normal noise, or they get hit for no real reason.","ml":"Stop-ന് ഈ സാധാരണ ഇളക്കത്തിനപ്പുറം ഇടം വേണം, അല്ലെങ്കിൽ കാരണമില്ലാതെ അത് hit ആകും."},{"t":90.4,"d":7.15,"text":"Swing points are turning points: a high with lower highs on both sides, or a low with higher lows.","ml":"Swing point-കൾ തിരിവുകളാണ്: ഇരുവശത്തും താഴ്ന്ന high-കളുള്ള ഒരു high, അല്ലെങ്കിൽ ഉയർന്ന low-കളുള്ള ഒരു low."},{"t":97.8,"d":7.35,"text":"Highs go 60,100 then 60,250. Lows go 59,900 then 60,040. Higher highs and higher lows: UP.","ml":"High-കൾ 60,100, പിന്നെ 60,250. Low-കൾ 59,900, പിന്നെ 60,040. ഉയർന്ന high-ഉം ഉയർന്ന low-ഉം: UP."},{"t":105.4,"d":8.35,"text":"Lower highs and lower lows mean DOWN. Anything else is RANGE. Each timeframe gets its own trend.","ml":"താഴ്ന്ന high-ഉം താഴ്ന്ന low-ഉം ആണെങ്കിൽ DOWN. ബാക്കിയെല്ലാം RANGE. ഓരോ timeframe-നും സ്വന്തം trend."},{"t":114.4,"d":5.15,"text":"Swing lows and highs show where buyers or sellers stepped in before.","ml":"Swing low-കളും high-കളും മുമ്പ് buyers അല്ലെങ്കിൽ sellers ഇടപെട്ട ഇടങ്ങൾ കാണിക്കും."},{"t":119.8,"d":7.15,"text":"XORA draws zones around them: support below price, resistance above. A zone is a band, not a line.","ml":"XORA അവയ്ക്ക് ചുറ്റും zone-കൾ വരയ്ക്കും: വിലയ്ക്ക് താഴെ support, മുകളിൽ resistance. Zone ഒരു വരയല്ല, ഒരു ബാൻഡ്."},{"t":127.2,"d":6.55,"text":"Fictional zones here: support 60,000 to 60,060, resistance 60,480 to 60,530.","ml":"ഇവിടെ സാങ്കൽപ്പിക zone-കൾ: support 60,000 മുതൽ 60,060 വരെ, resistance 60,480 മുതൽ 60,530 വരെ."},{"t":134.4,"d":6.55,"text":"Then movement. Momentum asks how strongly price is moving. RSI is one well-known gauge.","ml":"പിന്നെ movement. വില എത്ര ശക്തമായി നീങ്ങുന്നു എന്ന് momentum ചോദിക്കും. RSI അതിന്റെ ഒരു പ്രശസ്ത അളവാണ്."},{"t":141.2,"d":6.75,"text":"Pressure compares buyers and sellers trading at market. Volume shows activity versus usual.","ml":"Pressure, market-ൽ ട്രേഡ് ചെയ്യുന്ന buyers-നെയും sellers-നെയും താരതമ്യം ചെയ്യും. Volume സാധാരണയെക്കാൾ എത്ര തിരക്കെന്ന് കാണിക്കും."},{"t":148.2,"d":6.55,"text":"Strong, agreeing movement adds evidence. Weak or mixed movement is a reason to wait.","ml":"ശക്തമായ, ഒത്തുപോകുന്ന movement തെളിവ് കൂട്ടും. ദുർബലമോ കലർന്നതോ ആണെങ്കിൽ wait ചെയ്യാൻ കാരണം."},{"t":155.4,"d":4.55,"text":"Now XORA looks for candidate setups, the shapes it trades.","ml":"ഇനി XORA candidate setup-കൾ തിരയും, അത് ട്രേഡ് ചെയ്യുന്ന രൂപങ്ങൾ."},{"t":160.2,"d":6.65,"text":"A reaction at support: price dips into the zone and bounces. Or a rejection at resistance.","ml":"Support-ൽ ഒരു reaction: വില zone-ലേക്ക് ഇറങ്ങി തിരിച്ചുകയറും. അല്ലെങ്കിൽ resistance-ൽ ഒരു rejection."},{"t":167.1,"d":9.65,"text":"A breakout: a close beyond a level. Or a retest: price comes back to a broken level and holds.","ml":"ഒരു breakout: ഒരു level-ന് അപ്പുറം close. അല്ലെങ്കിൽ ഒരു retest: തകർന്ന level-ലേക്ക് വില തിരിച്ചുവന്ന് പിടിച്ചുനിൽക്കും."},{"t":177.4,"d":6.05,"text":"Our coin dipped into support and closed back up. That candle is the setup candle.","ml":"നമ്മുടെ കോയിൻ support-ലേക്ക് ഇറങ്ങി, മുകളിൽ close ചെയ്തു. ആ candle ആണ് setup candle."},{"t":183.7,"d":6.95,"text":"The plan: BUY if price trades above the setup candle's high, 60,120. That price is the trigger.","ml":"പ്ലാൻ: setup candle-ന്റെ high ആയ 60,120-ന് മുകളിൽ വില ട്രേഡ് ചെയ്താൽ BUY. ആ വിലയാണ് trigger."},{"t":190.9,"d":6.45,"text":"The stop sits beyond the support zone, at 59,940. Risk: 180 USDT per BTC, about 0.30%.","ml":"Stop support zone-ന് അപ്പുറം, 59,940-ൽ. റിസ്ക്: ഒരു BTC-ക്ക് 180 USDT, ഏകദേശം 0.30%."},{"t":197.6,"d":7.15,"text":"The next resistance is 360 USDT above the trigger: 2 R, twice the risk.","ml":"അടുത്ത resistance trigger-ന് 360 USDT മുകളിലാണ്: 2 R, റിസ്കിന്റെ ഇരട്ടി."},{"t":205.4,"d":5.75,"text":"The next candle opens. Price climbs above 60,120, so the plan triggers.","ml":"അടുത്ത candle തുടങ്ങുന്നു. വില 60,120-ന് മുകളിൽ കയറുന്നു, അങ്ങനെ പ്ലാൻ trigger ആകുന്നു."},{"t":211.4,"d":6.25,"text":"At the trigger, every check runs again. If something has changed, there is no trade.","ml":"Trigger-ൽ എല്ലാ check-ഉം വീണ്ടും നടക്കും. എന്തെങ്കിലും മാറിയിട്ടുണ്ടെങ്കിൽ ട്രേഡ് ഇല്ല."},{"t":217.9,"d":8.85,"text":"And if price never reaches 60,120 before the candle closes, the plan expires. A fresh plan follows.","ml":"Candle close ആകും മുൻപ് വില 60,120 എത്തിയില്ലെങ്കിൽ, പ്ലാൻ expire ആകും. പിന്നാലെ പുതിയ പ്ലാൻ വരും."},{"t":227.4,"d":5.35,"text":"A common mistake: reading a plan as a prediction that price will go up.","ml":"ഒരു സാധാരണ തെറ്റ്: പ്ലാനിനെ വില കയറും എന്ന പ്രവചനമായി വായിക്കുന്നത്."},{"t":233,"d":9.75,"text":"It is only an if. Most plans expire, no trade is normal, and triggered trades can still lose.","ml":"അത് ഒരു 'എങ്കിൽ' മാത്രം. മിക്ക പ്ലാനുകളും expire ആകും, ട്രേഡ് ഇല്ലാത്തത് സാധാരണം, trigger ആയ ട്രേഡും നഷ്ടത്തിലാകാം."},{"t":243.4,"d":9.35,"text":"Your turn. The setup candle's high is 60,120. The next candle reaches 60,100, then closes. What happens?","ml":"നിന്റെ ഊഴം. Setup candle-ന്റെ high 60,120. അടുത്ത candle 60,100 വരെ എത്തി close ആകുന്നു. എന്ത് സംഭവിക്കും?"},{"t":253,"d":7.75,"text":"The trigger was never reached, so no trade. The plan expires, and a fresh plan comes at the close.","ml":"Trigger എത്തിയില്ല, അതുകൊണ്ട് ട്രേഡ് ഇല്ല. പ്ലാൻ expire ആകും, close-ൽ പുതിയ പ്ലാൻ വരും."},{"t":261.3,"d":6.45,"text":"Remember the limits. These checks read the past. They cannot know what price does next.","ml":"പരിധികൾ ഓർക്കുക. ഈ check-കൾ ഭൂതകാലം വായിക്കുന്നു. വില അടുത്തത് എന്ത് ചെയ്യുമെന്ന് അവയ്ക്ക് അറിയില്ല."},{"t":268,"d":4.95,"text":"Fast markets can jump past a stop, and fees apply to every trade.","ml":"വേഗമുള്ള മാർക്കറ്റിൽ വില stop-നെ ചാടിക്കടക്കാം, ഓരോ ട്രേഡിനും ഫീസും ഉണ്ട്."},{"t":273.2,"d":6.55,"text":"XORA does not guarantee profits. Use Demo first. This is not financial advice.","ml":"XORA ലാഭം ഗ്യാരന്റി ചെയ്യുന്നില്ല. ആദ്യം Demo ഉപയോഗിക്കുക. ഇത് സാമ്പത്തിക ഉപദേശമല്ല."},{"t":280.4,"d":5.25,"text":"Recap. XORA reads closed candles and makes a fresh plan every minute.","ml":"ചുരുക്കം. XORA അടഞ്ഞ candle-കൾ വായിക്കുന്നു, ഓരോ മിനിറ്റിലും പുതിയ പ്ലാൻ ഉണ്ടാക്കുന്നു."},{"t":285.9,"d":5.95,"text":"It checks volatility, swings, trend, zones and movement, then looks for a setup.","ml":"Volatility, swings, trend, zones, movement നോക്കി, പിന്നെ ഒരു setup തിരയും."},{"t":292.1,"d":6.65,"text":"A plan is an if for one candle: a trigger, a stop beyond the level, and checks again.","ml":"പ്ലാൻ ഒരു candle-നുള്ള 'എങ്കിൽ' ആണ്: ഒരു trigger, level-ന് അപ്പുറം stop, പിന്നെ വീണ്ടും check."},{"t":299.6,"d":9.15,"text":"Next, T26: understanding AI decisions. XORA does not guarantee profits. Demo first. Not financial advice.","ml":"അടുത്തത് T26: AI തീരുമാനങ്ങൾ മനസ്സിലാക്കാം. XORA ലാഭം ഗ്യാരന്റി ചെയ്യുന്നില്ല. ആദ്യം Demo. സാമ്പത്തിക ഉപദേശമല്ല."}]},"assetBase":"T25/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":331,"h":446},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448} der:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n/* Phase 6: generic phone mock of the XORA app */\n.ph { position:absolute; box-sizing:border-box; border-radius:58px; background:#0a0d19; border:2px solid color-mix(in srgb, var(--main) 38%, transparent); box-shadow:0 40px 90px rgba(0,0,0,.55), inset 0 0 0 7px #04050c; z-index:2 }\n.ph-scr { position:absolute; inset:14px; border-radius:46px; overflow:hidden; background:linear-gradient(180deg, #080b18, #03040b) }\n.ph-sb { position:absolute; left:34px; right:30px; top:14px; display:flex; justify-content:space-between; align-items:center; font-size:22px; color:color-mix(in srgb, var(--second) 75%, var(--ground)) }\n.ph-env { padding:2px 12px; border-radius:999px; font-size:22px; color:var(--main); border:1.5px solid color-mix(in srgb, var(--main) 55%, transparent) }\n.ph-body { position:absolute; left:18px; right:18px; top:58px; bottom:98px; overflow:visible }\n.ph-tabs { position:absolute; left:0; right:0; bottom:0; height:90px; display:flex; align-items:center; justify-content:space-around; padding:0 6px; border-top:1.5px solid color-mix(in srgb, var(--second) 10%, transparent); background:#070915 }\n.ph-tab { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:22px; font-weight:600; color:color-mix(in srgb, var(--second) 55%, var(--ground)) }\n.ph-tx { margin-top:-14px }\n.ph-xb { width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--display, sans-serif); font-weight:700; font-size:28px; color:var(--ground); background:linear-gradient(135deg, var(--main), var(--accent)); box-shadow:0 0 0 5px #070915 }\n.ph-lab { position:absolute; margin:0; text-align:center; font-size:19px; line-height:1.5; letter-spacing:.12em }\n.pc { box-sizing:border-box; border-radius:20px; padding:12px 16px; background:color-mix(in srgb, var(--ground) 84%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent) }\n.pk { margin:0; font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.08em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 58%, var(--ground)) }\n.pv { margin:0; font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums; font-size:30px; color:var(--second) }\n.pt { margin:0; font-size:24px; line-height:1.35; font-weight:600 }\n.pill { display:inline-flex; align-items:center; gap:8px; padding:4px 14px; border-radius:999px; font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.06em; border:1.5px solid currentColor; white-space:nowrap }\n.btn { display:flex; align-items:center; justify-content:center; border-radius:16px; font-weight:700; font-size:24px; letter-spacing:.04em; white-space:nowrap }\n.flow { position:absolute; box-sizing:border-box; display:flex; flex-direction:column; gap:8px; padding:18px 22px; border-radius:22px; background:color-mix(in srgb, var(--ground) 86%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent) }\n","narration.json":"{\n  \"about\": \"T25 captions (no voiceover yet): How XORA analyses a coin. Each line starts at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson T25: how XORA analyses a coin. Let's look inside the routine.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"What does XORA do with a coin? Every minute, it runs the same careful routine.\"\n    },\n    {\n      \"t\": 14.5,\n      \"text\": \"Candles in. Then volatility, swings, trend, zones, movement and possible setups.\"\n    },\n    {\n      \"t\": 20.7,\n      \"text\": \"Out comes a plan for one candle, or no plan. Let's follow one fictional coin.\"\n    },\n    {\n      \"t\": 27.4,\n      \"text\": \"It starts with history: the coin's recent 1-minute candles. Each shows open, high, low and close.\"\n    },\n    {\n      \"t\": 34.8,\n      \"text\": \"XORA also checks bigger timeframes, like 5 and 15 minutes, and the order book.\"\n    },\n    {\n      \"t\": 40.9,\n      \"text\": \"These are common techniques. XORA's filters draw on them; the exact rules are its own.\"\n    },\n    {\n      \"t\": 48.4,\n      \"text\": \"One rule matters a lot: XORA uses closed candles only. A forming candle can still change.\"\n    },\n    {\n      \"t\": 55.4,\n      \"text\": \"Its high, low and colour can flip before the minute ends, so a signal from it could vanish.\"\n    },\n    {\n      \"t\": 62.4,\n      \"text\": \"So at every candle close, the engine makes a fresh plan for each coin.\"\n    },\n    {\n      \"t\": 69.4,\n      \"text\": \"Next: volatility, how much price usually moves. A common measure is ATR, average true range.\"\n    },\n    {\n      \"t\": 76.6,\n      \"text\": \"Simple version: average recent candle sizes. 60, 50, 40, 50 and 100 USDT average 60 USDT.\"\n    },\n    {\n      \"t\": 83.8,\n      \"text\": \"Stops need room beyond that normal noise, or they get hit for no real reason.\"\n    },\n    {\n      \"t\": 90.4,\n      \"text\": \"Swing points are turning points: a high with lower highs on both sides, or a low with higher lows.\"\n    },\n    {\n      \"t\": 97.8,\n      \"text\": \"Highs go 60,100 then 60,250. Lows go 59,900 then 60,040. Higher highs and higher lows: UP.\"\n    },\n    {\n      \"t\": 105.4,\n      \"text\": \"Lower highs and lower lows mean DOWN. Anything else is RANGE. Each timeframe gets its own trend.\"\n    },\n    {\n      \"t\": 114.4,\n      \"text\": \"Swing lows and highs show where buyers or sellers stepped in before.\"\n    },\n    {\n      \"t\": 119.8,\n      \"text\": \"XORA draws zones around them: support below price, resistance above. A zone is a band, not a line.\"\n    },\n    {\n      \"t\": 127.2,\n      \"text\": \"Fictional zones here: support 60,000 to 60,060, resistance 60,480 to 60,530.\"\n    },\n    {\n      \"t\": 134.4,\n      \"text\": \"Then movement. Momentum asks how strongly price is moving. RSI is one well-known gauge.\"\n    },\n    {\n      \"t\": 141.2,\n      \"text\": \"Pressure compares buyers and sellers trading at market. Volume shows activity versus usual.\"\n    },\n    {\n      \"t\": 148.2,\n      \"text\": \"Strong, agreeing movement adds evidence. Weak or mixed movement is a reason to wait.\"\n    },\n    {\n      \"t\": 155.4,\n      \"text\": \"Now XORA looks for candidate setups, the shapes it trades.\"\n    },\n    {\n      \"t\": 160.2,\n      \"text\": \"A reaction at support: price dips into the zone and bounces. Or a rejection at resistance.\"\n    },\n    {\n      \"t\": 167.1,\n      \"text\": \"A breakout: a close beyond a level. Or a retest: price comes back to a broken level and holds.\"\n    },\n    {\n      \"t\": 177.4,\n      \"text\": \"Our coin dipped into support and closed back up. That candle is the setup candle.\"\n    },\n    {\n      \"t\": 183.7,\n      \"text\": \"The plan: BUY if price trades above the setup candle's high, 60,120. That price is the trigger.\"\n    },\n    {\n      \"t\": 190.9,\n      \"text\": \"The stop sits beyond the support zone, at 59,940. Risk: 180 USDT per BTC, about 0.30%.\"\n    },\n    {\n      \"t\": 197.6,\n      \"text\": \"The next resistance is 360 USDT above the trigger: 2 R, twice the risk.\"\n    },\n    {\n      \"t\": 205.4,\n      \"text\": \"The next candle opens. Price climbs above 60,120, so the plan triggers.\"\n    },\n    {\n      \"t\": 211.4,\n      \"text\": \"At the trigger, every check runs again. If something has changed, there is no trade.\"\n    },\n    {\n      \"t\": 217.9,\n      \"text\": \"And if price never reaches 60,120 before the candle closes, the plan expires. A fresh plan follows.\"\n    },\n    {\n      \"t\": 227.4,\n      \"text\": \"A common mistake: reading a plan as a prediction that price will go up.\"\n    },\n    {\n      \"t\": 233.0,\n      \"text\": \"It is only an if. Most plans expire, no trade is normal, and triggered trades can still lose.\"\n    },\n    {\n      \"t\": 243.4,\n      \"text\": \"Your turn. The setup candle's high is 60,120. The next candle reaches 60,100, then closes. What happens?\"\n    },\n    {\n      \"t\": 253.0,\n      \"text\": \"The trigger was never reached, so no trade. The plan expires, and a fresh plan comes at the close.\"\n    },\n    {\n      \"t\": 261.3,\n      \"text\": \"Remember the limits. These checks read the past. They cannot know what price does next.\"\n    },\n    {\n      \"t\": 268.0,\n      \"text\": \"Fast markets can jump past a stop, and fees apply to every trade.\"\n    },\n    {\n      \"t\": 273.2,\n      \"text\": \"XORA does not guarantee profits. Use Demo first. This is not financial advice.\"\n    },\n    {\n      \"t\": 280.4,\n      \"text\": \"Recap. XORA reads closed candles and makes a fresh plan every minute.\"\n    },\n    {\n      \"t\": 285.9,\n      \"text\": \"It checks volatility, swings, trend, zones and movement, then looks for a setup.\"\n    },\n    {\n      \"t\": 292.1,\n      \"text\": \"A plan is an if for one candle: a trigger, a stop beyond the level, and checks again.\"\n    },\n    {\n      \"t\": 299.6,\n      \"text\": \"Next, T26: understanding AI decisions. XORA does not guarantee profits. Demo first. Not financial advice.\"\n    }\n  ]\n}","scene-candles.js":"const { seg, eo, ei, eob, lerp } = kit;\nconst CN_L = [['1-minute candles', 'Newest: O 60,070 · H 60,120 · L 60,020 · C 60,110', 2.0], ['Bigger timeframes', '5m · 15m · 1h candles', 8.2], ['Order book', 'Bids and asks waiting to trade', 10.4]];\nkit.scene('candles', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.ch = UI.chart(kit, 'cn', { draw: 1.0, k: 0.18 });\n    let rows = '';\n    CN_L.forEach((r) => { rows += '<div class=\"cn-r\" style=\"display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent)\"><span class=\"dot\" style=\"margin-top:12px\"></span><div style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:30px;font-weight:700\">' + r[0] + '</span><span style=\"font-size:26px;color:color-mix(in srgb, var(--second) 64%, var(--ground))\">' + r[1] + '</span></div></div>'; });\n    kit.stage.append(kit.h('<div class=\"glass cn-p\" style=\"left:1230px;top:290px;width:460px;padding:20px 30px\"><p class=\"kick\" style=\"margin:0 0 4px\">What XORA reads</p>' + rows + '</div>'));\n    const D = UI.D, x = D.x(23);\n    this.ch.ov.innerHTML = '<rect class=\"cn-an\" x=\"' + (x - 24) + '\" y=\"' + (D.y(60120) - 14).toFixed(1) + '\" width=\"48\" height=\"' + (D.y(60020) - D.y(60120) + 28).toFixed(1) + '\" rx=\"8\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--second);opacity:0\"/>';\n    this.head = UI.head(kit, 'Step 1 · data', 'Candles in');\n    this.p = kit.stage.querySelector('.cn-p').style; this.rs = [...kit.stage.querySelectorAll('.cn-r')].map((e) => e.style);\n    this.an = kit.stage.querySelector('.cn-an').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'candles' }, { t: 7.8, pose: 'read' }, { t: 13.9, pose: 'explain' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t); this.head(t);\n    this.ch.render(t);\n    this.an.opacity = eo(seg(t, 2.2, 2.7)) * (1 - ei(seg(t, 7.6, 8.1)));\n    UI.rise(kit, this.p, t, 1.6, 0.6, 24);\n    this.rs.forEach((s, i) => UI.rise(kit, s, t, CN_L[i][2], 0.5, 14));\n    this.tutor.render(t);\n  },\n});\n","scene-closed.js":"const { seg, eo, ei, eob, eio, lerp, clamp01 } = kit;\n// The forming candle (index 23 here) wobbles until it closes at t = 10.6.\nconst CL_END = 10.6;\nconst CL_F = (t) => {\n  const k = clamp01(t / CL_END), c0 = 60070;\n  const wob = 34 * Math.sin(t * 2.3) + 18 * Math.sin(t * 5.1);\n  return c0 + (60110 - c0) * k + wob * (1 - k * k);\n};\nkit.scene('closed', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.ch = UI.chart(kit, 'cl', { n: 23, cap: 24 });\n    const D = UI.D, x = D.x(23);\n    this.ch.ov.innerHTML = '<rect class=\"cl-box\" x=\"' + (x - 26) + '\" y=\"300\" width=\"52\" height=\"400\" rx=\"10\" fill=\"none\" stroke-width=\"3\" stroke-dasharray=\"8 8\" style=\"stroke:#ffb547\"/>';\n    kit.stage.append(kit.h('<div>' +\n      '<div class=\"glass cl-a\" style=\"left:1230px;top:290px;width:460px;padding:20px 28px;border-color:#ffb547\"><p class=\"kick\" style=\"margin:0 0 8px;color:#ffb547\">Still forming</p><p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">Not used yet. Its high, low and close can still change.</p><p class=\"mono cl-v\" style=\"margin:10px 0 0;font-size:30px\"></p></div>' +\n      '<div class=\"glass cl-b\" style=\"left:1230px;top:290px;width:460px;padding:20px 28px;border-color:var(--up)\"><p class=\"kick\" style=\"margin:0 0 8px;color:var(--up)\">Closed ✓</p><p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">Locked in. Now it counts.</p></div>' +\n      '<div class=\"glass cl-k\" style=\"left:1230px;top:470px;width:460px;padding:20px 28px\"><p class=\"kick\" style=\"margin:0 0 8px\">At every close</p><p style=\"margin:0;font-size:28px;line-height:1.4;font-weight:600\">A fresh plan for each coin</p><p class=\"mono cl-clk\" style=\"margin:10px 0 0;font-size:30px;color:var(--main)\"></p></div>' +\n      '</div>'));\n    this.head = UI.head(kit, 'Step 1 · the golden rule', 'Closed candles only');\n    const q = (s) => kit.stage.querySelector(s);\n    this.box = q('.cl-box'); this.a = q('.cl-a').style; this.b = q('.cl-b').style; this.c = q('.cl-k').style; this.v = q('.cl-v'); this.clk = q('.cl-clk');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'magnify' }, { t: 7.4, pose: 'confused' }, { t: 10.8, pose: 'thumbs' }, { t: 14.4, pose: 'present' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t); this.head(t);\n    const live = t < CL_END;\n    let hi = 60070, lo = 60070;\n    for (let s = 0; s <= Math.min(t, CL_END) + 1e-6; s += 0.1) { const v = CL_F(s); hi = Math.max(hi, v); lo = Math.min(lo, v); }\n    const cl = live ? CL_F(t) : 60110;\n    if (!live) { hi = 60120; lo = 60020; }\n    const lc = [60070, Math.max(hi, 60070), Math.min(lo, 60070), cl];\n    lc.live = live && t > 0.8;\n    this.ch.render(t, 1, t > 0.8 ? lc : null);\n    this.box.style.opacity = (live ? eo(seg(t, 0.8, 1.2)) * (0.6 + 0.4 * Math.sin(t * 6)) : 1 - eo(seg(t, CL_END, CL_END + 0.4))).toFixed(3);\n    UI.rise(kit, this.a, t, 1.2, 0.6, 20, CL_END - 0.2, CL_END + 0.2);\n    UI.set(this.v, 'close now ' + UI.fmt(Math.round(cl)));\n    this.v.style.color = cl >= 60070 ? 'var(--up)' : 'var(--down)';\n    UI.rise(kit, this.b, t, CL_END + 0.1, 0.5, 14);\n    UI.rise(kit, this.c, t, 14.4, 0.6, 20);\n    UI.set(this.clk, t < 14.4 ? '' : '10:24 → plan · 10:25 → new plan');\n    this.tutor.render(t);\n  },\n});\n","scene-hook.js":"const { seg, eo, ei, eob, eio, lerp } = kit;\nconst HK = [['1-minute candles', 'closed ones only', 2.0], ['Volatility & swings', 'ATR, turning points', 7.2], ['Trend', 'per timeframe', 8.2], ['Zones', 'support, resistance', 9.2],\n  ['Movement', 'momentum, pressure, volume', 10.4], ['Candidate setups', 'reaction, breakout, retest', 11.6], ['A plan for one candle', 'or no plan at all', 13.2]];\nkit.scene('hook', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    let html = '', lines = '';\n    const P = HK.map((h, i) => [140 + (i % 4) * 390, i < 4 ? 330 : 560]);\n    P[4][0] += 195; P[5][0] += 195; P[6][0] += 195;\n    HK.forEach((h, i) => {\n      html += '<div class=\"glass hk-c\" style=\"left:' + P[i][0] + 'px;top:' + P[i][1] + 'px;width:360px;height:170px;padding:20px 24px;display:flex;flex-direction:column;gap:8px' + (i === 6 ? ';border-color:var(--main)' : '') + '\">' +\n        '<span class=\"mono\" style=\"font-size:24px;color:var(--main)\">' + String(i + 1).padStart(2, '0') + '</span><span style=\"font-size:31px;font-weight:700;line-height:1.15\">' + h[0] + '</span><span style=\"font-size:24px;color:color-mix(in srgb, var(--second) 62%, var(--ground))\">' + h[1] + '</span></div>';\n      if (i) lines += '<line class=\"hk-l\" x1=\"' + (P[i - 1][0] + 180) + '\" y1=\"' + (P[i - 1][1] + 85) + '\" x2=\"' + (P[i][0] + 180) + '\" y2=\"' + (P[i][1] + 85) + '\" pathLength=\"1\" stroke-width=\"4\" style=\"stroke:color-mix(in srgb, var(--main) 55%, transparent)\"/>';\n    });\n    kit.stage.append(kit.h('<div><svg class=\"art\" viewBox=\"0 0 1920 1080\">' + lines + '</svg>' + html + '</div>'));\n    this.head = UI.head(kit, 'Every minute, for every coin', 'Inside the routine');\n    const all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.cs = all('.hk-c').map((e) => e.style); this.ls = all('.hk-l');\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'present' }, { t: 0.6, pose: 'think' }, { t: 6.5, pose: 'pointer' }, { t: 12.7, pose: 'idea' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t); this.head(t);\n    this.cs.forEach((s, i) => {\n      const a = HK[i][2], p = seg(t, a, a + 0.6);\n      s.opacity = eo(seg(t, a, a + 0.35)).toFixed(3);\n      s.transform = 'translateY(' + lerp(26, 0, eo(p)).toFixed(1) + 'px) scale(' + lerp(0.94, 1, eob(p, 1.6)).toFixed(4) + ')';\n      UI.glow(s, eo(seg(t, a, a + 0.3)) * (1 - ei(seg(t, a + 0.9, a + 1.4))) + (i === 6 ? eo(seg(t, 13.6, 14.0)) * (0.7 + 0.3 * Math.sin(t * 3)) : 0));\n    });\n    this.ls.forEach((l, i) => l.setAttribute('stroke-dasharray', eio(seg(t, HK[i + 1][2] - 0.5, HK[i + 1][2])) + ' 1'));\n    this.tutor.render(t);\n  },\n});\n","scene-mistake.js":"const { seg, eo, ei, eob, eio, lerp } = kit;\nkit.scene('mistake', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div>' +\n      '<div class=\"glass mk-a\" style=\"left:140px;top:300px;width:760px;height:400px;padding:28px 36px;border-color:color-mix(in srgb, var(--down) 55%, transparent)\"><p class=\"kick\" style=\"margin:0 0 18px;color:var(--down)\">Mistake</p>' +\n      '<p class=\"mono\" style=\"margin:0;font-size:34px;color:var(--up)\">BUY if price trades above 60,120</p><p style=\"margin:24px 0 0;font-size:56px;line-height:1\">↓</p>' +\n      '<p style=\"margin:18px 0 0;font-size:38px;font-weight:700\">\"So price will go up!\"</p>' +\n      '<svg class=\"mk-x\" width=\"760\" height=\"400\" viewBox=\"0 0 760 400\" style=\"position:absolute;left:0;top:0\"><path d=\"M160 210 L600 340 M600 210 L160 340\" pathLength=\"1\" fill=\"none\" stroke-width=\"10\" stroke-linecap=\"round\" style=\"stroke:color-mix(in srgb, var(--down) 70%, transparent)\"/></svg></div>' +\n      '<div class=\"glass mk-b\" style=\"left:940px;top:300px;width:740px;height:400px;padding:28px 36px;border-color:color-mix(in srgb, var(--up) 55%, transparent)\"><p class=\"kick\" style=\"margin:0 0 10px;color:var(--up)\">Better</p>' +\n      ['A plan is an <b class=\"hl\">if</b>, not a forecast', 'Most plans <b class=\"hl\">expire</b> untouched', '<b class=\"hl\">No trade</b> is a normal result', 'Triggered trades can still <b class=\"dn\">lose</b>'].map((s) => '<div class=\"mk-g\" style=\"display:flex;align-items:center;gap:18px;padding:14px 0\"><b style=\"color:var(--up);font-size:32px\">✓</b><span style=\"font-size:31px;font-weight:600\">' + s + '</span></div>').join('') + '</div></div>'));\n    this.head = UI.head(kit, 'Common mistake', 'A plan is not a prediction');\n    const q = (s) => kit.stage.querySelector(s);\n    this.a  tutor walks in beside a turning candle ring.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"The routine\",\n      \"dur\": 19,\n      \"desc\": \"Seven steps light up in order: candles, volatility and swings, trend, zones, movement, setups, a plan for one candle.\"\n    },\n    {\n      \"id\": \"candles\",\n      \"name\": \"Candles in\",\n      \"dur\": 21,\n      \"desc\": \"A fictional BTC/USDT 1-minute chart draws in; side panel lists the data: 1-minute history, bigger timeframes, order book.\"\n    },\n    {\n      \"id\": \"closed\",\n      \"name\": \"Closed candles only\",\n      \"dur\": 21,\n      \"desc\": \"The last candle flickers while forming and is ignored; when it closes it is locked in and a fresh plan is made.\"\n    },\n    {\n      \"id\": \"volatility\",\n      \"name\": \"Volatility\",\n      \"dur\": 21,\n      \"desc\": \"Volatility: the five latest candle ranges 60, 50, 40, 50, 100 USDT average 60 USDT (a simple ATR).\"\n    },\n    {\n      \"id\": \"trend\",\n      \"name\": \"Swings and trend\",\n      \"dur\": 24,\n      \"desc\": \"Swing highs and lows are marked; highs 60,100 to 60,250 and lows 59,900 to 60,040 make an UP trend; trend per timeframe panel.\"\n    },\n    {\n      \"id\": \"zones\",\n      \"name\": \"Support and resistance zones\",\n      \"dur\": 20,\n      \"desc\": \"Zones are drawn around swing points: support 60,000 to 60,060, resistance 60,480 to 60,530.\"\n    },\n    {\n      \"id\": \"movement\",\n      \"name\": \"Movement\",\n      \"dur\": 21,\n      \"desc\": \"Three meters: momentum rising, buyer pressure growing, volume above its recent average.\"\n    },\n    {\n      \"id\": \"setups\",\n      \"name\": \"Candidate setups\",\n      \"dur\": 22,\n      \"desc\": \"Four mini charts: reaction at support, rejection at resistance, breakout, retest.\"\n    },\n    {\n      \"id\": \"plan\",\n      \"name\": \"A plan for one candle\",\n      \"dur\": 28,\n      \"desc\": \"Setup candle at support; trigger 60,120, stop 59,940, risk 180 USDT per BTC (0.30%), next resistance 60,480 (2 R).\"\n    },\n    {\n      \"id\": \"trigger\",\n      \"name\": \"At the trigger\",\n      \"dur\": 22,\n      \"desc\": \"The next candle trades above 60,120; every check runs again and passes; otherwise the plan expires at the close.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"A common mistake\",\n      \"dur\": 16,\n      \"desc\": \"Mistake: reading the plan as a prediction; correction: it is an if, most plans expire, triggered trades can lose.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 18,\n      \"desc\": \"Pause and answer: the next candle only reaches 60,100; answer: no trigger, no trade, a fresh plan at the close.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the limits\",\n      \"dur\": 19,\n      \"desc\": \"Risk cards: checks read the past, gaps and slippage, fees, demo first.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 19,\n      \"desc\": \"Three points: closed candles and a fresh plan every minute; the analysis steps; a plan is an if for one candle.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T26, understanding AI decisions; risk line.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // A quiet bed for a lesson that will carry a voiceover: pad and soft keys, a light pulse in the hands-on parts.\n  const BPM = 84, B = 60 / BPM, BAR = 4 * B;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.setups, T.mistake);\n  const quiet = (s) => inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / BAR);\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 28 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 42 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  [[T.title, 2.9], [T.candles, 1.6], [T.closed, 1.2], [T.closed, 14.4], [T.volatility, 7.6], [T.trend, 12.6], [T.trend, 16.2], [T.zones, 13.2], [T.zones, 14.0], [T.movement, 1.6], [T.movement, 7.6], [T.movement, 10.4],\n   [T.plan, 7.0], [T.mistake, 6.0], [T.recap, 0.6], [T.recap, 6.1], [T.recap, 12.3], [T.next, 1.3]].forEach((b) => S.fx('pop', b[0] + b[1], { vel: 28, pitch: 7 }));\n  for (let i = 0; i < 7; i++) S.fx('pop', T.title + 0.4 + i * 0.5, { vel: 18, pitch: 4 });\n  [2.0, 7.2, 8.2, 9.2, 10.4, 11.6, 13.2].forEach((a, i) => S.fx(i === 6 ? 'chime' : 'tick', T.hook + a, { vel: 28 }));\n  for (let i = 0; i < 24; i += 2) S.fx('tick', T.candles + 1.0 + i * 0.18, { vel: 14 });\n  [2.0, 8.2, 10.4].forEach((a) => S.fx('pop', T.candles + a, { vel: 24 }));\n  S.fx('thud', T.closed + 10.6, { vel: 30 }); S.fx('ding', T.closed + 10.7, { vel: 30 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.volatility + 8.2 + i * 0.6, { vel: 26 });\n  S.fx('ding', T.volatility + 12.4, { vel: 34 });\n  [1.6, 2.4, 3.2, 4.0].forEach((a) => S.fx('pop', T.trend + a, { vel: 24 }));\n  S.fx('whoosh', T.trend + 9.6, { dur: 0.9, vel: 18 }); S.fx('whoosh', T.trend + 11.8, { dur: 0.9, vel: 18 });\n  S.fx('whoosh', T.zones + 6.8, { dur: 1.0, vel: 20 }); S.fx('whoosh', T.zones + 9.0, { dur: 1.0, vel: 20 });\n  [5.2, 8.4, 12.1, 15.0].forEach((a) => S.fx('chime', T.setups + a, { vel: 24 }));\n  for (let i = 0; i < 4; i++) S.fx('pop', T.setups + 1.0 + i * 0.3, { vel: 20 });\n  S.fx('ding', T.plan + 8.4, { vel: 32 }); S.fx('thud', T.plan + 14.8, { vel: 26 }); S.fx('ding', T.plan + 21.4, { vel: 30 });\n  S.fx('chime', T.trigger + 3.6, { vel: 40 });\n  for (let i = 0; i < 4; i++) S.fx('tick', T.trigger + 7.2 + i * 0.8, { vel: 28 });\n  S.fx('ding', T.trigger + 10.6, { vel: 34 }); S.fx('pop', T.trigger + 13.2, { vel: 26 });\n  S.fx('thud', T.mistake + 4.6, { vel: 30 });\n  for (let i = 0; i < 4; i++) S.fx('pop', T.mistake + 6.8 + i * 1.4, { vel: 26 });\n  S.fx('pop', T.try + 0.6, { vel: 28 });\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 4.0 + i, { vel: 30 });\n  S.fx('chime', T.try + 10.0, { vel: 40 });\n  [0.6, 7.0, 9.6, 12.2].forEach((a) => S.fx('pop', T.risks + a, { vel: 24 }));\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 22, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T25 · How XORA analyses a coin',\n  TOTAL: 309,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // Side speech bubbles sit this far higher than in T01, so they clear the two-line caption band (y ≈ 784–930).\n  LIFT: 96,\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n  // ── Chart helpers (from T14) ──\n  // Piecewise eased value through keys [[t, v], ...].\n  path(keys, t) {\n    const K = UI.K; let v = keys[0][1];\n    for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = K.lerp(a[1], b[1], K.eio(K.clamp01((t - a[0]) / (b[0] - a[0])))); }\n    return v;\n  },\n  // Price grid for a chart: horizontal lines with price labels to the right of x1.\n  grid(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (+y + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Same grid with the price labels on the left, ending at x0 - 14.\n  gridL(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x0 - 14) + '\" y=\"' + (+y + 8) + '\" text-anchor=\"end\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Polyline of a price function f(s) for s in [s0, s1], mapped with xOf and yOf.\n  line(f, s0, s1, xOf, yOf, dt) {\n    let d = '';\n    for (let s = s0; s <= s1 + 1e-6; s += dt || 0.05) d += (d ? 'L' : 'M') + xOf(s).toFixed(1) + ' ' + yOf(f(s)).toFixed(1);\n    return d || 'M0 0';\n  },\n  // ── Candle helpers (T14) ──\n  // n SVG candles: html to place inside an <svg>; set(i, c) draws candle i with\n  // c = {x, w, o, h, l, c, y: price → y, op?, live?, col?}. Up (close ≥ open) is --up, down is --down.\n  cdl(kit, cls, n) {\n    let html = '';\n    for (let i = 0; i < n; i++) html += '<g class=\"' + cls + '\"><line class=\"' + cls + '-w\" stroke-linecap=\"round\"/><rect class=\"' + cls + '-b\" rx=\"4\"/></g>';\n    let G, W, B;\n    return {\n      html,\n      set(i, c) {\n        if (!G) { const all = (s) => [...kit.stage.querySelectorAll(s)]; G = all('.' + cls); W = all('.' + cls + '-w'); B = all('.' + cls + '-b'); }\n        const col = c.col || (c.c >= c.o ? 'var(--up)' : 'var(--down)');\n        const yt = c.y(Math.max(c.o, c.c)), yb = c.y(Math.min(c.o, c.c)), bh = Math.max(c.min == null ? 4 : c.min, yb - yt), ym = (yt + yb) / 2;\n        const w = W[i], b = B[i], sw = Math.max(3, c.w * 0.07);\n        w.setAttribute('x1', c.x.toFixed(1)); w.setAttribute('x2', c.x.toFixed(1));\n        w.setAttribute('y1', c.y(c.h).toFixed(1)); w.setAttribute('y2', c.y(c.l).toFixed(1));\n        w.setAttribute('stroke-width', sw.toFixed(1)); w.style.stroke = col;\n        b.setAttribute('x', (c.x - c.w / 2).toFixed(1)); b.setAttribute('width', c.w.toFixed(1));\n        b.setAttribute('y', (ym - bh / 2).toFixed(1)); b.setAttribute('height', bh.toFixed(1));\n        b.setAttribute('stroke-width', (sw * 0.8).toFixed(1));\n        b.style.stroke = col;\n        b.style.fill = c.live ? 'color-mix(in srgb, ' + col + ' 38%, var(--ground))' : col;\n        G[i].style.opacity = c.op == null ? 1 : c.op;\n      },\n    };\n  },\n  // Header: eyebr <script>
/* XORA Futures Edge lesson player.
 *
 * Plays a lesson written as scene modules (content/futures-edge/<id>/modules) as a plain web
 * page. Everything on screen is a pure function of the lesson time t, so the page can pause,
 * seek and replay at any point. It provides the small "kit" the scenes are written against
 * (stage, easing, TextFx, assets, json) and a WebAudio synth for score.js.
 *
 * With a voiceover, build-lesson.mjs lengthens some scenes so the narration fits: a scene with
 * stretch factor k plays its animation and sound effects k times slower. Scene code still sees the
 * authored timeline (kit.start, kit.dur and t), so nothing in the modules changes. The voice is
 * one mixed track; the music dips under each line, and the CC button shows the line as text.
 *
 * build-lesson.mjs inlines this file into public/futures-edge/lessons/<id>.html, after a
 * `window.FILM = {...}` block that carries the scene list, module texts and asset paths.
 */
(function () {
  "use strict";

  const F = window.FILM;
  const W = F.width;
  const H = F.height;

  // ── Maths and easing ───────────────────────────────────────────────────────

  };
