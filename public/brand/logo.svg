<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">XTinex Logo</title>
  <desc id="desc">Stylized X and T monogram inside a glowing circle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1225"/>
      <stop offset="100%" stop-color="#111a35"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67d4ff"/>
      <stop offset="100%" stop-color="#9b6bff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="118" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="url(#stroke)" stroke-width="10"/>

  <g filter="url(#glow)" fill="none" stroke="url(#mark)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M76 78 L180 178"/>
    <path d="M180 78 L76 178"/>
    <path d="M128 78 L128 178"/>
    <path d="M96 98 L160 98"/>
  </g>
</svg>
