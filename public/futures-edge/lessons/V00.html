<script>window.FILM = {"id":"V00","width":1920,"height":1080,"scenes":[{"id":"signal","name":"Signal from noise","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"welcome","name":"Welcome","dur":14.7,"k":1.47,"oldStart":8,"oldDur":10},{"id":"for-you","name":"Who it is for","dur":11.8,"k":1.18,"oldStart":18,"oldDur":10},{"id":"lesson","name":"How a lesson works","dur":21.78,"k":1.21,"oldStart":28,"oldDur":18},{"id":"phases","name":"Five phases","dur":32.4,"k":1.35,"oldStart":46,"oldDur":24},{"id":"demo-only","name":"Demo only","dur":25.12,"k":1.57,"oldStart":70,"oldDur":16},{"id":"risk","name":"Risk in view","dur":25.48,"k":1.82,"oldStart":86,"oldDur":14},{"id":"outcomes","name":"By the end","dur":21,"k":2.1,"oldStart":100,"oldDur":10},{"id":"start","name":"Start lesson one","dur":10,"k":1,"oldStart":110,"oldDur":10}],"voice":{"src":"V00/voice.mp3","srcMl":"V00/voice-ml.mp3","lines":[{"t":0.5,"d":5.839,"text":"At first, markets look like noise. This course teaches you to read them, step by step.","ml":"ആദ്യം കണ്ടാൽ മാർക്കറ്റ് ഒരു ബഹളം പോലെയാണ്. ഈ കോഴ്സ് അതിനെ സ്റ്റെപ്പ് ബൈ സ്റ്റെപ്പ് വായിക്കാൻ പഠിപ്പിക്കും."},{"t":10.205,"d":4.088,"text":"Hi, I'm your XORA tutor! Welcome to Futures Edge.","ml":"ഹായ്! ഞാൻ നിന്റെ സോറ ട്യൂട്ടർ. ഫ്യൂച്ചേഴ്സ് എഡ്ജിലേക്ക് സ്വാഗതം!"},{"t":14.843,"d":7.452,"text":"Twenty-three short lessons, five phases, and no experience needed. Pause and replay any time.","ml":"ഇരുപത്തിമൂന്ന് ചെറിയ പാഠങ്ങൾ, അഞ്ച് ഘട്ടങ്ങൾ. അനുഭവം ഒന്നും വേണ്ട. എപ്പോൾ വേണമെങ്കിലും പോസ് ചെയ്ത് വീണ്ടും കാണാം."},{"t":23.172,"d":6.893,"text":"Never traded before? Not sure what BTC or USDT means? That's completely fine.","ml":"മുമ്പ് ട്രേഡ് ചെയ്തിട്ടില്ലേ? ബിടിസി, യുഎസ്ഡിടി എന്താണെന്ന് അറിയില്ലേ? പ്രശ്നമില്ല, എല്ലാവരും അവിടെ നിന്ന് തുടങ്ങുന്നതാ."},{"t":30.615,"d":3.473,"text":"Every new word is explained before we use it.","ml":"പുതിയ വാക്കുകൾ ഉപയോഗിക്കുന്നതിന് മുൻപ് ഞാൻ വിശദീകരിക്കാം."},{"t":34.863,"d":2.571,"text":"Each lesson works in five ways.","ml":"ഓരോ പാഠവും അഞ്ച് രീതിയിൽ പ്രവർത്തിക്കും."},{"t":38.009,"d":1.499,"text":"Watch a short animation.","ml":"ചെറിയ ആനിമേഷൻ കാണാം."},{"t":41.639,"d":1.722,"text":"Read simple notes.","ml":"ലളിതമായ നോട്ടുകൾ വായിക്കാം."},{"t":45.269,"d":1.828,"text":"Flip through short slides.","ml":"ചെറിയ സ്ലൈഡുകൾ ഫ്ലിപ്പ് ചെയ്യാം."},{"t":48.899,"d":2.871,"text":"Try it yourself, with fictional prices.","ml":"സ്വയം ട്രൈ ചെയ്യാം — വിലകൾ എല്ലാം കെട്ടുകഥയാണ്."},{"t":52.529,"d":3.333,"text":"Then take a quick quiz. Every answer is explained.","ml":"പിന്നെ ഒരു ചെറിയ ക്വിസ്. എല്ലാ ഉത്തരങ്ങളും വിശദീകരിക്കും."},{"t":56.82,"d":2.34,"text":"Here's the path we'll walk together.","ml":"നമ്മൾ ഒരുമിച്ച് നടക്കുന്ന പാത ഇതാണ്."},{"t":61.275,"d":4.378,"text":"First, crypto foundations: what crypto is, and why prices move.","ml":"ആദ്യം ക്രിപ്റ്റോ അടിസ്ഥാനങ്ങൾ: എന്താണ് ക്രിപ്റ്റോ, എന്തുകൊണ്ട് വില മാറുന്നു."},{"t":66.203,"d":4.964,"text":"Then trading basics: long and short, orders, profit, loss and fees.","ml":"പിന്നെ ട്രേഡിംഗ് ബേസിക്സ്: ലോങ്, ഷോർട്ട്, ഓർഡറുകൾ, പ്രോഫിറ്റ്, ലോസ്, ഫീസ്."},{"t":71.717,"d":4.096,"text":"Next, how futures work, with margin, leverage and liquidation.","ml":"അടുത്തത് ഫ്യൂച്ചേഴ്സ് എങ്ങനെ പ്രവർത്തിക്കുന്നു — മാർജിൻ, ലിവറേജ്, ലിക്വിഡേഷൻ."},{"t":76.363,"d":4.679,"text":"Then reading charts: candlesticks, trends and key levels.","ml":"പിന്നെ ചാർട്ടുകൾ വായിക്കൽ: കാൻഡിൽസ്റ്റിക്കുകൾ, ട്രെൻഡുകൾ, പ്രധാന ലെവലുകൾ."},{"t":81.591,"d":2.585,"text":"And finally, scalping and risk management.","ml":"അവസാനം സ്കാൽപിംഗും റിസ്ക് മാനേജ്മെന്റും."},{"t":84.9,"d":3.08,"text":"Three short checkpoints show you what to review.","ml":"മൂന്ന് ചെറിയ ചെക്ക്പോയിന്റുകൾ എന്ത് റിവ്യൂ ചെയ്യണമെന്ന് കാണിക്കും."},{"t":89.308,"d":4.293,"text":"Before we start: this course is for learning and demo practice only.","ml":"തുടങ്ങുന്നതിന് മുൻപ്: ഈ കോഴ്സ് പഠനത്തിനും ഡെമോ പ്രാക്ടീസിനും മാത്രമാണ്."},{"t":97.315,"d":2.626,"text":"There's no live trading, and no real money.","ml":"ലൈവ് ട്രേഡിംഗ് ഇല്ല, യഥാർത്ഥ പണം ഇല്ല."},{"t":100.769,"d":4.561,"text":"We will never ask for your passwords, OTP codes or API keys.","ml":"നിങ്ങളുടെ പാസ്‌വേഡ്, ഒടിപി, എപിഐ കീകൾ ഒന്നും ഞങ്ങൾ ചോദിക്കില്ല."},{"t":105.88,"d":2.25,"text":"And every price you see is fictional.","ml":"കാണുന്ന എല്ലാ വിലകളും കെട്ടുകഥയാണ്."},{"t":108.68,"d":3.674,"text":"Practise first. Real money is never needed here.","ml":"ആദ്യം പ്രാക്ടീസ് ചെയ്യൂ. യഥാർത്ഥ പണം ഇവിടെ ആവശ്യമില്ല."},{"t":114.528,"d":2.194,"text":"Futures can lose money quickly.","ml":"ഫ്യൂച്ചേഴ്സ് വേഗത്തിൽ പണം നഷ്ടപ്പെടുത്താം."},{"t":117.272,"d":3.277,"text":"Leverage makes losses bigger, not just gains.","ml":"ലിവറേജ് നഷ്ടങ്ങളെ വലുതാക്കും — നേട്ടങ്ങളെ മാത്രമല്ല."},{"t":121.098,"d":2.524,"text":"Fees can turn a small win into a loss.","ml":"ഫീസ് ഒരു ചെറിയ വിജയത്തെ നഷ്ടമാക്കാം."},{"t":124.173,"d":1.552,"text":"And signals can be wrong.","ml":"സിഗ്നലുകൾ തെറ്റാകാം."},{"t":126.358,"d":4.832,"text":"So you always have three choices: buy, sell, or wait.","ml":"അതുകൊണ്ട് നിനക്ക് എപ്പോഴും മൂന്ന് ചോയിസുകൾ ഉണ്ട്: ബൈ, സെൽ, അല്ലെങ്കിൽ വെയിറ്റ്."},{"t":131.74,"d":2.557,"text":"If you're not sure, waiting is a decision too.","ml":"ഉറപ്പില്ലെങ്കിൽ കാത്തിരിക്കുന്നതും ഒരു തീരുമാനമാണ്."},{"t":139.91,"d":2.503,"text":"By the end, you should be able to:","ml":"അവസാനത്തോടെ നിനക്ക് ഇതെല്ലാം ചെയ്യാൻ കഴിയണം:"},{"t":143.06,"d":2.69,"text":"read the BTC USDT pair,","ml":"ബിടിസി-യുഎസ്ഡിടി ജോഡി വായിക്കുക,"},{"t":146.3,"d":1.976,"text":"read a candlestick chart,","ml":"കാൻഡിൽസ്റ്റിക്ക് ചാർട്ട് വായിക്കുക,"},{"t":148.826,"d":2.264,"text":"tell spot from futures,","ml":"സ്പോട്ടും ഫ്യൂച്ചേഴ്സും തമ്മിൽ വേർതിരിക്കുക,"},{"t":151.64,"d":2.864,"text":"explain why leverage is risky,","ml":"ലിവറേജ് എന്തുകൊണ്ട് അപകടമാണെന്ന് വിശദീകരിക്കുക,"},{"t":155.054,"d":1.952,"text":"and know when not to trade.","ml":"എപ്പോൾ ട്രേഡ് ചെയ്യരുതെന്ന് അറിയുക."},{"t":157.556,"d":1.818,"text":"One lesson at a time.","ml":"ഒരു പാഠം ഒരു സമയം."},{"t":161.58,"d":4.7,"text":"Up next: lesson one. What is cryptocurrency? See you there!","ml":"അടുത്തത് പാഠം ഒന്ന്: എന്താണ് orks in five ways.\"\n    },\n    {\n      \"id\": \"l2\",\n      \"scene\": \"lesson\",\n      \"t\": 30.9,\n      \"text\": \"Watch a short animation.\"\n    },\n    {\n      \"id\": \"l3\",\n      \"scene\": \"lesson\",\n      \"t\": 33.9,\n      \"text\": \"Read simple notes.\"\n    },\n    {\n      \"id\": \"l4\",\n      \"scene\": \"lesson\",\n      \"t\": 36.9,\n      \"text\": \"Flip through short slides.\"\n    },\n    {\n      \"id\": \"l5\",\n      \"scene\": \"lesson\",\n      \"t\": 39.9,\n      \"text\": \"Try it yourself, with fictional prices.\"\n    },\n    {\n      \"id\": \"l6\",\n      \"scene\": \"lesson\",\n      \"t\": 42.9,\n      \"text\": \"Then take a quick quiz. Every answer is explained.\"\n    },\n    {\n      \"id\": \"p1\",\n      \"scene\": \"phases\",\n      \"t\": 46.4,\n      \"text\": \"Here's the path we'll walk together.\"\n    },\n    {\n      \"id\": \"p2\",\n      \"scene\": \"phases\",\n      \"t\": 49.7,\n      \"text\": \"First, crypto foundations: what crypto is, and why prices move.\"\n    },\n    {\n      \"id\": \"p3\",\n      \"scene\": \"phases\",\n      \"t\": 53.2,\n      \"text\": \"Then trading basics: long and short, orders, profit, loss and fees.\"\n    },\n    {\n      \"id\": \"p4\",\n      \"scene\": \"phases\",\n      \"t\": 56.7,\n      \"text\": \"Next, how futures work, with margin, leverage and liquidation.\"\n    },\n    {\n      \"id\": \"p5\",\n      \"scene\": \"phases\",\n      \"t\": 60.2,\n      \"text\": \"Then reading charts: candlesticks, trends and key levels.\"\n    },\n    {\n      \"id\": \"p6\",\n      \"scene\": \"phases\",\n      \"t\": 63.7,\n      \"text\": \"And finally, scalping and risk management.\"\n    },\n    {\n      \"id\": \"p7\",\n      \"scene\": \"phases\",\n      \"t\": 67.2,\n      \"text\": \"Three short checkpoints show you what to review.\"\n    },\n    {\n      \"id\": \"d1\",\n      \"scene\": \"demo-only\",\n      \"t\": 70.4,\n      \"text\": \"Before we start: this course is for learning and demo practice only.\"\n    },\n    {\n      \"id\": \"d2\",\n      \"scene\": \"demo-only\",\n      \"t\": 75.5,\n      \"text\": \"There's no live trading, and no real money.\"\n    },\n    {\n      \"id\": \"d3\",\n      \"scene\": \"demo-only\",\n      \"t\": 77.7,\n      \"text\": \"We will never ask for your passwords, OTP codes or API keys.\",\n      \"say\": \"We will never ask for your passwords, O T P codes, or A P I keys.\"\n    },\n    {\n      \"id\": \"d4\",\n      \"scene\": \"demo-only\",\n      \"t\": 80.0,\n      \"text\": \"And every price you see is fictional.\"\n    },\n    {\n      \"id\": \"d5\",\n      \"scene\": \"demo-only\",\n      \"t\": 82.4,\n      \"text\": \"Practise first. Real money is never needed here.\"\n    },\n    {\n      \"id\": \"r1\",\n      \"scene\": \"risk\",\n      \"t\": 86.4,\n      \"text\": \"Futures can lose money quickly.\"\n    },\n    {\n      \"id\": \"r2\",\n      \"scene\": \"risk\",\n      \"t\": 87.6,\n      \"text\": \"Leverage makes losses bigger, not just gains.\"\n    },\n    {\n      \"id\": \"r3\",\n      \"scene\": \"risk\",\n      \"t\": 89.2,\n      \"text\": \"Fees can turn a small win into a loss.\"\n    },\n    {\n      \"id\": \"r4\",\n      \"scene\": \"risk\",\n      \"t\": 90.9,\n      \"text\": \"And signals can be wrong.\"\n    },\n    {\n      \"id\": \"r5\",\n      \"scene\": \"risk\",\n      \"t\": 92.9,\n      \"text\": \"So you always have three choices: buy, sell, or wait.\"\n    },\n    {\n      \"id\": \"r6\",\n      \"scene\": \"risk\",\n      \"t\": 95.6,\n      \"text\": \"If you're not sure, waiting is a decision too.\"\n    },\n    {\n      \"id\": \"o1\",\n      \"scene\": \"outcomes\",\n      \"t\": 100.3,\n      \"text\": \"By the end, you should be able to:\"\n    },\n    {\n      \"id\": \"o2\",\n      \"scene\": \"outcomes\",\n      \"t\": 101.8,\n      \"text\": \"read the BTC USDT pair,\",\n      \"say\": \"read the B T C, U S D T pair,\"
