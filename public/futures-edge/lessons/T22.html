<script>window.FILM = {"id":"T22","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson twenty-two","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"Same stop, different damage","dur":20,"k":1,"oldStart":8,"oldDur":20},{"id":"account","name":"Balance and risk budget","dur":27,"k":1,"oldStart":28,"oldDur":27},{"id":"stop","name":"Stop distance","dur":21,"k":1,"oldStart":55,"oldDur":21},{"id":"notional","name":"Size and notional","dur":25,"k":1,"oldStart":76,"oldDur":25},{"id":"formula","name":"Allowed notional","dur":27,"k":1,"oldStart":101,"oldDur":27},{"id":"leverage","name":"Leverage exposure","dur":27,"k":1,"oldStart":128,"oldDur":27},{"id":"drawdown","name":"Drawdown","dur":23,"k":1,"oldStart":155,"oldDur":23},{"id":"mistake","name":"Leverage first","dur":21,"k":1,"oldStart":178,"oldDur":21},{"id":"try","name":"Try it","dur":31,"k":1,"oldStart":199,"oldDur":31},{"id":"validate","name":"Inputs that make no sense","dur":21,"k":1,"oldStart":230,"oldDur":21},{"id":"risks","name":"Know the limits","dur":25,"k":1,"oldStart":251,"oldDur":25},{"id":"recap","name":"Recap","dur":29,"k":1,"oldStart":276,"oldDur":29},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":305,"oldDur":10}],"voice":{"src":null,"lines":[{"t":0.6,"d":7.15,"text":"Lesson twenty-two: position sizing and risk budget. Size a position from the risk you accept.","ml":"ഇരുപത്തിരണ്ടാം പാഠം: position sizing, റിസ്ക് ബജറ്റ്. സ്വീകരിക്കുന്ന റിസ്കിൽ നിന്ന് position വലിപ്പം."},{"t":8.4,"d":6.35,"text":"Two traders, one fictional chart. Both buy BTC at 60,000, with a stop-loss at 59,400.","ml":"രണ്ട് ട്രേഡർമാർ, ഒരു സാങ്കൽപ്പിക ചാർട്ട്. രണ്ടുപേരും 60,000-ന് BTC buy ചെയ്യുന്നു, stop-loss 59,400."},{"t":15,"d":5.35,"text":"Trader A's position is worth 500 USDT. Trader B's is worth 10,000 USDT.","ml":"Trader A-യുടെ position-ന്റെ മൂല്യം 500 USDT. Trader B-യുടേത് 10,000 USDT."},{"t":20.6,"d":7.15,"text":"Price falls to the stop. A loses 5 USDT. B loses 100 USDT. Same stop, very different damage.","ml":"വില stop-ലേക്ക് വീഴുന്നു. A-ക്ക് 5 USDT നഷ്ടം. B-ക്ക് 100 USDT. ഒരേ stop, വളരെ വ്യത്യസ്ത നഷ്ടം."},{"t":28.4,"d":6.95,"text":"Your account balance is the money in your trading account. Here, a 1,000 USDT practice account.","ml":"ട്രേഡിങ് അക്കൗണ്ടിലുള്ള പണമാണ് account balance. ഇവിടെ 1,000 USDT-ന്റെ പരിശീലന അക്കൗണ്ട്."},{"t":35.6,"d":6.55,"text":"Your risk budget is the most you accept to lose on one trade, decided before you enter.","ml":"ഒരു ട്രേഡിൽ നഷ്ടപ്പെടുത്താൻ തയ്യാറുള്ള പരമാവധിയാണ് റിസ്ക് ബജറ്റ്, entry-ക്ക് മുമ്പേ തീരുമാനിക്കുന്നത്."},{"t":42.4,"d":6.15,"text":"Like deciding how much you'll spend at a fair before you go, not halfway through.","ml":"ഉത്സവപ്പറമ്പിൽ എത്ര ചെലവാക്കുമെന്ന് പോകുന്നതിന് മുമ്പേ തീരുമാനിക്കുന്നത് പോലെ, പാതിവഴിയിലല്ല."},{"t":48.8,"d":5.95,"text":"In this example the budget is 10 USDT. An example only, not a recommendation.","ml":"ഈ ഉദാഹരണത്തിൽ ബജറ്റ് 10 USDT. ഉദാഹരണം മാത്രം, ശുപാർശയല്ല."},{"t":55.4,"d":5.75,"text":"Stop distance is the gap between your entry price and your stop-loss price.","ml":"Entry വിലയും stop-loss വിലയും തമ്മിലുള്ള അകലമാണ് stop distance."},{"t":61.4,"d":6.95,"text":"Entry 60,000, stop 59,400: the distance is 600 USDT. As a share of entry, 600 ÷ 60,000 = 1%.","ml":"Entry 60,000, stop 59,400: അകലം 600 USDT. Entry-യുടെ ഭാഗമായി, 600 ÷ 60,000 = 1%."},{"t":68.6,"d":7.15,"text":"For a short, the stop sits above entry. Entry 60,000, stop 60,300: 300 USDT, or 0.5%.","ml":"Short-ൽ stop entry-ക്ക് മുകളിലാണ്. Entry 60,000, stop 60,300: 300 USDT, അഥവാ 0.5%."},{"t":76.4,"d":6.75,"text":"Position size is how much of the coin you hold. Notional is what it's worth: size × price.","ml":"Position size: കയ്യിലുള്ള coin-ന്റെ അളവ്. Notional: അതിന്റെ മൂല്യം, size × വില."},{"t":83.4,"d":4.15,"text":"0.01 BTC at 60,000 USDT is a notional of 600 USDT.","ml":"60,000 USDT വിലയിൽ 0.01 BTC-യുടെ notional 600 USDT."},{"t":87.8,"d":6.15,"text":"If price falls 1% to the stop, you lose 1% of the notional: 600 × 1% = 6 USDT.","ml":"വില 1% വീണ് stop-ൽ എത്തിയാൽ, notional-ന്റെ 1% നഷ്ടം: 600 × 1% = 6 USDT."},{"t":94.2,"d":6.55,"text":"Like buying rice: if the price per kilo drops, ten kilos lose ten times more than one.","ml":"അരി വാങ്ങുന്നത് പോലെ: കിലോയ്ക്ക് വില കുറഞ്ഞാൽ, പത്ത് കിലോയ്ക്ക് ഒരു കിലോയുടെ പത്തിരട്ടി നഷ്ടം."},{"t":101.4,"d":3.75,"text":"Turn it around to find the allowed notional.","ml":"ഇത് തിരിച്ചിട്ടാൽ അനുവദനീയമായ notional കിട്ടും."},{"t":105.4,"d":5.35,"text":"Allowed notional ≈ risk amount ÷ stop distance as a share of entry.","ml":"Allowed notional ≈ റിസ്ക് തുക ÷ entry-യുടെ ഭാഗമായ stop distance."},{"t":111,"d":6.35,"text":"10 ÷ (600 ÷ 60,000) = 10 ÷ 0.01 = 1,000 USDT. That's about 0.0167 BTC at 60,000.","ml":"10 ÷ (600 ÷ 60,000) = 10 ÷ 0.01 = 1,000 USDT. 60,000-ൽ ഏകദേശം 0.0167 BTC."},{"t":117.6,"d":4.35,"text":"For the short, with a 0.5% stop: 10 ÷ 0.005 = 2,000 USDT.","ml":"Short-ന്, 0.5% stop ഉള്ളപ്പോൾ: 10 ÷ 0.005 = 2,000 USDT."},{"t":122.2,"d":5.55,"text":"This simple model ignores fees, slippage, contract rules and liquidation.","ml":"ഈ ലളിത മോഡൽ ഫീസ്, slippage, contract നിയമങ്ങൾ, liquidation ഒന്നും കണക്കാക്കുന്നില്ല."},{"t":128.4,"d":6.35,"text":"Leverage lets a small margin control a bigger notional. Leverage = notional ÷ margin.","ml":"Leverage കൊണ്ട് ചെറിയ margin-ന് വലിയ notional നിയന്ത്രിക്കാം. Leverage = notional ÷ margin."},{"t":135,"d":5.55,"text":"A 1,000 USDT notional needs 500 margin at 2x, 200 at 5x, 100 at 10x.","ml":"1,000 USDT notional-ന് 2x-ൽ 500 margin, 5x-ൽ 200, 10x-ൽ 100 വേണം."},{"t":140.8,"d":6.55,"text":"But the loss at the stop is still about 10 USDT. It depends on notional and stop distance.","ml":"പക്ഷേ stop-ലെ നഷ്ടം അപ്പോഴും ഏകദേശം 10 USDT. അത് notional-ഉം stop distance-ഉം അനുസരിച്ചാണ്."},{"t":147.6,"d":7.15,"text":"High leverage makes huge positions easy to open, and brings liquidation closer.","ml":"ഉയർന്ന leverage വലിയ positions തുറക്കുന്നത് എളുപ്പമാക്കും, liquidation അടുത്തെത്തിക്കും."},{"t":155.4,"d":5.75,"text":"Drawdown is how far your account falls from its highest point, shown in %.","ml":"ഏറ്റവും ഉയർന്ന നിലയിൽ നിന്ന് അക്കൗണ്ട് എത്ര താഴ്ന്നു എന്നതാണ് drawdown, % ആയി."},{"t":161.4,"d":4.75,"text":"Five 10 USDT losses take 1,000 down to 950. A 5% drawdown.","ml":"10 USDT വീതം അഞ്ച് നഷ്ടം: 1,000 താഴ്ന്ന് 950. 5% drawdown."},{"t":166.4,"d":4.35,"text":"Five 100 USDT losses take it to 500. A 50% drawdown.","ml":"100 USDT വീതം അഞ്ച് നഷ്ടം: 500 വരെ. 50% drawdown."},{"t":171,"d":6.75,"text":"From 500, you'd need +100% just to get back to 1,000. Small risks keep drawdowns small.","ml":"500-ൽ നിന്ന് 1,000-ൽ തിരിച്ചെത്താൻ +100% വേണം. ചെറിയ റിസ്ക് drawdown ചെറുതാക്കും."},{"t":178.4,"d":6.35,"text":"A common mistake: choosing leverage or size first, like 'I'll use 20x', then hoping.","ml":"ഒരു സാധാരണ തെറ്റ്: 'ഞാൻ 20x എടുക്കും' എന്നപോലെ leverage-ഓ size-ഓ ആദ്യം, പിന്നെ പ്രതീക്ഷ."},{"t":185,"d":6.55,"text":"The fix is a fixed order: risk budget, then stop, then notional, then check the margin.","ml":"ശരിയായ ക്രമം: റിസ്ക് ബജറ്റ്, പിന്നെ stop, പിന്നെ notional, അവസാനം margin പരിശോധന."},{"t":191.8,"d":6.95,"text":"And if the allowed size is too small to make sense, NO_TRADE is a fine answer.","ml":"അനുവദനീയമായ size അർഥമില്ലാത്തവിധം ചെറുതാണെങ്കിൽ, NO_TRADE നല്ല ഉത്തരമാണ്."},{"t":199.4,"d":6.55,"text":"Your turn. Account 2,000 USDT, example budget 20 USDT. Long at 50,000, stop at 49,500.","ml":"നിങ്ങളുടെ ഊഴം. അക്കൗണ്ട് 2,000 USDT, ഉദാഹരണ ബജറ്റ് 20 USDT. Long 50,000-ൽ, stop 49,500."},{"t":206.2,"d":12.55,"text":"What's the allowed notional? A: 200, B: 2,000, or C: 20,000 USDT? Pause and work it out.","ml":"Allowed notional എത്ര? A: 200, B: 2,000, C: 20,000 USDT? Pause ചെയ്ത് കണക്കാക്കൂ."},{"t":219,"d":4.95,"text":"B. The stop is 500 away, which is 1%. So 20 ÷ 0.01 = 2,000 USDT.","ml":"B. Stop 500 അകലെ, അതായത് 1%. അതിനാൽ 20 ÷ 0.01 = 2,000 USDT."},{"t":224.2,"d":5.55,"text":"C is tempting, but at the stop it loses 200 USDT, ten times the budget.","ml":"C ആകർഷകമാണ്, പക്ഷേ stop-ൽ 200 USDT നഷ്ടം, ബജറ്റിന്റെ പത്തിരട്ടി."},{"t":230.4,"d":4.35,"text":"A calculator should warn you when inputs make no sense.","ml":"Inputs അർഥമില്ലാത്തതാണെങ്കിൽ calculator മുന്നറിയിപ്പ് തരണം."},{"t":235,"d":5.35,"text":"Stop equal to entry? The distance is zero, so there is no sensible size.","ml":"Stop entry-ക്ക് തുല്യമോ? അകലം പൂജ്യം, അതിനാൽ അർഥമുള്ള size ഇല്ല."},{"t":240.6,"d":4.95,"text":"A long with the stop above entry? That stop is on the wrong side.","ml":"Stop entry-ക്ക് മുകളിലുള്ള long? ആ stop തെറ്റായ വശത്താണ്."},{"t":245.8,"d":4.95,"text":"A risk budget bigger than the whole account? That's impossible.","ml":"മുഴുവൻ അക്കൗണ്ടിനേക്കാൾ വലിയ റിസ്ക് ബജറ്റ്? അത് അസാധ്യം."},{"t":251.4,"d":2.95,"text":"Know the limits of this maths.","ml":"ഈ കണക്കിന്റെ പരിധികൾ അറിയുക."},{"t":254.6,"d":6.15,"text":"Stops can slip, and fees add to the loss. The real loss can be bigger than planned.","ml":"Stops slip ആകാം, ഫീസ് നഷ്ടം കൂട്ടും. യഥാർത്ഥ നഷ്ടം പ്ലാനിനേക്കാൾ വലുതാകാം."},{"t":261,"d":6.75,"text":"With high leverage, liquidation can come before your stop. Exchanges also set minimum sizes.","ml":"ഉയർന്ന leverage-ൽ stop-ന് മുമ്പേ liquidation വരാം. Exchanges minimum size-ഉം വെക്കുന്നു."},{"t":268,"d":7.75,"text":"Fictional examples, not advice or recommended percentages. NO_TRADE is always allowed.","ml":"സാങ്കൽപ്പിക ഉദാഹരണങ്ങൾ, ഉപദേശമോ ശുപാർശ ചെയ്ത ശതമാനമോ അല്ല. NO_TRADE എപ്പോഴും ആകാം."},{"t":276.4,"d":1.35,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":278,"d":6.35,"text":"One: decide your risk budget before you enter. Examples here are not recommendations.","ml":"ഒന്ന്: entry-ക്ക് മുമ്പേ റിസ്ക് ബജറ്റ് തീരുമാനിക്കുക. ഇവിടത്തെ ഉദാഹരണങ്ങൾ ശുപാർശകളല്ല."},{"t":284.6,"d":5.95,"text":"Two: allowed notional ≈ risk ÷ stop distance as a share of entry. A simple model.","ml":"രണ്ട്: allowed notional ≈ റിസ്ക് ÷ entry-യുടെ ഭാഗമായ stop distance. ഒരു ലളിത മോഡൽ."},{"t":290.8,"d":5.75,"text":"Three: leverage changes the margin, not the loss at the stop. Watch drawdown.","ml":"മൂന്ന്: leverage margin മാറ്റും, stop-ലെ നഷ്ടമല്ല. Drawdown ശ്രദ്ധിക്കുക."},{"t":296.8,"d":4.95,"text":"Check yourself: risk 10 USDT, stop 2% away. Allowed notional?","ml":"സ്വയം പരിശോധിക്കൂ: റിസ്ക് 10 USDT, stop 2% അകലെ. Allowed notional എത്ര?"},{"t":302,"d":2.75,"text":"About 500 USDT: 10 ÷ 0.02 = 500.","ml":"ഏകദേശം 500 USDT: 10 ÷ 0.02 = 500."},{"t":305.4,"d":9.35,"text":"Next up: T23, the full scalping decision lifecycle. From chart to journal, in a demo.","ml":"അടുത്തത്: T23, പൂർണ്ണ scalping തീരുമാന ചക്രം. ചാർട്ട് മുതൽ ജേണൽ വരെ, ഒരു ഡെമോയിൽ."}]},"assetBase":"T22/assets/","assets":{"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-writing.webp":{"mime":"image/webp","w":191,"h":169},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T22 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson twenty-two: position sizing and risk budget. Size a position from the risk you accept.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"Two traders, one fictional chart. Both buy BTC at 60,000, with a stop-loss at 59,400.\"\n    },\n    {\n      \"t\": 15.0,\n      \"text\": \"Trader A's position is worth 500 USDT. Trader B's is worth 10,000 USDT.\"\n    },\n    {\n      \"t\": 20.6,\n      \"text\": \"Price falls to the stop. A loses 5 USDT. B loses 100 USDT. Same stop, very different damage.\"\n    },\n    {\n      \"t\": 28.4,\n      \"text\": \"Your account balance is the money in your trading account. Here, a 1,000 USDT practice account.\"\n    },\n    {\n      \"t\": 35.6,\n      \"text\": \"Your risk budget is the most you accept to lose on one trade, decided before you enter.\"\n    },\n    {\n      \"t\": 42.4,\n      \"text\": \"Like deciding how much you'll spend at a fair before you go, not halfway through.\"\n    },\n    {\n      \"t\": 48.8,\n      \"text\": \"In this example the budget is 10 USDT. An example only, not a recommendation.\"\n    },\n    {\n      \"t\": 55.4,\n      \"text\": \"Stop distance is the gap between your entry price and your stop-loss price.\"\n    },\n    {\n      \"t\": 61.4,\n      \"text\": \"Entry 60,000, stop 59,400: the distance is 600 USDT. As a share of entry, 600 ÷ 60,000 = 1%.\"\n    },\n    {\n      \"t\": 68.6,\n      \"text\": \"For a short, the stop sits above entry. Entry 60,000, stop 60,300: 300 USDT, or 0.5%.\"\n    },\n    {\n      \"t\": 76.4,\n      \"text\": \"Position size is how much of the coin you hold. Notional is what it's worth: size × price.\"\n    },\n    {\n      \"t\": 83.4,\n      \"text\": \"0.01 BTC at 60,000 USDT is a notional of 600 USDT.\"\n    },\n    {\n      \"t\": 87.8,\n      \"text\": \"If price falls 1% to the stop, you lose 1% of the notional: 600 × 1% = 6 USDT.\"\n    },\n    {\n      \"t\": 94.2,\n      \"text\": \"Like buying rice: if the price per kilo drops, ten kilos lose ten times more than one.\"\n    },\n    {\n      \"t\": 101.4,\n      \"text\": \"Turn it around to find the allowed notional.\"\n    },\n    {\n      \"t\": 105.4,\n      \"text\": \"Allowed notional ≈ risk amount ÷ stop distance as a share of entry.\"\n    },\n    {\n      \"t\": 111.0,\n      \"text\": \"10 ÷ (600 ÷ 60,000) = 10 ÷ 0.01 = 1,000 USDT. That's about 0.0167 BTC at 60,000.\"\n    },\n    {\n      \"t\": 117.6,\n      \"text\": \"For the short, with a 0.5% stop: 10 ÷ 0.005 = 2,000 USDT.\"\n    },\n    {\n      \"t\": 122.2,\n      \"text\": \"This simple model ignores fees, slippage, contract rules and liquidation.\"\n    },\n    {\n      \"t\": 128.4,\n      \"text\": \"Leverage lets a small margin control a bigger notional. Leverage = notional ÷ margin.\"\n    },\n    {\n      \"t\": 135.0,\n      \"text\": \"A 1,000 USDT notional needs 500 margin at 2x, 200 at 5x, 100 at 10x.\"\n    },\n    {\n      \"t\": 140.8,\n      \"text\": \"But the loss at the stop is still about 10 USDT. It depends on notional and stop distance.\"\n    },\n    {\n      \"t\": 147.6,\n      \"text\": \"High leverage makes huge positions easy to open, and brings liquidation closer.\"\n    },\n    {\n      \"t\": 155.4,\n      \"text\": \"Drawdown is how far your account falls from its highest point, shown in %.\"\n    },\n    {\n      \"t\": 161.4,\n      \"text\": \"Five 10 USDT losses take 1,000 down to 950. A 5% drawdown.\"\n    },\n    {\n      \"t\": 166.4,\n      \"text\": \"Five 100 USDT losses take it to 500. A 50% drawdown.\"\n    },\n    {\n      \"t\": 171.0,\n      \"text\": \"From 500, you'd need +100% just to get back to 1,000. Small risks keep drawdowns small.\"\n    },\n    {\n      \"t\": 178.4,\n      \"text\": \"A common mistake: choosing leverage or size first, like 'I'll use 20x', then hoping.\"\n    },\n    {\n      \"t\": 185.0,\n      \"text\": \"The fix is a fixed order: risk budget, then stop, then notional, then check the margin.\"\n    },\n    {\n      \"t\": 191.8,\n      \"text\": \"And if the allowed size is too small to make sense, NO_TRADE is a fine answer.\"\n    },\n    {\n      \"t\": 199.4,\n      \"text\": \"Your turn. Account 2,000 USDT, example budget 20 USDT. Long at 50,000, stop at 49,500.\"\n    },\n    {\n      \"t\": 206.2,\n      \"text\": \"What's the allowed notional? A: 200, B: 2,000, or C: 20,000 USDT? Pause and work it out.\"\n    },\n    {\n      \"t\": 219.0,\n      \"text\": \"B. The stop is 500 away, which is 1%. So 20 ÷ 0.01 = 2,000 USDT.\"\n    },\n    {\n      \"t\": 224.2,\n      \"text\": \"C is tempting, but at the stop it loses 200 USDT, ten times the budget.\"\n    },\n    {\n      \"t\": 230.4,\n      \"text\": \"A calculator should warn you when inputs make no sense.\"\n    },\n    {\n      \"t\": 235.0,\n      \"text\": \"Stop equal to entry? The distance is zero, so there is no sensible size.\"\n    },\n    {\n      \"t\": 240.6,\n      \"text\": \"A long with the stop above entry? That stop is on the wrong side.\"\n    },\n    {\n      \"t\": 245.8,\n      \"text\": \"A risk budget bigger than the whole account? That's impossible.\"\n    },\n    {\n      \"t\": 251.4,\n      \"text\": \"Know the limits of this maths.\"\n    },\n    {\n      \"t\": 254.6,\n      \"text\": \"Stops can slip, and fees add to the loss. The real loss can be bigger than planned.\"\n    },\n    {\n      \"t\": 261.0,\n      \"text\": \"With high leverage, liquidation can come before your stop. Exchanges also set minimum sizes.\"\n    },\n    {\n      \"t\": 268.0,\n      \"text\": \"Fictional examples, not advice or recommended percentages. NO_TRADE is always allowed.\"\n    },\n    {\n      \"t\": 276.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 278.0,\n      \"text\": \"One: decide your risk budget before you enter. Examples here are not recommendations.\"\n    },\n    {\n      \"t\": 284.6,\n      \"text\": \"Two: allowed notional ≈ risk ÷ stop distance as a share of entry. A simple model.\"\n    },\n    {\n      \"t\": 290.8,\n      \"text\": \"Three: leverage changes the margin, not the loss at the stop. Watch drawdown.\"\n    },\n    {\n      \"t\": 296.8,\n      \"text\": \"Check yourself: risk 10 USDT, stop 2% away. Allowed notional?\"\n    },\n    {\n      \"t\": 302.0,\n      \"text\": \"About 500 USDT: 10 ÷ 0.02 = 500.\"\n    },\n    {\n      \"t\": 305.4,\n      \"text\": \"Next up: T23, the full scalping decision lifecycle. From chart to journal, in a demo.\"\n    }\n  ]\n}","scene-account.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Account balance and risk budget: a 1,000 USDT bar fills; a 10 USDT slice is set aside as the example budget; fair-spending analogy.\nkit.scene('account', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.h = UI.head(kit, 'Before any trade', 'How much could I lose?',\n      '<div class=\"glass ac-d1\" style=\"left:140px;top:300px;width:780px;padding:20px 30px\"><p class=\"kick\" style=\"margin:0 0 8px\">Account balance</p>' +\n      '<p class=\"def\" style=\"margin:0;font-size:30px\">The money in your trading account.</p></div>' +\n      '<div class=\"glass ac-d2\" style=\"left:140px;top:450px;width:780px;padding:20px 30px\"><p class=\"kick\" style=\"margin:0 0 8px\">Risk budget (per trade)</p>' +\n      '<p class=\"def\" style=\"margin:0;font-size:30px\">The most you accept to <b>lose on one trade</b>, decided <b>before</b> you enter.</p></div>' +\n      '<div class=\"chip ac-ex\" style=\"position:absolute;left:140px;top:676px;font-size:28px;padding:12px 26px;border-color:var(--accent)\">Example only · not a recommendation</div>' +\n      '<div class=\"glass ac-b\" style=\"left:980px;top:300px;width:800px;height:230px;padding:20px 30px\"><p class=\"kick\" style=\"margin:0 0 6px\">Practice account · fictional</p>' +\n      '<p class=\"mono\" style=\"margin:0 0 14px;font-size:48px\"><span class=\"ac-v\">0</span> <span style=\"font-size:26px\">USDT</span></p>' +\n      '<div style=\"position:relative;width:740px;height:40px;border-radius:20px;background:color-mix(in srgb, var(--second) 10%, transparent)\">' +\n      '<div class=\"ac-f\" style=\"position:absolute;left:0;top:0;bottom:0;width:0;border-radius:20px;background:linear-gradient(90deg, var(--main), color-mix(in srgb, var(--main) 60%, var(--accent)))\"></div>' +\n      '<div class=\"ac-s\" style=\"position:absolute;right:0;top:-8px;bottom:-8px;width:10px;border-radius:4px;background:var(--accent)\"></div></div>' +\n      '<p class=\"mono ac-sl\" style=\"position:absolute;right:30px;bottom:18px;margin:0;font-size:26px;color:var(--accent)\">10 USDT set aside as the budget</p></div>' +\n      '<div class=\"glass ac-a\" style=\"left:980px;top:560px;width:800px;height:190px;padding:20px 30px\"><p class=\"kick\" style=\"margin:0 0 8px\">Like a spending limit at a fair</p>' +\n      '<p style=\"margin:0;font-size:30px;line-height:1.35;font-weight:600;width:520px\">Decide the limit before you go, not halfway through.</p>' +\n      '<svg width=\"200\" height=\"120\" viewBox=\"0 0 200 120\" style=\"position:absolute;right:26px;top:40px\"><rect x=\"20\" y=\"30\" width=\"160\" height=\"70\" rx=\"10\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--main)\"/>' +\n      '<circle cx=\"20\" cy=\"65\" r=\"12\" style=\"fill:var(--ground)\"/><circle cx=\"180\" cy=\"65\" r=\"12\" style=\"fill:var(--ground)\"/><text x=\"100\" y=\"74\" text-anchor=\"middle\" style=\"fill:var(--main);font-size:26px;font-weight:700\">LIMIT</text></svg></div>');\n    const q = (s) => kit.stage.querySelector(s);\n    this.d1 = q('.ac-d1').style; this.d2 = q('.ac-d2').style; this.ex = q('.ac-ex').style; this.b = q('.ac-b').style; this.v = q('.ac-v'); this.f = q('.ac-f').style;\n    this.s = q('.ac-s').style; this.sl = q('.ac-sl').style; this.a = q('.ac-a').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'present' }, { t: 7.6, pose: 'read' }, { t: 14.4, pose: 'idea' }, { t: 20.8, pose: 'checklist' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.h.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.h.t, t, 0.1);\n    UI.rise(kit, this.d1, t, 0.6, 0.7); UI.rise(kit, this.b, t, 1.0, 0.7);\n    const fp = eio(seg(t, 1.6, 3.6));\n    this.f.width = (fp * 100).toFixed(2) + '%'; UI.set(this.v, UI.fmt(Math.round(1000 * fp)));\n    UI.rise(kit, this.d2, t, 7.6, 0.7);\n    // The budget slice: lights up and pulses once the budget is defined.\n    const sp = seg(t, 9.6, 10.2);\n    this.s.opacity = eo(sp); this.s.transform = 'scaleY(' + (lerp(0.4, 1, eob(sp, 1.8)) * (1 + 0.12 * Math.sin(Math.max(0, t - 10.2) * 4) * (1 - seg(t, 13, 14)))).toFixed(3) + ')';\n    UI.rise(kit, this.sl, t, 10.0, 0.5, 10);\n    UI.rise(kit, this.a, t, 14.4, 0.7);\n    const e = seg(t, 20.8, 21.3); this.ex.opacity = eo(e); this.ex.transform = 'scale(' + lerp(0.85, 1, eob(e, 1.7)).toFixed(3) + ')'; this.ex.transformOrigin = '0 50%';\n    this.tutor.render(t);\n  },\n});\n","scene-drawdown.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Drawdown: two equity paths from 1,000 over five losing trades: 10 USDT each (to 950, −5%) vs 100 USDT each (to 500, −50%).\nconst DD_Y = (v) => 740 - (v - 500) * 0.72, DD_X = (i) => 200 + i * 120;\nkit.scene('drawdown', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const pts = (step) => [0, 1, 2, 3, 4, 5].map((i) => [DD_X(i), DD_Y(1000 - step * i)]);\n    this.pa = pts(10); this.pb = pts(100);\n    let ticks = '';\n    for (let i = 1; i <= 5; i++) ticks += '<text x=\"' + DD_X(i) + '\" y=\"764\" text-anchor=\"middle\" class=\"axis\">' + i + '</text>';\n    this.h = UI.head(kit, 'Drawdown', 'How deep is the hole?',\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"dd-g\">' + UI.grid(170, 870, DD_Y, 500, 1000, 100) + ticks + '</g>' +\n      '<line x1=\"170\" x2=\"870\" y1=\"' + DD_Y(1000) + '\" y2=\"' + DD_Y(1000) + '\" stroke-width=\"3\" stroke-dasharray=\"10 8\" style=\"stroke:var(--main)\"/>' +\n      '<path class=\"dd-a\" fill=\"none\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--main)\"/>' +\n      '<path class=\"dd-b\" fill=\"none\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--down)\"/>' +\n      '<path class=\"dd-r\" d=\"M' + (DD_X(5) + 32) + ' ' + DD_Y(510) + ' V' + DD_Y(990) + ' M' + (DD_X(5) + 20) + ' ' + (DD_Y(990) + 16) + ' L' + (DD_X(5) + 32) + ' ' + DD_Y(990) + ' L' + (DD_X(5) + 44) + ' ' + (DD_Y(990) + 16) + '\" fill=\"none\" stroke-width=\"4\" stroke-dasharray=\"8 6\" style=\"stroke:var(--second)\"/></svg>' +\n      '<p class=\"tag\" style=\"left:186px;top:' + (DD_Y(1000) - 52) + 'px;color:var(--main);border-color:var(--main)\">Peak 1,000 USDT</p>' +\n      '<p class=\"tag dd-ta\" style=\"left:' + (DD_X(5) - 250) + 'px;top:' + (DD_Y(950) + 12) + 'px\">950 · −5%</p>' +\n      '<p class=\"tag dd-tb\" style=\"left:' + (DD_X(5) - 260) + 'px;top:' + (DD_Y(500) - 22) + 'px;color:var(--down);border-color:var(--down)\">500 · −50%</p>' +\n      '<p class=\"fict\" style=\"position:absolute;left:170px;top:282px;margin:0\">Account after each losing trade · fictional</p>' +\n      '<div class=\"glass dd-d\" style=\"left:980px;top:300px;width:800px;padding:20px 30px\"><p class=\"kick\" style=\"margin:0 0 8px\">Meaning</p>' +\n      '<p class=\"def\" style=\"margin:0;font-size:30px\"><b>Drawdown</b>: how far the account falls from its highest point, in %.</p></div>' +\n      '<div class=\"glass dd-1\" style=\"left:980px;top:480px;width:800px;padding:14px 30px\"><div class=\"row\" style=\"padding:8px 0\"><span>Five losses of 10</span><span class=\"mono\" style=\"font-size:30px\">50 ÷ 1,000 = 5%</span></div>' +\n      '<div class=\"row dd-2\" style=\"padding:8px 0;border:0\"><span>Five losses of 100</span><span class=\"mono\" style=\"font-size:30px;color:var(--down)\">500 ÷ 1,000 = 50%</span></div></div>' +\n      '<div class=\"glass dd-3\" style=\"left:980px;top:640px;width:800px;padding:16px 30px;border-color:var(--accent)\"><p class=\"mono\" style=\"margin:0;font-size:28px;line-height:1.45\">500 → 1,000 needs +500 = <span style=\"color:var(--accent)\">+100%</span><br>950 → 1,000 needs about +5.3%</p></div>');\n    const q = (s) => kit.stage.querySelector(s);\n    this.g = q('.dd-g').style; this.a = q('.dd-a'); this.b = q('.dd-b'); this.r = q('.dd-r').style; this.ta = q('.dd-ta').style; this.tb = q('.dd-tb').style;\n    this.d = q('.dd-d').style; this.c1 = q('.dd-1').style; this.c2 = q('.dd-2').style; this.c3 = q('.dd-3').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'present' }, { t: 6.4, pose: 'magnify' }, { t: 11.4, pose: 'confused' }, { t: 16.0, pose: 'think' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.h.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.h.t, t, 0.1);\n    this.g.opacity = eo(seg(t, 0.4, 1.0));\n    UI.rise(kit, this.d, t, 0.6, 0.7);\n    const pa = eio(seg(t, 6.6, 9.6)), pb = eio(seg(t, 11.6, 14.6));\n    this.a.setAttribute('d', UI.part(this.pa, Math.max(pa, 0.001))); this.a.style.opacity = pa > 0 ? 1 : 0;\n    this.b.setAttribute('d', UI.part(this.pb, Math.max(pb, 0.001))); this.b.style.opacity = pb > 0 ? 1 : 0;\n    UI.fade(this.ta, t, 9.6); UI.fade(this.tb, t, 14.6);\n    UI.rise(kit, this.c1, t, 9.8, 0.6); this.c2.opacity = eo(seg(t, 14.6, 15.0));\n    this.r.opacity = eo(seg(t, 16.4, 17.0));\n    UI.rise(kit, this.c3, t, 16.4, 0.6);\n    this.tutor.render(t);\n  },\n});\n","scene-formula.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// The sizing formula, then the long and short examples worked step by step, then what the simple model leaves out.\nconst FM_ acks the price move only after 12.8 (before that, the walk is shown as noise and PnL stays near 0).\n    const mv = t < 12.8 ? 0 : (Math.min(price, HK_E) - HK_E) / HK_E;\n    this.cs.forEach((s, i) => {\n      UI.rise(kit, s, t, i ? 9.0 : 7.0, 0.7);\n      const pnl = HK_N[i] * mv, acc = HK_A + pnl;\n      UI.set(this.ps[i], UI.sgn(pnl, 2) + ' USDT'); this.ps[i].style.color = pnl < -0.004 ? 'var(--down)' : 'var(--second)';\n      UI.set(this.as[i], UI.fmt(acc, 2)); this.bs[i].width = (acc / HK_A * 100).toFixed(2) + '%';\n      this.bs[i].background = pnl < -50 ? 'linear-gradient(90deg, var(--main), var(--down))' : 'linear-gradient(90deg, var(--main), var(--accent))';\n    });\n    this.tutor.render(t);\n  },\n});\n","scene-leverage.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Leverage = notional ÷ margin. The 1,000 USDT notional stays; the margin shrinks at 2x, 5x, 10x; the loss at the stop stays about 10 USDT.\nconst LV = [[2, 500, 7.4], [5, 200, 9.2], [10, 100, 11.0]];\nkit.scene('leverage', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const chips = LV.map((l) => '<span class=\"chip mono lv-c\" style=\"font-size:30px;padding:8px 26px\">' + l[0] + 'x</span>').join('');\n    this.h = UI.head(kit, 'Leverage exposure', 'Smaller margin, same loss at the stop',\n      '<div class=\"glass lv-d\" style=\"left:140px;top:300px;width:800px;padding:20px 30px\"><p class=\"kick\" style=\"margin:0 0 8px\">Meaning</p>' +\n      '<p class=\"def\" style=\"margin:0;font-size:30px\"><b>Leverage</b> = notional ÷ margin. A small margin controls a bigger notional.</p></div>' +\n      '<div class=\"glass lv-b\" style=\"left:140px;top:480px;width:800px;height:270px;padding:18px 30px\">' +\n      '<div style=\"display:flex;justify-content:space-between;font-size:28px;margin-bottom:8px\"><span>Notional</span><span class=\"mono\">1,000 USDT</span></div>' + UI.bar('lv-n', 740, 30) +\n      '<div style=\"display:flex;justify-content:space-between;font-size:28px;mar n</p>' + fields +\n      '<div class=\"row\" style=\"padding:12px 0 4px;border:0\"><span style=\"color:var(--second);font-weight:700\">Allowed notional</span><span class=\"mono va-o\" style=\"font-size:40px\">—</span></div></div>' +\n      '<div style=\"position:absolute;left:1010px;top:300px;width:770px;display:flex;flex-direction:column;gap:16px\">' +\n      VA_W.map((w) => '<div class=\"glass va-w\" style=\"position:relative;padding:18px 26px;border-color:var(--accent);display:flex;gap:16px;align-items:flex-start\"><span class=\"mono\" style=\"flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent);color:var(--ground)\">!</span>' +\n        '<span style=\"font-size:28px;line-height:1.35;font-weight:600\">' + w + '</span></div>').join('') + '</div>');\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.c = q('.va-c').style; this.vs = all('.va-v'); this.o = q('.va-o'); this.ws = all('.va-w').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.6, pose: 'present' }, { t: 5.0, pose: 'confused' }, { t: 10.6, pose: 'magnify' }, { t: 15.8, pose: 'think' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.h.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.h.t, t, 0.1);\n    UI.rise(kit, this.c, t, 0.4, 0.7);\n    let k = 0; VA.forEach((c, i) => { if (t >= c[0] + 0.4) k = i; });\n    const c = VA[k], vals = [UI.fmt(c[1]) + ' USDT', UI.fmt(c[2]) + ' USDT', 'Long', UI.fmt(c[3]), UI.fmt(c[4])];\n    this.vs.forEach((e, i) => {\n      UI.set(e, t < 1.0 + i * 0.3 ? '—' : vals[i]);\n      const hot = i === c[5] ? 1 - seg(t, c[0] + 3.4, c[0] + 4.4) * 0.6 : 0;\n      e.style.background = 'color-mix(in srgb, var(--accent) ' + (hot * 40).toFixed(0) + '%, transparent)';\n      e     \"name\": \"Stop distance\",\n      \"dur\": 21,\n      \"desc\": \"Stop distance defined; long: 60,000 to 59,400 = 600 USDT = 1%; short: 60,000 to 60,300 = 300 USDT = 0.5%.\"\n    },\n    {\n      \"id\": \"notional\",\n      \"name\": \"Size and notional\",\n      \"dur\": 25,\n      \"desc\": \"Position size and notional defined; 0.01 BTC x 60,000 = 600 USDT; a 1% fall loses 6 USDT; rice-bag analogy.\"\n    },\n    {\n      \"id\": \"formula\",\n      \"name\": \"Allowed notional\",\n      \"dur\": 27,\n      \"desc\": \"Allowed notional = risk / (|entry - stop| / entry): 10 / 0.01 = 1,000 USDT (about 0.0167 BTC); short 10 / 0.005 = 2,000 USDT; a simple model.\"\n    },\n    {\n      \"id\": \"leverage\",\n      \"name\": \"Leverage exposure\",\n      \"dur\": 27,\n      \"desc\": \"Leverage = notional / margin; 1,000 USDT notional needs 500 / 200 / 100 margin at 2x / 5x / 10x; loss at the stop stays about 10 USDT; liquidation risk.\"\n    },\n    {\n      \"id\": \"drawdown\",\n      \"name\": \"Drawdown\",\n      \"dur\": 23,\n      \"desc\": \"Drawdown defined; five 10 USDT losses: 1,000 to 950 (5%); five 100 USDT losses: 1,000 to 500 (50%), needing +100% to recover.\"\n    },\n    {\n      \"id\": \"mistake\",\n      \"name\": \"Leverage first\",\n      \"dur\": 21,\n      \"desc\": \"Mistake: choosing leverage or size first; fix: budget, stop, notional, then margin; NO_TRADE when the size makes no sense.\"\n    },\n    {\n      \"id\": \"try\",\n      \"name\": \"Try it\",\n      \"dur\": 31,\n      \"desc\": \"Account 2,000, example budget 20 USDT, long 50,000, stop 49,500; options 200 / 2,000 / 20,000 USDT; countdown; answer B with working, why not C.\"\n    },\n    {\n      \"id\": \"validate\",\n      \"name\": \"Inputs that make no sense\",\n      \"dur\": 21,\n      \"desc\": \"An educational mock calculator flags zero stop distance, a stop on the wrong side, and a budget bigger than the account.\"\n    },\n    {\n      \"id\": \"risks\",\n      \"name\": \"Know the limits\",\n      \"dur\": 25,\n      \"desc\": \"Slippage and fees; liquidation before the stop at high leverage; minimum sizes; fictional examples, no recommended percentages; NO_TRADE allowed.\"\n    },\n    {\n      \"id\": \"recap\",\n      \"name\": \"Recap\",\n      \"dur\": 29,\n      \"desc\": \"Three key points and a check question: risk 10 USDT, stop 2% away, allowed notional 500 USDT.\"\n    },\n    {\n      \"id\": \"next\",\n      \"name\": \"Up next\",\n      \"dur\": 10,\n      \"desc\": \"End card: next lesson T23, Full Scalping Decision Lifecycle.\"\n    }\n  ]\n}","score.js":"kit.score(function (S, T) {\n  // No voice: the music is the only sound. Soft pad and keys, a light pulse while charts move, quieter in the risk parts.\n  const BPM = 84, B = 60 / BPM;\n  S.tempo(BPM, { t0: 0 });\n  S.program('pad', 'pad', { rev: 0.7, gain: -6 });\n  S.program('keys', 'ep', { rev: 0.45, gain: -10 });\n  S.program('mal', 'pluck', { rev: 0.5, gain: -12, pan: 0.2 });\n  S.program('bass', 'bass', { gain: -10 });\n  const prog = [['D3', 'A3', 'E4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'A3', 'C#4']];\n  const roots = ['D2', 'B1', 'G1', 'A1'];\n  const tops = [['F#5', 'A5', 'E5'], ['D5', 'F#5', 'A5'], ['B4', 'D5', 'F#5'], ['C#5', 'E5', 'A5']];\n  const inR = (s, a, b) => s >= a - 0.1 && s < b - 0.1;\n  const pulse = (s) => inR(s, T.hook, T.account) || inR(s, T.formula, T.drawdown) || inR(s, T.try, T.risks);\n  const quiet = (s) => inR(s, T.mistake, T.try) || inR(s, T.risks, T.recap);\n  const bars = Math.floor(T.END / (4 * B));\n  for (let b = 0; b < bars; b++) {\n    const beat = b * 4, s = beat * B, c = prog[b % 4];\n    if (s >= T.next - 0.1) break;\n    S.chord('pad', c, { beat, beats: 4, vel: quiet(s) ? 26 : 32 });\n    if (!quiet(s)) S.chord('keys', c.slice(1), { beat, beats: 3, vel: 34 });\n    if (pulse(s)) { S.pattern('mal', 'x.x..x.x', { from: beat, repeat: 1, pitch: tops[b % 4], vel: 34 }); S.note('bass', roots[b % 4], { beat, beats: 3, vel: 48 }); }\n  }\n  const steps = (a, b) => { const ts = []; for (let s = a + 0.18; s < b; s += 0.364) ts.push(s); S.ticks(ts, { vel: 24 }); };\n  steps(T.title, T.title + 2.6); steps(T.next + 0.1, T.next + 1.1);\n  const pop = (t, v, p) => S.fx('pop', t, { vel: v || 28, pitch: p == null ? 7 : p });\n  // Title: the risk meter fills to the budget line.\n  S.fx('whoosh', T.title + 1.0, { dur: 2.6, vel: 16 }); S.fx('ding', T.title + 3.6, { vel: 30 }); pop(T.title + 3.8, 26);\n  // Hook: cards, then the drop to the stop and the losses.\n  pop(T.hook + 7.0); pop(T.hook + 9.0); S.fx('whoosh', T.hook + 12.8, { dur: 5.2, vel: 18 }); S.fx('thud', T.hook + 18.0, { vel: 34 });\n  // Account: bar fills, budget slice, analogy, example tag.\n  S.fx('whoosh', T.account + 1.6, { dur: 2.0, vel: 16 }); pop(T.account + 7.6); S.fx('ding', T.account + 9.6, { vel: 30 }); pop(T.account + 14.4); pop(T.account + 20.8, 26, 5);\n  // Stop: lines, rulers, cards.\n  [0.6, 1.6, 13.8].forEach((a) => S.fx('tick', T.stop + a, { vel: 26 })); S.fx('whoosh', T.stop + 6.6, { dur: 0.8, vel: 18 }); pop(T.stop + 7.8); S.fx('whoosh', T.stop + 14.6, { dur: 0.8, vel: 18 }); pop(T.stop + 15.8);\n  // Notional: equation, the 1% fall, rice bags.\n  pop(T.notional + 7.4); S.fx('whoosh', T.notional + 12.4, { dur: 2.0, vel: 16 }); S.fx('thud', T.notional + 14.6, { vel: 26 }); pop(T.notional + 18.2); [20.6, 21.0].forEach((a) => S.fx('tick', T.notional + a, { vel: 26 }));\n  // Formula: the formula, each worked row, the short, the ignored costs.\n  S.fx('chime', T.formula + 4.4, { vel: 32 }); [10.0, 11.2, 12.4, 14.0].forEach((a) => S.fx('tick', T.formula + a, { vel: 28 })); S.fx('ding', T.formula + 13.6, { vel: 32 });\n  pop(T.formula + 16.6); for (let i = 0; i < 4; i++) pop(T.formula + 21.6 + i * 0.5, 24, 3 + i * 2);\n  // Leverage: chips step, loss card, danger.\n  [7.4, 9.2, 11.0].forEach((a, i) => pop(T.leverage + a, 28, 5 + i * 2)); S.fx('ding', T.leverage + 12.8, { vel: 30 }); S.fx('thud', T.leverage + 19.6, { vel: 30 });\n  // Drawdown: two equity paths.\n  for (let i = 0; i < 5; i++) S.fx('tick', T.drawdown + 6.6 + i * 0.6, { vel: 22 }); for (let i = 0; i < 5; i++) S.fx('thud', T.drawdown + 11.6 + i * 0.6, { vel: 22 + i * 2 }); pop(T.drawdown + 16.4);\n  // Mistake.\n  [1.4, 2.8, 4.2].forEach((a) => S.fx('tick', T.mistake + a, { vel: 26 })); S.fx('thud', T.mistake + 6.4, { vel: 32 }); for (let i = 0; i < 4; i++) S.fx('tick', T.mistake + 7.8 + i * 1.2, { vel: 28 }); S.fx('chime', T.mistake + 13.8, { vel: 32 });\n  // Try it.\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 1.0 + i * 0.9, { vel: 22 }); [7.6, 8.2, 8.8].forEach((a) => pop(T.try + a, 26));\n  for (let i = 0; i < 5; i++) S.fx('tick', T.try + 14.4 + i, { vel: 30 }); S.fx('chime', T.try + 20.0, { vel: 42 }); pop(T.try + 25.3, 28, 5);\n  // Validate: each warning.\n  S.fx('ding', T.validate + 2.6, { vel: 26 }); [5.6, 11.2, 16.4].forEach((a) => S.fx('thud', T.validate + a, { vel: 30 }));\n  [3.6, 10.0, 12.8, 17.0].forEach((a) => pop(T.risks + a, 26));\n  [2.0, 8.6, 14.8].forEach((a) => pop(T.recap + a + 0.5, 34));\n  S.fx('ding', T.recap + 26.0, { vel: 38 });\n  S.fx('revswell', T.next, { dur: 1.6, vel: 44 });\n  S.chord('pad', ['D3', 'A3', 'D4', 'F#4'], { t: T.next, dur: 9, vel: 40 });\n  S.chord('keys', ['D3', 'A3', 'D4', 'F#4', 'A4'], { t: T.next + 0.7, dur: 8, vel: 50 });\n  S.run('mal', ['D5', 'E5', 'F#5', 'A5', 'B5', 'D6'], { t: T.next + 1.4, step: 0.12, vel: 40, cresc: 6 });\n  S.master({ gain: -10, music: 22, fadeOut: 2.5 });\n});\n","shared.js":"window.UI = {\n  LESSON: 'T22 · Position sizing and risk budget',\n  TOTAL: 315,\n  lockup(kit) {\n    return kit.h('<div class=\"lock\"><img alt=\"\" src=\"' + kit.assets.url('xtinex-x.png') + '\"><span class=\"lock-xt\">XTINEX</span><span class=\"lock-bar\"></span><span class=\"lock-xo\">XORA</span></div>');\n  },\n  // Lesson header: lesson name and a progress bar across the whole film.\n  chrome(kit) {\n    const el = kit.h('<div class=\"chrome\"><span>' + kit.esc(UI.LESSON) + '</span><div><i></i></div></div>');\n    kit.stage.append(el);\n    const bar = el.querySelector('i').style, start = kit.start;\n    return (t) => { bar.width = (Math.min(1, (start + t) / UI.TOTAL) * 100).toFixed(2) + '%'; };\n  },\n  // Set text only when it changes.\n  set(el, v) { v = String(v); if (el.textContent !== v) el.textContent = v; },\n  // Signed amount: +10.00 / −10.00 (true minus sign).\n  sgn(n, dp) { const v = Math.abs(n) < 1e-9 ? 0 : n; return (v > 0 ? '+' : v < 0 ? '−' : '') + UI.fmt(Math.abs(v), dp); },\n  // Entrance: fade in and rise from dy px, starting at a, over d seconds. Optional fade-out window [o0, o1].\n  rise(kit, st, t, a, d, dy, o0, o1) {\n    const p = kit.seg(t, a, a + (d || 0.6));\n    const out = o0 == null ? 0 : kit.ei(kit.seg(t, o0, o1));\n    st.opacity = (kit.eo(kit.seg(t, a, a + (d || 0.6) * 0.6)) * (1 - out)).toFixed(3);\n    st.transform = 'translateY(' + kit.lerp(dy == null ? 30 : dy, 0, kit.eo(p)).toFixed(1) + 'px)';\n    return p;\n  },\n  // Countdown ring centred at cx, cy: shown from tIn, a pause sign, then n seconds counting down from t0, gone by tOut.\n  ring(kit, cx, cy, r, tIn, t0, n, tOut, label) {\n    const C = 2 * Math.PI * r;\n    const svg = kit.h('<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ui-ring\" transform=\"translate(' + cx + ' ' + cy + ')\">' +\n      '<circle r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" style=\"stroke:color-mix(in srgb, var(--second) 10%, transparent)\"/>' +\n      '<circle class=\"ui-arc\" r=\"' + r + '\" fill=\"none\" stroke-width=\"12\" stroke-linecap=\"round\" transform=\"rotate(-90)\" stroke-dasharray=\"' + C.toFixed(1) + '\" style=\"stroke:var(--main)\"/>' +\n      '<g class=\"ui-pause\"><rect x=\"-24\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/><rect x=\"8\" y=\"-32\" width=\"16\" height=\"64\" rx=\"4\" style=\"fill:var(--second)\"/></g>' +\n      '<text class=\"ui-n mono\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:72px\"></text>' +\n      (label ? '<text y=\"' + (-r - 30) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 62%, var(--ground));font-size:26px\">' + kit.esc(label) + '</text>' : '') + '</g></svg>');\n    kit.stage.append(svg);\n    const g = svg.querySelector('.ui-ring'), arc = svg.querySelector('.ui-arc'), pause = svg.querySelector('.ui-pause').style, num = svg.querySelector('.ui-n');\n    return (t) => {\n      const p = kit.seg(t, tIn, tIn + 0.5);\n      g.style.opacity = kit.eo(p) * (1 - kit.ei(kit.seg(t, tOut - 0.4, tOut)));\n      g.setAttribute('transform', 'translate(' + cx + ' ' + cy + ') scale(' + kit.lerp(0.8, 1, kit.eob(p, 1.6)).toFixed(4) + ')');\n      arc.setAttribute('stroke-dashoffset', (C * kit.seg(t, t0, t0 + n)).toFixed(1));\n      const txt = t < t0 ? '' : String(Math.max(0, Math.min(n, Math.ceil(n - (t - t0)))));\n      if (num.textContent !== txt) num.textContent = txt;\n      pause.opacity = t < t0 ? 1 : 0;\n    };\n  },\n  fmt(n, dp) { return n.toLocaleString('en-US', { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 }); },\n  // Deterministic fictional price walk: returns [[x,y],...] across x0..x1.\n  walk(kit, seed, n, x0, x1, y0, y1, amp) {\n    const r = kit.rng(seed); const pts = []; let v = 0;\n    for (let i = 0; i < n; i++) {\n      v += (r() - 0.5) * amp; v *= 0.86;\n      const p = i / (n - 1);\n      pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * p + v]);\n    }\n    return pts;\n  },\n  d(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); },\n  // The tutor sits in this corner between scenes: feet x, feet y, brain width (px).\n  CORNER: { x: 1735, y: 1042, s: 160 },\n  // Side speech bubbles sit this far higher than in T01, so they clear the two-line caption band (y ≈ 784–930).\n  LIFT: 96,\n  // The brain tutor. cfg.keys: [{t, x, y, s, d?, ease?}] feet position and brain width, each key reached at t after a d-second move.\n  // cfg.poses: [{t, pose, flip?}] ('wave' and 'walk' play their frame loops). cfg.says: [{t0, t1, text, side?: 'left'|'top'}].\n  tutor(kit, cfg) {\n    const M = kit.json('tutor.json');\n    const root = kit.h('<div class=\"tutor\"></div>');\n    const shadow = kit.h('<div class=\"tutor-shadow\"></div>');\n    root.append(shadow);\n    const imgs = {};\n    for (const n of Object.keys(M)) {\n      const im = kit.h('<img class=\"tutor-img\" alt=\"\" src=\"' + kit.assets.url('tutor-' + n + '.webp') + '\">');\n      imgs[n] = im.style; root.append(im);\n    }\n    const says = (cfg.says || []).map((s) => {\n      const b = kit.h('<div class=\"bubble' + (s.side === 'top' ? ' is-top' : '') + '\"><p>' + kit.esc(s.text) + '</p></div>');\n      root.append(b);\n      return Object.assign({}, s, { st: b.style });\n    });\n    kit.stage.append(root);\n    const keys = cfg.keys, poses = cfg.poses;\n    const LOOPS = {\n      wave: { f: ['wv1', 'wv2', 'wv3', 'wv4', 'wv3', 'wv2'], fps: 7 },\n      walk: { f: ['wk0', 'wk1', 'wk2', 'wk3', 'wk4', 'wk5', 'wk6', 'wk7'], fps: 11 },\n    };\n    const name = (p, dt) => { const L = LOOPS[p.pose]; return L ? L.f[Math.floor(Math.max(0, dt) * L.fps) % L.f.length] : p.pose; };\n    let shown = [];\n    const place = (n, flip, x, y, s, op, sc, lift) => {\n      const m = M[n], st = imgs[n], k = s / m.bw;\n      st.width = (m.w * k).toFixed(1) + 'px'; st.height = (m.h * k).toFixed(1) + 'px';\n      st.left = (x - m.ax * k).toFixed(1) + 'px'; st.top = (y - m.feet * k).toFixed(1) + 'px';\n      st.transformOrigin = (m.ax * k).toFixed(1) + 'px ' + (m.feet * k).toFixed(1) + 'px';\n      st.transform = 'translateY(' + lift.toFixed(2) + 'px) scale(' + (flip ? -sc : sc).toFixed(4) + ',' + sc.toFixed(4) + ')';\n      st.opacity = op;\n      shown.push(n);\n    };\n    const api = {\n      at(t) {\n        let x = keys[0].x, y = keys[0].y, s = keys[0].s;\n        for (let i = 1; i < keys.length; i++) {\n          const a = keys[i - 1], b = keys[i], d = b.d == null ? 0.8 : b.d;\n          const p = kit.seg(t, b.t - d, b.t);\n          if (p <= 0) break;\n          const e = (b.ease || kit.eio)(p);\n          x = kit.lerp(a.x, b.x, e); y = kit.lerp(a.y, b.y, e); s = kit.lerp(a.s, b.s, e);\n        }\n        return { x, y, s };\n      },\n      render(t) {\n        for (const n of shown) imgs[n].opacity = 0;\n        shown = [];\n        const { x, y, s } = api.at(t);\n        let i = 0;\n        for (let j = 0; j < poses.length; j++) if (poses[j].t <= t) i = j;\n        const cur = poses[i], dt = t - cur.t;\n        const sw = i > 0 ? kit.clamp01(dt / 0.18) : 1;\n        const pop = i > 0 ? kit.clamp01(dt / 0.32) : 1;\n        const bob = Math.sin(t * 2 * Math.PI / 2.6) * s * 0.025;\n        const hop = cur.pose === 'walk' ? 0 : Math.sin(Math.PI * pop) * s * 0.07;\n        const step = cur.pose === 'walk' ? Math.abs(Math.sin(dt * Math.PI * 2.75)) * s * 0.03 : 0;\n        const breathe = 1 + 0.012 * Math.sin(t * 2 * Math.PI / 3.1);\n        const sc = breathe * (cur.pose === 'walk' ? 1 : kit.lerp(0.93, 1, kit.eob(pop, 1.8)));\n        if (sw < 1) { const pv = poses[i - 1]; place(name(pv, t - pv.t), !!pv.flip, x, y, s, 1 - sw, breathe, bob); }\n        place(name(cur, dt), !!cur.flip, x, y, s, sw, sc, bob - hop - step);\n        const sh = shadow.style;\n        sh.left = (x - s * 0.6).toFixed(1) + 'px'; sh.top = (y - s * 0.07).toFixed(1) + 'px';\n        sh.width = (s * 1.2).toFixed(1) + 'px'; sh.height = (s * 0.16).toFixed(1) + 'px';\n        sh.opacity = 0.75 - (hop + step) / s;\n        for (const b of says) {\n          const p = kit.seg(t, b.t0, b.t0 + 0.32), o = kit.seg(t, b.t1 - 0.25, b.t1);\n          b.st.opacity = kit.eo(p) * (1 - kit.ei(o));\n          if (b.st.opacity === '0') continue;\n          const g = kit.lerp(0.88, 1, kit.eob(p, 1.6)) * kit.lerp(1, 0.96, kit.ei(o));\n          if (b.side === 'top') {\n            b.st.transformOrigin = '50% 100%';\n            b.st.transform = 'translate(' + x.toFixed(1) + 'px,' + (y - s * 1.42).toFixed(1) + 'px) translate(-50%,-100%) scale(' + g.toFixed(4) + ')';\n          } else {\n            b.st.transformOrigin = '100% 100%';\n            b.st.transform = 'translate(' + (x - s * 0.18).toFixed(1) + 'px,' + (y - s * 1.12 - UI.LIFT).toFixed(1) + 'px) translate(-100%,-100%) scale(' + g.toFixed(4) + ')';\n          }\n        }\n      },\n    };\n    return api;\n  },\n  // ── Chart helpers (from T14) ──\n  // Piecewise eased value through keys [[t, v], ...].\n  path(keys, t) {\n    const K = UI.K; let v = keys[0][1];\n    for (let i = 1; i < keys.length; i++) { const a = keys[i - 1], b = keys[i]; if (t >= a[0]) v = K.lerp(a[1], b[1], K.eio(K.clamp01((t - a[0]) / (b[0] - a[0])))); }\n    return v;\n  },\n  // Price grid for a chart: horizontal lines with price labels to the right of x1.\n  grid(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x1 + 16) + '\" y=\"' + (+y + 8) + '\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Same grid with the price labels on the left, ending at x0 - 14.\n  gridL(x0, x1, yOf, lo, hi, step) {\n    let g = '';\n    for (let p = lo; p <= hi + 1e-6; p += step) {\n      const y = yOf(p).toFixed(1);\n      g += '<line x1=\"' + x0 + '\" x2=\"' + x1 + '\" y1=\"' + y + '\" y2=\"' + y + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/>' +\n        '<text x=\"' + (x0 - 14) + '\" y=\"' + (+y + 8) + '\" text-anchor=\"end\" class=\"mono\" style=\"fill:color-mix(in srgb, var(--second) 50%, var(--ground));font-size:22px\">' + UI.fmt(p) + '</text>';\n    }\n    return g;\n  },\n  // Polyline of a price function f(s) for s in [s0, s1], mapped with xOf and yOf.\n  line(f, s0, s1, xOf, yOf, dt) {\n    let d = '';\n    for (let s = s0; s <= s1 + 1e-6; s += dt || 0.05) d += (d ? 'L' : 'M') + xOf(s).toFixed(1) + ' ' + yOf(f(s)).toFixed(1);\n    return d || 'M0 0';\n  },\n  // ── Candle helpers (T14) ──\n  // n SVG candles: html to place inside an <svg>; set(i, c) draws candle i with\n  // c = {x, w, o, h, l, c, y: price → y, op?, live?, col?}. Up (close ≥ open) is --up, down is --down.\n  cdl(kit, cls, n) {\n    let html = '';\n    for (let i = 0; i < n; i++) html += '<g class=\"' + cls + '\"><line class=\"' + cls + '-w\" stroke-linecap=\"round\"/><rect class=\"' + cls + '-b\" rx=\"4\"/></g>';\n    let G, W, B;\n    return {\n      html,\n      set(i, c) {\n        if (!G) { const all = (s) => [...kit.stage.querySelectorAll(s)]; G = all('.' + cls); W = all('.' + cls + '-w'); B = all('.' + cls + '-b'); }\n        const col = c.col || (c.c >= c.o ? 'var(--up)' : 'var(--down)');\n        const yt = c.y(Math.max(c.o, c.c)), yb = c.y(Math.min(c.o, c.c)), bh = Math.max(c.min == null ? 4 : c.min, yb - yt), ym = (yt + yb) / 2;\n        const w = W[i], b = B[i], sw = Math.max(3, c.w * 0.07);\n        w.setAttribute('x1', c.x.toFixed(1)); w.setAttribute('x2', c.x.toFixed(1));\n        w.setAttribute('y1', c.y(c.h).toFixed(1)); w.setAttribute('y2', c.y(c.l).toFixed(1));\n        w.setAttribute('stroke-width', sw.toFixed(1)); w.style.stroke = col;\n        b.setAttribute('x', (c.x - c.w / 2).toFixed(1)); b.setAttribute('width', c.w.toFixed(1));\n        b.setAttribute('y', (ym - bh / 2).toFixed(1)); b.setAttribute('height', bh.toFixed(1));\n        b.setAttribute('stroke-width', (sw * 0.8).toFixed(1));\n        b.style.stroke = col;\n        b.style.fill = c.live ? 'color-mix(in srgb, ' + col + ' 38%, var(--ground))' : col;\n        G[i].style.opacity = c.op == null ? 1 : c.op;\n      },\n    };\n  },\n  // Fade an element in at a and out at b (opacity only).\n  fade(st, t, a, b) { const K = UI.K; st.opacity = (K.eo(K.seg(t, a, a + 0.5)) * (b == null ? 1 : 1 - K.ei(K.seg(t, b, b + 0.45)))).toFixed(3); },\n  hilo(fn, a, b) { let lo = fn(a), hi = lo; for (let s = a; s <= b; s += 0.05) { const v = fn(s); if (v < lo) lo = v; if (v > hi) hi = v; } const v = fn(b); return [Math.min(lo, v), Math.max(hi, v)]; },\n  // A forming candle: price through keys [[t, p]] with a small wiggle, kept inside [lo, hi]; returns the candle at time t.\n  forming(keys, lo, hi, t) {\n    const K = UI.K, a = keys[0][0], b = keys[keys.length - 1][0];\n    const f = (s) => Math.min(hi, Math.max(lo, UI.path(keys, s) + 7 * Math.sin(s * 9.3) * Math.sin(Math.PI * K.clamp01((s - a) / (b - a)))));\n    const e = Math.min(Math.max(t, a), b), hl = UI.hilo(f, a, e);\n    return { o: keys[0][1], h: hl[1], l: hl[0], c: f(e), live: t < b };\n  },\n  // Partial polyline through pts [[x, y], ...] up to fraction f (0..1) of its segments.\n  part(pts, f) {\n    const n = pts.length - 1, k = Math.max(0, Math.min(n, f * n)), i = Math.floor(k);\n    let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);\n    for (let j = 1; j <= i; j++) d += ' L' + pts[j][0].toFixed(1) + ' ' + pts[j][1].toFixed(1);\n    if (i < n && k > i) { const a = pts[i], b = pts[i + 1], u = k - i; d += ' L' + (a[0] + (b[0] - a[0]) * u).toFixed(1) + ' ' + (a[1] + (b[1] - a[1]) * u).toFixed(1); }\n    return d;\n  },\n  // A horizontal bar: returns html of a track with a fill (class cls-f); set width with style.width.\n  bar(cls, w, h, col) {\n    return '<div class=\"' + cls + '\" style=\"position:relative;width:' + w + 'px;height:' + h + 'px;border-radius:' + (h / 2) + 'px;background:color-mix(in srgb, var(--second) 10%, transparent);overflow:hidden\">' +\n      '<div class=\"' + cls + '-f\" style=\"position:absolute;left:0;top:0;bottom:0;width:0;border-radius:' + (h / 2) + 'px;background:' + (col || 'linear-grad
