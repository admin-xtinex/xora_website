<script>window.FILM = {"id":"T06","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson six","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"Did it make money?","dur":14,"k":1,"oldStart":8,"oldDur":14},{"id":"entryexit","name":"Entry and exit","dur":28.38,"k":1.29,"oldStart":22,"oldDur":22},{"id":"size","name":"Quantity and notional","dur":35.76,"k":1.49,"oldStart":44,"oldDur":24},{"id":"spot","name":"Spot profit and loss","dur":35.49,"k":1.69,"oldStart":68,"oldDur":21},{"id":"unreal","name":"Unrealized and realized","dur":21,"k":1,"oldStart":89,"oldDur":21},{"id":"flong","name":"Futures long","dur":47.32,"k":1.82,"oldStart":110,"oldDur":26},{"id":"fshort","name":"Futures short","dur":29.26,"k":1.54,"oldStart":136,"oldDur":19},{"id":"fees","name":"Gross and net","dur":66.3,"k":2.21,"oldStart":155,"oldDur":30},{"id":"mistake","name":"Forgetting fees","dur":32.16,"k":1.34,"oldStart":185,"oldDur":24},{"id":"try","name":"Try it","dur":30.4,"k":1.6,"oldStart":209,"oldDur":19},{"id":"risks","name":"Know the risks","dur":28,"k":1,"oldStart":228,"oldDur":28},{"id":"recap","name":"Recap","dur":52.08,"k":1.68,"oldStart":256,"oldDur":31},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":287,"oldDur":10}],"voice":{"src":"T06/voice.mp3","lines":[{"t":0.6,"d":5.479,"text":"Lesson six: entry, exit, and profit or loss. Let's do the maths, step by step.","ml":"പാഠം ആറ്: entry, exit, ലാഭം അല്ലെങ്കിൽ നഷ്ടം. നമുക്ക് പടിപടിയായി കണക്ക് ചെയ്യാം."},{"t":8.4,"d":5.306,"text":"Every trade has a start and an end. The question is always: how much did it make, or lose?","ml":"ഓരോ ട്രേഡിനും ഒരു തുടക്കവും ഒരു അവസാനവുമുണ്ട്. ചോദ്യം എപ്പോഴും ഇതാണ്: എത്ര ലാഭം കിട്ടി, അല്ലെങ്കിൽ എത്ര നഷ്ടമായി?"},{"t":15.3,"d":5.988,"text":"To answer, you need four things: entry, exit, size and fees. Let's meet them one by one.","ml":"ഉത്തരം കിട്ടാൻ നാല് കാര്യങ്ങൾ വേണം: entry, exit, size, ഫീസ്. ഓരോന്നായി പരിചയപ്പെടാം."},{"t":22.516,"d":4.918,"text":"The entry price is the price where you open a trade. The exit price is where you close it.","ml":"ട്രേഡ് തുടങ്ങുന്ന വിലയാണ് entry price. ട്രേഡ് ക്ലോസ് ചെയ്യുന്ന വിലയാണ് exit price."},{"t":31.288,"d":4.96,"text":"Think of a bus ride: where you get on, and where you get off. The distance between them matters.","ml":"ഒരു ബസ് യാത്ര പോലെ ചിന്തിക്കൂ: എവിടെ കയറുന്നു, എവിടെ ഇറങ്ങുന്നു. ഇവ തമ്മിലുള്ള ദൂരമാണ് പ്രധാനം."},{"t":40.576,"d":9.378,"text":"Here, you enter at 60,000. The price moves, and you exit at 61,200. A move of 1,200 USDT.","ml":"ഇവിടെ നിങ്ങൾ 60,000-ൽ entry ചെയ്യുന്നു. വില മാറുന്നു, 61,200-ൽ exit ചെയ്യുന്നു. 1,200 USDT-ന്റെ നീക്കം."},{"t":50.976,"d":6.22,"text":"Size is how much you trade. Quantity is the amount of the asset, like 0.05 BTC.","ml":"എത്ര ട്രേഡ് ചെയ്യുന്നു എന്നതാണ് size. Quantity എന്നാൽ അസറ്റിന്റെ അളവ്, ഉദാഹരണത്തിന് 0.05 BTC."},{"t":60.065,"d":4.365,"text":"Notional value is quantity times price. It's the full value of the trade.","ml":"Quantity-യെ വില കൊണ്ട് ഗുണിച്ചാൽ notional value കിട്ടും. ട്രേഡിന്റെ മുഴുവൻ മൂല്യമാണത്."},{"t":68.558,"d":10.458,"text":"Like 3 kg of onions at 40 per kg: the bill is 120. Here, 0.05 × 60,000 = 3,000 USDT.","ml":"കിലോയ്ക്ക് 40 വെച്ച് 3 kg ഉള്ളി വാങ്ങിയാൽ ബിൽ 120. ഇവിടെ 0.05 × 60,000 = 3,000 USDT."},{"t":79.566,"d":4.199,"text":"Bigger size means every price move counts for more, up or down.","ml":"Size കൂടുമ്പോൾ, വില കയറിയാലും ഇറങ്ങിയാലും, ഓരോ നീക്കത്തിന്റെയും ഫലം കൂടും."},{"t":86.816,"d":4.991,"text":"Now the profit or loss formula for spot: exit minus entry, times quantity.","ml":"ഇനി spot-ലെ ലാഭ-നഷ്ട ഫോർമുല: exit-ൽ നിന്ന് entry കുറച്ച്, quantity കൊണ്ട് ഗുണിക്കുക."},{"t":96.618,"d":12.757,"text":"Buy 0.05 BTC at 60,000 and sell at 61,200: 1,200 × 0.05 = +60 USDT. That's the gross result.","ml":"60,000-ന് 0.05 BTC buy ചെയ്ത് 61,200-ന് sell ചെയ്താൽ: 1,200 × 0.05 = +60 USDT. ഇതാണ് gross ഫലം."},{"t":109.925,"d":9.584,"text":"Gross means before any fees. Sell at 59,400 instead, and it's −600 × 0.05 = −30 USDT.","ml":"Gross എന്നാൽ ഫീസിന് മുമ്പുള്ളത്. പകരം 59,400-ന് sell ചെയ്താൽ: −600 × 0.05 = −30 USDT."},{"t":122.03,"d":5.372,"text":"While a trade is open, its profit or loss is unrealized. It changes with every tick.","ml":"ട്രേഡ് തുറന്നിരിക്കുമ്പോൾ ലാഭമോ നഷ്ടമോ unrealized ആണ്. ഓരോ ടിക്കിലും അത് മാറും."},{"t":128.43,"d":4.934,"text":"A green number now can turn red a minute later. It isn't locked in until you close.","ml":"ഇപ്പോൾ പച്ചയായ നമ്പർ ഒരു മിനിറ്റ് കഴിഞ്ഞ് ചുവപ്പാകാം. ക്ലോസ് ചെയ്യുന്നത് വരെ അത് ഉറപ്പല്ല."},{"t":134.83,"d":7.265,"text":"When you exit, it becomes realized: the result is fixed. Here, +60 USDT, before fees.","ml":"Exit ചെയ്യുമ്പോൾ അത് realized ആകും: ഫലം ഉറച്ചു. ഇവിടെ, ഫീസിന് മുമ്പ് +60 USDT."},{"t":143.358,"d":7.767,"text":"Futures next. On a USDT-margined contract, a long works the same way: exit minus entry, times size.","ml":"അടുത്തത് futures. USDT-margined contract-ൽ long ഇതേ രീതിയിലാണ്: exit-ൽ നിന്ന് entry കുറച്ച്, size കൊണ്ട് ഗുണിക്കുക."},{"t":157.19,"d":11.297,"text":"Long 0.1 BTC at 60,000, exit at 59,400: −600 × 0.1 = −60 USDT. A loss.","ml":"60,000-ൽ 0.1 BTC long, 59,400-ൽ exit: −600 × 0.1 = −60 USDT. ഇതൊരു നഷ്ടമാണ്."},{"t":169.037,"d":3.422,"text":"This is simplified: fees and funding are left out for now.","ml":"ഇത് ലളിതമാക്കിയ കണക്കാണ്: ഫീസും funding-ഉം ഇപ്പോൾ ഒഴിവാക്കിയിരിക്കുന്നു."},{"t":176.118,"d":5.187,"text":"Leverage doesn't change this USDT result, but it makes it larger compared with your margin.","ml":"Leverage ഈ USDT ഫലം മാറ്റില്ല, പക്ഷേ നിങ്ങളുടെ margin-നെ അപേക്ഷിച്ച് അത് വലുതാക്കും."},{"t":190.566,"d":4.022,"text":"For a short, flip it: entry minus exit, times size.","ml":"Short-ന് നേരെ തിരിച്ചാണ്: entry-ൽ നിന്ന് exit കുറച്ച്, size കൊണ്ട് ഗുണിക്കുക."},{"t":197.034,"d":11.189,"text":"Short 0.1 BTC at 60,000, exit at 59,400: 600 × 0.1 = +60 USDT. The fall was your gain.","ml":"60,000-ൽ 0.1 BTC short, 59,400-ൽ exit: 600 × 0.1 = +60 USDT. വിലയിടിവ് നിങ്ങളുടെ ലാഭമായി."},{"t":208.773,"d":9.923,"text":"But exit at 60,800, and it's −800 × 0.1 = −80 USDT. A short loses when the price rises.","ml":"പക്ഷേ 60,800-ൽ exit ചെയ്താൽ −800 × 0.1 = −80 USDT. വില കയറുമ്പോൾ short നഷ്ടത്തിലാകും."},{"t":220.094,"d":9.295,"text":"Now fees. Say you go long 0.1 BTC from 60,000 to 60,600. Gross: +60 USDT.","ml":"ഇനി ഫീസ്. 0.1 BTC 60,000-ൽ നിന്ന് 60,600 വരെ long എന്ന് കരുതുക. Gross: +60 USDT."},{"t":232.912,"d":5.152,"text":"Exchanges charge a fee on entry and again on exit: notional value times the fee rate.","ml":"Exchange-കൾ entry-യിലും വീണ്ടും exit-ലും ഫീസ് ഈടാക്കും: notional value × ഫീസ് നിരക്ക്."},{"t":247.498,"d":9.359,"text":"We'll use 0.05%, a made-up rate. Entry fee: 6,000 × 0.05% = 3.00 USDT.","ml":"നമ്മൾ 0.05% എന്ന സാങ്കൽപ്പിക നിരക്ക് എടുക്കുന്നു. Entry ഫീസ്: 6,000 × 0.05% = 3.00 USDT."},{"t":259.874,"d":13.734,"text":"Exit fee: 6,060 × 0.05% = 3.03 USDT. Net: 60 − 3.00 − 3.03 = +53.97 USDT.","ml":"Exit ഫീസ്: 6,060 × 0.05% = 3.03 USDT. Net: 60 − 3.00 − 3.03 = +53.97 USDT."},{"t":274.158,"d":4.216,"text":"Net is what you actually keep. Always check real fee rates before trading.","ml":"Net ആണ് ശരിക്കും നിങ്ങളുടെ കയ്യിൽ കിട്ടുന്നത്. ട്രേഡ് ചെയ്യും മുമ്പ് യഥാർത്ഥ ഫീസ് നിരക്ക് എപ്പോഴും നോക്കുക."},{"t":286.046,"d":3.547,"text":"A common mistake: counting the gross result and forgetting fees.","ml":"ഒരു സാധാരണ തെറ്റ്: gross ഫലം മാത്രം കണക്കാക്കി ഫീസ് മറക്കുന്നത്."},{"t":292.88,"d":8.305,"text":"Long 0.1 BTC from 60,000 to 60,040. Gross: +4 USDT. Looks like a win.","ml":"0.1 BTC 60,000-ൽ നിന്ന് 60,040 വരെ long. Gross: +4 USDT. ജയിച്ചതുപോലെ തോന്നും."},{"t":301.735,"d":7.546,"text":"But fees are 3.00 on entry and about 3.00 on exit. Net: about −2 USDT. A gross win, a net loss.","ml":"പക്ഷേ ഫീസ് entry-യിൽ 3.00, exit-ൽ ഏകദേശം 3.00. Net: ഏകദേശം −2 USDT. Gross-ൽ ജയം, net-ൽ നഷ്ടം."},{"t":309.898,"d":4.693,"text":"And remember: an open, unrealized profit isn't yours until you close.","ml":"ഓർക്കുക: തുറന്നിരിക്കുന്ന unrealized ലാഭം ക്ലോസ് ചെയ്യുന്നത് വരെ നിങ്ങളുടേതല്ല."},{"t":318.31,"d":9.129,"text":"Your turn. Short 0.02 BTC at 60,000, closed at 61,000. What's the gross result? Pause if needed.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. 60,000-ൽ 0.02 BTC short, 61,000-ൽ ക്ലോസ് ചെയ്തു. Gross ഫലം എത്ര? വേണമെങ്കിൽ വീഡിയോ നിർത്താം."},{"t":330.79,"d":6.891,"text":"Gross: −20 USDT. Entry minus exit is −1,000, times 0.02.","ml":"Gross: −20 USDT. Entry-ൽ നിന്ന് exit കുറച്ചാൽ −1,000, അതിനെ 0.02 കൊണ്ട് ഗുണിക്കുക."},{"t":338.231,"d":9.335,"text":"With 0.05% fees, 0.60 on entry and 0.61 on exit, the net is −21.21 USDT.","ml":"0.05% ഫീസ് വെച്ച്, entry-യിൽ 0.60, exit-ൽ 0.61. അപ്പോൾ net −21.21 USDT."},{"t":348.37,"d":1.881,"text":"Before you go on, the risks.","ml":"മുന്നോട്ട് പോകും മുമ്പ്, റിസ്കുകൾ."},{"t":351.07,"d":4.361,"text":"Prices can jump past the exit you planned, so your real exit can be worse.","ml":"നിങ്ങൾ പ്ലാൻ ചെയ്ത exit കടന്ന് വില ചാടിപ്പോകാം, അപ്പോൾ യഥാർത്ഥ exit കൂടുതൽ മോശമാകാം."},{"t":356.87,"d":5.38,"text":"Fees hit every entry and exit, and futures add funding. Small trades feel it most.","ml":"ഓരോ entry-ക്കും exit-നും ഫീസുണ്ട്, futures-ൽ funding-ഉം. ചെറിയ ട്രേഡുകളെയാണ് ഇത് ഏറ്റവും ബാധിക്കുക."},{"t":363.27,"d":4.467,"text":"Leverage makes the same loss a bigger share of your margin, and can lead to liquidation.","ml":"Leverage ഒരേ നഷ്ടത്തെ നിങ്ങളുടെ margin-ന്റെ വലിയ ഭാഗമാക്കും, liquidation-ലേക്കും എത്തിക്കാം."},{"t":369.97,"d":4.688,"text":"These are simple models, not predictions. Choosing no trade is always allowed.","ml":"ഇവ ലളിതമായ മോഡലുകളാണ്, പ്രവചനങ്ങളല്ല. ട്രേഡ് ചെയ്യാതിരിക്കാൻ എപ്പോഴും തീരുമാനിക്കാം."},{"t":376.406,"d":0.736,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":379.262,"d":6.358,"text":"Long or spot: exit minus entry, times quantity. Short: entry minus exit.","ml":"Long അല്ലെങ്കിൽ spot: exit-ൽ നിന്ന് entry കുറച്ച്, quantity കൊണ്ട് ഗുണിക്കുക. Short: entry-ൽ നിന്ന് exit കുറയ്ക്കുക."},{"t":388.67,"d":4.658,"text":"Unrealized results move with the price. Realized results are fixed when you close.","ml":"Unrealized ഫലം വിലയോടൊപ്പം മാറും. ക്ലോസ് ചെയ്യുമ്പോൾ realized ഫലം ഉറയ്ക്കും."},{"t":399.254,"d":3.618,"text":"Net is gross minus fees, and on futures, funding too.","ml":"Net എന്നാൽ gross-ൽ നിന്ന് ഫീസ് കുറച്ചത്. Futures-ൽ funding-ഉം കുറയ്ക്കണം."},{"t":406.646,"d":9.355,"text":"Check yourself: long 0.1 BTC from 60,000 to 60,300, with 6 USDT in total fees. What's the net?","ml":"സ്വയം പരിശോധിക്കൂ: 0.1 BTC 60,000-ൽ നിന്ന് 60,300 വരെ long, ആകെ ഫീസ് 6 USDT. Net എത്ര?"},{"t":418.742,"d":9.007,"text":"Gross is 300 × 0.1 = 30 USDT. Minus 6 in fees: net +24 USDT.","ml":"Gross: 300 × 0.1 = 30 USDT. ഫീസ് 6 കുറച്ചാൽ net +24 USDT."},{"t":428.75,"d":4.968,"text":"Next up, T07: market, limit and stop orders. See you there!","ml":"അടുത്തത് T07: market, limit, stop orders. അവിടെ കാണാം!"}]},"assetBase":"T06/assets/","assets":{"tutor-writing.webp":{"mime":"image/webp","w":191,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-candles.webp":{"mime":"image/webp","w":257,"h":160},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-celebrate.webp":{"mime":"image/webp","w":209,"h":171},"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-laptop.webp":{"mime":"image/webp","w":185,"h":170},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"xtinex-x.png":{"mime":"image/png","w":320,"h":205}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manrope\"","700 40px \"Outfit\"","600 40px \"Outfit\"","400 40px \"DM Mono\"","500 40px \"DM Mono\""],"modules":{"base.css":"#stage { --ground:#02030a; --main:#3ecbff; --second:#eef1f7; --accent:#a855f7; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }\n.ground { position:absolute; inset:0; background:radial-gradient(60% 55% at 88% 6%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), radial-gradient(55% 50% at 6% 98%, color-mix(in srgb, var(--main) 11%, transparent), transparent 70%), var(--ground) }\n.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }\n.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; text-wrap:balance }\n.sub { font-size:36px; line-height:1.45; color:color-mix(in srgb, var(--second) 72%, var(--ground)) }\n.kick { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--main) }\n.hl { color:var(--main) } .hv { color:var(--accent) }\n.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }\n.glass { position:absolute; box-sizing:border-box; border-radius:28px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 82%, var(--main)), color-mix(in srgb, var(--ground) 94%, var(--second))); border:1.5px solid color-mix(in srgb, var(--main) 22%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.45) }\n.chip { display:inline-flex; align-items:center; gap:16px; padding:18px 30px; border-radius:999px; font-size:32px; font-weight:600; background:color-mix(in srgb, var(--ground) 88%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 30%, transparent); white-space:nowrap }\n.dot { width:14px; height:14px; border-radius:50%; background:var(--main); flex:none }\n.rule { height:4px; border-radius:4px; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n","narration.json":"{\n  \"about\": \"T06 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson six: entry, exit, and profit or loss. Let's do the maths, step by step.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"Every trade has a start and an end. The question is always: how much did it make, or lose?\"\n    },\n    {\n      \"t\": 15.3,\n      \"text\": \"To answer, you need four things: entry, exit, size and fees. Let's meet them one by one.\"\n    },\n    {\n      \"t\": 22.4,\n      \"text\": \"The entry price is the price where you open a trade. The exit price is where you close it.\"\n    },\n    {\n      \"t\": 29.2,\n      \"text\": \"Think of a bus ride: where you get on, and where you get off. The distance between them matters.\"\n    },\n    {\n      \"t\": 36.4,\n      \"text\": \"Here, you enter at 60,000. The price moves, and you exit at 61,200. A move of 1,200 USDT.\"\n    },\n    {\n      \"t\": 44.4,\n      \"text\": \"Size is how much you trade. Quantity is the amount of the asset, like 0.05 BTC.\"\n    },\n    {\n      \"t\": 50.5,\n      \"text\": \"Notional value is quantity times price. It's the full value of the trade.\"\n    },\n    {\n      \"t\": 56.2,\n      \"text\": \"Like 3 kg of onions at 40 per kg: the bill is 120. Here, 0.05 × 60,000 = 3,000 USDT.\"\n    },\n    {\n      \"t\": 62.6,\n      \"text\": \"Bigger size means every price move counts for more, up or down.\"\n    },\n    {\n      \"t\": 68.4,\n      \"text\": \"Now the profit or loss formula for spot: exit minus entry, times quantity.\"\n    },\n    {\n      \"t\": 74.2,\n      \"text\": \"Buy 0.05 BTC at 60,000 and sell at 61,200: 1,200 × 0.05 = +60 USDT. That's the gross result.\"\n    },\n    {\n      \"t\": 81.2,\n      \"text\": \"Gross means before any fees. Sell at 59,400 instead, and it's −600 × 0.05 = −30 USDT.\"\n    },\n    {\n      \"t\": 89.4,\n      \"text\": \"While a trade is open, its profit or loss is unrealized. It changes with every tick.\"\n    },\n    {\n      \"t\": 95.8,\n      \"text\": \"A green number now can turn red a minute later. It isn't locked in until you close.\"\n    },\n    {\n      \"t\": 102.2,\n      \"text\": \"When you exit, it becomes realized: the result is fixed. Here, +60 USDT, before fees.\"\n    },\n    {\n      \"t\": 110.4,\n      \"text\": \"Futures next. On a USDT-margined contract, a long works the same way: exit minus entry, times size.\"\n    },\n    {\n      \"t\": 118,\n      \"text\": \"Long 0.1 BTC at 60,000, exit at 59,400: −600 × 0.1 = −60 USDT. A loss.\"\n    },\n    {\n      \"t\": 123.7,\n      \"text\": \"This is simplified: fees and funding are left out for now.\"\n    },\n    {\n      \"t\": 128.4,\n      \"text\": \"Leverage doesn't change this USDT result, but it makes it larger compared with your margin.\"\n    },\n    {\n      \"t\": 136.4,\n      \"text\": \"For a short, flip it: entry minus exit, times size.\"\n    },\n    {\n      \"t\": 140.6,\n      \"text\": \"Short 0.1 BTC at 60,000, exit at 59,400: 600 × 0.1 = +60 USDT. The fall was your gain.\"\n    },\n    {\n      \"t\": 147.3,\n      \"text\": \"But exit at 60,800, and it's −800 × 0.1 = −80 USDT. A short loses when the price rises.\"\n    },\n    {\n      \"t\": 155.4,\n      \"text\": \"Now fees. Say you go long 0.1 BTC from 60,000 to 60,600. Gross: +60 USDT.\"\n    },\n    {\n      \"t\": 161.2,\n      \"text\": \"Exchanges charge a fee on entry and again on exit: notional value times the fee rate.\"\n    },\n    {\n      \"t\": 167.8,\n      \"text\": \"We'll use 0.05%, a made-up rate. Entry fee: 6,000 × 0.05% = 3.00 USDT.\"\n    },\n    {\n      \"t\": 173.4,\n      \"text\": \"Exit fee: 6,060 × 0.05% = 3.03 USDT. Net: 60 − 3.00 − 3.03 = +53.97 USDT.\"\n    },\n    {\n      \"t\": 179.2,\n      \"text\": \"Net is what you actually keep. Always check real fee rates before trading.\"\n    },\n    {\n      \"t\": 185.4,\n      \"text\": \"A common mistake: counting the gross result and forgetting fees.\"\n    },\n    {\n      \"t\": 190.5,\n      \"text\": \"Long 0.1 BTC from 60,000 to 60,040. Gross: +4 USDT. Looks like a win.\"\n    },\n    {\n      \"t\": 196,\n      \"text\": \"But fees are 3.00 on entry and about 3.00 on exit. Net: about −2 USDT. A gross win, a net loss.\"\n    },\n    {\n      \"t\": 203.2,\n      \"text\": \"And remember: an open, unrealized profit isn't yours until you close.\"\n    },\n    {\n      \"t\": 209.4,\n      \"text\": \"Your turn. Short 0.02 BTC at 60,000, closed at 61,000. What's the gross result? Pause if needed.\"\n    },\n    {\n      \"t\": 217.2,\n      \"text\": \"Gross: −20 USDT. Entry minus exit is −1,000, times 0.02.\"\n    },\n    {\n      \"t\": 221.8,\n      \"text\": \"With 0.05% fees, 0.60 on entry and 0.61 on exit, the net is −21.21 USDT.\"\n    },\n    {\n      \"t\": 228.3,\n      \"text\": \"Before you go on, the risks.\"\n    },\n    {\n      \"t\": 231,\n      \"text\": \"Prices can jump past the exit you planned, so your real exit can be worse.\"\n    },\n    {\n      \"t\": 236.8,\n      \"text\": \"Fees hit every entry and exit, and futures add funding. Small trades feel it most.\"\n    },\n    {\n      \"t\": 243.2,\n      \"text\": \"Leverage makes the same loss a bigger share of your margin, and can lead to liquidation.\"\n    },\n    {\n      \"t\": 249.9,\n      \"text\": \"These are simple models, not predictions. Choosing no trade is always allowed.\"\n    },\n    {\n      \"t\": 256.2,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 257.9,\n      \"text\": \"Long or spot: exit minus entry, times quantity. Short: entry minus exit.\"\n    },\n    {\n      \"t\": 263.5,\n      \"text\": \"Unrealized results move with the price. Realized results are fixed when you close.\"\n    },\n    {\n      \"t\": 269.8,\n      \"text\": \"Net is gross minus fees, and on futures, funding too.\"\n    },\n    {\n      \"t\": 274.2,\n      \"text\": \"Check yourself: long 0.1 BTC from 60,000 to 60,300, with 6 USDT in total fees. What's the net?\"\n    },\n    {\n      \"t\": 281.4,\n      \"text\": \"Gross is 300 × 0.1 = 30 USDT. Minus 6 in fees: net +24 USDT.\"\n    },\n    {\n      \"t\": 287.6,\n      \"text\": \"Next up, T07: market, limit and stop orders. See you there!\"\n    }\n  ]\n}\n","scene-entryexit.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst EE_IN = 14.6, EE_OUT = 19.4;\nkit.scene('entryexit', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:190px;width:760px\"><p class n srgb, var(--second) 30%, transparent);stroke-width:2\"/>';\n    cols.forEach((c, i) => {\n      svg += '<rect class=\"fe-bar\" x=\"' + FE_X[i] + '\" width=\"' + FE_W + '\" rx=\"6\" style=\"fill:' + c[1] + '\"/>' +\n        '<text class=\"fe-val mono\" x=\"' + (FE_X[i] + FE_W / 2) + '\" text-anchor=\"middle\" style=\"fill:' + c[1] + ';font-size:26px\"></text>' +\n        '<text class=\"fe-lab\" x=\"' + (FE_X[i] + FE_W / 2) + '\" y=\"' + (FE_B + 36) + '\" text-anchor=\"middle\" style=\"fill:color-mix(in srgb, var(--second) 75%, var(--ground));font-size:24px;font-weight:600\">' + c[0] + '</text>';\n    });\n    svg += '<path class=\"fe-link\" d=\"M' + (FE_X[0] + FE_W) + ' ' + FE_Y(60) + ' H' + FE_X[1] + ' M' + (FE_X[1] + FE_W) + ' ' + FE_Y(57) + ' H' + FE_X[2] + ' M' + (FE_X[2] + FE_W) + ' ' + FE_Y(53.97) + ' H' + FE_X[3] + '\" stroke-dasharray=\"6 6\" style=\"stroke:color-mix(in srgb, var(--second) 40%, transparent);stroke-width:2;fill:none\"/>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:820px\"><p class=\"kick fe-k\">Gross and net</p>' +\n      '<h2 class=\"line fe-t\">Fees come off</h2>' +\n      '<p class=\"sub fe-s\">Long 0.1 BTC, 60,000 → 60,600. Gross: <span class=\"hl\">+60 USDT</span>.</p></div>' +\n      '<div class=\"glass fe-d\" style=\"left:140px;top:450px;width:820px;padding:20px 30px\"><p style=\"margin:0;font-size:30px;line-height:1.4;font-weight:600\"><b class=\"hl\">Fee</b> = notional value × fee rate. Charged on entry, and again on exit.</p></div>' +\n      '<div class=\"glass fe-c\" style=\"left:140px;top:596px;width:820px;padding:16px 30px\"><p class=\"kick\" style=\"margin:0 0 6px\">Example rate 0.05% per side · made up</p>' +\n      '<p class=\"mono fe-l1\" style=\"margin:0;font-size:28px;line-height:1.4;white-space:pre\">Entry: 6,000 × 0.05% = 3.00</p>' +\n      '<p class=\"mono fe-l2\" style=\"margin:0;font-size:28px;line-height:1.4;white-space:pre\">Exit:  6,060 × 0
