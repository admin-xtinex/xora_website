<script>window.FILM = {"id":"T26","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson twenty-six","dur":8,"k":1,"oldStart":0,"oldDur":8},{"id":"hook","name":"Three answers","dur":16,"k":1,"oldStart":8,"oldDur":16},{"id":"outcomes","name":"BUY, SHORT or wait","dur":25,"k":1,"oldStart":24,"oldDur":25},{"id":"checks","name":"Rules, not guesses","dur":20,"k":1,"oldStart":49,"oldDur":20},{"id":"confidence","name":"What confidence means","dur":22,"k":1,"oldStart":69,"oldDur":22},{"id":"checklist","name":"The entry checklist","dur":49.72,"k":2.26,"oldStart":91,"oldDur":22},{"id":"mistake","name":"Not a chance of winning","dur":19,"k":1,"oldStart":113,"oldDur":19},{"id":"gates","name":"Safety checks","dur":29.21,"k":1.27,"oldStart":132,"oldDur":23},{"id":"notrade","name":"Uncertainty and NO TRADE","dur":19,"k":1,"oldStart":155,"oldDur":19},{"id":"setting","name":"Your confidence setting","dur":30,"k":1,"oldStart":174,"oldDur":30},{"id":"approval","name":"Approve, auto or manual","dur":27.04,"k":1.04,"oldStart":204,"oldDur":26},{"id":"try","name":"Try it","dur":29.48,"k":1.34,"oldStart":230,"oldDur":22},{"id":"risks","name":"Know the limits","dur":22,"k":1,"oldStart":252,"oldDur":22},{"id":"recap","name":"Recap","dur":22,"k":1,"oldStart":274,"oldDur":22},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":296,"oldDur":10}],"voice":{"src":"T26/voice.mp3","lines":[{"t":0.6,"d":5.613,"text":"Lesson twenty-six: understanding AI decisions. Phase 6, XORA Intelligence.","ml":"പാഠം ഇരുപത്തിയാറ്: AI തീരുമാനങ്ങൾ മനസ്സിലാക്കാം. Phase 6, XORA Intelligence."},{"t":8.4,"d":6.154,"text":"In T25 you saw how XORA analyses a coin. Now: what does it decide, and why?","ml":"T25-ൽ XORA ഒരു കോയിൻ വിശകലനം ചെയ്യുന്നത് കണ്ടു. ഇനി: അത് എന്ത് തീരുമാനിക്കുന്നു, എന്തിന്?"},{"t":15.104,"d":4.908,"text":"For each coin, XORA's engine gives one of three answers. It's not a prediction.","ml":"ഓരോ കോയിനും XORA engine മൂന്നിൽ ഒരു ഉത്തരം തരും. ഇതൊരു പ്രവചനമല്ല."},{"t":20.6,"d":2.268,"text":"It is the result of rule-based checks.","ml":"നിയമങ്ങൾ അടിസ്ഥാനമാക്കിയ പരിശോധനകളുടെ ഫലമാണ് അത്."},{"t":24.4,"d":5.031,"text":"Answer one: BUY, also called long. You gain if the price rises after you enter.","ml":"ഒന്നാം ഉത്തരം: buy, അഥവാ long. നിങ്ങൾ കയറിയ ശേഷം വില കൂടിയാൽ ലാഭം."},{"t":30.6,"d":5.635,"text":"Answer two: SELL, also called SHORT. You gain if the price falls after you enter.","ml":"രണ്ടാം ഉത്തരം: sell, അഥവാ short. നിങ്ങൾ കയറിയ ശേഷം വില കുറഞ്ഞാൽ ലാഭം."},{"t":36.9,"d":5.424,"text":"Answer three: NO TRADE. You stand aside and wait. No setup right now.","ml":"മൂന്നാം ഉത്തരം: NO_TRADE. മാറിനിന്ന് wait ചെയ്യുക. ഇപ്പോൾ setup ഇല്ല."},{"t":42.874,"d":4.648,"text":"A plan is for one candle only: BUY if price trades above 60,120, for example.","ml":"ഒരു plan ഒരു candle-ന് മാത്രം: ഉദാ: വില 60,120-ന് മുകളിൽ പോയാൽ buy."},{"t":49.4,"d":6.357,"text":"How does XORA choose? With checks: yes-or-no tests written as rules in code.","ml":"XORA എങ്ങനെ തീരുമാനിക്കും? Code-ൽ നിയമമായി എഴുതിയ അതെ/അല്ല പരിശോധനകൾ വഴി."},{"t":56.307,"d":5.307,"text":"Like a pilot's checklist before take-off. Each item is ticked, or it isn't.","ml":"പറക്കും മുൻപ് പൈലറ്റ് നോക്കുന്ന checklist പോലെ. ഓരോന്നിനും ടിക്ക്, അല്ലെങ്കിൽ ഇല്ല."},{"t":62.164,"d":4.706,"text":"The filters use common techniques: trend, support and resistance, volume, momentum and more.","ml":"Filter-കൾ സാധാരണ രീതികൾ ഉപയോഗിക്കുന്നു: trend, support, resistance, volume, momentum..."},{"t":69.4,"d":5.937,"text":"Confidence is a score for how much evidence agrees with a setup.","ml":"ഒരു setup-നോട് എത്ര തെളിവുകൾ യോജിക്കുന്നു എന്നതിന്റെ സ്കോർ ആണ് confidence."},{"t":75.887,"d":3.281,"text":"Think of witnesses. One witness is weak. Several who agree, independently, are stronger.","ml":"സാക്ഷികളെ ഓർക്കുക. ഒരാൾ ദുർബലം. സ്വതന്ത്രമായി യോജിക്കുന്ന പലർ ശക്തം."},{"t":81.4,"d":4.942,"text":"Each confirmation that agrees raises the score. A check that disagrees, or has no data, adds nothing.","ml":"യോജിക്കുന്ന ഓരോ സ്ഥിരീകരണവും സ്കോർ കൂട്ടും. വിയോജിപ്പോ ഡാറ്റ ഇല്ലായ്മയോ ഒന്നും ചേർക്കില്ല."},{"t":91.904,"d":5.919,"text":"In the app, this is the ENTRY CHECKLIST. Each check shows a tick or a cross.","ml":"ആപ്പിൽ ഇതാണ് ENTRY CHECKLIST. ഓരോ പരിശോധനയ്ക്കും ടിക്ക് അല്ലെങ്കിൽ ക്രോസ്."},{"t":105.464,"d":4.644,"text":"BUY shows 72% / 60%: a score of 72, against your minimum of 60. It meets it, so it's READY.","ml":"BUY 72% / 60%: സ്കോർ 72, നിങ്ങളുടെ മിനിമം 60. മിനിമം എത്തി, അതിനാൽ READY."},{"t":121.284,"d":8.522,"text":"SELL shows 55% / 60%. Below your minimum, so no READY badge, and no sell.","ml":"SELL 55% / 60%. മിനിമത്തിന് താഴെ: READY ഇല്ല, sell-ഉം ഇല്ല."},{"t":134.392,"d":5.905,"text":"Fictional numbers, of course.","ml":"തീർച്ചയായും, ഇവ സാങ്കൽപ്പിക സംഖ്യകളാണ്."},{"t":141.12,"d":1.576,"text":"A common mistake: reading 72% as a 72% chance of winning.","ml":"സാധാരണ തെറ്റ്: 72% എന്നാൽ ജയിക്കാൻ 72% സാധ്യത എന്ന് കരുതുന്നത്."},{"t":145.82,"d":4.978,"text":"That's wrong. The app itself says: confidence is evidence strength, not a chance of winning.","ml":"അത് തെറ്റ്. ആപ്പ് തന്നെ പറയുന്നു: confidence തെളിവിന്റെ ശക്തിയാണ്, ജയസാധ്യതയല്ല."},{"t":152.82,"d":5.179,"text":"A READY trade can still lose. Every trade needs a stop and a size you can afford.","ml":"READY ട്രേഡും നഷ്ടത്തിലാകാം. എപ്പോഴും stop-loss-ഉം താങ്ങാവുന്ന size-ഉം വേണം."},{"t":160.228,"d":4.765,"text":"Even a READY setup must pass safety checks. Any one of them can block the trade.","ml":"READY setup-ഉം സുരക്ഷാ പരിശോധനകൾ കടക്കണം. ഏതെങ്കിലും ഒന്ന് ട്രേഡ് തടയാം."},{"t":168.102,"d":4.272,"text":"Is the spread too wide? Is the market too thin? Is the data stale, or the plan expired?","ml":"Spread വലുതാണോ? മാർക്കറ്റ് നേർത്തതാണോ? ഡാറ്റ പഴയതാണോ, plan തീർന്നോ?"},{"t":176.611,"d":5.471,"text":"Is the stop too tight or too wide? Is there too little room to the next level?","ml":"Stop വളരെ അടുത്തോ ദൂരെയോ? അടുത്ത level-ലേക്ക് ഇടം കുറവാണോ?"},{"t":184.358,"d":4.149,"text":"If any check fails: no trade.","ml":"ഏതെങ്കിലും പരിശോധന പരാജയപ്പെട്ടാൽ: ട്രേഡ് ഇല്ല."},{"t":189.33,"d":2.123,"text":"Markets are often unclear. Price chops sideways, and the checks disagree.","ml":"മാർക്കറ്റ് പലപ്പോഴും വ്യക്തമല്ല. വില വശത്തേക്ക് ആടുന്നു, പരിശോധനകൾ വിയോജിക്കുന്നു."},{"t":195.13,"d":4.555,"text":"Then XORA shows No trade, with its reasons, and keeps watching. That's a good outcome.","ml":"അപ്പോൾ XORA കാരണങ്ങളോടെ No trade കാണിച്ച് നിരീക്ഷിക്കും. അതൊരു നല്ല ഫലമാണ്."},{"t":201.73,"d":5.032,"text":"No trade means no loss. Waiting is a decision, and often the wise one.","ml":"ട്രേഡ് ഇല്ലെങ്കിൽ നഷ്ടമില്ല. Wait ചെയ്യുന്നതും ഒരു തീരുമാനമാണ്, പലപ്പോഴും ബുദ്ധിപരവും."},{"t":208.33,"d":4.761,"text":"In Trade Settings you choose a confidence threshold: Enter only at or above. Default: 50%.","ml":"Trade Settings-ൽ confidence threshold തിരഞ്ഞെടുക്കാം: Enter only at or above. Default 50%."},{"t":215.23,"d":5.955,"text":"From 50% up, XORA uses several indicators for confirmation. Higher means more must agree.","ml":"50% മുതൽ XORA സ്ഥിരീകരണത്തിന് പല indicator-കൾ നോക്കും. കൂട്ടിയാൽ കൂടുതൽ യോജിക്കണം."},{"t":222.03,"d":6.047,"text":"45% is special. It's not 45% confidence: XORA then looks for chart-pattern setups instead.","ml":"45% പ്രത്യേകമാണ്, 45% confidence അല്ല: അപ്പോൾ XORA chart-pattern setup-കൾ തേടും."},{"t":228.93,"d":7.045,"text":"Entry modes change the filters: Basic looks for chances, Secure wants more confirmation, Advanced adds more.","ml":"Entry mode-കൾ filter മാറ്റും: Basic അവസരം തേടും, Secure കൂടുതൽ ഉറപ്പ്, Advanced കൂടുതൽ filter."},{"t":238.346,"d":7.144,"text":"Auto trade approval is off by default. A triggered setup waits for you to tap Approve.","ml":"Auto trade approval default off ആണ്. Setup നിങ്ങളുടെ Approve-നായി കാത്തിരിക്കും."},{"t":246.04,"d":4.904,"text":"Approve before its one-minute candle ends, or it expires.","ml":"അതിന്റെ ഒരു മിനിറ്റ് candle തീരും മുൻപ് approve ചെയ്യൂ, ഇല്ലെങ്കിൽ അത് expire ആകും."},{"t":251.494,"d":3.437,"text":"With auto approval on, the engine enters by itself, within your settings.","ml":"Auto approval on ആണെങ്കിൽ, settings-നുള്ളിൽ engine സ്വയം ട്രേഡിൽ കയറും."},{"t":256.13,"d":4.178,"text":"Your own BUY or SHORT tap is always your call. The sheet says if the engine agrees.","ml":"നിങ്ങളുടെ സ്വന്തം buy/short എപ്പോഴും നിങ്ങളുടെ തീരുമാനം. Engine യോജിക്കുന്നോ എന്ന് sheet പറയും."},{"t":265.506,"d":5.221,"text":"Your turn. Read the checklist and choose an answer. Pause if you need more time.","ml":"നിങ്ങളുടെ ഊഴം. Checklist വായിച്ച് ഉത്തരം തിരഞ്ഞെടുക്കൂ. വേണമെങ്കിൽ pause ചെയ്യൂ."},{"t":281.05,"d":4.538,"text":"Answer B. 68 is below your minimum of 70, so no READY, and no trade.","ml":"ഉത്തരം B. 68 മിനിമം 70-ന് താഴെ: READY ഇല്ല, ട്രേഡും ഇല്ല."},{"t":288.286,"d":5.751,"text":"And C is wrong: confidence is not a chance of winning.","ml":"C-യും തെറ്റാണ്: confidence ജയിക്കാനുള്ള സാധ്യതയല്ല."},{"t":294.85,"d":3.119,"text":"Before you trust any decision, know its limits.","ml":"ഏത് തീരുമാനത്തെയും വിശ്വസിക്കും മുൻപ് അതിന്റെ പരിധികൾ അറിയുക."},{"t":298.85,"d":2.707,"text":"XORA does not guarantee profits. Rules can be wrong, and losing trades happen.","ml":"XORA ലാഭം ഉറപ്പ് നൽകുന്നില്ല. നിയമങ്ങൾ തെറ്റാം, നഷ്ടമുള്ള ട്രേഡുകൾ സംഭവിക്കും."},{"t":304.95,"d":4.776,"text":"Prices can jump past a stop, fees add up, and leverage makes losses bigger.","ml":"വില stop കടന്ന് ചാടാം, ഫീസ് കൂടിവരും, leverage നഷ്ടം വലുതാക്കും."},{"t":310.85,"d":4.672,"text":"So practise in DEMO first. This is education, not financial advice.","ml":"അതിനാൽ ആദ്യം DEMO-യിൽ പരിശീലിക്കൂ. ഇത് പഠനമാണ്, സാമ്പത്തിക ഉപദേശമല്ല."},{"t":316.85,"d":4.441,"text":"Recap. XORA gives three answers: BUY, SELL or SHORT, or NO TRADE, from rule-based checks.","ml":"ചുരുക്കം: XORA-യുടെ മൂന്ന് ഉത്തരം: buy, sell/short, NO_TRADE. നിയമ പരിശോധനകളിൽ നിന്ന്."},{"t":323.65,"d":6.259,"text":"Confidence is evidence strength, checked against your minimum. Safety checks can still say no.","ml":"Confidence തെളിവിന്റെ ശക്തി, നിങ്ങളുടെ മിനിമവുമായി താരതമ്യം. സുരക്ഷാ പരിശോധന തടയാം."},{"t":330.85,"d":5.64,"text":"Check yourself: 80% / 60%, but the spread is too wide. Trade? No, the safety check blocks it.","ml":"സ്വയം നോക്കൂ: 80% / 60%, പക്ഷേ spread വലുത്. ട്രേഡ്? ഇല്ല, സുരക്ഷാ പരിശോധന തടയും."},{"t":339.05,"d":7.193,"text":"Next: T27, reading XORA trading insights. XORA does not guarantee profits. Demo first. Not financial advice.","ml":"അടുത്തത് T27: XORA trading insights. XORA ലാഭം ഉറപ്പ് നൽകുന്നില്ല. ആദ്യം Demo. സാമ്പത്തിക ഉപദേശമല്ല."}]},"assetBase":"T26/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime":"image/webp","w":546,"h":612},"tutor-read.webp":{"mime":"image/webp","w":190,"h":181},"tutor-think.webp":{"mime":"image/webp","w":465,"h":656},"tutor-thumbs.webp":{"mime":"image/webp","w":181,"h":179},"tutor-wk0.webp":{"mime":"image/webp","w":353,"h":460},"tutor-wk1.webp":{"mime":"image/webp","w":361,"h":460},"tutor-wk2.webp":{"mime":"image/webp","w":345,"h":460},"tutor-wk3.webp":{"mime":"image/webp","w":365,"h":460},"tutor-wk4.webp":{"mime":"image/webp","w":375,"h":457},"tutor-wk5.webp":{"mime":"image/webp","w":364,"h":457},"tutor-wk6.webp":{"mime":"image/webp","w":354,"h":457},"tutor-wk7.webp":{"mime":"image/webp","w":365,"h":457},"tutor-wv1.webp":{"mime":"image/webp","w":381,"h":448},"tutor-wv2.webp":{"mime":"image/webp","w":374,"h":448},"tutor-wv3.webp":{"mime":"image/webp","w":363,"h":448},"tutor-wv4.webp":{"mime":"image/webp","w":375,"h":446},"xtinex-x.png":{"mime":"image/png","w":320,"h":205},"tutor-calm.webp":{"mime":"image/webp","w":234,"h":174},"tutor-laptop.webp":{"mime":"image/webp","w":185,"h":170},"tutor-pointer.webp":{"mime":"image/webp","w":248,"h":171}},"fontChecks":["600 40px \"Noto Sans Malayalam\"","400 40px \"Manr t)) }\n.mono { font-family:var(--mono, ui-monospace, monospace); font-variant-numeric:tabular-nums }\n.fict { font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 45%, var(--ground)) }\n.def { font-size:34px; line-height:1.45; font-weight:600 } .def b { color:var(--main); font-weight:700 }\n.lock { display:flex; align-items:center; gap:22px } .lock img { width:92px; height:59px; display:block }\n.lock-xt { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:600; font-size:40px; letter-spacing:.2em }\n.lock-bar { width:2px; height:46px; background:color-mix(in srgb, var(--second) 30%, transparent) }\n.lock-xo { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* Phase 6: app colours (green buy, red sell), phone mock-ups of the XORA app */\n#stage { --up:#2fd897; --down:#ff5c7c; --warn:#ffb547 }\n.up { color:var(--up) } .dn { color:var(--down) }\n.phone { position:absolute; box-sizing:border-box; border-radius:54px; padding:30px 26px 22px; background:linear-gradient(180deg, color-mix(in srgb, var(--ground) 86%, var(--main)), color-mix(in srgb, var(--ground) 95%, var(--second))); border:2px solid color-mix(in srgb, var(--main) 28%, transparent); box-shadow:0 30px 80px rgba(0,0,0,.5); overflow:hidden }\n.phone-notch { width:110px; height:8px; border-radius:8px; margin:0 auto 18px; background:color-mix(in srgb, var(--second) 18%, transparent) }\n.phone-top { display:flex; align-items:center; justify-content:space-between; margin:0 6px 14px }\n.phone-top b { font-family:var(--display, var(--sans)); font-size:30px; letter-spacing:.06em }\n.pill { display:inline-flex; align-items:center; gap:8px; padding:6px 16px; border-radius:999px; font-family:var(--mono, ui-monospace, monospace); font-size:22px; font-weight:600; border:1.5px solid currentColor; white-space:nowrap }\n.card { box-sizing:border-box; border-radius:22px; padding:16px 20px; background:color-mix(in srgb, var(--ground) 80%, var(--second)); border:1.5px solid color-mix(in srgb, var(--second) 12%, transparent) }\n.card-h { margin:0 0 10px; font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.14em; color:color-mix(in srgb, var(--second) 62%, var(--ground)) }\n.lbl { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.06em; color:color-mix(in srgb, var(--second) 58%, var(--ground)) }\n.mock { position:absolute; margin:0; font-family:var(--mono, ui-monospace, monospace); font-size:18px; letter-spacing:.12em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 50%, var(--ground)); white-space:nowrap }\n.risk-line { font-family:var(--mono, ui-monospace, monospace); font-size:22px; letter-spacing:.08em; color:var(--warn) }\n","narration.json":"{\n  \"about\": \"T26 on-screen captions (no voice track yet). Each line appears at film time t (seconds); can be recorded as voiceover later.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson twenty-six: understanding AI decisions. Phase 6, XORA Intelligence.\"\n    },\n    {\n      \"t\": 8.4,\n      \"text\": \"In T25 you saw how XORA analyses a coin. Now: what does it decide, and why?\"\n    },\n    {\n      \"t\": 14.4,\n      \"text\": \"For each coin, XORA's engine gives one of three answers. It's not a prediction.\"\n    },\n    {\n      \"t\": 20.6,\n      \"text\": \"It is the result of rule-based checks.\"\n    },\n    {\n      \"t\": 24.4,\n      \"text\": \"Answer one: BUY, also called long. You gain if the price rises after you enter.\"\n    },\n    {\n      \"t\": 30.6,\n      \"text\": \"Answer two: SELL, also called SHORT. You gain if the price falls after you enter.\"\n    },\n    {\n      \"t\": 36.9,\n      \"text\": \"Answer three: NO TRADE. You stand aside and wait. No setup right now.\"\n    },\n    {\n      \"t\": 42.4,\n      \"text\": \"A plan is for one candle only: BUY if price trades above 60,120, for example.\"\n    },\n    {\n      \"t\": 49.4,\n      \"text\": \"How does XORA choose? With checks: yes-or-no tests written as rules in code.\"\n    },\n    {\n      \"t\": 55.4,\n      \"text\": \"Like a pilot's checklist before take-off. Each item is ticked, or it isn't.\"\n    },\n    {\n      \"t\": 61.3,\n      \"text\": \"The filters use common techniques: trend, support and resistance, volume, momentum and more.\"\n    },\n    {\n      \"t\": 69.4,\n      \"text\": \"Confidence is a score for how much evidence agrees with a setup.\"\n    },\n    {\n      \"t\": 74.6,\n      \"text\": \"Think of witnesses. One witness is weak. Several who agree, independently, are stronger.\"\n    },\n    {\n      \"t\": 81.4,\n      \"text\": \"Each confirmation that agrees raises the score. A check that disagrees, or has no data, adds nothing.\"\n    },\n    {\n      \"t\": 91.4,\n      \"text\": \"In the app, this is the ENTRY CHECKLIST. Each check shows a tick or a cross.\"\n    },\n    {\n      \"t\": 97.4,\n      \"text\": \"BUY shows 72% / 60%: a score of 72, against your minimum of 60. It meets it, so it's READY.\"\n    },\n    {\n      \"t\": 104.4,\n      \"text\": \"SELL shows 55% / 60%. Below your minimum, so no READY badge, and no sell.\"\n    },\n    {\n      \"t\": 110.2,\n      \"text\": \"Fictional numbers, of course.\"\n    },\n    {\n      \"t\": 113.4,\n      \"text\": \"A common mistake: reading 72% as a 72% chance of winning.\"\n    },\n    {\n      \"t\": 118.1,\n      \"text\": \"That's wrong. The app itself says: confidence is evidence strength, not a chance of winning.\"\n    },\n    {\n      \"t\": 125.1,\n      \"text\": \"A READY trade can still lose. Every trade needs a stop and a size you can afford.\"\n    },\n    {\n      \"t\": 132.4,\n      \"text\": \"Even a READY setup must pass safety checks. Any one of them can block the trade.\"\n    },\n    {\n      \"t\": 138.6,\n      \"text\": \"Is the spread too wide? Is the market too thin? Is the data stale, or the plan expired?\"\n    },\n    {\n      \"t\": 145.3,\n      \"text\": \"Is the stop too tight or too wide? Is there too little room to the next level?\"\n    },\n    {\n      \"t\": 151.4,\n      \"text\": \"If any check fails: no trade.\"\n    },\n    {\n      \"t\": 155.4,\n      \"text\": \"Markets are often unclear. Price chops sideways, and the checks disagree.\"\n    },\n    {\n      \"t\": 161.2,\n      \"text\": \"Then XORA shows No trade, with its reasons, and keeps watching. That's a good outcome.\"\n    },\n    {\n      \"t\": 167.8,\n      \"text\": \"No trade means no loss. Waiting is a decision, and often the wise one.\"\n    },\n    {\n      \"t\": 174.4,\n      \"text\": \"In Trade Settings you choose a confidence threshold: Enter only at or above. Default: 50%.\"\n    },\n    {\n      \"t\": 181.3,\n      \"text\": \"From 50% up, XORA uses several indicators for confirmation. Higher means more must agree.\"\n    },\n    {\n      \"t\": 188.1,\n      \"text\": \"45% is special. It's not 45% confidence: XORA then looks for chart-pattern setups instead.\"\n    },\n    {\n      \"t\": 195.0,\n      \"text\": \"Entry modes change the filters: Basic looks for chances, Secure wants more confirmation, Advanced adds more.\"\n    },\n    {\n      \"t\": 204.4,\n      \"text\": \"Auto trade approval is off by default. A triggered setup waits for you to tap Approve.\"\n    },\n    {\n      \"t\": 211.0,\n      \"text\": \"Approve before its one-minute candle ends, or it expires.\"\n    },\n    {\n      \"t\": 215.7,\n      \"text\": \"With auto approval on, the engine enters by itself, within your settings.\"\n    },\n    {\n      \"t\": 221.5,\n      \"text\": \"Your own BUY or SHORT tap is always your call. The sheet says if the engine agrees.\"\n    },\n    {\n      \"t\": 230.4,\n      \"text\": \"Your turn. Read the checklist and choose an answer. Pause if you need more time.\"\n    },\n    {\n      \"t\": 242.0,\n      \"text\": \"Answer B. 68 is below your minimum of 70, so no READY, and no trade.\"\n    },\n    {\n      \"t\": 247.4,\n      \"text\": \"And C is wrong: confidence is not a chance of winning.\"\n    },\n    {\n      \"t\": 252.4,\n      \"text\": \"Before you trust any decision, know its limits.\"\n    },\n    {\n      \"t\": 256.4,\n      \"text\": \"XORA does not guarantee profits. Rules can be wrong, and losing trades happen.\"\n    },\n    {\n      \"t\": 262.5,\n      \"text\": \"Prices can jump past a stop, fees add up, and leverage makes losses bigger.\"\n    },\n    {\n      \"t\": 268.4,\n      \"text\": \"So practise in DEMO first. This is education, not financial advice.\"\n    },\n    {\n      \"t\": 274.4,\n      \"text\": \"Recap. XORA gives three answers: BUY, SELL or SHORT, or NO TRADE, from rule-based checks.\"\n    },\n    {\n      \"t\": 281.2,\n      \"text\": \"Confidence is evidence strength, checked against your minimum. Safety checks can still say no.\"\n    },\n    {\n      \"t\": 288.4,\n      \"text\": \"Check yourself: 80% / 60%, but the spread is too wide. Trade? No, the safety check blocks it.\"\n    },\n    {\n      \"t\": 296.6,\n      \"text\": \"Next: T27, reading XORA trading insights. XORA does not guarantee profits. Demo first. Not financial advice.\"\n    }\n  ]\n}","scene-approval.js":"const { seg, eo, ei, eob, eio, lerp, clamp01, TextFx } = kit;\n// Three ways a trade can start: you tap Approve (or it expires), auto approval, or your own manual BUY / SHORT.\nconst AP_MSG = [\n  ['✓', 'var(--up)', 'The engine agrees — a setup in this direction is live now.'],\n  ['⇅', 'var(--warn)', 'The engine sees a sell setup here, not a buy.'],\n  ['i', 'var(--main)', 'The engine has no setup on this coin right now — this one is your call.'],\n];\nkit.scene('approval', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const met = (a, b, col) => '<div style=\"flex:1\"><p class=\"lbl\" style=\"margin:0\">' + a + '</p><p class=\"mono\" style=\"margin:4px 0 0;font-size:28px;' + (col ? 'color:' + col : '') + '\">' + b + '</p></div>';\n    const opp = '<div class=\"card ap-o\" style=\"position:absolute;left:26px;right:26px;top:110px\"><p class=\"card-h\">TRADE OPPORTUNITY</p>' +\n      '<div style=\"display:flex;align-items:center;gap:14px\"><span class=\"pill\" style=\"color:var(--up)\">BUY</span><div><p style=\"margin:0;font-size:26px;font-weight:700\">Support reclaim</p><p class=\"lbl\" style=\"margin:2px 0 0\">Waiting for your approval</p></div></div>' +\n      '<div style=\"display:flex;gap:10px;margin:16px 0\">' + met('ENTRY', '60,000') + met('STOP', '59,700', 'var(--down)') + '</div>' +\n      '<div class=\"ap-b mono\" style=\"height:66px;border-radius:16px;display:grid;place-items:center;font-size:25px;font-weight:600;border:2px solid var(--up);color:var(--up);background:color-mix(in srgb, var(--up) 14%, transparent)\"></div></div>';\n    const auto = '<div class=\"card ap-a\" style=\"position:absolute;left:26px;right:26px;top:110px\"><p class=\"card-h\">TRADE SETTINGS</p>' +\n      '<div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-size:26px;font-weight:600\">Auto trade approval</span>' +\n      '<span class=\"ap-tg\" style=\"position:relative;width:84px;height:46px;border-radius:23px;flex:none\"><span class=\"ap-tk\" style=\"position:absolute;top:5px;width:36px;height:36px;border-radius:50%;background:var(--second)\"></span></span></div>' +\n      '<p class=\"ap-at\" style=\"margin:16px 0 0;font-size:24px;line-height:1.4\"></p></div>';\n    let msgs = '';\n    AP_MSG.forEach((m) => {\n      msgs += '<div class=\"ap-m\" style=\"display:flex;gap:14px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:16px;border:1.5px solid color-mix(in srgb, ' + m[1] + ' 45%, transparent)\">' +\n        '<span class=\"mono\" style=\"flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--ground);background:' + m[1] + '\">' + m[0] + '</span>' +\n        '<span style=\"font-size:23px;line-height:1.35\">' + m[2] + '</span></div>';\n    });\n    const sheet = '<div class=\"card ap-s\" style=\"position:absolute;left:26px;right:26px;top:110px\"><p class=\"card-h\">BUY / LONG · YOUR ORDER</p>' +\n      '<p style=\"margin:0;font-size:24px;line-height:1.35\">Market order with an automatic stop.</p>' + msgs + '</div>';\n    this.ph = UI.phone(kit, { left: 1120, top: 140, w: 580, h: 630, title: 'BTC/USDT', body: opp + auto + sheet }).style;\n    this.ml = UI.mockLabel(kit, 1120, 100).style;\n    const step = (cls, n, a, b) => '<div class=\"ap-st ' + cls + '\" style=\"display:flex;gap:22px;align-items:flex-start\"><span class=\"mono\" style=\"flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:28px;border:2px solid var(--main);color:var(--main)\">' + n + '</span>' +\n      '<div><p style=\"margin:0;font-size:32px;font-weight:700\">' + a + '</p><p style=\"margin:4px 0 0;font-size:28px;line-height:1.4;color:color-mix(in srgb, var(--second) 72%, var(--ground))\">' + b + '</p></div></div>';\n    kit.stage.append(kit.h('<div>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:900px\"><p class=\"kick ap-k\">Who presses the button?</p>' +\n      '<h2 class=\"line ap-t\" style=\"font-size:72px\">Approve, auto, or manual</h2>' +\n      '<div style=\"display:flex;flex-direction:column;gap:30px;margin-top:20px\">' +\n      step('', '1', 'Approval (default)', 'Tap Approve before the 1-minute candle ends, or the setup expires.') +\n      step('', '2', 'Auto approval on', 'The engine enters by itself, within your settings.') +\n      step('', '3', 'Your own BUY / SHORT', 'Always your call. The sheet says if the engine agrees.') + '</div></div>' +\n      '<div class=\"ap-tap\" style=\"position:absolute;width:70px;height:70px;border-radius:50%;border:4px solid var(--second);box-sizing:border-box\"></div></div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.ap-k').style; this.t = q('.ap-t'); this.steps = all('.ap-st').map((e) => e.style);\n    this.o = q('.ap-o').style; this.a = q('.ap-a').style; this.s = q('.ap-s').style; this.b = q('.ap-b');\n    this.tg = q('.ap-tg').style; this.tk = q('.ap-tk').style; this.at = q('.ap-at'); this.ms = all('.ap-m').map((e) => e.style); this.tap = q('.ap-tap').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'explain' }, { t: 0.8, pose: 'laptop' }, { t: 6.8, pose: 'think' }, { t: 11.2, pose: 'idea' }, { t: 16.8, pose: 'pointer', flip: true }, { t: 23.2, pose: 'thumbs' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.steps.forEach((s, i) => {\n      const a = [0.8, 11.2, 16.8][i];\n      UI.rise(kit, s, t, a, 0.6, 20);\n      const act = (i === 0 && t < 11.2) || (i === 1 && t >= 11.2 && t < 16.8) || (i === 2 && t >= 16.8);\n      s.opacity = (+s.opacity * (act ? 1 : 0.45)).toFixed(3);\n    });\n    const p = seg(t, 0.3, 1.2);\n    this.ph.opacity = eo(p); this.ph.transform = 'translateY(' + (lerp(50, 0, eo(p)) - t * 0.4).toFixed(1) + 'px)';\n    this.ml.opacity = 0.9 * eo(seg(t, 1.0, 1.6));\n    // card switching inside the phone\n    const sw = (a, b) => eo(seg(t, a, a + 0.4)) * (1 - ei(seg(t, b, b + 0.4)));\n    this.o.opacity = sw(0.6, 10.8); this.a.opacity = sw(11.2, 16.4); this.s.opacity = sw(16.8, 99);\n    // approve countdown: 0:10 → 0:00, then Expired\n    const left = Math.max(0, Math.ceil(10 - Math.max(0, t - 0.8)));\n    const exp = t >= 10.8;\n    UI.set(this.b, exp ? 'Expired · candle closed' : 'Approve buy · expires 0:' + String(left).padStart(2, '0'));\n    this.b.style.opacity = exp ? 0.45 : 1;\n    this.b.style.transform = 'scale(' + (1 + 0.03 * Math.sin(t * 6) * (exp ? 0 : 1)).toFixed(4) + ')';\n    // toggle Off → On at 13.0\n    const on = eio(seg(t, 13.0, 13.4));\n    this.tg.background = 'color-mix(in srgb, var(--main) ' + (15 + 70 * on).toFixed(0) + '%, var(--ground))';\n    this.tk.left = lerp(5, 43, on).toFixed(1) + 'px';\n    UI.set(this.at, t < 13.0 ? 'Off: a triggered setup waits for your Approve.' : 'On: the engine enters by itself, within your settings.');\n    const tp = seg(t, 12.5, 13.2);\n    this.tap.left = '1572px'; this.tap.top = '288px';\n    this.tap.opacity = (Math.sin(Math.PI * tp) * 0.9).toFixed(3); this.tap.transform = 'scale(' + lerp(1.5, 0.8, tp).toFixed(3) + ')';\n    this.ms.forEach((s, i) => { const a = 18.6 + i * 1.6; UI.rise(kit, s, t, a, 0.5, 16); });\n    this.tutor.render(t);\n  },\n});\n","scene-checklist.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// The ENTRY CHECKLIST as the app shows it (mock): BUY 72% / 60% READY, SELL 55% / 60% not ready.\nconst CL_BUY = [['Candle reaction', 1], ['Volume', 1], ['1m trend', 1], ['Order book', 0]];\nconst CL_SELL = [];\nkit.scene('checklist', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    const rows = (list, col, cls) => list.map((c) => '<div class=\"' + cls + '\" style=\"display:flex;align-items:center;gap:12px;font-size:24px;padding:4px 0\"><span class=\"mono\" style=\"width:26px;font-weight:700;color:' + (c[1] ? col : 'color-mix(in srgb, var(--second) 45%, var(--ground))') + '\">' + (c[1] ? '✓' : '✗') + '</span>' +\n      '<span style=\"' + (c[1] ? '' : 'color:color-mix(in srgb, var(--second) 50%, var(--ground))') + '\">' + c[0] + '</span></div>').join('');\n    const side = (name, where, col, sc, cls, list) => '<div class=\"card ' + cls + '\" style=\"margin-top:14px;border-color:color-mix(in srgb, ' + col + ' 40%, transparent)\">' +\n      '<div style=\"display:flex;align-items:center;gap:12px\"><span class=\"pill\" style=\"color:' + col + '\">' + name + '</span><span class=\"lbl\" style=\"f
