<script>window.FILM = {"id":"T14","width":1920,"height":1080,"scenes":[{"id":"title","name":"Lesson fourteen","dur":10,"k":1,"oldStart":0,"oldDur":10},{"id":"hook","name":"From line to candle","dur":19,"k":1,"oldStart":10,"oldDur":19},{"id":"window","name":"Four prices","dur":23,"k":1,"oldStart":29,"oldDur":23},{"id":"live","name":"Watch one form","dur":39,"k":1,"oldStart":52,"oldDur":39},{"id":"anatomy","name":"Body and wicks","dur":29.04,"k":1.21,"oldStart":91,"oldDur":24},{"id":"updown","name":"Up and down candles","dur":26,"k":1,"oldStart":115,"oldDur":26},{"id":"doji","name":"Doji","dur":23.18,"k":1.22,"oldStart":141,"oldDur":19},{"id":"rules","name":"The two rules","dur":26,"k":1,"oldStart":160,"oldDur":26},{"id":"chart","name":"From candle to chart","dur":22,"k":1,"oldStart":186,"oldDur":22},{"id":"mistake","name":"Wick is not close","dur":22,"k":1,"oldStart":208,"oldDur":22},{"id":"try","name":"Try it","dur":32.4,"k":1.35,"oldStart":230,"oldDur":24},{"id":"risks","name":"Know the limits","dur":22,"k":1,"oldStart":254,"oldDur":22},{"id":"recap","name":"Recap","dur":31.61,"k":1.09,"oldStart":276,"oldDur":29},{"id":"next","name":"Up next","dur":10,"k":1,"oldStart":305,"oldDur":10}],"voice":{"src":"T14/voice.mp3","lines":[{"t":0.6,"d":5.117,"text":"Lesson fourteen: candlesticks. Open, high, low and close.","ml":"പതിനാലാം പാഠം: candlesticks. Open, high, low, close."},{"t":6.267,"d":2.655,"text":"Almost every price chart you will see is drawn this way.","ml":"നിങ്ങൾ കാണുന്ന മിക്കവാറും എല്ലാ വില ചാർട്ടുകളും ഇങ്ങനെയാണ് വരയ്ക്കുന്നത്."},{"t":10.4,"d":4.082,"text":"Here is one minute of a fictional BTC price, drawn as a line.","ml":"ഇതാ ഒരു സാങ്കൽപ്പിക BTC വിലയുടെ ഒരു മിനിറ്റ്, ഒരു വരയായി."},{"t":15.4,"d":3.875,"text":"A line shows every wiggle. Now watch it squeeze into one shape.","ml":"വര ഓരോ ചെറിയ ഇളക്കവും കാണിക്കും. ഇനി അത് ഒരൊറ്റ രൂപത്തിലേക്ക് ചുരുങ്ങുന്നത് നോക്കൂ."},{"t":20.4,"d":3.495,"text":"That shape is a candle. It keeps just four prices from the minute.","ml":"ആ രൂപമാണ് ഒരു candle. ആ മിനിറ്റിലെ നാല് വിലകൾ മാത്രമേ അത് സൂക്ഷിക്കുന്നുള്ളൂ."},{"t":25.6,"d":2.158,"text":"Candles side by side make a chart.","ml":"Candle-കൾ അടുത്തടുത്ത് വെച്ചാൽ ഒരു ചാർട്ട് ആകും."},{"t":29.4,"d":4.435,"text":"A candle sums up one time window, such as one minute, with four prices.","ml":"ഒരു candle ഒരു സമയഭാഗത്തെ, ഉദാഹരണത്തിന് ഒരു മിനിറ്റിനെ, നാല് വിലകളിൽ ചുരുക്കുന്നു."},{"t":35,"d":4.708,"text":"Open is the first price. Close is the last. High and low are the extremes.","ml":"Open ആദ്യത്തെ വില. Close അവസാനത്തേത്. High-ഉം low-ഉം ഏറ്റവും കൂടിയതും കുറഞ്ഞതും."},{"t":40.8,"d":4.529,"text":"Think of one day's temperature: first reading, hottest, coldest, last.","ml":"ഒരു ദിവസത്തെ താപനില ഓർക്കുക: ആദ്യ റീഡിങ്, ഏറ്റവും ചൂട്, ഏറ്റവും തണുപ്പ്, അവസാനത്തേത്."},{"t":46.4,"d":4.038,"text":"Same idea. A candle is a price summary, not a prediction.","ml":"അതേ ആശയം. Candle ഒരു വിലയുടെ ചുരുക്കമാണ്, പ്രവചനമല്ല."},{"t":52.4,"d":2.082,"text":"Let's watch a 1-minute candle form.","ml":"ഒരു 1-മിനിറ്റ് candle രൂപപ്പെടുന്നത് നോക്കാം."},{"t":55.6,"d":4.239,"text":"It starts at 60,000 USDT. That first price is the open.","ml":"അത് 60,000 USDT-ൽ തുടങ്ങുന്നു. ആ ആദ്യ വിലയാണ് open."},{"t":60.389,"d":5.207,"text":"Price dips below the open, so the forming body is red. The lowest point is the low.","ml":"വില open-ന് താഴേക്ക് ഇറങ്ങുന്നു, അതുകൊണ്ട് രൂപപ്പെടുന്ന ബോഡി ചുവപ്പാണ്. ഏറ്റവും താഴ്ന്ന പോയിന്റാണ് low."},{"t":66.6,"d":5.503,"text":"Now price climbs above the open: the body turns green. Each new top is the high.","ml":"ഇപ്പോൾ വില open-ന് മുകളിലേക്ക് കയറുന്നു: ബോഡി പച്ചയാകുന്നു. ഓരോ പുതിയ ഉയരവും high ആണ്."},{"t":72.8,"d":4.733,"text":"Until the minute ends, the last price keeps changing. The candle is not finished.","ml":"മിനിറ്റ് തീരുന്നത് വരെ അവസാന വില മാറിക്കൊണ്ടിരിക്കും. Candle പൂർത്തിയായിട്ടില്ല."},{"t":79,"d":5.805,"text":"Time is up. The last price, 60,080, becomes the close. The candle is done.","ml":"സമയം കഴിഞ്ഞു. അവസാന വില, 60,080, close ആകുന്നു. Candle പൂർത്തിയായി."},{"t":85.355,"d":4.47,"text":"Open, high, low, close: four numbers that tell this minute's story.","ml":"Open, high, low, close: ഈ മിനിറ്റിന്റെ കഥ പറയുന്ന നാല് നമ്പറുകൾ."},{"t":91.484,"d":4.609,"text":"Let's name the parts. The thick part is the body, between open and close.","ml":"ഭാഗങ്ങൾക്ക് പേരിടാം. കട്ടിയുള്ള ഭാഗമാണ് ബോഡി (body), open-നും close-നും ഇടയിൽ."},{"t":98.502,"d":4.734,"text":"The thin lines are wicks, also called shadows. They reach the high and the low.","ml":"നേർത്ത വരകളാണ് വിക്കുകൾ (wicks), ഷാഡോ എന്നും പറയും. അവ high-ലേക്കും low-ലേക്കും എത്തുന്നു."},{"t":106.004,"d":7.554,"text":"Body: 60,080 minus 60,000 is 80 USDT. Upper wick: 40. Lower wick: 60.","ml":"ബോഡി: 60,080 മൈനസ് 60,000 = 80 USDT. മുകളിലെ വിക്ക്: 40. താഴത്തെ വിക്ക്: 60."},{"t":114.108,"d":5.388,"text":"The range, high minus low, is 180 USDT. More than half of it is wick.","ml":"റേഞ്ച്, അതായത് high മൈനസ് low, 180 USDT ആണ്. അതിന്റെ പകുതിയിലധികവും വിക്ക് ആണ്."},{"t":120.44,"d":2.444,"text":"Up or down? Compare the close with the open.","ml":"മുകളിലേക്കോ താഴേക്കോ? Close-നെ open-മായി താരതമ്യം ചെയ്യുക."},{"t":124.24,"d":5.191,"text":"Close above open: an up candle, also called bullish. Usually drawn green.","ml":"Close open-ന് മുകളിൽ: ഒരു up candle, bullish എന്നും പറയും. സാധാരണ പച്ചയിൽ വരയ്ക്കും."},{"t":129.981,"d":4.818,"text":"Close below open: a down candle, called bearish. Usually drawn red.","ml":"Close open-ന് താഴെ: ഒരു down candle, bearish എന്ന് പറയും. സാധാരണ ചുവപ്പിൽ വരയ്ക്കും."},{"t":135.349,"d":4.902,"text":"Same high and low, same 80 USDT body. Only the direction differs.","ml":"ഒരേ high-ഉം low-ഉം, ഒരേ 80 USDT ബോഡി. ദിശ മാത്രമാണ് വ്യത്യാസം."},{"t":140.801,"d":3.954,"text":"Colours are just an app setting. Open versus close is what counts.","ml":"നിറങ്ങൾ വെറും ആപ്പ് സെറ്റിങ് ആണ്. Open-ഉം close-ഉം തമ്മിലുള്ള താരതമ്യമാണ് പ്രധാനം."},{"t":146.528,"d":3.151,"text":"Sometimes the close lands almost exactly on the open.","ml":"ചിലപ്പോൾ close ഏതാണ്ട് കൃത്യമായി open-ൽ തന്നെ വന്നു നിൽക്കും."},{"t":151.896,"d":7.037,"text":"Here: open 60,000, close 60,005. The body is just 5 USDT thin.","ml":"ഇവിടെ: open 60,000, close 60,005. ബോഡിക്ക് വെറും 5 USDT കനം മാത്രം."},{"t":159.483,"d":3.745,"text":"That is a doji. Buyers and sellers ended the minute about even.","ml":"അതാണ് ഒരു doji. ആ മിനിറ്റ് തീർന്നപ്പോൾ വാങ്ങുന്നവരും വിൽക്കുന്നവരും ഏകദേശം തുല്യരായിരുന്നു."},{"t":164.218,"d":2.281,"text":"A doji does not tell you what comes next.","ml":"അടുത്തത് എന്ത് വരും എന്ന് doji പറയുന്നില്ല."},{"t":169.52,"d":4.149,"text":"Four prices, but they are not free. Two rules always hold.","ml":"നാല് വിലകൾ, പക്ഷേ അവ തോന്നിയപോലെ ആകാൻ പറ്റില്ല. രണ്ട് നിയമങ്ങൾ എപ്പോഴും ബാധകമാണ്."},{"t":174.22,"d":3.91,"text":"The high can never be below the open or the close. It is the top.","ml":"High ഒരിക്കലും open-നോ close-നോ താഴെയാകില്ല. അതാണ് ഏറ്റവും മുകൾ."},{"t":179.42,"d":3.724,"text":"The low can never be above them either. It is the bottom.","ml":"Low ഒരിക്കലും അവയ്ക്ക് മുകളിലും ആകില്ല. അതാണ് ഏറ്റവും താഴെ."},{"t":184.12,"d":3.213,"text":"Drop the close below the open, and the candle turns red.","ml":"Close open-ന് താഴേക്ക് വലിച്ചിട്ടാൽ candle ചുവപ്പാകും."},{"t":188.72,"d":5.37,"text":"Rule check: high is at or above both, low at or below both. Always.","ml":"നിയമ പരിശോധന: high രണ്ടിനും തുല്യമോ മുകളിലോ, low രണ്ടിനും തുല്യമോ താഴെയോ. എപ്പോഴും."},{"t":195.62,"d":5.048,"text":"One candle covers one minute. Put candles side by side, and you get a chart.","ml":"ഒരു candle ഒരു മിനിറ്റിനെ കാണിക്കുന്നു. Candle-കൾ അടുത്തടുത്ത് വെച്ചാൽ ഒരു ചാർട്ട് കിട്ടും."},{"t":201.52,"d":3.326,"text":"Time runs left to right. Price runs bottom to top.","ml":"സമയം ഇടത്തുനിന്ന് വലത്തോട്ട്. വില താഴെനിന്ന് മുകളിലോട്ട്."},{"t":205.72,"d":3.026,"text":"Each new candle opens near where the last one closed.","ml":"ഓരോ പുതിയ candle-ഉം, കഴിഞ്ഞത് close ആയതിന്റെ അടുത്ത് open ആകുന്നു."},{"t":210.02,"d":4.603,"text":"The candle on the far right is still forming. It can change until its minute ends.","ml":"ഏറ്റവും വലത്തെ candle ഇപ്പോഴും രൂപപ്പെടുകയാണ്. അതിന്റെ മിനിറ്റ് തീരുംവരെ അത് മാറാം."},{"t":217.62,"d":3.436,"text":"A common mistake: reading the top of the wick as the close.","ml":"ഒരു സാധാരണ തെറ്റ്: വിക്കിന്റെ മുകളറ്റം close ആയി വായിക്കുന്നത്."},{"t":222.42,"d":4.111,"text":"Price did touch 60,200 in that minute, but it did not stay there.","ml":"ആ മിനിറ്റിൽ വില 60,200 തൊട്ടു, പക്ഷേ അവിടെ നിന്നില്ല."},{"t":227.62,"d":5.685,"text":"The close is the edge of the body. On this green candle, the top edge: 60,040.","ml":"Close ബോഡിയുടെ അറ്റമാണ്. ഈ പച്ച candle-ൽ, മുകളിലെ അറ്റം: 60,040."},{"t":233.855,"d":4.129,"text":"Wick tips are the high and low. Body edges are the open and close.","ml":"വിക്കിന്റെ അറ്റങ്ങൾ high-ഉം low-ഉം. ബോഡിയുടെ അറ്റങ്ങൾ open-ഉം close-ഉം."},{"t":239.76,"d":4.057,"text":"Your turn. Read this candle's open, high, low and close.","ml":"ഇനി നിങ്ങളുടെ ഊഴം. ഈ candle-ന്റെ open, high, low, close വായിക്കൂ."},{"t":245.835,"d":3.59,"text":"Is it an up or a down candle? Pause if you need more time.","ml":"ഇതൊരു up candle ആണോ down candle ആണോ? കൂടുതൽ സമയം വേണമെങ്കിൽ വീഡിയോ നിർത്തൂ."},{"t":253.26,"d":6.195,"text":"Open 60,150 at the top of the red body. Close 60,000 at the bottom.","ml":"ചുവന്ന ബോഡിയുടെ മുകളിൽ open 60,150. താഴെ close 60,000."},{"t":260.55,"d":7.933,"text":"High 60,200, low 59,950. Close is 150 below open: a down candle.","ml":"High 60,200, low 59,950. Close open-നേക്കാൾ 150 താഴെ: ഒരു down candle."},{"t":269.033,"d":1.178,"text":"Well done if you got it.","ml":"ശരിയായെങ്കിൽ, നന്നായി."},{"t":272.02,"d":2.493,"text":"Before we move on, keep these limits in mind.","ml":"മുന്നോട്ട് പോകും മുമ്പ്, ഈ പരിമിതികൾ ഓർക്കുക."},{"t":275.82,"d":3.782,"text":"A candle shows what already happened. It does not predict the next one.","ml":"Candle ഇതിനകം സംഭവിച്ചത് കാണിക്കുന്നു. അടുത്തത് പ്രവചിക്കുന്നില്ല."},{"t":281.42,"d":5.074,"text":"The last candle can still change. Big wicks mean fast moves and more slippage.","ml":"അവസാന candle ഇപ്പോഴും മാറാം. വലിയ വിക്കുകൾ എന്നാൽ വേഗമേറിയ മാറ്റങ്ങളും കൂടുതൽ slippage-ഉം."},{"t":287.52,"d":4.557,"text":"Nothing here is a signal. Waiting, or no trade at all, is always allowed.","ml":"ഇവിടെ ഒന്നും ഒരു സിഗ്നൽ അല്ല. കാത്തിരിക്കാനും, ട്രേഡ് ചെയ്യാതിരിക്കാനും എപ്പോഴും അനുവാദമുണ്ട്."},{"t":294.056,"d":0.738,"text":"Let's recap.","ml":"നമുക്ക് ചുരുക്കി നോക്കാം."},{"t":295.8,"d":4.496,"text":"A candle sums up one time window: open, high, low and close.","ml":"ഒരു candle ഒരു സമയഭാഗത്തെ ചുരുക്കുന്നു: open, high, low, close."},{"t":301.032,"d":4.242,"text":"Body edges are open and close. Wick tips are high and low.","ml":"ബോഡിയുടെ അറ്റങ്ങൾ open-ഉം close-ഉം. വിക്കിന്റെ അറ്റങ്ങൾ high-ഉം low-ഉം."},{"t":306.155,"d":3.539,"text":"Up candles close above the open; down candles close below.","ml":"Up candle-കൾ open-ന് മുകളിൽ close ആകുന്നു; down candle-കൾ താഴെ."},{"t":312.041,"d":6.406,"text":"Check yourself: a red body runs from 60,100 down to 60,020. Where did it open?","ml":"സ്വയം പരിശോധിക്കൂ: ഒരു ചുവന്ന ബോഡി 60,100-ൽ നിന്ന് 60,020 വരെ താഴേക്ക് നീളുന്നു. അത് എവിടെ open ആയി?"},{"t":318.997,"d":5.768,"text":"At 60,100, the top of the red body. It closed lower, at 60,020.","ml":"60,100-ൽ, ചുവന്ന ബോഡിയുടെ മുകളിൽ. അത് താഴെ, 60,020-ൽ close ആയി."},{"t":325.83,"d":5.232,"text":"Great work! Next up: 1-minute, 5-minute and 15-minute timeframes.","ml":"നന്നായി! അടുത്തത്: 1-മിനിറ്റ്, 5-മിനിറ്റ്, 15-മിനിറ്റ് timeframe-കൾ."},{"t":331.612,"d":1.504,"text":"See you in lesson fifteen.","ml":"പതിനഞ്ചാം പാഠത്തിൽ കാണാം."}]},"assetBase":"T14/assets/","assets":{"tutor-checklist.webp":{"mime":"image/webp","w":185,"h":161},"tutor-cheer.webp":{"mime":"image/webp","w":207,"h":182},"tutor-confused.webp":{"mime":"image/webp","w":185,"h":169},"tutor-explain.webp":{"mime":"image/webp","w":502,"h":602},"tutor-idea.webp":{"mime":"image/webp","w":169,"h":178},"tutor-idle.webp":{"mime":"image/webp","w":331,"h":446},"tutor-magnify.webp":{"mime":"image/webp","w":187,"h":170},"tutor-point.webp":{"mime":"image/webp","w":547,"h":568},"tutor-present.webp":{"mime tem-ui, sans-serif)); font-weight:700; font-size:40px; letter-spacing:.2em; color:var(--main) }\n.chrome { position:absolute; left:140px; right:140px; top:56px; display:flex; align-items:center; gap:28px; z-index:4 }\n.chrome span { font-family:var(--mono, ui-monospace, monospace); font-size:19px; letter-spacing:.18em; text-transform:uppercase; color:color-mix(in srgb, var(--second) 55%, var(--ground)); white-space:nowrap }\n.chrome div { flex:1; height:4px; border-radius:4px; background:color-mix(in srgb, var(--second) 10%, transparent); overflow:hidden } .chrome i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--main), var(--accent)) }\n.tutor { position:absolute; inset:0; pointer-events:none; z-index:5 }\n.tutor-img { position:absolute; display:block; max-width:none; opacity:0 }\n.tutor-shadow { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--main) 38%, transparent), transparent) }\n.bubble { position:absolute; left:0; top:0; width:max-content; max-width:540px; box-sizing:border-box; padding:20px 28px; border-radius:26px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0 }\n.bubble p { margin:0; font-size:30px; line-height:1.35; font-weight:600; color:var(--second) }\n.bubble::after { content:''; position:absolute; right:44px; bottom:-12px; width:22px; height:22px; background:color-mix(in srgb, var(--ground) 76%, var(--main)); border-right:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); border-bottom:1.5px solid color-mix(in srgb, var(--main) 50%, transparent); transform:rotate(45deg) }\n.bubble.is-top::after { right:auto; left:calc(50% - 11px) }\n.box { position:absolute; margin:0; border:2px solid var(--second); box-sizing:border-box; font-size:30px; letter-spacing:.12em } .box::after { content:attr(data-label); position:absolute; left:14px; bottom:10px }\n/* T14: candle colours (most apps: green up, red down) and small chart labels */\n#stage { --up:#2fd897; --down:#ff5c7c }\n.up { color:var(--up) } .dn { color:var(--down) }\n.tag { position:absolute; margin:0; padding:6px 14px; border-radius:10px; font-family:var(--mono, ui-monospace, monospace); font-size:24px; white-space:nowrap; background:color-mix(in srgb, var(--ground) 80%, var(--main)); border:1.5px solid color-mix(in srgb, var(--main) 35%, transparent) }\n.axis { font-family:var(--mono, ui-monospace, monospace); font-size:22px; fill:color-mix(in srgb, var(--second) 50%, var(--ground)) }\n.row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:14px 0; border-bottom:1.5px solid color-mix(in srgb, var(--second) 10%, transparent) }\n.row > span:first-child { font-size:28px; color:color-mix(in srgb, var(--second) 70%, var(--ground)) }\n.row > .mono { font-size:42px }\n","narration.json":"{\n  \"about\": \"T14 captions, written as a warm, clear tutor speaking; can be recorded as voiceover later. Times in seconds from the start of the lesson.\",\n  \"lines\": [\n    {\n      \"t\": 0.6,\n      \"text\": \"Lesson fourteen: candlesticks. Open, high, low and close.\"\n    },\n    {\n      \"t\": 5.4,\n      \"text\": \"Almost every price chart you will see is drawn this way.\"\n    },\n    {\n      \"t\": 10.4,\n      \"text\": \"Here is one minute of a fictional BTC price, drawn as a line.\"\n    },\n    {\n      \"t\": 15.4,\n      \"text\": \"A line shows every wiggle. Now watch it squeeze into one shape.\"\n    },\n    {\n      \"t\": 20.4,\n      \"text\": \"That shape is a candle. It keeps just four prices from the minute.\"\n    },\n    {\n      \"t\": 25.6,\n      \"text\": \"Candles side by side make a chart.\"\n    },\n    {\n      \"t\": 29.4,\n      \"text\": \"A candle sums up one time window, such as one minute, with four prices.\"\n    },\n    {\n      \"t\": 35.0,\n      \"text\": \"Open is the first price. Close is the last. High and low are the extremes.\"\n    },\n    {\n      \"t\": 40.8,\n      \"text\": \"Think of one day's temperature: first reading, hottest, coldest, last.\"\n    },\n    {\n      \"t\": 46.4,\n      \"text\": \"Same idea. A candle is a price summary, not a prediction.\"\n    },\n    {\n      \"t\": 52.4,\n      \"text\": \"Let's watch a 1-minute candle form.\"\n    },\n    {\n      \"t\": 55.6,\n      \"text\": \"It starts at 60,000 USDT. That first price is the open.\"\n    },\n    {\n      \"t\": 60.2,\n      \"text\": \"Price dips below the open, so the forming body is red. The lowest point is the low.\"\n    },\n    {\n      \"t\": 66.6,\n      \"text\": \"Now price climbs above the open: the body turns green. Each new top is the high.\"\n    },\n    {\n      \"t\": 72.8,\n      \"text\": \"Until the minute ends, the last price keeps changing. The candle is not finished.\"\n    },\n    {\n      \"t\": 79.0,\n      \"text\": \"Time is up. The last price, 60,080, becomes the close. The candle is done.\"\n    },\n    {\n      \"t\": 84.8,\n      \"text\": \"Open, high, low, close: four numbers that tell this minute's story.\"\n    },\n    {\n      \"t\": 91.4,\n      \"text\": \"Let's name the parts. The thick part is the body, between open and close.\"\n    },\n    {\n      \"t\": 97.2,\n      \"text\": \"The thin lines are wicks, also called shadows. They reach the high and the low.\"\n    },\n    {\n      \"t\": 103.4,\n      \"text\": \"Body: 60,080 minus 60,000 is 80 USDT. Upper wick: 40. Lower wick: 60.\"\n    },\n    {\n      \"t\": 108.9,\n      \"text\": \"The range, high minus low, is 180 USDT. More than half of it is wick.\"\n    },\n    {\n      \"t\": 115.4,\n      \"text\": \"Up or down? Compare the close with the open.\"\n    },\n    {\n      \"t\": 119.2,\n      \"text\": \"Close above open: an up candle, also called bullish. Usually drawn green.\"\n    },\n    {\n      \"t\": 124.9,\n      \"text\": \"Close below open: a down candle, called bearish. Usually drawn red.\"\n    },\n    {\n      \"t\": 130.2,\n      \"text\": \"Same high and low, same 80 USDT body. Only the direction differs.\"\n    },\n    {\n      \"t\": 135.4,\n      \"text\": \"Colours are just an app setting. Open versus close is what counts.\"\n    },\n    {\n      \"t\": 141.4,\n      \"text\": \"Sometimes the close lands almost exactly on the open.\"\n    },\n    {\n      \"t\": 145.8,\n      \"text\": \"Here: open 60,000, close 60,005. The body is just 5 USDT thin.\"\n    },\n    {\n      \"t\": 150.8,\n      \"text\": \"That is a doji. Buyers and sellers ended the minute about even.\"\n    },\n    {\n      \"t\": 155.9,\n      \"text\": \"A doji does not tell you what comes next.\"\n    },\n    {\n      \"t\": 160.3,\n      \"text\": \"Four prices, but they are not free. Two rules always hold.\"\n    },\n    {\n      \"t\": 165.0,\n      \"text\": \"The high can never be below the open or the close. It is the top.\"\n    },\n    {\n      \"t\": 170.2,\n      \"text\": \"The low can never be above them either. It is the bottom.\"\n    },\n    {\n      \"t\": 174.9,\n      \"text\": \"Drop the close below the open, and the candle turns red.\"\n    },\n    {\n      \"t\": 179.5,\n      \"text\": \"Rule check: high is at or above both, low at or below both. Always.\"\n    },\n    {\n      \"t\": 186.4,\n      \"text\": \"One candle covers one minute. Put candles side by side, and you get a chart.\"\n    },\n    {\n      \"t\": 192.3,\n      \"text\": \"Time runs left to right. Price runs bottom to top.\"\n    },\n    {\n      \"t\": 196.5,\n      \"text\": \"Each new candle opens near where the last one closed.\"\n    },\n    {\n      \"t\": 200.8,\n      \"text\": \"The candle on the far right is still forming. It can change until its minute ends.\"\n    },\n    {\n      \"t\": 208.4,\n      \"text\": \"A common mistake: reading the top of the wick as the close.\"\n    },\n    {\n      \"t\": 213.2,\n      \"text\": \"Price did touch 60,200 in that minute, but it did not stay there.\"\n    },\n    {\n      \"t\": 218.4,\n      \"text\": \"The close is the edge of the body. On this green candle, the top edge: 60,040.\"\n    },\n    {\n      \"t\": 224.4,\n      \"text\": \"Wick tips are the high and low. Body edges are the open and close.\"\n    },\n    {\n      \"t\": 230.4,\n      \"text\": \"Your turn. Read this candle's open, high, low and close.\"\n    },\n    {\n      \"t\": 234.9,\n      \"text\": \"Is it an up or a down candle? Pause if you need more time.\"\n    },\n    {\n      \"t\": 240.4,\n      \"text\": \"Open 60,150 at the top of the red body. Close 60,000 at the bottom.\"\n    },\n    {\n      \"t\": 245.8,\n      \"text\": \"High 60,200, low 59,950. Close is 150 below open: a down candle.\"\n    },\n    {\n      \"t\": 251.0,\n      \"text\": \"Well done if you got it.\"\n    },\n    {\n      \"t\": 254.4,\n      \"text\": \"Before we move on, keep these limits in mind.\"\n    },\n    {\n      \"t\": 258.2,\n      \"text\": \"A candle shows what already happened. It does not predict the next one.\"\n    },\n    {\n      \"t\": 263.8,\n      \"text\": \"The last candle can still change. Big wicks mean fast moves and more slippage.\"\n    },\n    {\n      \"t\": 269.9,\n      \"text\": \"Nothing here is a signal. Waiting, or no trade at all, is always allowed.\"\n    },\n    {\n      \"t\": 276.4,\n      \"text\": \"Let's recap.\"\n    },\n    {\n      \"t\": 278.0,\n      \"text\": \"A candle sums up one time window: open, high, low and close.\"\n    },\n    {\n      \"t\": 282.8,\n      \"text\": \"Body edges are open and close. Wick tips are high and low.\"\n    },\n    {\n      \"t\": 287.5,\n      \"text\": \"Up candles close above the open; down candles close below.\"\n    },\n    {\n      \"t\": 292.9,\n      \"text\": \"Check yourself: a red body runs from 60,100 down to 60,020. Where did it open?\"\n    },\n    {\n      \"t\": 299.0,\n      \"text\": \"At 60,100, the top of the red body. It closed lower, at 60,020.\"\n    },\n    {\n      \"t\": 305.6,\n      \"text\": \"Great work! Next up: 1-minute, 5-minute and 15-minute timeframes.\"\n    },\n    {\n      \"t\": 310.8,\n      \"text\": \"See you in lesson fifteen.\"\n    }\n  ]\n}","scene-anatomy.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst AN_X = 440, anY = (p) => 770 - (p - 59920) / 220 * 320;\n// Bracket segments: [label, math, from, to, at]\nconst AN_SEG = [['Upper wick', '60,120 − 60,080 = 40', 60080, 60120, 12.9], ['Body', '60,080 − 60,000 = 80', 60000, 60080, 12.4], ['Lower wick', '60,000 − 59,940 = 60', 59940, 60000, 13.4]];\nconst AN_P = [60120, 60080, 60000, 59940], AN_PN = ['High', 'Close', 'Open', 'Low'];\nkit.scene('anatomy', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'an-c', 1);\n    let lv = '', br = '';\n    AN_P.forEach((p, i) => {\n      lv += '<g class=\"an-lv\"><line x1=\"' + (AN_X - 150) + '\" x2=\"' + (AN_X - 70) + '\" y1=\"' + anY(p).toFixed(1) + '\" y2=\"' + anY(p).toFixed(1) + '\" stroke-width=\"2\" stroke-dasharray=\"4 6\" style=\"stroke:color-mix(in srgb, var(--second) 40%, transparent)\"/>' +\n        '<text x=\"' + (AN_X - 164) + '\" y=\"' + (anY(p) + 9).toFixed(1) + '\" text-anchor=\"end\" class=\"mono\" style=\"fill:var(--second);font-size:26px\">' + UI.fmt(p) + '</text>' +\n        '<text x=\"' + (AN_X - 164) + '\" y=\"' + (anY(p) - 18).toFixed(1) + '\" text-anchor=\"end\" class=\"kick\" style=\"fill:color-mix(in srgb, var(--second) 55%, var(--ground));font-size:18px\">' + AN_PN[i] + '</text></g>';\n    });\n    const bracket = (x, y0, y1) => 'M' + x + ' ' + (y0 + 3) + ' h14 V' + (y1 - 3) + ' h-14';\n    AN_SEG.forEach((s) => {\n      const y0 = anY(s[3]), y1 = anY(s[2]), ym = (y0 + y1) / 2;\n      br += '<g class=\"an-br\"><path d=\"' + bracket(AN_X + 80, y0, y1) + '\" pathLength=\"1\" fill=\"none\" stroke-width=\"3\" class=\"an-bp\" style=\"stroke:var(--main)\"/>' +\n        '<text x=\"' + (AN_X + 120) + '\" y=\"' + (ym - 2).toFixed(1) + '\" class=\"kick\" style=\"fill:var(--main);font-size:22px\">' + s[0] + '</text>' +\n        '<text x=\"' + (AN_X + 120) + '\" y=\"' + (ym + 32).toFixed(1) + '\" class=\"mono an-m\" style=\"fill:var(--second);font-size:28px\">' + s[1] + ' USDT</text></g>';\n    });\n    const ry0 = anY(60120), ry1 = anY(59940);\n    br += '<g class=\"an-rg\"><path d=\"' + bracket(1080, ry0, ry1) + '\" pathLength=\"1\" fill=\"none\" stroke-width=\"3\" class=\"an-bp\" style=\"stroke:var(--accent)\"/>' +\n      '<text x=\"1120\" y=\"' + ((ry0 + ry1) / 2 - 22).toFixed(1) + '\" class=\"kick\" style=\"fill:var(--accent);font-size:22px\">Range = high − low</text>' +\n      '<text x=\"1120\" y=\"' + ((ry0 + ry1) / 2 + 22).toFixed(1) + '\" class=\"mono\" style=\"fill:var(--second);font-size:30px\">60,120 − 59,940 = 180 USDT</text>' +\n      '<text x=\"1120\" y=\"' + ((ry0 + ry1) / 2 + 66).toFixed(1) + '\" style=\"fill:color-mix(in srgb, var(--second) 65%, var(--ground));font-size:26px\">Wicks: 40 + 60 = 100 of the 180</text></g>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\">' + lv + this.cd.html + br + '</svg>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1500px;gap:14px\"><p class=\"kick an-k\">Parts of a candle</p>' +\n      '<h2 class=\"line an-t\">Body and wicks</h2>' +\n      '<p class=\"def an-d1\" style=\"margin-top:6px\">The <b>body</b> is the thick part, between the open and the close.</p>' +\n      '<p class=\"def an-d2\">The <b>wicks</b>, or shadows, are thin lines up to the high and down to the low.</p></div>' +\n      '<p class=\"fict\" style=\"position:absolute;left:1120px;top:440px;margin:0\">Fictional example · the candle from before</p>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.an-k').style; this.t = q('.an-t'); this.d1 = q('.an-d1'); this.d2 = q('.an-d2');\n    this.lv = all('.an-lv').map((e) => e.style); this.br = all('.an-br').map((e) => e.style); this.bp = all('.an-bp'); this.rg = q('.an-rg').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'cheer' }, { t: 0.5, pose: 'explain' }, { t: 6.2, pose: 'point', flip: true }, { t: 12.4, pose: 'checklist' }, { t: 17.9, pose: 'idea' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    TextFx.fadeFromRight(this.d1, t, 0.9, { stagger: 0.05 });\n    TextFx.fadeFromRight(this.d2, t, 6.4, { stagger: 0.05 });\n    // Body glows while it is named, wicks while they are named.\n    const bodyHL = Math.sin(Math.PI * seg(t, 1.6, 4.6)), wickHL = Math.sin(Math.PI * seg(t, 7.0, 10.6));\n    this.cd.set(0, { x: AN_X, w: 130, o: 60000, h: 60120, l: 59940, c: 60080, y: anY, op: eo(seg(t, 0.4, 1.0)) });\n    const g = kit.stage.querySelector('.an-c-b'), w = kit.stage.querySelector('.an-c-w');\n    g.style.filter = bodyHL > 0.01 ? 'drop-shadow(0 0 ' + (bodyHL * 18).toFixed(1) + 'px var(--up))' : 'none';\n    w.style.filter = wickHL > 0.01 ? 'drop-shadow(0 0 ' + (wickHL * 14).toFixed(1) + 'px var(--up))' : 'none';\n    w.setAttribute('stroke-width', (9 + 5 * wickHL).toFixed(1));\n    this.lv.forEach((s, i) => { s.opacity = eo(seg(t, 1.2 + i * 0.25, 1.7 + i * 0.25)); });\n    AN_SEG.forEach((sg, i) => {\n      const a = sg[4], p = seg(t, a, a + 0.6);\n      this.br[i].opacity = eo(seg(t, a, a + 0.3));\n      this.bp[i].setAttribute('stroke-dasharray', eio(p) + ' 1');\n      this.br[i].transform = 'translateX(' + lerp(16, 0, eo(p)).toFixed(1) + 'px)';\n    });\n    const r = seg(t, 18.0, 18.7);\n    this.rg.opacity = eo(seg(t, 18.0, 18.3)); this.bp[3].setAttribute('stroke-dasharray', eio(r) + ' 1');\n    this.tutor.render(t);\n  },\n});\n","scene-chart.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// Twelve fictional 1-minute candles [open, high, low, close]; each open is the previous close. #8 (10:07) is the lesson's candle.\nconst CH = [[59900, 59960, 59870, 59940], [59940, 59980, 59890, 59910], [59910, 59950, 59860, 59880], [59880, 59930, 59850, 59920], [59920, 59990, 59910, 59975], [59975, 60010, 59940, 59980],\n  [59980, 60030, 59960, 60000], [60000, 60120, 59940, 60080], [60080, 60140, 60050, 60060], [60060, 60090, 60010, 60030], [60030, 60100, 60020, 60090]];\nconst CH_X0 = 230, CH_DX = 100, chX = (i) => CH_X0 + i * CH_DX, chY = (p) => 700 - (p - 59840) / 320 * 350;\n// The last candle is still forming: its price wanders around the open.\nconst chLive = (t) => 60090 + Math.round(18 * Math.sin(t * 1.7) + 11 * Math.sin(t * 4.3 + 0.7) + 6 * Math.sin(t * 9.1));\nkit.scene('chart', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'ch-c', 12);\n    let labels = '', links = '';\n    for (let i = 0; i < 12; i += 2) labels += '<text x=\"' + chX(i) + '\" y=\"742\" text-anchor=\"middle\" class=\"axis\">10:' + String(i).padStart(2, '0') + '</text>';\n    for (let i = 0; i < 11; i++) {\n      const y = chY(CH[i][3]).toFixed(1);\n      links += '<line class=\"ch-ln\" x1=\"' + (chX(i) + 30) + '\" x2=\"' + (chX(i + 1) - 30) + '\" y1=\"' + y + '\" y2=\"' + y + '\" stroke-width=\"3\" stroke-dasharray=\"4 5\" style=\"stroke:var(--second)\"/>';\n    }\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"ch-grid\">' + UI.grid(190, 1360, chY, 59850, 60150, 50) + labels + '</g>' +\n      '<g class=\"ch-ax\"><path d=\"M190 762 H1330\" stroke-width=\"3\" style=\"stroke:var(--main)\"/><path d=\"M1318 752 L1334 762 L1318 772\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--main)\"/>' +\n      '<path d=\"M1480 720 V330\" stroke-width=\"3\" style=\"stroke:var(--main)\"/><path d=\"M1470 342 L1480 326 L1490 342\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--main)\"/></g>' +\n      '<text class=\"ch-axt\" x=\"1504\" y=\"344\" style=\"fill:var(--main);font-size:26px;font-weight:700\">Price</text>' + links + this.cd.html +\n      '<rect class=\"ch-mine\" x=\"' + (chX(7) - 52) + '\" y=\"' + (chY(60120) - 22) + '\" width=\"104\" height=\"' + (chY(59940) - chY(60120) + 44).toFixed(1) + '\" rx=\"14\" fill=\"none\" stroke-width=\"3\" stroke-dasharray=\"8 6\" style=\"stroke:var(--main)\"/></svg>' +\n      '<p class=\"tag ch-tm\" style=\"left:' + (chX(7) - 70) + 'px;top:' + (chY(60120) - 76).toFixed(1) + 'px\">Our candle</p>' +\n      '<p class=\"tag ch-fm\" style=\"left:' + (chX(11) - 64) + 'px;top:' + (chY(60150) - 60).toFixed(1) + 'px;color:var(--main);border-color:var(--main)\">Forming…</p>' +\n      '<p class=\"kick ch-time\" style=\"position:absolute;left:1350px;top:748px;margin:0\">Time</p>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1500px\"><p class=\"kick ch-k\">From candle to chart</p>' +\n      '<h2 class=\"line ch-t\">One candle per minute</h2></div>' +\n      '<p class=\"fict\" style=\"position:absolute;left:1120px;top:240px;margin:0\">BTC/USDT · 1-minute candles · fictional</p>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.ch-k').style; this.t = q('.ch-t'); this.grid = q('.ch-grid').style; this.ax = q('.ch-ax').style; this.axt = q('.ch-axt').style; this.time = q('.ch-time').style;\n    this.mine = q('.ch-mine').style; this.tm = q('.ch-tm').style; this.fm = q('.ch-fm').style; this.lns = all('.ch-ln').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'thumbs' }, { t: 0.5, pose: 'present' }, { t: 6.3, pose: 'point', flip: true }, { t: 10.5, pose: 'magnify' }, { t: 14.8, pose: 'candles', flip: true }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.4, 1.0));\n    // Our candle arrives big in the middle and settles into its minute; the others appear around it.\n    const m = eio(seg(t, 0.8, 2.6));\n    CH.forEach((c, i) => {\n      if (i === 7) {\n        const k = lerp(2.2, 1, m), cx = lerp(800, chX(7), m), cy = lerp(520, chY(60030), m);\n        this.cd.set(i, { x: cx, w: 60 * k, o: c[0], h: c[1], l: c[2], c: c[3], y: (p) => cy + (chY(p) - chY(60030)) * k, op: eo(seg(t, 0.5, 0.9)) });\n      } else {\n        const a = 2.4 + (i < 7 ? i : i - 1) * 0.22, p = seg(t, a, a + 0.5);\n        this.cd.set(i, { x: chX(i), w: 60, o: c[0], h: c[1], l: c[2], c: lerp(c[0], c[3], eo(p)), y: chY, op: eo(seg(t, a, a + 0.25)) });\n      }\n    });\n    // The newest candle, still forming.\n    let hi = 60090, lo = 60090;\n    const t0 = 4.4;\n    for (let s = t0; s <= t + 1e-6; s += 0.1) { const v = chLive(s); hi = Math.max(hi, v); lo = Math.min(lo, v); }\n    const last = t < t0 ? 60090 : chLive(Math.floor(t * 4) / 4);\n    hi = Math.max(hi, last); lo = Math.min(lo, last);\n    this.cd.set(11, { x: chX(11), w: 60, o: 60090, h: hi, l: lo, c: last, y: chY, live: true, op: eo(seg(t, 4.2, 4.6)) });\n    const hl = seg(t, 2.6, 3.2);\n    this.mine.opacity = eo(hl) * (1 - ei(seg(t, 5.8, 6.3))); this.tm.opacity = this.mine.opacity;\n    const ax = seg(t, 6.4, 7.2);\n    this.ax.opacity = eo(ax); this.axt.opacity = eo(seg(t, 8.0, 8.4)); this.time.opacity = eo(seg(t, 6.8, 7.2));\n    this.lns.forEach((s, i) => { s.opacity = eo(seg(t, 10.8 + i * 0.25, 11.1 + i * 0.25)) * 0.8; });\n    const f = seg(t, 15.0, 15.5);\n    this.fm.opacity = eo(f) * (0.75 + 0.25 * Math.sin(t * 5));\n    this.tutor.render(t);\n  },\n});\n","scene-doji.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst DJ_X = 560, djY = (p) => 750 - (p - 59880) / 260 * 360;\nkit.scene('doji', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'dj-c', 1);\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"dj-grid\">' + this.gridHtml() + '</g>' + this.cd.html + '</svg>' +\n      '<p class=\"tag dj-o\" style=\"left:' + (DJ_X - 82) + 'px;transform:translateX(-100%)\">Open 60,000</p>' +\n      '<p class=\"tag dj-cl\" style=\"left:' + (DJ_X + 82) + 'px\">Close <span class=\"dj-cv\"></span></p>' +\n      '<p class=\"tag dj-h\" style=\"left:' + (DJ_X + 30) + 'px\">High <span class=\"dj-hv\"></span></p>' +\n      '<p class=\"tag dj-l\" style=\"left:' + (DJ_X + 30) + 'px\">Low <span class=\"dj-lv\"></span></p>' +\n      '<div class=\"glass dj-m\" style=\"left:960px;top:330px;width:660px;padding:26px 36px\"><p class=\"fict\" style=\"margin:0 0 8px\">Body = close − open</p>' +\n      '<p class=\"mono\" style=\"margin:0;font-size:56px\"><span class=\"dj-bv\"></span> <span style=\"font-size:30px\">USDT</span></p></div>' +\n      '<div class=\"glass dj-d\" style=\"left:960px;top:480px;width:660px;padding:26px 36px;border-color:var(--main)\"><p class=\"def\" style=\"margin:0\">A <b>doji</b> has open and close almost equal. Buyers and sellers ended about even.</p></div>' +\n      '<p class=\"chip dj-w\" style=\"position:absolute;left:960px;top:712px;margin:0;font-size:28px;padding:14px 26px;border-color:var(--accent)\">It does not predict the next candle</p>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1500px\"><p class=\"kick dj-k\">A special case</p>' +\n      '<h2 class=\"line dj-t\">The doji: almost no body</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s);\n    this.k = q('.dj-k').style; this.t = q('.dj-t'); this.grid = q('.dj-grid').style;\n    this.o = q('.dj-o').style; this.c = q('.dj-cl').style; this.h = q('.dj-h').style; this.l = q('.dj-l').style;\n    this.cv = q('.dj-cv'); this.hv = q('.dj-hv'); this.lv = q('.dj-lv'); this.bv = q('.dj-bv');\n    this.m = q('.dj-m').style; this.d = q('.dj-d').style; this.w = q('.dj-w').style;\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'magnify' }, { t: 0.5, pose: 'present' }, { t: 4.8, pose: 'magnify' }, { t: 9.8, pose: 'explain' }, { t: 14.9, pose: 'calm' }],\n      says: [{ t0: 15.2, t1: 18.4, text: 'Just a tie.' }],\n    });\n  },\n  gridHtml() {\n    let g = '';\n    for (let p = 59900; p <= 60100; p += 50) g += '<line x1=\"250\" x2=\"820\" y1=\"' + djY(p).toFixed(1) + '\" y2=\"' + djY(p).toFixed(1) + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/><text x=\"236\" y=\"' + (djY(p) + 8).toFixed(1) + '\" text-anchor=\"end\" class=\"axis\">' + UI.fmt(p) + '</text>';\n    return g;\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.4, 1.0));\n    // The close slides down to 60,005 while the wicks stretch: a doji.\n    const f = eio(seg(t, 1.2, 4.4));\n    const c = Math.round(lerp(60080, 60005, f)), h = Math.round(lerp(60120, 60090, f)), l = Math.round(lerp(59940, 59910, f));\n    this.cd.set(0, { x: DJ_X, w: 120, o: 60000, h, l, c, y: djY, op: eo(seg(t, 0.4, 0.9)) });\n    const tg = eo(seg(t, 0.8, 1.3));\n    for (const [st, p] of [[this.o, 60000], [this.c, c], [this.h, h], [this.l, l]]) { st.opacity = tg; st.top = (djY(p) - 22).toFixed(1) + 'px'; }\n    this.h.top = (djY(h) - 66).toFixed(1) + 'px'; this.l.top = (djY(l) + 22).toFixed(1) + 'px';\n    UI.txt(this.cv, UI.fmt(c)); UI.txt(this.hv, UI.fmt(h)); UI.txt(this.lv, UI.fmt(l)); UI.txt(this.bv, String(c - 60000));\n    UI.rise(this.m, t, 1.0);\n    UI.rise(this.d, t, 9.9);\n    UI.rise(this.w, t, 15.0, { s: 0.9 });\n    this.tutor.render(t);\n  },\n});\n","scene-hook.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\nconst HK_X0 = 220, HK_X1 = 1100, HK_CX = 660;\nconst hkY = (p) => 720 - (p - 59920) / 220 * 380, hkX = (s) => HK_X0 + (HK_X1 - HK_X0) * s / 60;\nconst HK_MORE = [[60080, 60110, 60020, 60040], [60040, 60070, 59990, 60060], [60060, 60130, 60050, 60110], [60110, 60125, 60030, 60045]];\nconst HK_TAGS = [['High', 60120], ['Close', 60080], ['Open', 60000], ['Low', 59940]];\nkit.scene('hook', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'hk-c', 5);\n    let tags = '';\n    HK_TAGS.forEach((g) => { tags += '<p class=\"tag hk-tag\" style=\"left:' + (HK_CX + 56) + 'px;top:' + (hkY(g[1]) - 22).toFixed(1) + 'px\"><span style=\"color:color-mix(in srgb, var(--second) 60%, var(--ground))\">' + g[0] + '</span> ' + UI.fmt(g[1]) + '</p>'; });\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"hk-grid\">' + UI.grid(200, 1540, hkY, 59950, 60100, 50) +\n      '<text x=\"' + HK_X0 + '\" y=\"762\" class=\"axis hk-ax\">0 s</text><text x=\"' + hkX(30) + '\" y=\"762\" text-anchor=\"middle\" class=\"axis hk-ax\">30 s</text><text x=\"' + HK_X1 + '\" y=\"762\" text-anchor=\"end\" class=\"axis hk-ax\">60 s</text></g>' +\n      '<path class=\"hk-line\" fill=\"none\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>' + this.cd.html +\n      '<circle class=\"hk-dot\" r=\"9\" style=\"fill:var(--second)\"/></svg>' +\n      '<p class=\"fict hk-f\" style=\"position:absolute;left:220px;top:318px;margin:0\">BTC/USDT · one minute · fictional</p>' + tags +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:1400px\"><p class=\"kick hk-k\">One minute of price</p>' +\n      '<h2 class=\"line hk-t\">From a line to a candle</h2></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.hk-k').style; this.t = q('.hk-t'); this.grid = q('.hk-grid').style; this.f = q('.hk-f').style;\n    this.line = q('.hk-line'); this.dot = q('.hk-dot'); this.tags = all('.hk-tag').map((e) => e.style); this.ax = all('.hk-ax').map((e) => e.style);\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'present' }, { t: 0.6, pose: 'point', flip: true }, { t: 5.6, pose: 'magnify' }, { t: 10.4, pose: 'idea' }, { t: 15.6, pose: 'present' }],\n      says: [{ t0: 10.8, t1: 14.6, text: 'Just four prices!' }],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    this.grid.opacity = eo(seg(t, 0.4, 1.0));\n    this.f.opacity = 0.9 * eo(seg(t, 0.5, 1.0));\n    const M = UI.MIN, draw = seg(t, 0.8, 5.0), sq = eio(seg(t, 6.0, 8.6));\n    const end = Math.round(draw * 120);\n    let d = '';\n    for (let i = 0; i <= end; i++) d += (i ? 'L' : 'M') + (HK_CX + (hkX(i / 2) - HK_CX) * (1 - sq)).toFixed(1) + ' ' + hkY(M.px[i]).toFixed(1);\n    this.line.setAttribute('d', d || 'M0 0');\n    this.line.style.stroke = 'color-mix(in srgb, var(--up) ' + (sq * 100).toFixed(0) + '%, var(--main))';\n    this.line.style.opacity = t < 0.8 ? 0 : 1 - eo(seg(t, 8.4, 9.2));\n    this.dot.setAttribute('cx', (HK_CX + (hkX(end / 2) - HK_CX) * (1 - sq)).toFixed(1)); this.dot.setAttribute('cy', hkY(M.px[end]).toFixed(1));\n    this.dot.style.opacity = (t > 0.8 ? 1 : 0) * (1 - eo(seg(t, 5.6, 6.2)));\n    for (const a of this.ax) a.opacity = 1 - eo(seg(t, 6.0, 6.6));\n    // The candle appears as the line collapses into its wick.\n    const cb = eo(seg(t, 7.8, 9.2));\n    this.cd.set(0, { x: HK_CX, w: lerp(8, 70, cb), o: 60000, h: 60120, l: 59940, c: lerp(60000, 60080, cb), y: hkY, op: eo(seg(t, 7.4, 8.4)) });\n    this.tags.forEach((s, i) => {\n      const p = seg(t, 10.6 + i * 0.5, 11.1 + i * 0.5);\n      s.opacity = eo(p) * (1 - ei(seg(t, 15.0, 15.5)));\n      s.transform = 'translateX(' + lerp(20, 0, eo(p)).toFixed(1) + 'px)';\n    });\n    HK_MORE.forEach((c, i) => {\n      const p = seg(t, 15.6 + i * 0.45, 16.2 + i * 0.45);\n      this.cd.set(i + 1, { x: HK_CX + 130 * (i + 1), w: 70, o: c[0], h: c[1], l: c[2], c: lerp(c[0], c[3], eo(p)), y: hkY, op: eo(seg(t, 15.6 + i * 0.45, 15.9 + i * 0.45)) });\n    });\n    this.tutor.render(t);\n  },\n});\n","scene-live.js":"const { seg, eo, ei, eob, eio, lerp, TextFx } = kit;\n// The live-forming 1-minute candle. The minute (UI.MIN) plays from LV_A to LV_B, 2.5x faster than real time.\nconst LV_A = 3.0, LV_B = 27.0, LV_X0 = 280, LV_X1 = 640, LV_CX = 770;\nconst lvY = (p) => 720 - (p - 59900) / 260 * 390, lvX = (s) => LV_X0 + (LV_X1 - LV_X0) * s / 60;\nconst LV_TAGS = [['High', 60120, 33.2], ['Close', 60080, 27.6], ['Open', 60000, 33.8], ['Low', 59940, 34.4]];\nkit.scene('live', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'lv-c', 1);\n    let grid = '';\n    for (let p = 59950; p <= 60150; p += 50) grid += '<line x1=\"260\" x2=\"900\" y1=\"' + lvY(p).toFixed(1) + '\" y2=\"' + lvY(p).toFixed(1) + '\" style=\"stroke:color-mix(in srgb, var(--second) 9%, transparent);stroke-width:1.5\"/><text x=\"240\" y=\"' + (lvY(p) + 8).toFixed(1) + '\" text-anchor=\"end\" class=\"axis\">' + UI.fmt(p) + '</text>';\n    let tags = '';\n    LV_TAGS.forEach((g) => { tags += '<p class=\"tag lv-tag\" style=\"left:' + (LV_CX + 74) + 'px;top:' + (lvY(g[1]) - 22).toFixed(1) + 'px\"><span style=\"color:color-mix(in srgb, var(--second) 60%, var(--ground))\">' + g[0] + '</span> ' + UI.fmt(g[1]) + '</p>'; });\n    const row = (cls, label) => '<div class=\"row ' + cls + '\" style=\"position:relative;padding:14px 16px;margin:0 -16px;border-radius:14px;border-bottom:0\"><span class=\"' + cls + '-l\">' + label + '</span>' +\n      '<span class=\"' + cls + '-b\" style=\"position:absolute;left:170px;top:22px;padding:4px 12px;border-radius:999px;font-size:20px;font-weight:700;color:var(--ground);opacity:0\"></span><span class=\"mono ' + cls + '-v\"></span></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\"><g class=\"lv-grid\">' + grid +\n      '<text x=\"' + LV_X0 + '\" y=\"758\" class=\"axis lv-sx\">0 s</text><text x=\"' + LV_X1 + '\" y=\"758\" text-anchor=\"end\" class=\"axis lv-sx\">60 s</text></g>' +\n      '<line class=\"lv-hi\" x1=\"' + LV_X0 + '\" stroke-width=\"2\" stroke-dasharray=\"6 8\" style=\"stroke:color-mix(in srgb, var(--second) 40%, transparent)\"/>' +\n      '<line class=\"lv-lo\" x1=\"' + LV_X0 + '\" stroke-width=\"2\" stroke-dasharray=\"6 8\" style=\"stroke:color-mix(in srgb, var(--second) 40%, transparent)\"/>' +\n      '<line class=\"lv-open\" x1=\"' + LV_X0 + '\" x2=\"' + (LV_CX + 70) + '\" y1=\"' + lvY(60000) + '\" y2=\"' + lvY(60000) + '\" stroke-width=\"2\" style=\"stroke:color-mix(in srgb, var(--main) 55%, transparent)\"/>' +\n      '<path class=\"lv-path\" fill=\"none\" stroke-width=\"4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" style=\"stroke:var(--main)\"/>' +\n      '<line class=\"lv-last\" stroke-width=\"2\" stroke-dasharray=\"3 6\"/>' + this.cd.html +\n      '<circle class=\"lv-dot\" r=\"9\" style=\"fill:var(--second)\"/></svg>' +\n      '<p class=\"tag lv-pt\" style=\"left:' + (LV_CX + 74) + 'px;color:var(--ground);border:0;font-weight:500\"></p>' + tags +\n      '<div class=\"glass lv-panel\" style=\"left:1080px;top:200px;width:540px;padding:24px 36px 14px\">' +\n      '<div style=\"display:flex;align-items:center;justify-content:space-between\"><p class=\"fict\" style=\"margin:0\">BTC/USDT · 1m candle</p><span class=\"lv-st\" style=\"padding:6px 14px;border-radius:999px;font-size:22px;font-weight:700\"></span></div>' +\n      '<div style=\"display:flex;align-items:baseline;gap:18px;margin:16px 0 8px\"><span style=\"font-size:26px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">Time</span><span class=\"mono lv-clk\" style=\"font-size:40px\"></span><span class=\"mono\" style=\"font-size:26px;color:color-mix(in srgb, var(--second) 50%, var(--ground))\">/ 1:00 0.4, 16.0 + i * 0.4)) * (1 - ei(seg(t, 20.0, 20.6))); l.setAttribute('x2', lerp(280, 1040, eio(seg(t, 15.4 + i * 0.4, 16.4 + i * 0.4))).toFixed(1)); });\n    UI.rise(this.set, t, 20.6, { s: 0.9 });\n    this.set.transform += ' translateX(-100%)';\n    this.tutor.render(t);\n  },\n});\n","scene-window.js":"const { seg, eo, ei, eob, eio, lerp, clamp01, TextFx } = kit;\nconst WN_DEFS = [['Open', 'the first price in the window', 6.0], ['High', 'the highest price in the window', 9.0], ['Low', 'the lowest price in the window', 9.9], ['Close', 'the last price in the window', 7.6]];\n// A fictional day of temperature, hour 6 to 18.\nconst WN_TK = [[6, 24], [7.5, 22], [10, 26], [14, 33], [16, 31], [18, 29]];\nconst wnTemp = (hr) => { let j = 1; while (j < WN_TK.length - 1 && WN_TK[j][0] < hr) j++; const a = WN_TK[j - 1], b = WN_TK[j], f = clamp01((hr - a[0]) / (b[0] - a[0])); return a[1] + (b[1] - a[1]) * (0.5 - 0.5 * Math.cos(Math.PI * f)); };\nconst wnTY = (c) => 650 - (c - 20) / 15 * 330, wnPY = (p) => 640 - (p - 59920) / 220 * 300;\nconst WN_A = 12.4, WN_B = 17.2;\nkit.scene('window', {\n  init(kit) {\n    this.chrome = UI.chrome(kit);\n    this.cd = UI.cdl(kit, 'wn-c', 2);\n    let rows = '';\n    WN_DEFS.forEach((d) => {\n      rows += '<div class=\"wn-r\" style=\"display:flex;align-items:center;gap:22px\"><span class=\"chip\" style=\"width:130px;justify-content:center;font-size:30px;padding:12px 0\">' + d[0] + '</span><span style=\"font-size:32px;font-weight:600\">' + d[1] + '</span></div>';\n    });\n    let ticks = '';\n    for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, r2 = i % 5 ? 132 : 122; ticks += '<line x1=\"' + (Math.sin(a) * 140).toFixed(1) + '\" y1=\"' + (-Math.cos(a) * 140).toFixed(1) + '\" x2=\"' + (Math.sin(a) * r2).toFixed(1) + '\" y2=\"' + (-Math.cos(a) * r2).toFixed(1) + '\"/>'; }\n    const chip = (cls, label, y) => '<div class=\"' + cls + '\" style=\"position:absolute;left:1150px;top:' + y + 'px;width:250px;display:flex;justify-content:space-between;align-items:baseline;padding:10px 18px;border-radius:14px;background:color-mix(in srgb, var(--ground) 84%, var(--main))\"><span style=\"font-size:24px;color:color-mix(in srgb, var(--second) 70%, var(--ground))\">' + label + '</span><span class=\"mono ' + cls + '-v\" style=\"font-size:34px\"></span></div>';\n    kit.stage.append(kit.h('<div class=\"ground\">' +\n      '<div class=\"glass wn-card\" style=\"left:980px;top:220px;width:660px;height:560px\"></div>' +\n      '<svg class=\"art\" viewBox=\"0 0 1920 1080\">' +\n      '<g class=\"wn-clock\"><g transform=\"translate(1170 480)\"><circle r=\"150\" stroke-width=\"3\" style=\"fill:color-mix(in srgb, var(--main) 6%, transparent);stroke:color-mix(in srgb, var(--main) 40%, transparent)\"/>' +\n      '<path class=\"wn-sweep\" style=\"fill:color-mix(in srgb, var(--main) 22%, transparent)\"/>' +\n      '<g stroke-width=\"3\" style=\"stroke:color-mix(in srgb, var(--second) 40%, transparent)\">' + ticks + '</g>' +\n      '<line class=\"wn-hand\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-118\" stroke-width=\"6\" stroke-linecap=\"round\" style=\"stroke:var(--main)\"/><circle r=\"10\" style=\"fill:var(--main)\"/></g>' +\n      '<text x=\"1170\" y=\"690\" text-anchor=\"middle\" style=\"fill:var(--second);font-size:30px;font-weight:700\">One window: 1 minute</text>' +\n      '<text class=\"wn-sec mono\" x=\"1170\" y=\"300\" text-anchor=\"middle\" style=\"fill:var(--main);font-size:30px\"></text></g>' +\n      '<g class=\"wn-therm\"><rect x=\"1036\" y=\"300\" width=\"44\" height=\"370\" rx=\"22\" stroke-width=\"3\" style=\"fill:color-mix(in srgb, var(--ground) 70%, var(--second));stroke:color-mix(in srgb, var(--second) 40%, transparent)\"/>' +\n      '<rect class=\"wn-merc\" x=\"1048\" width=\"20\" rx=\"10\" style=\"fill:var(--accent)\"/>' +\n      '<text x=\"1058\" y=\"712\" text-anchor=\"middle\" class=\"mono wn-hr\" style=\"fill:var(--second);font-size:26px\"></text>' +\n      '<text x=\"1518\" y=\"292\" text-anchor=\"middle\" class=\"kick\" style=\"fill:var(--main);font-size:20px\">Day candle</text></g>' +\n      this.cd.html + '</svg>' +\n      chip('wn-o', 'First', 300) + chip('wn-h', 'Hottest', 374) + chip('wn-l', 'Coldest', 448) + chip('wn-cl', 'Last', 522) +\n      '<p class=\"fict wn-tf\" style=\"position:absolute;left:1150px;top:610px;width:300px;margin:0;line-height:1.5\">One day · 6 am to 6 pm · example</p>' +\n      '<div class=\"words\" style=\"left:140px;top:170px;width:800px\"><p class=\"kick wn-k\">Four prices</p>' +\n      '<h2 class=\"line wn-t\">A candle sums up a time window</h2>' +\n      '<div style=\"display:flex;flex-direction:column;gap:18px;margin-top:22px\">' + rows + '</div></div>' +\n      '</div>'));\n    const q = (s) => kit.stage.querySelector(s), all = (s) => [...kit.stage.querySelectorAll(s)];\n    this.k = q('.wn-k').style; this.t = q('.wn-t'); this.card = q('.wn-card').style;\n    this.rows = all('.wn-r').map((e) => e.style);\n    this.clock = q('.wn-clock').style; this.hand = q('.wn-hand'); this.sweep = q('.wn-sweep'); this.sec = q('.wn-sec');\n    this.therm = q('.wn-therm').style; this.merc = q('.wn-merc'); this.hr = q('.wn-hr'); this.tf = q('.wn-tf').style;\n    this.chips = ['.wn-o', '.wn-h', '.wn-l', '.wn-cl'].map((s) => ({ st: q(s).style, v: q(s + '-v') }));\n    const C = UI.CORNER;\n    this.tutor = UI.tutor(kit, {\n      keys: [{ t: 0, x: C.x, y: C.y, s: C.s }],\n      poses: [{ t: 0, pose: 'idea' }, { t: 0.6, pose: 'explain' }, { t: 6.0, pose: 'checklist' }, { t: 11.8, pose: 'think' }, { t: 17.4, pose: 'explain' }],\n      says: [],\n    });\n  },\n  render(t) {\n    this.chrome(t);\n    this.k.opacity = eo(seg(t, 0, 0.5));\n    TextFx.fadeFromRight(this.t, t, 0.1);\n    UI.rise(this.card, t, 0.6);\n    this.rows.forEach((s, i) => {\n      const a = WN_DEFS[i][2], p = seg(t, a, a + 0.5);\n      s.opacity = eo(p); s.transform = 'translateX(' + lerp(26, 0, eo(p)).toFixed(1) + 'px)';\n    });\n    // Part 1: a 1-minute clock sweeps while the fictional minute builds a candle beside it.\n    const out1 = 1 - ei(seg(t, 11.0, 11.6));\n    this.clock.opacity = eo(seg(t, 0.8, 1.4)) * out1;\n    const f = seg(t, 1.4, 5.6), a = f * Math.PI * 2;\n    this.hand.setAttribute('transform', 'rotate(' + (f * 360).toFixed(1) + ')');\n    const large = f > 0.5 ? 1 : 0;\n    this.sweep.setAttribute('d', f <= 0 ? 'M0 0' : f >= 1 ? 'M0 -150 A150 150 0 1 1 -0.01 -150 Z' : 'M0 0 L0 -150 A150 150 0 ' + large + ' 1 ' + (Math.sin(a) * 150).toFixed(1) + ' ' + (-Math.cos(a) * 150).toFixed(1) + ' Z');\n    UI.txt(this.sec, Math.round(f * 60) + ' s');\n    const M = UI.MIN, i = M.at(f * 60);\n    this.cd.set(0, { x: 1450, w: 64, o: 60000, h: M.hi[i], l: M.lo[i], c: M.px[i], y: wnPY, live: f < 1, op: eo(seg(t, 1.2, 1.6)) * out1 });\n    // Part 2: a fictional day of temperature makes the same four numbers.\n    const on2 = eo(seg(t, 11.6, 12.2));\n    this.therm.opacity = on2; this.tf.opacity = 0.9 * on2;\n    const d = seg(t, WN_A, WN_B), hr = 6 + 12 * d;\n    let hi = 24, lo = 24;\n    for (let h = 6; h <= hr + 1e-6; h += 0.05) { const v = wnTemp(h); hi = Math.max(hi, v); lo = Math.min(lo, v); }\n    const cur = wnTemp(hr);\n    const my = wnTY(cur);\n    this.merc.setAttribute('y', my.toFixed(1)); this.merc.setAttribute('height', (658 - my).toFixed(1));\n    const hh = Math.floor(hr), mm = Math.floor((hr - hh) * 60 / 15) * 15;\n    UI.txt(this.hr, (hh > 12 ? hh - 12 : hh) + ':' + String(mm).padStart(2, '0') + (hh >= 12 ? ' pm' : ' am'));\n    const vals = [24, Math.round(hi), Math.round(lo), Math.round(cur)];\n    this.chips.forEach((c, k) => {\n      c.st.opacity = on2 * (k === 0 ? 1 : eo(seg(t, WN_A + 0.2, WN_A + 0.6)));\n      UI.txt(c.v, vals[k] + '°C');\n      c.v.style.color = k === 3 && d >= 1 ? 'var(--up)' : 'var(--second)';\n    });\n    this.cd.set(1, { x: 1518, w: 64, o: 24, h: hi, l: lo, c: cur, y: wnTY, live: d < 1, op: on2 * eo(seg(t, WN_A, WN_A + 0.4)) });\n    this.tutor.render(t);\n  },\n});\n","scenes.json":"{\n  \"v\": 1,\n  \"stage\": \"final\",\n  \"look\": \"XORA site look, same as the V00 welcome film: deep void ground, frosted glass panels with thin cyan-to-violet edges, fictional market lines drawing in, calm eased motion, the brain tutor guiding from the bottom-right corner\",\n  \"palettes\": [\n    [\n      \"#02030a\",\n      \"#3ecbff\",\n      \"#eef1f7\",\n      \"#a855f7\"\n    ]\n  ],\n  \"theirs\": 1,\n  \"width\": 1920,\n  \"height\": 1080,\n  \"fps\": 60,\n  \"background\": \"#02030a\",\n  \"fonts\": {\n    \"display\": {\n      \"family\": \"Outfit\",\n      \"or\": \"plus-jakarta-sans\",\n      \"weights\": [\n        400,\n        600,\n        700\n      ]\n    },\n    \"sans\": \"manrope\",\n    \"mono\": \"dm-mono\"\n  },\n  \"scenes\": [\n    {\n      \"id\": \"title\",\n      \"name\": \"Lesson fourteen\",\n      \"dur\": 10,\n      \"desc\": \"Title card: Phase 4, lesson T14, Candlesticks: open, high, low, close; a glowing candle with its four price ticks; the tutor walks in.\"\n    },\n    {\n      \"id\": \"hook\",\n      \"name\": \"From line to candle\",\n      \"dur\": 19,\n      \"desc\": \"One fictional minute of BTC drawn as a line squeezes into a single candle; its four prices tag on; more candles line up into a chart.\"\n    },\n    {\n      \"id\": \"window\",\n      \"name\": \"Four prices\",\n      \"dur\": 23,\n      \"desc\": \"A candle sums up one time window: open, high, low, close defined; a day of temperature readings (24, 22, 33, 29 C) forms the same shape.\"\n    },\n    {\n      \"id\": \"live\",\n      \"name\": \"Watch one form\",\n      \"dur\": 39,\n      \"desc\": \"A live 1-minute fictional candle: open 60,000, the price dips (red body) to a low of 59,940, climbs (green) to a high of 60,120, and closes at 60,080.\"\n    },\n    {\n      \"id\": \"anatomy\",\n      \"name\": \"Body and wicks\",\n      \"dur\": 24,\n      \"desc\": \"Body and wicks defined on the finished candle: body 80, upper wick 40, lower wick
